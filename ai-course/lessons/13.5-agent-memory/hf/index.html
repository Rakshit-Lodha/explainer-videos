function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

function block(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||26)+'px',borderRadius:'8px'});if(o.bg)d.style.background=o.bg;return d}

/* ============ S1: a hundred steps ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const ctr=txt(S,'',480,260,{fs:64,mono:true,color:C.yellow});const lab=txt(S,'steps taken',480,340,{fs:30,it:true,color:C.dim});
  show([ctr,lab],at(sid,.02),.4);countTo(ctr,cue(sid,'hundred'),2.2,1,100,v=>'step '+Math.round(v));ctr.innerHTML='step 1';
  const col=[];for(let i=0;i<16;i++){const b=block(S,1100,880-i*42,560,34,'',i%4===3?C.green:C.dim);col.push(b)}
  col.forEach((b,i)=>show(b,cue(sid,'adds')+.1*i,.2,{y:-8}));
  const ct=txt(S,'transcript',1380,950,{fs:28,it:true,color:C.dim});show(ct,cue(sid,'adds'),.4);
  const lim=ln(svg,1060,400,1700,400,C.red,4,{dash:'14 10'});fadeIn(lim,cue(sid,'outgrows'),.4);
  const ll=txt(S,'context window',1780,400,{fs:26,color:C.red});show(ll,cue(sid,'outgrows'),.4);
  const p1=box(S,480,560,600,90,'long contexts used less reliably',C.yellow,{fs:32}),p2=box(S,480,700,600,90,'every step resends the whole transcript',C.red,{fs:30});
  show(p1,cue(sid,'reliably'),.5);show(p2,cue(sid,'expensive'),.5);
  sceneInOut(sid);
})();

/* ============ S2: cost grows with the square ============ */
(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);const x0=220,y0=880,n=20,bw=34;
  const hd=txt(S,'tokens sent at each step',560,180,{fs:32,it:true,color:C.ink});show(hd,at(sid,.02),.4);
  const bars=[];for(let i=1;i<=n;i++){const h=i*30;const b=el(S,'abs hid','',{left:(x0+(i-1)*(bw+4))+'px',top:(y0-h)+'px',width:bw+'px',height:h+'px',background:i===n?C.yellow:C.blue,borderRadius:'4px 4px 0 0',transformOrigin:'50% 100%'});bars.push(b)}
  bars.forEach((b,i)=>{tl.set(b,{scaleY:0},cue(sid,'grows'));tl.to(b,{autoAlpha:1,duration:.15},cue(sid,'grows')+.07*i);tl.to(b,{scaleY:1,duration:.3,ease:'power2.out'},cue(sid,'grows')+.07*i)});
  const ax=ln(svg,x0-10,y0,x0+n*(bw+4)+10,y0,C.axis,3);fadeIn(ax,at(sid,.02),.4);
  const rl=txt(S,'the last step rereads all the earlier ones',560,960,{fs:28,it:true,color:C.yellow});show(rl,cue(sid,'rereads'),.4);
  const eq=eqn(S,'1+2+\\dots+n=\\dfrac{n(n+1)}{2}',1420,290,52);show(eq,cue(sid,'total'),.6);
  const sq=txt(S,'total grows with the square of the steps',1420,470,{fs:30,it:true,color:C.ink});show(sq,cue(sid,'square'),.5);
  const ca=box(S,1420,680,620,150,'<span>prompt caching<br><span style="font-size:26px;color:#7f8b99">cheaper to reread a stable prefix,<br>but the window is no bigger</span></span>',C.teal,{fs:34});show(ca,cue(sid,'caching'),.5);
  sceneInOut(sid);
})();

/* ============ S3: compaction ============ */
(function(){const S=$('S3');const sid='s3';
  const items=[['system instructions',C.yellow],['task',C.yellow],['step 1 output',C.dim],['step 2 output',C.dim],['step 3 output',C.dim],['step 4 output',C.dim],['step 5 output',C.dim],['step 6 output',C.dim],['step 7',C.green],['step 8',C.green]];
  const B=items.map(([t,c],i)=>{const b=block(S,240,170+i*72,520,60,t,c,{fs:26});show(b,at(sid,.02)+.05*i,.3,{y:-8});return b});
  const th=txt(S,'over the threshold',500,920,{fs:28,it:true,color:C.red});show(th,cue(sid,'threshold'),.4);
  const svg=layerSvg(S);
  const mid=B.slice(2,8);
  tl.to(mid,{x:760,opacity:.35,duration:1,ease:'power2.inOut'},cue(sid,'summarise'));
  const sm=block(S,1000,500,560,120,'<span>SUMMARY<br><span style="font-size:22px;color:#7f8b99">decisions, open questions, files, errors</span></span>',C.pink,{fs:30});
  show(sm,cue(sid,'replaces'),.5);
  tl.to(mid,{autoAlpha:0,duration:.4},cue(sid,'replaces')+.3);
  const r1=block(S,1000,180,560,60,'system instructions',C.yellow),r2=block(S,1000,260,560,60,'task',C.yellow),r3=block(S,1000,660,560,60,'step 7',C.green),r4=block(S,1000,740,560,60,'step 8',C.green);
  show([r1,r2],cue(sid,'keeping'),.4);show([r3,r4],cue(sid,'recent'),.4);
  const kw=txt(S,'kept word for word',1280,840,{fs:28,it:true,color:C.green});show(kw,cue(sid,'word'),.4);
  const nb=el(S,'cap','like a lab notebook: read the summary of what is established',{top:'950px',fontSize:'32px',fontStyle:'italic',color:C.ink});show(nb,cue(sid,'notebook'),.5);
  sceneInOut(sid);
})();

/* ============ S4: what to keep, and save before you forget ============ */
(function(){const S=$('S4');const sid='s4';
  const kh=txt(S,'keep',520,200,{fs:40,color:C.green}),dh=txt(S,'drop',1400,200,{fs:40,color:C.red});show([kh,dh],at(sid,.02),.4);
  [['decisions taken','decisions'],['open questions','questions'],['file names','file'],['errors already seen','errors']].forEach(([t,w],i)=>{const c=box(S,520,320+i*110,520,84,t,C.green,{fs:32});show(c,cue(sid,w),.4)});
  const dr=box(S,1400,320,560,120,'<span>raw tool output<br><span style="font-size:24px;color:#7f8b99">already digested</span></span>',C.red,{fs:32});show(dr,cue(sid,'raw'),.4);
  const svg=layerSvg(S);
  const disk=box(S,1400,700,460,130,'<span>💾&nbsp; full outputs on disk<br><span style="font-size:24px;color:#7f8b99">fetch an exact detail later</span></span>',C.teal,{fs:32});
  const a=pxArrow(svg,C.teal,4,1400,390,1400,620);growPx(a,cue(sid,'disk'),.5);show(disk,cue(sid,'disk'),.5);
  const lo=txt(S,'a summary loses detail permanently',1660,520,{fs:26,it:true,color:C.dim});show(lo,cue(sid,'permanently'),.4);
  sceneInOut(sid);
})();

/* ============ S5: memory outside the context ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const ag=box(S,400,480,300,120,'agent',C.blue,{fs:42});show(ag,at(sid,.02),.4);
  const nf=el(S,'abs hid','',{left:'860px',top:'220px',width:'660px',height:'520px',border:'3px solid #f5cf4a',borderRadius:'16px',background:'#141a22'});show(nf,cue(sid,'notes'),.5);
  const nt=txt(S,'notes.md',1190,190,{fs:30,mono:true,color:C.yellow});show(nt,cue(sid,'notes'),.4);
  const N=['bug is in parse_date (utils/dates.py)','run tests: pytest -q','user wants ISO dates','tz library bump did not help','API layer ruled out'];
  const lines=N.map((t,i)=>{const d=txt(S,'• '+t,900,280+i*80,{fs:26,mono:true,color:C.ink});d.style.translate='0 -50%';show(d,cue(sid,'write')+.15*i,.3);return d});
  const w1=pxArrow(svg,C.yellow,4,560,450,850,380,'<span style="font-size:26px;font-style:italic">write</span>',-40,-30,S),w2=pxArrow(svg,C.green,4,850,560,560,520,'<span style="font-size:26px;font-style:italic">read back</span>',40,40,S);
  growPx(w1,cue(sid,'write'),.5);growPx(w2,cue(sid,'read'),.5);
  const sv=txt(S,'survives compaction, and separate sessions',1190,790,{fs:28,it:true,color:C.dim});show(sv,cue(sid,'survives'),.4);
  const q=box(S,430,760,660,90,'<span class="mono" style="font-size:26px">query: "which file has the bug?"</span>',C.teal,{fs:26});show(q,cue(sid,'searched'),.5);
  const h=el(S,'hl','',{left:'880px',top:'250px',width:'620px',height:'60px',borderColor:C.teal});fadeIn(h,cue(sid,'relevant'),.4);
  tl.to(lines.slice(1),{opacity:.3,duration:.4},cue(sid,'relevant'));
  const rt=el(S,'cap','retrieval, as in hybrid search',{top:'930px',fontSize:'32px',fontStyle:'italic',color:C.teal});show(rt,cue(sid,'retrieval'),.4);
  sceneInOut(sid);
})();

/* ============ S6: subagents ============ */
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);
  const main=box(S,420,450,420,240,'<span>main agent<br><span style="font-size:24px;color:#7f8b99">focused context</span></span>',C.blue,{fs:38});show(main,at(sid,.02),.4);
  const task=box(S,960,300,520,90,'<span class="mono" style="font-size:24px">find every caller of parse_date</span>',C.yellow,{fs:24});
  const a1=pxArrow(svg,C.yellow,4,640,380,740,320);growPx(a1,cue(sid,'subtask'),.4);show(task,cue(sid,'subtask'),.4);
  const sub=el(S,'abs hid','',{left:'1240px',top:'360px',width:'560px',height:'420px',border:'3px solid #5cd0b3',borderRadius:'16px'});show(sub,cue(sid,'subagent'),.5);
  const sl=txt(S,'subagent: fresh, empty context',1520,330,{fs:28,color:C.teal});show(sl,cue(sid,'fresh'),.4);
  const rnd=seedRand(3);const files=[];for(let i=0;i<30;i++){files.push(cellAt(S,1300+(i%6)*88,420+Math.floor(i/6)*70,70,48,'.py',C.dim,{fs:20}))}
  files.forEach((f,i)=>show(f,cue(sid,'messy')+.04*i,.2,{y:0}));
  const br=box(S,960,820,460,90,'<span>one-page brief: 4 callers</span>',C.green,{fs:30});
  const a2=pxArrow(svg,C.green,4,1240,720,1100,790);growPx(a2,cue(sid,'returns'),.4);show(br,cue(sid,'short'),.4);
  const a3=pxArrow(svg,C.green,4,820,820,640,600);growPx(a3,cue(sid,'short')+.3,.4);
  const mg=txt(S,'a brief, not the whole archive',420,700,{fs:26,it:true,color:C.dim});show(mg,cue(sid,'archive'),.4);
  sceneInOut(sid);
})();

/* ============ S7: quiet failures; did it improve? ============ */
(function(){const S=$('S7');const sid='s7';
  [['compaction',520],['external notes',960],['subagents',1400]].forEach(([t,x],i)=>{const c=box(S,x,300,360,90,t,C.blue,{fs:34});show(c,at(sid,.02)+.15*i,.4)});
  const tr=txt(S,'completeness traded for focus',960,420,{fs:32,it:true,color:C.ink});show(tr,cue(sid,'trade'),.4);
  const qf=box(S,960,560,720,90,'can fail quietly: a dropped fact, needed later',C.red,{fs:32});show(qf,cue(sid,'quietly'),.5);
  const q=el(S,'cap','did the system actually improve?',{top:'720px',fontSize:'56px',fontStyle:'italic',color:C.yellow});show(q,cue(sid,'improved'),.5);
  nextUp(S,sid,'evaluation',1,'13.6 &nbsp;evals: a test set you can trust');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
