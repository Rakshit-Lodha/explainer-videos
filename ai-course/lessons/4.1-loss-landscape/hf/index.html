.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}

.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}

  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
const DX=[1,2,3,4,5],DY=[2.6,3.9,5.1,6.8,7.6];
const mse=(w,b)=>DX.reduce((s,x,i)=>s+(DY[i]-w*x-b)**2,0)/DX.length;
const WBEST=DX.reduce((s,x,i)=>s+x*DY[i],0)/DX.reduce((s,x)=>s+x*x,0);
/* least squares with intercept */
const mx=DX.reduce((a,b)=>a+b)/5,my=DY.reduce((a,b)=>a+b)/5;
const W2=DX.reduce((s,x,i)=>s+(x-mx)*(DY[i]-my),0)/DX.reduce((s,x)=>s+(x-mx)**2,0),B2=my-W2*mx;
function dial(svg,cx,cy,r,label,parent,col){const g=svgEl('g',{},svg);
  svgEl('circle',{cx,cy,r,fill:'#161c25',stroke:col,'stroke-width':5},g);
  for(let k=0;k<12;k++){const a=k/12*2*Math.PI;svgEl('line',{x1:cx+Math.cos(a)*r*.82,y1:cy+Math.sin(a)*r*.82,x2:cx+Math.cos(a)*r*.95,y2:cy+Math.sin(a)*r*.95,stroke:C.dim,'stroke-width':3},g)}
  const ptr=svgEl('line',{x1:cx,y1:cy,x2:cx,y2:cy-r*.75,stroke:col,'stroke-width':8,'stroke-linecap':'round'},g);
  const t=lbl(parent,label,cx,cy+r+40,{fontSize:'44px',fontStyle:'italic',color:col});
  return {g,ptr,t,set:a=>ptr.setAttribute('transform',`rotate(${a} ${cx} ${cy})`)}}

/* ============ S1: dials and a loss ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const d1=dial(svg,420,420,130,'w',S,C.blue),d2=dial(svg,800,420,130,'b',S,C.green);
  [d1,d2].forEach(d=>{d.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn([d.g,d.t],cue(sid,'dials'),.5)});
  const pl=note(S,'parameters',500,640,400,{fontSize:'40px',color:C.dim,textAlign:'center'});show(pl,cue(sid,'parameters'),.5);
  const bg=svgEl('rect',{x:1180,y:300,width:120,height:400,rx:12,fill:'#1d2531',style:'opacity:0;visibility:hidden'},svg);
  const lv=svgEl('rect',{x:1180,width:120,rx:12,fill:C.pink},svg);
  const ll=lbl(S,'loss',1240,750,{fontSize:'44px',fontStyle:'italic',color:C.pink});
  const render=o=>{d1.set(o.a);d2.set(o.b);const L=Math.min(1,.06+((o.a-70)/160)**2+((o.b+40)/160)**2);lv.setAttribute('y',700-400*L);lv.setAttribute('height',400*L)};
  const st=state({a:-120,b:110},render);gsap.set(lv,{autoAlpha:0});
  fadeIn([bg,lv,ll],cue(sid,'loss'),.5);
  drive(st,cue(sid,'turning'),3.2,{a:70,b:-40},render,'power2.inOut');
  const ls=note(S,'how badly the model does on the data',1360,460,420,{fontSize:'38px',color:C.dim});show(ls,cue(sid,'badly'),.5);
  const land=el(S,'chip','picture the loss as a landscape',{left:'620px',top:'860px',borderColor:C.yellow,color:C.yellow});show(land,cue(sid,'landscape'),.6);
  sceneInOut(sid);
})();

/* ============ S2: one dial, one curve ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const A=axes(svg,{x:160,y:260,w:640,h:560,xmin:0,xmax:6,ymin:0,ymax:10,xticks:[1,2,3,4,5],yticks:[2,4,6,8,10]});
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);fadeIn(g,cue(sid,'single'),.5);
  const line=svgEl('line',{stroke:C.blue,'stroke-width':5},svg);
  const res=DX.map(()=>svgEl('line',{stroke:C.pink,'stroke-width':3},svg));
  const dots=DX.map((x,i)=>svgEl('circle',{cx:A.X(x),cy:A.Y(DY[i]),r:11,fill:C.ink,style:'opacity:0;visibility:hidden'},svg));
  tl.to(dots,{autoAlpha:1,duration:.2,stagger:.08},cue(sid,'points'));
  const eq=lbl(S,'',480,200,{fontSize:'44px',color:C.blue});eq.setAttribute('data-layout-allow-overlap','');
  const L=axes(svg,{x:1060,y:260,w:720,h:560,xmin:.8,xmax:2.6,ymin:0,ymax:11,xticks:[1,1.5,2,2.5],yaxis:false});
  const lt=[1,1.5,2,2.5].map(v=>lbl(S,`<span class="mono">${v}</span>`,L.X(v),L.Y(0)+38,{fontSize:'28px',color:C.dim}));
  const lx=lbl(S,tex('w',40),L.X(2.6)+30,L.Y(0),{});const ly=lbl(S,'mean squared error',L.X(1.7),220,{fontSize:'36px',fontStyle:'italic',color:C.yellow});
  const lg=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);lg.appendChild(L.g);
  const cv=svgEl('path',{d:fpath(L,w=>mse(w,0),.8,2.6),fill:'none',stroke:C.yellow,'stroke-width':5,style:'opacity:0;visibility:hidden'},svg);
  fadeIn([lg,lx].concat(lt),cue(sid,'mean')-.3,.5);show(ly,cue(sid,'mean'),.5);
  const mk=svgEl('circle',{r:14,fill:C.pink},svg);
  const render=o=>{const w=o.w;line.setAttribute('x1',A.X(0));line.setAttribute('y1',A.Y(0));line.setAttribute('x2',A.X(6));line.setAttribute('y2',A.Y(Math.min(12,6*w)));
    if(6*w>10){line.setAttribute('x2',A.X(10/w));line.setAttribute('y2',A.Y(10))}
    DX.forEach((x,i)=>{res[i].setAttribute('x1',A.X(x));res[i].setAttribute('x2',A.X(x));res[i].setAttribute('y1',A.Y(DY[i]));res[i].setAttribute('y2',A.Y(w*x))});
    mk.setAttribute('cx',L.X(w));mk.setAttribute('cy',L.Y(Math.min(11,mse(w,0))));eq.innerHTML=`y = <span class="mono">${w.toFixed(2)}</span> x`};
  const st=state({w:1},render);
  gsap.set([line,mk,eq].concat(res),{autoAlpha:0});
  fadeIn([line,eq],cue(sid,'line'),.5);fadeIn(res,cue(sid,'error')-.2,.4);
  // trace the curve as the dial turns
  fadeIn(cv,cue(sid,'curve')-.6,.8);fadeIn(mk,cue(sid,'curve')-.6,.4);
  drive(st,cue(sid,'curve')-.4,1.6,{w:2.5},render);
  drive(st,cue(sid,'turn'),2.2,{w:1.1},render);
  drive(st,cue(sid,'bottom')-1,1.8,{w:WBEST},render,'power2.out');
  const best=note(S,'best fit: the bottom of the curve',1180,880,600,{fontSize:'38px',color:C.pink});show(best,cue(sid,'bottom'),.5);
  sceneInOut(sid);
})();

/* ============ S3: two dials, a surface over a map ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  // oblique projection of the loss surface over (w, b)
  const wr=[.6,2],br=[-.5,3.5];const N=18;
  const P3=(w,b,z)=>{const u=(w-wr[0])/(wr[1]-wr[0]),v=(b-br[0])/(br[1]-br[0]);return [260+u*720+v*300, 880-v*240-z*20]};
  const surf=svgEl('g',{style:'opacity:0;visibility:hidden'},svg),flat=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  for(let i=0;i<=N;i++){const w=wr[0]+(wr[1]-wr[0])*i/N,b=br[0]+(br[1]-br[0])*i/N;let d1='',d2='',f1='',f2='';
    for(let k=0;k<=40;k++){const t=k/40;const bb=br[0]+(br[1]-br[0])*t,ww=wr[0]+(wr[1]-wr[0])*t;
      const a=P3(w,bb,mse(w,bb)),c=P3(ww,b,mse(ww,b)),fa=P3(w,bb,0),fc=P3(ww,b,0);
      d1+=(k?'L':'M')+a[0].toFixed(1)+','+a[1].toFixed(1);d2+=(k?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1);
      f1+=(k?'L':'M')+fa[0].toFixed(1)+','+fa[1].toFixed(1);f2+=(k?'L':'M')+fc[0].toFixed(1)+','+fc[1].toFixed(1)}
    svgEl('path',{d:d1,fill:'none',stroke:C.yellow,'stroke-width':1.6,opacity:.75},surf);svgEl('path',{d:d2,fill:'none',stroke:C.yellow,'stroke-width':1.6,opacity:.75},surf);
    svgEl('path',{d:f1,fill:'none',stroke:C.grid,'stroke-width':1.2,opacity:.6},flat);svgEl('path',{d:f2,fill:'none',stroke:C.grid,'stroke-width':1.2,opacity:.6},flat)}
  fadeIn(flat,cue(sid,'plane'),.6);fadeIn(surf,cue(sid,'surface'),.8);
  const wl=lbl(S,tex('w',44),P3(2,-.5,0)[0]+30,P3(2,-.5,0)[1]+20,{color:C.blue}),bl=lbl(S,tex('b',44),P3(.6,3.5,0)[0]-30,P3(.6,3.5,0)[1],{color:C.green});
  fadeIn([wl,bl],cue(sid,'plane'),.5);
  const map=note(S,'a flat map of settings',1360,250,520,{fontSize:'40px',color:C.dim});show(map,cue(sid,'map'),.5);
  // one point on the map is one model
  const pin=svgEl('line',{stroke:C.pink,'stroke-width':4,'stroke-dasharray':'8 6'},svg),pt=svgEl('circle',{r:10,fill:C.pink},svg),top=svgEl('circle',{r:12,fill:C.pink},svg);
  const ins=axes(svg,{x:1380,y:520,w:380,h:300,xmin:0,xmax:6,ymin:0,ymax:10,xticks:[],yticks:[]});
  const iline=svgEl('line',{stroke:C.blue,'stroke-width':4},svg);
  const idots=DX.map((x,i)=>svgEl('circle',{cx:ins.X(x),cy:ins.Y(DY[i]),r:7,fill:C.ink},svg));
  const ig=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);[ins.g,iline].concat(idots).forEach(e=>ig.appendChild(e));
  const render=o=>{const f=P3(o.w,o.b,0),z=P3(o.w,o.b,mse(o.w,o.b));pt.setAttribute('cx',f[0]);pt.setAttribute('cy',f[1]);top.setAttribute('cx',z[0]);top.setAttribute('cy',z[1]);
    pin.setAttribute('x1',f[0]);pin.setAttribute('y1',f[1]);pin.setAttribute('x2',z[0]);pin.setAttribute('y2',z[1]);
    iline.setAttribute('x1',ins.X(0));iline.setAttribute('y1',ins.Y(o.b));iline.setAttribute('x2',ins.X(6));iline.setAttribute('y2',ins.Y(o.b+6*o.w))};
  const st=state({w:.8,b:3},render);gsap.set([pin,pt,top],{autoAlpha:0});
  fadeIn([pin,pt,top,ig],cue(sid,'complete')-.4,.5);
  const one=note(S,'one point = one complete model',1360,330,520,{fontSize:'40px',color:C.pink});show(one,cue(sid,'complete'),.5);
  const ht=note(S,'height = how badly it fits',1360,420,520,{fontSize:'40px',color:C.yellow});show(ht,cue(sid,'height'),.5);
  drive(st,cue(sid,'height'),2.4,{w:1.75,b:0},render);
  sceneInOut(sid);
})();

/* ============ S4: a contour map ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const A=axes(svg,{x:300,y:200,w:900,h:700,xmin:.6,xmax:2,ymin:-.5,ymax:3.5,xticks:[],yticks:[],xAt:-.5,yAt:.6});
  const g0=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g0.appendChild(A.g);fadeIn(g0,at(sid,.01),.5);
  const wl=lbl(S,tex('w',44),A.X(2)+30,A.Y(-.5),{color:C.blue}),bl=lbl(S,tex('b',44),A.X(.6),A.Y(3.5)-30,{color:C.green});fadeIn([wl,bl],at(sid,.01),.5);
  // quadratic form: mse(w,b) = Lmin + [dw db] H [dw db]^T, H = [[mean x^2, mean x],[mean x, 1]]
  const Sx2=DX.reduce((s,x)=>s+x*x,0)/5,Lmin=mse(W2,B2);
  const ring=(L)=>{const r=Math.sqrt(L-Lmin);let d='';const a=Sx2,b=mx,c=1;
    for(let k=0;k<=120;k++){const t=k/120*2*Math.PI;const u=Math.cos(t),v=Math.sin(t);const q=a*u*u+2*b*u*v+c*v*v;const s=r/Math.sqrt(q);
      d+=(k?'L':'M')+A.X(W2+s*u).toFixed(1)+','+A.Y(B2+s*v).toFixed(1)}return d+'Z'};
  const levels=[.15,.5,1.1,2,3.2,4.7,6.5,8.6,11];
  const defs=svgEl('defs',{},svg);const cp=svgEl('clipPath',{id:'clip41'},defs);svgEl('rect',{x:A.o.x,y:A.o.y,width:A.o.w,height:A.o.h},cp);
  const rg=svgEl('g',{'clip-path':'url(#clip41)'},svg);
  const rings=levels.map((L,i)=>svgEl('path',{d:ring(Lmin+L),fill:'none',stroke:i<2?C.yellow:C.blue,'stroke-width':3,opacity:.9,style:'opacity:0;visibility:hidden'},rg));
  tl.to(rings,{autoAlpha:1,duration:.35,stagger:.12},cue(sid,'contour'));
  const c1=note(S,'each ring: settings with the same loss',1320,260,520,{fontSize:'38px'});show(c1,cue(sid,'closed'),.5);
  const c2=note(S,'rings crowd together: steep',1320,390,520,{fontSize:'38px',color:C.blue});show(c2,cue(sid,'crowd'),.5);
  const c3=note(S,'rings spread apart: flat',1320,460,520,{fontSize:'38px',color:C.yellow});show(c3,cue(sid,'spread'),.5);
  const ctr=svgEl('circle',{cx:A.X(W2),cy:A.Y(B2),r:13,fill:C.pink,style:'opacity:0;visibility:hidden'},svg);fadeIn(ctr,cue(sid,'centre'),.5);
  const c4=note(S,'the centre: the best fit',1320,560,520,{fontSize:'38px',color:C.pink});show(c4,cue(sid,'best'),.5);
  sceneInOut(sid);
})();

/* ============ S5: billions of dials ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const knobs=[];for(let r=0;r<5;r++)for(let c=0;c<14;c++){const cx=180+c*62,cy=230+r*62;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
    svgEl('circle',{cx,cy,r:22,fill:'#161c25',stroke:C.blue,'stroke-width':3},g);const a=((r*7+c*13)%12)/12*2*Math.PI;svgEl('line',{x1:cx,y1:cy,x2:cx+Math.sin(a)*16,y2:cy-Math.cos(a)*16,stroke:C.blue,'stroke-width':3},g);knobs.push(g)}
  tl.to(knobs,{autoAlpha:1,duration:.15,stagger:.012},cue(sid,'millions'));
  const kl=note(S,'… millions or billions of them',1080,250,700,{fontSize:'40px',color:C.dim});show(kl,cue(sid,'billions'),.5);
  // a rugged slice through the landscape
  const A=axes(svg,{x:160,y:560,w:1600,h:320,xmin:0,xmax:10,ymin:0,ymax:4,xticks:[],yaxis:false});
  const f=x=>1.4+.9*Math.sin(1.3*x)+.5*Math.sin(3.1*x+1)+.25*Math.cos(5.3*x)+(x>6.2&&x<7.6?-.0:0)+.05*(x-5)**2;
  const cv=svgEl('path',{d:farea(A,f,0,10,300),fill:C.yellow,'fill-opacity':.1,stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(cv,cue(sid,'vocabulary'),.6);
  const tag=(t,x,col,word)=>{const d=lbl(S,t,A.X(x),A.Y(f(x))-50,{fontSize:'34px',fontStyle:'italic',color:col});show(d,cue(sid,word),.4)};
  tag('valley',3.55,C.green,'valleys');tag('slope',1.5,C.ink,'slopes');tag('plateau',8.9,C.dim,'plateaus');
  const walker=svgEl('circle',{r:14,fill:C.pink},svg);gsap.set(walker,{autoAlpha:0});
  const render=o=>{walker.setAttribute('cx',A.X(o.x));walker.setAttribute('cy',A.Y(f(o.x))-14)};const st=state({x:.9},render);
  fadeIn(walker,cue(sid,'strategy'),.4);drive(st,cue(sid,'walking'),2.4,{x:2.35},render,'power1.inOut');
  const ft=note(S,'all you can feel is the ground beneath your feet',1080,330,700,{fontSize:'38px',color:C.pink});show(ft,cue(sid,'feel'),.5);
  sceneInOut(sid);
})();

/* ============ S6: the LLM landscape ============ */
(function(){const S=$('S6');const sid='s6';
  const f=lbl(S,tex('\\text{height}=\\mathcal{L}(\\theta)=\\text{average cross-entropy on training text}',50),960,330,{color:C.pink});show(f,cue(sid,'height'),.7);
  const c=lbl(S,tex('\\text{coordinates}=\\theta=\\text{billions of weights}',50),960,470,{color:C.blue});show(c,cue(sid,'coordinates'),.7);
  nextUp(S,'4.2 &nbsp;gradient descent: roll downhill',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
