  card.setAttribute('data-layout-allow-overlap','');

  fadeIn(focus,cue(sid,'answer'),.3);
  tl.fromTo(card,{autoAlpha:0,x:200},{autoAlpha:.96,x:0,duration:.8,ease:'power2.out',immediateRender:false},cue(sid,'answer'));
  const nv=label(S,'itself and earlier tokens only',960,760,{fs:36,italic:true,color:C.ink});show(nv,cue(sid,'itself'),.4);
  const cd=label(S,'a card covering the rest of the page',960,840,{fs:36,italic:true,color:C.dim});show(cd,cue(sid,'card'),.4);
  sceneInOut(sid);
})();

/* ============ S6: the mask: -inf above the diagonal ============ */
(function(){const S=$('S6');const sid='s6';
  const N=6,rnd=seedRand(7);const sc=[...Array(N)].map(()=>[...Array(N)].map(()=>Math.round((rnd()*4-2)*10)/10));
  const M1=matrix(S,560,560,N,N,{cw:96,ch:66,vals:sc.map(r=>r.map(v=>fmt(v,1))),fs:24,color:C.teal});
  const t1=label(S,'scaled scores',560,320,{fs:34,italic:true,color:C.teal});show([M1.box,t1],at(sid,.02),.5);
  const up=[];for(let r=0;r<N;r++)for(let c=r+1;c<N;c++)up.push(M1.cells[r][c]);
  const infT=cue(sid,'infinity');
  up.forEach(cell=>{const v=el(cell,'abs','−∞',{left:'0',top:'0',width:'100%',height:'100%',color:C.red,background:'#2a1416',opacity:0,visibility:'hidden'});v.setAttribute('data-layout-allow-overlap','');cell.setAttribute('data-layout-allow-overlap','');tl.to(v,{autoAlpha:1,duration:.3},infT+.2)});
  const ml=label(S,'+ mask: −∞ above the diagonal',560,820,{fs:32,color:C.red});show(ml,cue(sid,'adding'),.4);
  const A=sc.map((r,i)=>softmaxJS(r.slice(0,i+1)).concat(Array(N-i-1).fill(0)));
  const M2=matrix(S,1360,560,N,N,{cw:96,ch:66,vals:A.map(r=>r.map((v,j)=>v===0?'0':v.toFixed(2))),heat:A,fs:24,color:QC});
  const t2=label(S,'weights after softmax',1360,320,{fs:34,italic:true,color:QC});
  const svg=layerSvg(S);const a=mkArrow(svg,PX,C.ink,4);setArrow(a,{x0:860,y0:560,x1:860,y1:560});
  grow(a,cue(sid,'exponential'),.5,1050,560);show([M2.box,t2],cue(sid,'zero'),.6);
  const rs=label(S,'each row still sums to 1',1360,820,{fs:32,italic:true,color:QC});show(rs,cue(sid,'sums'),.4);
  const lt=label(S,'lower triangular',1360,880,{fs:32,italic:true,color:C.ink});show(lt,cue(sid,'triangular'),.4);
  const h0=matHL(S,M2,0,0,0,5,C.green);fadeIn(h0,cue(sid,'first'),.3);fadeOut(h0,cue(sid,'last')-.2,.3);
  const h5=matHL(S,M2,5,0,5,5,C.green);fadeIn(h5,cue(sid,'last'),.3);
  sceneInOut(sid);
})();

/* ============ S7: five steps ============ */
(function(){const S=$('S7');const sid='s7';
  const steps=[['Q Kᵀ','multiply',C.teal],['÷ √d_k','divide',C.pink],['+ mask','add',C.red],['softmax rows','apply',QC],['× V','multiply',VC]];
  const xs=rowX(steps.map(s=>s[0]),40,120);const lens=steps.map(s=>s[0].length*40*.6+36);const svg=layerSvg(S);
  const ch=steps.map(([t,w,col],i)=>tok(S,t,xs[i],330,{fs:40,color:col,border:col}));
  const icons=steps.map(([t,w,col],i)=>{const m=matrix(S,xs[i],520,4,4,{cw:34,ch:34,heat:[...Array(4)].map((_,r)=>[...Array(4)].map((_,c)=>i>=2&&c>r?0:.3+.15*((r+c)%3))),color:col});return m.box});
  const n=[1,1,1,1,2];
  steps.forEach(([t,w,col],i)=>{const tt=cue(sid,w,n[i]);show([ch[i],icons[i]],tt,.4);
    if(i>0){const a=mkArrow(svg,PX,C.dim,3),s0=xs[i-1]+lens[i-1]/2+14;setArrow(a,{x0:s0,y0:330,x1:s0,y1:330});grow(a,tt-.2,.3,xs[i]-lens[i]/2-14,330)}});
  const sq=label(S,'the (T × T) table keeps its shape until × V',960,660,{fs:32,italic:true,color:C.dim});show(sq,cue(sid,'square'),.4);
  const code=el(S,'abs hid','',{left:'560px',top:'730px',width:'800px',fontSize:'32px',lineHeight:'1.5',color:C.ink,fontFamily:"'JetBrains Mono',monospace",background:'#141a22',border:'2px solid #2a3340',borderRadius:'12px',padding:'18px 28px'});
  code.innerHTML='S = Q @ K.T / np.sqrt(d_k) + mask<br>A = softmax(S)&nbsp;&nbsp;&nbsp;&nbsp;# each row<br>out = A @ V';
  show(code,cue(sid,'plain'),.6);
  sceneInOut(sid);
})();

/* ============ S8: one head, one way of looking ============ */
(function(){const S=$('S8');const sid='s8';
  const N=6,pats=[(r,c)=>c===0?.9:.05,(r,c)=>c===r-1||(r===0&&c===0)?.9:.04,(r,c)=>c===Math.min(r,3)?.85:.05];
  const names=['finds the subject','the word before','end of the last sentence'];
  const hs=pats.map((f,k)=>{const H=[...Array(N)].map((_,r)=>[...Array(N)].map((_,c)=>c>r?0:f(r,c)));const m=matrix(S,480+k*480,520,N,N,{cw:46,ch:46,heat:H,color:[QC,C.teal,C.pink][k]});
    const l=label(S,'head '+(k+1),480+k*480,340,{fs:34,mono:true,color:[QC,C.teal,C.pink][k]});const d=label(S,names[k],480+k*480,700,{fs:30,italic:true,color:C.ink});return [m.box,l,d]});
  show(hs[0].slice(0,2),at(sid,.03),.5);
  const one=label(S,'one head: one way of looking',960,200,{fs:40,italic:true,color:C.dim});show(one,cue(sid,'one'),.4);
  show(hs[0][2],cue(sid,'subject'),.4);
  show(hs[1].slice(0,2),cue(sid,'before'),.5);show(hs[1][2],cue(sid,'before'),.4);
  show(hs[2].slice(0,2),cue(sid,'end'),.5);show(hs[2][2],cue(sid,'sentence'),.4);
  const sb=label(S,'several heads side by side, each with its own Q, K, V',960,800,{fs:36,italic:true,color:C.ink});show(sb,cue(sid,'several'),.5);
  nextCap(S,'next &nbsp;·&nbsp; 9.7 &nbsp;Multi-head attention',cue(sid,'multi'));
  lastScene(sid);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
