.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}

function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
let VALLEY_N=0;
const VA=.1,VB=4;const vgrad=(x,y)=>[VA*x,VB*y];
const X0=-9,Y0=1.2;
function simGD(lr,n){let x=X0,y=Y0;const P=[[x,y]];for(let i=0;i<n;i++){const g=vgrad(x,y);x-=lr*g[0];y-=lr*g[1];P.push([x,y])}return P}
function simMom(lr,be,n){let x=X0,y=Y0,vx=0,vy=0;const P=[[x,y]];for(let i=0;i<n;i++){const g=vgrad(x,y);vx=be*vx+g[0];vy=be*vy+g[1];x-=lr*vx;y-=lr*vy;P.push([x,y])}return P}
function simAdam(lr,n){let x=X0,y=Y0;const m=[0,0],v=[0,0];const P=[[x,y]];for(let t=1;t<=n;t++){const g=vgrad(x,y);
  for(let i=0;i<2;i++){m[i]=.9*m[i]+.1*g[i];v[i]=.999*v[i]+.001*g[i]*g[i]}
  const s=i=>(m[i]/(1-.9**t))/(Math.sqrt(v[i]/(1-.999**t))+1e-8);x-=lr*s(0);y-=lr*s(1);P.push([x,y])}return P}
const N5=60;const PGD=simGD(.48,N5),PMOM=simMom(.05,.9,N5),PADAM=simAdam(.2,N5);
function valley(svg,cx,cy,sx,sy){const P=(u,v)=>[cx+u*sx,cy-v*sy];const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  [.05,.3,.8,1.6,2.8,4.4,6.4].forEach(l=>{let d='';for(let k=0;k<=120;k++){const t=k/120*2*Math.PI;const p=P(Math.sqrt(2*l/VA)*Math.cos(t),Math.sqrt(2*l/VB)*Math.sin(t));d+=(k?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}svgEl('path',{d:d+'Z',fill:'none',stroke:C.grid,'stroke-width':2.5,opacity:.9},g)});
  const m=P(0,0);svgEl('circle',{cx:m[0],cy:m[1],r:8,fill:C.ink},g);
  const defs=svgEl('defs',{},svg);const id='vc'+(++VALLEY_N);const cp=svgEl('clipPath',{id},defs);svgEl('rect',{x:cx-11*sx,y:cy-1.85*sy,width:15.5*sx,height:3.7*sy},cp);g.setAttribute('clip-path',`url(#${id})`);
  return {P,g}}
function trail(svg,P,pts,col,w){const p=svgEl('path',{fill:'none',stroke:col,'stroke-width':w||4,'stroke-linejoin':'round'},svg);
  const px=pts.map(q=>P(q[0],q[1]));const head=svgEl('circle',{r:10,fill:col},svg);
  const render=o=>{const n=Math.max(1,Math.min(px.length,Math.round(o.n)));p.setAttribute('d',polyPath(px.slice(0,n)));head.setAttribute('cx',px[n-1][0]);head.setAttribute('cy',px[n-1][1])};
  const st=state({n:1},render);gsap.set([p,head],{autoAlpha:0});return {p,head,render,st,len:px.length,els:[p,head]}}

/* ============ S1: zigzag in a narrow valley ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const V=valley(svg,1360,580,120,170);fadeIn(V.g,cue(sid,'narrow'),.6);
  const t=trail(svg,V.P,PGD,C.ink,4);fadeIn(t.els,cue(sid,'bounces')-.8,.3);drive(t.st,cue(sid,'bounces')-.8,SPAN[sid]*.45,{n:t.len},t.render,'none');
  const a1=note(S,'steep across the valley',150,150,700,{fontSize:'40px',color:C.red});show(a1,cue(sid,'steep'),.5);
  const a2=note(S,'gentle along it',150,210,700,{fontSize:'40px',color:C.green});show(a2,cue(sid,'gentle'),.5);
  const a3=note(S,'plain gradient descent bounces wall to wall, creeping forward',150,860,1600,{fontSize:'40px',color:C.ink,textAlign:'center'});show(a3,cue(sid,'creeping'),.5);
  sceneInOut(sid);
})();

/* ============ S2: momentum ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const V=valley(svg,1360,660,120,170);fadeIn(V.g,at(sid,.01),.5);
  const gd=trail(svg,V.P,PGD,C.ink,2);gd.render({n:gd.len});fadeIn(gd.els,at(sid,.02),.4);tl.to(gd.els,{opacity:.3,duration:.4},cue(sid,'velocity'));
  const t=trail(svg,V.P,PMOM,C.pink,5);fadeIn(t.els,cue(sid,'heavy'),.3);drive(t.st,cue(sid,'heavy'),SPAN[sid]*.6,{n:t.len},t.render,'none');
  const f1=lbl(S,tex('v\\leftarrow \\beta\\,v+\\nabla L',46),420,230,{color:C.pink});show(f1,cue(sid,'memory'),.6);
  const f2=lbl(S,tex('w\\leftarrow w-\\eta\\,v',46),420,300,{});show(f2,cue(sid,'memory')+.5,.6);
  const b=note(S,'β ≈ 0.9: a fading memory of past gradients',150,130,700,{fontSize:'32px',color:C.dim});show(b,cue(sid,'fading'),.5);
  const c1=note(S,'side-to-side pushes flip sign and cancel',1200,150,700,{fontSize:'38px',color:C.ink});show(c1,cue(sid,'cancel'),.5);
  const c2=note(S,'the push along the floor accumulates',1200,210,700,{fontSize:'38px',color:C.pink});show(c2,cue(sid,'accumulates'),.5);
  sceneInOut(sid);
})();

/* ============ S3: a step size per parameter ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const by=700;const mk=(x,h,c,t)=>{const r=svgEl('rect',{x:x-60,y:by-h,width:120,height:h,rx:8,fill:c,'fill-opacity':.85,style:'opacity:0;visibility:hidden'},svg);const l=lbl(S,t,x,by+45,{fontSize:'36px',fontStyle:'italic',color:c});return [r,l]};
  const [g1,l1]=mk(330,360,C.red,'w₁'),[g2,l2]=mk(560,40,C.green,'w₂');
  fadeIn([g1,l1,g2,l2],cue(sid,'large'),.5);
  const gt=lbl(S,'gradient size',445,260,{fontSize:'38px',fontStyle:'italic',color:C.dim});show(gt,cue(sid,'large'),.5);
  const [s1,m1]=mk(1180,150,C.red,'w₁'),[s2,m2]=mk(1410,150,C.green,'w₂');
  fadeIn([s1,m1,s2,m2],cue(sid,'divide'),.6);
  const st=lbl(S,'step after rescaling',1295,460,{fontSize:'38px',fontStyle:'italic',color:C.dim});show(st,cue(sid,'divide'),.5);
  const ar=mkArrow(svg,PX,C.dim,5);ar.hl=22;setArrow(ar,{x0:720,y0:560,x1:720,y1:560});showArrow(ar,cue(sid,'divide'),.2);arrowTo(ar,cue(sid,'divide'),.7,{x1:1040},'power2.out');
  const f=lbl(S,tex('s\\leftarrow \\rho\\,s+(1-\\rho)\\,g^2,\\qquad w\\leftarrow w-\\eta\\,\\frac{g}{\\sqrt{s}+\\epsilon}',50),960,880,{});show(f,cue(sid,'running'),.7);
  const n1=note(S,'steep directions: careful steps · gentle directions: bolder steps',360,170,1200,{fontSize:'38px',color:C.ink,textAlign:'center'});show(n1,cue(sid,'careful'),.5);
  sceneInOut(sid);
})();

/* ============ S4: Adam ============ */
(function(){const S=$('S4');const sid='s4';
  const ch=el(S,'chip','Adam: Kingma &amp; Ba, 2014',{left:'720px',top:'170px',borderColor:C.yellow,color:C.yellow});show(ch,cue(sid,'adam'),.6);
  const rows=[['m\\leftarrow \\beta_1 m+(1-\\beta_1)\\,g','running average of the gradient: momentum',C.pink,'momentum'],
    ['v\\leftarrow \\beta_2 v+(1-\\beta_2)\\,g^2','running average of the squared gradient: the scale',C.green,'squared'],
    ['m_c=\\frac{m}{1-(\\beta_1)^t},\\quad v_c=\\frac{v}{1-(\\beta_2)^t}','corrects for starting at zero',C.blue,'corrects'],
    ['w\\leftarrow w-\\eta\\,\\frac{m_c}{\\sqrt{v_c}+\\epsilon}','one step, scaled per parameter',C.yellow,'scale']];
  rows.forEach(([t,d,c,w],i)=>{const y=330+i*150;const f=lbl(S,tex(t,50),560,y,{color:C.ink});const n=note(S,d,1000,y-26,800,{fontSize:'36px',color:c});show([f,n],cue(sid,w)-(i===3?0:.2),.6)});
  sceneInOut(sid);
})();

/* ============ S5: the race ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const V=valley(svg,1360,640,120,170);fadeIn(V.g,at(sid,.01),.5);
  const ts=[trail(svg,V.P,PGD,C.ink,4),trail(svg,V.P,PMOM,C.pink,4),trail(svg,V.P,PADAM,C.yellow,5)];
  const t0=cue(sid,'watch')+.5,D=SPAN[sid]*.7;
  ts.forEach(t=>{fadeIn(t.els,t0,.3);drive(t.st,t0,D,{n:t.len},t.render,'none')});
  const ls=[['plain descent: zigzags',C.ink,'plain'],['momentum: swings wide, builds speed',C.pink,'momentum'],['Adam: a steadier line',C.yellow,'adam']].map(([t,c,w],i)=>{const n=note(S,t,150,180+i*60,900,{fontSize:'38px',color:c});show(n,cue(sid,w),.5);return n});
  sceneInOut(sid);
})();

/* ============ S6: AdamW for transformers ============ */
(function(){const S=$('S6');const sid='s6';
  const a=el(S,'chip','Adam',{left:'640px',top:'360px',borderColor:C.yellow,color:C.yellow,fontSize:'52px'});show(a,cue(sid,'adam'),.5);
  const b=el(S,'chip','AdamW: weight decay handled separately',{left:'900px',top:'360px',borderColor:C.teal,color:C.teal,fontSize:'40px'});show(b,cue(sid,'decay'),.5);
  const c=note(S,'the usual choice for training transformers and large language models',360,520,1200,{fontSize:'42px',textAlign:'center'});show(c,cue(sid,'transformers'),.6);
  nextUp(S,'4.6 &nbsp;convex vs non-convex landscapes',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
