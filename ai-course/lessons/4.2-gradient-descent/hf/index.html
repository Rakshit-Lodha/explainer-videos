.colv{position:absolute}

.colv .br.l{left:0;border-right:none;border-radius:6px 0 0 6px}

.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
.ttl{position:absolute;font-size:46px;opacity:0;visibility:hidden;white-space:nowrap}

  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
/* a walker on a 1D curve that takes discrete steps; returns positions */
function gdPath(df,w0,lr,n){const ws=[w0];for(let i=0;i<n;i++)ws.push(ws[i]-lr*df(ws[i]));return ws}
/* step(st, time, i): tween proxy index along precomputed points */

/* ============ S1: a hillside in fog ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const A=axes(svg,{x:120,y:260,w:1680,h:600,xmin:0,xmax:10,ymin:0,ymax:6,xticks:[],yaxis:false});A.g.setAttribute('style','opacity:0');
  const f=x=>.9+.055*(x-6.2)**2*(1+.08*Math.sin(2*x))+.25*Math.sin(1.7*x);
  const df=x=>(f(x+1e-4)-f(x-1e-4))/2e-4;
  const hill=svgEl('path',{d:farea(A,f,0,10,300),fill:'#1b2a22',stroke:C.green,'stroke-width':5,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(hill,cue(sid,'hillside'),.8);
  const defs=svgEl('defs',{},svg);const lg=svgEl('radialGradient',{id:'fog42',cx:'0.5',cy:'0.5',r:'0.5'},defs);
  svgEl('stop',{offset:'0','stop-color':'#0e1116','stop-opacity':'0'},lg);svgEl('stop',{offset:'.55','stop-color':'#0e1116','stop-opacity':'.2'},lg);svgEl('stop',{offset:'1','stop-color':'#0e1116','stop-opacity':'.96'},lg);
  const ws=gdPath(df,1.2,1.6,9);
  const walker=svgEl('circle',{r:16,fill:C.pink},svg);
  const fog=svgEl('rect',{x:-1600,y:-1200,width:3200,height:2400,fill:'url(#fog42)',style:'opacity:0;visibility:hidden'},svg);
  const tan=svgEl('line',{stroke:C.yellow,'stroke-width':5,'stroke-linecap':'round'},svg);
  const render=o=>{const k=Math.min(ws.length-2,Math.floor(o.i)),t=o.i-k;const w=ws[k]+(ws[k+1]-ws[k])*t;const x=A.X(w),y=A.Y(f(w))-16;
    walker.setAttribute('cx',x);walker.setAttribute('cy',y);fog.setAttribute('x',x-1600);fog.setAttribute('y',y-1200);
    const s=df(w)*A.o.h/6/(A.o.w/10);const L=90/Math.sqrt(1+s*s);tan.setAttribute('x1',x-L);tan.setAttribute('x2',x+L);tan.setAttribute('y1',y+16+s*L);tan.setAttribute('y2',y+16-s*L)};
  const st=state({i:0},render);gsap.set([walker,tan],{autoAlpha:0});
  fadeIn(walker,cue(sid,'standing'),.4);fadeIn(fog,cue(sid,'fog'),.8);
  fadeIn(tan,cue(sid,'slope'),.4);
  const steps=[cue(sid,'step'),cue(sid,'again'),cue(sid,'step',2),cue(sid,'again')+1.2,cue(sid,'gradient')-.4,cue(sid,'gradient')+.5,cue(sid,'trains'),cue(sid,'trains')+.8];
  steps.forEach((t,i)=>drive(st,t,.7,{i:i+1},render));
  const gd=el(S,'chip','gradient descent',{left:'780px',top:'900px',borderColor:C.pink,color:C.pink});show(gd,cue(sid,'gradient'),.6);
  sceneInOut(sid);
})();

/* ============ S2: move against the slope ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const A=axes(svg,{x:140,y:220,w:1000,h:620,xmin:-1,xmax:5,ymin:0,ymax:8,xticks:[0,1,2,3,4],yaxis:false});
  const tk=[0,1,2,3,4].map(v=>lbl(S,`<span class="mono">${v}</span>`,A.X(v),A.Y(0)+38,{fontSize:'30px',color:C.dim}));
  const xl=lbl(S,tex('w',44),A.X(5)+30,A.Y(0),{});
  const f=w=>.5*(w-2)**2+.6,df=w=>w-2;
  const cv=svgEl('path',{d:fpath(A,f,-1,5),fill:'none',stroke:C.yellow,'stroke-width':6},svg);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(cv);fadeIn([g,xl].concat(tk),at(sid,.01),.6);
  const yl=lbl(S,tex('L(w)',44),A.X(-1)+40,A.Y(8)+10,{color:C.yellow});fadeIn(yl,at(sid,.02),.5);
  const tan=svgEl('line',{stroke:C.blue,'stroke-width':5},svg);const dot=svgEl('circle',{r:14,fill:C.pink},svg);
  const sl=el(S,'lbl','',{fontSize:'38px',color:C.blue});sl.setAttribute('data-layout-allow-overlap','');
  const sc=(A.o.h/8)/(A.o.w/6);
  const render=o=>{const w=o.w,x=A.X(w),y=A.Y(f(w));dot.setAttribute('cx',x);dot.setAttribute('cy',y);const s=df(w)*sc,L=150/Math.sqrt(1+s*s);
    tan.setAttribute('x1',x-L);tan.setAttribute('x2',x+L);tan.setAttribute('y1',y+s*L);tan.setAttribute('y2',y-s*L);
    gsap.set(sl,{x:x,y:y-80,xPercent:-50,yPercent:-50});sl.innerHTML=`slope ${df(w)>=0?'+':'−'}${Math.abs(df(w)).toFixed(1)}`};
  const st=state({w:4},render);gsap.set([tan,dot,sl],{autoAlpha:0});
  fadeIn([tan,dot,sl],cue(sid,'derivative'),.5);
  const ar=mkArrow(svg,PX,C.pink,6);ar.hl=24;setArrow(ar,{x0:A.X(4),y0:A.Y(0)-30,x1:A.X(4),y1:A.Y(0)-30});
  showArrow(ar,cue(sid,'decrease'),.2);arrowTo(ar,cue(sid,'decrease'),.6,{x1:A.X(3.2)},'power2.out');hideArrow(ar,cue(sid,'negative'),.3);
  const p1=note(S,'positive slope → decrease w',1240,300,600,{fontSize:'40px',color:C.ink});show(p1,cue(sid,'positive'),.5);
  drive(st,cue(sid,'negative')-.3,1.6,{w:.3},render);
  const ar2=mkArrow(svg,PX,C.pink,6);ar2.hl=24;setArrow(ar2,{x0:A.X(.3),y0:A.Y(0)-30,x1:A.X(.3),y1:A.Y(0)-30});
  showArrow(ar2,cue(sid,'increase'),.2);arrowTo(ar2,cue(sid,'increase'),.6,{x1:A.X(1.1)},'power2.out');
  const p2=note(S,'negative slope → increase w',1240,370,600,{fontSize:'40px',color:C.ink});show(p2,cue(sid,'negative'),.5);
  const ag=note(S,'either way: move against the slope',1240,470,600,{fontSize:'40px',color:C.pink});show(ag,cue(sid,'against'),.5);
  const rule=lbl(S,tex('w_{\\text{new}}=w-\\eta\\,\\frac{dL}{dw}',66),1520,680,{color:C.ink});show(rule,cue(sid,'rule'),.7);
  const eta=lbl(S,tex('\\eta',50)+'<span style="font-size:36px;font-style:italic;color:#7f8b99"> &nbsp;a small number</span>',1520,820,{});show(eta,cue(sid,'small'),.5);
  sceneInOut(sid);
})();

/* ============ S3: the learning rate and shrinking steps ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const A=axes(svg,{x:140,y:220,w:1100,h:620,xmin:-2,xmax:5,ymin:0,ymax:9,xticks:[],yaxis:false});
  const f=w=>.5*(w-2)**2+.6,df=w=>w-2;
  const cv=svgEl('path',{d:fpath(A,f,-2,5),fill:'none',stroke:C.yellow,'stroke-width':6},svg);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(cv);fadeIn(g,at(sid,.01),.5);
  const ws=gdPath(df,-1.6,.32,10);
  const dots=ws.map((w,i)=>svgEl('circle',{cx:A.X(w),cy:A.Y(f(w)),r:i?10:13,fill:C.pink,opacity:i?.85:1,style:'opacity:0;visibility:hidden'},svg));
  const legs=ws.slice(1).map((w,i)=>{const a=mkArrow(svg,PX,C.blue,4);a.hl=16;setArrow(a,{x0:A.X(ws[i]),y0:A.Y(0)+30,x1:A.X(ws[i]),y1:A.Y(0)+30});return a});
  fadeIn(dots[0],cue(sid,'learning'),.4);
  const t0=cue(sid,'length'),dt=(cue(sid,'settles')+1.5-t0)/10;
  legs.forEach((a,i)=>{const t=t0+i*dt;showArrow(a,t,.15);arrowTo(a,t,dt*.8,{x1:A.X(ws[i+1])},'power2.out');fadeIn(dots[i+1],t+dt*.6,.2)});
  const lr=lbl(S,tex('\\eta',56)+'<span style="font-size:42px"> = learning rate</span>',1330,280,{});lr.style.translate='0 -50%';show(lr,cue(sid,'learning'),.6);
  const st=lbl(S,tex('\\text{step}=\\eta\\cdot\\text{slope}',52),1560,455,{color:C.blue});show(st,cue(sid,'sets'),.5);
  const ln=note(S,'it sets the length of each step',1330,335,560,{fontSize:'38px',color:C.dim});show(ln,cue(sid,'length'),.5);
  const sh=note(S,'gentler slope near the bottom → shorter steps, on their own',1330,525,520,{fontSize:'38px',color:C.dim});show(sh,cue(sid,'gentler'),.5);
  const se=note(S,'settles into the minimum',1330,680,520,{fontSize:'40px',color:C.pink});show(se,cue(sid,'settles'),.5);
  sceneInOut(sid);
})();

/* ============ S4: the gradient in two dimensions ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const cx=620,cy=560,sx=150,sy=150;const P=(u,v)=>[cx+u*sx,cy-v*sy];
  const a=1,b=4;const L=(u,v)=>a*u*u+b*v*v;
  const rings=[.25,.75,1.5,2.5,3.8,5.4,7.3].map(l=>{let d='';for(let k=0;k<=100;k++){const t=k/100*2*Math.PI;const p=P(Math.sqrt(l/a)*Math.cos(t),Math.sqrt(l/b)*Math.sin(t));d+=(k?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}
    return svgEl('path',{d:d+'Z',fill:'none',stroke:C.grid,'stroke-width':3,opacity:.9,style:'opacity:0;visibility:hidden'},svg)});
  tl.to(rings,{autoAlpha:1,duration:.3,stagger:.06},at(sid,.01));
  const pt=[-2.0,.9];const g=[2*a*pt[0],2*b*pt[1]];const gn=Math.hypot(...g);
  const p0=P(...pt);const dot=svgEl('circle',{cx:p0[0],cy:p0[1],r:12,fill:C.ink,style:'opacity:0;visibility:hidden'},svg);fadeIn(dot,cue(sid,'two'),.4);
  const gx=mkArrow(svg,PX,C.green,6),gy=mkArrow(svg,PX,C.red,6);gx.hl=gy.hl=20;
  setArrow(gx,{x0:p0[0],y0:p0[1],x1:p0[0],y1:p0[1]});setArrow(gy,{x0:p0[0],y0:p0[1],x1:p0[0],y1:p0[1]});
  const k=55;
  showArrow(gx,cue(sid,'slopes'),.2);arrowTo(gx,cue(sid,'slopes'),.6,{x1:p0[0]+g[0]*k*.35},'power2.out');
  showArrow(gy,cue(sid,'axis'),.2);arrowTo(gy,cue(sid,'axis'),.6,{y1:p0[1]-g[1]*k*.35},'power2.out');
  const gr=mkArrow(svg,PX,C.yellow,7);gr.hl=26;setArrow(gr,{x0:p0[0],y0:p0[1],x1:p0[0],y1:p0[1]});
  showArrow(gr,cue(sid,'gradient')-.3,.2);arrowTo(gr,cue(sid,'gradient')-.3,.8,{x1:p0[0]+g[0]*k*.35,y1:p0[1]-g[1]*k*.35},'power2.out');
  hideArrow(gx,cue(sid,'ascent'),.3);hideArrow(gy,cue(sid,'ascent'),.3);
  const f1=lbl(S,tex('\\nabla L=\\begin{bmatrix}\\partial L/\\partial w_1\\\\ \\partial L/\\partial w_2\\end{bmatrix}',58),1500,300,{});show(f1,cue(sid,'vector'),.7);
  const n1=note(S,'points uphill: steepest ascent',1250,450,560,{fontSize:'38px',color:C.yellow});show(n1,cue(sid,'ascent'),.5);
  const dn=mkArrow(svg,PX,C.pink,7);dn.hl=26;setArrow(dn,{x0:p0[0],y0:p0[1],x1:p0[0],y1:p0[1]});
  showArrow(dn,cue(sid,'opposite'),.2);arrowTo(dn,cue(sid,'opposite'),.8,{x1:p0[0]-g[0]*k*.35,y1:p0[1]+g[1]*k*.35},'power2.out');
  const n2=lbl(S,tex('-\\nabla L',46),1250+40,540,{color:C.pink});n2.style.translate='0 -50%';show(n2,cue(sid,'opposite'),.5);
  const n2b=note(S,'steepest way down',1480,520,380,{fontSize:'38px',color:C.pink});show(n2b,cue(sid,'opposite'),.5);
  const n3=note(S,'crosses each contour at a right angle',1250,620,560,{fontSize:'38px',color:C.dim});show(n3,cue(sid,'right'),.5);
  // a right-angle mark where the gradient leaves the contour
  const ux=g[0]/gn,uy=-g[1]/gn;const tx=-uy,ty=ux;const m=18;
  const ra=svgEl('path',{d:`M${p0[0]+tx*m},${p0[1]+ty*m}L${p0[0]+tx*m+ux*m},${p0[1]+ty*m+uy*m}L${p0[0]+ux*m},${p0[1]+uy*m}`,fill:'none',stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);fadeIn(ra,cue(sid,'right'),.4);
  const tg=svgEl('line',{x1:p0[0]-tx*120,y1:p0[1]-ty*120,x2:p0[0]+tx*120,y2:p0[1]+ty*120,stroke:C.ink,'stroke-width':2,'stroke-dasharray':'8 6',style:'opacity:0;visibility:hidden'},svg);fadeIn(tg,cue(sid,'contour'),.4);
  sceneInOut(sid);
})();

/* ============ S5: the loop ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const boxes=[['compute the loss',480,300,C.yellow,'loss'],['compute the gradient',800,560,C.blue,'gradient'],['step against it',480,820,C.pink,'step'],['repeat',160,560,C.green,'repeat']];
  const bs=boxes.map(([t,x,y,c])=>el(S,'chip',t,{left:x+'px',top:y+'px',borderColor:c,color:c,translate:'-50% -50%'}));
  bs.forEach((b,i)=>show(b,cue(sid,boxes[i][4]),.5));
  const arcs=[[600,320,820,500],[800,620,600,800],[360,800,180,620],[180,500,360,320]].map(([x0,y0,x1,y1],i)=>{const a=mkArrow(svg,PX,C.dim,4);a.hl=18;setArrow(a,{x0,y0,x1:x0,y1:y0});return [a,x1,y1]});
  arcs.forEach(([a,x1,y1],i)=>{const t=cue(sid,boxes[(i+1)%4][4])-.3;showArrow(a,t,.2);arrowTo(a,t,.5,{x1,y1},'power2.out')});
  const A=axes(svg,{x:1200,y:320,w:560,h:380,xmin:0,xmax:30,ymin:0,ymax:6,xticks:[],yticks:[]});
  const lc=svgEl('path',{d:fpath(A,t=>.4+5*Math.exp(-t/6),0,30),fill:'none',stroke:C.yellow,'stroke-width':5},svg);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(lc);fadeIn(g,cue(sid,'improving'),.6);
  const lx=lbl(S,'loss falls with each pass round the loop',1480,750,{fontSize:'32px',fontStyle:'italic',color:C.dim});show(lx,cue(sid,'improving'),.5);
  const bp=el(S,'chip','later: backpropagation computes it for millions of parameters',{left:'1000px',top:'880px',borderColor:C.teal,color:C.teal,fontSize:'34px',translate:'-50% 0'});show(bp,cue(sid,'backpropagation'),.6);
  sceneInOut(sid);
})();

/* ============ S6: a low point, not necessarily the lowest ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const A=axes(svg,{x:160,y:260,w:1600,h:520,xmin:0,xmax:10,ymin:0,ymax:6,xticks:[],yaxis:false});
  const f=x=>2.2+1.1*Math.cos(1.25*x)+.05*(x-6.6)**2-.4*Math.exp(-((x-7.6)**2)/1.2)*1.8;
  const df=x=>(f(x+1e-4)-f(x-1e-4))/2e-4;
  const cv=svgEl('path',{d:farea(A,f,0,10,300),fill:C.yellow,'fill-opacity':.08,stroke:C.yellow,'stroke-width':5},svg);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(cv);fadeIn(g,at(sid,.01),.6);
  const ws=gdPath(df,.9,.18,40);
  const ball=svgEl('circle',{r:15,fill:C.pink},svg);
  const render=o=>{const k=Math.min(ws.length-2,Math.floor(o.i)),t=o.i-k;const w=ws[k]+(ws[k+1]-ws[k])*t;ball.setAttribute('cx',A.X(w));ball.setAttribute('cy',A.Y(f(w))-15)};
  const st=state({i:0},render);gsap.set(ball,{autoAlpha:0});fadeIn(ball,at(sid,.03),.4);
  drive(st,cue(sid,'feet'),3.5,{i:40},render,'power1.out');
  let gm=0,gv=1e9;for(let x=0;x<=10;x+=.01)if(f(x)<gv){gv=f(x);gm=x}
  const lo=lbl(S,'a low point',A.X(ws[40]),A.Y(f(ws[40]))+60,{fontSize:'38px',fontStyle:'italic',color:C.pink});show(lo,cue(sid,'low'),.5);
  const lw=lbl(S,'the lowest one',A.X(gm),A.Y(gv)+55,{fontSize:'38px',fontStyle:'italic',color:C.green});show(lw,cue(sid,'lowest'),.5);
  nextUp(S,'4.3 &nbsp;learning rate: too small, too big, just right',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
