  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* bar row helper: n bars at x0.., baseline y, heights from values via scale */
function bars(S,n,x0,dx,y,w,color){const B=[];for(let i=0;i<n;i++){const b=el(S,'abs','',{left:(x0+i*dx-w/2)+'px',top:(y-200)+'px',width:w+'px',height:'200px',background:color,borderRadius:'6px 6px 0 0',transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});B.push(b)}return B}
function setBars(B,vals,max){B.forEach((b,i)=>gsap.set(b,{scaleY:Math.max(.004,Math.min(1,vals[i]/max))}))}
function tweenBars(B,from,to,max,t,d){const o={m:0};const ap=()=>B.forEach((b,i)=>{const v=from[i]+(to[i]-from[i])*o.m;gsap.set(b,{scaleY:Math.max(.004,Math.min(1,v/max))})});
  tl.to(o,{m:1,duration:d,ease:'power2.inOut',immediateRender:false,onUpdate:ap},t)}

/* ============ S1: long products are fragile ============ */
(function(){const S=$('S1');const sid='s1';
  const n=12,x0=300,dx=120,y=640;
  const lab=[];for(let i=0;i<n;i++){const e=el(S,'lbl',`<span class="mono" style="font-size:24px">L${i+1}</span>`,{color:C.dim});place(e,x0+i*dx,y+30);lab.push(e)}
  const B=bars(S,n,x0,dx,y,64,C.pink);
  const one=Array(n).fill(1),shr=one.map((_,i)=>Math.pow(.8,n-i)),grw=one.map((_,i)=>Math.pow(1.2,n-i));
  setBars(B,one.map(()=>.25),1);
  fadeIn([...B,...lab],cue(sid,'deep'),.4,.03);
  const lossL=el(S,'lbl','loss →',{color:C.yellow,fontSize:'36px',fontStyle:'italic'});place(lossL,x0+n*dx+40,y-40);show(lossL,cue(sid,'loss'),.4);
  const ttl=el(S,'abs','',{left:'300px',top:'200px',width:'1300px',fontSize:'44px',fontStyle:'italic',opacity:0,visibility:'hidden'});ttl.innerHTML='the gradient reaching each layer, from the loss backwards';show(ttl,cue(sid,'path'),.5);
  const f1=el(S,'abs mono','',{left:'300px',top:'780px',width:'1300px',fontSize:'40px',color:C.pink,opacity:0,visibility:'hidden'});f1.innerHTML='× 0.8 per layer: 0.8<sup>12</sup> ≈ 0.07';
  const f2=el(S,'abs mono','',{left:'300px',top:'780px',width:'1300px',fontSize:'40px',color:C.red,opacity:0,visibility:'hidden'});f2.innerHTML='× 1.2 per layer: 1.2<sup>12</sup> ≈ 8.9';
  tweenBars(B,one.map(()=>.25),shr.map(v=>v*.25*4),1,cue(sid,'smaller'),1.6);show(f1,cue(sid,'smaller'),.4);
  const sz=el(S,'lbl','shrinks towards zero',{color:C.pink,fontSize:'40px',fontStyle:'italic'});place(sz,500,420);show(sz,cue(sid,'shrinks'),.4);
  fadeOut([f1,sz],cue(sid,'larger')-.2,.3);
  tl.to(B,{backgroundColor:C.red,duration:.4},cue(sid,'larger'));
  tweenBars(B,shr.map(v=>v*.25*4),grw.map(v=>v*.25/8.9*4*.9),1,cue(sid,'larger'),1.6);show(f2,cue(sid,'larger'),.4);
  const ex=el(S,'lbl','explodes',{color:C.red,fontSize:'40px',fontStyle:'italic'});place(ex,500,420);show(ex,cue(sid,'explodes'),.4);
  const hard=el(S,'cap','why deep networks were hard to train for years',{top:'900px',fontSize:'42px',fontStyle:'italic'});show(hard,cue(sid,'notoriously'),.5);
  sceneInOut(sid);
})();

/* ============ S2: vanishing through sigmoids ============ */
(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);
  const n=10,x0=330,dx=130,base=760;
  // log-scale bars: height ∝ (log10(g) + 7) / 7
  const B=bars(S,n,x0,dx,base,70,C.pink);B.forEach(b=>{b.style.top=(base-520)+'px';b.style.height='520px'});
  const g=[];for(let i=0;i<n;i++)g.push(Math.pow(.25,n-i));
  const h=v=>Math.max(0,(Math.log10(v)+7)/7);
  setBars(B,g.map(()=>h(1)),1);
  const labs=[];for(let i=0;i<n;i++){const e=el(S,'lbl',`<span class="mono" style="font-size:24px">${i+1}</span>`,{color:C.dim});place(e,x0+i*dx,base+30);labs.push(e)}
  fadeIn([...B,...labs],cue(sid,'stack'),.4,.03);
  const sl=el(S,'abs','',{left:'330px',top:'130px',width:'1300px',fontSize:'42px',fontStyle:'italic',opacity:0,visibility:'hidden'});sl.innerHTML='sigmoid slope ≤ ¼: each layer multiplies the gradient by ¼ or less';show(sl,cue(sid,'quarter'),.5);
  // shrink step by step from the loss (right) to layer 1 (left)
  const st={k:0};const ap=()=>{const k=st.k;B.forEach((b,i)=>{const depth=n-i;const f=Math.min(1,Math.max(0,k-(depth-1)));const v=Math.pow(.25,(depth-1)+f);gsap.set(b,{scaleY:h(Math.max(v,1e-7))})})};
  tl.to(st,{k:n,duration:3.6,ease:'none',immediateRender:false,onUpdate:ap},cue(sid,'every'));
  const ll=el(S,'lbl','layer 1',{color:C.ink,fontSize:'34px',fontStyle:'italic'});place(ll,x0,base+80);
  const mil=el(S,'abs','',{left:'330px',top:'860px',width:'900px',fontSize:'40px',opacity:0,visibility:'hidden'});mil.innerHTML=tex('\\left(\\tfrac14\\right)^{10}\\approx 9.5\\times10^{-7}',48)+'&nbsp; <span style="font-style:italic">less than a millionth</span>';
  show([mil,ll],cue(sid,'millionth'),.5);
  const ax=el(S,'lbl','log scale',{color:C.dim,fontSize:'28px',fontStyle:'italic'});place(ax,1700,base-260);fadeIn(ax,cue(sid,'stack'),.4);
  const van=el(S,'abs','',{left:'1240px',top:'860px',width:'620px',textAlign:'right',fontSize:'42px',color:C.pink,fontStyle:'italic',opacity:0,visibility:'hidden'});van.innerHTML='the vanishing gradient';show(van,cue(sid,'vanishing'),.5);
  sceneInOut(sid);
})();

/* ============ S3: weight scale sets the signal size ============ */
(function(){const S=$('S3');const sid='s3';
  const n=10,x0=520,dx=120;
  const rows=[['weights too large',C.red,1.45,430],['weights too small',C.blue,.65,800]];
  const R=rows.map(([t,c,f,y])=>{const B=bars(S,n,x0,dx,y,64,c);B.forEach(b=>{b.style.top=(y-220)+'px';b.style.height='220px'});const vals=[];for(let i=0;i<n;i++)vals.push(Math.pow(f,i));
    const l=el(S,'abs','',{left:'80px',top:(y-80)+'px',width:'360px',fontSize:'36px',fontStyle:'italic',color:c,opacity:0,visibility:'hidden'});l.innerHTML=t;return {B,vals,l,y}});
  R.forEach(r=>setBars(r.B,r.vals.map(()=>.004),1));
  const lab=el(S,'abs','',{left:'520px',top:'90px',width:'1300px',fontSize:'38px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});lab.innerHTML='size of the signal at layers 1 to 10';show(lab,cue(sid,'layer'),.5);
  const show3=(r,t)=>{fadeIn([...r.B,r.l],t,.3);const o={m:0};tl.to(o,{m:1,duration:1.6,ease:'power1.out',immediateRender:false,onUpdate:()=>r.B.forEach((b,i)=>gsap.set(b,{scaleY:Math.max(.004,Math.min(1,(r.vals[i]/(r===R[0]?5:1.1))*o.m))}))},t)};
  show3(R[0],cue(sid,'large'));show3(R[1],cue(sid,'small'));
  const both=el(S,'abs','',{left:'520px',top:'900px',width:'1300px',fontSize:'38px',fontStyle:'italic',opacity:0,visibility:'hidden'});both.innerHTML='the same factor scales the gradient coming back';show(both,cue(sid,'same'),.5);
  sceneInOut(sid);
})();

/* ============ S4: scale the spread to the layer size ============ */
(function(){const S=$('S4');const sid='s4';
  const t1=el(S,'cap',tex('\\mathrm{Var}\\Big(\\sum_{i=1}^{n} w_i x_i\\Big) = n\\,\\mathrm{Var}(w)\\,\\mathrm{Var}(x)',56),{top:'150px'});show(t1,cue(sid,'variance'),.6);
  const t2=el(S,'cap',tex('\\mathrm{Var}(w)=\\tfrac{1}{n}\\;\\Rightarrow\\;\\mathrm{Var}(\\text{sum}) = \\mathrm{Var}(x)',56),{top:'300px'});show(t2,cue(sid,'one'),.6);
  const k=el(S,'lbl','the signal keeps its size from layer to layer',{color:C.green,fontSize:'38px',fontStyle:'italic'});place(k,960,440);show(k,cue(sid,'constant'),.5);
  const x=el(S,'abs','',{left:'200px',top:'560px',width:'700px',height:'260px',border:'3px solid #58c4dd',borderRadius:'18px',background:'#10151c',opacity:0,visibility:'hidden'});
  x.innerHTML='<div style="position:absolute;left:0;top:26px;width:700px;text-align:center;font-size:40px;color:#58c4dd">Xavier (Glorot)</div><div style="position:absolute;left:0;top:96px;width:700px;text-align:center">'+tex('\\mathrm{Var}(w)=\\tfrac{1}{n}',50)+'</div><div style="position:absolute;left:0;top:190px;width:700px;text-align:center;font-size:30px;color:#7f8b99;font-style:italic">Glorot and Bengio, 2010</div>';
  show(x,cue(sid,'xavier'),.6);
  const he=el(S,'abs','',{left:'1020px',top:'560px',width:'700px',height:'260px',border:'3px solid #f5cf4a',borderRadius:'18px',background:'#10151c',opacity:0,visibility:'hidden'});
  he.innerHTML='<div style="position:absolute;left:0;top:26px;width:700px;text-align:center;font-size:40px;color:#f5cf4a">He (Kaiming), for ReLU</div><div style="position:absolute;left:0;top:96px;width:700px;text-align:center">'+tex('\\mathrm{Var}(w)=\\tfrac{2}{n}',50)+'</div><div style="position:absolute;left:0;top:190px;width:700px;text-align:center;font-size:30px;color:#7f8b99;font-style:italic">He et al., 2015</div>';
  show(he,cue(sid,'relu'),.6);
  const half=el(S,'cap','ReLU silences about half its inputs, so double the variance',{top:'880px',fontSize:'38px',fontStyle:'italic',color:C.yellow});show(half,cue(sid,'silences'),.5);
  sceneInOut(sid);
})();

/* ============ S5: why random: symmetry ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const X=[0,1,2].map(i=>node(S,360,360+i*180,40,'',C.blue));const H=[0,1,2].map(i=>node(S,820,360+i*180,48,'',C.yellow));
  const E=[];H.forEach((h,j)=>X.forEach((x,i)=>E.push({i,j,e:edge(svg,x,h,C.teal,4)})));
  show([...X,...H],cue(sid,'same'),.4);E.forEach(o=>drawOn(o.e,cue(sid,'same')+.2,.5));
  const outs=H.map(h=>{const e=el(S,'lbl','<span class="mono" style="font-size:34px">0.42</span>',{color:C.ink});place(e,h.cx+120,h.cy);return e});
  show(outs,cue(sid,'output'),.4);
  const grads=H.map(h=>{const e=el(S,'lbl','<span class="mono" style="font-size:30px">grad 0.17</span>',{color:C.pink});place(e,h.cx+130,h.cy+40);return e});
  show(grads,cue(sid,'gradient'),.4);
  const cl=el(S,'abs','',{left:'1180px',top:'360px',width:'680px',fontSize:'44px',fontStyle:'italic',lineHeight:'1.4',opacity:0,visibility:'hidden'});cl.innerHTML='identical weights, identical outputs, identical updates: <span style="color:#f5cf4a">clones</span>';show(cl,cue(sid,'clones'),.5);
  const one=el(S,'abs','',{left:'1180px',top:'560px',width:'680px',fontSize:'38px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});one.innerHTML='the layer acts like one neuron';show(one,cue(sid,'single'),.5);
  // randomness breaks the tie
  const rnd=seedRand(31);const cols=[C.blue,C.red,C.green,C.pink,C.yellow,C.teal];
  E.forEach(o=>{const c=cols[Math.floor(rnd()*cols.length)],w=2+rnd()*6;tl.to(o.e,{attr:{stroke:c,'stroke-width':w},duration:.6},cue(sid,'randomness')+rnd()*.4)});
  tl.to([...outs,...grads,cl,one],{autoAlpha:0,duration:.4},cue(sid,'randomness'));
  const vals=['0.81','0.07','0.55'];const outs2=H.map((h,i)=>{const e=el(S,'lbl',`<span class="mono" style="font-size:34px">${vals[i]}</span>`,{color:C.ink});place(e,h.cx+120,h.cy);return e});
  show(outs2,cue(sid,'breaks'),.4);
  const sp=el(S,'abs','',{left:'1180px',top:'420px',width:'680px',fontSize:'44px',fontStyle:'italic',color:C.green,opacity:0,visibility:'hidden'});sp.innerHTML='random start: symmetry broken, each neuron can specialise';show(sp,cue(sid,'symmetry'),.5);
  sceneInOut(sid);
})();

/* ============ S6: GPT-2 scales its residual layers ============ */
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);
  const res=ln(svg,560,980,560,140,C.teal,8);drawOn(res,cue(sid,'gpt-2'),1);
  const rl=el(S,'lbl','residual path',{color:C.teal,fontSize:'34px',fontStyle:'italic'});place(rl,560,110);show(rl,cue(sid,'residual'),.4);
  const n=6;const B=[];for(let i=0;i<n;i++){const y=880-i*140;const b=boxEl(S,900,y,300,90,'<span class="mono" style="font-size:28px">block</span>',C.blue);B.push(b);
    const a=pth(svg,`M750 ${y} L580 ${y}`,C.yellow,4);B.push(a);drawOn(a,cue(sid,'write')+i*.12,.4)}
  show(B.filter(b=>b.classList&&b.classList.contains('box')),cue(sid,'gpt-2')+.3,.3,{stagger:.08});
  const f=el(S,'abs','',{left:'1150px',top:'300px',width:'720px',textAlign:'center',opacity:0,visibility:'hidden'});f.innerHTML=tex('W_{\\text{out}} \\;\\times\\; \\frac{1}{\\sqrt{N}}',62);show(f,cue(sid,'square'),.6);
  const fn=el(S,'abs','',{left:'1150px',top:'440px',width:'720px',textAlign:'center',fontSize:'34px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});fn.innerHTML='N = number of residual layers';show(fn,cue(sid,'number'),.5);
  const gw=el(S,'abs','',{left:'1150px',top:'560px',width:'720px',textAlign:'center',fontSize:'40px',fontStyle:'italic',opacity:0,visibility:'hidden'});gw.innerHTML='so the stream does not grow as dozens of blocks add to it';show(gw,cue(sid,'grow'),.5);
  const ch=[['initialisation',1270,C.green,cue(sid,'initialisation')],['normalisation',1560,C.ink,cue(sid,'normalisation')],['residual connections',1415,C.ink,cue(sid,'connections')]].map(([t,x,c,tt],i)=>{const e=el(S,'chip',t,{borderColor:c,fontSize:'32px',padding:'8px 24px'});place(e,x,i<2?780:880);show(e,tt,.4);return e});
  sceneInOut(sid);
})();

/* ============ S7: recap ============ */
(function(){const S=$('S7');const sid='s7';
  const a=el(S,'chip','random &nbsp;→&nbsp; breaks symmetry',{borderColor:C.yellow,fontSize:'44px'});place(a,960,360);show(a,cue(sid,'random'),.5);
  const b=el(S,'chip','scaled to the layer &nbsp;→&nbsp; signals neither fade nor explode',{borderColor:C.green,fontSize:'44px'});place(b,960,520);show(b,cue(sid,'scaled'),.5);
  nextCap(S,sid,'next',1,'6.8 &nbsp;normalization: batch norm and layer norm');
  sceneInOut(sid,true);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
