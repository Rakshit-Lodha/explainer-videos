.colv{position:absolute}

.colv .br.l{left:0;border-right:none;border-radius:6px 0 0 6px}

.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}

.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
.ttl{position:absolute;font-size:46px;opacity:0;visibility:hidden;white-space:nowrap}

/* bowl L = a x^2 + b y^2 on a contour map; P maps to pixels */
const BA=1,BB=3;
function bowlMap(svg,cx,cy,s){const P=(u,v)=>[cx+u*s,cy-v*s];
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  [.2,.6,1.2,2,3,4.2,5.6].forEach(l=>{let d='';for(let k=0;k<=90;k++){const t=k/90*2*Math.PI;const p=P(Math.sqrt(l/BA)*Math.cos(t),Math.sqrt(l/BB)*Math.sin(t));d+=(k?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}svgEl('path',{d:d+'Z',fill:'none',stroke:C.grid,'stroke-width':2.5,opacity:.9},g)});
  const m=P(0,0);svgEl('circle',{cx:m[0],cy:m[1],r:7,fill:C.ink},g);return {P,g}}
function descentPath(n,lr,noise,seed,x0,y0){const g=rngN(seed);let x=x0,y=y0;const pts=[[x,y]];
  for(let i=0;i<n;i++){const gx=2*BA*x+noise*g(),gy=2*BB*y+noise*g();x-=lr*gx;y-=lr*gy;pts.push([x,y])}return pts}
function pathEl(svg,P,pts,col,w){const p=svgEl('path',{fill:'none',stroke:col,'stroke-width':w||4,'stroke-linejoin':'round'},svg);
  const px=pts.map(q=>P(q[0],q[1]));const head=svgEl('circle',{r:9,fill:col},svg);
  const render=o=>{const n=Math.max(1,Math.min(px.length,Math.round(o.n)));p.setAttribute('d',polyPath(px.slice(0,n)));head.setAttribute('cx',px[n-1][0]);head.setAttribute('cy',px[n-1][1])};
  const st=state({n:1},render);gsap.set([p,head],{autoAlpha:0});return {p,head,render,st,len:px.length}}

/* ============ S1: the exact gradient needs every example ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const dots=[];let d='';for(let r=0;r<20;r++)for(let c=0;c<40;c++){d+=`M${200+c*22},${260+r*22}h12v12h-12z`}
  const all=svgEl('path',{d,fill:C.blue,'fill-opacity':.75,style:'opacity:0;visibility:hidden'},svg);fadeIn(all,cue(sid,'every')-.3,.6);
  const t1=note(S,'the training set: every example',200,720,900,{fontSize:'38px',color:C.dim});show(t1,cue(sid,'every'),.5);
  const b=el(S,'chip','one exact step = a pass over billions of tokens',{left:'1120px',top:'300px',borderColor:C.red,color:C.red,fontSize:'36px'});show(b,cue(sid,'billions'),.6);
  const sl=note(S,'impossibly slow',1140,400,600,{fontSize:'40px',color:C.red});show(sl,cue(sid,'slow'),.5);
  const rnd=seedRand(12);let ds='';for(let k=0;k<32;k++){const r=Math.floor(rnd()*20),c=Math.floor(rnd()*40);ds+=`M${200+c*22-3},${260+r*22-3}h18v18h-18z`}
  const pick=svgEl('path',{d:ds,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  fadeTo(all,cue(sid,'estimate'),.3,.6);fadeIn(pick,cue(sid,'estimate'),.6);
  const sm=note(S,'estimate it from a small random sample',1140,560,640,{fontSize:'40px',color:C.yellow});show(sm,cue(sid,'sample'),.5);
  sceneInOut(sid);
})();

/* ============ S2: the true gradient is the average pull ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const O=[700,560];const g=rngN(5);const mean=[220,-90];
  const arr=[];for(let i=0;i<36;i++){const v=[mean[0]+g()*120,mean[1]+g()*120];const a=mkArrow(svg,PX,C.blue,3);a.hl=14;setArrow(a,{x0:O[0],y0:O[1],x1:O[0],y1:O[1]});arr.push([a,v])}
  arr.forEach(([a,v],i)=>{const t=cue(sid,'pulls')+i*.05;showArrow(a,t,.15);arrowTo(a,t,.6,{x1:O[0]+v[0],y1:O[1]+v[1]},'power2.out')});
  tl.to(arr.map(x=>x[0].g),{opacity:.35,duration:.5},cue(sid,'true')-.2);
  const av=mkArrow(svg,PX,C.yellow,9);av.hl=30;setArrow(av,{x0:O[0],y0:O[1],x1:O[0],y1:O[1]});
  showArrow(av,cue(sid,'true'),.2);arrowTo(av,cue(sid,'true'),.8,{x1:O[0]+mean[0],y1:O[1]+mean[1]},'power2.out');
  const f=lbl(S,tex('\\nabla L=\\frac{1}{N}\\sum_{i=1}^{N}\\nabla \\ell_i',62),1480,320,{});show(f,cue(sid,'gradient'),.7);
  const n1=note(S,'thin arrows: one example\'s pull',1200,460,640,{fontSize:'38px',color:C.blue});show(n1,cue(sid,'pulls'),.5);
  const n2=note(S,'thick arrow: their average, the true gradient',1200,540,640,{fontSize:'38px',color:C.yellow});show(n2,cue(sid,'true'),.5);
  sceneInOut(sid);
})();

/* ============ S3: stochastic gradient descent ============ */
let SGD_PTS;
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const M=bowlMap(svg,640,560,170);fadeIn(M.g,at(sid,.01),.5);
  const gd=pathEl(svg,M.P,descentPath(40,.06,0,1,-2.2,1.05),C.ink,3);
  SGD_PTS=descentPath(60,.05,3.5,3,-2.2,1.05);
  const sg=pathEl(svg,M.P,SGD_PTS,C.red,4);
  fadeIn([gd.p,gd.head],cue(sid,'stochastic'),.4);drive(gd.st,cue(sid,'stochastic'),2,{n:gd.len},gd.render,'power1.out');
  fadeIn([sg.p,sg.head],cue(sid,'single'),.4);drive(sg.st,cue(sid,'single')+.3,SPAN[sid]*.6,{n:sg.len},sg.render,'none');
  const l1=note(S,'white: exact gradient',1240,260,600,{fontSize:'38px',color:C.ink});show(l1,cue(sid,'stochastic'),.5);
  const l2=note(S,'red: one random example per step',1240,320,600,{fontSize:'38px',color:C.red});show(l2,cue(sid,'single'),.5);
  const n1=note(S,'cheap but noisy, like asking one passer-by for directions',1240,420,600,{fontSize:'38px',color:C.dim});show(n1,cue(sid,'passer-by'),.5);
  const f=lbl(S,tex('\\mathbb{E}\\big[\\nabla \\ell_i\\big]=\\nabla L',58),1540,640,{color:C.yellow});show(f,cue(sid,'expected'),.6);
  const n2=note(S,'on average, the noisy steps point the right way',1240,720,600,{fontSize:'36px',color:C.dim});show(n2,cue(sid,'average'),.5);
  sceneInOut(sid);
})();

/* ============ S4: mini-batches ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const M=bowlMap(svg,640,560,170);fadeIn(M.g,at(sid,.01),.5);
  const sg=pathEl(svg,M.P,SGD_PTS,C.red,3);sg.render({n:SGD_PTS.length});gsap.set([sg.p,sg.head],{autoAlpha:0});
  fadeIn([sg.p,sg.head],at(sid,.02),.4);tl.to([sg.p,sg.head],{opacity:.35,duration:.5},cue(sid,'mini-batch'));
  const mb=pathEl(svg,M.P,descentPath(50,.05,3.5/Math.sqrt(32),9,-2.2,1.05),C.green,5);
  fadeIn([mb.p,mb.head],cue(sid,'average'),.4);drive(mb.st,cue(sid,'average'),5,{n:mb.len},mb.render,'power1.out');
  const l=note(S,'green: average of 32 examples per step',1240,260,600,{fontSize:'38px',color:C.green});show(l,cue(sid,'average'),.5);
  const f=lbl(S,tex('\\text{spread of the estimate}\\;\\propto\\;\\frac{1}{\\sqrt{B}}',48),1540,400,{});show(f,cue(sid,'spread'),.6);
  const c=note(S,'still far cheaper than a pass over all the data',1240,480,600,{fontSize:'38px',color:C.dim});show(c,cue(sid,'cheaper'),.5);
  // parallel lanes
  const lanes=[];for(let i=0;i<8;i++)lanes.push(svgEl('rect',{x:1260,y:640+i*30,width:0,height:20,rx:4,fill:C.teal,'fill-opacity':.8},svg));
  gsap.set(lanes,{autoAlpha:0});fadeIn(lanes,cue(sid,'parallel')-.2,.3);
  tl.to(lanes,{attr:{width:520},duration:1.2,ease:'power1.inOut'},cue(sid,'parallel'));
  const pl=note(S,'a batch is processed in parallel',1260,890,600,{fontSize:'36px',color:C.teal});show(pl,cue(sid,'parallel'),.5);
  sceneInOut(sid);
})();

/* ============ S5: epochs, and noise that helps ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const rnd=seedRand(21);const order=[];for(let i=0;i<48;i++)order.push(i);for(let i=47;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  const cols=[C.blue,C.yellow,C.green,C.pink,C.teal,C.red];
  const cells=order.map((o,k)=>{const r=svgEl('rect',{x:200+(o%24)*34,y:240+Math.floor(o/24)*40,width:26,height:30,rx:4,fill:C.dim,style:'opacity:0;visibility:hidden'},svg);return [r,k]});
  tl.to(cells.map(c=>c[0]),{autoAlpha:1,duration:.15,stagger:.01},cue(sid,'training'));
  // shuffle: colour by batch (8 per batch) in the shuffled order
  cells.forEach(([r,k])=>tl.to(r,{attr:{fill:cols[Math.floor(k/8)]},duration:.3},cue(sid,'shuffled')+Math.floor(k/8)*.35));
  const bl=note(S,'shuffled into mini-batches',200,340,800,{fontSize:'38px',color:C.dim});show(bl,cue(sid,'shuffled'),.5);
  const ep=el(S,'chip','one full pass = one epoch',{left:'1120px',top:'250px',borderColor:C.ink,color:C.ink,fontSize:'38px'});show(ep,cue(sid,'epoch'),.5);
  // a bumpy 1D slice: the jostled ball hops out of a shallow dip
  const A=axes(svg,{x:200,y:500,w:1500,h:380,xmin:0,xmax:10,ymin:0,ymax:4,xticks:[],yaxis:false});
  const f=x=>.4+.035*(x-8)**2+.35*Math.exp(-((x-3.4)**2)/.08)*-1+.3*Math.exp(-((x-3.9)**2)/.1);
  const cv=svgEl('path',{d:farea(A,f,0,10,300),fill:C.yellow,'fill-opacity':.08,stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);fadeIn(cv,cue(sid,'noise')-.3,.5);
  const ball=svgEl('circle',{r:14,fill:C.pink},svg);gsap.set(ball,{autoAlpha:0});
  const xs=[1.2,2.6,3.35,3.3,3.45,3.25,3.5,4.4,5.6,6.8,7.6,8];const jit=[0,0,0,.22,.3,.18,.35,.1,0,0,0,0];
  const render=o=>{const k=Math.min(xs.length-2,Math.floor(o.i)),t=o.i-k;const x=xs[k]+(xs[k+1]-xs[k])*t;const j=(jit[k]+(jit[k+1]-jit[k])*t)*Math.abs(Math.sin(o.i*Math.PI*2));
    ball.setAttribute('cx',A.X(x));ball.setAttribute('cy',A.Y(f(x)+j)-14)};
  const st=state({i:0},render);fadeIn(ball,cue(sid,'noise'),.4);
  drive(st,cue(sid,'jostles'),SPAN[sid]-(cue(sid,'jostles')-START[sid])-1,{i:xs.length-1},render,'none');
  const sd=lbl(S,'shallow dip',A.X(3.4),A.Y(f(3.4))+50,{fontSize:'32px',fontStyle:'italic',color:C.dim});show(sd,cue(sid,'shallow'),.4);
  const es=note(S,'noise can jostle the parameters out of it',1120,340,640,{fontSize:'38px',color:C.pink});show(es,cue(sid,'escape'),.5);
  sceneInOut(sid);
})();

/* ============ S6: LLMs train on batches of token sequences ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const words=[['the','cat','sat','on','the','mat'],['a','loss','is','a','landscape','.'],['we','step','against','the','gradient','.'],['noise','can','help','us','escape','.']];
  const cells=[];words.forEach((row,r)=>row.forEach((w,c)=>{const d=el(S,'abs',w,{left:(360+c*190)+'px',top:(250+r*90)+'px',width:'170px',height:'66px',lineHeight:'66px',textAlign:'center',fontSize:'34px',fontStyle:'italic',border:'2px solid #58c4dd',borderRadius:'10px',opacity:0,visibility:'hidden'});cells.push(d)}));
  tl.to(cells,{autoAlpha:1,duration:.15,stagger:.03},cue(sid,'batches'));
  const bt=lbl(S,tex('\\text{batch}\\;(B\\times T)',46),960,660,{color:C.blue});show(bt,cue(sid,'sequences'),.5);
  const nc=note(S,'not the whole corpus at once',560,720,800,{fontSize:'38px',color:C.dim,textAlign:'center'});show(nc,cue(sid,'corpus'),.5);
  nextUp(S,'4.5 &nbsp;momentum and Adam',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
