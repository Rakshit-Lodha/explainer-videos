  const x0=200,w=26,gap=8,base=760,sc=1000;
  const B=bars(S,x0,base,P,{scale:sc,w,gap,color:C.teal});tl.to(B,{autoAlpha:1,duration:.12,stagger:.02},cue(sid,'vocabulary'));
  const z=ln(svg,x0-6,base,x0+n*(w+gap),base,C.axis,2);fadeIn(z,cue(sid,'vocabulary'),.3);
  tl.to(B.slice(k),{backgroundColor:C.red,duration:.4},cue(sid,'tail'));
  const tb=lab(S,`the long tail: together ${Math.round(tail*100)}% of the probability`,x0+(k+n)/2*(w+gap),base-200,C.red,30);show(tb,cue(sid,'together'),.4);
  const kx=x0+k*(w+gap)-gap/2;const kl=ln(svg,kx,base+30,kx,280,C.yellow,3,{'stroke-dasharray':'8 6'});fadeIn(kl,cue(sid,'top'),.3);
  const kt=lab(S,`top-k, k = ${k}`,kx-90,260,C.yellow,30,false);show(kt,cue(sid,'top'),.4);
  tl.to(B.slice(k),{opacity:.12,duration:.4},cue(sid,'sets'));
  const inf=lab(S,'−∞',x0+(k+n)/2*(w+gap),base+50,C.red,32,false);show(inf,cue(sid,'minus'),.3);
  const keep=P.slice(0,k).reduce((a,b)=>a+b);tl.to(B.slice(0,k),{scaleY:1/keep,backgroundColor:C.yellow,duration:.7,ease:'power2.inOut'},cue(sid,'renormalises'));
  const rn=lab(S,'renormalised to sum to 1',x0+k*(w+gap)/2+20,200,C.yellow,28);show(rn,cue(sid,'renormalises'),.4);
  tl.to(tb,{autoAlpha:0,duration:.3},cue(sid,'nucleus'));
  const px=x0+np*(w+gap)-gap/2;const pl=ln(svg,px,base+30,px,360,C.pink,3,{'stroke-dasharray':'8 6'});fadeIn(pl,cue(sid,'nucleus'),.3);
  const pt=lab(S,`top-p, p = 0.8: the smallest set reaching 80% (${np} tokens here)`,px+40,380,C.pink,28);pt.style.translate='0 -50%';show(pt,cue(sid,'total'),.4);
  const ad=lab(S,'the cut adapts to how confident the model is',1200,900,C.ink,30);show(ad,cue(sid,'adapts'),.4);
  sceneInOut(sid);
})();

/* ============ S7: context window and stopping ============ */
(function(){const S=$('S7');const sid='s7';
  const txt='hello world hello world hello'.split('');const slot=60,x0=130,y=540,win=16;
  const ch=txt.map((c,i)=>{const d=el(S,'abs mono',c===' '?'␣':c,{left:(x0+i*slot)+'px',top:(y-30)+'px',width:(slot-8)+'px',height:'60px',lineHeight:'60px',textAlign:'center',fontSize:'30px',border:'2px solid #2a3442',borderRadius:'8px',background:'#11161e',color:C.ink,opacity:0,visibility:'hidden'});return d});
  const n0=18;tl.to(ch.slice(0,n0),{autoAlpha:1,duration:.15,stagger:.03},at(sid,0));
  const W=el(S,'hl','',{left:(x0+(n0-win)*slot-8)+'px',top:(y-42)+'px',width:(win*slot+8)+'px',height:'84px',borderColor:C.yellow,borderWidth:'4px'});fadeIn(W,cue(sid,'context'),.3);
  const wl=lab(S,'context window: the model reads only these',x0+(n0-win/2)*slot,420,C.yellow,30);show(wl,cue(sid,'window'),.4);
  for(let j=0;j<5;j++){const t=cue(sid,'recent')+j*.7;show(ch[n0+j],t,.25);tl.to(W,{x:(j+1)*slot,duration:.3},t);tl.to(wl,{x:(j+1)*slot,duration:.3},t)}
  const dim=ch.slice(0,7);tl.to(dim,{opacity:.25,duration:.4},cue(sid,'recent')+3.5);
  const end=el(S,'abs mono','&lt;|endoftext|&gt;',{left:(x0+(n0+5)*slot+10)+'px',top:(y-30)+'px',height:'60px',lineHeight:'60px',padding:'0 14px',fontSize:'24px',border:'2px solid '+C.red,borderRadius:'8px',background:'#1e1214',color:C.red,fontVariantLigatures:'none',opacity:0,visibility:'hidden'});
  show(end,cue(sid,'end'),.4);const el1=lab(S,'stop at a special end-of-text token',960,700,C.red,32);show(el1,cue(sid,'special'),.4);
  const el2=lab(S,'or at a length limit',960,760,C.dim,30);show(el2,cue(sid,'length'),.4);
  sceneInOut(sid);
})();

/* ============ S8: the whole GPT ============ */
(function(){const S=$('S8');const sid='s8';const svg=layerSvg(S);
  const steps=[['characters',C.dim],['ids',C.dim],['embeddings + positions',C.blue],['blocks',C.pink],['logits',C.yellow],['sample',C.green],['character',C.dim]];
  const xs=[150,370,640,920,1150,1380,1630];
  steps.forEach(([t,c],i)=>{const b=boxEl(S,xs[i],420,i===2?280:180,80,`<span style="font-size:26px">${t}</span>`,c);show(b,cue(sid,'characters')+i*.25,.3);
    if(i){const a=arrowR(svg,xs[i-1]+(i-1===2?140:90),420,xs[i]-(i===2?140:90),C.dim);showArrowR(a,cue(sid,'characters')+i*.25)}});
  const lp=pth(svg,'M1630 465 L1630 560 L150 560 L150 465',C.dim,3);drawOn(lp,cue(sid,'back'),.8);
  const gpt=lab(S,'our small GPT, complete',890,280,C.ink,38,false);show(gpt,cue(sid,'complete'),.4);
  const noise=el(S,'abs mono','hwlo d eorlwhh ol rdew',{left:'560px',top:'650px',width:'800px',textAlign:'center',fontSize:'40px',color:C.red,opacity:0,visibility:'hidden'});show(noise,cue(sid,'random'),.4);
  const nl=lab(S,'random weights: what it writes is noise',960,740,C.dim,30);show(nl,cue(sid,'noise'),.4);
  nextCap(S,sid,'next',1,'10.1 &nbsp;pretraining and scaling laws');
  sceneInOut(sid,true);
})();

/* KaTeX stacks glyphs on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
