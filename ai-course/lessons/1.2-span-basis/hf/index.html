/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;

/* transformable grid: lines in grid units, redrawn through a 2x2 matrix [a b; c d] (columns = images of i-hat, j-hat) */
function tgrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const lines=[];
  for(let k=-n;k<=n;k++){
    lines.push({p:[k,-n],q:[k,n],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)});
    lines.push({p:[-n,k],q:[n,k],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)})}
  const T={g,lines,P,m:{a:1,b:0,c:0,d:1}};
  T.apply=(m)=>{T.m={a:m.a,b:m.b,c:m.c,d:m.d};for(const L of lines){const A=P(m.a*L.p[0]+m.b*L.p[1],m.c*L.p[0]+m.d*L.p[1]),B=P(m.a*L.q[0]+m.b*L.q[1],m.c*L.q[0]+m.d*L.q[1]);
    L.e.setAttribute('x1',A[0]);L.e.setAttribute('y1',A[1]);L.e.setAttribute('x2',B[0]);L.e.setAttribute('y2',B[1])}};
  T.apply(T.m);return T}
/* the whole picture (grid + arrows defined in source coordinates) moves under one matrix tween */
function mkScene(P){const S={P,grids:[],arrows:[],dots:[],m:{a:1,b:0,c:0,d:1},extra:[]};
  S.apply=(m)=>{S.m={a:m.a,b:m.b,c:m.c,d:m.d};S.grids.forEach(g=>g.apply(m));
    S.arrows.forEach(([ar,x,y])=>geom(ar,0,0,m.a*x+m.b*y,m.c*x+m.d*y));
    S.dots.forEach(([e,x,y])=>{const p=P(m.a*x+m.b*y,m.c*x+m.d*y);e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1])});
    S.extra.forEach(f=>f(m))};

})();

/* ============ S7: a layer's output is a linear combination ============ */
(function(){const S=$('S7');const sid='s7';
  const svg=layerSvg(S);
  // a neuron: weighted sum of inputs
  const ins=[[220,340,'x_1'],[220,520,'x_2'],[220,700,'x_3']];const out=[660,520];
  const ws=['w_1','w_2','w_3'];
  ins.forEach(([x,y,t],k)=>{const c=svgEl('circle',{cx:x,cy:y,r:44,fill:'#141a22',stroke:C.blue,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
    const l=svgEl('line',{x1:x+44,y1:y,x2:out[0]-84,y2:out[1],stroke:C.yellow,'stroke-width':3+k,style:'opacity:0;visibility:hidden'},svg);
    const lb=el(S,'abs hid',tex(t,40),{left:(x-40)+'px',top:(y-30)+'px',width:'80px',textAlign:'center'});
    const wl=el(S,'abs hid',tex(ws[k],34),{left:((x+out[0])/2-60)+'px',top:((y+out[1])/2-(k===2?-8:62))+'px',width:'80px',textAlign:'center',color:C.yellow});
    fadeIn([c,lb],cue(sid,'layer')-.4+k*.12,.4);fadeIn([l,wl],cue(sid,'weighted')+k*.12,.4)});
  const oc=svgEl('circle',{cx:out[0],cy:out[1],r:84,fill:'#141a22',stroke:C.pink,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
  const ol=el(S,'abs hid',tex('\\textstyle\\sum_i w_i x_i',34),{left:(out[0]-80)+'px',top:(out[1]-30)+'px',width:'160px',textAlign:'center',color:C.pink});
  fadeIn([oc,ol],cue(sid,'number'),.5);
  const r1=el(S,'abs hid','each output number: a weighted sum, learned weights as the recipe',{left:'120px',top:'820px',width:'760px',textAlign:'center',fontSize:'38px',fontStyle:'italic'});
  show(r1,cue(sid,'linear'),.5);
  // the other way round: output vector = x1 a1 + x2 a2 + x3 a3, inside the span of the columns
  const Q=plane(1330,620,80);const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  drawGrid(g,Q,-5,6,-4,4);
  fadeIn(g,cue(sid,'other'),.6);
  const A=[[2,.5],[-.5,1.5],[1,-1]],cols=[C.blue,C.yellow,C.green];
  const ar=A.map((c,k)=>mkArrow(svg,Q,cols[k],6));
  const tot=mkArrow(svg,Q,C.pink,8);
  const X=o=>{let x=0,y=0;[o.x1,o.x2,o.x3].forEach((s,k)=>{const nx=x+s*A[k][0],ny=y+s*A[k][1];geom(ar[k],x,y,nx,ny);x=nx;y=ny});geom(tot,0,0,x,y)};
  X({x1:1,x2:1,x3:1});
  tl.to(ar.map(a=>a.g).concat([tot.g]),{autoAlpha:1,duration:.5,stagger:.15},cue(sid,'fixed'));
  anim(cue(sid,'land'),1.6,{x1:1,x2:1,x3:1},{x1:.5,x2:1.5,x3:-.5},X);
  anim(cue(sid,'land')+1.8,1.6,{x1:.5,x2:1.5,x3:-.5},{x1:1.5,x2:.3,x3:1.2},X);
  const r2=el(S,'abs hid','the output can only land inside the span of these arrows',{left:'1000px',top:'975px',width:'820px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.pink});
  show(r2,cue(sid,'span'),.5);
  const r3=el(S,'abs hid','embeddings: hundreds of dimensions of room',{left:'1000px',top:'200px',width:'820px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.dim});
  show(r3,cue(sid,'embedding'),.5);
  sceneInOut(sid);
})();

/* ============ S8: summary and next ============ */
(function(){const S=$('S8');const sid='s8';
  const rows=[['linear combination','a recipe of scaled arrows',C.pink,'linear'],['span','everywhere the recipes can reach',C.blue,'span'],['basis','a smallest set that reaches everywhere',C.yellow,'basis']];
  rows.forEach(([a,b,col,w],i)=>{const d=el(S,'abs hid',`<span style="display:inline-block;width:520px;text-align:right;color:${col}">${a}</span>&nbsp;&nbsp;<span style="font-style:italic">${b}</span>`,{left:'140px',top:(240+i*150)+'px',width:'1640px',fontSize:'52px'});show(d,cue(sid,w),.6)});
  const m=el(S,'abs hid','a matrix records where î and ĵ land',{left:'0',top:'720px',width:'1920px',textAlign:'center',fontSize:'46px',fontStyle:'italic',color:C.ink});
  show(m,cue(sid,'matrix'),.6);
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.3 &nbsp;matrices as transformations of space',{top:'900px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'transformed'),.7);
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();


/* KaTeX stacks glyphs (hats, sub/superscripts) on purpose */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
