  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}
function texAt(S,s,size,x,y,color){const d=el(S,'lbl',tex(s,size),{color:color||C.ink});place(d,x,y);return d}
/* a residual block drawn bottom-to-top around column cx; yb is the input's y */
function resBlock(S,svg,cx,yb,o){o=o||{};const w=o.w||240,sx=o.sx||220;
  const xl=lab(S,'x',cx,yb,C.blue,40,false);
  const main=pth(svg,`M${cx} ${yb-30} L${cx} ${yb-135}`,C.dim,4);
  const b1=boxEl(S,cx,yb-170,w,70,'<span style="font-size:30px">layer</span>',C.yellow),b2=boxEl(S,cx,yb-310,w,70,'<span style="font-size:30px">layer</span>',C.yellow);
  const mid=pth(svg,`M${cx} ${yb-205} L${cx} ${yb-275}`,C.dim,4),top=pth(svg,`M${cx} ${yb-345} L${cx} ${yb-414}`,C.dim,4);
  const plus=node(S,cx,yb-440,26,'+',C.teal,30);
  const out=pth(svg,`M${cx} ${yb-466} L${cx} ${yb-540}`,C.dim,4),oh=arrowHead(svg,cx,yb-545,0,-1,C.dim);
  const ol=lab(S,'x + F(x)',cx,yb-580,C.ink,36,false);
  const sc=pth(svg,`M${cx} ${yb-60} L${cx+sx} ${yb-60} L${cx+sx} ${yb-440} L${cx+32} ${yb-440}`,C.teal,5);const sh=arrowHead(svg,cx+30,yb-440,-1,0,C.teal);
  const Fl=lab(S,'F(x)',cx-w/2-70,yb-240,C.yellow,34,false);
  return {xl,main,b1,b2,mid,top,plus,out,oh,ol,sc,sh,Fl,cx,yb,sx}}
function showLayers(R,t){show(R.xl,t,.4);[R.main,R.mid,R.top].forEach(p=>drawOn(p,t,.4));show([R.b1,R.b2],t,.4)}
function showShortcut(R,t){drawOn(R.sc,t,.8);fadeIn(R.sh,t+.7,.2);show(R.plus,t+.6,.3);drawOn(R.out,t+.8,.3);fadeIn(R.oh,t+1,.2)}
function showAllBlock(R,t){showLayers(R,t);showShortcut(R,t);show(R.ol,t,.4);show(R.Fl,t,.4)}

/* ============ S1: deeper was worse ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const mk=(y,n,dashed)=>[...Array(n)].map((_,i)=>{const b=el(S,'abs','',{left:(150+i*90)+'px',top:(y-25)+'px',width:'74px',height:'50px',borderRadius:'8px',border:(i>=4?'2px dashed '+C.dim:'2px solid '+C.blue),background:'#11161e',opacity:0,visibility:'hidden'});return b});
  const A=mk(360,4),B=mk(560,7);
  tl.to(A,{autoAlpha:1,duration:.2,stagger:.06},cue(sid,'shallower'));tl.to(B.slice(0,4),{autoAlpha:1,duration:.2,stagger:.06},cue(sid,'deeper'));
  const al=lab(S,'shallower',330,300,C.blue,30),bl=lab(S,'deeper',330,500,C.blue,30);show(al,cue(sid,'shallower'),.4);show(bl,cue(sid,'deeper'),.4);
  tl.to(B.slice(4),{autoAlpha:1,duration:.2,stagger:.1},cue(sid,'extra'));
  const il=lab(S,'extra layers could just pass their input through',470,640,C.dim,28);show(il,cue(sid,'pass'),.4);
  const P=plane(980,800,100,90);const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:980,y1:800,x2:1790,y2:800,stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:980,y1:800,x2:980,y2:330,stroke:C.axis,'stroke-width':3},ax);fadeIn(ax,cue(sid,'found'),.4);
  const yl=lab(S,'training error',1060,310,C.dim,28);fadeIn(yl,cue(sid,'found'),.4);const xl=lab(S,'iterations',1380,840,C.dim,28);fadeIn(xl,cue(sid,'found'),.4);
  const who=lab(S,'He, Zhang, Ren and Sun, 2015',1380,240,C.dim,30);show(who,cue(sid,'kaiming'),.4);
  const r=pth(svg,fpath(x=>3.6*Math.exp(-.4*x)+1.15,P,0,8,120),C.red,5),b=pth(svg,fpath(x=>3.6*Math.exp(-.5*x)+.6,P,0,8,120),C.blue,5);
  drawOn(r,cue(sid,'fifty-six'),1.2);drawOn(b,cue(sid,'twenty'),1.2);
  const rl=lab(S,'56 layers',1720,P(0,1.33)[1]-28,C.red,30,false),bll=lab(S,'20 layers',1720,P(0,.73)[1]+30,C.blue,30,false);show(rl,cue(sid,'fifty-six'),.4);show(bll,cue(sid,'twenty'),.4);
  const no=lab(S,'not overfitting: training error itself is worse',1380,900,C.red,30);show(no,cue(sid,'overfitting'),.4);
  const op=lab(S,'deeper networks were simply harder to optimise',1380,955,C.ink,30);show(op,cue(sid,'optimise'),.4);
  sceneInOut(sid);
})();

/* ============ S2: x + F(x) ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const R=resBlock(S,svg,640,920);showLayers(R,cue(sid,'block'));show(R.Fl,cue(sid,'block'),.4);
  showShortcut(R,cue(sid,'add'));show(R.ol,cue(sid,'computes'),.4);
  const sl=lab(S,'shortcut',R.cx+R.sx+70,700,C.teal,30);show(sl,cue(sid,'add'),.4);
  const f=texAt(S,'y=x+F(x)',62,1400,300);show(f,cue(sid,'computes'),.5);
  const rl=lab(S,'F: the residual, the change to make',1400,390,C.yellow,32);show(rl,cue(sid,'residual',2),.4);
  const doc=el(S,'abs','',{left:'1150px',top:'470px',width:'520px',padding:'26px 30px',borderRadius:'12px',border:'2px solid #2a3442',background:'#11161e',fontSize:'32px',lineHeight:'1.6',opacity:0,visibility:'hidden'});
  doc.innerHTML='The model <span style="color:#fc6255;text-decoration:line-through">learn</span> <span style="color:#83c167;text-decoration:underline">learns</span> the change,<br>not the whole page.';show(doc,cue(sid,'tracked'),.5);
  const dl=lab(S,'tracked changes, not retyping',1410,700,C.dim,28);show(dl,cue(sid,'tracked'),.4);
  tl.to([R.b1,R.b2],{opacity:.35,duration:.4},cue(sid,'nothing'));
  const z=lab(S,'F(x) = 0',R.cx-200,R.yb-385,C.yellow,32,false);show(z,cue(sid,'zero'),.4);
  tl.to(R.sc,{attr:{'stroke-width':9},duration:.4},cue(sid,'straight'));
  const st=lab(S,'the block passes its input straight through',1410,800,C.teal,32);show(st,cue(sid,'passes'),.4);
  sceneInOut(sid);
})();

/* ============ S3: a direct path for the gradient ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const R=resBlock(S,svg,560,920);showAllBlock(R,at(sid,0));
  const f1=texAt(S,'\\frac{\\partial (a+b)}{\\partial a}=1',50,1380,250);show(f1,cue(sid,'addition'),.5);
  const f2=texAt(S,'\\frac{\\partial y}{\\partial x}=1+\\frac{\\partial F}{\\partial x}',50,1380,370);show(f2,cue(sid,'directly'),.5);
  const g1=pth(svg,`M${R.cx-14} ${R.yb-466} L${R.cx-14} ${R.yb-40}`,C.pink,3);drawOn(g1,cue(sid,'layers'),1);
  const g2=pth(svg,`M${R.cx+40} ${R.yb-452} L${R.cx+R.sx+18} ${R.yb-452} L${R.cx+R.sx+18} ${R.yb-48} L${R.cx+14} ${R.yb-48}`,C.pink,8);drawOn(g2,cue(sid,'shortcut'),1);
  const gh=arrowHead(svg,R.cx+12,R.yb-48,-1,0,C.pink);fadeIn(gh,cue(sid,'shortcut')+.9,.2);
  const gl=lab(S,'gradient',R.cx+R.sx+90,R.yb-470,C.pink,30);show(gl,cue(sid,'gradient',2),.4);
  tl.to(g1,{opacity:.15,duration:.6},cue(sid,'tiny'));
  const tl1=lab(S,'through the layers: may become tiny',R.cx-250,R.yb-120,C.dim,26);show(tl1,cue(sid,'tiny'),.4);
  const tl2=lab(S,'along the shortcut: back intact',R.cx+R.sx+20,R.yb+0,C.pink,28);place(tl2,R.cx+R.sx-20,R.yb-15);show(tl2,cue(sid,'intact'),.4);
  const stack=[0,1,2,3,4,5].map(i=>{const b=boxEl(S,1380,880-i*72,220,54,'<span style="font-size:24px">block</span>',C.yellow);show(b,cue(sid,'every')+i*.05,.3);return b});
  const sp=pth(svg,'M1530 470 L1530 900',C.pink,6),sph=arrowHead(svg,1530,906,0,1,C.pink);drawOn(sp,cue(sid,'however'),.8);fadeIn(sph,cue(sid,'however')+.7,.2);
  const ul=lab(S,'every block gets a usable signal',1430,960,C.pink,30);show(ul,cue(sid,'usable'),.4);
  sceneInOut(sid);
})();

/* ============ S4: shapes must match ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const X=el(S,'abs','',{left:'220px',top:'300px',width:'220px',height:'220px',border:'3px solid '+C.blue,borderRadius:'6px',background:'#11161e',opacity:0,visibility:'hidden'});show(X,at(sid,0),.4);
  const xl=lab(S,'x: 56 × 56 × 64',330,262,C.blue,30,false);show(xl,at(sid,0),.4);
  const F=[...Array(6)].map((_,i)=>el(S,'abs','',{left:(800+i*10)+'px',top:(360-i*10)+'px',width:'110px',height:'110px',border:'3px solid '+C.yellow,borderRadius:'5px',background:i?'#11161e':'#1d1f17',opacity:0,visibility:'hidden'})).reverse();show(F,at(sid,0),.4);
  const fl=lab(S,'F(x): 28 × 28 × 128',880,262,C.yellow,30,false);show(fl,at(sid,0),.4);
  const plus=node(S,1250,420,30,'+',C.teal,34);show(plus,cue(sid,'same'),.3);
  const a1=pth(svg,'M980 420 L1214 420',C.dim,4);drawOn(a1,cue(sid,'same'),.4);
  const bad=lab(S,'✗ different shapes cannot be added',1250,300,C.red,32,false);show(bad,cue(sid,'cannot'),.4);
  const sc=pth(svg,'M330 525 L330 800 L1250 800 L1250 456',C.teal,5);drawOn(sc,cue(sid,'shortcut'),.8);
  const pj=boxEl(S,760,800,320,80,'<span style="font-size:28px">1 × 1 conv, stride 2</span>',C.teal);show(pj,cue(sid,'projection'),.4);
  const pl=lab(S,'a small projection on the shortcut',760,890,C.teal,30);show(pl,cue(sid,'projection'),.4);
  tl.to(bad,{autoAlpha:0,duration:.3},cue(sid,'match'));
  const good=lab(S,'✓ the shapes match again',1250,300,C.green,32,false);show(good,cue(sid,'match'),.4);
  sceneInOut(sid);
})();

/* ============ S5: depth becomes a choice ============ */
(function(){const S=$('S5');const sid='s5';
  const mkStack=(x,w,h,col,stripe)=>el(S,'abs','',{left:x+'px',top:(900-h)+'px',width:w+'px',height:h+'px',borderRadius:'4px',background:`repeating-linear-gradient(0deg,${col} 0 ${stripe}px,#0e1116 ${stripe}px ${stripe*2}px)`,transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});
  const A=mkStack(420,260,440,C.blue,2);gsap.set(A,{scaleY:0});fadeIn(A,cue(sid,'hundred'),.05);tl.to(A,{scaleY:1,duration:1.2,ease:'power2.out'},cue(sid,'hundred'));
  const al=lab(S,'over a hundred layers',550,950,C.blue,32);show(al,cue(sid,'hundred'),.4);
  const iw=lab(S,'won ImageNet, 2015',550,400,C.yellow,34);show(iw,cue(sid,'imagenet'),.4);
  const B=mkStack(1180,260,700,C.teal,1);gsap.set(B,{scaleY:0});fadeIn(B,cue(sid,'thousand'),.05);tl.to(B,{scaleY:1,duration:1.4,ease:'power2.out'},cue(sid,'thousand'));
  const bl=lab(S,'more than a thousand layers, on a smaller dataset',1310,950,C.teal,30);show(bl,cue(sid,'thousand'),.4);
  const cap=el(S,'cap','depth became something a designer could simply choose',{top:'120px',fontSize:'42px',fontStyle:'italic',color:C.ink});show(cap,cue(sid,'liability'),.5);
  sceneInOut(sid);
})();

/* ============ S6: the residual stream ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const X=520;const st=ln(svg,X,960,X,130,C.teal,8);drawOn(st,cue(sid,'transformer'),1);
  const ys=[830,640,450,260],names=[['attention',C.blue],['feed-forward',C.pink],['attention',C.blue],['feed-forward',C.pink]];
  const plus=[],boxes=[];
  ys.forEach((y,i)=>{const [n,c]=names[i];const b=boxEl(S,840,y,260,70,`<span style="font-size:30px">${n}</span>`,c);boxes.push(b);
    const rd=pth(svg,`M${X} ${y+45} L660 ${y+45} L660 ${y} L705 ${y}`,C.dim,3),wr=pth(svg,`M975 ${y} L1030 ${y} L1030 ${y-60} L${X+30} ${y-60}`,C.dim,3);
    const p=node(S,X,y-60,24,'+',C.teal,28);plus.push(p);
    const t=cue(sid,'reads')+i*.25;drawOn(rd,t,.4);show(b,t+.2,.3);drawOn(wr,cue(sid,'adds')+i*.2,.4);show(p,cue(sid,'adds')+i*.2+.3,.3)});
  tl.to(boxes.filter((b,i)=>i%2===0),{boxShadow:'0 0 26px #58c4ddaa',duration:.3},cue(sid,'attention'));
  tl.to(boxes.filter((b,i)=>i%2===1),{boxShadow:'0 0 26px #e77fb3aa',duration:.3},cue(sid,'feed-forward'));
  const vl=lab(S,'token vectors',X,1000,C.teal,30);show(vl,cue(sid,'token'),.4);
  const rs=lab(S,'the residual stream',X,95,C.teal,36,false);show(rs,cue(sid,'stream'),.4);
  tl.to(plus,{boxShadow:'0 0 26px #5cd0b3',duration:.3,stagger:.15},cue(sid,'writing'));
  const wl=lab(S,'each block writes its update into the stream',1480,450,C.ink,32);show(wl,cue(sid,'writing'),.4);
  const wo=lab(S,'without it, models dozens of blocks deep would be very hard to train',1480,560,C.dim,28);show(wo,cue(sid,'without'),.4);
  sceneInOut(sid);
})();

/* ============ S7: recap ============ */
(function(){const S=$('S7');const sid='s7';const svg=layerSvg(S);
  const R=resBlock(S,svg,640,850);showAllBlock(R,at(sid,0));
  const f=texAt(S,'y=x+F(x)',58,1400,330);show(f,cue(sid,'adds'),.5);
  const l1=lab(S,'the layers learn only the change',1400,440,C.yellow,34);show(l1,cue(sid,'change'),.4);
  tl.to(R.sc,{attr:{stroke:C.pink,'stroke-width':9},duration:.4},cue(sid,'direct'));
  const l2=lab(S,'gradients get a direct path home',1400,510,C.pink,34);show(l2,cue(sid,'direct'),.4);
  nextCap(S,sid,'next',1,'9.1 &nbsp;tokens: how text becomes tokens');
  sceneInOut(sid,true);
})();
