/* AI from Scratch house look: 3Blue1Brown-inspired number plane on near-black */
:root{--bg:#0e1116;--grid:#2a6f97;--axis:#c9d3e0;--ink:#e8edf3;--dim:#7f8b99;

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Newsreader',Georgia,serif;color:var(--ink);
  background:radial-gradient(ellipse 80% 75% at 45% 50%,#141a22 0%,#0e1116 60%,#0a0c10 100%)}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;visibility:hidden}
.abs{position:absolute}
.hid{opacity:0;visibility:hidden}

.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:52px;opacity:0;visibility:hidden}
.colv{position:absolute}
.colv .br{position:absolute;top:0;width:18px;border:4px solid currentColor}
.colv .br.l{left:0;border-right:none;border-radius:6px 0 0 6px}
.colv .br.r{right:0;border-left:none;border-radius:0 6px 6px 0}
.colv .cell{position:absolute;left:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace}
.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
/* module 9 additions: token boxes, matrices, bars */
.tok{position:absolute;padding:6px 16px;border:2px solid;border-radius:12px;white-space:nowrap;font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1.25}
.mat{position:absolute}
.mc{position:absolute;text-align:center;border:1px solid;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--ink)}
.bar{position:absolute;border-radius:6px 6px 0 0}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
</style>

    row.push(el(box,'mc',v,{left:c*cw+'px',top:r*ch+'px',width:cw+'px',height:ch+'px',lineHeight:ch+'px',fontSize:(o.fs||Math.round(Math.min(cw,ch)*.4))+'px',background:bg,borderColor:o.line||'rgba(201,211,224,0.28)'}))}cells.push(row)}
  return {box,cells,cx,cy,W,H,cw,ch,x0:cx-W/2,y0:cy-H/2,R,K}}
/* highlight box around a block of matrix cells */
function matHL(parent,m,r0,c0,r1,c1,color){return el(parent,'hl','',{left:(m.x0+c0*m.cw-5)+'px',top:(m.y0+r0*m.ch-5)+'px',width:((c1-c0+1)*m.cw+10)+'px',height:((r1-r0+1)*m.ch+10)+'px',borderColor:color,boxShadow:`0 0 20px ${color}66`})}
/* quadratic curve with optional arrow head, drawn on with a dash offset */
function curve(svg,x0,y0,x1,y1,o){o=o||{};const b=o.bend==null?-60:o.bend,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;
  const qx=(x0+x1)/2-dy/L*b,qy=(y0+y1)/2+dx/L*b;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const p=svgEl('path',{d:`M${x0},${y0} Q${qx},${qy} ${x1},${y1}`,fill:'none',stroke:o.color||C.blue,'stroke-width':o.w||4,'stroke-linecap':'round','stroke-opacity':o.op==null?1:o.op},g);
  const len=Math.max(1,p.getTotalLength());p.setAttribute('stroke-dasharray',len);p.setAttribute('stroke-dashoffset',len);
  let head=null;if(o.head!==false){const tx=x1-qx,ty=y1-qy,tL=Math.hypot(tx,ty)||1,ux=tx/tL,uy=ty/tL,hl=o.hl||18,hw=hl*.55,bx=x1-ux*hl,by=y1-uy*hl;
    head=svgEl('polygon',{points:`${x1},${y1} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`,fill:o.color||C.blue,'fill-opacity':o.op==null?1:o.op,opacity:0},g)}
  return {g,p,len,head}}
function drawCurve(c,time,d){tl.to(c.g,{autoAlpha:1,duration:.15},time);tl.to(c.p,{attr:{'stroke-dashoffset':0},duration:d||.8,ease:'power2.out'},time);if(c.head)tl.to(c.head,{opacity:1,duration:.2},time+(d||.8)*.8)}
/* vertical bars (values 0..1) with a baseline at yBase; setBars tweens to new values */
function bars(parent,x0,yBase,vals,o){o=o||{};const bw=o.bw||60,gap=o.gap||22,Hm=o.h||300;
  const B={bw,gap,Hm,v:vals.slice(),items:[]};
  vals.forEach((v,i)=>{const x=x0+i*(bw+gap);
    const b=el(parent,'bar hid','',{left:x+'px',top:(yBase-Hm)+'px',width:bw+'px',height:Hm+'px',background:(o.colors?o.colors[i]:o.color)||C.blue,transformOrigin:'50% 100%'});
    gsap.set(b,{scaleY:Math.max(.002,v)});
    let t=null;if(o.values!==false){t=el(parent,'lbl mono',fmt(v,2),{color:C.ink,fontSize:(o.vfs||24)+'px'});place(t,x+bw/2,yBase-18);gsap.set(t,{y:-Hm*v})}
    let lb=null;if(o.labels){lb=el(parent,'lbl mono',o.labels[i],{color:o.lcol||C.ink,fontSize:(o.lfs||30)+'px'});place(lb,x+bw/2,yBase+30)}
    B.items.push({b,t,lb})});
  return B}
function barEls(B){const a=[];B.items.forEach(it=>{a.push(it.b);if(it.t)a.push(it.t);if(it.lb)a.push(it.lb)});return a}
function setBars(B,time,d,vals){const from=B.v.slice(),p={k:0};
  tl.to(p,{k:1,duration:d,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{B.items.forEach((it,i)=>{const v=from[i]+(vals[i]-from[i])*p.k;
    gsap.set(it.b,{scaleY:Math.max(.002,v)});if(it.t){gsap.set(it.t,{y:-B.Hm*v});it.t.textContent=fmt(v,2)}})}},time);B.v=vals.slice()}
function softmaxJS(xs,T){T=T||1;const m=Math.max(...xs);const e=xs.map(x=>Math.exp((x-m)/T));const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
/* type out the characters of an element's text, one span per character */
function typeIn(d,time,per){const s=d.textContent;d.innerHTML=s.split('').map(ch=>`<span class="ch" style="opacity:0;visibility:hidden">${ch===' '?'&nbsp;':ch}</span>`).join('');
  tl.to(d.querySelectorAll('.ch'),{autoAlpha:1,duration:.04,stagger:per||.05,ease:'none'},time)}
function nextCap(S,html,time){const n=el(S,'cap',html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(n,time,.7);return n}

/* ============ S1: a sentence has to become numbers ============ */
(function(){const S=$('S1');const sid='s1';
  const text='the cat sat on the mat',cw=38.4,fs=64,y=430;const x0=960-text.length*cw/2;
  const line=el(S,'word mono',text,{color:C.ink,fontSize:fs+'px'});gsap.set(line,{x:x0,y:y-44});
  typeIn(line,at(sid,.02),.06);
  const neq=label(S,'a sentence is not a number',960,590,{fs:44,italic:true,color:C.dim});
  show(neq,cue(sid,'sentence'),.5);fadeOut(neq,cue(sid,'so'),.4);
  // word chips sit exactly where the words were, then spread apart
  const words=text.split(' ');let p=0;const chips=[],ids=[464,3797,3332,319,464,2603];
  const spread=[330,582,834,1086,1338,1590];
  words.forEach((w,i)=>{const cx=x0+(p+w.length/2)*cw;p+=w.length+1;
    const c=tok(S,w,cx,y,{fs:fs,color:C.ink,border:C.blue});c.style.padding='4px 10px';c.setAttribute('data-layout-allow-overlap','');
    chips.push(c);
    tl.to(c,{x:spread[i]-cx,duration:1,ease:'power3.inOut'},cue(sid,'pieces')+.1);
    const n=label(S,String(ids[i]),spread[i],y+110,{fs:40,mono:true,color:C.yellow});show(n,cue(sid,'number',2)+i*.1,.4);
  });
  tl.to(chips,{autoAlpha:1,duration:.3},cue(sid,'cut'));tl.to(line,{autoAlpha:0,duration:.3},cue(sid,'cut'));
  const tk=label(S,'tokens',960,700,{fs:56,italic:true,color:C.blue});show(tk,cue(sid,'tokens'),.5);
  const q=el(S,'cap','but how should we <em>cut</em>?',{top:'860px',fontStyle:'italic',fontSize:'56px'});show(q,cue(sid,'choice'),.7);
  const fine=label(S,'IDs here are made up for illustration',960,800,{fs:26,italic:true,color:C.dim});show(fine,cue(sid,'tokens')+.4,.5);
  sceneInOut(sid);
})();

/* ============ S2: one token per character ============ */
(function(){const S=$('S2');const sid='s2';
  const vocab=[' ','d','e','h','l','o','r','w'];
  const src=label(S,'training text: <span class="mono" style="color:#e8edf3">"hello world"</span>',960,170,{fs:44,color:C.dim});show(src,at(sid,.01),.5);
  const bw=110,vx0=960-(vocab.length-1)*bw/2,vy=330;
  const seats=[],nums=[];
  vocab.forEach((ch,i)=>{const x=vx0+i*bw;
    const s=tok(S,ch===' '?'␣':ch,x,vy,{fs:48,color:C.ink,border:C.green});s.style.width='86px';s.style.textAlign='center';seats.push(s);
    const n=label(S,String(i),x,vy+72,{fs:36,mono:true,color:C.yellow});nums.push(n)});
  show(seats,cue(sid,'collect'),.4,{stagger:.08});
  show(nums,cue(sid,'index'),.4,{stagger:.08});
  const vl=label(S,'vocabulary',vx0-170,vy,{fs:34,italic:true,color:C.green});show(vl,cue(sid,'sort'),.5);
  const th=label(S,'every character gets a fixed seat',960,470,{fs:36,italic:true,color:C.dim});show(th,cue(sid,'seats'),.5);fadeOut(th,cue(sid,'hello')-.3,.3);
  // hello -> ids
  const hw=['h','e','l','l','o'],hid=[3,2,4,4,5],hx0=960-2*120;
  const hc=hw.map((ch,i)=>tok(S,ch,hx0+i*120,560,{fs:52,color:C.ink,border:C.blue}));
  show(hc,cue(sid,'hello'),.4,{stagger:.06});
  const arrows=layerSvg(S);
  const hn=hid.map((v,i)=>{const a=mkArrow(arrows,PX,C.dim,3);setArrow(a,{x0:hx0+i*120,y0:605,x1:hx0+i*120,y1:605});grow(a,cue(sid,'list')+i*.08,.4,hx0+i*120,660);
    const n=label(S,String(v),hx0+i*120,700,{fs:48,mono:true,color:C.yellow});show(n,cue(sid,'list')+.3+i*.08,.4);return n});
  const enc=label(S,'encode',hx0-170,630,{fs:32,italic:true,color:C.dim});show(enc,cue(sid,'list'),.4);
  const dec=label(S,'decode: read the seats back',960,780,{fs:34,italic:true,color:C.dim});show(dec,cue(sid,'decoding'),.5);
  const tiny=label(S,'8 seats',vx0+(vocab.length-1)*bw+150,vy,{fs:36,italic:true,color:C.green});show(tiny,cue(sid,'tiny'),.5);
  // a long sequence of small ids
  const strip=el(S,'abs hid','',{left:'80px',top:'860px',width:'1760px',height:'60px',overflow:'hidden'});
  const rnd=seedRand(3);let sx=0;for(let i=0;i<44;i++){const b=el(strip,'tok',String(Math.floor(rnd()*8)),{left:sx+'px',top:'4px',fontSize:'26px',color:C.yellow,borderColor:'#3a4452',padding:'2px 10px'});sx+=40}
  tl.to([dec,...hc,...hn,enc],{autoAlpha:0,duration:.4},cue(sid,'sentence')-.2);
  tl.to(arrows,{autoAlpha:0,duration:.4},cue(sid,'sentence')-.2);
  fadeIn(strip,cue(sid,'long'),.6);
  const longl=label(S,'a long sequence of tiny pieces',960,800,{fs:40,italic:true});show(longl,cue(sid,'sequence'),.5);
  const spell=label(S,'the model must learn to spell first',960,660,{fs:44,italic:true,color:C.pink});show(spell,cue(sid,'spell'),.5);
  sceneInOut(sid);
})();

/* ============ S3: one token per word ============ */
(function(){const S=$('S3');const sid='s3';
  const ws=['the','cat','sat'],ids=['812','2041','5530'];
  const wc=ws.map((w,i)=>tok(S,w,380+i*190,330,{fs:50,color:C.ink,border:C.blue}));
  const wn=ids.map((v,i)=>label(S,v,380+i*190,445,{fs:36,mono:true,color:C.yellow}));
  show(wc,cue(sid,'word'),.4,{stagger:.1});show(wn,cue(sid,'token'),.4,{stagger:.1});
  const sh=label(S,'3 tokens instead of 11',570,500,{fs:38,italic:true,color:C.dim});show(sh,cue(sid,'short'),.5);
  // the vocabulary explodes
  const pool=['run','runs','running','ran','runner','cat','cats','dog','dogs','walk','walked','walking','teh','recieve','colour','color','happy','happier','happiest','sit','sat','sits','sitting','go','went','gone','going','mouse','mice','child','children','big','bigger','biggest'];
  const rnd=seedRand(17);const vbox=[];
  pool.forEach((w,i)=>{const col=i%5,row=Math.floor(i/5);const x=1080+col*165+(row%2)*40,y=200+row*82;
    const c=tok(S,w,x,y,{fs:28,color:i%7===3?C.red:C.ink,border:'#3a4452'});vbox.push(c)});
  const order=vbox.map((c,i)=>[rnd(),c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  show(order,cue(sid,'explodes'),.3,{stagger:.08});
  const vlab=label(S,'every form needs its own seat',1480,800,{fs:36,italic:true,color:C.dim});show(vlab,cue(sid,'tense'),.5);
  // unseen word
  tl.to([...wc,...wn,sh],{autoAlpha:0,duration:.4},cue(sid,'worse'));
  const nw=tok(S,'snorkelled',560,420,{fs:54,color:C.ink,border:C.red});show(nw,cue(sid,'word',2),.5);
  const nq=label(S,'never seen in training',560,520,{fs:34,italic:true,color:C.red});show(nq,cue(sid,'never'),.4);
  const unk=tok(S,'&lt;unk&gt;',560,660,{fs:54,color:C.dim,border:C.dim});
  const ar=layerSvg(S);const a=mkArrow(ar,PX,C.dim,4);setArrow(a,{x0:560,y0:470,x1:560,y1:470});

  sceneInOut(sid);
})();

/* ============ S4: byte pair encoding, one merge ============ */
(function(){const S=$('S4');const sid='s4';
  const title=label(S,'byte pair encoding',960,150,{fs:54,italic:true,color:C.blue});show(title,cue(sid,'byte'),.6);
  const s='the this that then';const step=86,x0=960-(s.length-1)*step/2,y=330;
  const ch=s.split('').map((c,i)=>{const t=tok(S,c===' '?'␣':c,x0+i*step,y,{fs:44,color:c===' '?C.dim:C.ink,border:'#3a4452'});t.style.width='70px';t.style.textAlign='center';return t});
  show(ch,cue(sid,'single'),.3,{stagger:.03});
  // pair tallies
  const tally=[['t h',4],['␣ t',3],['h e',2],['others',1]];
  const B=bars(S,700,800,tally.map(x=>x[1]/4),{bw:90,gap:70,h:250,color:C.blue,labels:tally.map(x=>x[0]),values:false,lfs:32});
  B.items[0].b.style.background=C.yellow;
  const cnt=tally.map((x,i)=>label(S,'×'+x[1],700+i*160+45,800-250*x[1]/4-28,{fs:32,mono:true,color:C.ink}));
  tl.to(barEls(B),{autoAlpha:1,duration:.4,stagger:.04},cue(sid,'counts'));
  show(cnt,cue(sid,'pair',2),.4,{stagger:.08});
  const cl=label(S,'pair counts',520,680,{fs:34,italic:true,color:C.dim});show(cl,cue(sid,'counts'),.5);
  // highlight every t-h pair
  const thAt=[0,4,9,14];
  const hls=thAt.map(i=>el(S,'hl','',{left:(x0+i*step-44)+'px',top:(y-42)+'px',width:(step+88)+'px',height:'84px',borderColor:C.yellow,boxShadow:`0 0 20px ${C.yellow}66`}));
  fadeIn(hls,cue(sid,'t'),.4,.06);
  // fuse: the h slides under the t, the t becomes "th", the rest closes ranks
  const fuse=cue(sid,'fused');
  const removed=new Set(thAt.map(i=>i+1));
  let k=0;const nx=[];s.split('').forEach((c,i)=>{if(removed.has(i)){nx.push(null);return}nx.push(k++)});
  const n2=k,x02=960-(n2-1)*step/2;
  ch.forEach((t,i)=>{if(removed.has(i)){tl.to(t,{x:-step,autoAlpha:0,duration:.6,ease:'power2.in'},fuse);return}
    tl.to(t,{x:(x02+nx[i]*step)-(x0+i*step),duration:.9,ease:'power2.inOut'},fuse+.5)});
  thAt.forEach(i=>{const t=ch[i];const th=tok(S,'th',x0+i*step,y,{fs:44,color:C.yellow,border:C.yellow});th.style.width='70px';th.style.textAlign='center';th.setAttribute('data-layout-allow-overlap','');
    gsap.set(th,{x:0});tl.to(th,{autoAlpha:1,duration:.4},fuse+.3);tl.to(t,{autoAlpha:0,duration:.3},fuse+.3);
    tl.to(th,{x:(x02+nx[i]*step)-(x0+i*step),duration:.9,ease:'power2.inOut'},fuse+.5)});
  fadeOut(hls,fuse,.3);
  const rule=tok(S,'merge 1: &nbsp;t + h → th',1520,520,{fs:34,color:C.yellow,border:C.yellow});show(rule,cue(sid,'token'),.5);
  // recount
  const newt=[['␣ th',3],['th e',2],['th i',1],['others',1]];
  tl.to(cnt,{autoAlpha:0,duration:.3},cue(sid,'counting')-.1);
  setBars(B,cue(sid,'counting'),.8,newt.map(x=>x[1]/4));
  const nl=newt.map((x,i)=>{const d=label(S,x[0],700+i*160+45,830,{fs:32,mono:true,color:C.ink});return d});
  const ncnt=newt.map((x,i)=>label(S,'×'+x[1],700+i*160+45,800-250*x[1]/4-28,{fs:32,mono:true,color:C.ink}));
  tl.to(B.items.map(it=>it.lb),{autoAlpha:0,duration:.3},cue(sid,'counting'));
  show(nl,cue(sid,'counting')+.3,.4);show(ncnt,cue(sid,'again'),.4,{stagger:.06});
  tl.to(B.items[0].b,{backgroundColor:C.blue,duration:.4},cue(sid,'counting'));
  const sten=label(S,'frequent pairs earn a symbol of their own',960,940,{fs:40,italic:true,color:C.ink});show(sten,cue(sid,'stenographer'),.6);
  sceneInOut(sid);
})();

/* ============ S5: after many merges ============ */
(function(){const S=$('S5');const sid='s5';
  const mm=label(S,'after many thousands of merges',960,160,{fs:46,italic:true,color:C.dim});show(mm,at(sid,.01),.6);
  const rows=[[['the'],C.blue],[['house'],C.blue],[['un','believ','ably'],C.yellow]];
  const rowEls=[];
  rows.forEach(([parts,col],r)=>{const y=300+r*120;let x=760;const els=[];
    parts.forEach(p=>{const w=p.length*26+40;const t=tok(S,p,x+w/2,y,{fs:44,color:C.ink,border:col});x+=w+14;els.push(t)});rowEls.push(els)});
  show([...rowEls[0],...rowEls[1]],cue(sid,'common'),.5,{stagger:.15});
  const cl=label(S,'common word: one token',480,360,{fs:34,italic:true,color:C.blue});show(cl,cue(sid,'single'),.5);
  show(rowEls[2],cue(sid,'rare'),.4,{stagger:.25});
  const rl=label(S,'rare word: familiar pieces',480,540,{fs:34,italic:true,color:C.yellow});show(rl,cue(sid,'spelled'),.5);
  const il=label(S,'(an illustrative split)',1440,540,{fs:26,italic:true,color:C.dim});show(il,cue(sid,'pieces'),.5);
  // bytes
  const bl=label(S,'start from bytes',960,680,{fs:42,italic:true,color:C.green});show(bl,cue(sid,'bytes'),.5);
  const cafe=['c','a','f'].map((c,i)=>tok(S,c,700+i*100,800,{fs:44,color:C.ink,border:C.green}));
  const eacute=tok(S,'é',1020,800,{fs:44,color:C.pink,border:C.pink});
  show([...cafe,eacute],cue(sid,'any'),.4,{stagger:.08});
  const by=[tok(S,'195',1140,800,{fs:36,color:C.pink,border:C.pink}),tok(S,'169',1260,800,{fs:36,color:C.pink,border:C.pink})];
  const ar=layerSvg(S);const a=mkArrow(ar,PX,C.pink,4);setArrow(a,{x0:1060,y0:840,x1:1060,y1:840});
  tl.to(eacute,{x:-20,duration:.4},cue(sid,'accents'));
  show(by,cue(sid,'accents')+.3,.4,{stagger:.12});
  const bnote=label(S,'é is two bytes in UTF-8, and every byte already has a seat',960,900,{fs:32,italic:true,color:C.dim});show(bnote,cue(sid,'written'),.5);
  sceneInOut(sid);
})();

/* ============ S6: an ID is a name tag, so we need vectors ============ */
(function(){const S=$('S6');const sid='s6';
  const t1=tok(S,'token 500',620,330,{fs:48,color:C.ink,border:C.blue}),t2=tok(S,'token 7',1060,330,{fs:48,color:C.ink,border:C.blue});
  const gt=label(S,'&gt;',840,330,{fs:64,mono:true,color:C.ink});
  show([t1,t2],cue(sid,'token'),.5,{stagger:.2});show(gt,cue(sid,'larger'),.4);
  const svg=layerSvg(S);const x=svgEl('line',{x1:800,y1:370,x2:880,y2:290,stroke:C.red,'stroke-width':7,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(x,cue(sid,'not'),.3);
  const tagl=label(S,'an ID is a name tag, not a quantity',840,450,{fs:40,italic:true,color:C.dim});show(tagl,cue(sid,'meaningful'),.5);
  // each token gets a vector
  const rnd=seedRand(9);const vals=[];for(let i=0;i<6;i++)vals.push(fmt(rnd()*2-1,2));vals.push('⋮');
  const v=colvec(S,1500,520,vals,{fs:34,w:150,color:C.blue});
  show(v.box,cue(sid,'list'),.7);
  const ar=layerSvg(S);const a=mkArrow(ar,PX,C.blue,5);setArrow(a,{x0:1170,y0:360,x1:1170,y1:360});grow(a,cue(sid,'rich'),.6,1400,440);
  const vl=label(S,'a vector that can carry meaning',1500,830,{fs:38,italic:true,color:C.blue});show(vl,cue(sid,'vector'),.5);
  nextCap(S,'next &nbsp;·&nbsp; 9.2 &nbsp;Embeddings: meaning as direction',cue(sid,'next'));
  lastScene(sid);
})();
