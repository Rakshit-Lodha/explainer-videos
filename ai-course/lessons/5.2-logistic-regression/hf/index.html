  const ring=svgEl('circle',{cx:bp[0],cy:bp[1],r:22,fill:'none',stroke:C.red,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);

  showArrow(good,cue(sid,'barely'),.2);arrowTo(good,cue(sid,'barely'),.5,{x1:gp[0]+14,y1:gp[1]-6});
  fadeIn(ring,cue(sid,'misjudged'),.3);showArrow(bad,cue(sid,'hard'),.2);arrowTo(bad,cue(sid,'hard'),.6,{x1:bp[0]+110,y1:bp[1]+20});
  const t1=txt(S,'well predicted: p − y ≈ 0',1500,470,{color:C.ink,fontSize:'38px',fontStyle:'italic'}),t2=txt(S,'misjudged: p − y large',1500,540,{color:C.red,fontSize:'38px',fontStyle:'italic'});
  show(t1,cue(sid,'barely'),.4);show(t2,cue(sid,'hard'),.4);
  fadeOut([good.g,bad.g,ring],cue(sid,'descent'),.4);
  [0,1,2,3].forEach(k=>go(cue(sid,'descent')+k*.9,.8,{a:-.2+(0.69)*(k+1)/4,o:1.5-1.5*(k+1)/4},'power1.inOut'));
  const sep=txt(S,'groups on opposite sides',1500,700,{color:C.yellow,fontSize:'42px',fontStyle:'italic'});show(sep,cue(sid,'opposite'),.5);
  sceneInOut(sid);
})();

/* ===== S7: softmax over a vocabulary ===== */
(function(){const S=$('S7'),sid='s7';
  const toks=['the','cat','sat','mat','dog','ran','on','a'],lg=[1.2,3.1,.4,2.2,1.9,-.3,.8,.1];
  const ex=lg.map(Math.exp),Z=ex.reduce((a,b)=>a+b),pr=ex.map(e=>e/Z);
  const svg=layerSvg(S);const base=640,x0=300;
  const bars=toks.map((t,i)=>{const x=x0+i*170;const r=svgEl('rect',{x:x-50,width:100,y:base,height:0,rx:6,fill:C.blue,style:'opacity:0;visibility:hidden'},svg);
    const lb=txt(S,t,x,base+50,{color:C.ink,fontSize:'38px',fontFamily:"'JetBrains Mono',monospace"});return {r,lb,x}});
  const st={s:0};
  const draw=driver(st,o=>bars.forEach((b,i)=>{const hL=Math.max(0,lg[i])*80,hP=pr[i]*600,h=(1-o.s)*hL+o.s*hP;b.r.setAttribute('y',base-h);b.r.setAttribute('height',h);b.r.setAttribute('fill',o.s>.5?C.yellow:C.blue)}));
  const t1=txt(S,'logits: one score per token',960,200,{color:C.blue,fontSize:'44px',fontStyle:'italic'});
  fadeIn(bars.map(b=>b.r),at(sid,.03),.5);show(bars.map(b=>b.lb),at(sid,.03),.5,{stagger:.06});show(t1,cue(sid,'score'),.5);
  const sm=texLbl(S,'p_i = \\dfrac{e^{z_i}}{\\sum_j e^{z_j}}',1640,330,52,C.yellow);
  show(sm,cue(sid,'softmax'),.6);fadeOut(t1,cue(sid,'softmax'),.4);
  draw(cue(sid,'probabilities'),1.6,{s:1});
  const t2=txt(S,'probabilities, summing to 1',960,200,{color:C.yellow,fontSize:'44px',fontStyle:'italic'});show(t2,cue(sid,'probabilities')+.4,.5);
  const ce=txt(S,'trained with cross-entropy',960,800,{color:C.ink,fontSize:'40px',fontStyle:'italic'});show(ce,cue(sid,'cross-entropy'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.3 &nbsp;overfitting and the bias-variance trade-off',{top:'920px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();
