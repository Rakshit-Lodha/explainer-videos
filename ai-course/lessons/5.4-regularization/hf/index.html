function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers for plots, equations and code panels (module 5 and 7 lessons) ---- */
/* axes: plain x/y axes for a plot region, with optional axis captions */
function axes(svg,P,x0,x1,y0,y1,o){o=o||{};const g=svgEl('g',{},svg);
  if(o.grid){for(let x=Math.ceil(x0);x<=x1;x+=(o.step||1)){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}
    for(let y=Math.ceil(y0);y<=y1;y+=(o.step||1)){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}}
  const ya=o.yAxisAt??y0,xa=o.xAxisAt??x0;const a=P(x0,ya),b=P(x1,ya),c=P(xa,y0),d=P(xa,y1);
  svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);
  tl.to(p,{autoAlpha:1,duration:.15},time);tl.to(p,{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut'},time)}
/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */
function morphFn(p,P,f,a,b,s0,n){const o={s:s0};const upd=()=>p.setAttribute('d',fnPath(P,x=>f(x,o.s),a,b,n));upd();
  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */
function texLbl(parent,s,x,y,size,color){const d=el(parent,'lbl',tex(s,size||56),{color:color||C.ink});place(d,x,y);return d}
function txt(parent,s,x,y,o){o=o||{};const d=el(parent,'lbl',s,Object.assign({color:C.ink,fontSize:'40px'},o));place(d,x,y);return d}
/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});
  const rows=lines.map(l=>el(b,'',l,{position:'relative'}));return {box:b,rows}}
const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;
function sceneIn(sid){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid])}

const root=$('root');
/* ridge polynomial fit on x in [0,1] (t = 2x - 1); the intercept w0 is not penalised */
function ridgefit(xs,ys,deg,lam){const m=deg+1,A=[],b=[];for(let i=0;i<m;i++){A.push(new Array(m).fill(0));b.push(0)}
  xs.forEach((x,k)=>{const t=2*x-1,pw=[];for(let i=0;i<m;i++)pw.push(Math.pow(t,i));for(let i=0;i<m;i++){b[i]+=pw[i]*ys[k];for(let j=0;j<m;j++)A[i][j]+=pw[i]*pw[j]}});
  for(let i=1;i<m;i++)A[i][i]+=lam;
  for(let c=0;c<m;c++){let p=c;for(let r=c+1;r<m;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=c+1;r<m;r++){const f=A[r][c]/A[c][c];for(let j=c;j<m;j++)A[r][j]-=f*A[c][j];b[r]-=f*b[c]}}
  const w=new Array(m).fill(0);for(let i=m-1;i>=0;i--){let s=b[i];for(let j=i+1;j<m;j++)s-=A[i][j]*w[j];w[i]=s/A[i][i]}return w}
const pv=(w,x)=>{const t=2*x-1;let s=0;for(let i=w.length-1;i>=0;i--)s=s*t+w[i];return s};
const truth=x=>Math.sin(2*Math.PI*x);
function sample(seed,n){const r=seedRand(seed),xs=[],ys=[];for(let i=0;i<n;i++){const x=(i+.5)/n+(r()-.5)*.6/n;xs.push(x);let g=0;for(let k=0;k<6;k++)g+=r();ys.push(truth(x)+(g-3)*.42)}return [xs,ys]}
const [XS,YS]=sample(4,10);
function plotFrame(S,ox,oy,wd,ht,id){const P=(x,y)=>[ox+wd*x,oy-ht/3.4*y];const svg=layerSvg(S);
  svgEl('rect',{x:ox,y:oy-ht/2,width:wd,height:ht,fill:'none',stroke:C.grid,'stroke-width':2,opacity:.8},svg);
  const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x:ox,y:oy-ht/2,width:wd,height:ht},cp);
  const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return {P,svg,g}}
/* coefficient bars: signed log-ish height so huge and tiny weights both show */
function coefBars(S,x0,y0,n,gap,col){const svg=layerSvg(S);svgEl('line',{x1:x0-20,y1:y0,x2:x0+gap*(n-1)+20,y2:y0,stroke:C.axis,'stroke-width':2},svg);
  const bars=[];for(let i=0;i<n;i++)bars.push(svgEl('rect',{x:x0+i*gap-gap*.3,width:gap*.6,y:y0,height:0,fill:col,rx:3},svg));
  const set=w=>w.forEach((v,i)=>{if(i>=n)return;const h=Math.sign(v)*Math.min(230,40*Math.log10(1+Math.abs(v)*10));bars[i].setAttribute('y',h>0?y0-h:y0);bars[i].setAttribute('height',Math.abs(h));bars[i].setAttribute('fill',v>=0?C.blue:C.pink)});
  return {svg,set}}

/* ===== S1: the wild curve has enormous weights ===== */
(function(){const S=$('S1'),sid='s1';
  const {P,svg,g}=plotFrame(S,160,560,880,600,'c1');
  mkPath(g,fnPath(P,truth,0,1),C.dim,4,{'stroke-dasharray':'12 10',style:''});
  XS.forEach((x,i)=>dot(g,...P(x,YS[i]),10,C.blue,false));
  const w9=ridgefit(XS,YS,9,0);
  const c=mkPath(g,fnPath(P,x=>pv(w9,x),0,1,300),C.pink,5);
  tl.fromTo(svg,{autoAlpha:0},{autoAlpha:1,duration:.6,immediateRender:false},at(sid,.01));drawOn(c,cue(sid,'threaded'),1.4);
  const cb=coefBars(S,1230,560,10,62,C.blue);cb.set(w9);
  tl.fromTo(cb.svg,{autoAlpha:0},{autoAlpha:1,duration:.6,immediateRender:false},cue(sid,'coefficients'));
  const t=txt(S,'its ten coefficients',1510,240,{color:C.ink,fontSize:'40px',fontStyle:'italic'});show(t,cue(sid,'coefficients'),.5);
  const vals=w9.map(v=>(v>=0?'+':'−')+Math.abs(v).toFixed(0)).slice(1,6).join('  ');
  const t2=el(S,'lbl mono',vals+' …',{color:C.dim,fontSize:'30px'});place(t2,1510,880);show(t2,cue(sid,'enormous'),.5);
  const t3=txt(S,'cancel at the points, swing between them',1510,950,{color:C.pink,fontSize:'34px',fontStyle:'italic'});show(t3,cue(sid,'cancelling'),.5);
  const r=el(S,'cap','make large weights <span style="color:#f5cf4a">expensive</span>',{top:'140px',fontSize:'50px',fontStyle:'italic'});show(r,cue(sid,'expensive'),.6);
  tl.to([t,t2,t3],{autoAlpha:0,duration:.4},cue(sid,'expensive')-.2);
  sceneInOut(sid);
})();

/* ===== S2: L2 penalty, rubber bands, weight decay ===== */
(function(){const S=$('S2'),sid='s2';
  const eq=texLbl(S,'L = \\sum_i (y_i-\\hat y_i)^2 \\;+\\; \\lambda \\sum_j w_j^2',960,200,62,C.ink);show(eq,cue(sid,'penalty'),.7);
  const hl=el(S,'hl','',{left:'1062px',top:'145px',width:'372px',height:'112px',borderColor:C.yellow});fadeIn(hl,cue(sid,'squared'),.4);
  const svg=layerSvg(S);const X0=960,u=110,Y=i=>350+i*62;
  const W0=[-4.6,-2.4,-1.1,1.6,3.2,5.1];
  svgEl('line',{x1:X0,y1:Y(0)-40,x2:X0,y2:Y(5)+40,stroke:C.axis,'stroke-width':4},svg);
  const zl=txt(S,'0',X0,Y(5)+75,{color:C.dim,fontSize:'34px',fontFamily:"'JetBrains Mono',monospace"});gsap.set(zl,{autoAlpha:1});
  const rows=W0.map((w,i)=>{svgEl('line',{x1:X0-6*u,y1:Y(i),x2:X0+6*u,y2:Y(i),stroke:C.grid,'stroke-width':1.5,opacity:.6},svg);
    const band=svgEl('path',{fill:'none',stroke:C.teal,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);const d=dot(svg,0,0,12,C.yellow);return {band,d}});
  const st={k:1};
  const upd=o=>W0.forEach((w,i)=>{const x=X0+w*o.k*u,y=Y(i),r=rows[i];r.d.setAttribute('cx',x);r.d.setAttribute('cy',y);
    const n=12;let p=`M${X0},${y}`;for(let j=1;j<n;j++){p+=`L${X0+(x-X0)*j/n},${y+(j%2?-12:12)}`}p+=`L${x},${y}`;r.band.setAttribute('d',p)});
  const go=driver(st,upd);
  fadeIn(rows.map(r=>r.d),cue(sid,'weight'),.5);
  fadeIn(rows.map(r=>r.band),cue(sid,'rubber'),.6);
  go(cue(sid,'pulls'),1.4,{k:.7});
  const gr=texLbl(S,'\\nabla_{w}\\big(\\lambda w^2\\big) = 2\\lambda w',960,790,52,C.teal);show(gr,cue(sid,'proportional'),.6);
  go(cue(sid,'shrinks'),1.2,{k:.55});
  const wd=texLbl(S,'w \\leftarrow (1-2\\eta\\lambda)\\,w \\;-\\; \\eta\\,\\nabla_w \\text{data loss}',960,910,52,C.ink);show(wd,cue(sid,'fraction'),.6);
  const wdl=txt(S,'weight decay',960,995,{color:C.yellow,fontSize:'44px',fontStyle:'italic'});show(wdl,cue(sid,'decay'),.5);
  sceneInOut(sid);
})();

/* ===== S3: the lambda dial ===== */
(function(){const S=$('S3'),sid='s3';
  const {P,svg,g}=plotFrame(S,160,560,880,600,'c3');
  mkPath(g,fnPath(P,truth,0,1),C.dim,4,{'stroke-dasharray':'12 10',style:''});
  XS.forEach((x,i)=>dot(g,...P(x,YS[i]),10,C.blue,false));
  tl.fromTo(svg,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},at(sid,.01));
  const fit=mkPath(g,'',C.yellow,6);gsap.set(fit,{autoAlpha:1});
  const cb=coefBars(S,1230,620,10,62,C.blue);
  tl.fromTo(cb.svg,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},at(sid,.01));
  const ro=el(S,'lbl mono','',{color:C.yellow,fontSize:'52px'});place(ro,1510,230);gsap.set(ro,{autoAlpha:1});
  const st={u:-9};
  const go=driver(st,o=>{const lam=o.u<=-8.9?0:Math.pow(10,o.u);const w=ridgefit(XS,YS,9,lam);fit.setAttribute('d',fnPath(P,x=>pv(w,x),0,1,240));cb.set(w);
    ro.textContent=lam===0?'λ = 0':(lam<.01?`λ = ${lam.toExponential(0)}`:`λ = ${lam<10?lam.toFixed(2):lam.toFixed(0)}`)});
  tl.fromTo(ro,{autoAlpha:0},{autoAlpha:1,duration:.4,immediateRender:false},at(sid,.01));
  const notes=[['no penalty: wild','zero'],['calmer: bends where data insists','calms'],['bands win: underfits','far']].map(([t,w])=>{const d=txt(S,t,1510,330,{color:C.ink,fontSize:'38px',fontStyle:'italic'});return [d,w]});
  notes.forEach(([d,w],i)=>{show(d,cue(sid,w),.4);if(i<2)fadeOut(d,cue(sid,notes[i+1][1])-.3,.3)});
  go(cue(sid,'calms')-.6,2.2,{u:-2.3});go(cue(sid,'far'),2,{u:1.6});go(cue(sid,'between'),2,{u:-2.3});
  const best=txt(S,'best λ: checked on held-out data',1510,330,{color:C.yellow,fontSize:'38px',fontStyle:'italic'});show(best,cue(sid,'held-out'),.5);
  fadeOut(notes[2][0],cue(sid,'between')-.3,.3);
  sceneInOut(sid);
})();

/* ===== S4: L1 pushes small weights to exactly zero ===== */
(function(){const S=$('S4'),sid='s4';
  const eq=texLbl(S,'L1:\\quad \\lambda \\sum_j |w_j|',960,190,62,C.ink);show(eq,cue(sid,'absolute'),.6);
  const W=[2.6,-1.8,.9,-.5,.35,1.4,-.25,.6];const n=W.length;
  const mk=(x0,title,col)=>{const svg=layerSvg(S);const y0=600;svgEl('line',{x1:x0-30,y1:y0,x2:x0+70*(n-1)+30,y2:y0,stroke:C.axis,'stroke-width':2},svg);
    const bars=W.map((w,i)=>svgEl('rect',{x:x0+i*70-22,width:44,rx:3,fill:w>0?C.blue:C.pink},svg));const zs=W.map((w,i)=>{const t=el(S,'lbl mono','0',{color:C.yellow,fontSize:'28px'});place(t,x0+i*70,y0+40);return t});
    const tt=txt(S,title,x0+35*(n-1),340,{color:col,fontSize:'40px'});return {svg,bars,zs,tt,y0}};
  const A=mk(220,'L2: shrink by a fraction',C.teal),B=mk(1160,'L1: subtract, stop at zero',C.yellow);
  const st={t:0};
  const go=driver(st,o=>{W.forEach((w,i)=>{const a=w/(1+1.2*o.t),b=Math.sign(w)*Math.max(Math.abs(w)-.75*o.t,0);
    [[A,a],[B,b]].forEach(([P,v])=>{const h=v*90;P.bars[i].setAttribute('y',h>0?P.y0-h:P.y0);P.bars[i].setAttribute('height',Math.abs(h))})})});
  tl.fromTo([A.svg,B.svg],{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},at(sid,.02));
  show(B.tt,cue(sid,'lasso'),.5);show(A.tt,cue(sid,'lasso'),.5);
  go(cue(sid,'pull'),3.5,{t:1},'power1.inOut');
  W.forEach((w,i)=>{if(Math.abs(w)<=.75){show(B.zs[i],cue(sid,'exactly'),.4)}});
  const off=txt(S,'features switched off',1405,740,{color:C.yellow,fontSize:'38px',fontStyle:'italic'});show(off,cue(sid,'off'),.5);
  const sel=txt(S,'L1 picks out the features that matter',960,880,{color:C.ink,fontSize:'44px',fontStyle:'italic'});show(sel,cue(sid,'matter'),.6);
  sceneInOut(sid);
})();

/* ===== S5: circle vs diamond ===== */
(function(){const S=$('S5'),sid='s5';
  const c=[2.0,1.0],th=-60*Math.PI/180,ea=1.5,eb=.7,T=1.25;
  const Q=w=>{const dx=w[0]-c[0],dy=w[1]-c[1],x=Math.cos(th)*dx+Math.sin(th)*dy,y=-Math.sin(th)*dx+Math.cos(th)*dy;return (x/ea)**2+(y/eb)**2};
  const panel=(ox,kind,title)=>{const P=(x,y)=>[ox+125*x,600-125*y];const svg=layerSvg(S);
    axes(svg,P,-1.8,3.4,-1.6,2.6,{xAxisAt:0,yAxisAt:0});
    let best=null,bq=1e9;for(let k=0;k<4000;k++){const a=k/4000*2*Math.PI;let w;if(kind==='l2')w=[T*Math.cos(a),T*Math.sin(a)];else{const cs=Math.cos(a),sn=Math.sin(a),s=T/(Math.abs(cs)+Math.abs(sn));w=[s*cs,s*sn]}const q=Q(w);if(q<bq){bq=q;best=w}}
    const reg=kind==='l2'?svgEl('circle',{cx:P(0,0)[0],cy:P(0,0)[1],r:125*T,fill:C.teal,'fill-opacity':.15,stroke:C.teal,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg)
      :svgEl('polygon',{points:[[T,0],[0,T],[-T,0],[0,-T]].map(p=>P(...p).join(',')).join(' '),fill:C.yellow,'fill-opacity':.15,stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
    const [cx,cy]=P(...c);const cen=dot(svg,cx,cy,9,C.pink);
    const ells=[.25,.5,1].map(f=>svgEl('ellipse',{cx,cy,rx:125*ea*Math.sqrt(bq*f),ry:125*eb*Math.sqrt(bq*f),transform:`rotate(${60} ${cx} ${cy})`,fill:'none',stroke:C.pink,'stroke-width':f===1?4:2.5,opacity:f===1?1:.6,style:'opacity:0;visibility:hidden'},svg));
    const hit=dot(svg,...P(...best),13,C.ink);
    const tt=txt(S,title,ox+150*.8,150,{color:kind==='l2'?C.teal:C.yellow,fontSize:'42px'});
    return {reg,cen,ells,hit,tt,best}};
  const A=panel(380,'l2','L2: a circle'),B=panel(1240,'l1','L1: a diamond');
  show([A.tt,B.tt],at(sid,.02),.5);
  fadeIn([A.reg],cue(sid,'circle'),.5);fadeIn([B.reg],cue(sid,'diamond'),.5);
  fadeIn([A.cen,B.cen],cue(sid,'oval'),.4);
  [A,B].forEach(o=>o.ells.forEach((e,k)=>fadeIn(e,cue(sid,'contours')+k*.5,.4)));
  fadeIn([A.hit],cue(sid,'smooth'),.4);fadeIn([B.hit],cue(sid,'corner'),.4);
  const la=txt(S,'both weights nonzero',380+150*.8,950,{color:C.teal,fontSize:'36px',fontStyle:'italic'}),lb=txt(S,`w₁ = 0`,1240+150*.8,950,{color:C.yellow,fontSize:'36px',fontStyle:'italic'});
  if(Math.abs(B.best[0])<.02)lb.textContent='w₁ = 0 exactly';else if(Math.abs(B.best[1])<.02)lb.textContent='w₂ = 0 exactly';
  show(la,cue(sid,'nonzero'),.5);show(lb,cue(sid,'zero'),.5);
  sceneInOut(sid);
})();

/* ===== S6: ridge closed form ===== */
(function(){const S=$('S6'),sid='s6';
  const e1=texLbl(S,'X^{\\top}X\\,\\mathbf{w} = X^{\\top}\\mathbf{y}',960,260,64,C.dim);show(e1,cue(sid,'normal'),.6);
  const e2=el(S,'abs hid','',{left:'460px',top:'380px',width:'1000px',textAlign:'center',padding:'26px',borderRadius:'18px',border:'3px solid '+C.yellow});
  e2.innerHTML=tex('\\mathbf{w} = (X^{\\top}X + {\\color{#f5cf4a}\\lambda I})^{-1} X^{\\top}\\mathbf{y}',70);show(e2,cue(sid,'identity'),.7);
  const inv=txt(S,'safely invertible, even with near-duplicate columns',960,620,{color:C.teal,fontSize:'40px',fontStyle:'italic'});show(inv,cue(sid,'invertible'),.5);
  const ic=el(S,'abs hid','',{left:'560px',top:'720px',width:'800px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.ink});
  ic.innerHTML='the intercept '+tex('b',40)+' is left out of the penalty';show(ic,cue(sid,'intercept'),.5);
  sceneInOut(sid);
})();

/* ===== S7: AdamW ===== */
(function(){const S=$('S7'),sid='s7';
  const t=txt(S,'AdamW',960,250,{color:C.yellow,fontSize:'64px'});show(t,cue(sid,'adam'),.6);
  const e=texLbl(S,'\\theta \\leftarrow \\theta - \\eta\\Big(\\underbrace{\\tfrac{\\hat m}{\\sqrt{\\hat v}+\\epsilon}}_{\\text{gradient step}} + \\underbrace{\\lambda\\,\\theta}_{\\text{decay}}\\Big)',960,480,60,C.ink);
  show(e,cue(sid,'decay',2),.7);
  const s=txt(S,'decay acts on the weights directly, separate from the gradient step',960,680,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(s,cue(sid,'separately'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.5 &nbsp;train, validation and test splits',{top:'920px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();

/* KaTeX stacks accents and fractions on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','');e.setAttribute('data-layout-allow-occlusion','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
