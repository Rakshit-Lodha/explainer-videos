/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'1180px',top:top+'px',width:'700px',textAlign:'center'},o||{}));
const d2r=Math.PI/180;

/* ============ persistent stage s2-s5: contour map of the round bowl f = x² + y² ============ */
const STAGE=$('STAGE');const P=plane(600,560,88);
const ssvg=layerSvg(STAGE);const cg=clipTo(ssvg,40,90,1100,960);
const bg=drawGrid(cg,P,-7,7,-6,6);bg.setAttribute('opacity','.25');
const rings=[];for(let k=1;k<=6;k++){const r=k;rings.push(svgEl('circle',{cx:P(0,0)[0],cy:P(0,0)[1],r:r*88,fill:'none',stroke:C.teal,'stroke-width':2.5,opacity:.25+.1*k},cg))}
const rl=[1,2,3,4,5].map(k=>{const d=el(STAGE,'lbl mono',String(k*k),{fontSize:'26px',color:C.teal});d.style.opacity=.8;d.style.visibility='inherit';place(d,P(k*.7071,-k*.7071)[0]+14,P(k*.7071,-k*.7071)[1]+14);return d});
const p=[2.4,1.4],G=[2*p[0],2*p[1]],GL=Math.hypot(...G),SC=.3;
const field=svgEl('g',{style:'opacity:0;visibility:hidden'},cg);
[[1,0],[0,2],[-2,1],[-1.5,-2.5],[3,-2],[-3.5,-1],[1.2,-4],[-0.5,3.6],[4,1.5],[-4,2.6],[2.5,3.5],[4.4,-3.1]].forEach(([x,y])=>{const a=mkArrow(field,P,C.yellow,4);a.g.setAttribute('style','');a.g.setAttribute('opacity','.55');setArrow(a,{x0:x,y0:y,x1:x+2*x*.18,y1:y+2*y*.18})});
const pd=svgEl('circle',{cx:P(...p)[0],cy:P(...p)[1],r:9,fill:C.ink,style:'opacity:0;visibility:hidden'},cg);
const gA=mkArrow(cg,P,C.yellow,8,tex('\\nabla f',48),40,-20,STAGE);setArrow(gA,{x0:p[0],y0:p[1],x1:p[0],y1:p[1]});
const tan=svgEl('line',{x1:P(p[0]-1.4*.5,p[1]+1.4*.857)[0],y1:P(p[0]-1.4*.5,p[1]+1.4*.857)[1],stroke:C.pink,'stroke-width':4,'stroke-dasharray':'10 8',style:'opacity:0;visibility:hidden'},cg);
{const t=[-p[1]/Math.hypot(...p),p[0]/Math.hypot(...p)];const a=P(p[0]-2.2*t[0],p[1]-2.2*t[1]),b=P(p[0]+2.2*t[0],p[1]+2.2*t[1]);tan.setAttribute('x1',a[0]);tan.setAttribute('y1',a[1]);tan.setAttribute('x2',b[0]);tan.setAttribute('y2',b[1])}
const uA=mkArrow(cg,P,C.blue,7,tex('\\hat u',44),0,-40,STAGE);
const nA=mkArrow(cg,P,C.pink,8,tex('-\\nabla f',46),-50,40,STAGE);setArrow(nA,{x0:p[0],y0:p[1],x1:p[0],y1:p[1]});
tl.to(STAGE,{autoAlpha:1,duration:.8},START.s2);

/* ============ S1: the gradient ============ */
(function(){const S=$('S1'),sid='s1';
  const f=el(S,'abs hid',tex('\\nabla f=\\begin{bmatrix}\\partial f/\\partial x\\\\ \\partial f/\\partial y\\end{bmatrix}',72),{left:'0',top:'240px',width:'1920px',textAlign:'center'});show(f,cue(sid,'vector'),.7);
  const a=el(S,'abs hid','points where the function increases fastest',{left:'0',top:'560px',width:'1920px',textAlign:'center',fontSize:'52px',fontStyle:'italic',color:C.yellow});show(a,cue(sid,'increases'),.6);
  const b=el(S,'abs hid','its length: how steep that climb is',{left:'0',top:'660px',width:'1920px',textAlign:'center',fontSize:'44px',fontStyle:'italic',color:C.dim});show(b,cue(sid,'length'),.6);
  sceneInOut(sid);
})();

/* ============ S2: contours, and arrows crossing them at right angles ============ */
(function(){const S=$('S2'),sid='s2';
  const n1=panel(S,'contour lines: equal height',260,{fontSize:'44px',fontStyle:'italic',color:C.teal});show(n1,cue(sid,'contour'),.5);
  const f=panel(S,tex('f=x^2+y^2',52),360);show(f,cue(sid,'bowl'),.5);
  fadeIn(field,cue(sid,'gradient'),.6);
  fadeIn(pd,cue(sid,'point'),.3);
  showArrow(gA,cue(sid,'arrow'),.3);arrowTo(gA,cue(sid,'arrow'),1,{x1:p[0]+G[0]*SC,y1:p[1]+G[1]*SC},'power2.out');
  const n2=panel(S,'pointing straight outwards, uphill',480,{fontSize:'40px',fontStyle:'italic',color:C.yellow});show(n2,cue(sid,'outwards'),.5);
  fadeIn(tan,cue(sid,'crossing'),.4);
  const n3=panel(S,'at a right angle to the contour',550,{fontSize:'40px',fontStyle:'italic',color:C.pink});show(n3,cue(sid,'right'),.5);
  sceneInOut(sid);
})();

/* ============ S3: slope along u = ∇f · u, largest when u points along ∇f ============ */
(function(){const S=$('S3'),sid='s3';
  fadeOut([field,tan],START[sid]+.2,.4);
  const R0=1.2;const ga=Math.atan2(G[1],G[0])/d2r;
  const rd=el(S,'abs hid','',{left:'1180px',top:'380px',width:'700px',textAlign:'center',fontSize:'48px'});
  rd.innerHTML='slope facing <span style="color:#58c4dd">û</span> <span class="mono">= <span id="sl">0.00</span></span>';const sl=rd.querySelector('#sl');
  const bar=el(S,'abs hid','',{left:'1230px',top:'470px',width:'600px',height:'26px',border:`2px solid ${C.dim}`,borderRadius:'6px'});
  const fill=el(bar,'abs','',{left:'300px',top:'0',width:'0px',height:'22px',background:C.blue,borderRadius:'4px'});
  const U=anim({ang:200},o=>{const a=o.ang*d2r,ux=Math.cos(a),uy=Math.sin(a);geom(uA,p[0],p[1],p[0]+R0*ux,p[1]+R0*uy);
    const s=G[0]*ux+G[1]*uy;sl.textContent=fmt(s,2);const w=s/GL*300;fill.style.left=(w<0?300+w:300)+'px';fill.style.width=Math.abs(w)+'px';fill.style.background=s<0?C.pink:C.blue});
  showArrow(uA,cue(sid,'unit'),.4);fadeIn([rd,bar],cue(sid,'unit'),.5);
  const f=panel(S,tex('\\text{slope}_{\\hat u}=\\nabla f\\cdot\\hat u',56),240);show(f,cue(sid,'dot'),.6);
  U.to(cue(sid,'unit')+.2,4,{ang:290},'power1.inOut');
  U.to(cue(sid,'each')+.5,5,{ang:360+ga-40},'power1.inOut');
  U.to(cue(sid,'largest'),2.4,{ang:360+ga},'power2.out');
  const n=panel(S,'largest when û points along ∇f',560,{fontSize:'40px',fontStyle:'italic',color:C.yellow});show(n,cue(sid,'largest'),.5);
  const m=panel(S,tex('\\text{steepest slope}=|\\nabla f|',50),660);show(m,cue(sid,'length'),.6);
  U.to(START.s4+.3,2.6,{ang:360+ga+90});
  sceneInOut(sid);
})();

/* ============ S4: along a contour the slope is zero, so ∇f ⟂ contour ============ */
(function(){const S=$('S4'),sid='s4';
  fadeIn(tan,cue(sid,'contour'),.4);
  const n=panel(S,'walking along a contour: height constant',260,{fontSize:'40px',fontStyle:'italic',color:C.teal});show(n,cue(sid,'walking'),.5);
  const z=panel(S,tex('\\nabla f\\cdot\\hat u=0',58),380,{color:C.pink});show(z,cue(sid,'zero'),.6);
  const pp=panel(S,'zero dot product ⇒ perpendicular',500,{fontSize:'40px',fontStyle:'italic'});show(pp,cue(sid,'perpendicular'),.5);
  fadeIn(field,cue(sid,'always'),.6);
  sceneInOut(sid);
})();

/* ============ S5: minus the gradient; gradient descent zigzags in a narrow valley ============ */
(function(){const S=$('S5'),sid='s5';
  fadeOut([uA.g,uA.label,tan,field],START[sid],.4);
  showArrow(nA,cue(sid,'minus'),.3);arrowTo(nA,cue(sid,'minus'),1,{x1:p[0]-G[0]*SC,y1:p[1]-G[1]*SC},'power2.out');
  const d=panel(S,'−∇f: steepest descent',300,{fontSize:'48px',color:C.pink});show(d,cue(sid,'descent'),.5);fadeOut(d,cue(sid,'descent',2)-.2,.3);
  tl.to(STAGE,{autoAlpha:0,duration:.6},cue(sid,'descent',2)-.3);
  /* a long narrow valley f = x² + 6y² */
  const Q=plane(600,560,88);const svg=layerSvg(S);const g=clipTo(svg,40,90,1100,960);
  const vg=svgEl('g',{style:'opacity:0;visibility:hidden'},g);
  for(let k=1;k<=7;k++){const c=k*k*.55;svgEl('ellipse',{cx:Q(0,0)[0],cy:Q(0,0)[1],rx:Math.sqrt(c)*88,ry:Math.sqrt(c/6)*88,fill:'none',stroke:C.teal,'stroke-width':2.5,opacity:.3+.08*k},vg)}
  fadeIn(vg,cue(sid,'descent',2),.6);
  const vlab=panel(S,tex('f=x^2+6y^2',48),300);show(vlab,cue(sid,'hiker'),.5);
  const fog=panel(S,'a hiker in fog: feel the slope, step against it, repeat',400,{fontSize:'38px',fontStyle:'italic'});show(fog,cue(sid,'feel'),.5);
  let x=-5.2,y=1.5;const pts=[[x,y]];for(let k=0;k<10;k++){x-=.15*2*x;y-=.15*12*y;pts.push([x,y])}
  const segs=[];pts.slice(1).forEach((q,k)=>{const a=pts[k];const s=mkArrow(g,Q,C.yellow,5);setArrow(s,{x0:a[0],y0:a[1],x1:q[0],y1:q[1]});segs.push(s)});
  const d0=svgEl('circle',{cx:Q(...pts[0])[0],cy:Q(...pts[0])[1],r:10,fill:C.yellow,style:'opacity:0;visibility:hidden'},g);
  fadeIn(d0,cue(sid,'take')-.2,.3);
  segs.forEach((s,k)=>showArrow(s,cue(sid,'take')+k*.55,.3));
  const zz=panel(S,'in a narrow valley the steps zigzag',520,{fontSize:'40px',fontStyle:'italic',color:C.yellow});show(zz,cue(sid,'zigzag'),.5);
  const co=panel(S,'(cleverer optimisers: module 4)',600,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(co,cue(sid,'cleverer'),.5);
  sceneInOut(sid);
})();

/* ============ S6: learning rate: too small, too large ============ */
(function(){const S=$('S6'),sid='s6';
  sceneIn(sid);
  const f=el(S,'abs hid',tex('x\\ \\leftarrow\\ x-\\eta\\,f\'(x)',60),{left:'0',top:'150px',width:'1920px',textAlign:'center'});show(f,cue(sid,'learning'),.6);
  const eta=el(S,'abs hid','η: the learning rate',{left:'0',top:'250px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});show(eta,cue(sid,'rate'),.5);
  const mk=(cx,lr,x0,n,col,lab,t)=>{const PP=plane(cx,860,150,52);const svg=layerSvg(S);const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
    svgEl('path',{d:pathD(PP,x=>x*x,-2.6,2.6,80),fill:'none',stroke:C.blue,'stroke-width':4},g);
    svgEl('line',{x1:PP(-2.7,0)[0],y1:PP(0,0)[1],x2:PP(2.7,0)[0],y2:PP(0,0)[1],stroke:C.axis,'stroke-width':2,opacity:.6},g);
    let x=x0;const pts=[[x,x*x]];for(let k=0;k<n;k++){x=x-lr*2*x;pts.push([x,x*x])}
    const dots=pts.map(([a,b],k)=>svgEl('circle',{cx:PP(a,b)[0],cy:PP(a,b)[1],r:9,fill:col,style:'opacity:0;visibility:hidden'},svg));
    const lines=pts.slice(1).map((q,k)=>svgEl('line',{x1:PP(...pts[k])[0],y1:PP(...pts[k])[1],x2:PP(...q)[0],y2:PP(...q)[1],stroke:col,'stroke-width':3,'stroke-dasharray':'6 6',style:'opacity:0;visibility:hidden'},svg));
    const l=el(S,'abs hid',lab,{left:(cx-350)+'px',top:'920px',width:'700px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:col});
    fadeIn(g,t-.4,.5);dots.forEach((d,k)=>{fadeIn(d,t+k*.4,.2);if(k)fadeIn(lines[k-1],t+k*.4,.2)});show(l,t,.4)};
  mk(500,.04,-2.4,9,C.green,'too small: crawls',cue(sid,'small'));
  mk(1420,1.06,1.1,5,C.red,'too large: overshoots and climbs',cue(sid,'large'));
})();

/* ============ S7: an LLM walks this landscape ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const a=el(S,'abs hid','the same walk, in billions of dimensions',{left:'0',top:'220px',width:'1920px',textAlign:'center',fontSize:'52px',fontStyle:'italic'});show(a,cue(sid,'walk'),.6);
  const b=el(S,'abs hid','height = the loss on a batch of text',{left:'0',top:'330px',width:'1920px',textAlign:'center',fontSize:'42px',fontStyle:'italic',color:C.dim});show(b,cue(sid,'height'),.5);
  const u=el(S,'abs hid',tex('w_i\\ \\leftarrow\\ w_i-\\eta\\,\\frac{\\partial L}{\\partial w_i}\\qquad\\text{for every weight }i',60),{left:'0',top:'470px',width:'1920px',textAlign:'center',color:C.yellow});show(u,cue(sid,'moves'),.7);
  const next=el(S,'cap','next &nbsp;·&nbsp; 2.5 &nbsp;Jacobians: derivatives of vector functions',{top:'900px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next'),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
</body>
