function arrowTo(a,time,d,to,ease){const from={...a.st},o={...from};const tgt={...from,...to};
  tl.to(o,{...tgt,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>geom(a,o.x0,o.y0,o.x1,o.y1)},time);a.st=tgt}
function showArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:1,duration:d||.4},time)}
function hideArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:0,duration:d||.4},time)}
function grow(a,time,d,x1,y1){setArrow(a,{x1:a.st.x0,y1:a.st.y0});showArrow(a,time,.25);arrowTo(a,time,d,{x1,y1},'power2.out')}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers (modules 10-12) ---- */
function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

/* ============ S1: every word hides a decision ============ */
(function(){const S=$('S1');const sid='s1';
  const sent=el(S,'cap','ask it <span id="w1">questions</span> and <span id="w2">count</span> the <span id="w3">right answers</span>',{top:'260px',fontSize:'64px',fontStyle:'italic'});
  show(sent,cue(sid,'ask'),.6);
  const labs=[['which questions? seen before?',480,'every'],['how is it scored?',960,'hides'],['what counts as right?',1440,'decision']];
  labs.forEach(([t,x,w])=>{const d=txt(S,t,x,420,{fs:34,it:true,color:C.yellow});show(d,cue(sid,w),.4)});
  const base=900;const bA=el(S,'abs','',{left:'620px',top:(base-360)+'px',width:'200px',height:'360px',background:'#58c4dd55',border:'3px solid #58c4dd',transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});
  const bB=el(S,'abs','',{left:'1100px',top:(base-345)+'px',width:'200px',height:'345px',background:'#83c16755',border:'3px solid #83c167',transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});
  show([bA,bB],cue(sid,'score'),.5);
  const la=txt(S,'model A',720,base+40,{fs:32,color:C.blue}),lb=txt(S,'model B',1200,base+40,{fs:32,color:C.green});show([la,lb],cue(sid,'score'),.4);
  tl.to(bB,{scaleY:1.12,duration:1,ease:'power2.inOut'},cue(sid,'difference'));
  const n=txt(S,'same models, a different scoring choice',960,1000,{fs:32,it:true,color:C.dim});show(n,cue(sid,'difference'),.4);
  sceneInOut(sid);
})();

/* ============ S2: perplexity ============ */
(function(){const S=$('S2');const sid='s2';
  const eq=eqn(S,'\\text{PPL} = \\exp\\!\\Big(-\\frac{1}{N}\\sum_{i=1}^{N} \\log p(x_i \\mid x_{<i})\\Big)',960,230,58);show(eq,cue(sid,'perplexity'),.6);
  const toks=[['The',.31],['rain',.04],['in',.62],['Spain',.18],['stays',.09]];
  toks.forEach(([t,p],i)=>{const x=440+i*260;const c=cellAt(S,x,420,200,70,t,C.grid,{fs:32});const v=txt(S,'p = '+p.toFixed(2),x,490,{fs:28,mono:true,color:C.yellow});show([c,v],cue(sid,'true')+i*.12,.3)});
  const d20=svgEl('polygon',{points:'960,560 1050,610 1050,710 960,760 870,710 870,610',fill:'#f5cf4a22',stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},layerSvg(S));
  const dl=txt(S,'20',960,660,{fs:52,mono:true,color:C.yellow});
  fadeIn(d20,cue(sid,'twenty'),.4);show(dl,cue(sid,'twenty'),.4);
  const dd=txt(S,'perplexity 20 ≈ a fair choice among 20',960,800,{fs:34,it:true,color:C.ink});show(dd,cue(sid,'evenly'),.4);
  tl.to([d20,dl,dd],{autoAlpha:0,duration:.4},cue(sid,'cheap'));
  const t1=['un','believ','able'],t2=['u','n','b','e','l','i','e','v','a','b','l','e'];
  const r1=t1.map((t,i)=>cellAt(S,540+i*140,640,128,60,t,C.blue,{fs:28,ink:C.blue}));
  const r2=t2.map((t,i)=>cellAt(S,1080+i*62,640,54,60,t,C.pink,{fs:26,ink:C.pink}));
  show(r1,cue(sid,'tokenizer'),.3,{stagger:.05});show(r2,cue(sid,'splits'),.3,{stagger:.03});
  const l1=txt(S,'tokenizer A',670,730,{fs:30,it:true,color:C.blue}),l2=txt(S,'tokenizer B',1420,730,{fs:30,it:true,color:C.pink});show([l1,l2],cue(sid,'tokenizer'),.3);
  const dt=txt(S,'different units, different task: not comparable',960,860,{fs:36,it:true,color:C.red});show(dt,cue(sid,'different'),.4);
  sceneInOut(sid);
})();

/* ============ S3: multiple choice by likelihood ============ */
(function(){const S=$('S3');const sid='s3';
  const q=box(S,960,200,1100,90,'<span style="font-size:32px">Q: What do plants mainly absorb from the air for photosynthesis?</span>',C.ink,{fs:32});show(q,cue(sid,'benchmarks'),.5);
  const opts=[['A','oxygen',[-1.9]],['B','carbon dioxide',[-0.7,-0.6]],['C','nitrogen gas',[-1.1,-0.5]],['D','water vapour from the clouds',[-0.9,-0.6,-0.5,-0.4,-0.6]]];
  const rows=[];
  opts.forEach(([L,t,lp],i)=>{const y=340+i*110;const l=txt(S,L+'. '+t,340,y,{fs:34,color:C.ink});l.style.translate='0 -50%';
    const cs=lp.map((v,j)=>cellAt(S,1000+j*110,y,96,56,v.toFixed(1),C.grid,{fs:24,ink:C.yellow}));
    const sum=lp.reduce((a,b)=>a+b,0),mean=sum/lp.length;
    const sv=txt(S,sum.toFixed(1),1600,y,{fs:32,mono:true,color:C.blue}),mv=txt(S,mean.toFixed(2),1760,y,{fs:32,mono:true,color:C.green});
    rows.push({l,cs,sv,mv,sum,mean});
    show(l,cue(sid,'option')+i*.15,.3);show(cs,cue(sid,'log-probability')+i*.15,.3,{stagger:.03})});
  const hs=txt(S,'sum',1600,290,{fs:30,it:true,color:C.blue}),hm=txt(S,'mean',1760,290,{fs:30,it:true,color:C.green});
  show([hs,...rows.map(r=>r.sv)],cue(sid,'picks'),.4);
  show([hm,...rows.map(r=>r.mv)],cue(sid,'normalise'),.4);
  const hiS=el(S,'hl','',{left:'1540px',top:'420px',width:'120px',height:'60px',borderColor:C.blue});fadeIn(hiS,cue(sid,'likely'),.3);
  const hiM=el(S,'hl','',{left:'1700px',top:'640px',width:'120px',height:'60px',borderColor:C.green});fadeIn(hiM,cue(sid,'length'),.3);
  const g=txt(S,'GPT-3: per-token normalisation for most tasks',960,820,{fs:32,it:true,color:C.dim});show(g,cue(sid,'gpt-3'),.4);
  const w=el(S,'cap','same model, same question: <em>B</em> by sum, <em>D</em> by mean',{top:'900px',fontSize:'44px',fontStyle:'italic'});show(w,cue(sid,'scoring'),.5);
  sceneInOut(sid);
})();

/* ============ S4: pass@k ============ */
(function(){const S=$('S4');const sid='s4';
  const head=el(S,'cap','Chen et al., 2021 · Codex, HumanEval',{top:'110px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(head,cue(sid,'codex'),.5);
  const pass=[1,0,0,1,0,0,0,1,0,0];
  const cells=pass.map((p,i)=>cellAt(S,300+i*150,330,120,120,p?'✓':'✗',p?C.green:C.red,{fs:52,ink:p?C.green:C.red}));
  show(cells,cue(sid,'sampled'),.3,{stagger:.06});
  const lab=txt(S,'n = 10 samples, c = 3 pass',960,450,{fs:36,mono:true,color:C.ink});show(lab,cue(sid,'counted'),.4);
  const def=txt(S,'pass@k: at least one of k samples passes',960,540,{fs:38,it:true,color:C.ink});show(def,cue(sid,'least'),.4);
  const eq=eqn(S,'\\text{pass@}k = 1 - \\frac{\\binom{n-c}{k}}{\\binom{n}{k}}',960,720,72);show(eq,cue(sid,'unbiased'),.6);
  const ex=eqn(S,'\\text{pass@}5 = 1 - \\tfrac{\\binom{7}{5}}{\\binom{10}{5}} = 1 - \\tfrac{21}{252} \\approx 0.92',960,900,48,{color:C.yellow});show(ex,cue(sid,'any'),.5);
  const hf=txt(S,'all-failing choices of k',1460,640,{fs:30,it:true,color:C.red}),ha=txt(S,'all choices of k',1420,800,{fs:30,it:true,color:C.dim});
  show(hf,cue(sid,'failing'),.4);show(ha,cue(sid,'any'),.4);
  sceneInOut(sid);
})();

/* ============ S5: standard error ============ */
(function(){const S=$('S5');const sid='s5';
  const eq=eqn(S,'\\text{SE} \\approx \\sqrt{\\frac{p\\,(1-p)}{n}}',520,320,72);show(eq,cue(sid,'standard'),.6);
  const ex=eqn(S,'\\sqrt{\\frac{0.7\\times 0.3}{500}} \\approx 0.02',520,560,54,{color:C.yellow});show(ex,cue(sid,'five'),.5);
  const svg=layerSvg(S);
  const Y=v=>900-(v-60)*30;
  const ax=ln(svg,1150,Y(60),1750,Y(60),C.axis,3);fadeIn(ax,cue(sid,'five'),.4);
  [[1300,71,C.blue,'A 71%'],[1600,70,C.green,'B 70%']].forEach(([x,v,c,t])=>{
    const b=el(S,'abs','',{left:(x-60)+'px',top:Y(v)+'px',width:'120px',height:(Y(60)-Y(v))+'px',background:c+'55',border:'3px solid '+c,transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});
    const e=ln(svg,x,Y(v+2),x,Y(v-2),C.ink,4),e1=ln(svg,x-24,Y(v+2),x+24,Y(v+2),C.ink,4),e2=ln(svg,x-24,Y(v-2),x+24,Y(v-2),C.ink,4);
    const l=txt(S,t,x,Y(60)+40,{fs:32,mono:true,color:c});
    show([b,l],cue(sid,'gap'),.5);fadeIn([e,e1,e2],cue(sid,'noise'),.4)});
  const ov=txt(S,'± 2 points: the bars overlap',1450,250,{fs:36,it:true,color:C.ink});show(ov,cue(sid,'noise'),.4);
  const pr=txt(S,'same questions → paired differences, less noise',960,1010,{fs:34,it:true,color:C.dim});show(pr,cue(sid,'paired'),.4);
  sceneInOut(sid);
})();

/* ============ S6: contamination ============ */
(function(){const S=$('S6');const sid='s6';
  const docs=[];for(let k=0;k<8;k++){const isT=k===5;const d=el(S,'abs',isT?'<div style="font-size:22px;text-align:center;margin-top:30px;color:#f5cf4a">Q17 + answer</div>':'',{left:(160+(k%4)*130)+'px',top:(260+Math.floor(k/4)*170)+'px',width:'110px',height:'140px',border:'3px solid '+(isT?C.yellow:C.dim),borderRadius:'8px',background:'#141a22',opacity:0,visibility:'hidden'});docs.push(d)}
  show(docs,cue(sid,'web'),.3,{stagger:.06});
  const wl=txt(S,'the web',420,620,{fs:34,it:true,color:C.dim});show(wl,cue(sid,'web'),.4);
  const tr=box(S,1000,400,320,140,'training data',C.blue,{fs:38});show(tr,cue(sid,'trained'),.4);
  const bm=box(S,1560,400,320,140,'<span>benchmark<br><span style="font-size:28px;color:#f5cf4a">Q17</span></span>',C.yellow,{fs:38});show(bm,cue(sid,'benchmarks'),.4);
  const svg=layerSvg(S);const a=pxArrow(svg,C.dim,4,700,400,830,400);growPx(a,cue(sid,'trained'),.4);
  const lk=pth(svg,'M486 470 Q 1000 760 1560 480',C.yellow,4,{dash:'10 8'});drawOn(lk,cue(sid,'seen'),1.0);
  const ml=txt(S,'memory, not skill',960,720,{fs:44,it:true,color:C.red});show(ml,cue(sid,'memory'),.4);
  const ex=txt(S,'like seeing the exam paper in advance',960,790,{fs:34,it:true,color:C.dim});show(ex,cue(sid,'student'),.4);
  const fx=para(S,'check overlap between training and test data &nbsp;·&nbsp; private or fresh test questions',260,900,1400,{fs:34,align:'center'});show(fx,cue(sid,'careful'),.5);
  sceneInOut(sid);
})();

/* ============ S7: LLM as judge ============ */
(function(){const S=$('S7');const sid='s7';
  const head=el(S,'cap','Zheng et al., 2023 · MT-Bench',{top:'110px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(head,cue(sid,'zheng'),.5);
  const j=box(S,960,280,380,110,'judge model',C.pink,{fs:40});show(j,cue(sid,'judge'),.5);
  const A=box(S,600,520,480,130,'answer 1',C.blue,{fs:38}),B=box(S,1320,520,480,130,'answer 2, much longer…',C.green,{fs:38});
  show([A,B],cue(sid,'open-ended'),.5);
  const ag=txt(S,'agreement with humans ≈ human–human agreement',960,700,{fs:34,it:true,color:C.ink});show(ag,cue(sid,'agreed'),.4);
  tl.to(ag,{autoAlpha:0,duration:.3},cue(sid,'biases')-.2);
  const bs=[['position: favours the first answer','first'],['verbosity: favours longer answers','longer'],['self-enhancement: favours its own writing','itself']];
  bs.forEach(([t,w],i)=>{const d=txt(S,t,960,720+i*60,{fs:34,color:C.yellow});show(d,cue(sid,w),.4)});
  tl.to(A,{x:720,duration:1,ease:'power2.inOut'},cue(sid,'swapping'));tl.to(B,{x:-720,duration:1,ease:'power2.inOut'},cue(sid,'swapping'));
  const sw=txt(S,'swap the order, average the verdicts',960,960,{fs:38,it:true,color:C.green});show(sw,cue(sid,'averaging'),.4);
  sceneInOut(sid);
})();

/* ============ S8: rules for your own evals; next module ============ */
(function(){const S=$('S8');const sid='s8';
  const items=[['write down exactly how a score is computed','write'],['measure its uncertainty','measure'],['keep test data away from the model','keep']];
  items.forEach(([t,w],i)=>{const y=300+i*120;const k=box(S,420,y,80,80,'✓',C.green,{fs:40});const d=txt(S,t,500,y,{fs:44});d.style.translate='0 -50%';show([k,d],cue(sid,w),.4)});
  const end=txt(S,'end of module 10 · large language models',960,720,{fs:36,it:true,color:C.dim});show(end,cue(sid,'closes'),.4);
  nextUp(S,sid,'autoencoders',1,'11.1 &nbsp;autoencoders and VAEs');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
