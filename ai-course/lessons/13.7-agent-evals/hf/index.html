function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers (modules 10-12) ---- */
function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

/* ============ S1: one pass/fail hides the cause ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const pf=box(S,1500,250,300,100,'<span>✗ fail</span>',C.red,{fs:40});show(pf,at(sid,.02),.4);
  const hid=txt(S,'…but where?',1500,350,{fs:30,it:true,color:C.dim});show(hid,cue(sid,'hides'),.4);
  const r=[['search',C.yellow],['write',C.yellow]].map(([t,c],i)=>{const b=box(S,300+i*360,520,260,90,t,c,{fs:34});show(b,cue(sid,'search')+.2*i,.4);return b});
  growPx(pxArrow(svg,C.dim,3,435,520,525,520),cue(sid,'writing'),.3);
  const rl=txt(S,'retrieval-augmented answer',480,430,{fs:28,it:true,color:C.yellow});show(rl,cue(sid,'retrieval'),.4);
  const ag=['tool','tool','tool','answer'].map((t,i)=>{const b=box(S,1040+i*210,720,170,80,t,i===3?C.green:C.blue,{fs:30});show(b,cue(sid,'chain')+.12*i,.3);if(i)growPx(pxArrow(svg,C.dim,3,1040+(i-1)*210+90,720,1040+i*210-90,720),cue(sid,'chain')+.12*i,.3);return b});
  const al=txt(S,'an agent',1355,630,{fs:28,it:true,color:C.blue});show(al,cue(sid,'chain'),.4);
  const ms=el(S,'cap','measure each stage, so a failure points at its cause',{top:'900px',fontSize:'36px',fontStyle:'italic',color:C.ink});show(ms,cue(sid,'measure'),.5);

/* ============ S2: RAG: score the two stages separately ============ */
(function(){const S=$('S2');const sid='s2';
  const h1=box(S,560,230,520,100,'<span>retrieval<br><span style="font-size:24px;color:#7f8b99">recall, nDCG on labelled passages</span></span>',C.yellow,{fs:34});
  const h2=box(S,1360,230,520,100,'<span>answer<br><span style="font-size:24px;color:#7f8b99">faithful to the text? correct?</span></span>',C.blue,{fs:34});

/* ============ S4: the trajectory ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const calls=[['lookup_order',C.blue],['issue_refund',C.red],['send_email',C.blue],['send_email',C.blue],['send_email',C.blue],['done',C.green]];
  calls.forEach(([t,c],i)=>{const b=box(S,240+i*290,330,250,84,'<span class="mono" style="font-size:24px">'+t+'</span>',c,{fs:24});show(b,at(sid,.02)+.12*i,.3);
    if(i)growPx(pxArrow(svg,C.dim,3,240+(i-1)*290+128,330,240+i*290-128,330),at(sid,.02)+.12*i,.3)});
  const tl0=txt(S,'the sequence of tool calls',960,240,{fs:30,it:true,color:C.dim});show(tl0,cue(sid,'sequence'),.4);
  const Q=[['appropriate tools?','✓',C.green,'appropriate'],['valid arguments?','✓',C.green,'valid'],['forbidden or premature actions?','✗ refund before checking eligibility',C.red,'forbidden'],['sensible number of steps?','✗ three identical emails',C.red,'steps']];
  Q.forEach(([q,a,c,w],i)=>{const y=520+i*90;const l=txt(S,q,700,y,{fs:30,color:C.ink});l.style.translate='-100% -50%';const r=txt(S,a,760,y,{fs:30,color:c});r.style.translate='0 -50%';show([l,r],cue(sid,w),.4)});

/* ============ S5: pass@k versus pass^k ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);const P=(k,y)=>[240+k*190,860-y*560];
  const ax=ln(svg,...P(.6,0),...P(5.4,0),C.axis,3),ay=ln(svg,...P(.6,0),...P(.6,1.05),C.axis,3);fadeIn([ax,ay],at(sid,.02),.4);
  [1,2,3,4,5].forEach(k=>{const t=txt(S,String(k),...P(k,-.07),{fs:26,mono:true,color:C.dim});fadeIn(t,at(sid,.02),.4)});
  ['0','0.5','1'].forEach((s,i)=>{const t=txt(S,s,P(.6,i/2)[0]-40,P(.6,i/2)[1],{fs:24,mono:true,color:C.dim});fadeIn(t,at(sid,.02),.4)});
  const xl=txt(S,'attempts k',P(3,-.16)[0],P(3,-.16)[1],{fs:28,it:true,color:C.dim});fadeIn(xl,at(sid,.02),.4);
  const att=[];for(let k=1;k<=5;k++)att.push([k,1-Math.pow(.1,k)]);const hat=[];for(let k=1;k<=5;k++)hat.push([k,Math.pow(.9,k)]);
  const pa=pth(svg,polyD(P,att),C.green,6),ph=pth(svg,polyD(P,hat),C.red,6);
  drawOn(pa,cue(sid,'least'),1);const la=txt(S,'pass@k: at least one succeeds',P(3.5,1.0)[0],P(3.5,1.0)[1]-34,{fs:30,color:C.green});show(la,cue(sid,'least'),.4);
  drawOn(ph,cue(sid,'hat'),1.2);const lh=txt(S,'pass^k: all k succeed',P(3.4,.62)[0]+60,P(3.4,.62)[1]+60,{fs:30,color:C.red});show(lh,cue(sid,'hat'),.4);
  const dots=hat.map(([k,y])=>{const [x,yy]=P(k,y);const d=el(S,'abs hid','',{left:(x-9)+'px',top:(yy-9)+'px',width:'18px',height:'18px',borderRadius:'9px',background:C.red});show(d,cue(sid,'power'),.3,{y:0});return d});
  const eq=eqn(S,'\\text{pass}^k \\approx p^{\\,k}\\qquad 0.9^5 \\approx 0.59',1520,330,48);show(eq,cue(sid,'power'),.5);
  const ln5=ln(svg,...P(5,0),...P(5,.59),C.red,2,{dash:'6 8'});fadeIn(ln5,cue(sid,'sixty'),.4);
  const t5=txt(S,'0.59',P(5,.59)[0]+60,P(5,.59)[1],{fs:30,mono:true,color:C.red});show(t5,cue(sid,'sixty'),.4);
  const us=txt(S,'pass^k: what a user relying on it experiences',1560,430,{fs:28,it:true,color:C.dim});show(us,cue(sid,'relying'),.4);
  sceneInOut(sid);
})();
