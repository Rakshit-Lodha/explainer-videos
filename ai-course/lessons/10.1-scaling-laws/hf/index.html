  show([xlab,ylab],cue(sid,'build'),.5);
  // gopher: 280B x 300B ; chinchilla: 70B x 1.4T  (x: 280B -> 800px, y: 1.4T -> 620px)

  const area=txt(S,'area = N × D ∝ compute',1500,300,{fs:40,it:true,color:C.pink});show(area,cue(sid,'faster'),.5);
  tl.to(rect,{scaleY:1,scaleX:cw/gw,duration:1.6,ease:'power2.inOut'},cue(sid,'chinchilla'));
  tl.to(rect,{borderColor:C.green,background:'#83c16733',duration:1.6},cue(sid,'chinchilla'));
  const clab=txt(S,'Chinchilla · 70B params · 1.4T tokens',720,250,{fs:34,color:C.green});show(clab,cue(sid,'quarter'),.5);
  tl.to(glab,{opacity:.35,duration:.5},cue(sid,'chinchilla'));
  const gh2=el(S,'abs','',{left:O[0]+'px',top:(O[1]-gh)+'px',width:gw+'px',height:gh+'px',border:'3px dashed #58c4dd',opacity:0,visibility:'hidden'});gh2.setAttribute('data-layout-allow-overlap','');
  tl.to(gh2,{autoAlpha:.6,duration:.4},cue(sid,'chinchilla'));

  show(rule,cue(sid,'equal'),.6);
  const same=txt(S,'same compute',1500,620,{fs:38,it:true,color:C.dim});show(same,cue(sid,'same'),.4);
  const win=txt(S,'Chinchilla outperformed Gopher',1500,720,{fs:40,color:C.green});show(win,cue(sid,'outperformed'),.5);

/* ============ S7: trained once, served many times ============ */
(function(){const S=$('S7');const sid='s7';
  const tr=box(S,330,330,300,160,'train<br>once',C.pink,{fs:44});show(tr,cue(sid,'trained'),.5);
  const dots=[];for(let r=0;r<5;r++)for(let k=0;k<14;k++){const d=el(S,'abs','',{left:(620+k*44)+'px',top:(270+r*32)+'px',width:'22px',height:'22px',borderRadius:'50%',background:C.blue,opacity:0,visibility:'hidden'});dots.push(d)}
  tl.to(dots,{autoAlpha:1,duration:.12,stagger:.025},cue(sid,'queried'));
  const ql=txt(S,'queried again and again',930,470,{fs:36,it:true,color:C.blue});show(ql,cue(sid,'enormous'),.4);
  // two plans, stacked cost bars (illustrative)
  const base=900;const plans=[['compute-optimal',1450,[[1.0,C.pink],[2.4,C.blue]]],['smaller, longer',1700,[[1.3,C.pink],[1.2,C.blue]]]];
  const els=[];
  plans.forEach(([name,x,segs],j)=>{let y=base;segs.forEach(([v,col],i)=>{const h=v*120;const b=el(S,'abs','',{left:(x-60)+'px',top:(y-h)+'px',width:'120px',height:h+'px',background:col,opacity:0,visibility:'hidden'});y-=h;els.push(b);
      tl.fromTo(b,{autoAlpha:0,scaleY:0,transformOrigin:'50% 100%'},{autoAlpha:1,scaleY:1,duration:.5,immediateRender:false},(j?cue(sid,'paying'):cue(sid,'llama'))+i*.3)});
    const l=txt(S,name,x,base+40,{fs:30,it:true,color:C.ink});show(l,j?cue(sid,'paying'):cue(sid,'llama'),.4)});
  const lg1=txt(S,'■ training',1240,780,{fs:30,color:C.pink}),lg2=txt(S,'■ serving',1240,830,{fs:30,color:C.blue});
  show([lg1,lg2],cue(sid,'llama'),.4);
  const ill=txt(S,'illustrative costs',1575,990,{fs:26,it:true,color:C.dim});show(ill,cue(sid,'llama'),.4);
  const svg=layerSvg(S);
  const P=(x,y)=>[160+x*900,880-y*300];
  const ax=ln(svg,160,880,1060,880,C.axis,3),ay=ln(svg,160,880,160,560,C.axis,3);
  fadeIn([ax,ay],cue(sid,'reported'),.4);
  const cv=pth(svg,polyD(P,pts2d(x=>0.95*Math.exp(-3.2*x)+0.12-0.05*x,0.02,1,60)),C.green,5);
  drawOn(cv,cue(sid,'smallest'),1.3);
  const cl=txt(S,'smallest model: still improving after 1T tokens',610,600,{fs:32,it:true,color:C.green});show(cl,cue(sid,'trillion'),.5);
  const xt=txt(S,'tokens seen',610,920,{fs:28,it:true,color:C.dim});show(xt,cue(sid,'reported'),.4);
  sceneInOut(sid);
})();

/* ============ S8: loss is not skill; next lesson ============ */
(function(){const S=$('S8');const sid='s8';
  const svg=layerSvg(S);
  const P1=(x,y)=>[160+x*640,620-y*360],P2=(x,y)=>[1060+x*640,620-y*360];
  const axs=[];[P1,P2].forEach(P=>{const a=ln(svg,P(0,0)[0],P(0,0)[1],P(1,0)[0],P(1,0)[1],C.axis,3),b=ln(svg,P(0,0)[0],P(0,0)[1],P(0,1)[0],P(0,1)[1],C.axis,3);axs.push(a,b);fadeIn([a,b],at(sid,.02),.5)});
  const c1=pth(svg,polyD(P1,pts2d(x=>0.85-0.6*x+0.12*x*x,0,1,40)),C.blue,5);drawOn(c1,cue(sid,'loss'),1);
  const c2=pth(svg,polyD(P2,pts2d(x=>0.05+0.03*x+0.75/(1+Math.exp(-(x-.72)*30)),0,1,80)),C.yellow,5);drawOn(c2,cue(sid,'task'),1.4);
  const t1=txt(S,'loss: smooth',480,680,{fs:36,it:true,color:C.blue}),t2=txt(S,'one task: can jump',1380,680,{fs:36,it:true,color:C.yellow});
  show(t1,cue(sid,'loss'),.4);show(t2,cue(sid,'individual'),.4);
  fadeOut([c1,c2,t1,t2,...axs],cue(sid,'comes')-.3,.5);
  // completer vs assistant
  const comp=para(S,'<span class="mono" style="font-size:30px;color:#7f8b99">Q: What is the capital of France?<br>Q: What is the capital of Spain?<br>Q: What is the capital of Italy?</span>',220,330,700,{fs:30});
  const asst=para(S,'<span class="mono" style="font-size:30px;color:#7f8b99">Q: What is the capital of France?</span><br><span style="font-size:36px">The capital of France is Paris.</span>',1080,330,720,{fs:30});

  show([comp,h1],cue(sid,'completer'),.6);show([asst,h2],cue(sid,'assistant'),.6);
  nextUp(S,sid,'lesson',1,'10.2 &nbsp;fine-tuning and instruction tuning');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
