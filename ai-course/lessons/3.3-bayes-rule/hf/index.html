#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Newsreader',Georgia,serif;color:var(--ink);
  background:radial-gradient(ellipse 80% 75% at 45% 50%,#141a22 0%,#0e1116 60%,#0a0c10 100%)}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;visibility:hidden}
.abs{position:absolute}

.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:52px;opacity:0;visibility:hidden}
.colv{position:absolute}
.colv .br{position:absolute;top:0;width:18px;border:4px solid currentColor}
.colv .br.l{left:0;border-right:none;border-radius:6px 0 0 6px}
.colv .br.r{right:0;border-left:none;border-radius:0 6px 6px 0}
.colv .cell{position:absolute;left:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace}
.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
.ttl{position:absolute;font-size:46px;opacity:0;visibility:hidden;white-space:nowrap}
svg .hid{opacity:0;visibility:hidden}

function hl(parent,x,y,w,h,color){return el(parent,'hl','',{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
/* closing line naming the next lesson */
function nextUp(S,text,time){const n=el(S,'cap','next &nbsp;·&nbsp; '+text,{top:'940px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(n,time,.7);return n}
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
/* ============ S1: the puzzle ============ */
(function(){const S=$('S1');const sid='s1';
  const a=note(S,'1 person in 100 has the disease',260,220,900,{fontSize:'54px',fontStyle:'normal'});show(a,cue(sid,'disease'),.6);
  const b=note(S,'the test is right 99 times in 100',260,320,900,{fontSize:'54px',fontStyle:'normal'});show(b,cue(sid,'test'),.6);
  const c=el(S,'chip','your result: <b style="color:#fc6255">positive</b>',{left:'260px',top:'450px',borderColor:C.red});show(c,cue(sid,'positive'),.6);
  const q=lbl(S,tex('P(\\text{ill}\\mid +)\\;=\\;?',72),1450,330,{});show(q,cue(sid,'certain'),.6);
  // intuition gauge vs truth
  const svg=layerSvg(S);
  const gx=260,gy=700,gw=1400;
  const track=svgEl('rect',{x:gx,y:gy,width:gw,height:26,rx:13,fill:'#1d2531',style:'opacity:0;visibility:hidden'},svg);
  const fill=svgEl('rect',{x:gx,y:gy,width:0,height:26,rx:13,fill:C.red},svg);
  fadeIn(track,cue(sid,'feel'),.4);
  const st=state({p:0},o=>fill.setAttribute('width',(gw*o.p).toFixed(1)));
  drive(st,cue(sid,'feel'),1.2,{p:.97},o=>fill.setAttribute('width',(gw*o.p).toFixed(1)),'power2.out');
  const fl=lbl(S,'what it feels like: almost certain',gx+gw*.97-260,gy-50,{fontSize:'38px',fontStyle:'italic',color:C.dim});show(fl,cue(sid,'feel'),.5);
  drive(st,cue(sid,'yet'),1.4,{p:.5},o=>fill.setAttribute('width',(gw*o.p).toFixed(1)));
  fadeOut(fl,cue(sid,'yet'),.3);
  const tr=lbl(S,'the real chance: about one in two',gx+gw*.5,gy+90,{fontSize:'42px',color:C.yellow});show(tr,cue(sid,'chance'),.6);
  ['0','0.5','1'].forEach((t,i)=>{const d=lbl(S,`<span class="mono">${t}</span>`,gx+gw*i/2,gy-30,{fontSize:'30px',color:C.dim});fadeIn(d,cue(sid,'feel'),.4)});
  const br=el(S,'chip','Bayes\' rule',{left:'1460px',top:'860px',borderColor:C.teal,color:C.teal});show(br,cue(sid,"bayes'"),.6);
  sceneInOut(sid);
})();

/* ============ S2: ten thousand people ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const cols=125,rows=80,cell=8.6,x0=140,y0=190;
  const rnd=seedRand(42);const idx=[];for(let i=0;i<10000;i++)idx.push(i);
  for(let i=9999;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
  const ill=new Set(idx.slice(0,100)),fp=new Set(idx.slice(100,199));
  const pos=i=>[x0+(i%cols)*cell,y0+Math.floor(i/cols)*cell];
  let dH='',dI='',dF='';
  for(let i=0;i<10000;i++){const [x,y]=pos(i);const r=`M${x.toFixed(1)},${y.toFixed(1)}h5.6v5.6h-5.6z`;if(ill.has(i))dI+=r;else if(fp.has(i))dF+=r;else dH+=r}
  const pH=svgEl('path',{d:dH+dF,fill:C.grid,'fill-opacity':.75,style:'opacity:0;visibility:hidden'},svg);
  const pI=svgEl('path',{d:dI,fill:C.red,style:'opacity:0;visibility:hidden'},svg);
  const pF=svgEl('path',{d:dF,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(pH,cue(sid,'grid'),.8);
  const tot=note(S,'10,000 people',1260,200,600,{fontSize:'46px',fontStyle:'normal'});show(tot,cue(sid,'ten'),.5);
  fadeIn(pI,cue(sid,'hundred'),.5);
  const t1=note(S,'<span style="color:#fc6255">■</span> 100 ill: the test catches 99',1260,290,640,{fontSize:'38px'});show(t1,cue(sid,'catches'),.5);
  const t2=note(S,'9,900 healthy',1260,370,640,{fontSize:'38px',color:C.dim});show(t2,cue(sid,'healthy'),.5);
  fadeIn(pF,cue(sid,'false'),.5);
  const t3=note(S,'<span style="color:#f5cf4a">■</span> 1% of them test positive anyway: 99',1260,430,640,{fontSize:'38px'});show(t3,cue(sid,'false'),.5);
  fadeTo(pH,cue(sid,'positive',2),.18,.6);
  // the positive group, gathered: 99 ill + 99 false alarms
  const gx=1300,gy=620,gc=22,gs=17;let d1='',d2='';
  for(let k=0;k<198;k++){const x=gx+(k%gc)*gs,y=gy+Math.floor(k/gc)*gs;const r=`M${x},${y}h12v12h-12z`;if(k<99)d1+=r;else d2+=r}
  const g1=svgEl('path',{d:d1,fill:C.red,style:'opacity:0;visibility:hidden'},svg),g2=svgEl('path',{d:d2,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  fadeIn([g1,g2],cue(sid,'places'),.6);
  const gl=note(S,'everyone who tested positive: 198',1300,560,620,{fontSize:'34px',color:C.dim});show(gl,cue(sid,'places'),.5);
  const half=note(S,'half of them are ill',1300,800,620,{fontSize:'44px',color:C.ink});show(half,cue(sid,'half'),.6);
  sceneInOut(sid);
})();

/* ============ S3: the counting as a formula ============ */
(function(){const S=$('S3');const sid='s3';
  const f=lbl(S,tex('P(\\text{ill}\\mid +)=\\frac{P(+\\mid \\text{ill})\\;P(\\text{ill})}{P(+)}',84),960,330,{});
  show(f,cue(sid,'probability'),.8);
  const mk=(t,x,y,c,w)=>{const d=lbl(S,t,x,y,{fontSize:'40px',fontStyle:'italic',color:c});return d};
  const lk=mk('likelihood',960-20,560,C.blue),pr=mk('prior',1160+20,560,C.green),ev=mk('evidence',1070,640,C.dim),po=mk('posterior',600,560,C.pink);
  const hlL=hl(S,800,240,190,90,C.blue),hlP=hl(S,1000,240,170,90,C.green);
  fadeIn(hlL,cue(sid,'likelihood'),.4);show(lk,cue(sid,'likelihood'),.5);
  fadeIn(hlP,cue(sid,'prior'),.4);show(pr,cue(sid,'prior'),.5);
  fadeOut([hlL,hlP],cue(sid,'division'),.4);show(ev,cue(sid,'division'),.5);
  show(po,cue(sid,'probability'),.5);
  const num=lbl(S,tex('=\\frac{0.99\\times0.01}{0.99\\times0.01\\;+\\;0.01\\times0.99}=0.5',60),960,820,{color:C.yellow});
  show(num,cue(sid,'rescales'),.7);
  sceneInOut(sid);
})();

/* ============ S4: intuition swaps the conditionals; the prior matters ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const c1=el(S,'chip',`${tex('P(+\\mid\\text{ill})=0.99',44)}`,{left:'200px',top:'200px',borderColor:C.blue});
  const c2=el(S,'chip',`${tex('P(\\text{ill}\\mid +)=0.5',44)}`,{left:'200px',top:'330px',borderColor:C.pink});
  show(c1,cue(sid,'excellent'),.6);
  const q1=note(S,'if I am ill, will it be positive?',720,212,520,{fontSize:'38px',color:C.blue});show(q1,cue(sid,'ill'),.5);
  show(c2,cue(sid,'reverse'),.6);
  const q2=note(S,'if positive, am I ill?',720,342,520,{fontSize:'38px',color:C.pink});show(q2,cue(sid,'reverse'),.5);
  // posterior as a function of the prior
  const A=axes(svg,{x:260,y:540,w:1100,h:360,xmin:-4,xmax:0,ymin:0,ymax:1,yAt:-4,xticks:[-4,-3,-2,-1,0],yticks:[.5,1]});
  A.g.setAttribute('style','opacity:0;visibility:hidden');
  const post=lp=>{const p=10**lp;return .99*p/(.99*p+.01*(1-p))};
  const cv=svgEl('path',{d:fpath(A,post,-4,0),fill:'none',stroke:C.pink,'stroke-width':5,style:'opacity:0;visibility:hidden'},svg);
  const xl=['1/10000','1/1000','1/100','1/10','1'].map((t,i)=>lbl(S,`<span class="mono">${t}</span>`,A.X(i-4),A.Y(0)+38,{fontSize:'28px',color:C.dim}));
  const yl=[['0.5',.5],['1',1]].map(([t,v])=>lbl(S,`<span class="mono">${t}</span>`,A.X(-4)-40,A.Y(v),{fontSize:'28px',color:C.dim}));
  const ax=lbl(S,'prior: how rare the disease is',A.X(-2),A.Y(0)+85,{fontSize:'34px',fontStyle:'italic',color:C.dim});
  const ay=lbl(S,tex('P(\\text{ill}\\mid +)',36),A.X(-4)+110,A.Y(1)-10,{color:C.pink});
  fadeIn([A.g,cv].concat(xl,yl,[ax,ay]),cue(sid,'depends'),.6);
  const dot=svgEl('circle',{r:12,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  const vl=el(S,'abs mono','',{left:'1420px',top:'640px',fontSize:'36px',color:C.yellow,whiteSpace:'nowrap'});
  const render=o=>{dot.setAttribute('cx',A.X(o.l));dot.setAttribute('cy',A.Y(post(o.l)));vl.textContent=`prior 1/${Math.round(10**-o.l)} → ${post(o.l).toFixed(2)}`};
  const st=state({l:-2},render);gsap.set(vl,{autoAlpha:0});
  fadeIn([dot,vl],cue(sid,'rare'),.4);
  drive(st,cue(sid,'rare')+.3,1.8,{l:-1},render);
  drive(st,cue(sid,'small'),2.2,{l:-3.3},render);
  const lab=note(S,'a small prior can outweigh an accurate test',1420,720,460,{fontSize:'34px',color:C.dim});show(lab,cue(sid,'outweigh'),.5);
  sceneInOut(sid);
})();

/* ============ S5: posterior becomes the next prior ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const vals=[.01,.5,.99],xs=[420,960,1500],by=760,bh=440;
  const cols=[C.green,C.pink,C.pink];
  const bs=vals.map((v,i)=>{const r=svgEl('rect',{x:xs[i]-70,y:by-bh*v,width:140,height:bh*v,rx:6,fill:cols[i],'fill-opacity':.85,style:'opacity:0;visibility:hidden'},svg);
    svgEl('rect',{x:xs[i]-70,y:by-bh,width:140,height:bh,rx:6,fill:'none',stroke:C.dim,'stroke-width':2,'stroke-dasharray':'8 8'},svg);return r});
  const vl=vals.map((v,i)=>lbl(S,`<span class="mono">${v}</span>`,xs[i],by+44,{fontSize:'40px',color:cols[i]}));
  const nm=['prior','after test 1','after test 2'].map((t,i)=>lbl(S,t,xs[i],by+100,{fontSize:'36px',fontStyle:'italic',color:C.dim}));
  const tm=[cue(sid,'again'),cue(sid,'posterior'),cue(sid,'second')+.6];
  bs.forEach((b,i)=>{tl.fromTo(b,{autoAlpha:0,scaleY:0,transformOrigin:'50% 100%'},{autoAlpha:1,scaleY:1,duration:.8,immediateRender:false},tm[i]);show([vl[i],nm[i]],tm[i]+.2,.4)});
  const ar=[0,1].map(i=>{const a=mkArrow(svg,PX,C.ink,5);a.hl=22;setArrow(a,{x0:xs[i]+90,y0:420,x1:xs[i]+90,y1:420});return a});
  const al=['+ positive','+ positive'].map((t,i)=>lbl(S,t,(xs[i]+xs[i+1])/2,370,{fontSize:'34px',color:C.red}));
  [0,1].forEach(i=>{showArrow(ar[i],tm[i+1]-.4,.2);arrowTo(ar[i],tm[i+1]-.4,.6,{x1:xs[i+1]-90},'power2.out');show(al[i],tm[i+1]-.4,.4)});
  const pp=note(S,'today\'s posterior is tomorrow\'s prior',560,190,800,{fontSize:'44px',textAlign:'center'});show(pp,cue(sid,"tomorrow's"),.6);
  sceneInOut(sid);
})();

/* ============ S6: conditional next-token distributions ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const words=['The','capital','of','France','is'];
  const line=el(S,'abs','',{left:'200px',top:'230px',fontSize:'56px',fontStyle:'italic',whiteSpace:'nowrap'});
  const ws=words.map(w=>{const sp=document.createElement('span');sp.textContent=w+' ';sp.style.opacity=0;sp.style.visibility='hidden';sp.style.display='inline-block';sp.style.marginRight='14px';line.appendChild(sp);return sp});
  const toks=['Paris','a','the','Lyon','not','big'];
  const dists=[[.04,.2,.25,.02,.2,.29],[.15,.25,.3,.08,.12,.1],[.55,.12,.1,.13,.05,.05],[.92,.02,.02,.03,.005,.005]];
  const A=axes(svg,{x:1080,y:330,w:700,h:420,xmin:0,xmax:7,ymin:0,ymax:1,yaxis:false});
  const B=bars(svg,A,[1,2,3,4,5,6],dists[0].map(()=>0),{color:C.blue,w:.7});
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(B.g);
  const tk=toks.map((t,i)=>lbl(S,t,A.X(i+1),A.Y(0)+38,{fontSize:'30px',fontStyle:'italic',color:C.ink}));
  const render=o=>B.set(o.h);
  const st={v:{h:dists[0].map(()=>0)}};
  const tw=(time,h)=>{const o={k:0};const from=st.v.h.slice();tl.to(o,{k:1,duration:.8,ease:'power2.inOut',immediateRender:false,onUpdate:()=>B.set(from.map((f,i)=>f+(h[i]-f)*o.k))},time);st.v.h=h.slice()};
  const ts=[cue(sid,'conditional'),cue(sid,'word'),cue(sid,'reshapes'),cue(sid,'comes')];
  show(ws.slice(0,2),ts[0]-.4,.5,{stagger:.2});fadeIn([g].concat(tk),ts[0]-.4,.5);
  tw(ts[0],dists[1]);show(ws[2],ts[1],.4);show(ws[3],ts[2]-.3,.4);tw(ts[2],dists[2]);show(ws[4],ts[3]-.2,.4);tw(ts[3],dists[3]);
  const cap=lbl(S,tex('P(\\text{next token}\\mid\\text{everything before})',48),640,420,{color:C.blue});show(cap,cue(sid,'probability'),.6);
  const ev=note(S,'each word is evidence that reshapes the distribution',200,560,780,{fontSize:'40px',color:C.dim});show(ev,cue(sid,'evidence'),.6);
  nextUp(S,'3.4 &nbsp;the Gaussian and why it\'s everywhere',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
