function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers (modules 10-12) ---- */
function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

function block(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||28)+'px',borderRadius:'10px'});if(o.bg)d.style.background=o.bg;return d}

/* ============ S1: the same loop; what goes wrong ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);

/* ============ S2: a tool is a name, a description and a schema ============ */
(function(){const S=$('S2');const sid='s2';
  const py=box(S,480,420,640,260,'<span class="mono" style="font-size:26px;text-align:left;line-height:1.55">def get_weather(<span style="color:#58c4dd">city: str</span>,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#58c4dd">days: int = 1</span>):<br>&nbsp;&nbsp;&nbsp;&nbsp;"""Forecast for a city,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;for 1-7 days."""</span>',C.dim,{fs:26});
  const card=box(S,1400,420,640,360,'<span class="mono" style="font-size:25px;text-align:left;line-height:1.55"><span style="color:#f5cf4a">name:</span> get_weather<br><span style="color:#f5cf4a">description:</span><br>&nbsp;&nbsp;Forecast for a city, for 1-7 days.<br><span style="color:#f5cf4a">parameters:</span><br>&nbsp;&nbsp;city: string &nbsp;(required)<br>&nbsp;&nbsp;days: integer</span>',C.yellow,{fs:25});
  show(card,at(sid,.02),.6);
  const pr=txt(S,'the description is part of the prompt',1400,700,{fs:30,it:true,color:C.yellow});show(pr,cue(sid,'prompt'),.5);
  const rd=txt(S,'the model reads it to decide when and how to call',1400,760,{fs:28,it:true,color:C.dim});show(rd,cue(sid,'decide'),.5);
  const wl=el(S,'cap','writing the description well matters as much as writing the function',{top:'880px',fontSize:'34px',fontStyle:'italic',color:C.ink});show(wl,cue(sid,'writing'),.5);
  show(py,cue(sid,'signature'),.5);
  const svg=layerSvg(S);const a=pxArrow(svg,C.green,5,820,420,1060,420,'<span style="font-size:26px;font-style:italic">generated</span>',-120,-40,S);growPx(a,cue(sid,'generating'),.6);
  const dr=txt(S,'code and description cannot drift apart',480,610,{fs:28,it:true,color:C.green});show(dr,cue(sid,'drifting'),.5);
  sceneInOut(sid);
})();

/* ============ S3: validate first; errors are observations ============ */
(function(){const S=$('S3');const sid='s3';
  const svg=layerSvg(S);
  const call=box(S,400,300,560,110,'<span class="mono" style="font-size:28px">book_room(room="A2")</span>',C.blue,{fs:28});show(call,cue(sid,'running'),.5);
  const v=box(S,1000,300,300,110,'check schema',C.ink,{fs:34});const a=pxArrow(svg,C.ink,4,690,300,840,300);growPx(a,cue(sid,'checks'),.4);show(v,cue(sid,'checks'),.4);

})();

/* ============ S4: cap observation size ============ */
(function(){const S=$('S4');const sid='s4';
  const big=el(S,'abs hid','',{left:'200px',top:'200px',width:'520px',height:'640px',border:'3px solid #fc6255',borderRadius:'12px',background:'repeating-linear-gradient(#1b212b 0px,#1b212b 14px,#141a22 14px,#141a22 22px)'});
  show(big,at(sid,.02),.5);
  const bl=txt(S,'a whole log file: megabytes',460,880,{fs:30,it:true,color:C.red});show(bl,cue(sid,'megabytes'),.4);
  const win=el(S,'abs hid','',{left:'860px',top:'560px',width:'360px',height:'300px',border:'3px solid #c9d3e0',borderRadius:'12px'});show(win,cue(sid,'crowd'),.4);
  const wl=txt(S,'context window',1040,900,{fs:26,it:true,color:C.dim});show(wl,cue(sid,'crowd'),.4);
  const tr=box(S,1500,330,560,230,'<span class="mono" style="font-size:24px;text-align:left;line-height:1.5">INFO start …<br>INFO loading …<br><span style="color:#f5cf4a">…[2,000,000 chars cut]…</span><br>ERROR disk full</span>',C.yellow,{fs:24});

/* ============ S5: when to stop ============ */
(function(){const S=$('S5');const sid='s5';
  const an=box(S,480,250,560,100,'<span>reply without a tool → <span style="color:#83c167">stop</span></span>',C.green,{fs:34});show(an,cue(sid,'replies'),.5);
  const G=[['steps',6,6],['tokens',.62,1],['time',.4,1]];
  G.forEach(([n,v,max],i)=>{const y=470+i*120;const l=txt(S,n,260,y,{fs:32,color:C.ink});
    const tr=el(S,'abs hid','',{left:'360px',top:(y-22)+'px',width:'560px',height:'44px',border:'2px solid #7f8b99',borderRadius:'8px'});
    const fl=el(S,'abs hid','',{left:'362px',top:(y-20)+'px',width:(556*v/max)+'px',height:'40px',background:i?C.blue:C.red,borderRadius:'6px',transformOrigin:'0% 50%'});
    show([l,tr],cue(sid,'budgets'),.4);tl.set(fl,{scaleX:0},cue(sid,'budgets'));tl.to(fl,{autoAlpha:1,duration:.2},cue(sid,'maximum')+.2*i);tl.to(fl,{scaleX:1,duration:1.2,ease:'power1.inOut'},cue(sid,'maximum')+.2*i)});

  show(c1,cue(sid,'repetition'),.4);show(c2,cue(sid,'same'),.4);
  const st=box(S,1420,620,320,90,'stuck',C.red,{fs:38});show(st,cue(sid,'stuck'),.4);
  const tw=txt(S,'same call, same arguments, twice in a row',1420,730,{fs:26,it:true,color:C.dim});show(tw,cue(sid,'twice'),.4);
  sceneInOut(sid);
})();

/* ============ S6: workflow or agent? ============ */
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);
  const wt=txt(S,'workflow: steps known in advance',560,220,{fs:34,color:C.yellow});show(wt,at(sid,.02),.5);

  const ir=box(S,960,760,760,120,'<span>payments, deletions &nbsp;→&nbsp; <span style="color:#f5cf4a">wait for a person</span></span>',C.red,{fs:34});show(ir,cue(sid,'undone'),.5);

/* ============ S7: the transcript keeps growing ============ */
(function(){const S=$('S7');const sid='s7';
  const svg=layerSvg(S);
  const lim=ln(svg,500,300,1420,300,C.red,4,{dash:'14 10'});const ll=txt(S,'context window limit',1600,300,{fs:28,color:C.red});
  const blocks=[];for(let i=0;i<12;i++){const b=block(S,560,800-i*48,800,40,'',i%3===2?C.green:C.dim,{});blocks.push(b)}
  blocks.forEach((b,i)=>show(b,cue(sid,'step')+.12*i,.25,{y:-10}));
  const bl=txt(S,'every step adds an observation',960,880,{fs:30,it:true,color:C.dim});show(bl,cue(sid,'observation'),.4);
  fadeIn(lim,cue(sid,'fits'),.4);show(ll,cue(sid,'fits'),.4);
  const ex=txt(S,'slow and expensive to reread long before that',960,220,{fs:30,it:true,color:C.ink});show(ex,cue(sid,'expensive'),.4);
  nextUp(S,sid,'running',1,'13.5 &nbsp;long-running agents: context, memory and compaction');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
