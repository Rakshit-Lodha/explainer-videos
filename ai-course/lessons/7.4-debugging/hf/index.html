/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}
function axes(svg,ox,oy,w,h){const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('line',{x1:ox,y1:oy,x2:ox+w,y2:oy,stroke:C.axis,'stroke-width':3},g);svgEl('line',{x1:ox,y1:oy,x2:ox,y2:oy-h,stroke:C.axis,'stroke-width':3},g);return g}
/* the debugging checklist down the left: earlier items ticked, the active one bright */
const ITEMS=['the data','the first loss','overfit one tiny batch','gradient check','watch training','silent bugs'];
function rail(S,active,t,stagger){const box=el(S,'abs','',{left:'70px',top:'230px',width:'470px',opacity:0,visibility:'hidden'});
  const rows=ITEMS.map((it,i)=>{const done=i<active,on=i===active;
    const r=el(box,'abs','',{left:'0px',top:(i*92)+'px',width:'470px',height:'72px',display:'flex',alignItems:'center',gap:'18px',fontSize:'34px',
      color:on?C.ink:done?C.green:C.dim,opacity:stagger?0:1,visibility:stagger?'hidden':'visible'});
    r.innerHTML=`<span class="mono" style="font-size:28px;width:44px;height:44px;border-radius:50%;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center">${done?'✓':i+1}</span><span>${it}</span>`;
    if(on){r.style.borderLeft='4px solid '+C.yellow;r.style.paddingLeft='16px'}return r});
  fadeIn(box,t,.4);if(stagger)tl.to(rows,{autoAlpha:1,duration:.3,stagger:.25},t);return {box,rows}}

/* ============ S1: the loss will not go down ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const P=plane(700,700,140,90);const ax=axes(svg,700,700,1120,450);fadeIn(ax,cue(sid,'loss'),.4);
  const c=pth(svg,fpath(x=>3.4+.06*Math.sin(6*x)+.03*Math.sin(17*x),P,0,8,200),C.red,5);drawOn(c,cue(sid,'loss'),1.5,'none');
  const cl=lab(S,'the loss simply will not go down',1260,320,C.red,38);show(cl,cue(sid,'down'),.4);
  const k1=el(S,'chip','a different learning rate?',{borderColor:C.dim,fontSize:'32px',color:C.dim});place(k1,1000,800);show(k1,cue(sid,'learning'),.4);
  const k2=el(S,'chip','another layer?',{borderColor:C.dim,fontSize:'32px',color:C.dim});place(k2,1450,800);show(k2,cue(sid,'layer'),.4);
  tl.to([k1,k2],{rotation:-4,duration:.15,yoyo:true,repeat:5},cue(sid,'random'));
  const q=el(S,'cap','a buggy network rarely crashes; it quietly learns badly',{top:'900px',fontSize:'40px',fontStyle:'italic',color:C.ink});show(q,cue(sid,'quietly'),.5);
  tl.to([k1,k2],{autoAlpha:.25,duration:.4},cue(sid,'checklist'));
  rail(S,-1,cue(sid,'checklist'),true);
  sceneInOut(sid);
})();

/* ============ S2: the data ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  rail(S,0,at(sid,0));
  const digits=['3','7','1','9'];
  const imgs=digits.map((d,i)=>{const b=boxEl(S,720,300+i*120,100,96,`<span class="mono" style="font-size:60px">${d}</span>`,C.blue);show(b,cue(sid,'examples')+i*.15,.4);return b});
  const arr=digits.map((d,i)=>{const a=ln(svg,780,300+i*120,860,300+i*120,C.dim,3);fadeIn(a,cue(sid,'labels'),.3);return a});
  const labs=digits.map((d,i)=>{const b=boxEl(S,930,300+i*120,110,70,`<span data-layout-allow-overlap style="font-size:34px">"${d}"</span>`,C.green);show(b,cue(sid,'labels'),.4);return b});
  const ok=lab(S,'labels match',825,190,C.green,32);show(ok,cue(sid,'match'),.4);
  labs.forEach((b,i)=>tl.to(b,{y:((i+1)%4-i)*120,borderColor:C.red,duration:.8,ease:'power2.inOut'},cue(sid,'shuffles')));
  tl.to(ok,{autoAlpha:0,duration:.3},cue(sid,'shuffles'));
  const bad=lab(S,'inputs and labels shuffled separately',825,190,C.red,32);show(bad,cue(sid,'separately'),.4);
  const sh=el(S,'code','<span class="f">print</span>(x.shape, y.shape)\n<span class="c"># (64, 784) (64,)</span>',{left:'1160px',top:'250px'});show(sh,cue(sid,'shapes'),.5);
  const P=v=>1180+(v+10)*2.5;
  const nl=ln(svg,P(-10),720,P(262),720,C.axis,3);fadeIn(nl,cue(sid,'range'),.3);
  [0,255].forEach(v=>{const t=lab(S,String(v),P(v),760,C.dim,26,false);fadeIn(t,cue(sid,'range'),.3)});
  const raw=svgEl('rect',{x:P(0),y:650,width:P(255)-P(0),height:40,rx:6,fill:C.red,'fill-opacity':.6,style:'opacity:0;visibility:hidden'},svg);fadeIn(raw,cue(sid,'pixel'),.4);
  const rl=lab(S,'raw pixels: 0 to 255',P(128),620,C.red,32);show(rl,cue(sid,'pixel'),.4);
  const sc=svgEl('rect',{x:P(-1)-3,y:650,width:P(1)-P(-1)+6,height:40,rx:3,fill:C.green,style:'opacity:0;visibility:hidden'},svg);fadeIn(sc,cue(sid,'scaled'),.4);
  const sl=lab(S,'scaled near zero',P(0)+30,820,C.green,32);show(sl,cue(sid,'scaled'),.4);
  sceneInOut(sid);
})();

/* ============ S3: first loss, then overfit one tiny batch ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const r1=rail(S,1,at(sid,0));
  const f=el(S,'abs hid','',{left:'700px',top:'180px',width:'1100px',textAlign:'center'});f.innerHTML=tex('L_0\\approx\\ln C',58)+'<span style="font-size:34px;font-style:italic;color:#7f8b99">&nbsp;&nbsp; for C classes</span>';show(f,cue(sid,'log'),.5);
  tl.to(r1.box,{autoAlpha:0,duration:.3},cue(sid,'useful'));const r2=rail(S,2,cue(sid,'useful'));
  tl.to(f,{autoAlpha:.3,duration:.4},cue(sid,'useful'));
  const cols=[C.blue,C.yellow,C.green,C.pink,C.teal];
  const sq=cols.map((c,i)=>el(S,'abs','',{left:(1080+i*80)+'px',top:'300px',width:'60px',height:'60px',borderRadius:'8px',background:c,opacity:0,visibility:'hidden'}));
  tl.to(sq,{autoAlpha:.85,duration:.2,stagger:.08},cue(sid,'handful'));
  const hl=lab(S,'one tiny batch, trained on alone',1260,400,C.ink,32);show(hl,cue(sid,'handful'),.4);
  const P=plane(760,860,130,70);const ax=axes(svg,760,860,1060,400);fadeIn(ax,cue(sid,'train'),.4);
  const good=pth(svg,fpath(x=>2.3*Math.exp(-.9*x)+.02,P,0,8,160),C.green,5);drawOn(good,cue(sid,'memorise'),1.6);
  const gl=lab(S,'working code: almost zero',1500,800,C.green,32);show(gl,cue(sid,'zero'),.4);
  const bad=pth(svg,fpath(x=>2.3-.05*x+.04*Math.sin(5*x),P,0,8,160),C.red,5);drawOn(bad,cue(sid,'cannot'),1.2);
  const bl=lab(S,'stuck: the bug is in your code',1500,640,C.red,32);show(bl,cue(sid,'code'),.4);
  sceneInOut(sid);
})();

/* ============ S4: gradient check ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  rail(S,3,at(sid,0));
  const f=w=>.3*w*w+.4*Math.sin(1.3*w)+1,df=w=>.6*w+.52*Math.cos(1.3*w);
  const P=plane(1180,860,150,95);const ax=ln(svg,P(-3,0)[0],860,P(3.1,0)[0],860,C.axis,3);fadeIn(ax,at(sid,0),.4);
  const cv=pth(svg,fpath(f,P,-3,3,160),C.blue,5);drawOn(cv,at(sid,.01),.8);
  const wl=lab(S,'loss L(w)',P(-3,0)[0]-90,470,C.blue,30);fadeIn(wl,at(sid,.02),.4);
  const w0=1.2,h=.6;const dot=(x,c)=>{const p=P(x,f(x));return svgEl('circle',{cx:p[0],cy:p[1],r:11,fill:c,style:'opacity:0;visibility:hidden'},svg)};
  const d0=dot(w0,C.yellow),dp=dot(w0+h,C.pink),dm=dot(w0-h,C.pink);
  fadeIn(d0,cue(sid,'nudge'),.3);fadeIn(dp,cue(sid,'up'),.3);fadeIn(dm,cue(sid,'down'),.3);
  const tick=x=>{const p=P(x,f(x));return ln(svg,p[0],p[1],p[0],860,C.pink,2,{'stroke-dasharray':'5 5'})};
  const t1=tick(w0+h),t2=tick(w0-h);fadeIn([t1,t2],cue(sid,'measure'),.3);
  const hl1=lab(S,'w − h',P(w0-h,0)[0],895,C.pink,28,false),hl2=lab(S,'w + h',P(w0+h,0)[0],895,C.pink,28,false);fadeIn([hl1,hl2],cue(sid,'measure'),.3);
  const sl=(f(w0+h)-f(w0-h))/(2*h);const sec=pth(svg,fpath(x=>f(w0)+sl*(x-w0),P,w0-1.3,w0+1.3,4),C.pink,4);drawOn(sec,cue(sid,'divide'),.6);
  const fm=el(S,'abs hid','',{left:'640px',top:'180px',width:'1200px',textAlign:'center'});fm.innerHTML=tex('\\frac{\\partial L}{\\partial w}\\approx\\frac{L(w+h)-L(w-h)}{2h}',54);show(fm,cue(sid,'two'),.5);
  const tg=pth(svg,fpath(x=>f(w0)+df(w0)*(x-w0)+.05,P,w0-1.3,w0+1.3,4),C.yellow,3,{'stroke-dasharray':'10 6'});drawOn(tg,cue(sid,'analytic'),.6);
  const ag=lab(S,'analytic and numeric should agree closely',1240,360,C.yellow,32);show(ag,cue(sid,'agree'),.4);
  const dg=lab(S,'a large disagreement points at the faulty layer',1240,420,C.red,32);show(dg,cue(sid,'disagreement'),.4);
  sceneInOut(sid);
})();

/* ============ S5: watch training ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  rail(S,4,at(sid,0));
  const nan=lab(S,'loss = NaN',760,260,C.red,44,false);show(nan,cue(sid,'number'),.4);
  [['learning rate too high','high'],['log(0)','log'],['division by zero','division']].forEach(([t,w],i)=>{const e=el(S,'chip',t,{borderColor:C.red,fontSize:'30px'});place(e,[1090,1350,1570][i],260);show(e,cue(sid,w),.4)});
  const base=700,bx=[700,800,900,1000,1100],H=[90,110,120,130,140];
  const bars=bx.map((x,i)=>{const r=el(S,'abs','',{left:(x-30)+'px',top:(base-200)+'px',width:'60px',height:'200px',background:C.blue,borderRadius:'6px 6px 0 0',transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});gsap.set(r,{scaleY:H[i]/200});return r});
  const bl0=ln(svg,650,base,1150,base,C.axis,3);
  fadeIn([...bars,bl0],cue(sid,'size'),.4);
  const ll=bx.map((x,i)=>lab(S,'layer '+(i+1),x,base+30,C.dim,24,false));fadeIn(ll,cue(sid,'size'),.4);
  const gt=lab(S,'gradient size per layer',900,850,C.ink,32);show(gt,cue(sid,'size'),.4);
  tl.to(bars.slice(0,3),{scaleY:.02,backgroundColor:C.red,duration:.6},cue(sid,'vanishingly'));
  const vl=lab(S,'vanishing: early layers stop learning',900,790,C.red,30);show(vl,cue(sid,'vanishingly'),.4);
  tl.to(bars.slice(0,3),{scaleY:(i)=>H[i]/200,backgroundColor:C.blue,duration:.4},cue(sid,'huge'));tl.to(vl,{autoAlpha:0,duration:.3},cue(sid,'huge'));
  tl.to(bars,{scaleY:1.6,backgroundColor:C.red,duration:.6},cue(sid,'huge')+.3);
  const el2=lab(S,'exploding: the steps blow up',900,790,C.red,30);show(el2,cue(sid,'exploding'),.4);
  const nn=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)nn.push(node(S,1380+c*100,470+r*90,30,'',C.green));
  fadeIn(nn,cue(sid,'activations'),.4);const al=lab(S,'ReLU layer activations',1530,400,C.ink,32);show(al,cue(sid,'activations'),.4);
  tl.to(nn,{borderColor:'#3a4350',backgroundColor:'#0c0f14',duration:.6,stagger:.04},cue(sid,'zero',3));
  const dl=lab(S,'all zero: the layer has gone dead',1530,850,C.dim,30);show(dl,cue(sid,'dead'),.4);
  sceneInOut(sid);
})();

/* ============ S6: silent bugs ============ */
(function(){const S=$('S6');const sid='s6';
  rail(S,5,at(sid,0));
  const card=(y,title,body,color,w)=>{const b=el(S,'abs hid','',{left:'640px',top:y+'px',width:'1180px',padding:'22px 30px',borderRadius:'16px',border:'3px solid '+color,background:'#10151c'});
    b.innerHTML=`<div style="font-size:34px;color:${color};margin-bottom:10px">${title}</div><div class="mono" style="font-size:28px;line-height:1.5;white-space:pre">${body}</div>`;show(b,cue(sid,w),.5);return b};
  card(200,'a broadcasting mismatch: no error, wrong loss','pred (B, 1) − y (B,)  →  (B, B)',C.yellow,'broadcasting');
  card(430,'uncleared or wrongly signed updates','forgot opt.zero_grad()      w += lr * grad   <span style="color:#fc6255">✗</span>',C.pink,'forgetting');
  const c3=card(660,'softmax before CrossEntropyLoss','loss_fn(softmax(logits), y)   <span style="color:#fc6255">✗ squashes the signal</span>\nloss_fn(logits, y)            <span style="color:#83c167">✓ expects raw logits</span>',C.teal,'pytorch');
  sceneInOut(sid);
})();

/* ============ S7: small runs first ============ */
(function(){const S=$('S7');const sid='s7';
  rail(S,6,at(sid,0));
  const sz=[[90,'tiny run',C.green,'small'],[200,'small run',C.teal,'tiny'],[380,'full scale',C.yellow,'compute']];
  sz.forEach(([s,t,c,w])=>{const b=el(S,'abs hid','',{left:(760)+'px',top:(820-s)+'px',width:s+'px',height:s+'px',border:'3px solid '+c,borderRadius:'10px'});show(b,cue(sid,w),.5);
    const l=lab(S,t,1260,820-s+24,c,32);show(l,cue(sid,w),.4)});
  const ck=lab(S,'check that tiny runs behave as expected',1250,300,C.ink,34);show(ck,cue(sid,'behave'),.4);
  const wk=lab(S,'a silent bug at full scale can waste weeks',1250,370,C.red,34);show(wk,cue(sid,'weeks'),.4);
  nextCap(S,sid,'next',1,'8.1 &nbsp;convolution: a sliding pattern detector');
  sceneInOut(sid,true);
})();

/* KaTeX stacks glyphs on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
