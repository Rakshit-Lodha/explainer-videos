#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Newsreader',Georgia,serif;color:var(--ink);
  background:radial-gradient(ellipse 80% 75% at 45% 50%,#141a22 0%,#0e1116 60%,#0a0c10 100%)}
.scene{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}

.abs{position:absolute}

.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:52px;opacity:0;visibility:hidden}
.colv{position:absolute}
.colv .br{position:absolute;top:0;width:18px;border:4px solid currentColor}
.colv .br.l{left:0;border-right:none;border-radius:6px 0 0 6px}
.colv .br.r{right:0;border-left:none;border-radius:0 6px 6px 0}
.colv .cell{position:absolute;left:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace}
.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
.ttl{position:absolute;font-size:46px;opacity:0;visibility:hidden;white-space:nowrap}
svg .hid{opacity:0;visibility:hidden}

function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
const DATA=[3.1,4.2,4.6,5.3,6.3];const MU=4.7,SIG=Math.sqrt(1.148);
function dataDots(svg,A,y,col){return DATA.map(x=>svgEl('circle',{cx:A.X(x),cy:y==null?A.Y(0):y,r:12,fill:col||C.ink,stroke:C.bg,'stroke-width':3}))}
/* ============ S1: which distribution produced the data? ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const A=axes(svg,{x:200,y:280,w:1300,h:520,xmin:0,xmax:10,ymin:0,ymax:.6,xticks:[0,2,4,6,8,10],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const tk=[0,2,4,6,8,10].map(v=>lbl(S,`<span class="mono">${v}</span>`,A.X(v),A.Y(0)+40,{fontSize:'30px',color:C.dim}));fadeIn(tk,at(sid,.02),.5);
  const dots=dataDots(svg,A);dots.forEach(d=>{svg.appendChild(d);d.setAttribute('style','opacity:0;visibility:hidden')});
  tl.to(dots,{autoAlpha:1,duration:.3,stagger:.12},cue(sid,'measurements'));
  const fam=[[2,.8],[3.5,1.5],[6.5,.9],[8,1.2],[5,2.2],[4.7,1.07]].map(([m,s],i)=>svgEl('path',{d:fpath(A,x=>gauss(x,m,s),0,10),fill:'none',stroke:i===5?C.yellow:C.blue,'stroke-width':i===5?6:3,opacity:i===5?1:.6,style:'opacity:0;visibility:hidden'},svg));
  fadeIn(fam.slice(0,5),cue(sid,'family'),.5,.15);
  tl.to(fam.slice(0,5),{opacity:.25,duration:.5},cue(sid,'choose'));
  fadeIn(fam[5],cue(sid,'choose'),.6);
  const q=note(S,'which one produced the data?',1540,330,360,{fontSize:'42px'});show(q,cue(sid,'which'),.5);
  const a=note(S,'the one that makes the data most probable',1540,480,360,{fontSize:'42px',color:C.yellow});show(a,cue(sid,'most'),.5);
  sceneInOut(sid);
})();

/* ============ S2: slide the Gaussian, watch the product ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const A=axes(svg,{x:160,y:300,w:1200,h:520,xmin:0,xmax:11,ymin:0,ymax:.5,xticks:[],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const cv=svgEl('path',{fill:C.yellow,'fill-opacity':.1,stroke:C.yellow,'stroke-width':5},svg);
  const sticks=DATA.map(()=>svgEl('line',{stroke:C.blue,'stroke-width':8,'stroke-linecap':'round'},svg));
  const dots=dataDots(svg,A);dots.forEach(d=>svg.appendChild(d));
  const f=lbl(S,tex('L(\\mu,\\sigma)=\\prod_{i} p(x_i\\mid\\mu,\\sigma)',44),1610,330,{});show(f,cue(sid,'multiplying'),.6);
  const val=el(S,'abs mono','',{left:'1420px',top:'470px',fontSize:'38px',color:C.blue,whiteSpace:'nowrap'});
  const barBg=svgEl('rect',{x:1420,y:560,width:440,height:30,rx:15,fill:'#1d2531'},svg);
  const bar=svgEl('rect',{x:1420,y:560,width:0,height:30,rx:15,fill:C.blue},svg);
  const Lmax=DATA.reduce((p,x)=>p*gauss(x,MU,SIG),1);
  const render=o=>{const g=x=>gauss(x,o.m,SIG);cv.setAttribute('d',farea(A,g,0,11,160));
    let P=1;DATA.forEach((x,i)=>{const h=g(x);P*=h;sticks[i].setAttribute('x1',A.X(x));sticks[i].setAttribute('x2',A.X(x));sticks[i].setAttribute('y1',A.Y(0));sticks[i].setAttribute('y2',A.Y(h))});
    val.textContent='L = '+P.toExponential(1);bar.setAttribute('width',(440*Math.max(0,1+Math.log10(P/Lmax)/12)).toFixed(1))};
  const st=state({m:1},render);
  const grp=[cv,barBg,bar,val].concat(sticks);grp.forEach(e=>gsap.set(e,{autoAlpha:0}));
  fadeIn(grp,cue(sid,'slide')-.4,.5);
  const bl=note(S,'likelihood (log scale)',1420,610,440,{fontSize:'30px',color:C.dim});fadeIn(bl,cue(sid,'slide'),.5);
  drive(st,cue(sid,'slide'),1.5,{m:8.2},render);
  const far=note(S,'far away: thin tails, tiny product',200,190,900,{fontSize:'40px',color:C.dim});show(far,cue(sid,'far'),.5);fadeOut(far,cue(sid,'top')-.3,.3);
  drive(st,cue(sid,'top')-.4,2.2,{m:MU},render,'power2.inOut');
  const on=note(S,'on top of the data: tall bars, large product',200,190,1000,{fontSize:'40px',color:C.yellow});show(on,cue(sid,'top')+.6,.5);
  sceneInOut(sid);
})();

/* ============ S3: logs turn products into sums ============ */
(function(){const S=$('S3');const sid='s3';
  const p1=lbl(S,'<span class="mono">0.01 × 0.01 × 0.01 × … &nbsp;(400 factors)</span>',700,240,{fontSize:'40px',color:C.ink});show(p1,cue(sid,'multiplying'),.6);
  const p2=lbl(S,'<span class="mono">= 0.0</span> &nbsp;on a computer',1500,240,{fontSize:'40px',color:C.red});show(p2,cue(sid,'underflows'),.5);
  const l1=lbl(S,'<span class="mono">log: &nbsp;400 × log 0.01 = −1842.1</span>',960,340,{fontSize:'40px',color:C.green});show(l1,cue(sid,'logarithm'),.6);
  const e1=lbl(S,tex('\\log \\prod_i p(x_i\\mid\\theta)\\;=\\;\\sum_i \\log p(x_i\\mid\\theta)',60),960,500,{});show(e1,cue(sid,'sum'),.7);
  const mono=note(S,'log only ever increases, so the same θ wins either way',360,600,1200,{fontSize:'40px',color:C.dim,textAlign:'center'});show(mono,cue(sid,'increases'),.5);
  const e2=lbl(S,tex('\\text{NLL}(\\theta)=-\\sum_i \\log p(x_i\\mid\\theta)',64),960,800,{color:C.yellow});show(e2,cue(sid,'flip'),.7);
  const ls=el(S,'chip','a loss: smaller is better',{left:'760px',top:'900px',borderColor:C.yellow,color:C.yellow,fontSize:'36px'});show(ls,cue(sid,'loss'),.5);
  sceneInOut(sid);
})();

/* ============ S4: the Gaussian MLE by hand ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const nll=m=>DATA.reduce((s,x)=>s+.5*((x-m)/SIG)**2+Math.log(SIG*Math.sqrt(2*Math.PI)),0);
  const A=axes(svg,{x:180,y:250,w:900,h:560,xmin:2,xmax:7.4,ymin:nll(MU)-1,ymax:nll(MU)+12,xticks:[3,4,5,6,7],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const tk=[3,4,5,6,7].map(v=>lbl(S,`<span class="mono">${v}</span>`,A.X(v),A.Y(A.o.ymin)+40,{fontSize:'30px',color:C.dim}));fadeIn(tk,at(sid,.02),.5);
  const ax=lbl(S,tex('\\text{NLL}(\\mu)',40),A.X(2.4),A.Y(nll(MU)+11.5),{color:C.yellow});fadeIn(ax,at(sid,.02),.5);
  const cv=svgEl('path',{d:fpath(A,nll,2.5,7),fill:'none',stroke:C.yellow,'stroke-width':6,style:'opacity:0;visibility:hidden'},svg);fadeIn(cv,at(sid,.04),.6);
  const dots=dataDots(svg,A,A.Y(A.o.ymin));dots.forEach(d=>{d.setAttribute('r',9);svg.appendChild(d)});
  const ball=svgEl('circle',{r:13,fill:C.pink},svg);
  const render=o=>{ball.setAttribute('cx',A.X(o.m));ball.setAttribute('cy',A.Y(nll(o.m)))};const st=state({m:2.8},render);
  gsap.set(ball,{autoAlpha:0});fadeIn(ball,cue(sid,'hand'),.4);drive(st,cue(sid,'hand'),2,{m:MU},render);
  const mline=svgEl('line',{x1:A.X(MU),y1:A.Y(A.o.ymin),x2:A.X(MU),y2:A.Y(nll(MU)),stroke:C.pink,'stroke-width':3,'stroke-dasharray':'8 8',style:'opacity:0;visibility:hidden'},svg);fadeIn(mline,cue(sid,'mean'),.5);
  const f1=lbl(S,tex('\\text{best }\\mu=\\frac{1}{n}\\sum_i x_i',58),1480,340,{color:C.pink});f1.setAttribute('data-layout-allow-overlap','');show(f1,cue(sid,'average'),.6);
  const f2=lbl(S,tex('\\text{best }\\sigma^2=\\frac{1}{n}\\sum_i (x_i-\\mu)^2',58),1480,520,{color:C.blue});f2.setAttribute('data-layout-allow-overlap','');show(f2,cue(sid,'variance'),.6);
  const nv=lbl(S,'<span class="mono">here: μ = 4.70, σ² = 1.15</span>',1480,660,{fontSize:'34px',color:C.dim});show(nv,cue(sid,'variance')+.8,.5);
  const fam=note(S,'the formulas you already use are maximum likelihood estimates',1180,760,640,{fontSize:'36px',color:C.ink,textAlign:'center'});show(fam,cue(sid,'familiar'),.5);
  sceneInOut(sid);
})();

/* ============ S5: Gaussian noise means squared error ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const A=axes(svg,{x:140,y:240,w:720,h:560,xmin:0,xmax:10,ymin:0,ymax:10,xticks:[],yticks:[]});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const f=x=>1.2+.7*x;const rnd=seedRand(31);const gn=()=>{let u=0;for(let k=0;k<12;k++)u+=rnd();return u-6};
  const pts=[];for(let i=0;i<12;i++){const x=.6+i*.8;pts.push([x,f(x)+gn()*.8])}
  const ln=svgEl('line',{x1:A.X(0),y1:A.Y(f(0)),x2:A.X(10),y2:A.Y(f(10)),stroke:C.blue,'stroke-width':5},svg);
  const res=pts.map(([x,y])=>svgEl('line',{x1:A.X(x),y1:A.Y(y),x2:A.X(x),y2:A.Y(f(x)),stroke:C.pink,'stroke-width':3},svg));
  const dots=pts.map(([x,y])=>svgEl('circle',{cx:A.X(x),cy:A.Y(y),r:9,fill:C.ink},svg));
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);[ln].concat(res,dots).forEach(e=>g.appendChild(e));fadeIn(g,at(sid,.03),.6);
  [2.5,6.5].forEach(x=>{const cx=A.X(x),cy=A.Y(f(x));let d='';for(let k=0;k<=40;k++){const z=-3+6*k/40;d+=(k?'L':'M')+(cx+gauss(z,0,1)*110).toFixed(1)+','+(cy-z*36).toFixed(1)}
    const p=svgEl('path',{d,fill:'none',stroke:C.yellow,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);fadeIn(p,cue(sid,'gaussian'),.5)});
  const e1=lbl(S,tex('y_i = f(x_i)+\\varepsilon_i,\\quad \\varepsilon_i\\sim\\mathcal{N}(0,\\sigma^2)',46),1390,280,{});show(e1,cue(sid,'gaussian'),.6);
  const e2=lbl(S,tex('-\\log p(y_i)=\\frac{(y_i-f(x_i))^2}{2\\sigma^2}+\\text{const}',46),1390,420,{});show(e2,cue(sid,'constants'),.6);
  const e3=lbl(S,tex('\\text{NLL}\\;\\propto\\;\\sum_i (y_i-f(x_i))^2',52),1390,570,{color:C.pink});show(e3,cue(sid,'squared'),.6);
  const ls=el(S,'chip','least squares = maximum likelihood',{left:'1070px',top:'680px',borderColor:C.pink,color:C.pink,fontSize:'38px'});show(ls,cue(sid,'disguise'),.6);
  const nb=note(S,'choosing a loss is choosing what you believe about the noise',1030,800,720,{fontSize:'36px',color:C.dim,textAlign:'center'});show(nb,cue(sid,'noise'),.5);
  sceneInOut(sid);
})();

/* ============ S6: a language model is trained by maximum likelihood ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const toks=[['cat',.20],['sat',.31],['on',.62],['the',.85],['mat',.46]];
  const ctx=el(S,'abs','the',{left:'220px',top:'200px',fontSize:'52px',fontStyle:'italic',opacity:0,visibility:'hidden'});show(ctx,cue(sid,'text')-.3,.5);
  const xs=toks.map((t,i)=>420+i*240);
  const A={X:x=>x,Y:y=>760-y*90};
  toks.forEach(([w,p],i)=>{const x=xs[i];
    const wd=lbl(S,w,x,232,{fontSize:'52px',fontStyle:'italic',color:C.ink});
    const pl=lbl(S,`<span class="mono">p = ${p.toFixed(2)}</span>`,x,320,{fontSize:'32px',color:C.blue});
    const h=-Math.log(p);const b=svgEl('rect',{x:x-50,y:760-h*160,width:100,height:h*160,rx:6,fill:C.yellow,'fill-opacity':.8,style:'opacity:0;visibility:hidden'},svg);
    const hl=lbl(S,`<span class="mono">${h.toFixed(2)}</span>`,x,800,{fontSize:'30px',color:C.yellow});
    const t=cue(sid,'token')+i*.35;show(wd,t,.4);show(pl,t+.15,.4);
    tl.fromTo(b,{autoAlpha:0,scaleY:0,transformOrigin:'50% 100%'},{autoAlpha:1,scaleY:1,duration:.6,immediateRender:false},cue(sid,'negative')+i*.15);show(hl,cue(sid,'negative')+i*.15+.3,.4)});
  const base=svgEl('line',{x1:330,y1:760,x2:1500,y2:760,stroke:C.axis,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);fadeIn(base,cue(sid,'negative'),.4);
  const nl=lbl(S,tex('-\\log p(\\text{correct token})',36),1670,520,{color:C.yellow});show(nl,cue(sid,'negative'),.6);
  const av=lbl(S,'<span class="mono">average = 0.84</span>',1670,620,{fontSize:'36px',color:C.yellow});show(av,cue(sid,'average'),.5);
  const mx=lbl(S,'make the training text as probable as possible',960,390,{fontSize:'38px',fontStyle:'italic',color:C.dim});show(mx,cue(sid,'probable'),.5);fadeOut(mx,cue(sid,'token'),.3);
  nextUp(S,'3.6 &nbsp;entropy: measuring surprise',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
