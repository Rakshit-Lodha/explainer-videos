/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

const relu=x=>Math.max(0,x);
const tent=x=>2*relu(x)-4*relu(x-.5);            // on [0,1]: 2x then 2-2x
const tentK=(x,k)=>{for(let i=0;i<k;i++)x=tent(x);return x};
function netDiagram(S,svg,cols,x0,dx,cy,gap,r,color){const N=cols.map((n,i)=>{const arr=[];for(let j=0;j<n;j++)arr.push(node(S,x0+i*dx,cy+(j-(n-1)/2)*gap,r,'',i===0||i===cols.length-1?C.blue:color,12));return arr});
  const E=[];for(let i=0;i<N.length-1;i++)N[i].forEach(a=>N[i+1].forEach(b=>E.push(edge(svg,a,b,C.dim,1.4))));return {N,E}}

/* ============ S1: one wide layer is enough, in principle ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const wide=netDiagram(S,svg,[1,16,1],380,320,560,50,16,C.yellow);
  const allW=[].concat(...wide.N);
  fadeIn(allW,cue(sid,'network'),.4,.03);wide.E.forEach((e,k)=>drawOn(e,cue(sid,'single')+k*.02,.5));
  const t=el(S,'abs','',{left:'120px',top:'130px',width:'900px',fontSize:'44px',fontStyle:'italic',opacity:0,visibility:'hidden'});t.innerHTML='universal approximation theorem';show(t,cue(sid,'universal'),.6);
  const t2=el(S,'abs','',{left:'120px',top:'960px',width:'900px',fontSize:'36px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});t2.innerHTML='one hidden layer, enough neurons: any continuous function';show(t2,cue(sid,'approximate'),.5);
  const deep=netDiagram(S,svg,[1,3,3,3,3,3,3,1],1100,95,560,90,16,C.pink);
  fadeIn([].concat(...deep.N),cue(sid,'stack'),.3,.02);deep.E.forEach((e,k)=>drawOn(e,cue(sid,'dozens')+k*.01,.4));
  const q=el(S,'abs','',{left:'1080px',top:'130px',width:'740px',textAlign:'center',fontSize:'44px',fontStyle:'italic',color:C.pink,opacity:0,visibility:'hidden'});q.innerHTML='so why stack layers?';show(q,cue(sid,'why'),.5);
  sceneInOut(sid);
})();

/* ============ S2: shallow networks pay for every wiggle ============ */
(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);
  const P=plane(960,600,280,200);
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:P(-3,0)[0],y1:P(0,0)[1],x2:P(3,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},ax);
  fadeIn(ax,at(sid,.01),.5);
  const g=x=>Math.sin(3.2*x)*1.2+.25*Math.sin(9*x);
  const target=pth(svg,fpath(g,P,-3,3,400),C.yellow,3,{'stroke-dasharray':'6 9'});fadeIn(target,cue(sid,'wiggles')-1.2,.6);
  const pl=n=>{const K=[];for(let i=0;i<=n;i++)K.push(-3+6*i/n);return x=>{for(let i=0;i<n;i++)if(x<=K[i+1]){const t=(x-K[i])/(K[i+1]-K[i]);return g(K[i])*(1-t)+g(K[i+1])*t}return g(3)}};
  const f=pth(svg,fpath(pl(3),P,-3,3,400),C.blue,6);fadeIn(f,cue(sid,'hinges'),.5);
  const cnt=el(S,'abs mono','',{left:'1160px',top:'180px',width:'660px',textAlign:'right',fontSize:'40px',color:C.blue,opacity:0,visibility:'hidden'});cnt.innerHTML='3 neurons → 3 corners';
  fadeIn(cnt,cue(sid,'corner'),.4);
  const one=el(S,'abs','',{left:'120px',top:'180px',width:'760px',fontSize:'40px',fontStyle:'italic',opacity:0,visibility:'hidden'});one.innerHTML='each ReLU neuron: at most one new corner';show(one,cue(sid,'contributes'),.5);
  const st={n:3};const ap=()=>{const n=Math.round(st.n);f.setAttribute('d',fpath(pl(n),P,-3,3,400));cnt.innerHTML=`${n} neurons → ${n} corners`};
  tl.to(st,{n:40,duration:3.5,ease:'power1.in',immediateRender:false,onUpdate:ap},cue(sid,'width'));
  const pay=el(S,'cap','every wiggle paid for separately',{top:'960px',fontStyle:'italic',fontSize:'46px',color:C.yellow});show(pay,cue(sid,'paid'),.5);
  sceneInOut(sid);
})();

/* ============ S3: the tent folds the interval ============ */
(function(){const S=$('S3');const sid='s3';
  const svg=layerSvg(S);
  const P=plane(240,760,520);
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(1.05,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(0,0)[0],y2:P(0,1.05)[1],stroke:C.axis,'stroke-width':3},ax);
  [['0',0,0],['½',.5,0],['1',1,0]].forEach(([t,x])=>{const e=el(ax.ownerSVGElement.parentNode,'lbl',`<span class="mono" style="font-size:30px">${t}</span>`,{color:C.dim});place(e,P(x,0)[0],P(0,0)[1]+36);e.classList.add('t3tick')});
  const ticks=S.querySelectorAll('.t3tick');
  fadeIn([ax,...ticks],cue(sid,'tent-shaped'),.5);
  const tp=pth(svg,fpath(tent,P,0,1,100),C.yellow,7);drawOn(tp,cue(sid,'rises'),1.8);
  // the interval as coloured beads, folded by the tent
  const L=plane(1060,560,700);const beads=[];const n=41;
  const hue=x=>{const a=[88,196,221],b=[245,207,74];return `rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*x)).join(',')})`};
  for(let i=0;i<n;i++){const x=i/(n-1);beads.push({x,c:svgEl('circle',{r:9,fill:hue(x),style:'opacity:0;visibility:hidden'},svg)})}
  const st={m:0};const ap=()=>beads.forEach(({x,c})=>{const A=Math.min(1,2*st.m),Bm=Math.max(0,2*st.m-1);let px,py=0;
    if(x<=.5){px=x*(1+Bm)}else{if(A<1){px=.5+(x-.5)*Math.cos(Math.PI*A);py=(x-.5)*Math.sin(Math.PI*A)*.5}else{px=(1-x)*(1+Bm)}}
    const q=L(px,py);c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1])});
  ap();
  tl.to(beads.map(b=>b.c),{autoAlpha:1,duration:.15,stagger:.02},cue(sid,'interval'));
  const il=el(S,'lbl','the interval from 0 to 1',{color:C.dim,fontSize:'34px',fontStyle:'italic'});place(il,L(.5,0)[0],L(0,0)[1]+60);show(il,cue(sid,'interval'),.4);
  tl.to(st,{m:1,duration:2.4,ease:'power2.inOut',immediateRender:false,onUpdate:ap},cue(sid,'folds'));
  fadeOut(il,cue(sid,'folds'),.3);
  const fl=el(S,'lbl','both halves land on the whole interval',{color:C.ink,fontSize:'36px',fontStyle:'italic'});place(fl,L(.5,0)[0],L(0,0)[1]+60);show(fl,cue(sid,'sending'),.4);
  const two=el(S,'cap',tex('t(x) = 2\\,\\mathrm{ReLU}(x) - 4\\,\\mathrm{ReLU}(x-\\tfrac12)',52),{top:'860px'});show(two,cue(sid,'two'),.6);
  sceneInOut(sid);
})();

/* ============ S4: fold again and again ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const P=plane(200,740,640,520);
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(1.03,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(0,0)[0],y2:P(0,1.05)[1],stroke:C.axis,'stroke-width':3},ax);
  fadeIn(ax,at(sid,0),.4);
  const f=pth(svg,fpath(x=>tentK(x,1),P,0,1,512),C.yellow,6);fadeIn(f,at(sid,0),.4);
  const lab=el(S,'abs','',{left:'200px',top:'130px',width:'640px',textAlign:'center',fontSize:'44px',opacity:0,visibility:'hidden'});fadeIn(lab,at(sid,0),.4);
  const labs=['t(x): 2 pieces','t(t(x)): 4 pieces','t(t(t(x))): 8 pieces','5 folds: 32 pieces'];
  const lb=labs.map((t,i)=>{const e=el(S,'abs mono','',{left:'200px',top:'130px',width:'640px',textAlign:'center',fontSize:'40px',color:C.yellow,opacity:0,visibility:'hidden'});e.innerHTML=t;return e});
  fadeIn(lb[0],at(sid,0),.3);
  const steps=[[cue(sid,'second'),1,2],[cue(sid,'third'),2,3],[cue(sid,'grows'),3,5]];
  steps.forEach(([t,a,b],i)=>{morphF(f,P,x=>tentK(x,a),x=>tentK(x,b),0,1,t,1.4);fadeOut(lb[i],t,.3);fadeIn(lb[i+1],t+.3,.3)});
  // paper: creases double
  const px=1100,py=300,pw=640,ph=420;
  const paper=el(S,'abs','',{left:px+'px',top:py+'px',width:pw+'px',height:ph+'px',background:'#e8edf314',border:'3px solid #c9d3e0',borderRadius:'6px',opacity:0,visibility:'hidden'});
  fadeIn(paper,cue(sid,'paper'),.5);
  const creases=[];[[.5],[.25,.75],[.125,.375,.625,.875]].forEach((xs,k)=>xs.forEach(x=>{const l=ln(svg,px+pw*x,py+6,px+pw*x,py+ph-6,[C.yellow,C.pink,C.teal][k],3,{'stroke-dasharray':'10 8'});creases.push([k,l])}));
  [cue(sid,'paper')+.6,cue(sid,'fold')+.2,cue(sid,'effort')].forEach((t,k)=>creases.filter(c=>c[0]===k).forEach(([,l])=>drawOn(l,t,.6)));
  const pc=el(S,'lbl','each fold doubles the creases',{color:C.ink,fontSize:'38px',fontStyle:'italic'});place(pc,px+pw/2,py+ph+60);show(pc,cue(sid,'doubles',3),.5);
  const ex=el(S,'cap',tex('2\\text{ neurons per layer},\\; L\\text{ layers}\\;\\Rightarrow\\; 2^{L}\\text{ straight pieces}',48),{top:'930px'});show(ex,cue(sid,'exponentially'),.6);
  sceneInOut(sid);
})();

(function(){const S=$('S5');const sid='s5';

  // deep: 10 layers x 2 neurons = 20 dots ; shallow: about 1023 dots
  const dl=el(S,'lbl','deep: 10 layers × 2 neurons',{color:C.pink,fontSize:'40px'});place(dl,460,330);
  const sl=el(S,'lbl','shallow: about 1000 neurons',{color:C.yellow,fontSize:'40px'});place(sl,1340,330);
  const dd=[];for(let l=0;l<10;l++)for(let k=0;k<2;k++)dd.push(el(S,'abs','',{left:(300+l*34)+'px',top:(520+k*40)+'px',width:'22px',height:'22px',borderRadius:'50%',background:C.pink,opacity:0,visibility:'hidden'}));
  const sd=el(S,'abs','',{left:'1020px',top:'390px',width:'640px',height:'540px',opacity:0,visibility:'hidden'});

  for(let i=0;i<1023;i++){const c=i%33,r=Math.floor(i/33);svgEl('circle',{cx:10+c*19.2,cy:10+r*16.8,r:5.5,fill:C.yellow},cv)}
  show(dl,cue(sid,'matching'),.5);tl.to(dd,{autoAlpha:1,duration:.15,stagger:.03},cue(sid,'matching'));
  const pcs=el(S,'lbl','1024 pieces',{color:C.pink,fontSize:'36px',fontStyle:'italic'});place(pcs,460,660);show(pcs,cue(sid,'folding'),.4);

  sceneInOut(sid);
})();
