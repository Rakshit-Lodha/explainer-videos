.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}

  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
const PDF='p(x)=\\frac{1}{\\sigma\\sqrt{2\\pi}}\\,e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}';
/* exact distribution of the sum of n fair dice */
function diceSum(n){let d=[1];for(let k=0;k<n;k++){const e=new Array(d.length+6).fill(0);d.forEach((p,i)=>{for(let f=1;f<=6;f++)e[i+f]+=p/6});d=e}return d} // index = sum
/* ============ S1: the same hump everywhere ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const rnd=seedRand(17);
  const panels=[['heights',170,7,'cm'],['repeated measurements',10,.4,''],['sum of many dice',35,4.2,'']];
  const groups=[],curves=[];
  panels.forEach(([name,m,s],i)=>{const x0=150+i*560;
    const A=axes(svg,{x:x0,y:300,w:460,h:300,xmin:m-4*s,xmax:m+4*s,ymin:0,ymax:1.25/(s*Math.sqrt(2*Math.PI)),yaxis:false});
    const n=17,w=8*s/n;const xs=[],hs=[];for(let k=0;k<n;k++){const c=m-4*s+w*(k+.5);xs.push(c);hs.push(gauss(c,m,s)*(1+(rnd()-.5)*.25))}
    const B=bars(svg,A,xs,hs,{color:[C.blue,C.green,C.yellow][i],w:w*.86,op:.8});
    const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(B.g);groups.push(g);
    const t=lbl(S,name,x0+230,650,{fontSize:'38px',fontStyle:'italic',color:C.ink});
    const cv=svgEl('path',{d:fpath(A,x=>gauss(x,m,s),m-4*s,m+4*s),fill:'none',stroke:C.ink,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);curves.push(cv);
    const tm=[cue(sid,'heights'),cue(sid,'measurement'),cue(sid,'dice')][i];fadeIn(g,tm,.6);show(t,tm,.5);groups.push(t)});
  fadeIn(curves,cue(sid,'shape'),.6,.15);
  const sh=note(S,'one symmetric hump, thin tails on both sides',150,740,1600,{fontSize:'44px',textAlign:'center',color:C.dim});show(sh,cue(sid,'symmetric'),.6);
  const nm=el(S,'chip','the Gaussian, or normal distribution',{left:'600px',top:'860px',borderColor:C.yellow,color:C.yellow});show(nm,cue(sid,'gaussian'),.6);
  sceneInOut(sid);
})();

/* ============ S2: two numbers, mu and sigma ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const A=axes(svg,{x:160,y:380,w:1600,h:480,xmin:-6,xmax:6,ymin:0,ymax:.5,xticks:[-6,-4,-2,0,2,4,6],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const tk=[-6,-4,-2,0,2,4,6].map(v=>lbl(S,`<span class="mono">${fmt(v,0)}</span>`,A.X(v),A.Y(0)+38,{fontSize:'30px',color:C.dim}));fadeIn(tk,at(sid,.02),.5);
  const f=lbl(S,tex(PDF,56),420,210,{});show(f,at(sid,.03),.8);
  const cv=svgEl('path',{fill:C.yellow,'fill-opacity':.12,stroke:C.yellow,'stroke-width':6},svg);
  const ml=svgEl('line',{stroke:C.pink,'stroke-width':4,'stroke-dasharray':'12 9'},svg);
  const sb=svgEl('line',{stroke:C.blue,'stroke-width':5},svg);
  const mlab=el(S,'lbl','',{fontSize:'40px',color:C.pink});mlab.setAttribute('data-layout-allow-overlap','');
  const slab=el(S,'lbl','',{fontSize:'40px',color:C.blue});slab.setAttribute('data-layout-allow-overlap','');
  const render=o=>{const g=x=>gauss(x,o.m,o.s);cv.setAttribute('d',farea(A,g,-6,6,200));
    ml.setAttribute('x1',A.X(o.m));ml.setAttribute('x2',A.X(o.m));ml.setAttribute('y1',A.Y(0));ml.setAttribute('y2',A.Y(g(o.m))-10);
    const yh=A.Y(g(o.m+o.s));sb.setAttribute('x1',A.X(o.m));sb.setAttribute('x2',A.X(o.m+o.s));sb.setAttribute('y1',yh);sb.setAttribute('y2',yh);
    gsap.set(mlab,{x:A.X(o.m),y:A.Y(g(o.m))-46,xPercent:-50,yPercent:-50});mlab.innerHTML=`μ = ${fmt(o.m,1)}`;
    gsap.set(slab,{x:A.X(o.m+o.s)+120,y:yh,xPercent:-50,yPercent:-50});slab.innerHTML=`σ = ${o.s.toFixed(1)}`};
  const st=state({m:0,s:1},render);
  [cv,ml,sb,mlab,slab].forEach(e=>gsap.set(e,{autoAlpha:0}));
  fadeIn(cv,at(sid,.05),.6);
  fadeIn([ml,mlab],cue(sid,'mean'),.5);fadeIn([sb,slab],cue(sid,'standard'),.5);
  drive(st,cue(sid,'slides'),1.6,{m:-2},render);
  drive(st,cue(sid,'slides')+1.8,1.4,{m:1.5},render);
  drive(st,cue(sid,'spreads'),1.6,{s:2},render);
  const ar=note(S,'area under the curve stays 1',1300,420,460,{fontSize:'38px',color:C.dim});show(ar,cue(sid,'area'),.5);
  drive(st,cue(sid,'area')+.8,1.4,{m:0,s:1},render);
  sceneInOut(sid);
})();

/* ============ S3: 68-95-99.7 ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const A=axes(svg,{x:260,y:250,w:1400,h:560,xmin:-4,xmax:4,ymin:0,ymax:.45,xticks:[-3,-2,-1,0,1,2,3],yaxis:false});
  const tk=[-3,-2,-1,0,1,2,3].map(v=>lbl(S,v===0?'μ':`${v>0?'+':'−'}${Math.abs(v)}σ`,A.X(v),A.Y(0)+40,{fontSize:'34px',color:C.dim}));
  const g0=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g0.appendChild(A.g);fadeIn([g0].concat(tk),at(sid,.01),.5);
  const bands=[[3,'#58c4dd',.12],[2,'#58c4dd',.22],[1,'#58c4dd',.38]].map(([k,c,o])=>svgEl('path',{d:farea(A,x=>gauss(x,0,1),-k,k),fill:c,'fill-opacity':o,style:'opacity:0;visibility:hidden'},svg));
  const cv=svgEl('path',{d:fpath(A,x=>gauss(x,0,1),-4,4,200),fill:'none',stroke:C.yellow,'stroke-width':6},svg);
  const labs=[['about 2/3 within 1σ',0],['about 95% within 2σ',1],['almost all (99.7%) within 3σ',2]].map(([t,i])=>note(S,t,1180,280+i*70,700,{fontSize:'40px',color:[C.ink,C.ink,C.ink][i]}));
  const tms=[cue(sid,'thirds'),cue(sid,'ninety'),cue(sid,'three')];
  [2,1,0].forEach((bi,k)=>{fadeIn(bands[bi],tms[k],.6);show(labs[k],tms[k],.5)});
  const tl1=note(S,'the tails thin out fast',300,330,500,{fontSize:'38px',color:C.dim});show(tl1,cue(sid,'tails'),.5);
  const ex=lbl(S,tex('e^{-x^2/2}',56),560,470,{color:C.yellow});show(ex,cue(sid,'exponential'),.6);
  sceneInOut(sid);
})();

/* ============ S4: the central limit theorem with dice ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const A=axes(svg,{x:260,y:300,w:1100,h:520,xmin:-3.6,xmax:3.6,ymin:0,ymax:.5,xticks:[],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const clt=el(S,'chip','central limit theorem',{left:'1430px',top:'260px',borderColor:C.teal,color:C.teal});show(clt,cue(sid,'central'),.6);
  const st1=note(S,'add many independent effects and the total tends to a bell',1430,370,440,{fontSize:'36px',color:C.dim});show(st1,cue(sid,'add'),.5);
  // standardised: z = (sum - 3.5n) / sqrt(35n/12), heights scaled by the sd so areas stay 1
  const sets=[1,2,5].map((n,i)=>{const d=diceSum(n),sd=Math.sqrt(35*n/12),mu=3.5*n;const xs=[],hs=[];
    for(let s=n;s<=6*n;s++){xs.push((s-mu)/sd);hs.push(d[s]*sd)}
    const B=bars(svg,A,xs,hs,{color:[C.blue,C.green,C.pink][i],w:(1/sd)*.85,op:.8});B.g.setAttribute('style','opacity:0;visibility:hidden');return B.g});
  const names=['one die: flat','two dice: a triangle','five dice: nearly a bell'].map((t,i)=>lbl(S,t,A.X(0),A.Y(0)+50,{fontSize:'40px',fontStyle:'italic',color:[C.blue,C.green,C.pink][i]}));names.forEach(n=>n.setAttribute('data-layout-allow-overlap',''));
  const tms=[cue(sid,'central'),cue(sid,'triangle')-.4,cue(sid,'five')];
  sets.forEach((g,i)=>{fadeIn([g,names[i]],tms[i],.5);if(i<2)fadeOut([g,names[i]],tms[i+1]-.1,.4)});
  const cv=svgEl('path',{d:fpath(A,x=>gauss(x,0,1),-3.6,3.6),fill:'none',stroke:C.yellow,'stroke-width':5,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(cv,cue(sid,'bell'),.6);
  const hs=note(S,'heights, measurement errors: sums of many small causes',1430,560,440,{fontSize:'36px',color:C.ink});show(hs,cue(sid,'sums'),.5);
  sceneInOut(sid);
})();

/* ============ S5: the Gaussian in machine learning ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  // starting weights drawn from a narrow Gaussian
  const t1=lbl(S,tex('w\\sim\\mathcal{N}(0,\\;0.02^2)',52),480,230,{});show(t1,cue(sid,'weights'),.6);
  const rnd=seedRand(8);const gn=()=>{let u=0;for(let k=0;k<12;k++)u+=rnd();return u-6};
  const cells=[];for(let r=0;r<6;r++)for(let c=0;c<6;c++){const v=gn()*.02;cells.push(el(S,'abs mono',fmt(v,3),{left:(130+c*128)+'px',top:(320+r*58)+'px',fontSize:'24px',color:v<0?C.red:C.green,opacity:0,visibility:'hidden'}))}
  tl.to(cells,{autoAlpha:1,duration:.2,stagger:.025},cue(sid,'drawn'));
  const wl=lbl(S,'a weight matrix at the start of training',480,720,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(wl,cue(sid,'narrow'),.5);
  // Gaussian errors around a line
  const A=axes(svg,{x:1050,y:230,w:760,h:520,xmin:0,xmax:10,ymin:0,ymax:10,xticks:[],yticks:[]});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,cue(sid,'errors')-.5,.5);
  const line=x=>1+.75*x;
  const ln=svgEl('line',{x1:A.X(0),y1:A.Y(line(0)),x2:A.X(10),y2:A.Y(line(10)),stroke:C.blue,'stroke-width':5,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(ln,cue(sid,'errors')-.3,.5);
  const pts=[];for(let i=0;i<14;i++){const x=.5+i*.68,y=line(x)+gn()*.9;pts.push([x,y])}
  const res=pts.map(([x,y])=>svgEl('line',{x1:A.X(x),y1:A.Y(y),x2:A.X(x),y2:A.Y(line(x)),stroke:C.pink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg));
  const dots=pts.map(([x,y])=>svgEl('circle',{cx:A.X(x),cy:A.Y(y),r:9,fill:C.ink,style:'opacity:0;visibility:hidden'},svg));
  tl.to(dots,{autoAlpha:1,duration:.2,stagger:.04},cue(sid,'errors'));
  tl.to(res,{autoAlpha:1,duration:.2,stagger:.04},cue(sid,'follow'));
  // little bells on the line
  [2,5,8].forEach(x=>{const cx=A.X(x),cy=A.Y(line(x));let d='';for(let k=0;k<=40;k++){const z=-3+6*k/40;d+=(k?'L':'M')+(cx+gauss(z,0,1)*130).toFixed(1)+','+(cy-z*40).toFixed(1)}
    const p=svgEl('path',{d,fill:'none',stroke:C.yellow,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);fadeIn(p,cue(sid,'gaussian',2),.5)});
  const sq=lbl(S,tex('\\text{minimise}\\;\\sum_i (y_i-f(x_i))^2',46),1430,850,{color:C.pink});show(sq,cue(sid,'squared'),.6);
  sceneInOut(sid);
})();

/* ============ S6: two numbers describe it ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const A=axes(svg,{x:360,y:300,w:1200,h:440,xmin:-4,xmax:4,ymin:0,ymax:.45,xticks:[],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const parts=[-2.4,-1.2,0,1.2,2.4].map((m,i)=>svgEl('path',{d:fpath(A,x=>gauss(x,m,.5)*.3,-4,4),fill:'none',stroke:C.blue,'stroke-width':3,opacity:.7,style:'opacity:0;visibility:hidden'},svg));
  fadeIn(parts,cue(sid,'signature')-.8,.4,.1);
  const cv=svgEl('path',{d:fpath(A,x=>gauss(x,0,1),-4,4,200),fill:'none',stroke:C.yellow,'stroke-width':6,style:'opacity:0;visibility:hidden'},svg);
  fadeOut(parts,cue(sid,'adding'),.6);fadeIn(cv,cue(sid,'adding'),.8);
  const ms=note(S,'many small causes, added together',360,220,1200,{fontSize:'42px',textAlign:'center',color:C.dim});show(ms,cue(sid,'many'),.5);
  const two=lbl(S,tex('\\mu\\quad\\text{and}\\quad\\sigma',64),960,820,{color:C.yellow});show(two,cue(sid,'two'),.6);
  nextUp(S,'3.5 &nbsp;maximum likelihood',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
