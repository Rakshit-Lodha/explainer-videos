  return a}
/* 2x2 matrix display with brackets; cells[r][c] are divs whose text can be rewritten */
function mat2(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||60,cw=o.cw||150,rowH=fs*1.35,pad=fs*.25,W=cw*2+40,H=rowH*2+pad*2;
  const box=el(parent,'m2'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cols=o.colors||[C.ink,C.ink];
  const cells=[0,1].map(r=>[0,1].map(c=>el(box,'cell',vals[r][c],{left:(20+c*cw)+'px',top:(pad+r*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:cols[c]})));
  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

/* ============ persistent stage s1-s5: a fan of arrows under a matrix; arrows that stay on their line turn yellow ============ */
const STAGE=$('STAGE');
const P=plane(560,560,72);
const ssvg=layerSvg(STAGE);
const cg=clipTo(ssvg,40,90,1060,960);
const bg=drawGrid(cg,P,-8,8,-7,7);bg.setAttribute('opacity','.25');
const G=tGrid(cg,P,14,{op:.45});
const spans=svgEl('g',{style:'opacity:0;visibility:hidden'},cg);
for(let k=0;k<8;k++){const t=k*Math.PI/8,a=P(-9*Math.cos(t),-9*Math.sin(t)),b=P(9*Math.cos(t),9*Math.sin(t));svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.dim,'stroke-width':2,'stroke-dasharray':'5 9'},spans)}
const eLine1=svgEl('line',{x1:P(-9,0)[0],y1:P(-9,0)[1],x2:P(9,0)[0],y2:P(9,0)[1],stroke:C.yellow,'stroke-width':3,'stroke-dasharray':'10 10',style:'opacity:0;visibility:hidden'},cg);
const eLine2=svgEl('line',{x1:P(-8,8)[0],y1:P(-8,8)[1],x2:P(8,-8)[0],y2:P(8,-8)[1],stroke:C.yellow,'stroke-width':3,'stroke-dasharray':'10 10',style:'opacity:0;visibility:hidden'},cg);
const fanG=svgEl('g',{style:'opacity:0;visibility:hidden'},cg);
const FAN=[];for(let k=0;k<16;k++){const t=k*Math.PI/8;const a=mkArrow(fanG,P,C.blue,5);a.g.setAttribute('style','');FAN.push({a,u:[1.6*Math.cos(t),1.6*Math.sin(t)]})}
svgEl('circle',{cx:P(0,0)[0],cy:P(0,0)[1],r:7,fill:C.ink},cg);
const T=anim({a:1,b:0,c:0,d:1,dim:0},o=>{
  G.set(o);
  FAN.forEach(f=>{const [x,y]=mapv(o,...f.u);geom(f.a,0,0,x,y);
    const L=Math.hypot(x,y),cr=Math.abs(f.u[0]*y-f.u[1]*x)/(1.6*Math.max(L,1e-6)),eig=L>.05&&cr<.015;
    const col=eig?C.yellow:C.blue;f.a.line.setAttribute('stroke',col);f.a.head.setAttribute('fill',col);
    f.a.g.setAttribute('opacity',eig?1:1-.78*o.dim)})});
tl.to(STAGE,{autoAlpha:1,duration:.8},.3);
tl.to(STAGE,{autoAlpha:0,duration:.6},START.s6-.3);
const A={a:3,b:1,c:0,d:2},I={a:1,b:0,c:0,d:1};
const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'1140px',top:top+'px',width:'740px',textAlign:'center'},o||{}));

/* ============ S1: most arrows are knocked off their line; a few survive ============ */
(function(){const S=$('S1'),sid='s1';
  fadeIn(fanG,cue(sid,'arrow'),.6);
  fadeIn(spans,cue(sid,'line'),.6);
  T.to(cue(sid,'knocked'),2.6,A);
  T.to(cue(sid,'special'),1,{dim:1});
  const n1=panel(S,'knocked off their lines',300,{fontSize:'48px',fontStyle:'italic',color:C.blue});show(n1,cue(sid,'knocked'),.5);
  const n2=panel(S,'a few directions survive',400,{fontSize:'48px',fontStyle:'italic',color:C.yellow});show(n2,cue(sid,'survive'),.5);
  const t=panel(S,'eigenvectors',600,{fontSize:'96px',color:C.yellow});show(t,cue(sid,'eigenvectors'),.8);
  fadeOut(spans,cue(sid,'clearest'),.6);
  T.to(cue(sid,'clearest'),1.6,{...I,dim:0});
  sceneInOut(sid);
})();

/* ============ S2: A = [[3,1],[0,2]]: the x-axis triples, one diagonal doubles ============ */
(function(){const S=$('S2'),sid='s2';
  const m=panel(S,tex('A=\\begin{bmatrix}3&1\\\\0&2\\end{bmatrix}',64),260);show(m,cue(sid,'matrix'),.6);
  T.to(cue(sid,'moves'),2.6,A);
  T.to(cue(sid,'horizontal')-.2,.8,{dim:1});
  fadeIn(eLine1,cue(sid,'horizontal'),.5);
  const x3=el(S,'lbl','× 3',{color:C.yellow,fontSize:'46px'});place(x3,P(4.8,.6)[0],P(4.8,.6)[1]);show(x3,cue(sid,'three'),.4);
  fadeIn(eLine2,cue(sid,'diagonal'),.5);
  const x2=el(S,'lbl','× 2',{color:C.yellow,fontSize:'46px'});place(x2,P(-3.6,4.4)[0],P(-3.6,4.4)[1]);show(x2,cue(sid,'twice'),.4);
  const n=panel(S,'yellow: arrows that stayed on their own line',520,{fontSize:'40px',fontStyle:'italic',color:C.dim});show(n,cue(sid,'stay'),.5);
  fadeOut([x3,x2],START.s3,.4);
  sceneInOut(sid);
})();

/* ============ S3: A v = λ v ============ */
(function(){const S=$('S3'),sid='s3';
  const eq=el(S,'abs hid','',{left:'1140px',top:'250px',width:'740px',textAlign:'center'});
  eq.innerHTML='<span id="eqL" style="display:inline-block;padding:6px 18px;border-radius:12px;border:3px solid transparent">'+tex('A\\vec v',80)+'</span>'+tex('=',80)+'<span id="eqR" style="display:inline-block;padding:6px 18px;border-radius:12px;border:3px solid transparent">'+tex('\\lambda\\vec v',80)+'</span>';
  show(eq,cue(sid,'equation'),.6);
  const eL=eq.querySelector('#eqL'),eR=eq.querySelector('#eqR');
  tl.to(eL,{borderColor:C.blue,duration:.3},cue(sid,'left'));tl.to(eL,{borderColor:'rgba(0,0,0,0)',duration:.3},cue(sid,'right'));
  tl.to(eR,{borderColor:C.yellow,duration:.3},cue(sid,'right'));tl.to(eR,{borderColor:'rgba(0,0,0,0)',duration:.3},cue(sid,'lambda',2));
  const l1=panel(S,'the whole matrix: may turn',420,{fontSize:'38px',fontStyle:'italic',color:C.blue});show(l1,cue(sid,'full'),.5);
  const l2=panel(S,'just a number: stretch or flip, never turn',480,{fontSize:'38px',fontStyle:'italic',color:C.yellow});show(l2,cue(sid,'scalar'),.5);
  const ev=panel(S,tex('\\lambda',60)+' = eigenvalue, the stretch factor',620,{fontSize:'48px'});show(ev,cue(sid,'eigenvalue'),.6);
  const ge=panel(S,'<i>eigen</i> (German): own',740,{fontSize:'44px',color:C.dim});show(ge,cue(sid,'german'),.5);
  sceneInOut(sid);
})();

/* ============ S4: (A − λI)v = 0 means det(A − λI) = 0 ============ */
(function(){const S=$('S4'),sid='s4';
  const f1=panel(S,tex('(A-\\lambda I)\\,\\vec v=\\vec 0',60),190);show(f1,cue(sid,'minus'),.6);
  const lbl=el(S,'abs hid',tex('A-2I',50),{left:'90px',top:'130px',color:C.pink});
  fadeOut(eLine2,START[sid],.4);
  T.to(cue(sid,'crush')-.4,2.2,{a:1,b:1,c:0,d:0});show(lbl,cue(sid,'crush')-.4,.5);
  const n1=panel(S,'a nonzero arrow sent to zero: the plane is crushed',300,{fontSize:'38px',fontStyle:'italic',color:C.dim});show(n1,cue(sid,'nonzero'),.5);
  const f2=panel(S,tex('\\det(A-\\lambda I)=0',60),390);show(f2,cue(sid,'determinant'),.6);
  const f3=panel(S,tex('(3-\\lambda)(2-\\lambda)-1\\cdot 0=0',52),510,{color:C.ink});show(f3,cue(sid,'solving'),.6);
  const f4=panel(S,tex('\\lambda=3\\quad\\text{or}\\quad\\lambda=2',60),620,{color:C.yellow});show(f4,cue(sid,'eigenvalues'),.6);
  fadeOut(lbl,cue(sid,'eigenvalues'),.4);
  T.to(cue(sid,'eigenvalues'),2,A);
  fadeIn(eLine2,cue(sid,'line'),.5);
  const f5=panel(S,tex('\\lambda=3:\\ \\begin{bmatrix}1\\\\0\\end{bmatrix}\\qquad\\lambda=2:\\ \\begin{bmatrix}1\\\\-1\\end{bmatrix}',46),740,{color:C.yellow});show(f5,cue(sid,'line'),.6);
  fadeOut([eLine1,eLine2],START.s5,.4);
  sceneInOut(sid);
})();

/* ============ S5: a rotation has none, a shear has one ============ */
(function(){const S=$('S5'),sid='s5';
  T.to(START[sid]+.1,1.4,{...I,dim:0});
  T.to(cue(sid,'rotation'),1.3,{a:.7071,b:-.7071,c:.7071,d:.7071},'power1.in');T.to(cue(sid,'rotation')+1.3,1.3,{a:0,b:-1,c:1,d:0},'power1.out');
  const r=panel(S,tex('\\begin{bmatrix}0&-1\\\\1&0\\end{bmatrix}',56)+'<br><span style="font-size:42px;font-style:italic">quarter turn: no direction survives</span>',260);
  show(r,cue(sid,'rotation'),.6);fadeOut(r,cue(sid,'shear')-.3,.4);
  T.to(cue(sid,'shear')-.3,2.6,{a:1,b:1,c:0,d:1});
  const s=panel(S,tex('\\begin{bmatrix}1&1\\\\0&1\\end{bmatrix}',56)+'<br><span style="font-size:42px;font-style:italic">shear: one direction survives</span>',540);
  show(s,cue(sid,'shear'),.6);
  sceneInOut(sid);
})();

/* ============ S6: power iteration ============ */
(function(){const S=$('S6'),sid='s6';
  const svg=layerSvg(S);const PP=plane(560,560,90);
  const g=drawGrid(svg,PP,-5,5,-5,5);g.setAttribute('opacity','.5');
  const ax=svgEl('line',{x1:PP(-5,0)[0],y1:PP(-5,0)[1],x2:PP(5,0)[0],y2:PP(5,0)[1],stroke:C.yellow,'stroke-width':3,'stroke-dasharray':'10 10',style:'opacity:0;visibility:hidden'},svg);
  let v=[-.6,.8];const steps=[];
  for(let k=0;k<8;k++){const L=Math.hypot(...v),x=3.4*v[0]/L,y=3.4*v[1]/L;
    const a=mkArrow(svg,PP,k===0?C.blue:C.blue,6);setArrow(a,{x0:0,y0:0,x1:x,y1:y});steps.push(a);
    v=[3*v[0]+1*v[1],2*v[1]]}
  sceneIn(sid);
  const t0=cue(sid,'apply');
  steps.forEach((a,k)=>{const t=t0+.3+k*1.05;showArrow(a,t,.3);if(k>0)tl.to(steps[k-1].g,{opacity:.28,duration:.4},t)});
  tl.to(steps[7].line,{attr:{stroke:C.yellow},duration:.4},cue(sid,'largest'));tl.to(steps[7].head,{attr:{fill:C.yellow},duration:.4},cue(sid,'largest'));
  fadeIn(ax,cue(sid,'largest'),.5);
  const cnt=el(S,'abs hid mono','',{left:'120px',top:'150px',fontSize:'38px',color:C.dim});cnt.textContent='v, Av, A²v, A³v, …';show(cnt,t0,.5);
  const f=panel(S,tex('A^k\\vec v=c_1\\,3^k\\,\\vec e_1+c_2\\,2^k\\,\\vec e_2',54),280);show(f,cue(sid,'component'),.6);
  const n=panel(S,'the biggest factor wins',400,{fontSize:'44px',fontStyle:'italic',color:C.yellow});show(n,cue(sid,'dominates'),.5);
  const pw=panel(S,'power iteration',560,{fontSize:'70px'});show(pw,cue(sid,'power'),.6);
  const pr=panel(S,'how the original PageRank ranked the web',690,{fontSize:'40px',fontStyle:'italic',color:C.dim});show(pr,cue(sid,'pagerank'),.5);
  sceneInOut(sid);
})();

/* ============ S7: many layers: explode or fade ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const h=el(S,'abs hid','the same stretch, applied layer after layer',{left:'0',top:'150px',width:'1920px',textAlign:'center',fontSize:'50px',fontStyle:'italic'});show(h,cue(sid,'signal'),.6);
  const panels=[{x0:180,f:1.25,col:C.pink,t:'larger',lab:'stretch 1.25: explodes'},{x0:1030,f:.78,col:C.blue,t:'smaller',lab:'stretch 0.78: fades away'}];
  panels.forEach(p=>{const N=12,bw=48,gap=10,base=720;
    const vals=[...Array(N)].map((_,k)=>Math.pow(p.f,k));const mx=Math.max(...vals);
    const bars=vals.map((v,k)=>el(S,'abs hid','',{left:(p.x0+k*(bw+gap))+'px',top:(base-v/mx*420)+'px',width:bw+'px',height:(v/mx*420)+'px',background:p.col,borderRadius:'5px 5px 0 0',transformOrigin:'50% 100%'}));
    const ax=el(S,'abs hid','',{left:(p.x0-10)+'px',top:base+'px',width:(N*(bw+gap)+10)+'px',height:'3px',background:C.axis});
    const lb=el(S,'abs hid',p.lab,{left:p.x0+'px',top:(base+24)+'px',width:(N*(bw+gap))+'px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:p.col});
    const tl0=el(S,'abs hid mono','layer 1 → 12',{left:p.x0+'px',top:(base+84)+'px',width:(N*(bw+gap))+'px',textAlign:'center',fontSize:'28px',color:C.dim});
    const t=cue(sid,p.t);fadeIn([ax,tl0],t-.3,.4);
    bars.forEach((b,k)=>tl.fromTo(b,{autoAlpha:0,scaleY:0},{autoAlpha:1,scaleY:1,duration:.4,ease:'power2.out',immediateRender:false},t+k*.12));
    show(lb,t+1,.5)});
  const rn=el(S,'abs hid','one reason old recurrent networks forgot the start of long sentences',{left:'0',top:'880px',width:'1920px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.dim});show(rn,cue(sid,'reason'),.6);
  fadeOut(rn,cue(sid,'next')-.2,.4);
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.8 &nbsp;SVD and PCA: rotate, stretch, rotate',{top:'940px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next'),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
