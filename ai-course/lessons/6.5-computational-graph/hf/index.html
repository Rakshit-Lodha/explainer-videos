.colv{position:absolute}

.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}

.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.node{position:absolute;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;background:#10151c;opacity:0;visibility:hidden}
.box{position:absolute;border-radius:16px;border:3px solid;display:flex;align-items:center;justify-content:center;text-align:center;background:#10151c;opacity:0;visibility:hidden}

.px{position:absolute;border:1px solid #0e1116}

.vbox{position:absolute;border-radius:14px;border:3px solid;background:#10151c;opacity:0;visibility:hidden;font-family:'JetBrains Mono',monospace;text-align:center}
.vbox .nm{position:absolute;left:0;top:6px;width:100%;font-size:26px;color:#7f8b99;font-family:'Newsreader',serif;font-style:italic}
.vbox .vl{position:absolute;left:0;top:34px;width:100%;font-size:40px;color:#e8edf3;opacity:0}

  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}


/* the expression graph L = (a*b + c) * f, shared by this lesson's scenes */
function vbox(S,x,y,name,val,color){const b=el(S,'vbox','',{left:(x-80)+'px',top:(y-48)+'px',width:'160px',height:'96px',borderColor:color||C.blue});
  el(b,'nm',name);const v=el(b,'vl',val);b.cx=x;b.cy=y;b.w=160;b.h=96;b.v=v;return b}
function opn(S,x,y,sym){const o=el(S,'op',sym,{left:(x-38)+'px',top:(y-38)+'px',width:'76px',height:'76px'});o.cx=x;o.cy=y;o.r=38;return o}
function link(svg,a,b,color){const ax=a.cx+(a.w?a.w/2:a.r),bx=b.cx-(b.w?b.w/2:b.r);const ay=a.cy,by=b.cy;const mx=(ax+bx)/2;
  const p=pth(svg,`M${ax} ${ay} C${mx} ${ay} ${mx} ${by} ${bx-8} ${by}`,color||C.dim,3);
  const head=svgEl('polygon',{points:`${bx},${by} ${bx-14},${by-7} ${bx-14},${by+7}`,fill:color||C.dim,style:'opacity:0;visibility:hidden'},svg);p.head=head;return p}
function buildExpr(S,svg){const G={};
  G.a=vbox(S,200,300,'a','2',C.blue);G.b=vbox(S,200,520,'b','−3',C.blue);G.m1=opn(S,450,410,'×');G.e=vbox(S,660,410,'e = a·b','−6',C.ink);
  G.c=vbox(S,660,650,'c','10',C.blue);G.p=opn(S,900,530,'+');G.d=vbox(S,1110,530,'d = e + c','4',C.ink);
  G.f=vbox(S,1110,770,'f','−2',C.blue);G.m2=opn(S,1350,650,'×');G.L=vbox(S,1580,650,'L = d·f','−8',C.yellow);
  G.E={am:link(svg,G.a,G.m1),bm:link(svg,G.b,G.m1),me:link(svg,G.m1,G.e),ep:link(svg,G.e,G.p),cp:link(svg,G.c,G.p),pd:link(svg,G.p,G.d),dm:link(svg,G.d,G.m2),fm:link(svg,G.f,G.m2),mL:link(svg,G.m2,G.L)};
  return G}
function showLink(l,t,d){drawOn(l,t,d||.5);tl.to(l.head,{autoAlpha:1,duration:.2},t+(d||.5)-.1)}
function showVal(b,t){tl.to(b.v,{opacity:1,duration:.4},t);tl.fromTo(b,{boxShadow:'0 0 0px #f5cf4a00'},{boxShadow:'0 0 30px #f5cf4a88',duration:.3,yoyo:true,repeat:1,immediateRender:false},t)}

/* ============ S6: the Value class ============ */
(function(){const S=$('S6');const sid='s6';
  const lines=[
   '<span class="k">class</span> <span class="f">Value</span>:',
   '    <span class="k">def</span> <span class="f">__init__</span>(self, data, _prev=(), _op=<span class="n">\'\'</span>):',
   '        self.data = data',
   '        self._prev = set(_prev)',
   '        self._op = _op',
   '',
   '    <span class="k">def</span> <span class="f">__add__</span>(self, other):',
   '        <span class="k">return</span> Value(self.data + other.data, (self, other), <span class="n">\'+\'</span>)',
   '',
   '    <span class="k">def</span> <span class="f">__mul__</span>(self, other):',
   '        <span class="k">return</span> Value(self.data * other.data, (self, other), <span class="n">\'*\'</span>)',
   '',
   'a, b, c = Value(<span class="n">2.0</span>), Value(<span class="n">-3.0</span>), Value(<span class="n">10.0</span>)',
   'e = a * b + c   <span class="c"># builds the graph as it runs</span>'];
  const code=el(S,'code',lines.join('\n'),{left:'170px',top:'150px',fontSize:'31px'});
  show(code,cue(sid,'class'),.6);
  const lh=31*1.45,top0=150+22+2;
  const H=(i,n,col)=>el(S,'hl','',{left:'180px',top:(top0+i*lh-4)+'px',width:'1110px',height:(n*lh+8)+'px',borderColor:col});
  const h=[[2,1,C.yellow,'wraps','keeps'],[3,1,C.pink,'keeps','records'],[4,1,C.teal,'records','defining'],[6,2,C.blue,'addition','multiplication'],[9,2,C.blue,'multiplication','ordinary'],[12,2,C.yellow,'ordinary','first']].map(([i,n,col,a,b])=>{const e=H(i,n,col);fadeIn(e,cue(sid,a),.3);fadeOut(e,cue(sid,b)-.1,.3);return e});
  const eng=el(S,'cap','the first piece of <em>your own autograd engine</em>',{top:'900px',fontStyle:'italic',fontSize:'46px'});show(eng,cue(sid,'first'),.6);
  sceneInOut(sid);
})();

/* ============ S7: PyTorch records the graph too ============ */
(function(){const S=$('S7');const sid='s7';
  const code=el(S,'code','<span class="k">import</span> torch\na = torch.tensor(<span class="n">2.0</span>, requires_grad=<span class="k">True</span>)\ny = a * <span class="n">3</span> + <span class="n">1</span>\ny.grad_fn        <span class="c"># &lt;AddBackward0&gt;</span>\ny.backward()     <span class="c"># walks the recorded graph</span>',{left:'170px',top:'200px',fontSize:'34px'});
  show(code,cue(sid,'pytorch'),.6);
  const lh=34*1.45,top0=200+22+2;
  const h1=el(S,'hl','',{left:'180px',top:(top0+3*lh-4)+'px',width:'860px',height:(lh+8)+'px',borderColor:C.teal});fadeIn(h1,cue(sid,'records'),.3);fadeOut(h1,cue(sid,'record')-.2,.3);
  const h2=el(S,'hl','',{left:'180px',top:(top0+4*lh-4)+'px',width:'860px',height:(lh+8)+'px',borderColor:C.pink});fadeIn(h2,cue(sid,'backward'),.3);
  const svg=layerSvg(S);
  const n1=node(S,1300,640,40,'a',C.blue,30),n2=node(S,1480,560,36,'×',C.dim,30),n3=node(S,1660,640,36,'+',C.dim,30),n4=node(S,1660,820,40,'y',C.yellow,30);
  const e=[edge(svg,n1,n2,C.dim,3),edge(svg,n2,n3,C.dim,3),edge(svg,n3,n4,C.dim,3)];
  show(n1,cue(sid,'forward'),.4);show(n2,cue(sid,'node'),.4);drawOn(e[0],cue(sid,'node'),.4);show(n3,cue(sid,'operation'),.4);drawOn(e[1],cue(sid,'operation'),.4);show(n4,cue(sid,'building'),.4);drawOn(e[2],cue(sid,'building'),.4);
  const gl=el(S,'lbl','recorded as the code runs',{color:C.dim,fontSize:'32px',fontStyle:'italic'});place(gl,1480,940);show(gl,cue(sid,'runs',2),.4);
  sceneInOut(sid);
})();

/* ============ S8: recap ============ */
(function(){const S=$('S8');const sid='s8';
  const svg=layerSvg(S);const G=buildExpr(S,svg);
  [G.a,G.b,G.c,G.f,G.e,G.d,G.L,G.m1,G.p,G.m2].forEach(b=>{gsap.set(b.v,{opacity:1})});
  const all=[G.a,G.b,G.c,G.f,G.e,G.d,G.L,G.m1,G.p,G.m2];
  fadeIn(all,at(sid,.02),.5);Object.values(G.E).forEach(l=>fadeIn([l,l.head],at(sid,.02),.5));
  const fw=pth(svg,'M200 180 L1580 180',C.teal,5);drawOn(fw,cue(sid,'forward'),1.2);
  const fl=el(S,'lbl','forward: compute, and leave a map',{color:C.teal,fontSize:'36px',fontStyle:'italic'});place(fl,890,140);show(fl,cue(sid,'map'),.5);
  const bw=pth(svg,'M1580 900 L200 900',C.pink,5);drawOn(bw,cue(sid,'reverse'),1.2);
  const bl=el(S,'lbl','backward: walk the map in reverse',{color:C.pink,fontSize:'36px',fontStyle:'italic'});place(bl,890,860);show(bl,cue(sid,'reverse'),.5);
  nextCap(S,sid,'backpropagation',1,'6.6 &nbsp;backpropagation: the chain rule run backwards');
  sceneInOut(sid,true);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
