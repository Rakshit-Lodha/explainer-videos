/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}
function texAt(S,s,size,x,y,color){const d=el(S,'lbl',tex(s,size),{color:color||C.ink});place(d,x,y);return d}
function arrowR(svg,x0,y,x1,color){const p=pth(svg,`M${x0} ${y} L${x1-6} ${y}`,color||C.dim,4);const h=arrowHead(svg,x1,y,1,0,color||C.dim);return [p,h]}
function showArrowR(a,t){drawOn(a[0],t,.4);fadeIn(a[1],t+.35,.15)}
/* bars from a baseline (positive or negative values); returns divs */
function bars(S,x0,base,vals,o){o=o||{};const w=o.w||70,gap=o.gap||24,sc=o.scale||100;
  return vals.map((v,i)=>{const h=Math.max(2,Math.abs(v)*sc);return el(S,'abs','',{left:(x0+i*(w+gap))+'px',top:(v>=0?base-h:base)+'px',width:w+'px',height:h+'px',borderRadius:'5px',
    background:o.color?(typeof o.color==='function'?o.color(i,v):o.color):(v>=0?C.green:C.red),transformOrigin:v>=0?'50% 100%':'50% 0%',opacity:0,visibility:'hidden'})})}
const ACT=['left','right','jump','wait'];

/* ============ S1: adjust the policy directly ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const q=boxEl(S,520,250,520,80,'<span style="font-size:30px">Q-learning: values → actions</span>',C.blue);show(q,cue(sid,'q-learning'),.4);
  const p=boxEl(S,1400,250,560,80,'<span style="font-size:30px">policy gradients: adjust π directly</span>',C.yellow);show(p,cue(sid,'policy'),.4);
  const sk=lab(S,'skip the middle step',1400,330,C.dim,28);show(sk,cue(sid,'skip'),.4);
  const P0=[.25,.25,.25,.25];const B=bars(S,700,800,P0,{scale:900,w:110,gap:40,color:C.teal});fadeIn(B,cue(sid,'adjust'),.4);
  const z=ln(svg,690,800,1290,800,C.axis,2);fadeIn(z,cue(sid,'adjust'),.3);
  ACT.forEach((a,i)=>{const t=lab(S,a,755+i*150,835,C.dim,28,false);fadeIn(t,cue(sid,'adjust'),.3)});
  const pl=lab(S,'π(a | s)',600,600,C.yellow,36,false);fadeIn(pl,cue(sid,'adjust'),.3);
  tl.to(B[1],{scaleY:.5/.25,backgroundColor:C.green,duration:.7},cue(sid,'well'));tl.to([B[0],B[2]],{scaleY:.2/.25,duration:.7},cue(sid,'well'));
  tl.to(B[3],{scaleY:.1/.25,backgroundColor:C.red,duration:.7},cue(sid,'badly'));
  const up=lab(S,'turned out well: more likely',1520,560,C.green,30),dn=lab(S,'turned out badly: less likely',1520,620,C.red,30);show(up,cue(sid,'well'),.4);show(dn,cue(sid,'badly'),.4);
  const co=lab(S,'like a coach reinforcing the movements that led to a clean landing',960,930,C.dim,30);show(co,cue(sid,'coach'),.4);
  sceneInOut(sid);
})();

/* ============ S2: a policy network, and the problem ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const st=boxEl(S,220,520,180,80,'<span style="font-size:30px">state s</span>',C.blue);show(st,cue(sid,'policy'),.4);
  const N=[];[[460,4],[640,5],[820,4]].forEach(([x,n])=>{const col=[];for(let i=0;i<n;i++)col.push(node(S,x,520+(i-(n-1)/2)*80,20,'',C.ink));N.push(col)});
  const E=[];for(let j=0;j<2;j++)N[j].forEach(a=>N[j+1].forEach(b=>E.push(edge(svg,a,b,C.dim,1.5))));
  show(N.flat(),cue(sid,'network'),.3);fadeIn(E,cue(sid,'network'),.4);const a0=arrowR(svg,312,520,436,C.dim);showArrowR(a0,cue(sid,'network'));
  const th=lab(S,'parameters θ',640,300,C.ink,32,false);show(th,cue(sid,'theta'),.4);
  const sm=boxEl(S,1010,520,160,70,'<span style="font-size:28px">softmax</span>',C.yellow);show(sm,cue(sid,'softmax'),.4);const a1=arrowR(svg,845,520,925,C.dim);showArrowR(a1,cue(sid,'softmax'));
  const P=[.15,.45,.3,.1];const B=bars(S,1180,700,P,{scale:600,w:80,gap:30,color:C.teal});tl.to(B,{autoAlpha:1,duration:.2,stagger:.06},cue(sid,'probability'));
  const z=ln(svg,1170,700,1620,700,C.axis,2);fadeIn(z,cue(sid,'probability'),.3);
  ACT.forEach((a,i)=>{const t=lab(S,a,1220+i*110,735,C.dim,26,false);fadeIn(t,cue(sid,'probability'),.3)});
  const pl=lab(S,'π_θ(a | s)',1400,360,C.yellow,34,false);show(pl,cue(sid,'probability'),.4);
  const lm=lab(S,'like a language model’s next-token distribution',1400,800,C.dim,28);show(lm,cue(sid,'language'),.4);
  const J=texAt(S,'J(\\theta)=\\mathbb{E}_{\\pi_\\theta}[\\,G\\,]',50,640,190);show(J,cue(sid,'goal'),.5);
  tl.to(B[2],{backgroundColor:C.yellow,duration:.3},cue(sid,'sampled'));
  const nd=lab(S,'a random draw has no derivative',960,900,C.red,34);show(nd,cue(sid,'derivative'),.4);
  sceneInOut(sid);
})();

/* ============ S3: the log-derivative trick and REINFORCE ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const tt=lab(S,'the log-derivative trick',960,150,C.ink,40,false);show(tt,cue(sid,'log-derivative'),.4);
  const f=texAt(S,'\\nabla_\\theta J=\\mathbb{E}\\big[\\,G\\;\\nabla_\\theta\\log\\pi_\\theta(a\\mid s)\\,\\big]',58,960,270);show(f,cue(sid,'equals'),.6);
  const smp=lab(S,'everything here can be computed from samples',960,370,C.teal,32);show(smp,cue(sid,'samples'),.4);
  const steps=[['run the policy',C.blue,'run',460],['record (s, a, G)',C.yellow,'record',960],['step θ toward actions that did well',C.green,'step',1460]];
  steps.forEach(([t,c,w,x],i)=>{const b=boxEl(S,x,600,i===2?460:320,90,`<span style="font-size:30px">${t}</span>`,c);show(b,cue(sid,w),.4);
    if(i){const a=arrowR(svg,steps[i-1][3]+(i-1===2?230:160)+10,600,x-(i===2?230:160)-10,C.dim);showArrowR(a,cue(sid,w))}});
  const back=pth(svg,'M1460 645 L1460 760 L460 760 L460 645',C.dim,3);drawOn(back,cue(sid,'scaled'),.8);
  const sc=lab(S,'scaled by how good the outcome was',960,800,C.green,30);show(sc,cue(sid,'scaled'),.4);
  const rf=lab(S,'REINFORCE · Ronald Williams, 1992',960,920,C.yellow,36,false);show(rf,cue(sid,'reinforce'),.4);
  sceneInOut(sid);
})();

/* ============ S4: onehot minus p ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const f=texAt(S,'\\frac{\\partial\\,\\log\\pi(a)}{\\partial z}=\\mathrm{onehot}(a)-p',56,960,200);show(f,cue(sid,'simple'),.6);
  const P=[.2,.5,.2,.1],oh=[0,1,0,0],g=oh.map((v,i)=>v-P[i]);
  const groups=[[oh,'onehot(right)',C.yellow,'one-hot',200],[P,'p',C.teal,'probabilities',760],[g,'gradient',null,'minus',1320]];
  groups.forEach(([vals,t,c,w,x0])=>{const base=620;const B=bars(S,x0,base,vals,{scale:260,w:70,gap:24,color:c||undefined});tl.to(B,{autoAlpha:1,duration:.2,stagger:.05},cue(sid,w));
    const z=ln(svg,x0-8,base,x0+4*94,base,C.axis,2);fadeIn(z,cue(sid,w),.3);const l=lab(S,t,x0+184,315,c||C.ink,32,false);show(l,cue(sid,w),.4);
    ACT.forEach((a,i)=>{const d=lab(S,a,x0+35+i*94,base+(vals[i]<0?vals[i]*-260+30:30),C.dim,22,false);fadeIn(d,cue(sid,w),.3)})});
  const mi=lab(S,'−',660,560,C.ink,60,false),eq=lab(S,'=',1220,560,C.ink,60,false);show(mi,cue(sid,'minus'),.3);show(eq,cue(sid,'minus'),.3);
  const up=lab(S,'a good outcome pushes the chosen score up…',960,860,C.green,32),dn=lab(S,'…and every other score down, in proportion to its probability',960,920,C.red,30);

/* ============ S5: baseline and advantage ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const G=[6.5,3.2,8.4,4.1,7.6,2.4,5.9,4.8],mean=G.reduce((a,b)=>a+b)/G.length;
  const xs=G.map((_,i)=>560+i*150);
  const r1=lab(S,'returns G',260,380,C.blue,32,false),r2=lab(S,'advantage G − b',260,760,C.yellow,32,false);
  const base1=480,base2=760,sc=34;
  const ar1=G.map((g,i)=>{const l=pth(svg,`M${xs[i]} ${base1} L${xs[i]} ${base1-g*sc+10}`,C.blue,6);const h=arrowHead(svg,xs[i],base1-g*sc,0,-1,C.blue);return [l,h]});
  const z1=ln(svg,480,base1,1720,base1,C.axis,2);fadeIn([z1,r1],cue(sid,'noisy'),.3);
  ar1.forEach(([l,h],i)=>{drawOn(l,cue(sid,'episode')+i*.12,.3);fadeIn(h,cue(sid,'episode')+i*.12+.25,.1)});
  const n1=lab(S,'every action pushed up, by amounts that vary a great deal',1100,180,C.dim,28);show(n1,cue(sid,'varies'),.4);
  const bl=ln(svg,480,base1-mean*sc,1720,base1-mean*sc,C.yellow,3,{'stroke-dasharray':'10 7'});fadeIn(bl,cue(sid,'baseline'),.3);
  const bt=lab(S,'baseline b = average return',1770,base1-mean*sc-30,C.yellow,28);show(bt,cue(sid,'average'),.4);
  const z2=ln(svg,480,base2,1720,base2,C.axis,2);fadeIn([z2,r2],cue(sid,'subtracts'),.3);
  G.forEach((g,i)=>{const a=g-mean,c=a>=0?C.green:C.red,y1=base2-a*sc;const l=pth(svg,`M${xs[i]} ${base2} L${xs[i]} ${y1+(a>=0?10:-10)}`,c,6);const h=arrowHead(svg,xs[i],y1,0,a>=0?-1:1,c);
    drawOn(l,cue(sid,'scaling')+i*.1,.3);fadeIn(h,cue(sid,'scaling')+i*.1+.25,.1)});
  const un=lab(S,'b does not depend on the action: the expected gradient is unchanged',960,900,C.dim,28);show(un,cue(sid,'unchanged'),.4);
  const vr=lab(S,'but the variance drops sharply',960,950,C.teal,30);show(vr,cue(sid,'variance'),.4);
  const av=lab(S,'better than usual ↑   worse than usual ↓',1100,620,C.ink,28,false);show(av,cue(sid,'better'),.4);
  sceneInOut(sid);
})();

/* ============ S6: PPO clipping ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const P=plane(300,800,260,110),eps=.2;
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:300,y1:800,x2:P(2.2,0)[0],y2:800,stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:300,y1:800,x2:300,y2:P(0,2.4)[1],stroke:C.axis,'stroke-width':3},ax);fadeIn(ax,cue(sid,'proximal'),.4);
  const xl=lab(S,'ratio r = π_new / π_old',P(1.1,0)[0],850,C.dim,28,false);fadeIn(xl,cue(sid,'proximal'),.4);
  [0,1,2].forEach(v=>{const t=lab(S,String(v),P(v,0)[0],825,C.dim,24,false);fadeIn(t,cue(sid,'proximal'),.3)});
  const band=svgEl('rect',{x:P(1-eps,0)[0],y:P(0,2.4)[1],width:P(1+eps,0)[0]-P(1-eps,0)[0],height:800-P(0,2.4)[1],fill:C.yellow,'fill-opacity':.1,style:'opacity:0;visibility:hidden'},svg);fadeIn(band,cue(sid,'band'),.4);
  const bl=lab(S,'[1 − ε, 1 + ε]',P(1,0)[0],P(0,2.5)[1],C.yellow,28,false);show(bl,cue(sid,'band'),.4);
  const A=1;const obj=r=>Math.min(r*A,Math.min(Math.max(r,1-eps),1+eps)*A);
  const raw=pth(svg,fpath(r=>r*A,P,0,2.1,60),C.dim,3,{'stroke-dasharray':'8 7'});drawOn(raw,cue(sid,'ratio'),.8);
  const c=pth(svg,fpath(obj,P,0,2.1,200),C.green,6);drawOn(c,cue(sid,'clipping'),1.2);
  const cl=lab(S,'A > 0: the gain stops at 1 + ε',P(1.7,0)[0],P(0,1.2)[1]+40,C.green,28);show(cl,cue(sid,'far'),.4);
  const f=texAt(S,'L^{\\mathrm{CLIP}}=\\min\\big(rA,\\;\\mathrm{clip}(r,1-\\epsilon,1+\\epsilon)\\,A\\big)',44,1360,250);show(f,cue(sid,'clipping'),.5);
  const who=lab(S,'PPO · Schulman et al., OpenAI, 2017',1360,340,C.dim,30);show(who,cue(sid,'schulman'),.4);
  const nb=lab(S,'no single batch can move the policy far',1360,420,C.ink,30);show(nb,cue(sid,'batch'),.4);
  const ig=lab(S,'InstructGPT: PPO with a learned value baseline',1360,520,C.yellow,30);show(ig,cue(sid,'instructgpt'),.4);
  sceneInOut(sid);
})();
