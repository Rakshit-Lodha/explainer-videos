/* 2x2 matrix display with brackets; cells[r][c] are divs whose text can be rewritten */
function mat2(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||60,cw=o.cw||150,rowH=fs*1.35,pad=fs*.25,W=cw*2+40,H=rowH*2+pad*2;
  const box=el(parent,'m2'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cols=o.colors||[C.ink,C.ink];
  const cells=[0,1].map(r=>[0,1].map(c=>el(box,'cell',vals[r][c],{left:(20+c*cw)+'px',top:(pad+r*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:cols[c]})));
  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

/* ============ persistent stage: y = x² with a secant/tangent through (x0, x0²) and (x0+h, ...) ============ */
const STAGE=$('STAGE');
const P=plane(600,900,130,62);
const f=x=>x*x;
const ssvg=layerSvg(STAGE);
const cg=clipTo(ssvg,60,240,1060,720);
const gg=svgEl('g',{opacity:.35},cg);
for(let x=-4;x<=4;x++){const a=P(x,0),b=P(x,10);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.5},gg)}
for(let y=0;y<=10;y++){const a=P(-4,y),b=P(4,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.5},gg)}
svgEl('line',{x1:P(-4,0)[0],y1:P(0,0)[1],x2:P(4,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},cg);
svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(0,10)[0],y2:P(0,10)[1],stroke:C.axis,'stroke-width':3},cg);
const curve=svgEl('path',{d:pathD(P,f,-3.4,3.4,160),fill:'none',stroke:C.blue,'stroke-width':6},cg);
const cl=el(STAGE,'lbl',tex('y=x^2',46),{color:C.blue});place(cl,P(2.75,7.6)[0]+90,P(2.75,7.6)[1]);cl.style.opacity=1;cl.style.visibility='inherit';
const sec=svgEl('line',{stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},cg);
const run=svgEl('line',{stroke:C.green,'stroke-width':4,'stroke-dasharray':'9 7',style:'opacity:0;visibility:hidden'},cg);
const rise=svgEl('line',{stroke:C.red,'stroke-width':4,'stroke-dasharray':'9 7',style:'opacity:0;visibility:hidden'},cg);
const dA=svgEl('circle',{r:11,fill:C.pink,style:'opacity:0;visibility:hidden'},cg);
const dB=svgEl('circle',{r:10,fill:C.yellow,style:'opacity:0;visibility:hidden'},cg);
const runL=el(STAGE,'lbl',tex('\\text{run}=h',38),{color:C.green});
const riseL=el(STAGE,'lbl',tex('\\text{rise}',38),{color:C.red});
const SR=el(STAGE,'abs hid','',{left:'1160px',top:'250px',width:'700px',fontSize:'54px',textAlign:'center'});
SR.innerHTML='slope <span class="mono">= <span id="sv" style="color:#f5cf4a">0.00</span></span>';
const sv=SR.querySelector('#sv');
const XR=el(STAGE,'abs hid mono','',{left:'1160px',top:'330px',width:'700px',fontSize:'34px',textAlign:'center',color:C.dim});
const T=anim({x0:1,h:1.5},o=>{
  const a=o.x0,b=o.x0+o.h,fa=f(a),fb=f(b),m=(fb-fa)/(b-a);
  const p0=P(-4,fa+m*(-4-a)),p1=P(4,fa+m*(4-a));sec.setAttribute('x1',p0[0]);sec.setAttribute('y1',p0[1]);sec.setAttribute('x2',p1[0]);sec.setAttribute('y2',p1[1]);
  const A=P(a,fa),B=P(b,fb),Cc=P(b,fa);
  dA.setAttribute('cx',A[0]);dA.setAttribute('cy',A[1]);dB.setAttribute('cx',B[0]);dB.setAttribute('cy',B[1]);
  run.setAttribute('x1',A[0]);run.setAttribute('y1',A[1]);run.setAttribute('x2',Cc[0]);run.setAttribute('y2',Cc[1]);
  rise.setAttribute('x1',Cc[0]);rise.setAttribute('y1',Cc[1]);rise.setAttribute('x2',B[0]);rise.setAttribute('y2',B[1]);
  gsap.set(runL,{x:(A[0]+Cc[0])/2,y:A[1]+36,xPercent:-50,yPercent:-50});gsap.set(riseL,{x:Cc[0]+60,y:(Cc[1]+B[1])/2,xPercent:-50,yPercent:-50});
  sv.textContent=fmt(m,2);XR.textContent=`x = ${fmt(a,2)}   h = ${fmt(o.h,3)}`});
const stageVis=[[START.s1+11.0,1],[START.s4-.2,0],[START.s5+.1,1],[START.s6-.3,0]];
stageVis.forEach(([t,v])=>tl.to(STAGE,{autoAlpha:v,duration:.6},t));
const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'1140px',top:top+'px',width:'740px',textAlign:'center'},o||{}));

/* ============ S1: nudge a number, watch the error ============ */
(function(){const S=$('S1'),sid='s1';
  const q=el(S,'abs hid','',{left:'0',top:'120px',width:'1920px',textAlign:'center',fontSize:'50px',fontStyle:'italic'});
  q.innerHTML='nudge a number &nbsp;→&nbsp; how much does the error change?';
  show(q,cue(sid,'nudge'),.6);
  const d=panel(S,'the derivative',600,{fontSize:'90px',color:C.yellow});show(d,cue(sid,'derivative'),.7);
  const st=panel(S,'the steepness of a curve',740,{fontSize:'44px',fontStyle:'italic',color:C.dim});show(st,cue(sid,'steepness'),.5);
  fadeOut(q,cue(sid,'name'),.5);
  sceneInOut(sid);
})();

/* ============ S2: a secant: rise over run ============ */
(function(){const S=$('S2'),sid='s2';
  fadeIn(dA,cue(sid,'point'),.4);fadeIn(dB,cue(sid,'second'),.4);
  fadeIn(sec,cue(sid,'secant'),.5);
  fadeIn([run,runL],cue(sid,'run'),.4);fadeIn([rise,riseL],cue(sid,'rise'),.4);
  fadeIn([SR,XR],cue(sid,'slope'),.5);
  const fr=panel(S,tex('\\dfrac{\\text{rise}}{\\text{run}}=\\dfrac{f(x+h)-f(x)}{h}',46),470);show(fr,cue(sid,'how'),.6);
  const n=panel(S,'secant: a line through two points',680,{fontSize:'40px',fontStyle:'italic',color:C.dim});show(n,cue(sid,'secant'),.5);
  sceneInOut(sid);
})();

/* ============ S3: slide the second point in: the tangent ============ */
(function(){const S=$('S3'),sid='s3';
  T.to(cue(sid,'slide'),3.6,{h:.01},'power2.inOut');
  fadeOut([run,rise,runL,riseL],cue(sid,'swings')+.6,.6);
  tl.to(sec,{attr:{stroke:C.pink},duration:.5},cue(sid,'tangent'));
  const n=panel(S,'tangent: just grazes the curve',470,{fontSize:'44px',fontStyle:'italic',color:C.pink});show(n,cue(sid,'tangent'),.5);
  const fr=panel(S,tex("f'(x)=\\lim_{h\\to 0}\\dfrac{f(x+h)-f(x)}{h}",44),600);show(fr,cue(sid,'symbols'),.7);
  sceneInOut(sid);
})();

/* ============ S4: zoom in: the curve straightens ============ */
(function(){const S=$('S4'),sid='s4';
  const svg=layerSvg(S);const VX=140,VY=200,VW=760,VH=760;
  const g=clipTo(svg,VX,VY,VW,VH);
  svgEl('rect',{x:VX,y:VY,width:VW,height:VH,fill:'none',stroke:C.dim,'stroke-width':2},svg);
  const tan=svgEl('path',{fill:'none',stroke:C.pink,'stroke-width':4,'stroke-dasharray':'12 10'},g);
  const cv=svgEl('path',{fill:'none',stroke:C.blue,'stroke-width':6},g);
  const dot=svgEl('circle',{r:10,fill:C.pink},g);
  const zl=el(S,'abs hid mono','',{left:VX+'px',top:(VY+VH+16)+'px',width:VW+'px',textAlign:'center',fontSize:'34px',color:C.dim});
  const Z=anim({w:2},o=>{const w=o.w,V=(x,y)=>[VX+VW/2+(x-1)/w*VW/2,VY+VH/2-(y-1)/(2*w)*VH/2];
    cv.setAttribute('d',pathD(V,f,1-1.2*w,1+1.2*w,120));tan.setAttribute('d',pathD(V,x=>1+2*(x-1),1-1.2*w,1+1.2*w,2));
    const c=V(1,1);dot.setAttribute('cx',c[0]);dot.setAttribute('cy',c[1]);zl.textContent=`zoom × ${Math.round(2/w)}`});
  sceneIn(sid);fadeIn(zl,cue(sid,'zoom'),.4);
  Z.to(cue(sid,'zoom'),3,{w:.5},'power1.inOut');Z.to(cue(sid,'keep'),5,{w:.02},'power2.in');
  const n1=panel(S,'the bend fades away',330,{fontSize:'48px',fontStyle:'italic'});show(n1,cue(sid,'bend'),.5);
  const n2=panel(S,'like the Earth looking flat where you stand',430,{fontSize:'38px',fontStyle:'italic',color:C.dim});show(n2,cue(sid,'earth'),.5);
  const n3=panel(S,'smooth = straight up close',560,{fontSize:'50px'});show(n3,cue(sid,'smooth'),.5);
  const n4=panel(S,'derivative = slope of that line',660,{fontSize:'44px',color:C.pink});show(n4,cue(sid,'derivative'),.5);
  tl.to(S,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5);
})();

/* ============ S5: the algebra: 2x ============ */
(function(){const S=$('S5'),sid='s5';
  const l1=panel(S,tex('(x+h)^2=x^2+2xh+h^2',46),400);show(l1,cue(sid,'expanding'),.6);
  const l2=panel(S,tex('\\dfrac{(x+h)^2-x^2}{h}=2x+h',46),490);show(l2,cue(sid,'leaves'),.6);
  const l3=panel(S,tex("\\xrightarrow{\\;h\\to 0\\;}\\ f'(x)=2x",56),650,{color:C.yellow});show(l3,cue(sid,'becomes'),.6);
  T.to(cue(sid,'one'),1.2,{x0:1,h:.001});
  T.to(cue(sid,'three'),1.6,{x0:2.9});
  T.to(cue(sid,'zero'),1.8,{x0:0});
  const b=panel(S,'the bottom of a bowl is flat',790,{fontSize:'40px',fontStyle:'italic',color:C.dim});show(b,cue(sid,'bottom'),.5);
  sceneInOut(sid);
})();

/* ============ S6: the derivative is a function ============ */
(function(){const S=$('S6'),sid='s6';
  const g3=x=>x*x*x/3-x,d3=x=>x*x-1;
  const PT=plane(560,380,170,105),PB=plane(560,830,170,75);
  const svg=layerSvg(S);
  const ax=(PP,y0,y1)=>{svgEl('line',{x1:PP(-2.4,0)[0],y1:PP(0,0)[1],x2:PP(2.4,0)[0],y2:PP(0,0)[1],stroke:C.axis,'stroke-width':2.5},svg);svgEl('line',{x1:PP(0,y0)[0],y1:PP(0,y0)[1],x2:PP(0,y1)[0],y2:PP(0,y1)[1],stroke:C.axis,'stroke-width':2.5,opacity:.6},svg)};
  ax(PT,-1.5,1.5);ax(PB,-1.4,2);
  const top=svgEl('path',{d:pathD(PT,g3,-2.05,2.05,140),fill:'none',stroke:C.blue,'stroke-width':6},svg);
  const bot=svgEl('path',{d:pathD(PB,d3,-2.05,2.05,140),fill:'none',stroke:C.yellow,'stroke-width':6,style:'opacity:0;visibility:hidden'},svg);
  const tg=svgEl('line',{stroke:C.pink,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
  const pd=svgEl('circle',{r:10,fill:C.pink,style:'opacity:0;visibility:hidden'},svg);
  const bd=svgEl('circle',{r:10,fill:C.pink,style:'opacity:0;visibility:hidden'},svg);
  const vl=svgEl('line',{stroke:C.dim,'stroke-width':2,'stroke-dasharray':'6 7',style:'opacity:0;visibility:hidden'},svg);
  const fl=el(S,'lbl',tex('f(x)',42),{color:C.blue});place(fl,PT(2.3,0)[0]+60,PT(0,1.5)[1]+20);
  const dl=el(S,'lbl',tex("f'(x)",42),{color:C.yellow});place(dl,PB(2.3,0)[0]+60,PB(0,2)[1]+30);
  const W=anim({x:-1.95},o=>{const x=o.x,y=g3(x),m=d3(x),a=PT(x-.5,y-.5*m),b=PT(x+.5,y+.5*m);
    tg.setAttribute('x1',a[0]);tg.setAttribute('y1',a[1]);tg.setAttribute('x2',b[0]);tg.setAttribute('y2',b[1]);
    const p=PT(x,y),q=PB(x,m);pd.setAttribute('cx',p[0]);pd.setAttribute('cy',p[1]);bd.setAttribute('cx',q[0]);bd.setAttribute('cy',q[1]);
    vl.setAttribute('x1',p[0]);vl.setAttribute('y1',p[1]);vl.setAttribute('x2',q[0]);vl.setAttribute('y2',q[1])});
  sceneIn(sid);fadeIn(fl,START[sid]+.3,.5);
  fadeIn([tg,pd],cue(sid,'local'),.4);
  fadeIn([bot,dl,bd,vl],cue(sid,'plot'),.6);
  W.to(cue(sid,'plot'),9,{x:1.95},'none');
  const pos=panel(S,'rises → positive',300,{fontSize:'42px',color:C.green,fontStyle:'italic'});show(pos,cue(sid,'positive'),.4);
  const neg=panel(S,'falls → negative',370,{fontSize:'42px',color:C.red,fontStyle:'italic'});show(neg,cue(sid,'negative'),.4);
  const zr=panel(S,'turns around → crosses zero',440,{fontSize:'42px',color:C.yellow,fontStyle:'italic'});show(zr,cue(sid,'crosses'),.4);
  const zs=[-1,1].map(x=>{const c=svgEl('circle',{cx:PB(x,0)[0],cy:PB(x,0)[1],r:14,fill:'none',stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);return c});
  fadeIn(zs,cue(sid,'crosses'),.4);
  const mn=panel(S,'where a minimum can hide',560,{fontSize:'40px',color:C.dim,fontStyle:'italic'});show(mn,cue(sid,'minimum'),.4);
  sceneInOut(sid);
})();

/* ============ S7: numerical derivative; every weight gets a slope ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const fr=el(S,'abs hid',tex("f'(x)\\approx\\dfrac{f(x+h)-f(x-h)}{2h}",60),{left:'0',top:'150px',width:'1920px',textAlign:'center'});show(fr,cue(sid,'tiny'),.6);
  const code=el(S,'abs hid mono','',{left:'460px',top:'330px',width:'1000px',fontSize:'34px',lineHeight:'52px',color:C.ink,background:'#161c25',border:'2px solid #2a3442',borderRadius:'12px',padding:'22px 32px',whiteSpace:'pre'});
  code.innerHTML='<span style="color:#7f8b99">def</span> num_deriv(f, x, h=1e-5):\n    <span style="color:#7f8b99">return</span> (f(x + h) - f(x - h)) / (2 * h)\n\nnum_deriv(<span style="color:#7f8b99">lambda</span> x: x**2, 1.0)  <span style="color:#5cd0b3"># 2.0000000</span>';
  show(code,cue(sid,'evaluate'),.6);
  const t=el(S,'abs hid','how practitioners check their gradients',{left:'0',top:'610px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});show(t,cue(sid,'test'),.5);
  fadeOut([code,t,fr],cue(sid,'language')-.3,.5);
  const rnd=seedRand(7);const cells=[];
  for(let r=0;r<4;r++)for(let c=0;c<14;c++){const v=rnd()*2-1;const d=el(S,'abs hid','',{left:(500+c*66)+'px',top:(250+r*90)+'px',width:'56px',height:'70px',borderRadius:'8px',border:`2px solid ${C.dim}`,textAlign:'center',lineHeight:'66px',fontSize:'34px',color:v>0?C.green:C.red});d.textContent=v>0?'↑':'↓';cells.push(d)}
  tl.to(cells,{autoAlpha:1,duration:.3,stagger:.02},cue(sid,'weights'));
  const w=el(S,'abs hid','every weight gets its own slope',{left:'0',top:'650px',width:'1920px',textAlign:'center',fontSize:'48px',fontStyle:'italic'});show(w,cue(sid,'slope'),.5);
  const w2=el(S,'abs hid','and moves to make the next-word prediction a little less wrong',{left:'0',top:'730px',width:'1920px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.dim});show(w2,cue(sid,'prediction'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 2.2 &nbsp;chain rule: rates multiply',{top:'930px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next',2),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
