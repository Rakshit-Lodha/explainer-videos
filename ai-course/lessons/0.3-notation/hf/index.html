/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});

/* transformable grid: lines in grid units, redrawn through a 2x2 matrix [a b; c d] (columns = images of i-hat, j-hat) */
function tgrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const lines=[];
  for(let k=-n;k<=n;k++){
    lines.push({p:[k,-n],q:[k,n],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)});
    lines.push({p:[-n,k],q:[n,k],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)})}
  const T={g,lines,P,m:{a:1,b:0,c:0,d:1}};
  T.apply=(m)=>{T.m={a:m.a,b:m.b,c:m.c,d:m.d};for(const L of lines){const A=P(m.a*L.p[0]+m.b*L.p[1],m.c*L.p[0]+m.d*L.p[1]),B=P(m.a*L.q[0]+m.b*L.q[1],m.c*L.q[0]+m.d*L.q[1]);
    L.e.setAttribute('x1',A[0]);L.e.setAttribute('y1',A[1]);L.e.setAttribute('x2',B[0]);L.e.setAttribute('y2',B[1])}};
  T.apply(T.m);return T}
/* the whole picture (grid + arrows defined in source coordinates) moves under one matrix tween */
function mkScene(P){const S={P,grids:[],arrows:[],dots:[],m:{a:1,b:0,c:0,d:1},extra:[]};
  S.apply=(m)=>{S.m={a:m.a,b:m.b,c:m.c,d:m.d};S.grids.forEach(g=>g.apply(m));
    S.arrows.forEach(([ar,x,y])=>geom(ar,0,0,m.a*x+m.b*y,m.c*x+m.d*y));
    S.dots.forEach(([e,x,y])=>{const p=P(m.a*x+m.b*y,m.c*x+m.d*y);e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1])});
    S.extra.forEach(f=>f(m))};
  S.to=(time,d,m,ease)=>{anim(time,d,S.m,m,S.apply,ease||'power2.inOut');S.m={...m}};
  return S}

  svgEl('line',{x1:P(0,0)[0],y1:P(0,-.5)[1],x2:P(0,0)[0],y2:P(0,3.2)[1],stroke:C.axis,'stroke-width':2,opacity:.6},g);
  fadeIn(g,cue(sid,'language'),.5);
  const a=mkArrow(svg,P,C.blue,7,'<span style="font-size:38px;font-style:italic">cat</span>',40,-10,S);setArrow(a,{x0:0,y0:0,x1:0,y1:0});
  const b=mkArrow(svg,P,C.yellow,7,'<span style="font-size:38px;font-style:italic">kitten</span>',40,-30,S);setArrow(b,{x0:0,y0:0,x1:0,y1:0});
  const c=mkArrow(svg,P,C.dim,7,'<span style="font-size:38px;font-style:italic">truck</span>',60,0,S);setArrow(c,{x0:0,y0:0,x1:0,y1:0});
  grow(a,cue(sid,'language')+.3,.8,4,1.4);grow(b,cue(sid,'language')+.6,.8,3.6,2.2);grow(c,cue(sid,'match')-.6,.8,4.4,-.3);
  const m1=el(S,'abs hid','cat · kitten: large → good match',{left:'1050px',top:'620px',width:'800px',fontSize:'40px',fontStyle:'italic',color:C.yellow});
  const m2=el(S,'abs hid','cat · truck: smaller → weaker match',{left:'1050px',top:'700px',width:'800px',fontSize:'40px',fontStyle:'italic',color:C.dim});
  show(m1,cue(sid,'match'),.5);show(m2,cue(sid,'match')+.6,.5);
  const ag=el(S,'abs hid','one line, run an enormous number of times',{left:'1050px',top:'820px',width:'800px',fontSize:'40px',fontStyle:'italic'});
  show(ag,cue(sid,'fluently'),.5);
  sceneInOut(sid);
})();

/* ============ S8: the alphabet, and what comes next ============ */
(function(){const S=$('S8');const sid='s8';
  const rows=[['x_i','picks out one entry',C.green,'subscript'],['\\mathbf{x}','names the whole list',C.blue,'bold'],['\\sum_i','a loop whose counter is the subscript',C.yellow,'sigma']];
  rows.forEach(([t,w,col,cw],i)=>{const d=el(S,'abs hid',`<span style="display:inline-block;width:220px;text-align:center">${tex(t,72)}</span><span style="font-size:50px;font-style:italic;color:${col}">${w}</span>`,{left:'420px',top:(230+i*170)+'px',width:'1300px'});
    show(d,cue(sid,cw),.6)});
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.1 &nbsp;vectors: arrows and lists of numbers',{top:'900px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'vectors'),.7);
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
