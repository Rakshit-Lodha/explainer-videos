function svgEl(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function layerSvg(parent){return svgEl('svg',{class:'full',viewBox:'0 0 1920 1080'},parent)}
const tex=(s,size)=>`<span style="font-size:${size||56}px">${katex.renderToString(s,{throwOnError:false,output:'html'})}</span>`;
function show(t,time,d,vars){tl.fromTo(t,{autoAlpha:0,y:(vars&&vars.y!=null)?vars.y:14},{autoAlpha:1,y:0,duration:d||.6,ease:'power2.out',stagger:(vars&&vars.stagger)||0,immediateRender:false},time)}
function fadeIn(t,time,d,stagger){tl.to(t,{autoAlpha:1,duration:d||.6,ease:'power1.out',stagger:stagger||0},time)}
function fadeOut(t,time,d){tl.to(t,{autoAlpha:0,duration:d||.5,ease:'power1.in'},time)}
function sceneInOut(sid,last){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid]);if(!last)tl.to(s,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5)}
function place(e,x,y){e.style.left=x+'px';e.style.top=y+'px';e.style.translate='-50% -50%';return e}
function seedRand(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
const fmt=(v,dp)=>{const a=Math.abs(v).toFixed(dp==null?1:dp);return (v<0&&Number(a)!==0?'−':'')+a};

/* number plane: grid units -> pixels */
function plane(ox,oy,u,uy){return (x,y)=>[ox+u*x,oy-(uy||u)*y]}
function drawGrid(svg,P,x0,x1,y0,y1,step){step=step||1;
  const g=svgEl('g',{},svg);
  for(let x=x0;x<=x1+1e-9;x+=step){const a=P(x,y0),b=P(x,y1);const ax=Math.abs(x)<1e-9;svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:ax?C.axis:C.grid,'stroke-width':ax?3:1.6,opacity:ax?.9:.55},g)}
  for(let y=y0;y<=y1+1e-9;y+=step){const a=P(x0,y),b=P(x1,y);const ax=Math.abs(y)<1e-9;svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:ax?C.axis:C.grid,'stroke-width':ax?3:1.6,opacity:ax?.9:.55},g)}
  return g}

/* arrows: geometry is recomputed from a proxy so seeks in any order land on the same frame */
function mkArrow(svg,P,color,w,label,lx,ly,parent){
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const line=svgEl('line',{stroke:color,'stroke-width':w||7,'stroke-linecap':'round'},g);
  const head=svgEl('polygon',{fill:color},g);
  const a={g,line,head,P,st:{x0:0,y0:0,x1:0,y1:0},lx:lx||0,ly:ly||-50};
  if(label){a.label=el(parent,'lbl',label,{color});a.label.setAttribute('data-layout-allow-overlap','')}
  return a}
function geom(a,x0,y0,x1,y1){
  const [p0x,p0y]=a.P(x0,y0),[p1x,p1y]=a.P(x1,y1);const dx=p1x-p0x,dy=p1y-p0y,L=Math.hypot(dx,dy);
  if(L<2){a.line.setAttribute('x1',p0x);a.line.setAttribute('y1',p0y);a.line.setAttribute('x2',p0x);a.line.setAttribute('y2',p0y);a.head.setAttribute('points','');}
  else{const hl=Math.min(30,L*.45),hw=hl*.55,ux=dx/L,uy=dy/L,bx=p1x-ux*hl,by=p1y-uy*hl;
    a.line.setAttribute('x1',p0x);a.line.setAttribute('y1',p0y);a.line.setAttribute('x2',bx);a.line.setAttribute('y2',by);
    a.head.setAttribute('points',`${p1x},${p1y} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`)}
  if(a.label)gsap.set(a.label,{x:p1x+a.lx,y:p1y+a.ly,xPercent:-50,yPercent:-50})}
function setArrow(a,s){Object.assign(a.st,s);geom(a,a.st.x0,a.st.y0,a.st.x1,a.st.y1)}
function arrowTo(a,time,d,to,ease){const from={...a.st},o={...from};const tgt={...from,...to};
  tl.to(o,{...tgt,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>geom(a,o.x0,o.y0,o.x1,o.y1)},time);a.st=tgt}
function showArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:1,duration:d||.4},time)}
function hideArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:0,duration:d||.4},time)}
function grow(a,time,d,x1,y1){setArrow(a,{x1:a.st.x0,y1:a.st.y0});showArrow(a,time,.25);arrowTo(a,time,d,{x1,y1},'power2.out')}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */

  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}


function vbox(S,x,y,name,val,color){const b=el(S,'vbox','',{left:(x-80)+'px',top:(y-48)+'px',width:'160px',height:'96px',borderColor:color||C.blue});
  el(b,'nm',name);const v=el(b,'vl',val);b.cx=x;b.cy=y;b.w=160;b.h=96;b.v=v;return b}
function opn(S,x,y,sym){const o=el(S,'op',sym,{left:(x-38)+'px',top:(y-38)+'px',width:'76px',height:'76px'});o.cx=x;o.cy=y;o.r=38;return o}
function link(svg,a,b,color){const ax=a.cx+(a.w?a.w/2:a.r),bx=b.cx-(b.w?b.w/2:b.r);const ay=a.cy,by=b.cy;const mx=(ax+bx)/2;
  const p=pth(svg,`M${ax} ${ay} C${mx} ${ay} ${mx} ${by} ${bx-8} ${by}`,color||C.dim,3);
  const head=svgEl('polygon',{points:`${bx},${by} ${bx-14},${by-7} ${bx-14},${by+7}`,fill:color||C.dim,style:'opacity:0;visibility:hidden'},svg);p.head=head;
  // a pink copy drawn from right to left for the backward pass
  const q=pth(svg,`M${bx-8} ${by} C${mx} ${by} ${mx} ${ay} ${ax} ${ay}`,C.pink,6);p.back=q;return p}
function buildExpr(S,svg,y0){y0=y0||0;const G={};
  G.a=vbox(S,200,300+y0,'a','2',C.blue);G.b=vbox(S,200,520+y0,'b','−3',C.blue);G.m1=opn(S,450,410+y0,'×');G.e=vbox(S,660,410+y0,'e = a·b','−6',C.ink);
  G.c=vbox(S,660,650+y0,'c','10',C.blue);G.p=opn(S,900,530+y0,'+');G.d=vbox(S,1110,530+y0,'d = e + c','4',C.ink);
  G.f=vbox(S,1110,770+y0,'f','−2',C.blue);G.m2=opn(S,1350,650+y0,'×');G.L=vbox(S,1580,650+y0,'L = d·f','−8',C.yellow);
  G.E={am:link(svg,G.a,G.m1),bm:link(svg,G.b,G.m1),me:link(svg,G.m1,G.e),ep:link(svg,G.e,G.p),cp:link(svg,G.c,G.p),pd:link(svg,G.p,G.d),dm:link(svg,G.d,G.m2),fm:link(svg,G.f,G.m2),mL:link(svg,G.m2,G.L)};
  G.boxes=[G.a,G.b,G.c,G.f,G.e,G.d,G.L];G.ops=[G.m1,G.p,G.m2];
  G.gr={};G.boxes.forEach(b=>{const k=Object.keys(G).find(n=>G[n]===b);const g=el(S,'gr','',{left:(b.cx-100)+'px',top:(b.cy+52)+'px'});G.gr[k]=g});
  return G}
function showAll(G){G.boxes.concat(G.ops).forEach(b=>gsap.set(b,{autoAlpha:1}));Object.values(G.E).forEach(l=>gsap.set([l,l.head],{autoAlpha:1}))}
function grad(G,k,txt,t){const g=G.gr[k];g.innerHTML='grad '+txt;tl.fromTo(g,{autoAlpha:0,scale:.6},{autoAlpha:1,scale:1,duration:.5,ease:'back.out(2)',immediateRender:false},t);
  tl.fromTo(G[k],{boxShadow:'0 0 0px #e77fb300'},{boxShadow:'0 0 34px #e77fb3cc',duration:.35,yoyo:true,repeat:1,immediateRender:false},t)}
function backFlow(l,t,d){drawOn(l.back,t,d||.7);tl.to(l.back,{autoAlpha:.35,duration:.6},t+(d||.7)+.6)}
/* gear drawing */
function gear(svg,cx,cy,r,teeth,color){const g=svgEl('g',{},svg);let d='';const n=teeth*2;for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2,R=i%2?r:r+14;d+=(i?'L':'M')+(cx+R*Math.cos(a0)).toFixed(1)+' '+(cy+R*Math.sin(a0)).toFixed(1)+' L'+(cx+R*Math.cos(a1)).toFixed(1)+' '+(cy+R*Math.sin(a1)).toFixed(1)+' '}
  svgEl('path',{d:d+'Z',fill:'#10151c',stroke:color,'stroke-width':4},g);svgEl('circle',{cx,cy,r:r*.25,fill:'none',stroke:color,'stroke-width':4},g);svgEl('line',{x1:cx,y1:cy,x2:cx+r*.85,y2:cy,stroke:color,'stroke-width':5},g);
  g.setAttribute('style','opacity:0;visibility:hidden');g.cx=cx;g.cy=cy;return g}
function spin(g,t,d,deg){tl.fromTo(g,{rotation:0},{rotation:deg,svgOrigin:`${g.cx} ${g.cy}`,duration:d,ease:'power1.inOut',immediateRender:false},t)}

/* ============ S1: one backward pass instead of billions of nudges ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const cols=[4,6,6,4,1],N=cols.map((n,i)=>{const a=[];for(let j=0;j<n;j++)a.push(node(S,320+i*300,540+(j-(n-1)/2)*105,24,'',i===4?C.yellow:C.blue));return a});
  const E=[];for(let i=0;i<4;i++)N[i].forEach(a=>N[i+1].forEach(b=>E.push(edge(svg,a,b,C.dim,1.6))));
  fadeIn([].concat(...N),cue(sid,'network'),.3,.02);E.forEach((e,k)=>drawOn(e,cue(sid,'network')+.2+k*.008,.4));
  const lossL=el(S,'lbl','loss',{color:C.yellow,fontSize:'40px',fontStyle:'italic'});place(lossL,1520,470);show(lossL,cue(sid,'loss'),.4);
  // nudge one weight at a time: edges flash in sequence
  const seq=[3,40,77,101,120,5,60];seq.forEach((k,i)=>{tl.to(E[k],{attr:{stroke:C.yellow,'stroke-width':6},duration:.15},cue(sid,'nudging')+i*.45);tl.to(E[k],{attr:{stroke:C.dim,'stroke-width':1.6},duration:.25},cue(sid,'nudging')+i*.45+.35)});
  const cnt=el(S,'abs mono','',{left:'120px',top:'900px',width:'900px',fontSize:'38px',color:C.yellow,opacity:0,visibility:'hidden'});cnt.innerHTML='one rerun per weight: billions of forward passes';show(cnt,cue(sid,'billions'),.5);
  // one backward sweep
  const sweep=el(S,'abs','',{left:'0px',top:'180px',width:'140px',height:'720px',background:'linear-gradient(90deg,#e77fb300,#e77fb366,#e77fb300)',opacity:0,visibility:'hidden'});
  gsap.set(sweep,{x:1560});
  tl.to(sweep,{autoAlpha:1,duration:.3},cue(sid,'backpropagation'));tl.to(sweep,{x:180,duration:2.6,ease:'power1.inOut'},cue(sid,'backpropagation'));tl.to(sweep,{autoAlpha:0,duration:.4},cue(sid,'backpropagation')+2.6);
  tl.to(E,{attr:{stroke:C.pink},duration:.3,stagger:{each:.008,from:'end'}},cue(sid,'backpropagation')+.2);
  const one=el(S,'abs','',{left:'1060px',top:'900px',width:'760px',textAlign:'right',fontSize:'40px',fontStyle:'italic',color:C.pink,opacity:0,visibility:'hidden'});one.innerHTML='backpropagation: every answer from one backward pass';show(one,cue(sid,'single'),.5);
  fadeOut(cnt,cue(sid,'single'),.4);
  sceneInOut(sid);
})();

(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);
  const g1=gear(svg,620,520,210,24,C.blue),g2=gear(svg,620+210+70+14,520,70,8,C.yellow);
  fadeIn([g1,g2],cue(sid,'gears'),.6);
  spin(g1,cue(sid,'turning'),2.4,30);spin(g2,cue(sid,'turning'),2.4,-90);
  const l1=el(S,'lbl','turn by a tiny amount',{color:C.blue,fontSize:'38px',fontStyle:'italic'});place(l1,620,820);show(l1,cue(sid,'turning'),.4);
  const l2=el(S,'lbl','turns three times as much',{color:C.yellow,fontSize:'38px',fontStyle:'italic'});place(l2,1000,380);show(l2,cue(sid,'three'),.4);
  const r=el(S,'abs','',{left:'1220px',top:'480px',width:'600px',textAlign:'center',opacity:0,visibility:'hidden'});r.innerHTML=tex('\\text{ratio} = 3',64);show(r,cue(sid,'three',2),.5);
  tl.to([r,l1,l2],{autoAlpha:0,duration:.4},cue(sid,'derivative',2)-.3);
  tl.to([g1,g2],{x:-260,duration:1,ease:'power2.inOut'},cue(sid,'derivative',2)-.3);
  const f=el(S,'abs','',{left:'1020px',top:'330px',width:'800px',textAlign:'center',opacity:0,visibility:'hidden'});f.innerHTML=tex('\\frac{\\partial L}{\\partial w}\\;\\approx\\;\\frac{\\text{change in } L}{\\text{tiny change in } w}',58);show(f,cue(sid,'derivative',2),.6);

  s1.innerHTML='<span style="color:#83c167">positive</span>: nudging w up raises the loss<br><span style="color:#fc6255">negative</span>: nudging w up lowers it';show(s1,cue(sid,'sign'),.6);

/* ============ S3: local derivatives of + and × ============ */
(function(){const S=$('S3');const sid='s3';
  const svg=layerSvg(S);
  const t=el(S,'cap','each node knows only its own <em>local derivatives</em>',{top:'110px',fontSize:'46px',fontStyle:'italic'});show(t,cue(sid,'local'),.5);
  // addition panel
  const A=opn(S,520,520,'+');const ain=[node(S,250,420,46,'a',C.blue,34),node(S,250,620,46,'b',C.blue,34)];const aout=node(S,800,520,52,'a+b',C.ink,28);
  const ae=[edge(svg,ain[0],A,C.dim,3),edge(svg,ain[1],A,C.dim,3),edge(svg,A,aout,C.dim,3)];
  show([A,...ain,aout],cue(sid,'addition'),.4);ae.forEach(e=>drawOn(e,cue(sid,'addition'),.4));
  const nd=el(S,'lbl','+Δ',{color:C.yellow,fontSize:'40px'});place(nd,250,340);show(nd,cue(sid,'nudge'),.4);
  const od=el(S,'lbl','+Δ',{color:C.yellow,fontSize:'40px'});place(od,800,430);show(od,cue(sid,'moves'),.4);
  const ad=el(S,'abs','',{left:'230px',top:'740px',width:'640px',textAlign:'center',opacity:0,visibility:'hidden'});ad.innerHTML=tex('\\frac{\\partial(a+b)}{\\partial a}=1,\\quad \\frac{\\partial(a+b)}{\\partial b}=1',46);show(ad,cue(sid,'one'),.5);
  // multiplication panel
  const M=opn(S,1400,520,'×');const min=[node(S,1130,420,46,'a',C.blue,34),node(S,1130,620,46,'b',C.blue,34)];const mout=node(S,1680,520,52,'a·b',C.ink,28);
  const me=[edge(svg,min[0],M,C.dim,3),edge(svg,min[1],M,C.dim,3),edge(svg,M,mout,C.dim,3)];
  show([M,...min,mout],cue(sid,'multiplication'),.4);me.forEach(e=>drawOn(e,cue(sid,'multiplication'),.4));
  const sw1=pth(svg,'M1176 430 C1260 470 1260 570 1176 610',C.pink,4),sw2=pth(svg,'M1100 610 C1020 570 1020 470 1100 430',C.teal,4);
  drawOn(sw1,cue(sid,'swap'),.6);drawOn(sw2,cue(sid,'swap')+.3,.6);
  const md=el(S,'abs','',{left:'1080px',top:'740px',width:'700px',textAlign:'center',opacity:0,visibility:'hidden'});md.innerHTML=tex('\\frac{\\partial(ab)}{\\partial a}={\\color{#e77fb3}b},\\quad \\frac{\\partial(ab)}{\\partial b}={\\color{#5cd0b3}a}',46);
  show(md,cue(sid,'moves',2),.5);
  const sl=el(S,'lbl','the swap',{color:C.pink,fontSize:'38px',fontStyle:'italic'});place(sl,1400,330);show(sl,cue(sid,'swap'),.4);
  sceneInOut(sid);

/* ============ S4: the chain rule ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const g1=gear(svg,420,520,240,24,C.blue),g2=gear(svg,420+240+80+14,520,80,8,C.teal);
  const g3=gear(svg,g2.cx,520+80+40+14,40,4,C.yellow);
  fadeIn([g1,g2,g3],cue(sid,'gears'),.6);
  spin(g1,cue(sid,'chain'),2.4,20);spin(g2,cue(sid,'chain'),2.4,-60);spin(g3,cue(sid,'chain'),2.4,120);
  const la=el(S,'lbl',tex('a',48),{color:C.blue});place(la,420,200);const lc=el(S,'lbl',tex('c',48),{color:C.teal});place(lc,g2.cx,400);
  const lL=el(S,'lbl',tex('L',48),{color:C.yellow});place(lL,g3.cx+100,g3.cy);
  show([la,lc,lL],cue(sid,'chain'),.5);
  const r1=el(S,'abs','',{left:'1050px',top:'240px',width:'780px',opacity:0,visibility:'hidden'});r1.innerHTML=tex('\\frac{\\partial L}{\\partial c}=2',54);show(r1,cue(sid,'two'),.5);
  const r2=el(S,'abs','',{left:'1050px',top:'380px',width:'780px',opacity:0,visibility:'hidden'});r2.innerHTML=tex('\\frac{\\partial c}{\\partial a}=3',54);show(r2,cue(sid,'three'),.5);
  const r3=el(S,'abs','',{left:'1050px',top:'540px',width:'780px',opacity:0,visibility:'hidden'});r3.innerHTML=tex('\\frac{\\partial L}{\\partial a}=\\frac{\\partial L}{\\partial c}\\cdot\\frac{\\partial c}{\\partial a}=2\\times3=6',54);show(r3,cue(sid,'six'),.6);
  const cr=el(S,'abs','',{left:'1050px',top:'720px',width:'780px',fontSize:'46px',fontStyle:'italic',color:C.yellow,opacity:0,visibility:'hidden'});cr.innerHTML='the chain rule';show(cr,cue(sid,'chain',2),.5);
  const ml=el(S,'abs','',{left:'1050px',top:'800px',width:'780px',fontSize:'38px',fontStyle:'italic',opacity:0,visibility:'hidden'});ml.innerHTML='multiply the local ratios along the path';show(ml,cue(sid,'multiply'),.5);
  sceneInOut(sid);
})();

/* ============ S5 + S6: backward through the graph ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);const G=buildExpr(S,svg,-20);
  fadeIn(G.boxes.concat(G.ops),at(sid,.01),.5);Object.values(G.E).forEach(l=>fadeIn([l,l.head],at(sid,.01),.5));
  const ex=el(S,'cap',tex('L=(a\\cdot b+c)\\cdot f',52),{top:'96px'});show(ex,at(sid,.02),.5);
  tl.to(G.L,{borderColor:C.pink,duration:.4},cue(sid,'loss'));
  grad(G,'L','1',cue(sid,'one'));
  const note=el(S,'abs','',{left:'1300px',top:'880px',width:'560px',fontSize:'34px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});note.innerHTML='∂L/∂L = 1: start at the output';show(note,cue(sid,'itself'),.4);
  tl.to(G.m2,{borderColor:C.pink,boxShadow:'0 0 24px #e77fb388',duration:.4},cue(sid,'last',2));
  backFlow(G.E.mL,cue(sid,'last',2),.6);
  const sw=el(S,'abs','',{left:'1200px',top:'330px',width:'680px',textAlign:'center',opacity:0,visibility:'hidden'});sw.innerHTML=tex('\\tfrac{\\partial L}{\\partial f}=d=4,\\;\\; \\tfrac{\\partial L}{\\partial d}=f=-2',40);
  show(sw,cue(sid,'swap'),.5);
  backFlow(G.E.fm,cue(sid,'flowing'),.6);grad(G,'f','4',cue(sid,'four',2));
  backFlow(G.E.dm,cue(sid,'flowing',2),.6);grad(G,'d','−2',cue(sid,'two',2));
  tl.to(G.m2,{borderColor:C.dim,boxShadow:'0 0 0px #e77fb300',duration:.4},cue(sid,'two',2)+.6);
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);const G=buildExpr(S,svg,-20);showAll(G);
  const ex=el(S,'cap',tex('L=(a\\cdot b+c)\\cdot f',52),{top:'96px'});gsap.set(ex,{autoAlpha:1});
  // carry over the state reached at the end of s5
  [['L','1'],['f','4'],['d','−2']].forEach(([k,t])=>{G.gr[k].innerHTML='grad '+t;gsap.set(G.gr[k],{autoAlpha:1})});
  ['mL','fm','dm'].forEach(k=>gsap.set(G.E[k].back,{autoAlpha:.35,attr:{'stroke-dashoffset':0}}));
  tl.to(G.p,{borderColor:C.pink,boxShadow:'0 0 24px #e77fb388',duration:.4},cue(sid,'addition'));
  const pt=el(S,'abs','',{left:'1340px',top:'300px',width:'520px',textAlign:'center',fontSize:'36px',fontStyle:'italic',color:C.pink,opacity:0,visibility:'hidden'});pt.innerHTML='+ passes the gradient through unchanged';show(pt,cue(sid,'passes'),.4);
  backFlow(G.E.pd,cue(sid,'passes'),.5);
  backFlow(G.E.cp,cue(sid,'so'),.5);grad(G,'c','−2',cue(sid,'receives'));
  backFlow(G.E.ep,cue(sid,'product')-.3,.5);grad(G,'e','−2',cue(sid,'product'));
  tl.to(G.p,{borderColor:C.dim,boxShadow:'0 0 0px #e77fb300',duration:.4},cue(sid,'finally'));
  tl.to(G.m1,{borderColor:C.pink,boxShadow:'0 0 24px #e77fb388',duration:.4},cue(sid,'multiplication'));
  fadeOut(pt,cue(sid,'finally'),.3);
  const st=el(S,'abs','',{left:'1340px',top:'300px',width:'520px',textAlign:'center',fontSize:'36px',fontStyle:'italic',color:C.pink,opacity:0,visibility:'hidden'});st.innerHTML='× swaps again';show(st,cue(sid,'swap'),.4);
  backFlow(G.E.me,cue(sid,'swap'),.5);
  backFlow(G.E.am,cue(sid,'receives',2)-.2,.5);
  const ca=el(S,'abs','',{left:'300px',top:'190px',width:'360px',opacity:0,visibility:'hidden'});ca.innerHTML=tex('-2\\times b = 6',40);
  show(ca,cue(sid,'times'),.4);grad(G,'a','6',cue(sid,'six'));
  backFlow(G.E.bm,cue(sid,'receives',3)-.2,.5);
  const cb=el(S,'abs','',{left:'300px',top:'640px',width:'360px',opacity:0,visibility:'hidden'});cb.innerHTML=tex('-2\\times a = -4',40);
  show(cb,cue(sid,'times',2),.4);grad(G,'b','−4',cue(sid,'four'));
  const sm=el(S,'cap','each gradient: how strongly the loss responds to a nudge in that value',{top:'960px',fontSize:'38px',fontStyle:'italic'});show(sm,cue(sid,'tells'),.5);
  tl.to(S,{opacity:1,duration:.05,ease:'none'},START[sid]);tl.to(S,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5);
})();

/* ============ S7: branches add ============ */
(function(){const S=$('S7');const sid='s7';
  const svg=layerSvg(S);
  const A=vbox(S,300,520,'a','',C.blue);A.v.innerHTML='';
  const o1=opn(S,640,360,'×3'),o2=opn(S,640,680,'×2');o1.style.fontSize='30px';o2.style.fontSize='30px';
  const P=opn(S,960,520,'+');const L=vbox(S,1240,520,'L = 3a + 2a','',C.yellow);
  const ls=[link(svg,A,o1),link(svg,A,o2),link(svg,o1,P),link(svg,o2,P),link(svg,P,L)];
  show(A,cue(sid,'value'),.4);show([o1,o2],cue(sid,'two'),.4);ls.slice(0,2).forEach(l=>{drawOn(l,cue(sid,'two'),.5);tl.to(l.head,{autoAlpha:1,duration:.2},cue(sid,'two')+.4)});
  show([P,L],cue(sid,'reaches'),.4);ls.slice(2).forEach(l=>{drawOn(l,cue(sid,'reaches'),.5);tl.to(l.head,{autoAlpha:1,duration:.2},cue(sid,'reaches')+.4)});
  drawOn(ls[0].back,cue(sid,'paths'),.6);drawOn(ls[1].back,cue(sid,'paths')+.2,.6);
  const g1=el(S,'lbl','3',{color:C.pink,fontSize:'44px'});place(g1,460,380);const g2=el(S,'lbl','2',{color:C.pink,fontSize:'44px'});place(g2,460,660);
  show([g1,g2],cue(sid,'paths'),.4);
  const tot=el(S,'gr','grad 3 + 2 = 5',{left:'150px',top:'580px'});tot.style.width='300px';show(tot,cue(sid,'sum'),.5);
  const code=el(S,'code','a.grad <span class="f">+=</span> local * out.grad   <span class="c"># accumulate</span>',{left:'120px',top:'780px',fontSize:'34px'});show(code,cue(sid,'adds'),.5);
  const bad=el(S,'abs mono','',{left:'150px',top:'910px',width:'1000px',fontSize:'34px',color:C.red,opacity:0,visibility:'hidden'});bad.innerHTML='a.grad = ...   <span style="font-family:Newsreader,serif;font-style:italic">overwrites: keeps one branch (3 or 2), not 5</span>';
  show(bad,cue(sid,'overwriting'),.5);

/* ============ S8: order and cost ============ */
(function(){const S=$('S8');const sid='s8';
  const svg=layerSvg(S);const G=buildExpr(S,svg,-60);showAll(G);
  G.boxes.forEach(b=>gsap.set(b,{autoAlpha:0}));G.ops.forEach(b=>gsap.set(b,{autoAlpha:0}));Object.values(G.E).forEach(l=>gsap.set([l,l.head],{autoAlpha:0}));
  fadeIn(G.boxes.concat(G.ops),at(sid,.01),.5);Object.values(G.E).forEach(l=>fadeIn([l,l.head],at(sid,.01),.5));
  const order=['a','b','e','c','d','f','L'];
  const fw=order.map((k,i)=>{const b=G[k];const t=el(S,'lbl',`<span class="mono" style="font-size:30px">${i+1}</span>`,{color:C.teal,background:'#10151c',border:'2px solid #5cd0b3',borderRadius:'50%',width:'48px',height:'48px',lineHeight:'44px',textAlign:'center'});place(t,b.cx+78,b.cy-46);return t});
  const bw=order.map((k,i)=>{const b=G[k];const t=el(S,'lbl',`<span class="mono" style="font-size:30px">${order.length-i}</span>`,{color:C.pink,background:'#10151c',border:'2px solid #e77fb3',borderRadius:'50%',width:'48px',height:'48px',lineHeight:'44px',textAlign:'center'});place(t,b.cx+78,b.cy-46);return t});
  tl.to(fw,{autoAlpha:1,duration:.25,stagger:.25},cue(sid,'nodes'));
  const fl=el(S,'lbl','order created by the forward pass',{color:C.teal,fontSize:'34px',fontStyle:'italic'});place(fl,560,880);show(fl,cue(sid,'nodes'),.4);
  tl.to(fw,{autoAlpha:0,duration:.3},cue(sid,'created')-.2);tl.to(bw.slice().reverse(),{autoAlpha:1,duration:.25,stagger:.25},cue(sid,'created'));
  fadeOut(fl,cue(sid,'created')-.2,.3);
  const bl=el(S,'lbl','backward: the reverse order',{color:C.pink,fontSize:'34px',fontStyle:'italic'});place(bl,560,880);show(bl,cue(sid,'created'),.4);
  Object.values(G.E).forEach((l,i)=>{tl.to(l,{attr:{stroke:C.yellow,'stroke-width':6},duration:.2},cue(sid,'edge')+i*.18);tl.to(l,{attr:{stroke:C.dim,'stroke-width':3},duration:.3},cue(sid,'edge')+i*.18+.3)});
  const once=el(S,'lbl','each edge handled once',{color:C.yellow,fontSize:'34px',fontStyle:'italic'});place(once,1360,880);show(once,cue(sid,'once',2),.4);
  sceneInOut(sid);
})();

/* ============ S9: a step downhill ============ */
(function(){const S=$('S9');const sid='s9';
  const svg=layerSvg(S);
  const P=plane(560,780,110,40);
  const curve=x=>(x-1)*(x-1)*2+1;
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:P(-2,0)[0],y1:P(0,0)[1],x2:P(4,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},ax);
  fadeIn(ax,at(sid,.01),.4);
  const cv=pth(svg,fpath(curve,P,-1.6,3.6),C.blue,6);drawOn(cv,at(sid,.02),1);
  const ll=el(S,'lbl','loss',{color:C.blue,fontSize:'36px',fontStyle:'italic'});place(ll,P(-1.5,0)[0]-60,P(0,curve(-1.5))[1]);fadeIn(ll,at(sid,.05),.4);
  const wl=el(S,'lbl','weight',{color:C.dim,fontSize:'32px',fontStyle:'italic'});place(wl,P(3.8,0)[0],P(0,0)[1]+36);fadeIn(wl,at(sid,.05),.4);
  const ball=svgEl('circle',{r:18,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  const st={x:3.5};const ap=()=>{const p=P(st.x,curve(st.x));ball.setAttribute('cx',p[0]);ball.setAttribute('cy',p[1]-18)};ap();
  fadeIn(ball,cue(sid,'downhill'),.3);
  const xs=[2.8,2.2,1.7,1.35,1.15];xs.forEach((x,i)=>tl.to(st,{x,duration:.5,ease:'power2.out',immediateRender:false,onUpdate:ap},cue(sid,'downhill')+.4+i*.7));
  const rule=el(S,'abs','',{left:'1080px',top:'200px',width:'760px',textAlign:'center',opacity:0,visibility:'hidden'});rule.innerHTML=tex('w \\;\\leftarrow\\; w-\\eta\\,\\frac{\\partial L}{\\partial w}',62);show(rule,cue(sid,'subtracting'),.6);
  const ex=el(S,'abs','',{left:'1080px',top:'420px',width:'760px',fontSize:'40px',lineHeight:'1.6',opacity:0,visibility:'hidden'});
  ex.innerHTML='<span class="mono">grad of a = 6</span><br><span class="mono">a: 2 → 2 − 0.01 × 6 = 1.94</span><br><span class="mono" style="color:#f5cf4a">L: −8 → −8.36</span>';
  show(ex,cue(sid,'six'),.6);
  const op=el(S,'abs','',{left:'1080px',top:'700px',width:'760px',fontSize:'38px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});op.innerHTML='step against the gradient: the loss goes down';show(op,cue(sid,'opposite'),.5);
  const lp=el(S,'cap','repeat: the training loop (module 7)',{top:'960px',fontStyle:'italic',fontSize:'40px',color:C.teal});show(lp,cue(sid,'loop'),.5);
  sceneInOut(sid);
})();

/* ============ S10: at LLM scale ============ */
(function(){const S=$('S10');const sid='s10';
  const code=el(S,'code','logits = model(tokens)\nloss = cross_entropy(logits, next_tokens)\nloss.backward()     <span class="c"># one backward pass</span>\n<span class="c"># every parameter now has .grad</span>',{left:'170px',top:'220px',fontSize:'36px'});

  fadeOut(h[0],cue(sid,'backward'),.3);fadeOut(h[1],cue(sid,'gradient'),.3);
  const bn=el(S,'abs','',{left:'1260px',top:'250px',width:'560px',textAlign:'center',fontSize:'48px',color:C.yellow,opacity:0,visibility:'hidden'});bn.innerHTML='billions of gradients,<br>one pass';show(bn,cue(sid,'billions'),.5);

  sceneInOut(sid,true);
})();
