function hideArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:0,duration:d||.4},time)}
function grow(a,time,d,x1,y1){setArrow(a,{x1:a.st.x0,y1:a.st.y0});showArrow(a,time,.25);arrowTo(a,time,d,{x1,y1},'power2.out')}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers (modules 10-12) ---- */
function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

/* ============ S1: the recipe you know ============ */

/* ============ S2: parametric vs non-parametric memory ============ */

  const tags=[['fixed at training',cue(sid,'fixed')],['hazy on rare facts',cue(sid,'hazy')],['cannot cite',cue(sid,'cite')]];
  tags.forEach(([t,c],i)=>{const d=txt(S,t,428,790+i*50,{fs:30,it:true,color:C.dim});show(d,c,.3)});

  const ref=txt(S,'Lewis et al., 2020 · Wikipedia index',1405,790,{fs:30,it:true,color:C.dim});show(ref,cue(sid,'lewis'),.4);
  tl.to(docs[4],{borderColor:C.yellow,background:'#f5cf4a33',duration:.5},cue(sid,'editing'));
  const ed=txt(S,'edit a document, not the weights',1405,850,{fs:30,it:true,color:C.yellow});show(ed,cue(sid,'editing'),.4);

/* ============ S3: bi-encoder, unit vectors, dot products ============ */
(function(){const S=$('S3');const sid='s3';
  const P=plane(560,560,190);const svg=layerSvg(S);
  const g=drawGrid(svg,P,-2,2,-2,2);g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(g,at(sid,.01),.6);
  const pts=[[1.2,.5],[1.6,.9],[1.1,1.3],[-1.4,.8],[-.8,1.6],[-1.2,-1.1],[.5,-1.6],[1.5,-.6],[-1.7,-.2]];
  const dots=pts.map(([x,y])=>svgEl('circle',{cx:P(x,y)[0],cy:P(x,y)[1],r:12,fill:C.blue,style:'opacity:0;visibility:hidden'},svg));
  tl.to(dots,{autoAlpha:1,duration:.3,stagger:.08},cue(sid,'chunk'));
  const cl=txt(S,'chunks',P(1.5,.9)[0]+40,P(1.5,.9)[1]-50,{fs:32,it:true,color:C.blue});show(cl,cue(sid,'chunk'),.3);
  const q=svgEl('circle',{cx:P(1.35,.85)[0],cy:P(1.35,.85)[1],r:14,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(q,cue(sid,'lands'),.4);
  const ql=txt(S,'question',P(1.35,.85)[0]-20,P(1.35,.85)[1]+48,{fs:32,it:true,color:C.yellow});show(ql,cue(sid,'lands'),.3);
  const st=box(S,1420,300,560,110,'chunk vectors: computed once, stored',C.blue,{fs:34});show(st,cue(sid,'computed'),.5);
  // normalise: dots slide to the unit circle
  const circ=svgEl('circle',{cx:P(0,0)[0],cy:P(0,0)[1],r:190,fill:'none',stroke:C.pink,'stroke-width':3,'stroke-dasharray':'10 8',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(circ,cue(sid,'unit'),.4);
  const T=cue(sid,'unit');
  dots.forEach((d,i)=>{const [x,y]=pts[i],n=Math.hypot(x,y);tl.to(d,{attr:{cx:P(x/n,y/n)[0],cy:P(x/n,y/n)[1]},duration:1,ease:'power2.inOut'},T)});
  {const n=Math.hypot(1.35,.85);tl.to(q,{attr:{cx:P(1.35/n,.85/n)[0],cy:P(1.35/n,.85/n)[1]},duration:1,ease:'power2.inOut'},T)}
  tl.to([cl,ql],{autoAlpha:0,duration:.3},T);
  const eq=eqn(S,'\\cos(q,c) = \\frac{q\\cdot c}{\\lVert q\\rVert\\,\\lVert c\\rVert}',1440,520,48);show(eq,cue(sid,'cosine'),.6);const eq2=eqn(S,'\\lVert q\\rVert=\\lVert c\\rVert=1 \\;\\Rightarrow\\; \\cos(q,c) = q\\cdot c',1440,640,44);show(eq2,cue(sid,'unit'),.6);
  const nn=txt(S,'nearest neighbours = largest dot products',1440,750,{fs:32,it:true,color:C.dim});show(nn,cue(sid,'dot'),.4);
  sceneInOut(sid);
})();

/* ============ S4: approximate nearest neighbours, HNSW ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);const rnd=seedRand(9);
  const layers=[{y:300,n:4,c:C.pink,name:'motorway'},{y:540,n:9,c:C.yellow,name:'main roads'},{y:800,n:18,c:C.blue,name:'side streets'}];
  const L=layers.map((ly,li)=>{const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
    svgEl('ellipse',{cx:760,cy:ly.y,rx:620,ry:90,fill:'#141a22',stroke:'#2a6f97','stroke-width':2},g);
    const nodes=[];for(let i=0;i<ly.n;i++){const x=200+(i+.5)*(1120/ly.n)+(rnd()-.5)*30,y=ly.y+(rnd()-.5)*90;nodes.push([x,y])}
    nodes.forEach((p,i)=>{if(i)svgEl('line',{x1:nodes[i-1][0],y1:nodes[i-1][1],x2:p[0],y2:p[1],stroke:ly.c,'stroke-width':2,opacity:.6},g);if(i>1&&i%2===0)svgEl('line',{x1:nodes[i-2][0],y1:nodes[i-2][1],x2:p[0],y2:p[1],stroke:ly.c,'stroke-width':1.5,opacity:.35},g)});
    nodes.forEach(p=>svgEl('circle',{cx:p[0],cy:p[1],r:9,fill:ly.c},g));
    return {g,nodes,...ly}});
  L.forEach((l,i)=>fadeIn(l.g,cue(sid,'layered')+i*.3,.5));
  const slow=box(S,1640,420,460,110,'compare with every chunk: too slow',C.red,{fs:32});show(slow,cue(sid,'millions'),.5);fadeOut(slow,cue(sid,'approximate')-.2,.3);
  const ann=txt(S,'approximate nearest neighbour',1640,130,{fs:34,color:C.ink});show(ann,cue(sid,'approximate'),.4);
  const hn=txt(S,'HNSW · layered neighbour graphs',1640,180,{fs:32,it:true,color:C.dim});show(hn,cue(sid,'hnsw'),.4);
  // greedy path: top -> middle -> bottom
  const path=[L[0].nodes[0],L[0].nodes[2],[L[0].nodes[2][0],L[1].y],L[1].nodes[6],L[1].nodes[7],[L[1].nodes[7][0],L[2].y],L[2].nodes[14],L[2].nodes[15]];
  const pd='M'+path.map(p=>p[0].toFixed(0)+' '+p[1].toFixed(0)).join(' L');
  const pp=pth(svg,pd,C.green,6);drawOn(pp,cue(sid,'greedily'),2.5);
  const names=L.map((l,i)=>txt(S,l.name,1530,l.y,{fs:34,it:true,color:l.c}));
  show(names[0],cue(sid,'motorway'),.3);show(names[1],cue(sid,'main'),.3);show(names[2],cue(sid,'side'),.3);
  const tr=box(S,1600,960,520,90,'small recall loss, large speed-up',C.green,{fs:32});show(tr,cue(sid,'accepts'),.5);
  sceneInOut(sid);
})();

/* ============ S6: just tokens in the context; lost in the middle ============ */
(function(){const S=$('S6');const sid='s6';
  const segs=[['system',C.dim,170],['chunk 1',C.green,250],['chunk 2',C.red,250],['chunk 3',C.green,250],['question',C.yellow,230],['answer…',C.pink,200]];
  let x=150;const X=[];const sb=segs.map(([t,c,w])=>{const cx=x+w/2;X.push(cx);x+=w+14;return cellAt(S,cx,300,w,80,t,c,{fs:30,ink:c})});
  show(sb.slice(0,5),cue(sid,'prompt'),.4,{stagger:.08});
  const tk=txt(S,'just tokens in the context',960,400,{fs:38,it:true,color:C.ink});show(tk,cue(sid,'tokens'),.4);
  show(sb[5],cue(sid,'generated'),.4);
  const svg=layerSvg(S);
  const arcs=[1,2,3,4].map(i=>pth(svg,`M${X[5]} 260 Q${(X[5]+X[i])/2} ${120-i*8} ${X[i]} 260`,C.pink,3));

  const b=txt(S,'start',P(0.04,0)[0]+30,P(0,.92)[1],{fs:30,color:C.green}),e=txt(S,'end',P(.96,0)[0]-20,P(0,.98)[1],{fs:30,color:C.green}),m=txt(S,'middle',P(.5,0)[0],P(0,.36)[1]+40,{fs:30,color:C.red});
  show([b,e],cue(sid,'end'),.4);show(m,cue(sid,'middle',2),.4);
  const rf=txt(S,'Liu et al., “Lost in the Middle” · schematic',1560,470,{fs:28,it:true,color:C.dim});show(rf,cue(sid,'liu'),.4);
  sceneInOut(sid);
})();
