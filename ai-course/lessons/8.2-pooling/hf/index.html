/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}
function cellGrid(S,x0,y0,R,Cc,cell,fill,txt,o){o=o||{};const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:(Cc*cell)+'px',height:(R*cell)+'px',opacity:0,visibility:'hidden'});
  const cells=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<Cc;c++){const d=el(box,'abs mono',txt?txt(r,c):'',{left:(c*cell)+'px',top:(r*cell)+'px',width:(cell-3)+'px',height:(cell-3)+'px',lineHeight:(cell-3)+'px',textAlign:'center',
    fontSize:(o.fs||Math.round(cell*.42))+'px',background:fill?fill(r,c):'#161d27',border:'1px solid '+(o.border||'#2a3442'),borderRadius:'5px',color:o.ink?o.ink(r,c):C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cell,R,C:Cc}}
function arrowR(svg,x0,y,x1,color){const p=pth(svg,`M${x0} ${y} L${x1-6} ${y}`,color||C.dim,4);const h=arrowHead(svg,x1,y,1,0,color||C.dim);return [p,h]}
function showArrowR(a,t){drawOn(a[0],t,.4);fadeIn(a[1],t+.35,.15)}
const heat=v=>{const a=Math.max(0,Math.min(1,v));return `rgba(245,207,74,${(.08+.85*a).toFixed(2)})`};
/* plain grid box drawn with lines */
function lineGrid(S,x0,y0,n,cell,bg){const b=el(S,'abs','',{left:x0+'px',top:y0+'px',width:(n*cell)+'px',height:(n*cell)+'px',background:bg||'#11161e',border:'2px solid #2a3442',borderRadius:'6px',opacity:0,visibility:'hidden'});
  for(let i=1;i<n;i++){el(b,'abs','',{left:(i*cell)+'px',top:'0px',width:'1px',height:(n*cell)+'px',background:'#26303d'});el(b,'abs','',{left:'0px',top:(i*cell)+'px',width:(n*cell)+'px',height:'1px',background:'#26303d'})}return b}

/* ============ S1: more precision than we need ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const F=[...Array(8)].map((_,r)=>[...Array(8)].map((_,c)=>Math.exp(-Math.pow(c-(2+r*.6),2)/0.8)));
  const G=cellGrid(S,200,280,8,8,56,(r,c)=>heat(F[r][c]));show(G.box,cue(sid,'feature'),.5);
  const gl=lab(S,'feature map: as large as the image',424,770,C.dim,30);show(gl,cue(sid,'large'),.4);
  const ring=el(S,'hl','',{left:(200+4*56-5)+'px',top:(280+3*56-5)+'px',width:'60px',height:'60px',borderColor:C.pink});fadeIn(ring,cue(sid,'pixel'),.3);
  const rl=lab(S,'exactly this pixel',900,460,C.pink,32);show(rl,cue(sid,'pixel'),.4);
  const pr=lab(S,'more precision than we need',900,520,C.dim,30);show(pr,cue(sid,'precision'),.4);
  const blob=el(S,'abs','',{left:(200+2*56)+'px',top:(280+1*56)+'px',width:'280px',height:'280px',borderRadius:'50%',border:'3px dashed '+C.teal,background:'rgba(92,208,179,.08)',opacity:0,visibility:'hidden'});fadeIn(blob,cue(sid,'somewhere'),.4);
  tl.to(ring,{autoAlpha:0,duration:.3},cue(sid,'somewhere'));
  const sl=lab(S,'an edge somewhere around here',900,600,C.teal,32);show(sl,cue(sid,'around'),.4);
  const a=arrowR(svg,1130,504,1250,C.dim);showArrowR(a,cue(sid,'pooling'));
  const P=[0,1,2,3].map(i=>[0,1,2,3].map(j=>Math.max(F[2*i][2*j],F[2*i][2*j+1],F[2*i+1][2*j],F[2*i+1][2*j+1])));
  const PG=cellGrid(S,1290,392,4,4,56,(r,c)=>heat(P[r][c]));show(PG.box,cue(sid,'pooling'),.5);
  const pl=lab(S,'a more compact summary',1402,660,C.yellow,32);show(pl,cue(sid,'compact'),.4);
  sceneInOut(sid);
})();

/* ============ S2: max pooling and average pooling ============ */
(function(){const S=$('S2');const sid='s2';
  const M=[[1,3,0,2],[2,0,1,1],[4,1,0,0],[0,2,5,1]];
  const G=cellGrid(S,200,330,4,4,90,null,(r,c)=>String(M[r][c]),{fs:40});show(G.box,cue(sid,'max'),.4);
  const tt=lab(S,'max pooling',380,260,C.ink,40,false);show(tt,cue(sid,'max'),.4);
  const cols=[C.blue,C.pink,C.green,C.teal];
  const W=[[0,0],[0,2],[2,0],[2,2]].map(([r,c],k)=>el(S,'hl','',{left:(200+c*90-4)+'px',top:(330+r*90-4)+'px',width:'184px',height:'184px',borderColor:cols[k],borderWidth:'4px'}));
  tl.to(W,{autoAlpha:1,duration:.3,stagger:.2},cue(sid,'windows'));
  const mx=[[0,1],[0,3],[2,0],[3,2]];
  mx.forEach(([r,c],k)=>tl.to(G.cells[r][c],{backgroundColor:cols[k]+'55',color:'#ffffff',duration:.3},cue(sid,'largest')+k*.3));
  const PM=[[3,2],[4,5]];
  const O=cellGrid(S,860,420,2,2,90,null,(r,c)=>`<span>${PM[r][c]}</span>`,{fs:40});fadeIn(O.box,cue(sid,'largest'),.3);
  const OV=O.cells.map(row=>row.map(c=>c.firstChild));OV.flat().forEach(v=>gsap.set(v,{autoAlpha:0}));
  [[0,0],[0,1],[1,0],[1,1]].forEach(([r,c],k)=>{tl.to(OV[r][c],{autoAlpha:1,duration:.3},cue(sid,'largest')+k*.3+.2);tl.to(O.cells[r][c],{borderColor:cols[k],duration:.3},cue(sid,'largest')+k*.3+.2)});
  const ol=lab(S,'strongest signal in each window',950,640,C.dim,30);show(ol,cue(sid,'strongest'),.4);
  const st=lab(S,'stride 2: the windows do not overlap',380,760,C.ink,30);show(st,cue(sid,'overlap'),.4);
  const hv=lab(S,'4 × 4 → 2 × 2: a quarter of the numbers remain',960,880,C.yellow,34);show(hv,cue(sid,'halved'),.4);
  const AV=[['1.5','1.0'],['1.75','1.5']];
  const A=cellGrid(S,1400,420,2,2,110,null,(r,c)=>AV[r][c],{fs:34,ink:()=>C.teal});show(A.box,cue(sid,'average'),.4);
  const al=lab(S,'average pooling: the mean',1510,370,C.teal,32);show(al,cue(sid,'average'),.4);
  const en=lab(S,'often used at the very end of a network',1510,690,C.dim,28);show(en,cue(sid,'end'),.4);
  sceneInOut(sid);
})();

/* ============ S3: a little robustness ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);

  const nine=el(S,'abs mono','9',{left:'400px',top:'360px',width:'87px',height:'87px',lineHeight:'87px',textAlign:'center',fontSize:'44px',background:'#3a3420',border:'2px solid '+C.yellow,borderRadius:'6px',color:C.yellow,opacity:0,visibility:'hidden'});show(nine,at(sid,.02),.4);nine.setAttribute('data-layout-allow-overlap','');[0,1].forEach(r=>[0,1].forEach(c=>G.cells[r][c].setAttribute('data-layout-allow-overlap','')));

/* ============ S4: the receptive field grows ============ */
(function(){const S=$('S4');const sid='s4';
  const n=16,cs=34,x0=240,y0=240;const B=lineGrid(S,x0,y0,n,cs,'radial-gradient(circle at 50% 45%,#1d2a36 0%,#11161e 70%)');fadeIn(B,at(sid,0),.4);
  const il=lab(S,'the original image',x0+n*cs/2,y0+n*cs+40,C.dim,30);fadeIn(il,at(sid,0),.4);
  const sq=(start,size,color)=>el(S,'abs','',{left:(x0+start*cs)+'px',top:(y0+start*cs)+'px',width:(size*cs)+'px',height:(size*cs)+'px',border:'4px solid '+color,borderRadius:'6px',background:color+'22',opacity:0,visibility:'hidden'});
  const steps=[[7,3,C.blue,'first conv: a 3 × 3 patch of pixels','patch'],[6,4,C.teal,'after 2 × 2 pooling: each value covers 4 × 4','larger'],[4,8,C.yellow,'next 3 × 3 conv: an 8 × 8 patch','wider'],[0,16,C.pink,'near the top: most of the image','top']];
  steps.forEach(([s0,sz,c,t,w],i)=>{const b=sq(s0,sz,c);fadeIn(b,cue(sid,w),.4);const l=lab(S,t,1380,330+i*90,c,32);show(l,cue(sid,w),.4)});
  const rf=lab(S,'the receptive field grows with every layer',1380,760,C.ink,36,false);show(rf,cue(sid,'receptive'),.4);
  sceneInOut(sid);
})();

(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const tt=lab(S,'a hierarchy of features',960,170,C.ink,46,false);show(tt,cue(sid,'hierarchy'),.4);
  const vs=lab(S,'what visualisations of trained networks show',960,230,C.dim,30);show(vs,cue(sid,'visualised'),.4);
  const tile=(x,y)=>el(S,'abs','',{left:(x-60)+'px',top:(y-60)+'px',width:'120px',height:'120px',borderRadius:'10px',border:'2px solid #2a3442',background:'#11161e',overflow:'hidden',opacity:0,visibility:'hidden'});
  const col=[420,960,1500];
  const E=[];[[0,'#58c4dd'],[45,'#e8edf3'],[90,'#f5cf4a'],[135,'#83c167']].forEach(([a,c],i)=>{const x=col[0]+(i%2?70:-70),y=420+(i>1?150:0);const t=tile(x,y);
    const ca=Math.cos(a*Math.PI/180)*46,sa=Math.sin(a*Math.PI/180)*46;t.innerHTML=`<svg viewBox="0 0 120 120" width="120" height="120"><line x1="${60-ca}" y1="${60-sa}" x2="${60+ca}" y2="${60+sa}" stroke="${c}" stroke-width="8" stroke-linecap="round"/></svg>`;E.push(t)});

  const dog=tile(col[2]+70,480);dog.innerHTML='<svg viewBox="0 0 120 120" width="120" height="120"><polygon points="26,30 44,52 22,62" fill="#f39c4a"/><polygon points="94,30 76,52 98,62" fill="#f39c4a"/><circle cx="60" cy="66" r="34" fill="#f39c4a"/><circle cx="48" cy="60" r="5" fill="#0e1116"/><circle cx="72" cy="60" r="5" fill="#0e1116"/><ellipse cx="60" cy="78" rx="8" ry="6" fill="#0e1116"/></svg>';
  const car=tile(col[2],680);car.innerHTML='<svg viewBox="0 0 120 120" width="120" height="120"><rect x="16" y="56" width="88" height="26" rx="8" fill="#58c4dd"/><path d="M34 56 L46 38 L78 38 L90 56 Z" fill="#58c4dd"/><circle cx="38" cy="84" r="11" fill="#e8edf3"/><circle cx="84" cy="84" r="11" fill="#e8edf3"/></svg>';
  fadeIn(wheel,cue(sid,'wheels'),.4);fadeIn(dog,cue(sid,'faces'),.4);fadeIn(car,cue(sid,'objects'),.4);
  const L1=lab(S,'early: edges, colour blobs',col[0],880,C.blue,30),L2=lab(S,'middle: textures, simple shapes',col[1],880,C.yellow,30),L3=lab(S,'deep: parts, whole objects',col[2],880,C.pink,30);
  show(L1,cue(sid,'edges'),.4);show(L2,cue(sid,'textures'),.4);show(L3,cue(sid,'parts'),.4);

/* ============ S6: modern networks, and language models ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const ns=lab(S,'pooling is not sacred',520,180,C.ink,40,false);show(ns,cue(sid,'sacred'),.4);
  const G=cellGrid(S,200,300,4,4,60,null,null);show(G.box,cue(sid,'convolutions'),.4);
  const w=el(S,'hl','',{left:'195px',top:'295px',width:'130px',height:'130px',borderColor:C.teal,borderWidth:'4px'});fadeIn(w,cue(sid,'stride'),.3);
  [[120,0],[0,120],[120,120]].forEach(([x,y],i)=>tl.to(w,{x,y,duration:.35},cue(sid,'stride')+.5+i*.6));
