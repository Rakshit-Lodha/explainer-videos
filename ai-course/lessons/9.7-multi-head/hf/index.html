function matrix(parent,cx,cy,R,K,o){o=o||{};const cw=o.cw||52,ch=o.ch||cw,W=K*cw,H=R*ch;
  const box=el(parent,'mat'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  const cells=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<K;c++){
    const v=o.vals?o.vals[r][c]:'';const bg=o.heat?heat(o.vals?o.heat[r][c]*(o.hk||.4):o.heat[r][c],o.color):(o.fill||hexA(o.color||C.blue,.12));
    row.push(el(box,'mc',v,{left:c*cw+'px',top:r*ch+'px',width:cw+'px',height:ch+'px',lineHeight:ch+'px',fontSize:(o.fs||Math.round(Math.min(cw,ch)*.4))+'px',background:bg,borderColor:o.line||'rgba(201,211,224,0.28)'}))}cells.push(row)}
  return {box,cells,cx,cy,W,H,cw,ch,x0:cx-W/2,y0:cy-H/2,R,K}}
/* highlight box around a block of matrix cells */
function matHL(parent,m,r0,c0,r1,c1,color){return el(parent,'hl','',{left:(m.x0+c0*m.cw-5)+'px',top:(m.y0+r0*m.ch-5)+'px',width:((c1-c0+1)*m.cw+10)+'px',height:((r1-r0+1)*m.ch+10)+'px',borderColor:color,boxShadow:`0 0 20px ${color}66`})}
/* quadratic curve with optional arrow head, drawn on with a dash offset */
function curve(svg,x0,y0,x1,y1,o){o=o||{};const b=o.bend==null?-60:o.bend,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;
  const qx=(x0+x1)/2-dy/L*b,qy=(y0+y1)/2+dx/L*b;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const p=svgEl('path',{d:`M${x0},${y0} Q${qx},${qy} ${x1},${y1}`,fill:'none',stroke:o.color||C.blue,'stroke-width':o.w||4,'stroke-linecap':'round','stroke-opacity':o.op==null?1:o.op},g);
  const len=Math.max(1,p.getTotalLength());p.setAttribute('stroke-dasharray',len);p.setAttribute('stroke-dashoffset',len);
  let head=null;if(o.head!==false){const tx=x1-qx,ty=y1-qy,tL=Math.hypot(tx,ty)||1,ux=tx/tL,uy=ty/tL,hl=o.hl||18,hw=hl*.55,bx=x1-ux*hl,by=y1-uy*hl;
    head=svgEl('polygon',{points:`${x1},${y1} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`,fill:o.color||C.blue,'fill-opacity':o.op==null?1:o.op,opacity:0},g)}
  return {g,p,len,head}}
function drawCurve(c,time,d){tl.to(c.g,{autoAlpha:1,duration:.15},time);tl.to(c.p,{attr:{'stroke-dashoffset':0},duration:d||.8,ease:'power2.out'},time);if(c.head)tl.to(c.head,{opacity:1,duration:.2},time+(d||.8)*.8)}
/* vertical bars (values 0..1) with a baseline at yBase; setBars tweens to new values */
function bars(parent,x0,yBase,vals,o){o=o||{};const bw=o.bw||60,gap=o.gap||22,Hm=o.h||300;
  const B={bw,gap,Hm,v:vals.slice(),items:[]};
  vals.forEach((v,i)=>{const x=o.xs?o.xs[i]-bw/2:x0+i*(bw+gap);
    const b=el(parent,'bar hid','',{left:x+'px',top:(yBase-Hm)+'px',width:bw+'px',height:Hm+'px',background:(o.colors?o.colors[i]:o.color)||C.blue,transformOrigin:'50% 100%'});
    gsap.set(b,{scaleY:Math.max(.002,v)});
    let t=null;if(o.values!==false){t=el(parent,'lbl mono',fmt(v,2),{color:C.ink,fontSize:(o.vfs||24)+'px'});place(t,x+bw/2,yBase-18);gsap.set(t,{y:-Hm*v})}
    let lb=null;if(o.labels){lb=el(parent,'lbl mono',o.labels[i],{color:o.lcol||C.ink,fontSize:(o.lfs||30)+'px'});place(lb,x+bw/2,yBase+30)}
    B.items.push({b,t,lb})});
  return B}
/* centres for a row of token boxes of varying width, centred on cx */
function rowX(words,fs,gap,cx){const w=words.map(s=>s.length*fs*.6+36);const tot=w.reduce((a,b)=>a+b,0)+gap*(words.length-1);let x=(cx||960)-tot/2;return w.map(v=>{const c=x+v/2;x+=v+gap;return c})}
function barEls(B){const a=[];B.items.forEach(it=>{a.push(it.b);if(it.t)a.push(it.t);if(it.lb)a.push(it.lb)});return a}
function setBars(B,time,d,vals){const from=B.v.slice(),p={k:0};
  tl.to(p,{k:1,duration:d,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{B.items.forEach((it,i)=>{const v=from[i]+(vals[i]-from[i])*p.k;
    gsap.set(it.b,{scaleY:Math.max(.002,v)});if(it.t){gsap.set(it.t,{y:-B.Hm*v});it.t.textContent=fmt(v,2)}})}},time);B.v=vals.slice()}
function softmaxJS(xs,T){T=T||1;const m=Math.max(...xs);const e=xs.map(x=>Math.exp((x-m)/T));const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
/* type out the characters of an element's text, one span per character */
function typeIn(d,time,per){const s=d.textContent;d.innerHTML=s.split('').map(ch=>`<span class="ch" style="opacity:0;visibility:hidden">${ch===' '?'&nbsp;':ch}</span>`).join('');
  tl.to(d.querySelectorAll('.ch'),{autoAlpha:1,duration:.04,stagger:per||.05,ease:'none'},time)}
function nextCap(S,html,time){const n=el(S,'cap',html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(n,time,.7);return n}

const HC=[C.yellow,C.teal,C.pink];
const W=['the','cat','quietly','sat','on','the','mat'];const XS=rowX(W,44,40);const SAT=3;
const rnd=seedRand(77);const rmat=(r,c)=>[...Array(r)].map(()=>[...Array(c)].map(()=>rnd()));
function causalHeat(n,f){return [...Array(n)].map((_,r)=>[...Array(n)].map((_,c)=>c>r?0:f(r,c)))}

/* ============ S1: one head, one relationship; a panel of specialists ============ */
(function(){const S=$('S1');const sid='s1';
  const ch=W.map((w,i)=>tok(S,w,XS[i],420,{fs:44,color:i===SAT?C.ink:C.ink,border:i===SAT?C.ink:'#3a4452'}));show(ch,at(sid,.01),.4,{stagger:.05});
  const one=label(S,'one head: one set of weights per token',960,180,{fs:38,italic:true,color:C.dim});show(one,cue(sid,'single'),.5);fadeOut(one,cue(sid,'language')-.2,.3);
  const svg=layerSvg(S);
  const rel=[[1,'who sat?',0,'who'],[2,'the word before',1,'before'],[6,'where?',2,'where']];
  rel.forEach(([j,txt,k,w])=>{const up=k!==2;const c=curve(svg,XS[SAT],up?375:465,XS[j],up?375:465,{color:HC[k],bend:(j<SAT?1:-1)*(up?1:-1)*(70+k*50),w:5});drawCurve(c,cue(sid,w),.8);
    const l=label(S,txt,(XS[SAT]+XS[j])/2,up?(k===0?190:250):640,{fs:34,italic:true,color:HC[k]});show(l,cue(sid,w)+.3,.4)});
  const panel=[0,1,2].map(k=>tok(S,'head '+(k+1),660+k*300,800,{fs:34,color:HC[k],border:HC[k]}));
  show(panel,cue(sid,'panel'),.4,{stagger:.15});
  const notes=tok(S,'pooled notes',960,920,{fs:34,color:C.ink,border:C.ink});
  const svg2=layerSvg(S);const ar=[0,1,2].map(k=>{const a=mkArrow(svg2,PX,HC[k],3);setArrow(a,{x0:660+k*300,y0:848,x1:660+k*300,y1:848});return a});
  ar.forEach(a=>grow(a,cue(sid,'pool'),.5,960,890));show(notes,cue(sid,'notes'),.4);
  sceneInOut(sid);
})();

/* ============ S2: several narrow heads, each with its own W_Q, W_K, W_V ============ */
(function(){const S=$('S2');const sid='s2';
  const T=7,d=12,h=3,dh=4,c=34;
  const wide=matrix(S,560,330,T,d,{cw:c,ch:c,heat:rmat(T,d),color:C.blue});
  const wl=label(S,'one wide head: Q is (T × d)',560,170,{fs:32,italic:true,color:C.blue});
  show([wide.box,wl],cue(sid,'wide'),.5);
  // colour the column blocks per head
  for(let k=0;k<h;k++){const cells=[];for(let r=0;r<T;r++)for(let cc=k*dh;cc<(k+1)*dh;cc++)cells.push(wide.cells[r][cc]);
    tl.to(cells,{backgroundColor:(i)=>heat(.25+.6*((i*7)%5)/5,HC[k]),duration:.5},cue(sid,'several')+k*.2)}
  const hl=[0,1,2].map(k=>{const b=matHL(S,wide,0,k*dh,T-1,(k+1)*dh-1,HC[k]);fadeIn(b,cue(sid,'several')+k*.2,.4);return b});
  const hn=[0,1,2].map(k=>label(S,'head '+(k+1),wide.x0+(k*dh+dh/2)*c,wide.y0+T*c+40,{fs:28,mono:true,color:HC[k]}));show(hn,cue(sid,'heads'),.4,{stagger:.1});
  const own=label(S,'each head has its own W_Q, W_K, W_V',560,640,{fs:32,italic:true,color:C.ink});show(own,cue(sid,'query'),.4);
  const f=el(S,'abs hid',tex('d_{\\text{head}}=\\dfrac{d}{h}',60),{left:'1240px',top:'190px'});show(f,cue(sid,'divided'),.6);
  const ex=label(S,'here: d = 12, h = 3, so each head is 4 wide',1460,370,{fs:30,italic:true,color:C.dim});show(ex,cue(sid,'divided')+.5,.4);
  const maps=[0,1,2].map(k=>{const m=matrix(S,1160+k*260,620,T,T,{cw:30,ch:30,heat:causalHeat(T,(r,cc)=>[cc===1?.9:.08,cc===r-1||(r===0)?.9:.05,cc===Math.min(r,6)&&r>4?.9:(cc===r?.6:.08)][k]),color:HC[k]});return m.box});
  show(maps,cue(sid,'scaled'),.5,{stagger:.15});
  const ind=label(S,'each computes its own scaled, masked attention, independently',1420,800,{fs:30,italic:true,color:C.ink});show(ind,cue(sid,'independently'),.5);
  sceneInOut(sid);
})();

/* ============ S3: concatenate, then the output projection ============ */
(function(){const S=$('S3');const sid='s3';
  const T=7,dh=4,c=34;
  const outs=[0,1,2].map(k=>{const m=matrix(S,330+k*240,420,T,dh,{cw:c,ch:c,heat:rmat(T,dh),color:HC[k]});m.box.setAttribute('data-layout-allow-overlap','');return m});
  const ol=outs.map((m,k)=>label(S,'head '+(k+1),330+k*240,260,{fs:28,mono:true,color:HC[k]}));
  show([...outs.map(m=>m.box),...ol],at(sid,.02),.5,{stagger:.1});
  const nar=label(S,'one narrow vector per token from each head',570,700,{fs:30,italic:true,color:C.dim});show(nar,cue(sid,'narrow'),.4);
  // slide together into one T x 12 block
  const cx=570,x0=cx-1.5*dh*c;
  outs.forEach((m,k)=>tl.to(m.box,{x:(x0+k*dh*c+dh*c/2)-(330+k*240),duration:1,ease:'power2.inOut'},cue(sid,'place')+.2));
  tl.to(ol,{autoAlpha:0,duration:.3},cue(sid,'place'));
  const cl=label(S,'concatenated: (T × d) again',cx,260,{fs:30,mono:true,color:C.ink});show(cl,cue(sid,'restores'),.4);
  tl.to(nar,{autoAlpha:0,duration:.3},cue(sid,'place'));
  const x=sym(S,'×',870,420,56);show(x,cue(sid,'multiply'),.4);
  const Wo=matrix(S,1120,420,12,12,{cw:26,ch:26,heat:rmat(12,12),color:C.blue});const wol=label(S,tex('W_O',40),1120,215,{color:C.blue});
  show([Wo.box,wol],cue(sid,'matrix'),.5);
  const eq=sym(S,'=',1350,420,56);show(eq,cue(sid,'output'),.4);
  const O=matrix(S,1580,420,T,12,{cw:c*.7,ch:c,heat:rmat(T,12),color:C.pink});const Ol=label(S,'output (T × d)',1580,260,{fs:30,mono:true,color:C.pink});
  show([O.box,Ol],cue(sid,'projection'),.5);
  const mix=el(S,'cap','the output projection mixes what the heads found into one update per token',{top:'800px',fontSize:'40px',fontStyle:'italic'});show(mix,cue(sid,'combined'),.6);
  sceneInOut(sid);
})();

/* ============ S4: same cost; reshape so heads come first ============ */
(function(){const S=$('S4');const sid='s4';
  const T=7,d=12,h=3,dh=4,c=32;
  const cost=el(S,'abs hid',tex('h\\times\\dfrac{d}{h}=d\\quad\\Rightarrow\\quad\\text{about the cost of one wide head}',46),{left:'360px',top:'140px'});show(cost,cue(sid,'cost'),.6);
  const Q=matrix(S,420,560,T,d,{cw:c,ch:c,heat:rmat(T,d),color:C.blue});const ql=label(S,'Q = X W_Q &nbsp;(T × d)',420,400,{fs:30,mono:true,color:C.blue});
  show([Q.box,ql],cue(sid,'single'),.5);
  const svg=layerSvg(S);
  const cuts=[1,2].map(k=>svgEl('line',{x1:Q.x0+k*dh*c,y1:Q.y0-10,x2:Q.x0+k*dh*c,y2:Q.y0+T*c+10,stroke:C.ink,'stroke-width':4,'stroke-dasharray':'8 6',style:'opacity:0;visibility:hidden'},svg));
  fadeIn(cuts,cue(sid,'cut'),.4);
  const sl=label(S,'each row cut into h slices: (T, h, d_head)',420,720,{fs:28,italic:true,color:C.ink});show(sl,cue(sid,'slices'),.4);
  // heads first: a stack of h blocks (h, T, d_head)
  const blocks=[0,1,2].map(k=>{const m=matrix(S,1000+k*34,520+k*34,T,dh,{cw:c,ch:c,heat:rmat(T,dh),color:HC[k]});m.box.setAttribute('data-layout-allow-overlap','');m.cells.flat().forEach(e=>e.setAttribute('data-layout-allow-overlap',''));return m.box}).reverse();
  show(blocks,cue(sid,'swap'),.5,{stagger:.15});
  const bl=label(S,'heads first: (h, T, d_head)',1034,370,{fs:28,mono:true,color:C.ink});show(bl,cue(sid,'first'),.4);
  const sc=[0,1,2].map(k=>{const m=matrix(S,1480+k*34,520+k*34,T,T,{cw:c,ch:c,heat:causalHeat(T,(r,cc)=>.2+.6*((r*3+cc+k)%4)/4),color:HC[k]});m.box.setAttribute('data-layout-allow-overlap','');m.cells.flat().forEach(e=>e.setAttribute('data-layout-allow-overlap',''));return m.box}).reverse();
  show(sc,cue(sid,'batched'),.5,{stagger:.15});
  const scl=label(S,'every score table at once: (h, T, T)',1530,290,{fs:28,mono:true,color:C.ink});show(scl,cue(sid,'computes'),.4);
  sceneInOut(sid);
})();

/* ============ S5: the shape walk ============ */
(function(){const S=$('S5');const sid='s5';
  const L=[['X','(T, d)','(6, 12)','x'],['Q = X W_Q','(T, d)','(6, 12)','q'],['reshape','(T, h, d_head)','(6, 3, 4)','reshaping'],['transpose','(h, T, d_head)','(3, 6, 4)','swapping'],
    ['scores Q Kᵀ','(h, T, T)','(3, 6, 6)','scores'],['A V','(h, T, d_head)','(3, 6, 4)','outputs'],['transpose back','(T, h, d_head)','(6, 3, 4)','swap'],['merge, then W_O','(T, d)','(6, 12)','merge']];
  const cols=[C.ink,C.blue,C.blue,C.yellow,C.teal,C.green,C.yellow,C.pink];
  L.forEach(([a,b,n,w],i)=>{const y=170+i*96;
    const l1=el(S,'abs mono hid',a,{left:'260px',top:(y-24)+'px',fontSize:'38px',color:cols[i]});
    const l2=el(S,'abs mono hid',b,{left:'840px',top:(y-24)+'px',fontSize:'38px',color:C.ink});
    const l3=el(S,'abs mono hid',n,{left:'1360px',top:(y-24)+'px',fontSize:'38px',color:C.dim});
    show([l1,l2,l3],cue(sid,w),.4)});
  const key=label(S,'T = 6, d = 12, h = 3, d_head = 4',1520,960,{fs:30,italic:true,color:C.dim});show(key,cue(sid,'shapes'),.4);
  sceneInOut(sid);
})();

/* ============ S6: heads specialise; but none knows position ============ */
(function(){const S=$('S6');const sid='s6';
  const g=el(S,'abs hid','',{left:'200px',top:'200px',width:'640px',height:'640px'});
  const r=seedRand(5);
  for(let L=0;L<12;L++)for(let H=0;H<12;H++){const t=Math.floor(r()*4);const box=el(g,'abs','',{left:(H*53)+'px',top:(L*53)+'px',width:'46px',height:'46px',border:'1px solid #2a3340'});
    for(let a=0;a<4;a++)for(let b=0;b<=a;b++){const on=t===0?b===a:t===1?b===a-1||(a===0):t===2?b===0:((a+b)%3===0);if(on)el(box,'abs','',{left:(b*11+1)+'px',top:(a*11+1)+'px',width:'10px',height:'10px',background:[C.yellow,C.teal,C.pink,C.blue][t]})}}
  show(g,cue(sid,'specialise'),.6);
  const gl=label(S,'GPT-2 small: 12 layers × 12 heads (sketch)',520,880,{fs:30,italic:true,color:C.ink});show(gl,cue(sid,'twelve'),.4);
  const k1=label(S,'previous token',1150,260,{fs:32,italic:true,color:C.teal}),k2=label(S,'grammatical links',1150,320,{fs:32,italic:true,color:C.yellow}),k3=label(S,'nearly redundant',1150,380,{fs:32,italic:true,color:C.dim});
  show(k1,cue(sid,'previous'),.4);show(k2,cue(sid,'grammatically'),.4);show(k3,cue(sid,'redundant'),.4);
  // a set, not a sequence
  const ws=['the','cat','sat'],xa=[1200,1380,1560],xb=[1560,1200,1380];
  const chs=ws.map((w,i)=>tok(S,w,xa[i],600,{fs:40,color:C.ink,border:'#3a4452'}));show(chs,cue(sid,'none'),.4);
  chs.forEach((c,i)=>tl.to(c,{x:xb[i]-xa[i],duration:1,ease:'power2.inOut'},cue(sid,'set')));
  const st=label(S,'shuffled: attention sees the same set',1380,700,{fs:30,italic:true,color:C.red});show(st,cue(sid,'set'),.4);
  nextCap(S,'next &nbsp;·&nbsp; 9.8 &nbsp;Positional encoding',cue(sid,'next'));
  lastScene(sid);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
