.colv{position:absolute}

.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
.ttl{position:absolute;font-size:46px;opacity:0;visibility:hidden;white-space:nowrap}

  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ===================== scenes ===================== */
const H2=ps=>ps.reduce((s,p)=>s+(p>0?-p*Math.log2(p):0),0);
/* ============ S1: surprise is a feeling we can measure ============ */
(function(){const S=$('S1');const sid='s1';
  const c1=el(S,'abs','',{left:'200px',top:'260px',width:'680px',height:'360px',border:'3px solid #2a6f97',borderRadius:'24px',opacity:0,visibility:'hidden'});
  const c2=el(S,'abs','',{left:'1040px',top:'260px',width:'680px',height:'360px',border:'3px solid #fc6255',borderRadius:'24px',opacity:0,visibility:'hidden'});
  el(c1,'abs','the sun rises tomorrow',{left:'40px',top:'40px',fontSize:'48px'});el(c1,'abs mono','p ≈ 1',{left:'40px',top:'130px',fontSize:'40px',color:C.blue});
  el(c1,'abs','you learn almost nothing',{left:'40px',top:'240px',fontSize:'40px',fontStyle:'italic',color:C.dim});
  el(c2,'abs','snow in a desert',{left:'40px',top:'40px',fontSize:'48px'});el(c2,'abs mono','p tiny',{left:'40px',top:'130px',fontSize:'40px',color:C.red});
  el(c2,'abs','you learn a great deal',{left:'40px',top:'240px',fontSize:'40px',fontStyle:'italic',color:C.ink});
  show(c1,cue(sid,'sun'),.6);show(c2,cue(sid,'snows'),.6);
  const it=el(S,'chip','information theory: surprise as a number',{left:'560px',top:'720px',borderColor:C.teal,color:C.teal});show(it,cue(sid,'number'),.6);
  const lf=note(S,'the foundation of the loss that trains language models',360,840,1200,{fontSize:'38px',color:C.dim,textAlign:'center'});show(lf,cue(sid,'foundation'),.5);
  sceneInOut(sid);
})();

/* ============ S2: surprise = log(1/p) ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const A=axes(svg,{x:200,y:230,w:900,h:600,xmin:0,xmax:1,ymin:0,ymax:5,xticks:[.25,.5,.75,1],yticks:[1,2,3,4]});
  A.g.setAttribute('style','opacity:0;visibility:hidden');
  const tk=[.25,.5,.75,1].map(v=>lbl(S,`<span class="mono">${v}</span>`,A.X(v),A.Y(0)+38,{fontSize:'30px',color:C.dim})).concat([1,2,3,4].map(v=>lbl(S,`<span class="mono">${v}</span>`,A.X(0)-36,A.Y(v),{fontSize:'30px',color:C.dim})));
  const xl=lbl(S,'probability p',A.X(.5),A.Y(0)+90,{fontSize:'34px',fontStyle:'italic',color:C.dim});
  fadeIn([A.g,xl].concat(tk),cue(sid,'surprise'),.5);
  const s=p=>Math.log2(1/p);
  const cv=svgEl('path',{d:fpath(A,s,1/32,1,200),fill:'none',stroke:C.yellow,'stroke-width':6,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(cv,cue(sid,'logarithm'),.7);
  const f=lbl(S,tex('\\text{surprise}(p)=\\log\\frac{1}{p}',60),1500,280,{color:C.yellow});show(f,cue(sid,'logarithm'),.6);
  const dot=svgEl('circle',{r:13,fill:C.pink},svg);const dl=el(S,'lbl','',{fontSize:'36px',color:C.pink});dl.setAttribute('data-layout-allow-overlap','');
  const render=o=>{dot.setAttribute('cx',A.X(o.p));dot.setAttribute('cy',A.Y(s(o.p)));gsap.set(dl,{x:A.X(o.p)+40,y:A.Y(s(o.p))-40,xPercent:0,yPercent:-50});dl.textContent=`p = ${o.p.toFixed(2)}, surprise ${s(o.p).toFixed(2)}`};
  const st=state({p:1},render);gsap.set([dot,dl],{autoAlpha:0});
  fadeIn([dot,dl],cue(sid,'certain'),.4);
  drive(st,cue(sid,'rarer'),2,{p:.08},render);
  const c=note(S,'certain: no surprise at all',1180,400,640,{fontSize:'38px',color:C.dim});show(c,cue(sid,'certain'),.5);
  const e1=lbl(S,tex('p_1\\,p_2\\;\\longrightarrow\\;\\log\\frac{1}{p_1p_2}=\\log\\frac{1}{p_1}+\\log\\frac{1}{p_2}',46),1480,640,{});show(e1,cue(sid,'multiply'),.7);
  const ind=note(S,'two independent events: surprises add',1180,740,640,{fontSize:'38px',color:C.ink});show(ind,cue(sid,'add'),.5);
  sceneInOut(sid);
})();

/* ============ S3: bits ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const f=lbl(S,tex('\\log_2\\frac{1}{p}\\;\\text{bits}',58),960,200,{});show(f,cue(sid,'bits'),.6);
  // binary tree with 3 levels: each split is one fair yes/no question
  const root=[960,330];const lv=[[960],[660,1260],[510,810,1110,1410],[435,585,735,885,1035,1185,1335,1485]];
  const lines=[],nodes=[];
  for(let L=0;L<3;L++)lv[L].forEach((x,i)=>{[0,1].forEach(b=>{const x2=lv[L+1][2*i+b];lines.push([L,svgEl('line',{x1:x,y1:330+L*170,x2:x2,y2:330+(L+1)*170,stroke:C.grid,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg),i,b])})});
  lv.forEach((xs,L)=>xs.forEach((x,i)=>nodes.push([L,svgEl('circle',{cx:x,cy:330+L*170,r:L===3?22:16,fill:L===3?'#1d2531':C.ink,stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg),i])));
  const byL=L=>lines.filter(l=>l[0]===L).map(l=>l[1]).concat(nodes.filter(n=>n[0]===L+1).map(n=>n[1]));
  fadeIn(nodes.filter(n=>n[0]===0).map(n=>n[1]),cue(sid,'coin'),.4);
  fadeIn(byL(0),cue(sid,'coin')+.3,.5);
  const one=lbl(S,'one fair coin: 1 bit',1680,420,{fontSize:'38px',color:C.ink});show(one,cue(sid,'question'),.5);
  fadeIn(byL(1),cue(sid,'eight')-.4,.5);fadeIn(byL(2),cue(sid,'eight'),.5);
  // highlight one path to one leaf of eight
  const path=[[960,330],[660,500],[810,670],[735,840]];
  const hp=svgEl('path',{d:polyPath(path),fill:'none',stroke:C.yellow,'stroke-width':8,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(hp,cue(sid,'three'),.6);
  const leaf=svgEl('circle',{cx:735,cy:840,r:24,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);fadeIn(leaf,cue(sid,'three'),.5);
  const t3=lbl(S,tex('p=\\tfrac18\\;\\Rightarrow\\;\\log_2 8=3\\;\\text{bits}',46),1690,600,{color:C.yellow});show(t3,cue(sid,'three'),.6);
  const qs=['heads or tails?','heads or tails?','heads or tails?'].map((t,i)=>lbl(S,t,330,415+i*170,{fontSize:'30px',fontStyle:'italic',color:C.dim}));
  show(qs,cue(sid,'coin',2),.4,{stagger:.25});
  sceneInOut(sid);
})();

/* ============ S4: entropy is the average surprise ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const f=lbl(S,tex('H(p)=\\sum_x p(x)\\,\\log_2\\frac{1}{p(x)}',62),960,200,{});show(f,cue(sid,'average'),.7);
  const avg=note(S,'surprise of each outcome, weighted by how often it happens',460,270,1000,{fontSize:'34px',color:C.dim,textAlign:'center'});show(avg,cue(sid,'expectation'),.5);
  // coin with P(heads)=q; bars on the left, binary entropy curve on the right
  const B0=axes(svg,{x:220,y:400,w:440,h:400,xmin:0,xmax:3,ymin:0,ymax:1,xticks:[],yaxis:false});
  const B=bars(svg,B0,[1,2],[1,0],{color:C.blue,w:.8});
  const bl=[lbl(S,'heads',B0.X(1),B0.Y(0)+40,{fontSize:'34px',fontStyle:'italic'}),lbl(S,'tails',B0.X(2),B0.Y(0)+40,{fontSize:'34px',fontStyle:'italic'})];
  const A=axes(svg,{x:860,y:400,w:900,h:400,xmin:0,xmax:1,ymin:0,ymax:1.15,xticks:[0,.5,1],yticks:[1]});
  const tk=[[0,'0'],[.5,'0.5'],[1,'1']].map(([v,t])=>lbl(S,`<span class="mono">${t}</span>`,A.X(v),A.Y(0)+38,{fontSize:'30px',color:C.dim}));
  const xl=lbl(S,'P(heads)',A.X(.5),A.Y(0)+86,{fontSize:'32px',fontStyle:'italic',color:C.dim});
  const yl=lbl(S,'1 bit',A.X(0)-60,A.Y(1),{fontSize:'30px',color:C.dim});
  const hb=q=>H2([q,1-q]);
  const cv=svgEl('path',{d:fpath(A,hb,0,1,200),fill:'none',stroke:C.yellow,'stroke-width':5,opacity:.85},svg);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);[B0.g,B.g,A.g,cv].forEach(e=>g.appendChild(e));
  fadeIn([g].concat(bl,tk,[xl,yl]),cue(sid,'uncertain')-.6,.6);
  const dot=svgEl('circle',{r:13,fill:C.pink},svg);const hv=el(S,'abs mono','',{left:'1500px',top:'330px',fontSize:'40px',color:C.pink,whiteSpace:'nowrap'});
  const render=o=>{B.set([o.q,1-o.q]);dot.setAttribute('cx',A.X(o.q));dot.setAttribute('cy',A.Y(hb(o.q)));hv.textContent=`H = ${hb(o.q).toFixed(2)} bits`};
  const st=state({q:1},render);gsap.set([dot,hv],{autoAlpha:0});
  fadeIn([dot,hv],cue(sid,'heads'),.4);
  const z=note(S,'always heads: nothing to learn',230,905,600,{fontSize:'36px',color:C.dim});show(z,cue(sid,'zero'),.5);
  drive(st,cue(sid,'fair'),2.2,{q:.5},render);
  const fc=note(S,'fair coin: the most uncertain, 1 bit',1000,935,700,{fontSize:'36px',color:C.yellow});show(fc,cue(sid,'fair')+.8,.5);
  sceneInOut(sid);
})();

/* ============ S5: more outcomes; Shannon ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const A=axes(svg,{x:220,y:300,w:1000,h:480,xmin:0,xmax:9,ymin:0,ymax:1,xticks:[],yaxis:false});
  A.g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(A.g,at(sid,.01),.5);
  const uni=new Array(8).fill(1/8),mid=[.03,.05,.1,.42,.25,.08,.04,.03],peak=[.005,.005,.01,.96,.01,.005,.0025,.0025];
  const B=bars(svg,A,[1,2,3,4,5,6,7,8],uni,{color:C.blue,w:.75});B.g.setAttribute('style','opacity:0;visibility:hidden');
  fadeIn(B.g,at(sid,.03),.5);
  const hv=el(S,'abs mono','',{left:'1320px',top:'330px',fontSize:'52px',color:C.yellow,whiteSpace:'nowrap'});
  const render=o=>{const ps=uni.map((u,i)=>o.a*u+o.b*mid[i]+o.c*peak[i]);B.set(ps);hv.textContent=`H = ${H2(ps).toFixed(2)} bits`};
  const st=state({a:1,b:0,c:0},render);gsap.set(hv,{autoAlpha:0});fadeIn(hv,at(sid,.05),.4);
  const ev=note(S,'spread evenly: entropy is largest',1320,430,520,{fontSize:'38px',color:C.ink});show(ev,cue(sid,'evenly'),.5);
  drive(st,cue(sid,'piles'),1.6,{a:0,b:1,c:0},render);
  const e8=note(S,'a fair choice among 8: 3 bits',1320,510,520,{fontSize:'38px',color:C.dim});show(e8,cue(sid,'eight'),.5);
  drive(st,cue(sid,'eight')-.3,1.2,{a:1,b:0,c:0},render);
  drive(st,cue(sid,'concentrated'),1.6,{a:0,b:0,c:1},render);
  const pk=note(S,'concentrated on one: almost none',1320,590,520,{fontSize:'38px',color:C.dim});show(pk,cue(sid,'concentrated'),.5);
  const sh=el(S,'chip','Shannon, 1948: entropy = fewest bits per outcome on average',{left:'260px',top:'880px',borderColor:C.teal,color:C.teal,fontSize:'36px'});show(sh,cue(sid,'shannon'),.6);
  sceneInOut(sid);
})();

/* ============ S6: entropy of a language model's prediction ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const mk=(x0,title,ps,col,tm)=>{const A=axes(svg,{x:x0,y:330,w:640,h:360,xmin:0,xmax:9,ymin:0,ymax:1,xticks:[],yaxis:false});
    const B=bars(svg,A,[1,2,3,4,5,6,7,8],ps,{color:col,w:.75});const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(B.g);
    const t=lbl(S,title,x0+320,260,{fontSize:'40px',fontStyle:'italic'});const h=lbl(S,`<span class="mono">H = ${H2(ps).toFixed(2)} bits</span>`,x0+320,750,{fontSize:'38px',color:col});
    fadeIn(g,tm,.6);show([t,h],tm,.5)};
  mk(200,'The capital of France is …',[.93,.02,.015,.01,.01,.005,.005,.005],C.blue,cue(sid,'obvious'));
  mk(1080,'(start of a new sentence) …',[.2,.17,.15,.13,.11,.1,.08,.06],C.pink,cue(sid,'fresh'));
  const lo=note(S,'obvious next word: low entropy',200,800,640,{fontSize:'34px',color:C.dim,textAlign:'center'});show(lo,cue(sid,'low'),.5);
  const hi=note(S,'many plausible next words: high entropy',1080,800,640,{fontSize:'34px',color:C.dim,textAlign:'center'});show(hi,cue(sid,'high'),.5);
  nextUp(S,'3.7 &nbsp;cross-entropy and KL divergence',cue(sid,'next'));
  sceneInOut(sid,true);
})();
