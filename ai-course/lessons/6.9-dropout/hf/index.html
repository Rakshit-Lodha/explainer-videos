function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

function miniNet(S,svg,cx,cy,sc,cols,color){const N=cols.map((n,i)=>{const a=[];for(let j=0;j<n;j++)a.push(node(S,cx+(i-(cols.length-1)/2)*170*sc,cy+(j-(n-1)/2)*95*sc,22*sc,'',color||C.blue,10));return a});
  const E=[];for(let i=0;i<N.length-1;i++)N[i].forEach(a=>N[i+1].forEach(b=>E.push({a,b,e:edge(svg,a,b,C.dim,1.5*sc)})));return {N,E}}
function curvePts(f,P,x0,x1){return fpath(f,P,x0,x1,120)}

/* ============ S1: memorising instead of learning ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const P=plane(260,820,120,90);
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(6.5,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(0,0)[0],y2:P(0,6.5)[1],stroke:C.axis,'stroke-width':3},ax);
  fadeIn(ax,cue(sid,'happens'),.4);
  const tr=x=>5.5*Math.exp(-x*.7)+.25,va=x=>5.5*Math.exp(-x*.7)+.6+.18*x*x*(x>2.2?1:0)-.0*x;
  const vfix=x=>{const base=5.5*Math.exp(-x*.7)+.6;return x>2.2?base+.22*(x-2.2)*(x-2.2):base};
  const c1=pth(svg,curvePts(tr,P,.1,6.2),C.blue,6),c2=pth(svg,curvePts(vfix,P,.1,6.2),C.yellow,6,{'stroke-dasharray':'14 10'});
  drawOn(c1,cue(sid,'falling'),1.4);drawOn(c2,cue(sid,'new'),1.4);
  const l1=el(S,'lbl','training error',{color:C.blue,fontSize:'34px',fontStyle:'italic'});place(l1,P(5.4,0)[0],P(0,.25)[1]-40);show(l1,cue(sid,'falling'),.4);
  const l2=el(S,'lbl','error on new examples',{color:C.yellow,fontSize:'34px',fontStyle:'italic'});place(l2,P(4.3,0)[0],P(0,vfix(6))[1]-70);show(l2,cue(sid,'rise'),.4);
  const xl=el(S,'lbl','training time',{color:C.dim,fontSize:'28px',fontStyle:'italic'});place(xl,P(3.2,0)[0],P(0,0)[1]+34);fadeIn(xl,cue(sid,'happens'),.4);
  // co-adapted partners
  const a=node(S,1350,420,46,'',C.pink),b=node(S,1600,420,46,'',C.pink);
  const ab=ln(svg,1396,420,1554,420,C.pink,10);
  show([a,b],cue(sid,'neurons'),.4);drawOn(ab,cue(sid,'rely'),.6);
  const pl=el(S,'abs','',{left:'1180px',top:'520px',width:'600px',textAlign:'center',fontSize:'38px',fontStyle:'italic',lineHeight:'1.35',opacity:0,visibility:'hidden'});pl.innerHTML='neurons that rely on particular partners: <span style="color:#fc6255">fragile</span>';show(pl,cue(sid,'partners'),.5);
  sceneInOut(sid);
})();

/* ============ S2: switch neurons off at random ============ */
(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);
  const net=miniNet(S,svg,700,520,1.15,[4,6,6,2],C.blue);
  const all=[].concat(...net.N);fadeIn(all,at(sid,.01),.4,.01);net.E.forEach((o,k)=>drawOn(o.e,at(sid,.02)+k*.004,.4));
  const hid=[].concat(net.N[1],net.N[2]);
  const rnd=seedRand(17);const masks=[];for(let m=0;m<5;m++){const mk=hid.map(()=>rnd()<.3);masks.push(mk)}
  const t0=cue(sid,'switched');
  masks.forEach((mk,m)=>{const t=t0+m*1.6;
    hid.forEach((n,i)=>{tl.to(n,{opacity:mk[i]?.18:1,borderColor:mk[i]?C.dim:C.blue,duration:.25},t)});
    net.E.forEach(o=>{const off=(hid.includes(o.a)&&mk[hid.indexOf(o.a)])||(hid.includes(o.b)&&mk[hid.indexOf(o.b)]);tl.to(o.e,{opacity:off?.08:1,duration:.25},t)})});
  const step=el(S,'abs mono','',{left:'1240px',top:'230px',width:'640px',fontSize:'30px',color:C.dim,opacity:0,visibility:'hidden'});step.innerHTML='a new random mask every step';show(step,cue(sid,'afresh'),.4);
  const p=el(S,'abs','',{left:'1240px',top:'320px',width:'600px',opacity:0,visibility:'hidden'});p.innerHTML=tex('p = 0.1',54)+'<span style="font-size:34px;font-style:italic;color:#7f8b99"> &nbsp;(one in ten)</span>';show(p,cue(sid,'ten'),.5);
  const who=el(S,'abs','',{left:'1240px',top:'160px',width:'600px',fontSize:'30px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});who.innerHTML='Hinton\'s group, around 2012';show(who,cue(sid,'hinton\'s'),.4);
  // team analogy
  const team=[];for(let i=0;i<8;i++){const x=1290+i*68;const h=el(S,'abs','',{left:(x-18)+'px',top:'560px',width:'36px',height:'36px',borderRadius:'50%',background:C.yellow,opacity:0,visibility:'hidden'});const bd=el(S,'abs','',{left:(x-26)+'px',top:'602px',width:'52px',height:'60px',borderRadius:'26px 26px 8px 8px',background:C.yellow,opacity:0,visibility:'hidden'});team.push([h,bd])}
  fadeIn(team.flat(),cue(sid,'team'),.4,.02);
  const absent=[[1,5],[3],[0,6],[4,7]];absent.forEach((ids,k)=>{const t=cue(sid,'absent')+k*1.1;team.forEach((pp,i)=>tl.to(pp,{opacity:ids.includes(i)?.12:1,duration:.25},t))});
  const tl2=el(S,'abs','',{left:'1240px',top:'700px',width:'620px',fontSize:'36px',fontStyle:'italic',lineHeight:'1.35',opacity:0,visibility:'hidden'});tl2.innerHTML='nobody can depend on one person, so knowledge is spread around';show(tl2,cue(sid,'nobody'),.5);
  sceneInOut(sid);
})();

/* ============ S3: inverted dropout bookkeeping ============ */
(function(){const S=$('S3');const sid='s3';
  const n=10,x0=420,dx=110,base=620,H=260;
  const B=[];for(let i=0;i<n;i++){B.push(el(S,'abs','',{left:(x0+i*dx-35)+'px',top:(base-H)+'px',width:'70px',height:H+'px',background:C.blue,borderRadius:'6px 6px 0 0',transformOrigin:'50% 100%',opacity:0,visibility:'hidden'}))}
  B.forEach(b=>gsap.set(b,{scaleY:1/1.111*0.9}));
  fadeIn(B,cue(sid,'outputs'),.3,.03);
  const tot=el(S,'abs mono','',{left:'1560px',top:'440px',width:'320px',fontSize:'44px',opacity:0,visibility:'hidden'});
  const t1=el(S,'abs mono','total 10',{left:'1560px',top:'440px',width:'320px',fontSize:'44px',color:C.ink,opacity:0,visibility:'hidden'});
  const t2=el(S,'abs mono','total 9',{left:'1560px',top:'440px',width:'320px',fontSize:'44px',color:C.red,opacity:0,visibility:'hidden'});
  const t3=el(S,'abs mono','total 10',{left:'1560px',top:'440px',width:'320px',fontSize:'44px',color:C.green,opacity:0,visibility:'hidden'});
  const vals=[];for(let i=0;i<n;i++){const v=el(S,'lbl','<span class="mono" style="font-size:28px">1.0</span>',{color:C.ink});place(v,x0+i*dx,base+34);vals.push(v)}
  fadeIn([...vals,t1],cue(sid,'outputs'),.4);
  tl.to(B[6],{scaleY:.004,backgroundColor:C.dim,duration:.5},cue(sid,'zeroed'));
  const z=el(S,'lbl','<span class="mono" style="font-size:28px">0</span>',{color:C.red});place(z,x0+6*dx,base+34);
  tl.to(vals[6],{autoAlpha:0,duration:.2},cue(sid,'zeroed'));show(z,cue(sid,'zeroed'),.3);
  fadeOut(t1,cue(sid,'smaller'),.2);show(t2,cue(sid,'smaller'),.3);
  // divide survivors by 0.9
  const surv=B.filter((b,i)=>i!==6);
  tl.to(surv,{scaleY:.9,duration:.8,ease:'power2.inOut'},cue(sid,'divides'));
  const nv=[];vals.forEach((v,i)=>{if(i===6)return;const w=el(S,'lbl','<span class="mono" style="font-size:28px">1.11</span>',{color:C.green});place(w,x0+i*dx,base+34);nv.push(w);tl.to(v,{autoAlpha:0,duration:.2},cue(sid,'divides'))});
  show(nv,cue(sid,'divides')+.2,.3);
  fadeOut(t2,cue(sid,'expected'),.2);show(t3,cue(sid,'expected'),.3);
  const f=el(S,'cap',tex('\\text{survivor} \\times \\frac{1}{1-p} = \\frac{1}{0.9}\\approx 1.11',52),{top:'150px'});show(f,cue(sid,'survival'),.6);
  const tt=el(S,'cap','test time: dropout off, everyone present, no rescaling',{top:'800px',fontSize:'42px',fontStyle:'italic',color:C.teal});show(tt,cue(sid,'test'),.5);
  // test time: every neuron back at its plain value, no rescaling
  const T=cue(sid,'every');
  tl.to(B,{scaleY:1/1.111*0.9,backgroundColor:C.blue,duration:.6,ease:'power2.inOut'},T);
  tl.to([...nv,z],{autoAlpha:0,duration:.2},T);tl.to(vals,{autoAlpha:1,duration:.3},T+.2);
  sceneInOut(sid);
})();

/* ============ S4: an ensemble of thinned networks ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const rnd=seedRand(44);const minis=[];
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){const m=miniNet(S,svg,230+c*300,280+r*250,.45,[3,4,4,1],C.blue);
    [].concat(m.N[1],m.N[2]).forEach(n=>{if(rnd()<.35){n.style.borderColor=C.dim;n.dataset.off='1'}});
    m.E.forEach(o=>{if(o.a.dataset.off||o.b.dataset.off)o.e.setAttribute('stroke-opacity','.12')});minis.push(m)}
  minis.forEach((m,k)=>{fadeIn([].concat(...m.N),cue(sid,'thinned')+k*.12,.3);m.E.forEach(o=>drawOn(o.e,cue(sid,'thinned')+k*.12,.3))});
  const many=el(S,'abs','',{left:'1340px',top:'230px',width:'540px',fontSize:'38px',fontStyle:'italic',lineHeight:'1.35',opacity:0,visibility:'hidden'});many.innerHTML='astronomically many thinned networks, <span style="color:#5cd0b3">sharing the same weights</span>';show(many,cue(sid,'astronomically'),.5);
  const arrow=pth(svg,'M1300 640 L1460 640',C.yellow,5);drawOn(arrow,cue(sid,'averaging'),.5);
  const full=miniNet(S,svg,1660,640,.6,[3,4,4,1],C.yellow);fadeIn([].concat(...full.N),cue(sid,'full'),.4);full.E.forEach(o=>drawOn(o.e,cue(sid,'full'),.4));
  const av=el(S,'abs','',{left:'1340px',top:'800px',width:'540px',fontSize:'36px',fontStyle:'italic',color:C.yellow,lineHeight:'1.35',opacity:0,visibility:'hidden'});av.innerHTML='full network at test time ≈ average of them all';show(av,cue(sid,'averaging'),.5);
  sceneInOut(sid);
})();

/* ============ S5: the loss curves ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const panel=(cx,title,tr,va,tc)=>{const P=plane(cx-330,820,105,85);const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
    svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(6.3,0)[0],y2:P(0,0)[1],stroke:C.axis,'stroke-width':3},g);svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(0,0)[0],y2:P(0,6.5)[1],stroke:C.axis,'stroke-width':3},g);
    const a=pth(svg,fpath(tr,P,.1,6.1,120),C.blue,5),b=pth(svg,fpath(va,P,.1,6.1,120),C.yellow,5,{'stroke-dasharray':'12 9'});
    const t=el(S,'lbl',title,{color:tc,fontSize:'38px'});place(t,cx,190);return {g,a,b,t,P}};
  const A=panel(520,'without dropout',x=>5.5*Math.exp(-x*.75)+.2,x=>{const b=5.5*Math.exp(-x*.7)+.7;return x>2?b+.2*(x-2)*(x-2):b},C.red);
  const Bp=panel(1400,'with dropout',x=>5.5*Math.exp(-x*.6)+.75,x=>5.5*Math.exp(-x*.62)+1.0,C.green);
  [A,Bp].forEach((p,i)=>{fadeIn([p.g,p.t],cue(sid,'curves')+i*.3,.4);drawOn(p.a,cue(sid,'curves')+i*.3+.2,1);drawOn(p.b,cue(sid,'curves')+i*.3+.4,1)});
  const leg=el(S,'abs','',{left:'660px',top:'975px',width:'600px',textAlign:'center',fontSize:'30px',fontStyle:'italic',opacity:0,visibility:'hidden'});leg.innerHTML='<span style="color:#58c4dd">— training</span> &nbsp; <span style="color:#f5cf4a">— validation</span>';fadeIn(leg,cue(sid,'curves'),.4);
  const hi=el(S,'lbl','training loss a little higher',{color:C.blue,fontSize:'30px',fontStyle:'italic'});place(hi,1400,Bp.P(0,2.0)[1]-110);show(hi,cue(sid,'higher'),.4);
  const gp=el(S,'lbl','smaller gap, lower validation loss',{color:C.yellow,fontSize:'30px',fontStyle:'italic'});place(gp,1400,880);show(gp,cue(sid,'narrows'),.4);
  const gl=el(S,'lbl','growing gap',{color:C.red,fontSize:'30px',fontStyle:'italic'});place(gl,520,880);show(gl,cue(sid,'gap'),.4);
  tl.to([A.g,A.a,A.b,A.t,Bp.g,Bp.a,Bp.b,Bp.t],{autoAlpha:.25,duration:.5},cue(sid,'regulariser'));tl.to([leg,hi,gp,gl],{autoAlpha:0,duration:.4},cue(sid,'regulariser'));
  const ch=[['dropout',600,C.pink,'regulariser'],['weight decay',900,C.ink,'weight'],['early stopping',1220,C.ink,'early'],['more data',1500,C.ink,'collecting']].map(([t,x,c,w])=>{const e=el(S,'chip',t,{borderColor:c,fontSize:'36px'});place(e,x,540);show(e,cue(sid,w),.4);return e});
  sceneInOut(sid);
})();

/* ============ S6: dropout in language models ============ */
(function(){const S=$('S6');const sid='s6';
  const rows=[['original transformer (2017)','0.1',C.blue,'transformer'],['first GPT (2018)','0.1',C.blue,'gpt'],['very large pre-training runs','little or none',C.yellow,'little'],['fine-tuning on smaller datasets','common',C.green,'fine-tuning']];
  rows.forEach(([a,b,c,w],i)=>{const y=260+i*150;const l=el(S,'abs','',{left:'260px',top:(y-30)+'px',width:'900px',fontSize:'42px',opacity:0,visibility:'hidden'});l.innerHTML=a;
    const r=el(S,'chip',b,{borderColor:c,fontSize:'38px'});place(r,1450,y);show([l,r],cue(sid,w),.5)});
  const why=el(S,'cap','with that much data, memorisation is less of a threat',{top:'900px',fontSize:'40px',fontStyle:'italic',color:C.dim});show(why,cue(sid,'memorisation'),.5);
  sceneInOut(sid);
})();

/* ============ S7: recap ============ */
(function(){const S=$('S7');const sid='s7';
  const svg=layerSvg(S);
  const net=miniNet(S,svg,960,470,1,[3,5,5,2],C.blue);fadeIn([].concat(...net.N),at(sid,.02),.4);net.E.forEach(o=>drawOn(o.e,at(sid,.02),.5));
  const off=[net.N[1][1],net.N[1][3],net.N[2][0]];tl.to(off,{opacity:.18,borderColor:C.dim,duration:.3},cue(sid,'silences'));
  tl.to(off,{opacity:1,borderColor:C.blue,duration:.3},cue(sid,'aside'));
  const a=el(S,'lbl','training: random neurons off',{color:C.pink,fontSize:'36px',fontStyle:'italic'});place(a,560,800);show(a,cue(sid,'silences'),.4);
  const b=el(S,'lbl','test: everyone present',{color:C.teal,fontSize:'36px',fontStyle:'italic'});place(b,1360,800);show(b,cue(sid,'aside'),.4);
  nextCap(S,sid,'next',1,'7.1 &nbsp;tensors and batches');
  sceneInOut(sid,true);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
