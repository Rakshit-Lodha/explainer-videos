  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

const f=(x,y)=>x*x+2*y*y;
const Q=(x,y,z)=>[640+130*x-95*y,640+45*x+60*y-19*z];
const poly=(pts)=>pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'1180px',top:top+'px',width:'700px',textAlign:'center'},o||{}));
const ID=(x,y)=>[x,y];

/* ============ persistent stage s2-s5: the landscape f(x, y) = x² + 2y² ============ */
const STAGE=$('STAGE');const ssvg=layerSvg(STAGE);
const ground=svgEl('g',{opacity:.3},ssvg);
for(let k=-2;k<=2;k+=.5){svgEl('polyline',{points:poly([Q(k,-2,0),Q(k,2,0)]),stroke:C.dim,'stroke-width':1.5,fill:'none'},ground);svgEl('polyline',{points:poly([Q(-2,k,0),Q(2,k,0)]),stroke:C.dim,'stroke-width':1.5,fill:'none'},ground)}
const mesh=svgEl('g',{},ssvg);
for(let k=-2;k<=2.001;k+=1/3){const a=[],b=[];for(let t=-2;t<=2.001;t+=.1){a.push(Q(t,k,f(t,k)));b.push(Q(k,t,f(k,t)))}
  svgEl('polyline',{points:poly(a),stroke:C.blue,'stroke-width':2,fill:'none',opacity:.55},mesh);svgEl('polyline',{points:poly(b),stroke:C.blue,'stroke-width':2,fill:'none',opacity:.55},mesh)}
const P0=[1,1];
const drop=svgEl('polyline',{points:poly([Q(1,1,0),Q(1,1,3)]),stroke:C.ink,'stroke-width':3,'stroke-dasharray':'8 7',fill:'none',style:'opacity:0;visibility:hidden'},ssvg);
const gdot=svgEl('circle',{cx:Q(1,1,0)[0],cy:Q(1,1,0)[1],r:8,fill:C.ink,style:'opacity:0;visibility:hidden'},ssvg);
const sliceX=[],sliceY=[];for(let t=-2;t<=2.001;t+=.05){sliceX.push(Q(t,1,f(t,1)));sliceY.push(Q(1,t,f(1,t)))}
const sX=svgEl('polyline',{points:poly(sliceX),stroke:C.yellow,'stroke-width':6,fill:'none',style:'opacity:0;visibility:hidden'},ssvg);
const sY=svgEl('polyline',{points:poly(sliceY),stroke:C.pink,'stroke-width':6,fill:'none',style:'opacity:0;visibility:hidden'},ssvg);
const tX=svgEl('polyline',{points:poly([Q(.4,1,3-1.2),Q(1.6,1,3+1.2)]),stroke:C.yellow,'stroke-width':4,'stroke-dasharray':'10 8',fill:'none',style:'opacity:0;visibility:hidden'},ssvg);
const tY=svgEl('polyline',{points:poly([Q(1,.6,3-1.6),Q(1,1.4,3+1.6)]),stroke:C.pink,'stroke-width':4,'stroke-dasharray':'10 8',fill:'none',style:'opacity:0;visibility:hidden'},ssvg);
const walker=svgEl('circle',{cx:Q(1,1,3)[0],cy:Q(1,1,3)[1],r:13,fill:C.yellow,stroke:'#0e1116','stroke-width':3,style:'opacity:0;visibility:hidden'},ssvg);
const QA=(x,y,z)=>Q(x,y,z);
const east=mkArrow(ssvg,(x,y)=>Q(x,y,0),C.green,6,'<span style="font-size:34px;font-style:italic">east (x)</span>',40,30,STAGE);setArrow(east,{x0:1,y0:1,x1:2,y1:1});
const north=mkArrow(ssvg,(x,y)=>Q(x,y,0),C.red,6,'<span style="font-size:34px;font-style:italic">north (y)</span>',-30,40,STAGE);setArrow(north,{x0:1,y0:1,x1:1,y1:2});
tl.to(STAGE,{autoAlpha:1,duration:.8},START.s2);tl.to(STAGE,{autoAlpha:0,duration:.6},START.s6-.3);

/* small 2D plot for a slice (right side) */
function slicePlot(S,g,col,label,slope,xlab){
  const PP=plane(1500,760,110,32);const svg=layerSvg(S);const grp=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('line',{x1:PP(-2.2,0)[0],y1:PP(0,0)[1],x2:PP(2.2,0)[0],y2:PP(0,0)[1],stroke:C.axis,'stroke-width':2.5},grp);
  svgEl('line',{x1:PP(0,0)[0],y1:PP(0,0)[1],x2:PP(0,11)[0],y2:PP(0,11)[1],stroke:C.axis,'stroke-width':2.5,opacity:.6},grp);
  svgEl('path',{d:pathD(PP,g,-2.1,2.1,90),fill:'none',stroke:col,'stroke-width':5},grp);
  const xl=el(S,'lbl',tex(xlab,36),{color:C.dim});place(xl,PP(2.2,0)[0]+30,PP(0,0)[1]+30);
  const tg=svgEl('path',{d:pathD(PP,x=>g(1)+slope*(x-1),.2,1.8,2),fill:'none',stroke:col,'stroke-width':3,'stroke-dasharray':'9 7',style:'opacity:0;visibility:hidden'},svg);
  const dt=svgEl('circle',{cx:PP(1,g(1))[0],cy:PP(1,g(1))[1],r:9,fill:col,style:'opacity:0;visibility:hidden'},svg);
  const lb=el(S,'abs hid',label,{left:'1180px',top:'340px',width:'700px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:col});
  return {grp,tg,dt,lb,xl}}

/* ============ S1: one error, many weights ============ */
(function(){const S=$('S1'),sid='s1';
  const ws=[...Array(7)].map((_,i)=>{const d=el(S,'abs hid','',{left:(330+i*130)+'px',top:'360px',width:'110px',height:'110px',border:`3px solid ${C.blue}`,borderRadius:'14px',textAlign:'center',lineHeight:'104px'});d.innerHTML=tex(`w_${i+1}`,44);return d});
  const E=el(S,'abs hid','',{left:'1340px',top:'340px',width:'260px',height:'150px',border:`3px solid ${C.red}`,borderRadius:'14px',textAlign:'center',lineHeight:'146px',fontSize:'50px',color:C.red});E.innerHTML='error';
  const svg=layerSvg(S);const a=mkArrow(svg,ID,C.dim,4);setArrow(a,{x0:1240,y0:415,x1:1330,y1:415});
  show(E,cue(sid,'error'),.5);tl.to(ws,{autoAlpha:1,duration:.3,stagger:.08},cue(sid,'weights'));showArrow(a,cue(sid,'weights'),.4);
  tl.to(ws[2],{borderColor:C.yellow,backgroundColor:'#2a2614',duration:.3},cue(sid,'nudge'));
  tl.to(ws[2],{y:-16,duration:.25,yoyo:true,repeat:3,ease:'sine.inOut'},cue(sid,'nudge'));
  const q=el(S,'abs hid','nudge just one: how does the error change?',{left:'0',top:'560px',width:'1920px',textAlign:'center',fontSize:'44px',fontStyle:'italic'});show(q,cue(sid,'one',3),.5);
  const t=el(S,'abs hid','partial derivative',{left:'0',top:'700px',width:'1920px',textAlign:'center',fontSize:'84px',color:C.yellow});show(t,cue(sid,'partial'),.6);
  sceneInOut(sid);
})();

/* ============ S2: a landscape ============ */
(function(){const S=$('S2'),sid='s2';
  const lab=panel(S,tex('f(x,y)=x^2+2y^2',52),240);show(lab,cue(sid,'landscape'),.6);
  fadeIn([gdot],cue(sid,'standing'),.4);
  const n1=panel(S,'(x, y): where you stand',360,{fontSize:'40px',fontStyle:'italic'});show(n1,cue(sid,'standing'),.4);
  fadeIn([drop,walker],cue(sid,'height'),.5);
  const n2=panel(S,'f(x, y): the height of the ground',430,{fontSize:'40px',fontStyle:'italic'});show(n2,cue(sid,'height'),.4);
  showArrow(east,cue(sid,'east'),.4);showArrow(north,cue(sid,'north'),.4);
  const n3=panel(S,'steepness depends on the way you face',560,{fontSize:'40px',fontStyle:'italic',color:C.dim});show(n3,cue(sid,'steep'),.4);
  sceneInOut(sid);
})();

/* ============ S3: freeze y: an ordinary curve ============ */
(function(){const S=$('S3'),sid='s3';
  const sp=slicePlot(S,x=>f(x,1),C.yellow,'y frozen at 1: a curve in x','2','x');
  const fz=panel(S,'freeze every input but one',240,{fontSize:'44px',fontStyle:'italic'});show(fz,cue(sid,'freezing'),.5);fadeOut(fz,cue(sid,'hold')+1.2,.3);
  fadeIn(sX,cue(sid,'slice'),.6);show(sp.lb,cue(sid,'hold'),.5);fadeIn([sp.grp,sp.xl],cue(sid,'slice'),.6);
  fadeIn([sp.tg,sp.dt,tX],cue(sid,'slope'),.5);
  const d=panel(S,tex('\\dfrac{\\partial f}{\\partial x}',52),150,{color:C.yellow});show(d,cue(sid,'partial',2),.6);
  const c=panel(S,'curly ∂: the other inputs are held still',420,{fontSize:'36px',fontStyle:'italic',color:C.dim});show(c,cue(sid,'curly'),.5);
  fadeOut([sp.grp,sp.tg,sp.dt,sp.xl],START.s4,.4);
  sceneInOut(sid);
})();

/* ============ S4: treat the others as constants ============ */
(function(){const S=$('S4'),sid='s4';
  const a=panel(S,'treat every other variable as a constant',230,{fontSize:'40px',fontStyle:'italic'});show(a,cue(sid,'treat'),.5);
  const f0=panel(S,tex('f=x^2+2y^2',56),340);show(f0,cue(sid,'f'),.5);
  const fx=panel(S,'',460);fx.innerHTML=tex('\\dfrac{\\partial f}{\\partial x}=2x+\\textcolor{#7f8b99}{0}',56);fx.style.color=C.yellow;show(fx,cue(sid,'two',2),.5);
  const c=panel(S,'the y term does not change while only x moves',630,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(c,cue(sid,'term'),.5);
  const fy=panel(S,'',710);fy.innerHTML=tex('\\dfrac{\\partial f}{\\partial y}=\\textcolor{#7f8b99}{0}+4y',56);fy.style.color=C.pink;show(fy,cue(sid,'four'),.5);
  sceneInOut(sid);
})();

/* ============ S5: the other slice; two numbers give every direction ============ */
(function(){const S=$('S5'),sid='s5';
  const sp=slicePlot(S,y=>f(1,y),C.pink,'x frozen at 1: a curve in y','4','y');
  fadeOut([sX,tX],START[sid]+.2,.4);
  fadeIn(sY,cue(sid,'slice'),.6);fadeIn([sp.grp,sp.xl],cue(sid,'slice'),.6);show(sp.lb,cue(sid,'north'),.5);
  fadeIn([sp.tg,sp.dt,tY],cue(sid,'second'),.5);
  fadeOut([sp.grp,sp.tg,sp.dt,sp.lb,sp.xl],cue(sid,'together'),.4);
  fadeIn([sX,tX],cue(sid,'together'),.4);
  const e=panel(S,'facing east: slope 2',320,{fontSize:'44px',color:C.yellow});show(e,cue(sid,'east'),.4);
  const n=panel(S,'facing north: slope 4',400,{fontSize:'44px',color:C.pink});show(n,cue(sid,'north',2),.4);
  const any=panel(S,tex('\\text{facing }\\theta:\\ \\ 2\\cos\\theta+4\\sin\\theta',48),540);show(any,cue(sid,'any',2),.6);
  const sm=panel(S,'(for a smooth surface)',630,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(sm,cue(sid,'smooth'),.4);
  sceneInOut(sid);
})();

/* ============ S6: numerically, one input at a time ============ */
(function(){const S=$('S6'),sid='s6';
  sceneIn(sid);
  const fr=el(S,'abs hid',tex('\\frac{\\partial f}{\\partial x}\\approx\\frac{f(x+h,\\,y)-f(x,\\,y)}{h}',60),{left:'0',top:'170px',width:'1920px',textAlign:'center'});show(fr,cue(sid,'nudge'),.6);
  const code=el(S,'abs hid mono','',{left:'420px',top:'360px',width:'1080px',fontSize:'32px',lineHeight:'48px',color:C.ink,background:'#161c25',border:'2px solid #2a3442',borderRadius:'12px',padding:'22px 32px',whiteSpace:'pre'});
  code.innerHTML='<span style="color:#7f8b99">def</span> partial(f, xs, i, h=1e-6):\n    bumped = list(xs)\n    bumped[i] += h            <span style="color:#5cd0b3"># nudge one input only</span>\n    <span style="color:#7f8b99">return</span> (f(bumped) - f(xs)) / h';
  show(code,cue(sid,'leave'),.6);
  const sl=el(S,'abs hid','one input at a time: slow for millions of weights',{left:'0',top:'660px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.red});show(sl,cue(sid,'slow'),.5);
  const ck=el(S,'abs hid','so networks use backpropagation, and check it this way',{left:'0',top:'740px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.green});show(ck,cue(sid,'check'),.5);
  tl.to(S,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5);
})();

/* ============ S7: one loss, billions of partials ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const L=el(S,'abs hid','',{left:'260px',top:'420px',width:'260px',height:'130px',border:`3px solid ${C.red}`,borderRadius:'14px',textAlign:'center',lineHeight:'126px',fontSize:'50px',color:C.red});L.textContent='loss';
  show(L,cue(sid,'loss'),.5);
  const cv=colvec(S,960,480,[tex('\\partial L/\\partial w_1',34),tex('\\partial L/\\partial w_2',34),tex('\\partial L/\\partial w_3',34),'⋮',tex('\\partial L/\\partial w_n',34)],{fs:40,w:300,color:C.yellow});
  cv.cells.forEach(c=>c.setAttribute('data-layout-allow-overlap',''));
  show(cv.box,cue(sid,'partial'),.6);
  const b=el(S,'abs hid','billions of weights, one partial each',{left:'1220px',top:'440px',width:'560px',textAlign:'center',fontSize:'40px',fontStyle:'italic'});show(b,cue(sid,'each'),.5);
  const g=el(S,'abs hid','gathered into one arrow: the gradient',{left:'0',top:'800px',width:'1920px',textAlign:'center',fontSize:'44px',color:C.yellow,fontStyle:'italic'});show(g,cue(sid,'gather'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 2.4 &nbsp;the gradient points uphill',{top:'930px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next'),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
