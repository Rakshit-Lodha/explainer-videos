function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

function block(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||28)+'px',borderRadius:'10px'});if(o.bg)d.style.background=o.bg;return d}

/* ============ S1: text in, text out; the rest is the harness ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const ring=el(S,'abs hid','',{left:'360px',top:'200px',width:'1200px',height:'560px',border:'3px dashed #f5cf4a',borderRadius:'48px'});ring.setAttribute('data-layout-allow-overlap','');
  const m=box(S,960,470,340,150,'<span>model API<br><span style="font-size:26px;color:#7f8b99">the engine</span></span>',C.blue,{fs:42});show(m,cue(sid,'model'),.5);
  const a1=pxArrow(svg,C.ink,4,560,470,780,470,'<span style="font-size:30px">text</span>',-110,-40,S),a2=pxArrow(svg,C.ink,4,1140,470,1360,470,'<span style="font-size:30px">text</span>',60,-40,S);
  growPx(a1,cue(sid,'takes'),.5);growPx(a2,cue(sid,'returns'),.5);
  const qs=[['which text goes in?',560,300,'goes'],['what is done with the reply?',1360,300,'reply'],['what happens when it fails?',960,680,'fails']];
  qs.forEach(([t,x,y,w])=>{const d=txt(S,t,x,y,{fs:32,it:true,color:C.yellow});show(d,cue(sid,w),.4)});
  fadeIn(ring,cue(sid,'harness'),.5);const hl=txt(S,'the harness: the rest of the car',960,170,{fs:34,color:C.yellow});show(hl,cue(sid,'car'),.4);
  const ta=box(S,640,880,520,90,'<span>team A&nbsp; <span style="color:#f5cf4a">★★☆☆☆</span></span>',C.dim,{fs:34}),tb=box(S,1280,880,520,90,'<span>team B&nbsp; <span style="color:#f5cf4a">★★★★★</span></span>',C.dim,{fs:34});
  show([ta,tb],cue(sid,'teams'),.5,{stagger:.2});
  const sm=txt(S,'same model',960,980,{fs:28,it:true,color:C.dim});show(sm,cue(sid,'same'),.4);
  sceneInOut(sid);
})();

/* ============ S2: packing the context window ============ */
(function(){const S=$('S2');const sid='s2';
  const win=el(S,'abs hid','',{left:'700px',top:'180px',width:'520px',height:'720px',border:'4px solid #c9d3e0',borderRadius:'14px'});
  show(win,at(sid,.02),.5);const wl=txt(S,'context window: a fixed budget of tokens',960,140,{fs:30,color:C.axis,it:true});show(wl,cue(sid,'budget'),.5);
  const P=[['system instructions',C.yellow,90,'instructions',true],['tool descriptions',C.yellow,80,'descriptions',true],['passage 1 (best)',C.blue,70,'retrieved',false],['passage 2',C.blue,70,'retrieved',false],['passage 3 (weakest)',C.blue,70,'retrieved',false],['old turns',C.pink,90,'conversation',false],['recent turns',C.pink,70,'conversation',false],['new message',C.green,70,'message',true]];
  let y=200;const B=P.map(([t,c,h,w,req],i)=>{const b=block(S,720,y,480,h-10,t,c,{fs:28});y+=h;show(b,cue(sid,w)+(w==='retrieved'||w==='conversation'?.15*i:0),.4,{y:-20});return {b,t,req}});
  const ov=block(S,1300,620,360,80,'+ 2 more passages, older turns',C.red,{fs:24});show(ov,cue(sid,'space'),.4);
  const ovl=txt(S,'over budget',1480,720,{fs:28,it:true,color:C.red});show(ovl,cue(sid,'space'),.4);
  const suit=txt(S,'like packing a suitcase with a weight limit',380,300,{fs:30,it:true,color:C.ink});suit.style.whiteSpace='normal';suit.style.width='520px';suit.style.textAlign='center';show(suit,cue(sid,'suitcase'),.5);
  const es=txt(S,'essentials first',380,420,{fs:32,color:C.yellow});show(es,cue(sid,'essentials'),.4);
  fadeOut([ov,ovl],cue(sid,'drops'),.4);
  const drop=(i,w)=>{const d=B[i].b;tl.to(d,{opacity:.25,duration:.4},cue(sid,w));const x=el(S,'abs hid','',{left:'720px',top:(parseFloat(d.style.top)+ (parseFloat(d.style.height)/2)-2)+'px',width:'480px',height:'4px',background:C.red});show(x,cue(sid,w),.3,{y:0})};
  drop(5,'oldest');drop(4,'lowest');
  const nv=txt(S,'never the instructions',380,560,{fs:32,color:C.yellow});show(nv,cue(sid,'never'),.4);
  const lk=el(S,'abs hid','🔒',{left:'1220px',top:'205px',fontSize:'40px'});show(lk,cue(sid,'never'),.4);
  sceneInOut(sid);
})();

/* ============ S3: order, edges and the cached prefix ============ */
(function(){const S=$('S3');const sid='s3';
  const parts=[['instructions',C.yellow,220],['tools',C.yellow,170],['passage A',C.blue,190],['passage C',C.blue,190],['passage D',C.blue,190],['passage B',C.blue,190],['history',C.pink,190],['message',C.green,170]];
  let x=150;const B=parts.map(([t,c,w])=>{const b=block(S,x,600,w-12,90,t,c,{fs:26});x+=w;show(b,cue(sid,'order'),.4,{y:20});return {b,x0:x-w,w}});
  const svg=layerSvg(S);
  const U=pth(svg,'M 160 330 C 420 330, 600 500, 960 500 C 1320 500, 1500 330, 1760 330',C.teal,5);
  drawOn(U,cue(sid,'reliably'),1.2);
  const ul=txt(S,'how reliably the model uses it',960,250,{fs:30,it:true,color:C.teal});show(ul,cue(sid,'reliably'),.4);
  const mid=txt(S,'the middle is used least',960,440,{fs:28,it:true,color:C.dim});show(mid,cue(sid,'middle'),.4);
  const strong=[2,5].map(i=>{const b=B[i];const h=el(S,'hl','',{left:(b.x0-6)+'px',top:'592px',width:(b.w)+'px',height:'106px',borderColor:C.blue});fadeIn(h,cue(sid,'edges'),.4);return h});
  const sl=txt(S,'strongest passages near the edges of the retrieved block',960,740,{fs:28,it:true,color:C.blue});show(sl,cue(sid,'edges'),.4);
  const br=el(S,'abs hid','',{left:'150px',top:'790px',width:'378px',height:'24px',borderLeft:'3px solid #f5cf4a',borderRight:'3px solid #f5cf4a',borderBottom:'3px solid #f5cf4a'});
  fadeIn(br,cue(sid,'cache'),.4);
  const bl=txt(S,'stable prefix: cached by the provider',340,860,{fs:28,color:C.yellow});show(bl,cue(sid,'cache'),.4);
  const al=txt(S,'changes every request: after it',1300,860,{fs:28,color:C.ink,it:true});show(al,cue(sid,'after'),.4);

})();

/* ============ S4: structured output with validate-and-retry ============ */
(function(){const S=$('S4');const sid='s4';
  const sc=box(S,330,330,460,260,'<span class="mono" style="font-size:26px;text-align:left;line-height:1.5">schema<br>{ city: string,<br>&nbsp;&nbsp;date: string }</span>',C.yellow,{fs:26});
  show(sc,cue(sid,'schema'),.5);
  const r1=box(S,960,330,420,120,'<span class="mono" style="font-size:28px">{"city": "Pune",<br>&nbsp;"date": 31}</span>',C.blue,{fs:28});show(r1,at(sid,.02),.5);
  const gate=box(S,1500,330,280,120,'validate',C.ink,{fs:36});show(gate,cue(sid,'validates'),.5);
  const svg=layerSvg(S);const a=pxArrow(svg,C.ink,4,1170,330,1360,330);growPx(a,cue(sid,'validates'),.4);
  const x=txt(S,'✗',1500,450,{fs:60,color:C.red});show(x,cue(sid,'fails'),.3);
  const err=box(S,1200,600,720,90,'<span class="mono" style="font-size:26px">error: \'date\' should be string, got int</span>',C.red,{fs:26});show(err,cue(sid,'error'),.5);
  const back=pxArrow(svg,C.red,4,1000,640,960,420);growPx(back,cue(sid,'again'),.5);
  const r2=box(S,960,820,460,120,'<span class="mono" style="font-size:28px">{"city": "Pune",<br>&nbsp;"date": "2026-11-03"}</span>',C.green,{fs:28});show(r2,cue(sid,'again'),.5);
  const ok=txt(S,'✓ valid on the second try',1500,820,{fs:32,color:C.green});show(ok,cue(sid,'times'),.4);
  const bound=txt(S,'a small number of tries, at most',330,560,{fs:28,it:true,color:C.dim});show(bound,cue(sid,'times'),.4);
  const cd=txt(S,'some providers mask tokens that would break the format',330,680,{fs:28,it:true,color:C.ink});cd.style.whiteSpace='normal';cd.style.width='520px';cd.style.textAlign='center';show(cd,cue(sid,'constrain'),.5);
  sceneInOut(sid);
})();

/* ============ S5: exponential backoff with jitter ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);const X=t=>400+t*165;
  const ax=ln(svg,X(0),420,X(8.6),420,C.axis,3);fadeIn(ax,cue(sid,'exponential'),.4);
  const tl0=txt(S,'time (s)',X(8.2),460,{fs:26,it:true,color:C.dim});fadeIn(tl0,cue(sid,'exponential'),.4);
  [0,1,3,7].forEach((t,i)=>{const ok=i===3;const d=txt(S,ok?'✓':'✗',X(t),380,{fs:44,color:ok?C.green:C.red});show(d,cue(sid,['exponential','one','two','four'][i])+(i?.5:0),.3)});
  [[0,1,'one'],[1,3,'two'],[3,7,'four']].forEach(([a,b,w])=>{const p=pth(svg,`M ${X(a)+14} 340 Q ${(X(a)+X(b))/2} ${300-(b-a)*18} ${X(b)-14} 340`,C.yellow,3);drawOn(p,cue(sid,w),.5);
    const l=txt(S,'wait '+(b-a)+' s',(X(a)+X(b))/2,300-(b-a)*18-10,{fs:26,mono:true,color:C.yellow});show(l,cue(sid,w),.4)});
  const rf=txt(S,'timeouts and rate limits',560,200,{fs:32,it:true,color:C.red});show(rf,at(sid,.02),.4);
  /* many clients, without and with jitter */
  const rnd=seedRand(7);
  const h1=txt(S,'without jitter',200,615,{fs:28,color:C.dim}),h2=txt(S,'with jitter',200,835,{fs:28,color:C.dim});
  const d1=[],d2=[];for(let c=0;c<14;c++){for(const t of [1,3,7]){d1.push(el(S,'abs hid','',{left:(X(t)-7)+'px',top:(560+c*8)+'px',width:'14px',height:'6px',background:C.pink,borderRadius:'3px'}));
const jt=[0,1,3,7][[1,3,7].indexOf(t)]+(t-[0,1,3,7][[1,3,7].indexOf(t)])*(rnd());d2.push(el(S,'abs hid','',{left:(X(jt)-7)+'px',top:(780+c*8)+'px',width:'14px',height:'6px',background:C.teal,borderRadius:'3px'}))}}
  show(h1,cue(sid,'thousands'),.4);fadeIn(d1,cue(sid,'thousands'),.4);
  const sp=txt(S,'everyone retries at once',1700,560,{fs:28,it:true,color:C.pink});show(sp,cue(sid,'instant'),.4);
  show(h2,cue(sid,'stadium'),.4);fadeIn(d2,cue(sid,'stadium'),.6,.004);
  const st=txt(S,'staggered exits',1700,780,{fs:28,it:true,color:C.teal});show(st,cue(sid,'staggered'),.4);
  const safe=el(S,'cap','only retry requests that are safe to run twice',{top:'960px',fontSize:'34px',fontStyle:'italic',color:C.ink});show(safe,cue(sid,'safe'),.5);
  sceneInOut(sid);
})();

/* ============ S6: every call is a trace ============ */

  show(card,at(sid,.02),.5);
  const F=[['input','system + 3 passages + question','input'],['output','{"answer": "...", "source": "p3"}','output'],['tokens','3,812 in · 164 out','token'],['latency','1.9 s','latency'],['cost','₹0.31','cost']];
  F.forEach(([k,v,w],i)=>{const y=290+i*96;const a=txt(S,k,380,y,{fs:30,color:C.blue});const b=txt(S,v,700,y,{fs:26,mono:true,color:C.ink});show([a,b],cue(sid,w),.4)});

  const svg=layerSvg(S);const a1=pxArrow(svg,C.dim,4,1030,400,1230,340),a2=pxArrow(svg,C.green,4,1030,600,1230,640);growPx(a1,cue(sid,'debuggable'),.4);growPx(a2,cue(sid,'evaluation'),.4);
  const bt=el(S,'cap','the best test cases you will ever get',{top:'900px',fontSize:'38px',fontStyle:'italic',color:C.green});show(bt,cue(sid,'best'),.5);

})();

/* ============ S7: the harness as a loop becomes an agent ============ */
(function(){const S=$('S7');const sid='s7';
  const svg=layerSvg(S);
  const g=box(S,960,300,860,110,'<span>probabilistic text → <span style="color:#83c167">dependable component</span></span>',C.green,{fs:36});show(g,at(sid,.02),.5);
  const m=box(S,700,620,280,110,'model',C.blue,{fs:40}),t=box(S,1220,620,280,110,'tool',C.yellow,{fs:40});

  const a1=pth(svg,'M 840 570 C 920 480, 1000 480, 1080 570',C.ink,4),a2=pth(svg,'M 1080 670 C 1000 760, 920 760, 840 670',C.ink,4);
  drawOn(a1,cue(sid,'runs'),.6);drawOn(a2,cue(sid,'feeds'),.6);
  const l1=txt(S,'call',960,470,{fs:28,it:true,color:C.dim}),l2=txt(S,'result',960,775,{fs:28,it:true,color:C.dim});show(l1,cue(sid,'runs'),.3);show(l2,cue(sid,'feeds'),.3);
