.colv .br.l{left:0;border-right:none;border-radius:6px 0 0 6px}
.colv .br.r{right:0;border-left:none;border-radius:0 6px 6px 0}
.colv .cell{position:absolute;left:0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace}
.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}
.tag{position:absolute;left:56px;top:40px;font-size:24px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;font-family:'JetBrains Mono',monospace}
.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}
.ttl{position:absolute;font-size:46px;opacity:0;visibility:hidden;white-space:nowrap}

/* ===================== scenes ===================== */
const Lf=w=>w*w,dLf=w=>2*w;
function run(lr,w0,n){const ws=[w0];for(let i=0;i<n;i++)ws.push(ws[i]-lr*dLf(ws[i]));return ws}
/* a parabola panel with a zigzag path of gradient steps revealed by index */
function panel(S,svg,o){const A=axes(svg,{x:o.x,y:o.y,w:o.w,h:o.h,xmin:-o.r,xmax:o.r,ymin:0,ymax:o.r*o.r,xticks:[],yaxis:false});
  const cv=svgEl('path',{d:fpath(A,Lf,-o.r,o.r),fill:'none',stroke:C.yellow,'stroke-width':5},svg);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);g.appendChild(cv);
  const pts=o.ws.map(w=>[A.X(w),A.Y(Math.min(Lf(w),o.r*o.r*1.6))]);
  const gp=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const path=svgEl('path',{fill:'none',stroke:o.col,'stroke-width':4,'stroke-linejoin':'round'},gp);
  const dots=pts.map(([x,y],i)=>svgEl('circle',{cx:x,cy:y,r:i?9:12,fill:o.col},gp));
  const render=s=>{const n=Math.max(0,Math.min(pts.length-1,s.i));const k=Math.floor(n),t=n-k;const P=pts.slice(0,k+1);if(k<pts.length-1)P.push([pts[k][0]+(pts[k+1][0]-pts[k][0])*t,pts[k][1]+(pts[k+1][1]-pts[k][1])*t]);
    path.setAttribute('d',polyPath(P));dots.forEach((d,i)=>d.setAttribute('opacity',i<=n+1e-6?1:0))};
  const st=state({i:0},render);
  const all=[g,gp];
  return {A,g,all,st,render,pts}}

/* ============ S1: one dial of its own ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const f=lbl(S,tex('w_{\\text{new}}=w-\\eta\\,\\frac{dL}{dw}',64),960,260,{});show(f,cue(sid,'gradient'),.6);
  const hlb=hl(S,1086,195,74,120,C.pink);fadeIn(hlb,cue(sid,'dial'),.4);
  const ls=lbl(S,'the learning rate',1055,380,{fontSize:'40px',fontStyle:'italic',color:C.pink});show(ls,cue(sid,'learning'),.5);
  const P=[['too small',.03,C.blue],['too big',1.08,C.red],['just right',.4,C.green]];
  P.forEach(([t,lr,c],i)=>{const p=panel(S,svg,{x:180+i*560,y:520,w:440,h:300,r:2.6,ws:run(lr,-2.4,0),col:c});
    const tl_=lbl(S,`${t}`,400+i*560,880,{fontSize:'40px',fontStyle:'italic',color:c});const tm=cue(sid,'three')+i*.25;fadeIn(p.all,tm,.5);show(tl_,tm,.5)});
  const same=note(S,'same descent, same bowl, only η changes',460,940,1000,{fontSize:'36px',color:C.dim,textAlign:'center'});show(same,cue(sid,'changing'),.5);
  sceneInOut(sid);
})();

/* ============ S2: too small ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const p=panel(S,svg,{x:160,y:240,w:1000,h:620,r:2.6,ws:run(.03,-2.4,30),col:C.blue});fadeIn(p.all,at(sid,.01),.5);
  drive(p.st,cue(sid,'tiny'),SPAN[sid]*.8,{i:30},p.render,'none');
  const t=lbl(S,tex('\\eta=0.03',60),1500,300,{color:C.blue});show(t,at(sid,.03),.5);
  const n1=note(S,'each step a cautious shuffle',1260,400,560,{fontSize:'40px'});show(n1,cue(sid,'shuffle'),.5);
  const n2=note(S,'the loss falls, but very slowly',1260,480,560,{fontSize:'40px',color:C.dim});show(n2,cue(sid,'slowly'),.5);
  const n3=note(S,'budget spent, still halfway down',1260,560,560,{fontSize:'40px',color:C.dim});show(n3,cue(sid,'halfway'),.5);
  sceneInOut(sid);
})();

/* ============ S3: too big ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const ws=run(1.08,-.9,7);
  const p=panel(S,svg,{x:160,y:240,w:1000,h:620,r:2.6,ws,col:C.red});fadeIn(p.all,at(sid,.01),.5);
  const t0=cue(sid,'overshoots')-.3,t1=cue(sid,'diverges');
  for(let k=1;k<=7;k++)drive(p.st,t0+(t1-t0)*(k-1)/7,(t1-t0)/7*.8,{i:k},p.render,'power1.inOut');
  const t=lbl(S,tex('\\eta=1.08',60),1500,300,{color:C.red});show(t,at(sid,.03),.5);
  const n1=note(S,'overshoots to the opposite slope, higher than before',1260,400,560,{fontSize:'40px'});show(n1,cue(sid,'opposite'),.5);
  const n2=note(S,'each overshoot bigger: the loss grows',1260,520,560,{fontSize:'40px',color:C.dim});show(n2,cue(sid,'grows'),.5);
  const n3=el(S,'chip','loss → ∞ or NaN',{left:'1260px',top:'660px',borderColor:C.red,color:C.red});show(n3,cue(sid,'infinity'),.5);
  sceneInOut(sid);
})();

/* ============ S4: just right, and the exact boundary ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const p=panel(S,svg,{x:160,y:240,w:1000,h:620,r:2.6,ws:run(.4,-2.4,8),col:C.green});fadeIn(p.all,at(sid,.01),.5);
  drive(p.st,cue(sid,'long'),3.4,{i:8},p.render,'power1.out');
  const t=lbl(S,tex('\\eta=0.4',60),1500,300,{color:C.green});show(t,at(sid,.03),.5);
  const n1=note(S,'long steps on the steep part, short near the bottom',1260,390,560,{fontSize:'40px'});show(n1,cue(sid,'long'),.5);
  const f1=lbl(S,tex('L(w)=\\tfrac{a}{2}w^2\\;\\Rightarrow\\;w_{\\text{new}}=(1-\\eta a)\\,w',36),1500,600,{});show(f1,cue(sid,'parabola'),.6);
  const f2=lbl(S,tex('\\text{diverges when}\\;\\eta>\\frac{2}{a}',50),1560,720,{color:C.red});show(f2,cue(sid,'diverges'),.6);
  const f3=note(S,'a = curvature (here L = w², so a = 2 and the limit is η = 1)',1240,800,600,{fontSize:'32px',color:C.dim});show(f3,cue(sid,'curvature'),.5);
  sceneInOut(sid);
})();

/* ============ S5: reading loss curves; warm-up and decay ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const A=axes(svg,{x:160,y:260,w:760,h:520,xmin:0,xmax:30,ymin:0,ymax:4,xticks:[],yticks:[]});
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g.appendChild(A.g);fadeIn(g,cue(sid,'curve'),.5);
  const xl=lbl(S,'steps',A.X(15),A.Y(0)+40,{fontSize:'32px',fontStyle:'italic',color:C.dim}),yl=lbl(S,'loss',A.X(0)+40,A.Y(4)-20,{fontSize:'32px',fontStyle:'italic',color:C.dim});fadeIn([xl,yl],cue(sid,'curve'),.5);
  const curve=(lr,col)=>{const ws=run(lr,-1.2,30);const P=[];for(let i=0;i<ws.length;i++){P.push([A.X(i),A.Y(Math.min(4,Lf(ws[i])))]);if(Lf(ws[i])>4)break}const d=polyPath(P);return svgEl('path',{d,fill:'none',stroke:col,'stroke-width':5,style:'opacity:0;visibility:hidden'},svg)};
  const cs=curve(.03,C.blue),cb=curve(1.03,C.red),cg=curve(.4,C.green);
  fadeIn(cs,cue(sid,'barely'),.5);fadeIn(cb,cue(sid,'zigzags'),.5);fadeIn(cg,cue(sid,'large')-.4,.5);
  const l1=lbl(S,'too small',A.X(26),A.Y(Lf(run(.03,-1.2,26)[26]))-30,{fontSize:'30px',color:C.blue}),l2=lbl(S,'too big',A.X(12),A.Y(3.8),{fontSize:'30px',color:C.red}),l3=lbl(S,'just right',A.X(8),A.Y(0)-30,{fontSize:'30px',color:C.green});
  show(l1,cue(sid,'barely'),.4);show(l2,cue(sid,'zigzags'),.4);show(l3,cue(sid,'large')-.4,.4);
  // learning-rate schedule: linear warm-up, then cosine decay
  const B=axes(svg,{x:1080,y:330,w:700,h:400,xmin:0,xmax:100,ymin:0,ymax:1.1,xticks:[],yticks:[]});
  const sch=t=>t<10?t/10:.5*(1+Math.cos(Math.PI*(t-10)/90));
  const sp=svgEl('path',{d:fpath(B,sch,0,100,200),fill:'none',stroke:C.teal,'stroke-width':5},svg);
  const g2=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);g2.appendChild(B.g);g2.appendChild(sp);fadeIn(g2,cue(sid,'warm'),.6);
  const bt=lbl(S,'learning rate over training',1430,280,{fontSize:'34px',fontStyle:'italic',color:C.teal});show(bt,cue(sid,'warm'),.5);
  const w1=lbl(S,'warm-up',B.X(19),B.Y(.3),{fontSize:'30px',color:C.ink});show(w1,cue(sid,'warm'),.5);
  const w2=lbl(S,'slow decay',B.X(70),B.Y(.62),{fontSize:'30px',color:C.ink});show(w2,cue(sid,'decay'),.5);
  const w3=note(S,'early steps bold, late steps precise',1080,790,700,{fontSize:'36px',color:C.dim,textAlign:'center'});show(w3,cue(sid,'bold'),.5);
  sceneInOut(sid);
})();

/* ============ S6: first knob you tune ============ */
(function(){const S=$('S6');const sid='s6';
  const f=lbl(S,tex('\\eta',140),960,420,{color:C.pink});show(f,cue(sid,'learning'),.7);
  const t=note(S,'the first setting you tune in nearly every model',460,560,1000,{fontSize:'44px',textAlign:'center'});show(t,cue(sid,'setting'),.6);
  nextUp(S,'4.4 &nbsp;stochastic and mini-batch gradient descent',cue(sid,'next'));
  sceneInOut(sid,true);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
