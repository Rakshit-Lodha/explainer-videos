/* transformable grid: lines in grid units, redrawn through a 2x2 matrix [a b; c d] (columns = images of i-hat, j-hat) */
function tgrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const lines=[];
  for(let k=-n;k<=n;k++){
    lines.push({p:[k,-n],q:[k,n],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)});
    lines.push({p:[-n,k],q:[n,k],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)})}
  const T={g,lines,P,m:{a:1,b:0,c:0,d:1}};
  T.apply=(m)=>{T.m={a:m.a,b:m.b,c:m.c,d:m.d};for(const L of lines){const A=P(m.a*L.p[0]+m.b*L.p[1],m.c*L.p[0]+m.d*L.p[1]),B=P(m.a*L.q[0]+m.b*L.q[1],m.c*L.q[0]+m.d*L.q[1]);
    L.e.setAttribute('x1',A[0]);L.e.setAttribute('y1',A[1]);L.e.setAttribute('x2',B[0]);L.e.setAttribute('y2',B[1])}};
  T.apply(T.m);return T}
/* the whole picture (grid + arrows defined in source coordinates) moves under one matrix tween */
function mkScene(P){const S={P,grids:[],arrows:[],dots:[],m:{a:1,b:0,c:0,d:1},extra:[]};
  S.apply=(m)=>{S.m={a:m.a,b:m.b,c:m.c,d:m.d};S.grids.forEach(g=>g.apply(m));
    S.arrows.forEach(([ar,x,y])=>geom(ar,0,0,m.a*x+m.b*y,m.c*x+m.d*y));
    S.dots.forEach(([e,x,y])=>{const p=P(m.a*x+m.b*y,m.c*x+m.d*y);e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1])});
    S.extra.forEach(f=>f(m))};

(function(){const S=$('S5');const sid='s5';

  for(let s=1;s<=400;s++){let gm=0,gb=0;D.forEach(([u,v])=>{const e=m*u+b-v;gm+=2*e*u/D.length;gb+=2*e/D.length});m-=lr*gm;b-=lr*gb;if(keep.includes(s))path.push([m,b])}
  const t0=cue(sid,'nudge'),t1=cue(sid,'settle')+1.2,dt=(t1-t0)/path.length;
