/* ---- helpers added for lessons 1.5-2.6 ---- */
/* anim(init, fn): a state object driven by tweens; fn(state) redraws everything that depends on it.
   Calls to .to() must be made in time order, like arrowTo. */
function anim(init,fn){const a={st:{...init},fn};fn({...a.st});
  a.to=(time,d,vals,ease)=>{const from={...a.st},o={...from},tgt={...from,...vals};
    tl.to(o,{...tgt,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time);a.st=tgt;return a};
  return a}
/* 2x2 matrix display with brackets; cells[r][c] are divs whose text can be rewritten */
function mat2(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||60,cw=o.cw||150,rowH=fs*1.35,pad=fs*.25,W=cw*2+40,H=rowH*2+pad*2;
  const box=el(parent,'m2'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cols=o.colors||[C.ink,C.ink];
  const cells=[0,1].map(r=>[0,1].map(c=>el(box,'cell',vals[r][c],{left:(20+c*cw)+'px',top:(pad+r*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:cols[c]})));
  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

/* ============ persistent stage s2-s4: a circle of unit arrows under M = U Σ Vᵀ ============ */
const STAGE=$('STAGE');
const P=plane(560,570,92);
const d2r=Math.PI/180;
const R=t=>({a:Math.cos(t*d2r),b:-Math.sin(t*d2r),c:Math.sin(t*d2r),d:Math.cos(t*d2r)});
const mul=(X,Y)=>({a:X.a*Y.a+X.b*Y.c,b:X.a*Y.b+X.b*Y.d,c:X.c*Y.a+X.d*Y.c,d:X.c*Y.b+X.d*Y.d});
const TU=30,TV=-50,S1=2.5,S2=.8;
const prod=(tu,sx,sy,tv)=>mul(mul(R(tu),{a:sx,b:0,c:0,d:sy}),R(tv));
const M=prod(TU,S1,S2,TV);
const ssvg=layerSvg(STAGE);
const cg=clipTo(ssvg,40,90,1060,960);
const bg=drawGrid(cg,P,-6,6,-5,5);bg.setAttribute('opacity','.22');
const G=tGrid(cg,P,12,{op:.42});
const circ=svgEl('polygon',{fill:C.blue,'fill-opacity':.12,stroke:C.blue,'stroke-width':3},cg);
const CP=[];for(let i=0;i<96;i++){const t=i/96*2*Math.PI;CP.push([Math.cos(t),Math.sin(t)])}
const fan=[];for(let k=0;k<12;k++){const t=k*Math.PI/6+.13;const a=mkArrow(cg,P,C.blue,4);a.g.setAttribute('style','');a.g.setAttribute('opacity','.6');fan.push({a,u:[Math.cos(t),Math.sin(t)]})}
const v1=[Math.cos(-TV*d2r),Math.sin(-TV*d2r)],v2=[-Math.sin(-TV*d2r),Math.cos(-TV*d2r)];
const a1=mkArrow(cg,P,C.yellow,8,tex('\\vec v_1',46),34,-30,STAGE),a2=mkArrow(cg,P,C.pink,8,tex('\\vec v_2',46),-30,-30,STAGE);
svgEl('circle',{cx:P(0,0)[0],cy:P(0,0)[1],r:7,fill:C.ink},cg);
/* singular value bars (s4) */
const bars=[0,1].map(i=>el(STAGE,'abs hid','',{left:(1420+i*170)+'px',top:'0px',width:'110px',height:'10px',background:i?C.pink:C.yellow,borderRadius:'6px 6px 0 0'}));
const barL=[0,1].map(i=>{const d=el(STAGE,'abs hid','',{left:(1420+i*170)+'px',top:'930px',width:'110px',textAlign:'center'});d.innerHTML=tex(`\\sigma_${i+1}`,46);return d});
const barV=[0,1].map(i=>el(STAGE,'abs hid mono','',{left:(1420+i*170)+'px',top:'0px',width:'110px',textAlign:'center',fontSize:'32px',color:C.ink}));
const BASE=900,BS=100;
const T=anim({k:0,tu:0,sx:1,sy:1,tv:0},o=>{
  const Mp=prod(o.tu,o.sx,o.sy,o.tv);const X={a:(1-o.k)*Mp.a+o.k*M.a,b:(1-o.k)*Mp.b+o.k*M.b,c:(1-o.k)*Mp.c+o.k*M.c,d:(1-o.k)*Mp.d+o.k*M.d};
  G.set(X);circ.setAttribute('points',ptsAttr(P,X,CP));
  fan.forEach(f=>geom(f.a,0,0,...mapv(X,...f.u)));
  geom(a1,0,0,...mapv(X,...v1));geom(a2,0,0,...mapv(X,...v2));
  [o.sx,o.sy].forEach((s,i)=>{const h=Math.max(2,s*BS);gsap.set(bars[i],{top:BASE-h,height:h});gsap.set(barV[i],{top:BASE-h-44});barV[i].textContent=fmt(s,2)})});
tl.to(STAGE,{autoAlpha:1,duration:.8},START.s2);
tl.to(STAGE,{autoAlpha:0,duration:.6},START.s5-.3);
const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'1120px',top:top+'px',width:'760px',textAlign:'center'},o||{}));

/* ============ S1: the promise ============ */
(function(){const S=$('S1'),sid='s1';
  const r=el(S,'abs hid',tex('\\begin{bmatrix}1&0&2\\\\0&3&1\\end{bmatrix}\\begin{bmatrix}x\\\\y\\\\z\\end{bmatrix}=\\begin{bmatrix}x+2z\\\\3y+z\\end{bmatrix}',54),{left:'0',top:'220px',width:'1920px',textAlign:'center'});
  show(r,cue(sid,'rectangular'),.7);
  const n=el(S,'abs hid','a 2 × 3 matrix: 3 numbers in, 2 numbers out, so no eigenvectors',{left:'0',top:'500px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});
  show(n,cue(sid,'cannot'),.5);
  const f=el(S,'abs hid',tex('M=U\\,\\Sigma\\,V^{\\top}',84),{left:'0',top:'590px',width:'1920px',textAlign:'center'});
  show(f,cue(sid,'decomposition'),.7);
  const chips=[['rotate',C.blue,'rotation'],['stretch',C.yellow,'stretch'],['rotate',C.blue,'another']].map(([t,c,w],i)=>{
    const d=el(S,'chip',t,{left:(560+i*300)+'px',top:'800px',borderColor:c,color:c});show(d,cue(sid,w),.5);return d});
  sceneInOut(sid);
})();

/* ============ S2: a circle always becomes an ellipse ============ */
(function(){const S=$('S2'),sid='s2';
  T.to(cue(sid,'always')-.4,2.6,{k:1});
  const svg=layerSvg(S);const g=clipTo(svg,40,90,1060,960);
  const u1=[Math.cos(TU*d2r),Math.sin(TU*d2r)],u2=[-Math.sin(TU*d2r),Math.cos(TU*d2r)];
  const ax=(u,s,col)=>{const p=P(-s*u[0],-s*u[1]),q=P(s*u[0],s*u[1]);return svgEl('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:col,'stroke-width':5,'stroke-dasharray':'14 9',style:'opacity:0;visibility:hidden'},g)};
  const L1=ax(u1,S1,C.yellow),L2=ax(u2,S2,C.pink);
  fadeIn(L1,cue(sid,'longest'),.5);fadeIn(L2,cue(sid,'shortest'),.5);
  const l1=el(S,'lbl',tex('\\sigma_1',48),{color:C.yellow});place(l1,P(...u1.map(x=>x*S1))[0]+40,P(...u1.map(x=>x*S1))[1]-30);
  const l2=el(S,'lbl',tex('\\sigma_2',48),{color:C.pink});place(l2,P(...u2.map(x=>x*S2))[0]-40,P(...u2.map(x=>x*S2))[1]-30);
  fadeIn(l1,cue(sid,'first'),.5);fadeIn(l2,cue(sid,'second'),.5);
  const n1=panel(S,'circle → ellipse',260,{fontSize:'56px',fontStyle:'italic'});show(n1,cue(sid,'ellipse'),.5);
  const n2=panel(S,'<span style="color:#f5cf4a">σ₁</span> = longest half-axis: the most stretch',400,{fontSize:'40px'});show(n2,cue(sid,'singular'),.5);
  const n3=panel(S,'<span style="color:#e77fb3">σ₂</span> = shortest half-axis',470,{fontSize:'40px'});show(n3,cue(sid,'second'),.5);
  const n4=panel(S,'the two axes meet at a right angle',600,{fontSize:'40px',fontStyle:'italic',color:C.dim});show(n4,cue(sid,'right'),.5);
  fadeOut([L1,L2,l1,l2],START.s3+.2,.4);
  sceneInOut(sid);
})();

/* ============ S3: rotate, stretch, rotate ============ */
(function(){const S=$('S3'),sid='s3';
  T.to(START[sid]+.2,1.6,{k:0});
  showArrow(a1,START[sid]+.6,.5);showArrow(a2,START[sid]+.6,.5);
  const f=panel(S,'',230);
  f.innerHTML=tex('M=',72)+'<span id="fU" style="display:inline-block;padding:4px 12px;border-radius:12px;border:3px solid transparent">'+tex('U',72)+'</span><span id="fS" style="display:inline-block;padding:4px 12px;border-radius:12px;border:3px solid transparent">'+tex('\\Sigma',72)+'</span><span id="fV" style="display:inline-block;padding:4px 12px;border-radius:12px;border:3px solid transparent">'+tex('V^{\\top}',72)+'</span>';
  show(f,START[sid]+.4,.6);
  const fU=f.querySelector('#fU'),fS=f.querySelector('#fS'),fV=f.querySelector('#fV');
  const box=(e,c,t0,t1)=>{tl.to(e,{borderColor:c,duration:.3},t0);tl.to(e,{borderColor:'rgba(0,0,0,0)',duration:.3},t1)};
  box(fV,C.blue,cue(sid,'first'),cue(sid,'then'));box(fS,C.yellow,cue(sid,'then'),cue(sid,'finally'));box(fU,C.blue,cue(sid,'finally'),cue(sid,'any'));
  const steps=[['1. rotate: special directions onto the axes',cue(sid,'first'),C.blue],['2. stretch along the axes by σ₁, σ₂',cue(sid,'then'),C.yellow],['3. rotate into place',cue(sid,'finally'),C.blue]];
  steps.forEach(([t,tm,c],i)=>{const d=panel(S,t,400+i*80,{fontSize:'38px',fontStyle:'italic',color:c});show(d,tm,.5)});
  T.to(cue(sid,'transpose'),2.4,{tv:TV});
  T.to(cue(sid,'stretches'),2.4,{sx:S1,sy:S2});
  T.to(cue(sid,'u'),2.4,{tu:TU});
  const n=panel(S,'every matrix: these three motions',720,{fontSize:'44px'});show(n,cue(sid,'exactly'),.5);
  const mf=panel(S,'(a rotation may include a mirror flip)',800,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(mf,cue(sid,'mirror'),.5);
  sceneInOut(sid);
})();

/* ============ S4: sorted singular values and low-rank approximation ============ */
(function(){const S=$('S4'),sid='s4';
  fadeIn([...bars,...barL,...barV],cue(sid,'sorted'),.5);
  const h=panel(S,'singular values, largest first',230,{fontSize:'44px',fontStyle:'italic'});show(h,cue(sid,'sorted'),.5);
  T.to(cue(sid,'tiny'),2,{sy:.12});
  T.to(cue(sid,'keeping'),1.6,{sy:0});
  const r1=panel(S,'keep only σ₁: a rank-1 approximation',330,{fontSize:'40px',color:C.yellow});show(r1,cue(sid,'keeping'),.5);
  const st=panel(S,tex('n\\times n\\ \\text{numbers}\\ \\longrightarrow\\ k\\,(2n+1)',44),420,{color:C.ink});show(st,cue(sid,'storing'),.6);
  const ey=panel(S,'Eckart–Young: the top k singular values give the best rank-k approximation',500,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(ey,cue(sid,'eckart'),.6);
  sceneInOut(sid);
})();

/* ============ S5-S6: PCA on a cloud of points ============ */
const PCA=(function(){
  const PP=plane(560,600,62);
  const rnd=seedRand(42);const gauss=()=>{const u=Math.max(rnd(),1e-9),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const th=35*d2r,e1=[Math.cos(th),Math.sin(th)],e2=[-Math.sin(th),Math.cos(th)],mean=[3.4,2.6];
  const pts=[];for(let i=0;i<70;i++){const a=gauss()*2.1,b=gauss()*.42;pts.push([mean[0]+a*e1[0]+b*e2[0],mean[1]+a*e1[1]+b*e2[1]])}
  const mx=pts.reduce((s,p)=>s+p[0],0)/pts.length,my=pts.reduce((s,p)=>s+p[1],0)/pts.length;
  return {PP,pts,mx,my,e1,e2}})();
(function(){const S=$('S5'),sid='s5';
  const {PP,pts,mx,my,e1,e2}=PCA;
  const PL=el($('root'),'layer','');tl.to(PL,{autoAlpha:1,duration:.6},START[sid]);tl.to(PL,{autoAlpha:0,duration:.6},START.s7-.3);
  const svg=layerSvg(PL);
  const g=drawGrid(svg,PP,-7,7,-6,7);g.setAttribute('opacity','.35');
  const xl=el(PL,'lbl','height',{fontSize:'34px',color:C.green,fontStyle:'italic'});place(xl,PP(7,0)[0]-60,PP(0,0)[1]+36);
  const yl=el(PL,'lbl','weight',{fontSize:'34px',color:C.red,fontStyle:'italic'});place(yl,PP(0,0)[0]+70,PP(0,6.6)[1]);
  const dots=pts.map(()=>svgEl('circle',{r:7,fill:C.blue,'fill-opacity':.85,style:'opacity:0;visibility:hidden'},svg));
  const mean=svgEl('circle',{r:12,fill:'none',stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  const pc1=mkArrow(svg,PP,C.yellow,8,tex('\\text{PC}_1',44),40,-30,PL);const pc2=mkArrow(svg,PP,C.pink,6);
  const pcl=svgEl('line',{stroke:C.yellow,'stroke-width':3,'stroke-dasharray':'10 10',style:'opacity:0;visibility:hidden'},svg);
  const dropG=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const drops=pts.map(()=>svgEl('line',{stroke:C.dim,'stroke-width':1.5,'stroke-dasharray':'4 5'},dropG));
  const st=anim({c:0,p:0},o=>{
    const ox=o.c*mx,oy=o.c*my;
    pts.forEach((q,i)=>{const x=q[0]-ox,y=q[1]-oy;const cx=x-o.c*0,cy=y;
      const s=(x-(1-o.c)*mx)*e1[0]+(y-(1-o.c)*my)*e1[1];const fx=(1-o.c)*mx+s*e1[0],fy=(1-o.c)*my+s*e1[1];
      const px=x+(fx-x)*o.p,py=y+(fy-y)*o.p;const [X,Y]=PP(px,py);dots[i].setAttribute('cx',X);dots[i].setAttribute('cy',Y);
      const [A,B]=PP(x,y),[F,H]=PP(fx,fy);drops[i].setAttribute('x1',A);drops[i].setAttribute('y1',B);drops[i].setAttribute('x2',F);drops[i].setAttribute('y2',H)});
    const [m1,m2]=PP(mx-ox,my-oy);mean.setAttribute('cx',m1);mean.setAttribute('cy',m2);
    const c0=[(1-o.c)*mx,(1-o.c)*my];
    geom(pc1,c0[0],c0[1],c0[0]+2.6*e1[0],c0[1]+2.6*e1[1]);geom(pc2,c0[0],c0[1],c0[0]+.9*e2[0],c0[1]+.9*e2[1]);
    const a=PP(c0[0]-7*e1[0],c0[1]-7*e1[1]),b=PP(c0[0]+7*e1[0],c0[1]+7*e1[1]);pcl.setAttribute('x1',a[0]);pcl.setAttribute('y1',a[1]);pcl.setAttribute('x2',b[0]);pcl.setAttribute('y2',b[1])});
  PCA.st=st;PCA.dropG=dropG;PCA.pcl=pcl;
  sceneInOut(sid);
  fadeIn([xl,yl],cue(sid,'height'),.4);
  tl.to(dots,{autoAlpha:1,duration:.25,stagger:.02},cue(sid,'cloud'));
  fadeIn(mean,cue(sid,'subtract'),.4);
  st.to(cue(sid,'average'),2,{c:1});
  showArrow(pc1,cue(sid,'right'),.4);showArrow(pc2,cue(sid,'right')+.3,.4);
  const svd=el(S,'abs hid',tex('X_{\\text{centred}}=U\\,\\Sigma\\,V^{\\top}',54),{left:'1140px',top:'280px',width:'740px',textAlign:'center'});show(svd,cue(sid,'decomposition'),.6);
  const n1=el(S,'note','first right singular vector = direction of greatest spread',{left:'1180px',top:'420px',width:'680px',textAlign:'center',fontSize:'40px',color:C.yellow});show(n1,cue(sid,'spread'),.5);
  const n2=el(S,'abs hid','first principal component',{left:'1140px',top:'580px',width:'740px',textAlign:'center',fontSize:'60px'});show(n2,cue(sid,'principal',2),.6);
})();
(function(){const S=$('S6'),sid='s6';
  const st=PCA.st;
  fadeIn(PCA.pcl,cue(sid,'direction'),.4);fadeIn(PCA.dropG,cue(sid,'direction'),.4);
  st.to(cue(sid,'shadow'),2.4,{p:1});
  fadeOut(PCA.dropG,cue(sid,'turns'),.6);
  const n=el(S,'note','2 numbers per person → 1',{left:'1180px',top:'720px',width:'680px',textAlign:'center',fontSize:'48px',fontStyle:'normal'});show(n,cue(sid,'two'),.5);
  const n2=el(S,'note','little is lost: the cloud was thin the other way',{left:'1180px',top:'800px',width:'680px',textAlign:'center',fontSize:'36px',color:C.dim});show(n2,cue(sid,'thin'),.5);
  sceneInOut(sid);
})();

/* ============ S7: LoRA ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const box=(x,y,w,h,col,lab)=>{const d=el(S,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',height:h+'px',border:`4px solid ${col}`,background:col+'26',borderRadius:'6px'});
    const l=el(S,'abs hid','',{left:x+'px',top:(y+h/2-34)+'px',width:w+'px',textAlign:'center',color:col});l.innerHTML=lab;return [d,l]};
  const W=box(160,250,420,420,C.blue,tex('W',64));
  const plus=sym(S,'+',640,470,80);
  const B=box(740,250,56,420,C.yellow,tex('B',40));
  const Am=box(830,432,420,56,C.yellow,tex('A',40));
  const dW=el(S,'abs hid','',{left:'560px',top:'720px',width:'860px',textAlign:'center',fontSize:'40px',color:C.yellow});dW.innerHTML=tex('\\Delta W=BA,\\ \\ \\text{rank}\\ r\\ll d',46);
  fadeIn(W,cue(sid,'huge'),.6);
  const wl=el(S,'abs hid',tex('d\\times d',40),{left:'160px',top:'690px',width:'420px',textAlign:'center',color:C.dim});fadeIn(wl,cue(sid,'huge'),.6);
  show(plus,cue(sid,'learns'),.4);fadeIn(B,cue(sid,'thin'),.5);fadeIn(Am,cue(sid,'thin')+.3,.5);show(dW,cue(sid,'product'),.6);
  const n=el(S,'note','the change lives in a few directions',{left:'1320px',top:'400px',width:'540px',textAlign:'center'});show(n,cue(sid,'few'),.6);
  const done=el(S,'abs hid','linear algebra toolkit: complete',{left:'0',top:'840px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.green});show(done,cue(sid,'completes'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 2.1 &nbsp;derivative: slope of a zoomed-in curve',{top:'940px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next'),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
