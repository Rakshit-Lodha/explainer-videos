  order.forEach((i,k)=>{const dx=X[i][0]*w[i]*2.2,dy=X[i][1]*w[i]*2.2;arrowTo(arr[i],cue(sid,'added')+k*.18,.7,{x0:cx,y0:cy,x1:cx+dx,y1:cy+dy});cx+=dx;cy+=dy});
  const out=mkArrow(svg,P,C.pink,7,'<span style="font-size:34px;font-style:italic">new <span style="color:#f5cf4a">it</span></span>',70,-10,S);setArrow(out,{x0:0,y0:0,x1:0,y1:0});
  grow(out,cue(sid,'paint')-.3,.9,cx,cy);
  // paint mix bar
  const px0=1180,pw=600;let acc=0;const segs=order.map(i=>{const s=el(S,'abs hid','',{left:(px0+acc*pw)+'px',top:'470px',width:(w[i]*pw+.5)+'px',height:'70px',background:i===1?C.blue:i===IT?C.yellow:'#4a5563'});acc+=w[i];return s});
  fadeIn(segs,cue(sid,'mixing'),.4,.1);
  const pl=label(S,'the mix: mostly <span style="color:#58c4dd">cat</span> (and <span style="color:#f5cf4a">it</span> itself)',1480,590,{fs:32,italic:true});show(pl,cue(sid,'mostly'),.5);
  const sl=label(S,'same length as the input vector, now carrying context',1480,760,{fs:32,italic:true,color:C.pink});sl.style.whiteSpace='normal';sl.style.width='620px';sl.style.textAlign='center';
  show(sl,cue(sid,'output'),.5);
  sceneInOut(sid);
})();

/* ============ S6: all tokens at once: X Xᵀ, softmax rows, A X ============ */
(function(){const S=$('S6');const sid='s6';
  const ch=56,cy=580;
  const Xm=matrix(S,330,cy,8,3,{cw:66,ch,vals:X.map(r=>r.map(v=>fmt(v,1))),fs:20,color:C.blue});
  const rl=W.map((w,i)=>label(S,w,170,cy-4*ch+ch/2+i*ch,{fs:22,mono:true,color:TC(i)}));
  show([Xm.box,...rl],cue(sid,'stack'),.6);
  const xl=label(S,'X &nbsp;(T × d)',330,330,{fs:30,mono:true,color:C.blue});show(xl,cue(sid,'x'),.4);
  const Sm=matrix(S,820,cy,8,8,{cw:62,ch,vals:SC.map(r=>r.map(v=>fmt(v,1))),heat:SC.map(r=>r.map(v=>(v+1.4)/3.2)),fs:18,color:C.teal});
  const sl=label(S,'X Xᵀ &nbsp;(T × T)',820,330,{fs:30,mono:true,color:C.teal});
  show([Sm.box,sl],cue(sid,'transpose'),.6);

  const rh=matHL(S,Sm,5,0,5,7,C.yellow);fadeIn(rh,cue(sid,'looking'),.4);fadeOut(rh,cue(sid,'column')+.8,.3);
  const chl=matHL(S,Sm,0,1,7,1,C.blue);fadeIn(chl,cue(sid,'looked'),.4);fadeOut(chl,cue(sid,'softmax')-.2,.3);
  const Am=matrix(S,1370,cy,8,8,{cw:62,ch,vals:AW.map(r=>r.map(v=>v.toFixed(2).slice(1))),heat:AW.map(r=>r.map(v=>v/.4)),fs:17,color:C.yellow});
  const al=label(S,'A = softmax by row',1370,330,{fs:30,mono:true,color:C.yellow});
  const sym1=sym(S,'→',1095,cy,48);
  show([sym1],cue(sid,'softmax'),.4);
  Am.cells.forEach((r,i)=>tl.fromTo(r,{autoAlpha:0},{autoAlpha:1,duration:.3},cue(sid,'row',3)+i*.12));
  tl.set(Am.box,{autoAlpha:1},cue(sid,'softmax'));
  show(al,cue(sid,'softmax'),.4);
  const r5=matHL(S,Am,5,0,5,7,C.yellow);fadeIn(r5,cue(sid,'sums'),.3);
  const s1=label(S,'Σ = 1',1370+4*62+50,cy-4*ch+5.5*ch,{fs:24,mono:true,color:C.yellow});show(s1,cue(sid,'sums'),.3);
  fadeOut([r5,s1],cue(sid,'multiplying',2),.3);
  const OUT=AW.map(r=>[0,1,2].map(k=>r.reduce((s,wv,j)=>s+wv*X[j][k],0)));
  const Om=matrix(S,1770,cy,8,3,{cw:58,ch,vals:OUT.map(r=>r.map(v=>fmt(v,1))),fs:18,color:C.pink});
  const ol=label(S,'A X &nbsp;(T × d)',1770,330,{fs:30,mono:true,color:C.pink});
  const sym2=sym(S,'→',1645,cy,48);
  show([sym2,Om.box,ol],cue(sid,'produces'),.6);
  const same=label(S,'same shape as X',1770,cy+4*ch+40,{fs:28,italic:true,color:C.pink});show(same,cue(sid,'shape'),.4);
  const eq=el(S,'abs hid',tex('\\text{out}=\\operatorname{softmax}\\!\\big(XX^{\\top}\\big)\\,X',54),{left:'560px',top:'150px'});show(eq,cue(sid,'two'),.6);
  sceneInOut(sid);
})();

/* ============ S7: the flaw: everyone looks at themselves ============ */
(function(){const S=$('S7');const sid='s7';

(function(){const S=$('S8');const sid='s8';
