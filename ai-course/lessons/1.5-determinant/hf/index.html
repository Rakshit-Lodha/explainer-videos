function grow(a,time,d,x1,y1){setArrow(a,{x1:a.st.x0,y1:a.st.y0});showArrow(a,time,.25);arrowTo(a,time,d,{x1,y1},'power2.out')}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}

/* ---- helpers added for lessons 1.5-2.6 ---- */
/* anim(init, fn): a state object driven by tweens; fn(state) redraws everything that depends on it.
   Calls to .to() must be made in time order, like arrowTo. */
function anim(init,fn){const a={st:{...init},fn};fn({...a.st});
  a.to=(time,d,vals,ease)=>{const from={...a.st},o={...from},tgt={...from,...vals};
    tl.to(o,{...tgt,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time);a.st=tgt;return a};
  return a}
/* 2x2 matrix display with brackets; cells[r][c] are divs whose text can be rewritten */
function mat2(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||60,cw=o.cw||150,rowH=fs*1.35,pad=fs*.25,W=cw*2+40,H=rowH*2+pad*2;
  const box=el(parent,'m2'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cols=o.colors||[C.ink,C.ink];
  const cells=[0,1].map(r=>[0,1].map(c=>el(box,'cell',vals[r][c],{left:(20+c*cw)+'px',top:(pad+r*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:cols[c]})));
  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

/* ============ persistent stage s1-s7: a plane that a matrix transforms, the unit tile, î and ĵ ============ */
const STAGE=$('STAGE');
const P=plane(600,560,95);
const ssvg=layerSvg(STAGE);
const cg=clipTo(ssvg,40,90,1120,960);
const bg=drawGrid(cg,P,-6,6,-5,5);bg.setAttribute('opacity','.28');
const G=tGrid(cg,P,14);
const extra=[[2,1],[-3,2],[-2,-2],[1,-3]].map(([x,y])=>({x,y,el:svgEl('polygon',{fill:C.yellow,'fill-opacity':.18,stroke:C.yellow,'stroke-width':2,style:'opacity:0;visibility:hidden'},cg)}));
const blobPts=[];for(let i=0;i<60;i++){const t=i/60*Math.PI*2,r=.48*(1+.22*Math.sin(3*t)+.12*Math.cos(5*t));blobPts.push([-1+r*Math.cos(t),-1.4+r*Math.sin(t)])}
const blob=svgEl('polygon',{fill:C.pink,'fill-opacity':.35,stroke:C.pink,'stroke-width':3,style:'opacity:0;visibility:hidden'},cg);
const tile=svgEl('polygon',{fill:C.yellow,'fill-opacity':.32,stroke:C.yellow,'stroke-width':3,style:'opacity:0;visibility:hidden'},cg);
const dots=[[2,-2,C.blue],[0,2,C.pink]].map(([x,y,col])=>({x,y,el:svgEl('circle',{r:13,fill:col,stroke:'#0e1116','stroke-width':3,style:'opacity:0;visibility:hidden'},cg)}));
const ih=mkArrow(cg,P,C.green,7,tex('\\hat{\\imath}',50),26,34,STAGE);
const jh=mkArrow(cg,P,C.red,7,tex('\\hat{\\jmath}',50),-30,-26,STAGE);
const origin=svgEl('circle',{cx:P(0,0)[0],cy:P(0,0)[1],r:8,fill:C.ink},cg);
const areaLbl=el(STAGE,'lbl mono','1',{fontSize:'40px',color:C.ink});areaLbl.setAttribute('data-layout-allow-overlap','');
/* right panel: the matrix (columns coloured like î and ĵ) and its determinant */
const MX=mat2(STAGE,1500,300,[['1.0','0.0'],['0.0','1.0']],{fs:58,cw:150,colors:[C.green,C.red]});
const detRow=el(STAGE,'abs hid','',{left:'1180px',top:'470px',width:'640px',textAlign:'center',fontSize:'60px'});
detRow.innerHTML='<span style="font-style:italic">det</span> <span class="mono">= <span id="detv" style="color:#f5cf4a">1.00</span></span>';
const detv=detRow.querySelector('#detv');
const TM=anim({a:1,b:0,c:0,d:1},o=>{
  G.set(o);
  tile.setAttribute('points',ptsAttr(P,o,[[0,0],[1,0],[1,1],[0,1]]));
  extra.forEach(t=>t.el.setAttribute('points',ptsAttr(P,o,[[t.x,t.y],[t.x+1,t.y],[t.x+1,t.y+1],[t.x,t.y+1]])));
  blob.setAttribute('points',ptsAttr(P,o,blobPts));
  dots.forEach(p=>{const [x,y]=P(...mapv(o,p.x,p.y));p.el.setAttribute('cx',x);p.el.setAttribute('cy',y)});
  geom(ih,0,0,o.a,o.c);geom(jh,0,0,o.b,o.d);
  const det=o.a*o.d-o.b*o.c,neg=det<-.005,col=neg?C.pink:C.yellow;
  tile.setAttribute('fill',col);tile.setAttribute('stroke',col);
  detv.textContent=fmt(det,2);detv.style.color=col;
  MX.cells[0][0].textContent=fmt(o.a);MX.cells[1][0].textContent=fmt(o.c);MX.cells[0][1].textContent=fmt(o.b);MX.cells[1][1].textContent=fmt(o.d);
  const [cx,cy]=P(...mapv(o,.5,.5));gsap.set(areaLbl,{x:cx,y:cy,xPercent:-50,yPercent:-50});areaLbl.textContent=fmt(Math.abs(det),1)});
tl.to(STAGE,{autoAlpha:1,duration:.8},at('s1',0)+.2);
tl.to(STAGE,{autoAlpha:0,duration:.6},START.s8-.3);

/* ============ S1: some maps spread space, some squeeze it ============ */
(function(){const S=$('S1'),sid='s1';
  TM.to(cue(sid,'spread'),1.6,{a:1.5,b:.4,c:.2,d:1.3});
  TM.to(cue(sid,'squeeze'),1.6,{a:.6,b:.2,c:-.1,d:.55});
  TM.to(cue(sid,'so'),1.4,{a:1,b:0,c:0,d:1});
  const n1=el(S,'note','spread out',{left:'1260px',top:'380px',color:C.blue});
  const n2=el(S,'note','squeezed together',{left:'1260px',top:'470px',color:C.blue});
  show(n1,cue(sid,'spread'),.5);show(n2,cue(sid,'squeeze'),.5);
  const q=el(S,'note','one number: <span style="font-style:normal">by how much?</span>',{left:'1260px',top:'600px',width:'600px'});
  show(q,cue(sid,'single'),.6);
  const t=el(S,'abs hid','the determinant',{left:'1180px',top:'760px',width:'700px',textAlign:'center',fontSize:'84px',color:C.yellow});
  show(t,cue(sid,'determinant'),.8);
  sceneInOut(sid);
})();

/* ============ S2: the unit tile follows the grid; its sides are the columns ============ */
(function(){const S=$('S2'),sid='s2';
  fadeIn(tile,cue(sid,'unit'),.6);
  showArrow(ih,cue(sid,'i'),.4);showArrow(jh,cue(sid,'j'),.4);
  fadeIn(areaLbl,cue(sid,'area'),.4);
  show(MX.box,cue(sid,'matrix'),.6);
  TM.to(cue(sid,'acts'),2.2,{a:2,b:1,c:.5,d:1.5});
  const hc=[0,1].map(c=>el(S,'hl','',{left:(MX.cx-MX.W/2+20+c*MX.cw+8)+'px',top:(MX.cy-MX.H/2+4)+'px',width:(MX.cw-16)+'px',height:(MX.H-8)+'px',borderColor:c?C.red:C.green,boxShadow:`0 0 24px ${c?C.red:C.green}66`}));
  fadeIn(hc[0],cue(sid,'columns'),.4);fadeIn(hc[1],cue(sid,'columns')+.4,.4);fadeOut(hc,cue(sid,'because'),.4);
  const cl=el(S,'note','sides = columns',{left:'1340px',top:'430px',fontSize:'38px',color:C.dim});
  show(cl,cue(sid,'columns'),.5);fadeOut(cl,cue(sid,'because'),.4);
  fadeIn(extra.map(t=>t.el),cue(sid,'every'),.6,.12);
  fadeIn(detRow,cue(sid,'one',2),.6);
  const n=el(S,'note','every tile scales the same way',{left:'1220px',top:'640px',width:'640px',textAlign:'center'});
  show(n,cue(sid,'same'),.6);
  sceneInOut(sid);
})();

/* ============ S3: a stretch along the axes multiplies every area by six ============ */
(function(){const S=$('S3'),sid='s3';
  fadeOut(extra.map(t=>t.el),START[sid],.5);
  TM.to(START[sid]+.2,1.4,{a:1,b:0,c:0,d:1});
  TM.to(cue(sid,'horizontal'),1.6,{a:3});
  TM.to(cue(sid,'vertical'),1.6,{d:2});
  const a6=el(S,'note','area of the tile: 1 → 6',{left:'1220px',top:'640px',width:'640px',textAlign:'center'});
  show(a6,cue(sid,'six'),.5);fadeOut(a6,cue(sid,'shape')+.2,.4);
  TM.to(cue(sid,'shape'),1.2,{a:1,d:1});
  fadeIn(blob,cue(sid,'shape'),.6);
  TM.to(cue(sid,'multiplied'),1.8,{a:3,d:2});
  const b6=el(S,'note','<span style="color:#e77fb3">any shape</span>: area × 6',{left:'1220px',top:'640px',width:'640px',textAlign:'center'});
  show(b6,cue(sid,'multiplied'),.5);
  const dough=el(S,'note','every patch, the same factor',{left:'1220px',top:'740px',width:'640px',textAlign:'center',color:C.dim,fontSize:'38px'});
  show(dough,cue(sid,'every'),.6);
  sceneInOut(sid);
})();

/* ============ S4: a shear keeps base and height, so the area stays one ============ */
(function(){const S=$('S4'),sid='s4';
  fadeOut(blob,START[sid],.5);
  TM.to(START[sid]+.2,1.4,{a:1,b:0,c:0,d:1});
  TM.to(cue(sid,'slides'),2.4,{b:1});
  const svg=layerSvg(S);
  const base=svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1]+2,x2:P(1,0)[0],y2:P(1,0)[1]+2,stroke:C.teal,'stroke-width':9,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},svg);
  const ht=svgEl('line',{x1:P(1.5,0)[0],y1:P(1.5,0)[1],x2:P(1.5,1)[0],y2:P(1.5,1)[1],stroke:C.teal,'stroke-width':5,'stroke-dasharray':'10 8',style:'opacity:0;visibility:hidden'},svg);
  const bl=el(S,'lbl','base 1',{fontSize:'34px',color:C.teal,fontStyle:'italic'});place(bl,P(.5,0)[0],P(0,0)[1]+40);
  const hl=el(S,'lbl','height 1',{fontSize:'34px',color:C.teal,fontStyle:'italic'});place(hl,P(1.5,0)[0]+90,P(0,.5)[1]);
  fadeIn([base,bl],cue(sid,'base'),.4);fadeIn([ht,hl],cue(sid,'height'),.4);
  const n=el(S,'note','looks different, same area',{left:'1220px',top:'640px',width:'640px',textAlign:'center'});
  show(n,cue(sid,'different'),.5);
  const d1=el(S,'note','shear: det = 1',{left:'1220px',top:'740px',width:'640px',textAlign:'center',color:C.yellow});
  show(d1,cue(sid,'determinant'),.5);
  sceneInOut(sid);
})();

/* ============ S5: ad − bc ============ */
(function(){const S=$('S5'),sid='s5';
  TM.to(cue(sid,'general'),2,{a:3,b:1,c:1,d:2});
  const f=el(S,'abs hid',tex('\\det\\begin{bmatrix}a&b\\\\c&d\\end{bmatrix}=ad-bc',56),{left:'1180px',top:'610px',width:'680px',textAlign:'center'});
  show(f,cue(sid,'works'),.7);
  const svg=layerSvg(S);
  const rect=svgEl('polygon',{points:ptsAttr(P,{a:1,b:0,c:0,d:1},[[0,0],[3,0],[3,2],[0,2]]),fill:'none',stroke:C.blue,'stroke-width':4,'stroke-dasharray':'12 9',style:'opacity:0;visibility:hidden'},svg);
  const rl=el(S,'lbl',tex('ad=3\\cdot 2=6',40),{color:C.blue});place(rl,P(1.5,0)[0],P(0,0)[1]+48);
  fadeIn([rect,rl],cue(sid,'story'),.6);
  const bc=el(S,'note','',{left:'1180px',top:'790px',width:'680px',textAlign:'center',fontStyle:'normal'});
  bc.innerHTML=tex('6-bc=6-1\\cdot 1=5',46);
  show(bc,cue(sid,'correction'),.6);
  fadeOut([rect,rl],START.s6,.5);
  sceneInOut(sid);
})();

/* ============ S6: columns on one line, area zero, no way back ============ */
(function(){const S=$('S6'),sid='s6';
  fadeIn(dots.map(p=>p.el),cue(sid,'columns'),.5);
  fadeOut(areaLbl,cue(sid,'columns'),.4);
  TM.to(cue(sid,'further'),2.2,{a:2,b:1,c:1,d:.8});
  TM.to(cue(sid,'sliver'),1.2,{d:.6});
  TM.to(cue(sid,'segment'),1.2,{d:.5});
  const z=el(S,'note','det = 0',{left:'1220px',top:'610px',width:'640px',textAlign:'center',color:C.yellow,fontSize:'52px',fontStyle:'normal'});
  show(z,cue(sid,'zero'),.5);
  const crush=el(S,'note','the plane is crushed onto a line',{left:'1220px',top:'700px',width:'640px',textAlign:'center'});
  show(crush,cue(sid,'crushed'),.5);
  tl.to(dots.map(p=>p.el),{attr:{r:20},duration:.35,yoyo:true,repeat:3,ease:'sine.inOut'},cue(sid,'many'));
  const inv=el(S,'chip','no inverse',{left:'1410px',top:'850px',borderColor:C.red,color:C.red});
  show(inv,cue(sid,'inverse'),.5);
  fadeOut(dots.map(p=>p.el),START.s7,.4);
  sceneInOut(sid);
})();

/* ============ S7: through zero to negative: the tile flips ============ */
(function(){const S=$('S7'),sid='s7';
  TM.to(cue(sid,'passes'),3,{d:-.5});
  const neg=el(S,'note','det &lt; 0',{left:'1220px',top:'610px',width:'640px',textAlign:'center',color:C.pink,fontSize:'52px',fontStyle:'normal'});
  show(neg,cue(sid,'negative'),.5);
  const fl=el(S,'note','the tile is flipped over',{left:'1220px',top:'700px',width:'640px',textAlign:'center'});
  show(fl,cue(sid,'flipped'),.5);
  const cw=el(S,'note','ĵ now clockwise from î',{left:'1220px',top:'780px',width:'640px',textAlign:'center',color:C.dim,fontSize:'38px'});
  show(cw,cue(sid,'clockwise'),.5);
  const sz=el(S,'abs hid','',{left:'1180px',top:'880px',width:'720px',textAlign:'center',fontSize:'40px'});
  sz.innerHTML='<span style="color:#e77fb3">sign</span> = orientation &nbsp;·&nbsp; <span style="color:#f5cf4a">size</span> = stretch';
  show(sz,cue(sid,'sign'),.6);
  sceneInOut(sid);
})();

/* ============ S8: composition multiplies determinants; the LLM link ============ */
(function(){const S=$('S8'),sid='s8';
  const svg=layerSvg(S);const u=80;
  const shapes=[{cx:400,cols:[[1,0],[0,1]],a:'1'},{cx:880,cols:[[2,0],[.5,1]],a:'2'},{cx:1450,cols:[[2,0],[1,3]],a:'6'}];
  const by=500;
  const polys=shapes.map((s,k)=>{const [[ax,ay],[bx,by2]]=s.cols;const pts=[[0,0],[ax,ay],[ax+bx,ay+by2],[bx,by2]];
    const w=Math.max(ax+bx,ax)*u;const x0=s.cx-w/2;
    const p=svgEl('polygon',{points:pts.map(([x,y])=>`${x0+x*u},${by-y*u}`).join(' '),fill:C.yellow,'fill-opacity':.3,stroke:C.yellow,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
    const l=el(S,'lbl mono','area '+s.a,{fontSize:'36px',color:C.ink});place(l,s.cx,by+50);
    return [p,l]});
  const ar=[[530,730,'A','det 2'],[1060,1260,'B','det 3']].map(([x0,x1,m,d])=>{
    const a=mkArrow(svg,(x,y)=>[x,y],C.dim,5);setArrow(a,{x0,y0:by-40,x1,y1:by-40});
    const l=el(S,'lbl','',{fontSize:'34px',color:C.ink});l.innerHTML=tex(m,40)+` <span style="color:#7f8b99;font-style:italic">${d}</span>`;place(l,(x0+x1)/2,by-90);return [a,l]});
  sceneIn(sid);
  fadeIn(polys[0],cue(sid,'apply'),.5);
  showArrow(ar[0][0],cue(sid,'one',2),.4);fadeIn(ar[0][1],cue(sid,'one',2),.4);fadeIn(polys[1],cue(sid,'one',2)+.3,.5);
  showArrow(ar[1][0],cue(sid,'another'),.4);fadeIn(ar[1][1],cue(sid,'another'),.4);fadeIn(polys[2],cue(sid,'another')+.3,.5);
  const f=el(S,'abs hid',tex('\\det(BA)=\\det(B)\\,\\det(A)',60),{left:'0',top:'640px',width:'1920px',textAlign:'center'});
  show(f,cue(sid,'product'),.7);
  const n1=el(S,'note','det ≈ 0: a layer crushes a direction flat and information is lost',{left:'0',top:'790px',width:'1920px',textAlign:'center',fontSize:'40px'});
  show(n1,cue(sid,'near'),.6);
  const n2=el(S,'note','low-rank updates flatten on purpose',{left:'0',top:'860px',width:'1920px',textAlign:'center',fontSize:'40px',color:C.dim});
  show(n2,cue(sid,'low'),.6);
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.6 &nbsp;dot product and projection',{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
})();

window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
