  const cells=[0,1].map(r=>[0,1].map(c=>el(box,'cell',vals[r][c],{left:(20+c*cw)+'px',top:(pad+r*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:cols[c]})));
  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

/* ============ persistent stage s2-s6: v, w, the line through w and v's shadow on it ============ */
const STAGE=$('STAGE');
const OX=560,OY=600,U=105;let Z=1;
const P=(x,y)=>[OX+U*Z*x,OY-U*Z*y];
const ssvg=layerSvg(STAGE);
const cg=clipTo(ssvg,40,90,1080,960);
const G=tGrid(cg,P,16,{op:.4});
const lineW=svgEl('line',{stroke:C.dim,'stroke-width':3,'stroke-dasharray':'4 10','stroke-linecap':'round',style:'opacity:0;visibility:hidden'},cg);
const shadow=svgEl('line',{stroke:C.teal,'stroke-width':12,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},cg);
const drop=svgEl('line',{stroke:C.ink,'stroke-width':3,'stroke-dasharray':'9 8',style:'opacity:0;visibility:hidden'},cg);
const rmark=svgEl('polyline',{fill:'none',stroke:C.ink,'stroke-width':2.5,style:'opacity:0;visibility:hidden'},cg);
const ucirc=svgEl('circle',{fill:'none',stroke:C.dim,'stroke-width':2.5,'stroke-dasharray':'6 8',style:'opacity:0;visibility:hidden'},cg);
const arc=svgEl('polyline',{fill:'none',stroke:C.yellow,'stroke-width':4,style:'opacity:0;visibility:hidden'},cg);
const thL=el(STAGE,'lbl',tex('\\theta',42),{color:C.yellow});thL.setAttribute('data-layout-allow-overlap','');
const wA=mkArrow(cg,P,C.yellow,8,tex('\\vec{w}',54),30,40,STAGE);
const vA=mkArrow(cg,P,C.blue,8,tex('\\vec{v}',54),-34,-30,STAGE);
svgEl('circle',{cx:OX,cy:OY,r:8,fill:C.ink},cg);
cg.appendChild(shadow);shadow.setAttribute('stroke-opacity','.85');cg.appendChild(drop);cg.appendChild(rmark);
/* readouts */
const RO=el(STAGE,'abs hid','',{left:'1190px',top:'330px',width:'680px',fontSize:'50px',lineHeight:'86px'});
RO.innerHTML='<div><span style="color:#5cd0b3">shadow</span><span class="mono" style="position:absolute;left:330px" id="r1">0.00</span></div>'+
 '<div><span style="color:#f5cf4a">|w|</span><span class="mono" style="position:absolute;left:330px" id="r2">0.00</span></div>'+
 '<div style="border-top:2px solid #7f8b99;margin-top:6px"><span>v · w</span><span class="mono" style="position:absolute;left:330px" id="r3">0.00</span></div>';
const r1=RO.querySelector('#r1'),r2=RO.querySelector('#r2'),r3=RO.querySelector('#r3');
const d2r=Math.PI/180;
const ST=anim({ang:45,r:Math.SQRT2*2,wang:18.435,wr:Math.sqrt(10),z:1},o=>{
  Z=o.z;G.set({a:o.z,b:0,c:0,d:o.z});
  const ux=Math.cos(o.wang*d2r),uy=Math.sin(o.wang*d2r);
  const vx=o.r*Math.cos(o.ang*d2r),vy=o.r*Math.sin(o.ang*d2r);
  const s=vx*ux+vy*uy,fx=s*ux,fy=s*uy;
  geom(wA,0,0,o.wr*ux,o.wr*uy);geom(vA,0,0,vx,vy);
  const L0=P(-8*ux,-8*uy),L1=P(9*ux,9*uy);
  lineW.setAttribute('x1',L0[0]);lineW.setAttribute('y1',L0[1]);lineW.setAttribute('x2',L1[0]);lineW.setAttribute('y2',L1[1]);
  const p0=P(0,0),pf=P(fx,fy),pv=P(vx,vy);
  shadow.setAttribute('x1',p0[0]);shadow.setAttribute('y1',p0[1]);shadow.setAttribute('x2',pf[0]);shadow.setAttribute('y2',pf[1]);
  shadow.setAttribute('stroke',s<-.01?C.pink:C.teal);
  drop.setAttribute('x1',pv[0]);drop.setAttribute('y1',pv[1]);drop.setAttribute('x2',pf[0]);drop.setAttribute('y2',pf[1]);
  const px=vx-fx,py=vy-fy,pl=Math.hypot(px,py)||1,a=.22/o.z,nx=px/pl*a,ny=py/pl*a,bx=-ux*a*Math.sign(s||1),by=-uy*a*Math.sign(s||1);
  rmark.setAttribute('points',[P(fx+nx,fy+ny),P(fx+nx+bx,fy+ny+by),P(fx+bx,fy+by)].map(p=>p.join(',')).join(' '));
  ucirc.setAttribute('cx',p0[0]);ucirc.setAttribute('cy',p0[1]);ucirc.setAttribute('r',U*o.z);
  const ar=.42,pts=[];for(let i=0;i<=24;i++){const t=(o.wang+(o.ang-o.wang)*i/24)*d2r;pts.push(P(ar*Math.cos(t),ar*Math.sin(t)).join(','))}
  arc.setAttribute('points',pts.join(' '));
  const mid=(o.wang+o.ang)/2*d2r;gsap.set(thL,{x:P(.7*Math.cos(mid),0)[0],y:P(0,.7*Math.sin(mid))[1],xPercent:-50,yPercent:-50});
  r1.textContent=fmt(s,2);r2.textContent=fmt(o.wr,2);r3.textContent=fmt(s*o.wr,2);
  r1.style.color=s<-.01?C.pink:C.ink});
tl.to(STAGE,{autoAlpha:1,duration:.8},START.s2);
tl.to(STAGE,{autoAlpha:0,duration:.6},START.s7-.3);

/* ============ S1: the recipe he knows, and the promise of a picture ============ */
(function(){const S=$('S1'),sid='s1';
  const f1=el(S,'abs hid',tex('\\vec v\\cdot\\vec w=v_1w_1+v_2w_2+\\dots+v_nw_n',64),{left:'0',top:'300px',width:'1920px',textAlign:'center'});
  show(f1,cue(sid,'multiply'),.7);
  const f2=el(S,'abs hid',tex('\\cos\\theta=\\dfrac{\\vec v\\cdot\\vec w}{|\\vec v|\\,|\\vec w|}',64),{left:'0',top:'460px',width:'1920px',textAlign:'center',color:C.dim});
  show(f2,cue(sid,'cosine'),.7);
  const t=el(S,'abs hid','the picture: a <span style="color:#5cd0b3">shadow</span>',{left:'0',top:'760px',width:'1920px',textAlign:'center',fontSize:'80px'});
  show(t,cue(sid,'shadow'),.8);
  sceneInOut(sid);
})();

/* ============ S2: a light, a line, a shadow ============ */
(function(){const S=$('S2'),sid='s2';
  const svg=layerSvg(S);const g=clipTo(svg,40,90,1080,960);
  showArrow(wA,cue(sid,'w'),.5);showArrow(vA,cue(sid,'v'),.5);
  const ux=.9487,uy=.3162,nx=-uy,ny=ux;
  const rays=[];for(let t=-1.5;t<=5;t+=.65){const a=P(t*ux+4.2*nx,t*uy+4.2*ny),b=P(t*ux,t*uy);
    rays.push(svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.yellow,'stroke-width':3,'stroke-dasharray':'3 12','stroke-linecap':'round',style:'opacity:0;visibility:hidden'},g))}
  tl.to(rays,{autoAlpha:.4,duration:.6,stagger:.05},cue(sid,'light'));

  n.innerHTML='<span style="color:#5cd0b3">shadow length</span> = <i>projection of v onto w</i>';
  show(n,cue(sid,'projection'),.6);
  const n2=el(S,'note','how much of v points along w',{left:'1190px',top:'540px',width:'680px',color:C.dim,fontSize:'40px'});

  sceneInOut(sid);

/* ============ S3: dot product = shadow × |w|, and its sign ============ */
(function(){const S=$('S3'),sid='s3';
  fadeIn(RO,cue(sid,'dot'),.6);
  const hl=[0,1,2].map(i=>el(S,'hl','',{left:'1170px',top:(330+i*86+(i==2?8:0))+'px',width:'560px',height:'84px',borderColor:[C.teal,C.yellow,C.ink][i]}));

})();

/* ============ S4: why multiply-and-add is a shadow ============ */
(function(){const S=$('S4'),sid='s4';
  fadeOut(RO,START[sid],.4);
  ST.to(START[sid]+.1,1.4,{ang:45});
  const svg=layerSvg(S);const g=clipTo(svg,40,90,1080,960);
  const ux=.9487,uy=.3162;
  const cx=svgEl('line',{x1:P(0,0)[0],y1:P(0,0)[1],x2:P(2,0)[0],y2:P(2,0)[1],stroke:C.green,'stroke-width':6,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},g);
  const cy=svgEl('line',{x1:P(2,0)[0],y1:P(2,0)[1],x2:P(2,2)[0],y2:P(2,2)[1],stroke:C.red,'stroke-width':6,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},g);
  const lx=el(S,'lbl',tex('x\\,\\hat\\imath',44),{color:C.green});place(lx,P(1,0)[0],P(0,0)[1]+42);
  const ly=el(S,'lbl',tex('y\\,\\hat\\jmath',44),{color:C.red});place(ly,P(2,0)[0]-48,P(0,1)[1]);
  fadeIn([cx,lx],cue(sid,'x'),.5);fadeIn([cy,ly],cue(sid,'y'),.5);

  const s1=2*ux,s2=2*uy,off=.32,on=[uy*off,-ux*off];
  const sg=svgEl('line',{x1:P(on[0],on[1])[0],y1:P(on[0],on[1])[1],x2:P(s1*ux+on[0],s1*uy+on[1])[0],y2:P(s1*ux+on[0],s1*uy+on[1])[1],stroke:C.green,'stroke-width':9,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},g);
  const sr=svgEl('line',{x1:P(s1*ux+on[0],s1*uy+on[1])[0],y1:P(s1*ux+on[0],s1*uy+on[1])[1],x2:P((s1+s2)*ux+on[0],(s1+s2)*uy+on[1])[0],y2:P((s1+s2)*ux+on[0],(s1+s2)*uy+on[1])[1],stroke:C.red,'stroke-width':9,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},g);
  const dg=svgEl('line',{x1:P(2,0)[0],y1:P(2,0)[1],x2:P(s1*ux,s1*uy)[0],y2:P(s1*ux,s1*uy)[1],stroke:C.green,'stroke-width':2.5,'stroke-dasharray':'7 7',style:'opacity:0;visibility:hidden'},g);

  show(f1,cue(sid,'splits'),.6);

/* ============ S5: unit vectors: the dot product is the shadow, and it is cos θ ============ */
(function(){const S=$('S5'),sid='s5';

/* ============ S6: v = shadow vector + leftover at a right angle ============ */
(function(){const S=$('S6'),sid='s6';
  ST.to(START[sid]+.1,1.6,{r:2.9,wr:Math.sqrt(10),z:1,ang:50});
  fadeOut(RO,START[sid],.4);
  const svg=layerSvg(S);const g=clipTo(svg,40,90,1080,960);
  // fixed geometry for ang 50, r 2.9, w along 18.435 deg
  const ux=.9487,uy=.3162,vx=2.9*Math.cos(50*d2r),vy=2.9*Math.sin(50*d2r),s=vx*ux+vy*uy,fx=s*ux,fy=s*uy;
  const pA=mkArrow(g,P,C.teal,9,tex('\\text{proj}',40),20,44,S);setArrow(pA,{x0:0,y0:0,x1:fx,y1:fy});
  const lA=mkArrow(g,P,C.pink,8,tex('\\text{leftover}',40),110,0,S);setArrow(lA,{x0:fx,y0:fy,x1:vx,y1:vy});
  showArrow(pA,cue(sid,'written'),.5);showArrow(lA,cue(sid,'left'),.5);
  tl.to(rmark,{attr:{'stroke-width':6},stroke:C.yellow,duration:.4},cue(sid,'right'));
  const f1=el(S,'abs hid',tex('\\text{proj}_{\\vec w}\\vec v=\\frac{\\vec v\\cdot\\vec w}{\\vec w\\cdot\\vec w}\\,\\vec w',56),{left:'1130px',top:'330px',width:'760px',textAlign:'center',color:C.teal});
  show(f1,cue(sid,'written'),.6);
  const f2=el(S,'abs hid',tex('(\\vec v-\\text{proj}_{\\vec w}\\vec v)\\cdot\\vec w=0',50),{left:'1130px',top:'520px',width:'760px',textAlign:'center',color:C.pink});

/* ============ S7: attention scores are dot products ============ */
(function(){const S=$('S7'),sid='s7';
  const svg=layerSvg(S);const O=[520,640],u=95;
  const PP=(x,y)=>[O[0]+u*x,O[1]-u*y];
  const q=mkArrow(svg,PP,C.blue,8,tex('\\text{query}',40),0,-44,S);setArrow(q,{x0:0,y0:0,x1:0,y1:0});
  const keys=[['the',150,2.2],['cat',30,3.2],['sat',75,2.4],['mat',200,2.0]];
  const qa=40*d2r,qv=[3*Math.cos(qa),3*Math.sin(qa)];
  const ks=keys.map(([w,deg,len],k)=>{const r=deg*d2r,x=len*Math.cos(r),y=len*Math.sin(r);
    const a=mkArrow(svg,PP,C.yellow,5,`<span style="font-size:38px;font-style:italic">${w}</span>`,Math.cos(r)*58,-Math.sin(r)*40,S);setArrow(a,{x0:0,y0:0,x1:0,y1:0});
    return {a,x,y,w,score:x*qv[0]+y*qv[1]}});
  sceneIn(sid);
  grow(q,cue(sid,'query'),1,...qv);
  ks.forEach((k,i)=>grow(k.a,cue(sid,'key')+i*.15,.8,k.x,k.y));
  const title=el(S,'note','score = query · key',{left:'1150px',top:'200px',width:'700px',fontStyle:'normal'});
  show(title,cue(sid,'dot'),.5);
  const max=Math.max(...ks.map(k=>k.score));
  ks.forEach((k,i)=>{const y=330+i*110;
    const l=el(S,'abs hid',k.w,{left:'1150px',top:y+'px',fontSize:'40px',fontStyle:'italic',color:C.yellow});
    const bw=Math.max(0,k.score)/max*420;
    const bar=el(S,'abs hid','',{left:'1290px',top:(y+10)+'px',width:Math.max(bw,4)+'px',height:'40px',background:k.score===max?C.teal:C.dim,borderRadius:'6px',transformOrigin:'0 50%'});
    const v=el(S,'abs hid mono',fmt(k.score,1),{left:(1310+Math.max(bw,4))+'px',top:y+'px',fontSize:'36px',color:C.ink});
    fadeIn(l,cue(sid,'key')+i*.15,.4);
    tl.fromTo(bar,{autoAlpha:0,scaleX:0},{autoAlpha:1,scaleX:1,duration:.8,ease:'power2.out',immediateRender:false},cue(sid,'long')+i*.12);
    fadeIn(v,cue(sid,'long')+i*.12+.5,.4)});
  const strong=el(S,'note','long shadow, strong match',{left:'1150px',top:'780px',width:'700px',color:C.teal});
  show(strong,cue(sid,'strong'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.7 &nbsp;eigenvectors: directions that only stretch',{top:'950px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
})();
