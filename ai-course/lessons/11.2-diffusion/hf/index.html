/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers (modules 10-12) ---- */
function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov||/\\(bar|hat|underbrace|tilde)/.test(t)){d.setAttribute('data-layout-allow-overlap','');d.querySelectorAll('span').forEach(s=>s.setAttribute('data-layout-allow-overlap',''))}return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

/* a small picture whose noise level is animated: v = sqrt(a)*img + sqrt(1-a)*noise */
function noisyPic(parent,cx,cy,cell,seed,a0){const n=12,els=[],img=[],nz=[];const rnd=seedRand(seed||1);
  const wrap=el(parent,'abs','',{left:(cx-n*cell/2)+'px',top:(cy-n*cell/2)+'px',width:(n*cell)+'px',height:(n*cell)+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){const dx=c-5.5,dy=r-5.5,d=Math.hypot(dx,dy);
    let v=-0.9;if(d<4.6)v=0.9;if(d<4.6&&r===4&&(c===4||c===7))v=-0.9;if(d<4.6&&r===7&&c>=4&&c<=7)v=-0.6;
    img.push(v);let g=0;for(let k=0;k<4;k++)g+=rnd();nz.push((g-2)*1.7);
    els.push(el(wrap,'abs','',{left:(c*cell)+'px',top:(r*cell)+'px',width:(cell-2)+'px',height:(cell-2)+'px',borderRadius:'2px'}))}
  const p={wrap,els,img,nz,a:a0==null?1:a0};
  p.set=a=>{const sa=Math.sqrt(Math.max(a,0)),sn=Math.sqrt(Math.max(1-a,0));els.forEach((e,i)=>{const v=sa*img[i]+sn*nz[i];const b=Math.min(1,Math.max(0,(v+1.6)/3.2));
    e.style.background=`rgb(${Math.round(14+b*231)},${Math.round(17+b*190)},${Math.round(22+b*52)})`})};
  p.set(p.a);return p}
function noiseTo(p,time,d,a){const o={a:p.a};tl.to(o,{a,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>p.set(o.a)},time);p.a=a}

/* ============ S1: destroying is easy; undoing it is the model ============ */
(function(){const S=$('S1');const sid='s1';
  const p=noisyPic(S,420,460,30,3,1);show(p.wrap,cue(sid,'photograph'),.5);
  noiseTo(p,cue(sid,'static'),1,.8);noiseTo(p,cue(sid,'more'),1,.4);noiseTo(p,cue(sid,'nothing'),1.4,0.002);
  const l1=txt(S,'add noise: trivial',420,700,{fs:36,it:true,color:C.dim});show(l1,cue(sid,'destroying'),.4);
  const ref=txt(S,'Sohl-Dickstein et al., 2015',1340,200,{fs:32,it:true,color:C.dim});show(ref,cue(sid,'sohl-dickstein'),.4);
  const thumbs=[0.002,.15,.4,.75,1].map((a,i)=>noisyPic(S,880+i*215,460,14,3,a));
  thumbs.forEach((t,i)=>show(t.wrap,cue(sid,'backwards')+i*.35,.4));
  const svg=layerSvg(S);
  const u=pxArrow(svg,C.pink,5,880,300,1740,300);growPx(u,cue(sid,'undo'),.8);
  const ul=txt(S,'undo one small step, many times',1360,250,{fs:34,it:true,color:C.pink});show(ul,cue(sid,'undo'),.4);
  const out=txt(S,'pure noise → a new image',1360,640,{fs:38,it:true,color:C.yellow});show(out,cue(sid,'pure'),.4);
  sceneInOut(sid);
})();

/* ============ S2: the forward process ============ */
(function(){const S=$('S2');const sid='s2';
  const as=[1,.85,.55,.25,.002];const svg=layerSvg(S);
  const lab=['x₀','x₁','x₂','…','x_T'];
  const ps=as.map((a,i)=>{const p=noisyPic(S,240+i*360,330,16,5,a);show(p.wrap,cue(sid,'forward')+i*.3,.4);
    const l=txt(S,i===4?'x<sub>T</sub>':lab[i],240+i*360,460,{fs:36,color:C.ink});show(l,cue(sid,'forward')+i*.3,.4);
    if(i){const ar=pxArrow(svg,C.dim,4,240+(i-1)*360+110,330,240+i*360-110,330);showArrow(ar,cue(sid,'fixed')+i*.15,.3)}return p});
  const fx=txt(S,'fixed, not learned',960,180,{fs:38,it:true,color:C.blue});show(fx,cue(sid,'learned'),.4);
  const ref=txt(S,'Ho, Jain &amp; Abbeel, 2020 (DDPM) · T = 1000',960,560,{fs:32,it:true,color:C.dim});show(ref,cue(sid,'abbeel'),.4);
  const eq=eqn(S,'q(x_t\\mid x_{t-1}) = \\mathcal{N}\\big(\\sqrt{1-\\beta_t}\\,x_{t-1},\\; \\beta_t I\\big)',700,720,50);show(eq,cue(sid,'shrunk'),.6);
  const sh=txt(S,'shrink',530,810,{fs:30,it:true,color:C.yellow}),ad=txt(S,'add noise',900,810,{fs:30,it:true,color:C.pink});show(sh,cue(sid,'shrunk'),.4);show(ad,cue(sid,'gaussian'),.4);
  // beta schedule plot
  const P=(t,b)=>[1300+t*500,920-b/0.02*240];
  const ax=ln(svg,1300,920,1820,920,C.axis,3),ay=ln(svg,1300,920,1300,660,C.axis,3);fadeIn([ax,ay],cue(sid,'schedule'),.4);
  const bl=pth(svg,polyD(P,[[0,1e-4],[1,.02]]),C.pink,5);drawOn(bl,cue(sid,'beta'),.8);
  const bt=txt(S,'β<sub>t</sub>: 10⁻⁴ → 0.02',1560,640,{fs:30,mono:true,color:C.pink});show(bt,cue(sid,'beta'),.4);
  const tt=txt(S,'t',1830,950,{fs:28,it:true,color:C.dim});show(tt,cue(sid,'beta'),.3);
  const nn=txt(S,'≈ N(0, I)',240+4*360,520,{fs:34,mono:true,color:C.green});show(nn,cue(sid,'indistinguishable'),.4);
  sceneInOut(sid);
})();

/* ============ S3: jump to any step ============ */
(function(){const S=$('S3');const sid='s3';
  const eq=eqn(S,'x_t = \\sqrt{\\bar\\alpha_t}\\; x_0 + \\sqrt{1-\\bar\\alpha_t}\\;\\varepsilon, \\qquad \\varepsilon\\sim\\mathcal{N}(0,I)',960,220,58);show(eq,cue(sid,'jump'),.6);
  const ab=eqn(S,'\\bar\\alpha_t = \\prod_{s\\le t}(1-\\beta_s)',960,350,48,{color:C.yellow});show(ab,cue(sid,'product'),.5);
  const svg=layerSvg(S);
  const P=(t,v)=>[300+t*900,920-v*400];
  const ax=ln(svg,300,920,1220,920,C.axis,3),ay=ln(svg,300,920,300,500,C.axis,3);fadeIn([ax,ay],cue(sid,'early'),.4);
  const abar=t=>{let p=1;const T=1000,n=Math.round(t*T);for(let i=0;i<n;i++)p*=1-(1e-4+(0.02-1e-4)*i/(T-1));return p};
  const pts=[];for(let i=0;i<=50;i++){const t=i/50;pts.push([t,abar(t)])}
  const sig=pth(svg,polyD(P,pts.map(([t,a])=>[t,Math.sqrt(a)])),C.blue,5),noi=pth(svg,polyD(P,pts.map(([t,a])=>[t,Math.sqrt(1-a)])),C.pink,5);
  drawOn(sig,cue(sid,'early'),1.2);drawOn(noi,cue(sid,'late'),1.2);
  const sl=txt(S,'signal weight √ᾱ',520,480,{fs:32,color:C.blue}),nl=txt(S,'noise weight √(1−ᾱ)',1060,480,{fs:32,color:C.pink});show(sl,cue(sid,'most'),.4);show(nl,cue(sid,'none'),.4);
  const tl0=txt(S,'step t →',760,960,{fs:28,it:true,color:C.dim});show(tl0,cue(sid,'early'),.4);
  const pic=noisyPic(S,1560,700,22,7,1);show(pic.wrap,cue(sid,'early'),.5);noiseTo(pic,cue(sid,'radio'),2.5,.003);
  const rd=txt(S,'a signal fading under static',1560,880,{fs:32,it:true,color:C.dim});show(rd,cue(sid,'radio'),.4);
  sceneInOut(sid);
})();

/* ============ S4: training is regression on the noise ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const ins=[['clean x₀','clean',C.blue],['random step t','step',C.yellow],['noise ε','noise',C.pink]];
  ins.forEach(([t,w,c],i)=>{const b=box(S,300,280+i*150,330,90,t,c,{fs:34});show(b,cue(sid,w),.4);const a=pxArrow(svg,C.dim,4,470,280+i*150,640,430);growPx(a,cue(sid,'build'),.4)});
  const xt=box(S,780,430,260,100,'x<sub>t</sub>',C.ink,{fs:40});show(xt,cue(sid,'noisy'),.4);
  const net=box(S,1180,430,320,140,'network ε<sub>θ</sub>(x<sub>t</sub>, t)',C.green,{fs:36});show(net,cue(sid,'network'),.4);
  const a2=pxArrow(svg,C.dim,4,915,430,1015,430);growPx(a2,cue(sid,'network'),.4);
  const out=box(S,1620,430,260,100,'predicted ε̂',C.pink,{fs:36});show(out,cue(sid,'predict'),.4);
  const a3=pxArrow(svg,C.dim,4,1345,430,1485,430);growPx(a3,cue(sid,'predict'),.4);
  const eq=eqn(S,'\\mathcal{L}_{simple} = \\mathbb{E}_{x_0,t,\\varepsilon}\\big\\lVert \\varepsilon - \\varepsilon_\\theta(x_t, t)\\big\\rVert^2',1180,700,54);show(eq,cue(sid,'squared'),.6);

  const f=txt(S,'predict the noise, not the image: best samples in DDPM',1180,830,{fs:34,it:true,color:C.yellow});show(f,cue(sid,'simplified'),.4);
  const w=txt(S,'drops the per-step weights of the full bound',1180,900,{fs:30,it:true,color:C.dim});show(w,cue(sid,'drops'),.4);
  sceneInOut(sid);
})();

/* ============ S5: sampling backwards ============ */
(function(){const S=$('S5');const sid='s5';
  const pic=noisyPic(S,460,500,34,11,0.0);show(pic.wrap,cue(sid,'pure'),.5);
  const steps=[0.05,0.15,.3,.5,.7,.88,1];
  const tcount=txt(S,'t = 1000',460,250,{fs:40,mono:true,color:C.yellow});show(tcount,cue(sid,'last'),.4);
  const T0=cue(sid,'every');const span=cue(sid,'thousand')-T0;
  steps.forEach((a,i)=>noiseTo(pic,T0+span*i/steps.length,span/steps.length*.9,a));
  countTo(tcount,T0,span,1000,0,v=>'t = '+Math.round(v));
  const eq=eqn(S,'x_{t-1} = \\frac{1}{\\sqrt{\\alpha_t}}\\Big(x_t - \\frac{\\beta_t}{\\sqrt{1-\\bar\\alpha_t}}\\,\\varepsilon_\\theta(x_t,t)\\Big) + \\sigma_t z',1340,430,46);show(eq,cue(sid,'remove'),.6);
  const r1=txt(S,'remove scaled predicted noise',1180,560,{fs:30,it:true,color:C.pink}),r2=txt(S,'add back a little fresh noise',1600,560,{fs:30,it:true,color:C.green});
  show(r1,cue(sid,'predicted'),.4);show(r2,cue(sid,'fresh'),.4);
  const bl=txt(S,'(keeps it from collapsing to a blurry average)',1340,620,{fs:28,it:true,color:C.dim});show(bl,cue(sid,'blurry'),.4);
  const sl=box(S,1340,820,720,100,'1000 steps: slow · later samplers use far fewer',C.blue,{fs:34});show(sl,cue(sid,'slow'),.5);
  sceneInOut(sid);
})();

/* ============ S6: arrows uphill: score matching ============ */
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);const cx=620,cy=560;
  [260,190,120,60].forEach((r,i)=>{const e=svgEl('ellipse',{cx,cy,rx:r*1.4,ry:r,fill:i===3?'#f5cf4a33':'none',stroke:C.yellow,'stroke-width':2,opacity:.3+.15*i,style:'opacity:0;visibility:hidden'},svg);tl.to(e,{autoAlpha:.3+.15*i,duration:.4},cue(sid,'region'))});
  const rl=txt(S,'where real images live',cx,cy,{fs:30,it:true,color:C.yellow});show(rl,cue(sid,'live'),.4);
  const arrows=[];for(let i=0;i<14;i++){const ang=i/14*2*Math.PI,r=330;const x=cx+Math.cos(ang)*r*1.3,y=cy+Math.sin(ang)*r*.85;
    const dx=cx-x,dy=cy-y,L=Math.hypot(dx,dy);const a=pxArrow(svg,C.blue,3,x,y,x+dx/L*80,y+dy/L*80);arrows.push(a)}
  arrows.forEach((a,i)=>growPx(a,cue(sid,'arrow')+i*.05,.4));
  const pt=svgEl('circle',{cx:cx+390,cy:cy-250,r:12,fill:C.pink,style:'opacity:0;visibility:hidden'},svg);fadeIn(pt,cue(sid,'subtracting'),.3);
  const path=[[cx+390,cy-250],[cx+300,cy-180],[cx+200,cy-110],[cx+110,cy-60],[cx+40,cy-20]];
  path.slice(1).forEach(([x,y],i)=>tl.to(pt,{attr:{cx:x,cy:y},duration:.5,ease:'power1.inOut'},cue(sid,'uphill')+i*.55));
  const up=txt(S,'subtracting the noise = moving uphill',cx,960,{fs:34,it:true,color:C.pink});show(up,cue(sid,'subtracting'),.4);
  const eq=eqn(S,'\\varepsilon_\\theta(x_t,t) \\approx -\\sqrt{1-\\bar\\alpha_t}\\;\\nabla_{x}\\log p_t(x_t)',1440,420,46);show(eq,cue(sid,'score'),.6);
  const sm=txt(S,'score matching: learn the direction of higher probability',1440,520,{fs:30,it:true,color:C.ink});show(sm,cue(sid,'direction'),.4);
  const ref=txt(S,'Song &amp; Ermon, 2019',1440,580,{fs:30,it:true,color:C.dim});show(ref,cue(sid,'song'),.4);
  sceneInOut(sid);
})();

/* ============ S7: conditioning; beating GANs; latent ============ */
(function(){const S=$('S7');const sid='s7';
  const svg=layerSvg(S);
  const pr=box(S,330,330,440,100,'“a red fox in the snow”',C.yellow,{fs:34});show(pr,cue(sid,'description'),.4);
  const te=box(S,330,520,440,100,'text embedding',C.blue,{fs:36});show(te,cue(sid,'embedding'),.4);
  const a1=pxArrow(svg,C.dim,4,330,385,330,465);growPx(a1,cue(sid,'embedding'),.4);
  const dn=box(S,960,520,400,140,'denoiser ε<sub>θ</sub>(x<sub>t</sub>, t, text)',C.green,{fs:34});show(dn,cue(sid,'network'),.4);
  const a2=pxArrow(svg,C.dim,4,555,520,755,520);growPx(a2,cue(sid,'embedding'),.4);
  const cfg=box(S,960,720,520,90,'classifier-free guidance',C.pink,{fs:34});show(cfg,cue(sid,'classifier-free'),.4);
  const st=txt(S,'strengthens the text’s influence',960,800,{fs:30,it:true,color:C.dim});show(st,cue(sid,'strengthens'),.4);
  const db=box(S,1560,330,560,110,'<span>Dhariwal &amp; Nichol, 2021<br><i>Diffusion Models Beat GANs</i></span>',C.ink,{fs:32});show(db,cue(sid,'dhariwal'),.5);
  const lt=box(S,1560,560,560,110,'+ latent space (11.1) → many of today’s image generators',C.blue,{fs:30});show(lt,cue(sid,'latent'),.5);
  sceneInOut(sid);
})();

/* ============ S8: recap; next ============ */
(function(){const S=$('S8');const sid='s8';
  const pic=noisyPic(S,960,420,26,13,0.0);show(pic.wrap,cue(sid,'diffusion'),.4);noiseTo(pic,cue(sid,'removing'),3.5,1);
  const t=txt(S,'remove a little noise, repeat',960,620,{fs:40,it:true,color:C.yellow});show(t,cue(sid,'repeats'),.4);
  nextUp(S,sid,'lesson',1,'11.3 &nbsp;GANs in brief');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
