function hideArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:0,duration:d||.4},time)}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;

  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}

/* clip a polygon (data coords) to the half-plane w.p + b >= 0 */
function clipHalf(poly,w,b){const out=[];const f=p=>w[0]*p[0]+w[1]*p[1]+b;
  for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length],fp=f(p),fq=f(q);
    if(fp>=0)out.push(p);if((fp>=0)!==(fq>=0)){const t=fp/(fp-fq);out.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}}
  return out}
const polyStr=(P,poly)=>poly.map(p=>P(p[0],p[1]).map(v=>v.toFixed(1)).join(',')).join(' ');

  fadeIn(gb,cue(sid,'older'),.6);
  const fb=pth(svg,fpath(sig,PB,-4,4),C.yellow,7);drawOn(fb,cue(sid,'sigmoid'),1.2);
  const tc=el(S,'lbl',tex('\\sigma(z)=\\frac{1}{1+e^{-z}}',50),{color:C.yellow});place(tc,1420,250);show(tc,cue(sid,'sigmoid'),.6);
  const one=el(S,'lbl','<span class="mono" style="font-size:30px">1</span>',{color:C.dim});place(one,PB(-4,1)[0]-30,PB(0,1)[1]);
  const zero=el(S,'lbl','<span class="mono" style="font-size:30px">0</span>',{color:C.dim});place(zero,PB(-4,0)[0]-30,PB(0,0)[1]);
  fadeIn([one,zero],cue(sid,'range'),.5);
  const dim=el(S,'lbl','a dimmer switch',{color:C.ink,fontSize:'40px',fontStyle:'italic'});place(dim,1420,880);show(dim,cue(sid,'dimmer'),.5);
  sceneInOut(sid);
})();

/* ============ S6: the whole neuron, then many of them ============ */
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);
  const y=420;
  const xin=colvec(S,250,y,['x₁','x₂','x₃'],{fs:44,w:110,color:C.blue});
  const b1=boxEl(S,620,y,240,120,tex('\\mathbf{w}\\cdot\\mathbf{x}',50),C.blue);
  const b2=boxEl(S,960,y,200,120,tex('+\\,b',50),C.pink);
  const b3=boxEl(S,1300,y,220,120,'',C.yellow);
  const bs=svgEl('svg',{width:160,height:90,viewBox:'0 0 160 90',style:'position:absolute;left:30px;top:15px'},b3);
  svgEl('path',{d:'M10 75 L80 75 L150 10',fill:'none',stroke:C.yellow,'stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round'},bs);
  const out=node(S,1650,y,64,tex('a',50),C.green);
  const ar=[[310,y,500,y],[740,y,860,y],[1060,y,1190,y],[1410,y,1586,y]].map(([a,b,c,d])=>ln(svg,a,b,c,d,C.dim,4));
  const words=[['weighted sum',620,cue(sid,'weighted')],['bias',960,cue(sid,'bias')],['bend',1300,cue(sid,'bends')]].map(([t,x,f])=>{const e=el(S,'lbl',t,{color:C.ink,fontSize:'38px',fontStyle:'italic'});place(e,x,y+110);show(e,f,.4);return e});
  show(xin.box,at(sid,0),.5);
  show(b1,cue(sid,'weighted'),.5);drawOn(ar[0],cue(sid,'weighted'),.4);
  show(b2,cue(sid,'bias'),.5);drawOn(ar[1],cue(sid,'shifts'),.4);
  show(b3,cue(sid,'bends'),.5);drawOn(ar[2],cue(sid,'bends'),.4);
  show(out,cue(sid,'result'),.5);drawOn(ar[3],cue(sid,'result'),.4);
  const top=[xin.box,b1,b2,b3,out,...words];
  tl.to(top,{y:-200,scale:.7,duration:1,ease:'power2.inOut'},cue(sid,'language'));
  tl.to(ar,{autoAlpha:0,duration:.5},cue(sid,'language'));
  tl.to(top,{autoAlpha:0,duration:.6},cue(sid,'feed-forward'));
  // a feed-forward layer: one token vector, many neurons
  const tok=colvec(S,420,600,['0.2','−1.1','0.7','⋮','0.4'],{fs:40,w:120,color:C.blue});
  const tlab=el(S,'lbl','one token vector',{color:C.blue,fontSize:'36px',fontStyle:'italic'});place(tlab,420,410);
  const L=[];const n=14;for(let i=0;i<n;i++)L.push(node(S,1100,250+i*50,18,'',C.yellow));
  const eg=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const rnd=seedRand(3);
  L.forEach(nd=>{for(let k=0;k<5;k++)svgEl('line',{x1:490,y1:600-110+k*55,x2:nd.cx-18,y2:nd.cy,stroke:rnd()<.5?C.blue:C.red,'stroke-width':1.2,opacity:.45},eg)});
  show([tok.box,tlab],cue(sid,'transformer'),.6);
  fadeIn(L,cue(sid,'thousands'),.3,.06);fadeIn(eg,cue(sid,'thousands')+.3,.8);
  const fl=el(S,'abs','',{left:'1240px',top:'480px',width:'560px',fontSize:'42px',fontStyle:'italic',lineHeight:'1.35',opacity:0,visibility:'hidden'});
  fl.innerHTML='thousands of neurons,<br>same input,<br>each with its own weights';
  show(fl,cue(sid,'same'),.6);
  const bil=el(S,'abs','',{left:'1240px',top:'760px',width:'560px',fontSize:'34px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});
  bil.innerHTML='billions of multiply-adds per token';
  show(bil,cue(sid,'billions'),.6);
  sceneInOut(sid);
})();

/* ============ S7: recap ============ */
(function(){const S=$('S7');const sid='s7';
  const f=el(S,'cap',tex('a \\;=\\; {\\color{#f5cf4a}f}\\big(\\,{\\color{#58c4dd}\\mathbf{w}\\cdot\\mathbf{x}}\\;+\\;{\\color{#e77fb3}b}\\,\\big)',96),{top:'300px'});
  show(f,at(sid,.01),.8);
  const l1=el(S,'lbl','weighted sum',{color:C.blue,fontSize:'40px',fontStyle:'italic'});place(l1,1000,520);
  const l2=el(S,'lbl','bias',{color:C.pink,fontSize:'40px',fontStyle:'italic'});place(l2,1290,520);
  const l3=el(S,'lbl','bend',{color:C.yellow,fontSize:'40px',fontStyle:'italic'});place(l3,700,520);
  show(l1,cue(sid,'weighted'),.5);show(l3,cue(sid,'bend'),.5);show(l2,cue(sid,'bend')+.3,.5);
  const one=el(S,'cap','alone: one straight line &nbsp;→&nbsp; together: a layer',{top:'680px',fontSize:'46px',fontStyle:'italic',color:C.ink});
  show(one,cue(sid,'line'),.6);
  nextCap(S,sid,'next',1,'6.2 &nbsp;layers: stacking transformations');
  sceneInOut(sid,true);
})();


tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
