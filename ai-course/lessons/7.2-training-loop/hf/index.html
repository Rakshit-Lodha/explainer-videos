/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* small network of circle nodes; returns layers of nodes and the edge lines */
function net(S,svg,xs,sizes,cy,gap,r,color){const N=sizes.map((n,j)=>Array.from({length:n},(_,i)=>node(S,xs[j],cy+(i-(n-1)/2)*gap,r,'',color)));
  const E=[];for(let j=0;j<N.length-1;j++)N[j].forEach(a=>N[j+1].forEach(b=>E.push(edge(svg,a,b,C.dim,2))));return {N,E}}
function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}

/* ============ S1: one short loop ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const cx=960,cy=560,rx=360,ry=250,R=Math.PI/180;
  const pe=a=>[cx+rx*Math.cos(a*R),cy+ry*Math.sin(a*R)];
  const labs=[['predict',-90,C.blue],['measure the loss',0,C.yellow],['gradients',90,C.pink],['nudge the weights',180,C.green]];
  const T=[cue(sid,'prediction'),cue(sid,'wrong'),cue(sid,'way'),cue(sid,'nudge',2)];
  labs.forEach(([t,a,c],i)=>{const [x,y]=pe(a);const b=boxEl(S,x,y,i%2?300:250,90,`<span style="font-size:36px">${t}</span>`,c);show(b,T[i],.5)});
  [-90,0,90,180].forEach((a,i)=>{const a0=a+30,a1=a+60;const [x0,y0]=pe(a0),[x1,y1]=pe(a1);
    const p=pth(svg,`M${x0} ${y0} A${rx} ${ry} 0 0 1 ${x1} ${y1}`,C.dim,4);
    const tx=-rx*Math.sin(a1*R),ty=ry*Math.cos(a1*R),L=Math.hypot(tx,ty);const hd=arrowHead(svg,x1,y1,tx/L,ty/L,C.dim);
    const t=i<3?T[i+1]:cue(sid,'go');drawOn(p,t,.5);fadeIn(hd,t+.4,.2)});
  const dot=svgEl('circle',{r:13,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  const st={a:-90};const ap=()=>{const [x,y]=pe(st.a);dot.setAttribute('cx',x);dot.setAttribute('cy',y)};ap();
  fadeIn(dot,cue(sid,'again'),.3);tl.to(st,{a:630,duration:7,ease:'none',immediateRender:false,onUpdate:ap},cue(sid,'again'));
  const top=el(S,'cap','one short loop trains every model in this course',{top:'120px',fontSize:'46px',fontStyle:'italic'});show(top,cue(sid,'loop'),.5);
  const bot=el(S,'cap','write it from memory, and you can train almost anything',{top:'930px',fontSize:'42px',fontStyle:'italic',color:C.teal});show(bot,cue(sid,'memory'),.5);
  sceneInOut(sid);
})();

  const W=matrix(S,760,860,[['0.4','−1.2','0.8'],['0.1','0.6','−0.3'],['−0.7','0.2','1.1']],{fs:30,cw:84,color:C.yellow});

/* ============ S4: the update ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const P=plane(500,800,110,42),f=x=>.5*x*x;
  const ax=ln(svg,P(-3.3,0)[0],800,P(3.3,0)[0],800,C.axis,3);fadeIn(ax,at(sid,0),.4);
  const cv=pth(svg,fpath(f,P,-3,3,120),C.blue,5);drawOn(cv,at(sid,.01),.8);
  const al=lab(S,'loss',P(-3,0)[0]-10,P(0,f(3))[1]-30,C.blue,30);fadeIn(al,at(sid,.02),.4);
  const ball=svgEl('circle',{r:15,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);
  const st={x:2.4};const ap=()=>{const p=P(st.x,f(st.x));ball.setAttribute('cx',p[0]);ball.setAttribute('cy',p[1]-15)};ap();fadeIn(ball,cue(sid,'weight'),.3);
  const p0=P(2.4,f(2.4));const dx=110,dy=-2.4*42,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const g=mkArrow(svg,(x,y)=>[x,y],C.pink,6,'gradient',70,-10,S);setArrow(g,{x0:p0[0],y0:p0[1]-15,x1:p0[0],y1:p0[1]-15});
  grow(g,cue(sid,'uphill'),.5,p0[0]+ux*140,p0[1]-15+uy*140);
  const s1=mkArrow(svg,(x,y)=>[x,y],C.green,6);setArrow(s1,{x0:p0[0],y0:p0[1]-15,x1:p0[0],y1:p0[1]-15});
  grow(s1,cue(sid,'down'),.5,p0[0]-ux*140,p0[1]-15-uy*140);
  [1.3,.6,.25].forEach((x,i)=>tl.to(st,{x,duration:.45,ease:'power2.out',immediateRender:false,onUpdate:ap},cue(sid,'down')+.6+i*.55));
  hideArrow(s1,cue(sid,'down')+.6,.3);hideArrow(g,cue(sid,'down')+.6,.3);
  const dl=lab(S,'the gradient points uphill; step the other way',500,880,C.dim,32);show(dl,cue(sid,'uphill'),.4);
  const fm=el(S,'cap',tex('w_{\\text{new}}=w_{\\text{old}}-\\eta\\,\\frac{\\partial L}{\\partial w}',58),{top:'110px'});show(fm,cue(sid,'new'),.5);
  const et=el(S,'cap',tex('\\eta',40)+'<span style="font-size:32px;font-style:italic">: the learning rate</span>',{top:'250px',color:C.dim});show(et,cue(sid,'learning'),.4);
  const code=el(S,'code','<span class="k">for</span> x, y <span class="k">in</span> batches:\n    opt.<span class="f">zero_grad</span>()          <span class="c"># clear old grads</span>\n    loss = <span class="f">loss_fn</span>(<span class="f">model</span>(x), y)\n    loss.<span class="f">backward</span>()          <span class="c"># add new grads</span>\n    opt.<span class="f">step</span>()               <span class="c"># w -= lr * grad</span>',{left:'960px',top:'380px'});
  show(code,cue(sid,'frameworks'),.5);
  const hl=el(S,'hl','',{left:'966px',top:'447px',width:'880px',height:'46px',borderColor:C.yellow,boxShadow:'0 0 24px #f5cf4a66'});fadeIn(hl,cue(sid,'cleared'),.3);
  const gh=lab(S,'forget it, and old gradients keep pushing every step',1400,720,C.red,34);show(gh,cue(sid,'ghosts'),.4);
  sceneInOut(sid);
})();

/* ============ S5: steps and epochs ============ */
(function(){const S=$('S5');const sid='s5';
  const cols=[C.blue,C.yellow,C.green,C.red,C.pink,C.teal],x0=310,dx=110,y=320;
  const sq=[];for(let i=0;i<12;i++){sq.push(el(S,'abs','',{left:(x0+i*dx)+'px',top:y+'px',width:'90px',height:'90px',borderRadius:'10px',background:cols[i%6],opacity:0,visibility:'hidden'}))}
  tl.to(sq,{autoAlpha:.85,duration:.2,stagger:.05},cue(sid,'data'));
  const dl=lab(S,'12 training examples',960,270,C.dim,30);show(dl,cue(sid,'data'),.4);
  const B=[0,1,2].map(k=>el(S,'hl','',{left:(x0+k*4*dx-10)+'px',top:(y-10)+'px',width:(4*dx-20+20)+'px',height:'110px',borderColor:C.ink}));
  const SL=[0,1,2].map(k=>lab(S,'step '+(k+1),x0+k*4*dx+200,470,C.ink,30,false));
  B.forEach((b,k)=>{const t=cue(sid,'mini-batch')+k*.8;fadeIn([b,SL[k]],t,.3);if(k<2)tl.to(b,{autoAlpha:.35,duration:.3},t+.8)});
  const ep=lab(S,'one epoch: every example seen once',960,570,C.yellow,40);show(ep,cue(sid,'epoch'),.4);
  const perm=[7,2,10,0,5,11,3,8,1,9,4,6];
  sq.forEach((s,i)=>tl.to(s,{x:(perm[i]-i)*dx,duration:1.1,ease:'power2.inOut'},cue(sid,'shuffle')+(i%4)*.05));
  const sh=lab(S,'shuffled at the start of every epoch',960,650,C.teal,36);show(sh,cue(sid,'shuffle'),.4);
  const od=lab(S,'nothing to learn from the order',960,710,C.dim,32);show(od,cue(sid,'cannot'),.4);
  const c1=el(S,'chip','small dataset: many epochs',{borderColor:C.blue,fontSize:'36px'});place(c1,620,860);show(c1,cue(sid,'small'),.4);
  const c2=el(S,'chip','largest models: about one epoch',{borderColor:C.pink,fontSize:'36px'});place(c2,1300,860);show(c2,cue(sid,'largest'),.4);
  sceneInOut(sid);
})();

/* ============ S6: logs, validation, checkpoints ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const P=plane(260,820,190,110);
  const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:260,y1:820,x2:P(7.2,0)[0],y2:820,stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:260,y1:820,x2:260,y2:P(0,5.6)[1],stroke:C.axis,'stroke-width':3},ax);fadeIn(ax,at(sid,0),.4);
  const xl=lab(S,'training steps',P(3.6,0)[0],860,C.dim,28);fadeIn(xl,at(sid,0),.4);
  const tr=x=>4.6*Math.exp(-.55*x)+.35+.08*Math.sin(9*x),va=x=>4.6*Math.exp(-.5*x)+.75+(x>4.2?.3*(x-4.2)*(x-4.2):0);
  const c=pth(svg,fpath(tr,P,.05,7,300),C.blue,4);drawOn(c,cue(sid,'logs'),2.5,'none');
  const tl1=lab(S,'training loss',P(6.4,0)[0],P(0,tr(6.4))[1]-40,C.blue,30);show(tl1,cue(sid,'training'),.4);
  const vd=[];for(let k=1;k<=10;k++){const p=P(.7*k,va(.7*k));vd.push(svgEl('circle',{cx:p[0],cy:p[1],r:10,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg))}
  tl.to(vd,{autoAlpha:1,duration:.2,stagger:.25},cue(sid,'validation'));
  const vl=lab(S,'validation loss',P(6.3,0)[0],P(0,va(6.3))[1]-45,C.yellow,30);show(vl,cue(sid,'validation'),.4);
  const nu=lab(S,'measured with no updates',1300,250,C.yellow,34);show(nu,cue(sid,'updates'),.4);
  const cp=[1.4,2.8,4.2,5.6].map(x=>{const p=P(x,0);const d=svgEl('rect',{x:p[0]-11,y:p[1]-11,width:22,height:22,fill:C.green,transform:`rotate(45 ${p[0]} ${p[1]})`,style:'opacity:0;visibility:hidden'},svg);return d});
  tl.to(cp,{autoAlpha:1,duration:.2,stagger:.3},cue(sid,'checkpoints'));
  const cl=lab(S,'checkpoints',P(1.4,0)[0]-40,780,C.green,28);show(cl,cue(sid,'checkpoints'),.4);
  const cr=lab(S,'a crash costs only the steps since the last checkpoint',1300,310,C.red,30);show(cr,cue(sid,'crash'),.4);
  const bp=P(4.2,0);const ring=svgEl('circle',{cx:bp[0],cy:bp[1],r:26,fill:'none',stroke:C.green,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);fadeIn(ring,cue(sid,'best'),.3);
  const vline=ln(svg,bp[0],P(0,va(4.2))[1]+12,bp[0],bp[1]-28,C.green,2,{'stroke-dasharray':'6 6'});fadeIn(vline,cue(sid,'best'),.3);
  const bl=lab(S,'keep the one best on validation',bp[0],900,C.green,32);show(bl,cue(sid,'best'),.4);
  sceneInOut(sid);
})();

/* ============ S7: a language model's loop ============ */
(function(){const S=$('S7');const sid='s7';const svg=layerSvg(S);
  const tt=el(S,'cap','pretraining a language model is this very loop',{top:'140px',fontSize:'44px',fontStyle:'italic'});show(tt,cue(sid,'loop'),.5);
  const slot=i=>960+(i-2.5)*190;
  /* each token sits centred in a fixed-width slot; the slot is what moves */
  const tok=(w,i,y,color)=>{const box=el(S,'abs','',{left:(slot(i)-85)+'px',top:(y-40)+'px',width:'170px',height:'80px',display:'flex',alignItems:'center',justifyContent:'center',opacity:0,visibility:'hidden'});
    el(box,'chip',w,{position:'relative',opacity:1,visibility:'visible',borderColor:color,fontSize:'38px'});return box};
  const inp=['The','cat','sat','on','the','mat'].map((w,i)=>tok(w,i,360,C.blue));
  show(inp,cue(sid,'inputs'),.4);const il=lab(S,'inputs',200,360,C.blue,32);show(il,cue(sid,'inputs'),.4);
  const tg=['The','cat','sat','on','the','mat','.'].map((w,i)=>tok(w,i,540,C.green));
  show(tg.slice(0,6),cue(sid,'targets'),.4);const tgl=lab(S,'targets',200,540,C.green,32);show(tgl,cue(sid,'targets'),.4);
  const T=cue(sid,'shifted');tl.to(tg,{x:-190,duration:.9,ease:'power2.inOut'},T);tl.to(tg[0],{autoAlpha:0,duration:.4},T);tl.to(tg[6],{autoAlpha:1,duration:.4},T+.4);
  const ar=[0,1,2,3,4,5].map(i=>ln(svg,slot(i),395,slot(i),500,C.dim,3));fadeIn(ar,cue(sid,'token'),.4);
  const ce=el(S,'cap',tex('L=-\\log p(\\text{next token})',50),{top:'640px'});show(ce,cue(sid,'cross-entropy'),.5);
  const big=el(S,'chip','a very large number of steps, across many machines',{borderColor:C.yellow,fontSize:'34px'});place(big,960,820);show(big,cue(sid,'thousands'),.4);
  nextCap(S,sid,'next',1,'7.3 &nbsp;reading loss curves');
  sceneInOut(sid,true);
})();

/* KaTeX stacks glyphs on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
