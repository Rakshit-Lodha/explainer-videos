function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers for plots, equations and code panels (module 5 and 7 lessons) ---- */
/* axes: plain x/y axes for a plot region, with optional axis captions */
function axes(svg,P,x0,x1,y0,y1,o){o=o||{};const g=svgEl('g',{},svg);
  if(o.grid){for(let x=Math.ceil(x0);x<=x1;x+=(o.step||1)){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}
    for(let y=Math.ceil(y0);y<=y1;y+=(o.step||1)){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}}
  const a=P(x0,o.yAxisAt||y0),b=P(x1,o.yAxisAt||y0),c=P(o.xAxisAt||x0,y0),d=P(o.xAxisAt||x0,y1);
  svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);
  tl.to(p,{autoAlpha:1,duration:.15},time);tl.to(p,{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut'},time)}
/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */
function morphFn(p,P,f,a,b,s0,n){const o={s:s0};const upd=()=>p.setAttribute('d',fnPath(P,x=>f(x,o.s),a,b,n));upd();
  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */
function texLbl(parent,s,x,y,size,color){const d=el(parent,'lbl',tex(s,size||56),{color:color||C.ink});place(d,x,y);return d}
function txt(parent,s,x,y,o){o=o||{};const d=el(parent,'lbl',s,Object.assign({color:C.ink,fontSize:'40px'},o));place(d,x,y);return d}
/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});
  const rows=lines.map(l=>el(b,'',l,{position:'relative'}));return {box:b,rows}}
const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;
function sceneIn(sid){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid])}

const root=$('root');
/* least-squares polynomial fit on x in [0,1] (mapped to t in [-1,1]) via normal equations */
function polyfit(xs,ys,deg){const m=deg+1,A=[],b=[];for(let i=0;i<m;i++){A.push(new Array(m).fill(0));b.push(0)}
  xs.forEach((x,k)=>{const t=2*x-1,pw=[];for(let i=0;i<m;i++)pw.push(Math.pow(t,i));for(let i=0;i<m;i++){b[i]+=pw[i]*ys[k];for(let j=0;j<m;j++)A[i][j]+=pw[i]*pw[j]}});
  for(let c=0;c<m;c++){let p=c;for(let r=c+1;r<m;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=c+1;r<m;r++){const f=A[r][c]/A[c][c];for(let j=c;j<m;j++)A[r][j]-=f*A[c][j];b[r]-=f*b[c]}}
  const w=new Array(m).fill(0);for(let i=m-1;i>=0;i--){let s=b[i];for(let j=i+1;j<m;j++)s-=A[i][j]*w[j];w[i]=s/A[i][i]}return w}
const pv=(w,x)=>{const t=2*x-1;let s=0;for(let i=w.length-1;i>=0;i--)s=s*t+w[i];return s};
const truth=x=>Math.sin(2*Math.PI*x);
function sample(seed,n){const r=seedRand(seed),xs=[],ys=[];for(let i=0;i<n;i++){const x=(i+.5)/n+(r()-.5)*.6/n;xs.push(x);let g=0;for(let k=0;k<6;k++)g+=r();ys.push(truth(x)+(g-3)*.42)}return [xs,ys]}
const [XS,YS]=sample(4,10);
function plotFrame(S,ox,oy,wd,ht,id){const P=(x,y)=>[ox+wd*x,oy-ht/3.4*y];const svg=layerSvg(S);
  svgEl('rect',{x:ox,y:oy-ht/2,width:wd,height:ht,fill:'none',stroke:C.grid,'stroke-width':2,opacity:.8},svg);
  const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x:ox,y:oy-ht/2,width:wd,height:ht},cp);
  const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return {P,svg,g}}

/* ===== S1: two students ===== */
(function(){const S=$('S1'),sid='s1';
  const card=(x,title,col)=>{const d=el(S,'abs hid','',{left:x+'px',top:'250px',width:'560px',height:'520px',borderRadius:'24px',border:'3px solid '+col,background:'#141a22'});
    el(d,'abs',title,{left:'0',top:'40px',width:'560px',textAlign:'center',fontSize:'48px',fontStyle:'italic',color:col});return d};
  const A=card(300,'memorises',C.pink),B=card(1060,'understands',C.teal);
  show(A,cue(sid,'memorises'),.6);show(B,cue(sid,'other'),.6);
  const row=(d,y,lab,val,col)=>{const l=el(d,'abs hid',lab,{left:'50px',top:y+'px',fontSize:'38px',color:C.dim,fontStyle:'italic'});const v=el(d,'abs hid mono',val,{left:'380px',top:(y-6)+'px',fontSize:'52px',color:col});return [l,v]};
  const a1=row(A,200,"last year's paper",'100%',C.ink),b1=row(B,200,"last year's paper",'100%',C.ink);
  const a2=row(A,330,'a fresh paper','35%',C.red),b2=row(B,330,'a fresh paper','90%',C.teal);
  show([...a1,...b1],cue(sid,'same'),.5);show([...a2,...b2],cue(sid,'fresh'),.6);
  const cap=el(S,'cap','fitting the seen data ≠ doing well on new data',{top:'860px',fontSize:'46px',fontStyle:'italic'});show(cap,cue(sid,'models'),.6);
  sceneInOut(sid);
})();

/* ===== S2: polynomials of growing degree ===== */
const FIT={};[1,3,9].forEach(d=>FIT[d]=polyfit(XS,YS,d));
(function(){const S=$('S2'),sid='s2';
  const {P,svg,g}=plotFrame(S,200,560,1000,640,'c2');
  const tr=mkPath(g,fnPath(P,truth,0,1),C.dim,4,{'stroke-dasharray':'12 10'});
  fadeIn(tr,cue(sid,'smooth'),.8);
  const tl1=txt(S,'the true curve',1450,300,{color:C.dim,fontSize:'38px',fontStyle:'italic'});show(tl1,cue(sid,'smooth'),.5);
  const dts=XS.map((x,i)=>dot(g,...P(x,YS[i]),11,C.blue));
  tl.fromTo(dts,{autoAlpha:0,scale:0,transformOrigin:'50% 50%'},{autoAlpha:1,scale:1,duration:.3,stagger:.1,ease:'back.out(2)',immediateRender:false},cue(sid,'sample'));
  const nl=txt(S,'+ noise',1450,370,{color:C.blue,fontSize:'38px',fontStyle:'italic'});show(nl,cue(sid,'noise'),.5);
  const fit=mkPath(g,'',C.yellow,6);
  const st={u:0};
  const f=x=>{const u=st.u;if(u<=1)return (1-u)*pv(FIT[1],x)+u*pv(FIT[3],x);const v=u-1;return (1-v)*pv(FIT[3],x)+v*pv(FIT[9],x)};
  const go=driver(st,()=>fit.setAttribute('d',fnPath(P,f,0,1,300)));
  const morph=(t,from,to)=>go(t,1.4,{u:to===3?1:2});
  fadeIn(fit,cue(sid,'straight'),.5);
  const labs=[['degree 1: too stiff, underfits','straight',C.ink],['degree 3: follows the curve','cubic',C.teal],['degree 9: through every point','high',C.pink]].map(([t,w,c],i)=>{const d=txt(S,t,1530,520+i*90,{color:c,fontSize:'38px'});show(d,cue(sid,w),.5);return d});
  morph(cue(sid,'cubic'),1,3);morph(cue(sid,'high'),3,9);
  const nz=txt(S,'it has fitted the noise',1530,820,{color:C.red,fontSize:'40px',fontStyle:'italic'});show(nz,cue(sid,'noise',2),.5);
  sceneInOut(sid);
})();

/* ===== S3: training vs test error ===== */
(function(){const S=$('S3'),sid='s3';
  const P=(d,e)=>[260+100*d,860-560*e];const svg=layerSvg(S);axes(svg,P,0,9.4,0,1.1);
  const tr=d=>.48*Math.exp(-.42*d)+.02,te=d=>tr(d)+.05+.011*d*d;let VB=0,VV=9;for(let d=0;d<9;d+=.02)if(te(d)<VV){VV=te(d);VB=d}
  const xl=txt(S,'model flexibility (degree)',P(4.7,0)[0],910,{color:C.dim,fontSize:'34px',fontStyle:'italic'}),yl=txt(S,'error',190,P(0,.55)[1],{color:C.dim,fontSize:'34px',fontStyle:'italic'});
  show([xl,yl],at(sid,.02),.5);
  const ct=mkPath(svg,fnPath(P,tr,0,9.2),C.blue,6),cs=mkPath(svg,fnPath(P,te,0,9.2),C.pink,6);
  drawOn(ct,cue(sid,'training'),1.6);
  const l1=txt(S,'training error',1500,330,{color:C.blue,fontSize:'42px'});show(l1,cue(sid,'training'),.5);
  drawOn(cs,cue(sid,'fresh'),1.6);
  const l2=txt(S,'test error',1500,410,{color:C.pink,fontSize:'42px'});show(l2,cue(sid,'fresh'),.5);
  const zone=svgEl('rect',{x:P(VB+.4,0)[0],y:P(0,1.1)[1],width:P(9.4,0)[0]-P(VB+.4,0)[0],height:P(0,0)[1]-P(0,1.1)[1],fill:C.red,'fill-opacity':.1,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(zone,cue(sid,'overfitting'),.6);
  const ov=txt(S,'overfitting',P(7.3,0)[0],P(0,1.02)[1],{color:C.red,fontSize:'40px',fontStyle:'italic'});show(ov,cue(sid,'overfitting'),.5);
  const vm=dot(svg,...P(VB,VV),14,C.yellow);fadeIn(vm,cue(sid,'valley'),.4);
  const vl=txt(S,'the model we want',P(VB,0)[0],P(0,VV)[1]-60,{color:C.yellow,fontSize:'38px',fontStyle:'italic'});show(vl,cue(sid,'valley'),.5);
  sceneInOut(sid);
})();

/* ===== S4: bias and variance ===== */
(function(){const S=$('S4'),sid='s4';
  const L=plotFrame(S,180,560,700,460,'c4a'),R=plotFrame(S,1040,560,700,460,'c4b');
  [L,R].forEach(o=>{const tr=mkPath(o.g,fnPath(o.P,truth,0,1),C.dim,3,{'stroke-dasharray':'10 9'});gsap.set(tr,{autoAlpha:1})});
  tl.fromTo([L.svg,R.svg],{autoAlpha:0},{autoAlpha:1,duration:.6,immediateRender:false},at(sid,.01));
  const tL=txt(S,'degree 1',530,280,{color:C.ink,fontSize:'40px'}),tR=txt(S,'degree 9',1390,280,{color:C.ink,fontSize:'40px'});
  show([tL,tR],at(sid,.02),.5);
  const bl=txt(S,'bias: always off in the same way',530,850,{color:C.yellow,fontSize:'38px',fontStyle:'italic'});show(bl,cue(sid,'bias'),.5);
  const seeds=[4,11,23,37,52];const cols=[C.yellow,C.teal,C.pink,C.green,C.blue];
  seeds.forEach((sd,k)=>{const [xs,ys]=sample(sd,10);
    const a=mkPath(L.g,fnPath(L.P,x=>pv(polyfit(xs,ys,1),x),0,1),cols[k],4),b=mkPath(R.g,fnPath(R.P,x=>pv(polyfit(xs,ys,9),x),0,1,300),cols[k],4);
    const t=k===0?cue(sid,'bias'):cue(sid,'redraw')+(k-1)*1.1;fadeIn(a,t,.5);fadeIn(b,k===0?cue(sid,'variance'):t,.5)});
  const vl=txt(S,'variance: jumps with every new sample',1390,850,{color:C.pink,fontSize:'38px',fontStyle:'italic'});show(vl,cue(sid,'variance'),.5);
  sceneInOut(sid);
})();

/* ===== S5: decomposition ===== */
(function(){const S=$('S5'),sid='s5';
  const eq=el(S,'abs hid','',{left:'160px',top:'150px',width:'1600px',textAlign:'center'});
  eq.innerHTML=tex('\\mathbb{E}\\big[(y-\\hat{y})^2\\big] = {\\color{#f5cf4a}\\text{bias}^2} + {\\color{#e77fb3}\\text{variance}} + {\\color{#7f8b99}\\text{noise}}',60);
  show(eq,cue(sid,'equals'),.8);
  const P=(d,e)=>[420+110*d,900-500*e];const svg=layerSvg(S);axes(svg,P,0,9.4,0,1.05);
  const b2=d=>.55*Math.exp(-.45*d),va=d=>.012*Math.exp(.36*d),nz=()=>.08,tot=d=>b2(d)+va(d)+nz();
  const cb=mkPath(svg,fnPath(P,b2,0,9.2),C.yellow,5),cv=mkPath(svg,fnPath(P,d=>Math.min(1,va(d)),0,9.2),C.pink,5),cn=mkPath(svg,fnPath(P,nz,0,9.2),C.dim,4,{'stroke-dasharray':'10 9'}),ct=mkPath(svg,fnPath(P,d=>Math.min(1.02,tot(d)),0,9.2),C.ink,6);
  drawOn(cb,cue(sid,'bias'),1);drawOn(cv,cue(sid,'variance'),1);drawOn(cn,cue(sid,'noise'),1);
  const fl=txt(S,'noise floor',P(9.6,0)[0]+40,P(0,.08)[1],{color:C.dim,fontSize:'34px',fontStyle:'italic'});show(fl,cue(sid,'floor'),.5);
  drawOn(ct,cue(sid,'flexible'),1.4);
  let best=0,bv=9;for(let d=0;d<9.2;d+=.05)if(tot(d)<bv){bv=tot(d);best=d}
  const bm=dot(svg,...P(best,bv),14,C.yellow);fadeIn(bm,cue(sid,'balances'),.4);
  const bt=txt(S,'balance',P(best,0)[0],P(0,bv)[1]-50,{color:C.yellow,fontSize:'38px',fontStyle:'italic'});show(bt,cue(sid,'balances'),.5);
  const xl=txt(S,'flexibility →',P(4.7,0)[0],950,{color:C.dim,fontSize:'32px',fontStyle:'italic'});show(xl,cue(sid,'flexible'),.4);
  sceneInOut(sid);
})();

/* ===== S6: more data tames variance ===== */
(function(){const S=$('S6'),sid='s6';
  const {P,svg,g}=plotFrame(S,200,560,1000,640,'c6');
  mkPath(g,fnPath(P,truth,0,1),C.dim,4,{'stroke-dasharray':'12 10',style:''});
  tl.fromTo(svg,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},at(sid,.01));
  const few=XS.map((x,i)=>dot(g,...P(x,YS[i]),10,C.blue));const wild=mkPath(g,fnPath(P,x=>pv(FIT[9],x),0,1,300),C.pink,5);
  fadeIn([...few,wild],at(sid,.03),.5);
  const [X2,Y2]=sample(77,60);const many=X2.map((x,i)=>dot(g,...P(x,Y2[i]),8,C.blue));
  const calm=mkPath(g,fnPath(P,x=>pv(polyfit(X2,Y2,9),x),0,1,300),C.yellow,6);
  tl.fromTo(many,{autoAlpha:0,scale:0,transformOrigin:'50% 50%'},{autoAlpha:1,scale:1,duration:.25,stagger:.03,immediateRender:false},cue(sid,'data'));
  fadeOut(wild,cue(sid,'pin'),.6);drawOn(calm,cue(sid,'pin'),1.2);
  const l1=txt(S,'degree 9, ten points',1530,360,{color:C.pink,fontSize:'38px'}),l2=txt(S,'degree 9, sixty points',1530,440,{color:C.yellow,fontSize:'38px'});
  show(l1,at(sid,.04),.5);show(l2,cue(sid,'pin'),.5);
  const ch=[['simpler model','simpler'],['penalise wildness: regularisation','regularisation']].map(([t,w],i)=>{const d=el(S,'chip',t,{left:'1290px',top:(560+i*110)+'px',borderColor:C.teal,fontSize:'34px'});show(d,cue(sid,w),.5);return d});
  const j=txt(S,'judge on unseen data',1530,860,{color:C.ink,fontSize:'40px',fontStyle:'italic'});show(j,cue(sid,'judge'),.5);
  sceneInOut(sid);
})();

/* ===== S7: LLMs, double descent, held-out loss ===== */
(function(){const S=$('S7'),sid='s7';
  const P=(x,e)=>[180+75*x,820-480*e];const svg=layerSvg(S);axes(svg,P,0,10,0,1.05);
  const dd=x=>.16+.45*Math.exp(-.6*x)+.62*Math.exp(-((x-5)**2)/.9)-.012*Math.max(0,x-5);
  const c=mkPath(svg,fnPath(P,dd,0,10,200),C.pink,5);drawOn(c,cue(sid,'double'),1.8);
  const t1=txt(S,'test error',P(5,0)[0],220,{color:C.pink,fontSize:'36px',fontStyle:'italic'}),t2=txt(S,'parameters →',P(5,0)[0],870,{color:C.dim,fontSize:'32px',fontStyle:'italic'});
  show([t1,t2],cue(sid,'double'),.5);
  const dl=txt(S,'double descent (a sketch)',P(5,0)[0],940,{color:C.dim,fontSize:'32px',fontStyle:'italic'});show(dl,cue(sid,'descent'),.5);
  const Q=(x,e)=>[1120+70*x,820-480*e];axes(svg,Q,0,9,0,1.05);
  const trn=x=>.9*Math.exp(-.35*x)+.05,val=x=>.9*Math.exp(-.35*x)+.08+(x>4.5?.02*(x-4.5)**2:0);
  const a=mkPath(svg,fnPath(Q,trn,0,9),C.blue,5),b=mkPath(svg,fnPath(Q,val,0,9),C.yellow,5);
  drawOn(a,cue(sid,'training',1),1.2);drawOn(b,cue(sid,'held-out'),1.2);
  const la=txt(S,'training loss',Q(6.3,0)[0],350,{color:C.blue,fontSize:'34px'}),lb=txt(S,'held-out loss',Q(6.3,0)[0],300,{color:C.yellow,fontSize:'34px'});
  show(la,cue(sid,'training'),.4);show(lb,cue(sid,'held-out'),.4);
  const gap=txt(S,'a widening gap = memorising',Q(4.5,0)[0],220,{color:C.ink,fontSize:'36px',fontStyle:'italic'});show(gap,cue(sid,'gap'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.4 &nbsp;regularisation (L1, L2)',{top:'980px',fontSize:'36px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
