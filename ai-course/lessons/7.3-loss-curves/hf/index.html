/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}
/* axes for a loss chart with origin (ox,oy), width w, height h */
function axes(svg,ox,oy,w,h){const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('line',{x1:ox,y1:oy,x2:ox+w,y2:oy,stroke:C.axis,'stroke-width':3},g);svgEl('line',{x1:ox,y1:oy,x2:ox,y2:oy-h,stroke:C.axis,'stroke-width':3},g);return g}
const healthy=x=>3.6*Math.exp(-.8*x)+.6;

/* ============ S1: the patient chart ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const P=plane(300,820,170,120);
  const ax=axes(svg,300,820,1380,620);fadeIn(ax,cue(sid,'plots'),.4);
  const yl=lab(S,'loss',300,170,C.dim,30);const xl=lab(S,'training steps',990,870,C.dim,30);fadeIn([yl,xl],cue(sid,'plots'),.4);
  const c=pth(svg,fpath(healthy,P,.02,8,200),C.blue,5);drawOn(c,cue(sid,'loss',2),1.6);
  const q=[['is training healthy?','healthy',C.green],['is the learning rate right?','wrong',C.yellow],['is it starting to memorise?','memorise',C.red]];
  q.forEach(([t,w,col],i)=>{const e=el(S,'chip',t,{borderColor:col,fontSize:'34px'});place(e,1420,300+i*90);show(e,cue(sid,w),.4)});
  const g=el(S,'cap','learning to read it saves hours of guessing',{top:'930px',fontSize:'40px',fontStyle:'italic',color:C.teal});show(g,cue(sid,'saves'),.5);
  sceneInOut(sid);
})();

/* ============ S2: a healthy curve, jitter and a moving average ============ */
(function(){const S=$('S2');const sid='s2';const svg=layerSvg(S);
  const P=plane(300,820,170,120);
  const ax=axes(svg,300,820,1380,620);fadeIn(ax,at(sid,0),.4);
  const xl=lab(S,'training steps',990,870,C.dim,30);fadeIn(xl,at(sid,0),.4);
  const rnd=seedRand(42);const N=170;const xs=[],ys=[];
  for(let i=0;i<N;i++){const x=.05+i*(7.95/(N-1));xs.push(x);ys.push(healthy(x)+(rnd()-.5)*.55*(.45+.55*Math.exp(-.25*x)))}
  const toD=arr=>arr.map((y,i)=>{const p=P(xs[i],y);return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
  const raw=pth(svg,toD(ys),C.blue,2.5,{opacity:.7});drawOn(raw,cue(sid,'drops'),3,'none');
  let m=ys[0];const em=ys.map(v=>(m=.9*m+.1*v));
  const ema=pth(svg,toD(em),C.yellow,5);drawOn(ema,cue(sid,'moving'),2,'power1.inOut');
  const e1=lab(S,'steep at first: the easy patterns',P(1.1,0)[0]+260,P(0,healthy(.6))[1],C.ink,32);show(e1,cue(sid,'easy'),.4);
  const e2=lab(S,'then a long, slow decline',P(5,0)[0],P(0,1.5)[1],C.ink,32);show(e2,cue(sid,'decline'),.4);
  const e3=lab(S,'jitter: every mini-batch is different',P(5,0)[0],P(0,2.1)[1],C.blue,32);show(e3,cue(sid,'mini-batch'),.4);
  const f=el(S,'abs hid','',{left:'1080px',top:'230px',width:'760px',textAlign:'center'});f.innerHTML=tex('m_t=\\beta\\,m_{t-1}+(1-\\beta)\\,x_t',50);show(f,cue(sid,'blends'),.5);
  const car=lab(S,'the average speed, not the needle',1460,380,C.yellow,32);show(car,cue(sid,'speed'),.4);
  const ml=lab(S,'moving average',P(7.2,0)[0],P(0,healthy(7.2))[1]+45,C.yellow,30);show(ml,cue(sid,'average'),.4);
  sceneInOut(sid);
})();

/* ============ S3: learning-rate fingerprints ============ */
(function(){const S=$('S3');const sid='s3';const svg=layerSvg(S);
  const panels=[[360,'too small',C.blue,x=>4.2-.27*x,'small','slow, almost straight','straight'],
    [960,'too large',C.red,x=>Math.min(5.3,2.5+.9*Math.sin(4.6*x)+.06*Math.pow(x,2.2)),'large','bounces, then climbs','bounces'],
    [1560,'about right',C.green,x=>3.6*Math.exp(-.9*x)+.5,'good','falls quickly yet steadily','quickly']];
  panels.forEach(([cx,t,col,f,w,d,wd])=>{const ox=cx-210,P=plane(ox,760,52,80);
    const ax=axes(svg,ox,760,430,450);fadeIn(ax,cue(sid,w),.3);
    const ti=lab(S,t,cx,250,col,40,false);show(ti,cue(sid,w),.4);
    const c=pth(svg,fpath(f,P,0,8,200),col,5);drawOn(c,cue(sid,w)+.2,1.4);
    const dl=lab(S,d,cx,820,C.ink,32);show(dl,cue(sid,wd),.4)});
  const nan=lab(S,'NaN',1120,282,C.red,48,false);show(nan,cue(sid,'number'),.3);
  const top=el(S,'cap','the learning rate leaves clear fingerprints',{top:'120px',fontSize:'42px',fontStyle:'italic',color:C.dim});show(top,cue(sid,'fingerprints'),.5);
  sceneInOut(sid);
})();

/* ============ S4: training vs validation ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const P=plane(300,820,170,120);
  const ax=axes(svg,300,820,1380,620);fadeIn(ax,at(sid,0),.4);
  const xl=lab(S,'training steps',990,870,C.dim,30);fadeIn(xl,at(sid,0),.4);
  const tr=x=>3.6*Math.exp(-.6*x)+.35,va=x=>3.6*Math.exp(-.55*x)+.75+(x>3.6?.12*(x-3.6)*(x-3.6):0);
  const ta=pth(svg,fpath(tr,P,.02,3.6,90),C.blue,5),vaA=pth(svg,fpath(va,P,.02,3.6,90),C.yellow,5);
  drawOn(ta,cue(sid,'fall'),1.5);drawOn(vaA,cue(sid,'fall'),1.5);
  const tb=pth(svg,fpath(tr,P,3.6,8,110),C.blue,5),vb=pth(svg,fpath(va,P,3.6,8,110),C.yellow,5);
  drawOn(tb,cue(sid,'keeps'),1.5);drawOn(vb,cue(sid,'turns'),1.5);
  const tl1=lab(S,'training',P(7.6,0)[0],P(0,tr(7.6))[1]-35,C.blue,30);show(tl1,cue(sid,'training',2),.4);
  const vl=lab(S,'validation',P(7.4,0)[0],P(0,va(7.4))[1]-40,C.yellow,30);show(vl,cue(sid,'validation',2),.4);
  const both=lab(S,'both fall: patterns that carry over to new data',1280,250,C.ink,34);show(both,cue(sid,'carry'),.4);
  const ov=lab(S,'overfitting, seen live',1280,320,C.red,38);show(ov,cue(sid,'overfitting'),.4);
  let bx=3.6;for(let x=3.6;x<6;x+=.01)if(va(x)<va(bx))bx=x;
  const bp=P(bx,va(bx));
  const ring=svgEl('circle',{cx:bp[0],cy:bp[1],r:18,fill:'none',stroke:C.green,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);fadeIn(ring,cue(sid,'lowest'),.3);
  const vline=ln(svg,bp[0],bp[1]+20,bp[0],820,C.green,2,{'stroke-dasharray':'6 6'});fadeIn(vline,cue(sid,'lowest'),.3);
  const es=lab(S,'early stopping keeps these weights',bp[0],930,C.green,34);show(es,cue(sid,'early'),.4);
  sceneInOut(sid);
})();

/* ============ S5: underfitting and plateaus ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const L=plane(250,700,68,80),R=plane(1050,700,68,80);
  const a1=axes(svg,250,700,560,420),a2=axes(svg,1050,700,560,420);
  fadeIn(a1,cue(sid,'both'),.3);
  const ut=x=>2.9+.05*Math.sin(5*x),uv=x=>3.15+.05*Math.sin(4*x);
  const c1=pth(svg,fpath(ut,L,0,8,120),C.blue,5),c2=pth(svg,fpath(uv,L,0,8,120),C.yellow,5);drawOn(c1,cue(sid,'high'),1);drawOn(c2,cue(sid,'high'),1);
  const t1=lab(S,'both high and flat: underfitting',530,220,C.ink,36);show(t1,cue(sid,'underfitting'),.4);
  [['model too small?','small'],['learning rate too low?','low'],['a bug blocks the gradient?','bug']].forEach(([t,w],i)=>{const e=el(S,'chip',t,{borderColor:C.dim,fontSize:'32px'});place(e,530,790+i*75);show(e,cue(sid,w),.4)});
  fadeIn(a2,cue(sid,'plateau'),.3);
  const pf=x=>x<4.6?3-.35*(1-Math.exp(-x)):2.65-1.8/(1+Math.exp(-(x-5.1)*3))+1.8/(1+Math.exp(1.5));
  const c3=pth(svg,fpath(pf,R,0,8,200),C.blue,5);drawOn(c3,cue(sid,'plateau'),1.8);
  const t2=lab(S,'a long plateau, then a sudden drop',1330,220,C.ink,36);show(t2,cue(sid,'plateau'),.4);
  const t3=lab(S,'stuck near a flat region',R(2.3,0)[0],R(0,pf(2.3))[1]-45,C.dim,30);show(t3,cue(sid,'flat',2),.4);
  const t4=el(S,'chip','patience can be the right call',{borderColor:C.green,fontSize:'32px'});place(t4,1330,790);show(t4,cue(sid,'patience'),.4);
  sceneInOut(sid);
})();

/* ============ S6: where the curve should start ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const bars=[];for(let i=0;i<10;i++){bars.push(svgEl('rect',{x:220+i*50,y:600,width:40,height:60,rx:4,fill:C.blue,'fill-opacity':.8,style:'opacity:0;visibility:hidden'},svg))}
  const base=ln(svg,210,660,720,660,C.axis,2);
  tl.to([base,...bars],{autoAlpha:1,duration:.2,stagger:.04},cue(sid,'uniformly'));
  const bl=lab(S,'a uniform guess: 1/C on each of C classes',465,720,C.dim,30);show(bl,cue(sid,'uniformly'),.4);
  const f=el(S,'abs hid','',{left:'210px',top:'300px',width:'510px',textAlign:'center'});f.innerHTML=tex('L_0=\\ln C',60);show(f,cue(sid,'natural'),.5);
  const f2=el(S,'abs hid','',{left:'140px',top:'420px',width:'650px',textAlign:'center'});f2.innerHTML=tex('C=10:\\ \\ln 10\\approx 2.30',46);show(f2,cue(sid,'two'),.5);
  const P=plane(900,820,110,62);const ax=axes(svg,900,820,900,600);fadeIn(ax,cue(sid,'curve'),.4);
  const xl=lab(S,'training steps',1350,870,C.dim,30);fadeIn(xl,cue(sid,'curve'),.4);
  const ref=ln(svg,900,P(0,2.3)[1],1800,P(0,2.3)[1],C.green,2,{'stroke-dasharray':'8 7'});fadeIn(ref,cue(sid,'two'),.4);
  const rl=lab(S,'ln 10 ≈ 2.3',1720,P(0,2.3)[1]-28,C.green,28,false);show(rl,cue(sid,'two'),.4);
  const g=pth(svg,fpath(x=>1.8*Math.exp(-.6*x)+.5,P,0,8,120),C.green,5);drawOn(g,cue(sid,'two')+.4,1.2);
  const hi=pth(svg,fpath(x=>8.5*Math.exp(-.9*x)+.5,P,0,8,120),C.red,5);drawOn(hi,cue(sid,'above'),1.2);
  const hl=lab(S,'far above: something is badly scaled',1400,P(0,8.6)[1],C.red,32);show(hl,cue(sid,'above'),.4);
  const lo=pth(svg,fpath(x=>.15*Math.exp(-.3*x)+.03,P,0,8,120),C.purple,5);drawOn(lo,cue(sid,'below'),1.2);
  const ll=lab(S,'far below: it may be seeing the answers',1400,P(0,4.4)[1],C.purple,32);show(ll,cue(sid,'below'),.4);
  sceneInOut(sid);
})();

/* ============ S7: spikes in large runs ============ */
(function(){const S=$('S7');const sid='s7';const svg=layerSvg(S);
  const P=plane(300,800,170,110);const ax=axes(svg,300,800,1380,560);fadeIn(ax,at(sid,0),.4);
  const xl=lab(S,'tokens processed',990,850,C.dim,30);show(xl,cue(sid,'tokens'),.4);
  const base=x=>3.2*Math.exp(-.45*x)+1.2,spk=x=>base(x)+1.7*Math.exp(-Math.pow((x-5.2)/.09,2));
  const A1=pth(svg,fpath(base,P,.02,4.6,120),C.blue,5),A2=pth(svg,fpath(spk,P,4.6,5.6,160),C.blue,5);
  drawOn(A1,cue(sid,'curves'),1.8,'none');drawOn(A2,cue(sid,'curves')+1.8,.6,'none');
  const sp=P(5.2,spk(5.2));const ring=svgEl('circle',{cx:sp[0],cy:sp[1]+8,r:30,fill:'none',stroke:C.red,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);fadeIn(ring,cue(sid,'spikes'),.3);
  const sl=lab(S,'a sudden loss spike',sp[0]+220,sp[1],C.red,34);show(sl,cue(sid,'spikes'),.4);
  const cp=P(4.6,base(4.6));const dia=svgEl('rect',{x:cp[0]-12,y:cp[1]-12,width:24,height:24,fill:C.green,transform:`rotate(45 ${cp[0]} ${cp[1]})`,style:'opacity:0;visibility:hidden'},svg);fadeIn(dia,cue(sid,'restarting'),.3);
  const rw=pth(svg,`M${sp[0]-10} ${sp[1]-30} Q ${(sp[0]+cp[0])/2} ${sp[1]-150} ${cp[0]+4} ${cp[1]-30}`,C.green,4);drawOn(rw,cue(sid,'restarting'),.7);
  const rh=arrowHead(svg,cp[0]+4,cp[1]-30,.25,.97,C.green);fadeIn(rh,cue(sid,'restarting')+.6,.2);
  const cl=lab(S,'restart from an earlier checkpoint',cp[0]-60,sp[1]-170,C.green,32);show(cl,cue(sid,'checkpoint'),.4);
  tl.to(A2,{opacity:.2,duration:.4},cue(sid,'skipping'));
  const B=pth(svg,fpath(base,P,4.6,8,120),C.teal,5);drawOn(B,cue(sid,'skipping'),1.4);
  const bl=lab(S,'and skip the batches that triggered it',1350,P(0,base(7.5))[1]+50,C.teal,32);show(bl,cue(sid,'skipping'),.4);
  nextCap(S,sid,'next',1,'7.4 &nbsp;debugging a model that won’t learn');
  sceneInOut(sid,true);
})();

/* KaTeX stacks glyphs on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
</body>
