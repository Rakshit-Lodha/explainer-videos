function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}

/* ============ S3: linear AE = PCA; nonlinear follows curves ============ */
(function(){const S=$('S3');const sid='s3';
  const P=plane(560,520,110);const svg=layerSvg(S);
  const g=drawGrid(svg,P,-4,4,-3,3);g.setAttribute('style','opacity:0;visibility:hidden');fadeIn(g,at(sid,.01),.5);
  const rnd=seedRand(21);const pts=[];for(let i=0;i<40;i++){const t=(rnd()*2-1)*3.2,n=(rnd()*2-1)*.45;pts.push([t*.89-n*.45,t*.45+n*.89])}
  const dots=pts.map(([x,y])=>svgEl('circle',{cx:P(x,y)[0],cy:P(x,y)[1],r:8,fill:C.blue,style:'opacity:0;visibility:hidden'},svg));
  tl.to(dots,{autoAlpha:1,duration:.2,stagger:.02},at(sid,.02));
  const dir=pxArrow(svg,C.yellow,6,P(-3.4*.89,-3.4*.45)[0],P(-3.4*.89,-3.4*.45)[1],P(3.4*.89,3.4*.45)[0],P(3.4*.89,3.4*.45)[1]);
  growPx(dir,cue(sid,'directions'),.8);
  const drops=pts.map(([x,y])=>{const t=x*.89+y*.45;return ln(svg,P(x,y)[0],P(x,y)[1],P(t*.89,t*.45)[0],P(t*.89,t*.45)[1],C.dim,2)});
  tl.to(drops,{autoAlpha:.7,duration:.3,stagger:.02},cue(sid,'explain'));
  const pca=txt(S,'linear autoencoder ≡ PCA subspace',1440,300,{fs:38,color:C.yellow});show(pca,cue(sid,'linear'),.4);
  const pc2=txt(S,'(principal component analysis)',1440,360,{fs:30,it:true,color:C.dim});show(pc2,cue(sid,'principal'),.4);
  tl.to([...dots,...drops,dir.g],{autoAlpha:0,duration:.4},cue(sid,'nonlinear')-.3);
  const cpts=[];for(let i=0;i<40;i++){const t=-2.6+5.2*rnd(),n=(rnd()*2-1)*.25;cpts.push([t,1.6-0.45*t*t+n])}
  const cd=cpts.map(([x,y])=>svgEl('circle',{cx:P(x,y)[0],cy:P(x,y)[1],r:8,fill:C.green,style:'opacity:0;visibility:hidden'},svg));
  tl.to(cd,{autoAlpha:1,duration:.2,stagger:.02},cue(sid,'nonlinear'));
  const cv=pth(svg,polyD(P,pts2d(x=>1.6-0.45*x*x,-2.8,2.8,60)),C.pink,5);drawOn(cv,cue(sid,'curved'),1.0);
  const fl=pth(svg,polyD(P,[[-3,-.2],[3,-.2]]),C.dim,3,{dash:'10 8'});fadeIn(fl,cue(sid,'flat'),.4);
  const nl=txt(S,'nonlinear: follows the curve',1440,520,{fs:36,color:C.pink}),fl2=txt(S,'a flat projection misses it',1440,590,{fs:32,it:true,color:C.dim});
  show(nl,cue(sid,'curved'),.4);show(fl2,cue(sid,'flat'),.4);
  sceneInOut(sid);
})();
