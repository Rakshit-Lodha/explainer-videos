  const cells=[0,1].map(r=>[0,1].map(c=>el(box,'cell',vals[r][c],{left:(20+c*cw)+'px',top:(pad+r*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:cols[c]})));
  return {box,cells,cx,cy,W,H,cw,rowH,pad}}
/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

const ID=(x,y)=>[x,y];
function box(parent,cx,cy,w,h,html,col,o){const d=el(parent,'abs hid','',Object.assign({left:(cx-w/2)+'px',top:(cy-h/2)+'px',width:w+'px',height:h+'px',border:`3px solid ${col}`,borderRadius:'14px',background:'#141b24',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'44px',color:C.ink},o||{}));d.innerHTML=html;return d}
function link(svg,x0,y,x1,col){const a=mkArrow(svg,ID,col||C.dim,4);setArrow(a,{x0,y0:y,x1,y1:y});return a}
const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'0',top:top+'px',width:'1920px',textAlign:'center'},o||{}));

/* ============ S1: a stack of functions ============ */
(function(){const S=$('S1'),sid='s1';const svg=layerSvg(S);
  const xs=[260,620,960,1300,1660],y=430;
  const ends=[el(S,'abs hid',tex('x',60),{left:(xs[0]-40)+'px',top:(y-45)+'px',width:'80px',textAlign:'center'}),el(S,'abs hid',tex('y',60),{left:(xs[4]-40)+'px',top:(y-45)+'px',width:'80px',textAlign:'center'})];
  const bx=['f','g','h'].map((n,i)=>box(S,xs[i+1],y,190,130,tex(n,64),C.blue));
  const ln=[0,1,2,3].map(i=>link(svg,xs[i]+(i?100:50),y,xs[i+1]-(i<3?100:50)));
  const sl=["f'","g'","h'"].map((n,i)=>{const d=el(S,'abs hid',tex(n,48),{left:(xs[i+1]-80)+'px',top:(y+90)+'px',width:'160px',textAlign:'center',color:C.yellow});return d});
  show(ends[0],cue(sid,'stack'),.4);bx.forEach((b,i)=>show(b,cue(sid,'stack')+.25*(i+1),.4));show(ends[1],cue(sid,'next'),.4);
  ln.forEach((a,i)=>showArrow(a,cue(sid,'feeding')+.3*i,.3));
  const q=panel(S,'slope of the whole stack?',650,{fontSize:'48px',fontStyle:'italic'});show(q,cue(sid,'whole'),.5);
  sl.forEach((d,i)=>show(d,cue(sid,'slopes')+.2*i,.4));
  fadeOut(q,cue(sid,'short')-.2,.3);
  const r=panel(S,tex("\\frac{dy}{dx}=h'\\cdot g'\\cdot f'",64),640,{color:C.yellow});show(r,cue(sid,'rates'),.6);
  const t=panel(S,'rates multiply',800,{fontSize:'56px',fontStyle:'italic',color:C.pink});show(t,cue(sid,'multiply'),.5);
  sceneInOut(sid);
})();

/* ============ S2: three gears ============ */
(function(){const S=$('S2'),sid='s2';const svg=layerSvg(S);
  const gear=(cx,cy,r,n,col)=>{const pts=[];for(let i=0;i<n*2;i++){const a=i/(n*2)*2*Math.PI,rr=i%2?r:r+Math.min(18,r*.28);const a1=a-Math.PI/(n*2)*.45,a2=a+Math.PI/(n*2)*.45;pts.push([cx+rr*Math.cos(a1),cy+rr*Math.sin(a1)],[cx+rr*Math.cos(a2),cy+rr*Math.sin(a2)])}
    const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
    svgEl('polygon',{points:pts.map(p=>p.join(',')).join(' '),fill:col+'33',stroke:col,'stroke-width':4},g);
    svgEl('circle',{cx,cy,r:r*.18,fill:'#0e1116',stroke:col,'stroke-width':4},g);
    svgEl('line',{x1:cx,y1:cy,x2:cx+r*.85,y2:cy,stroke:col,'stroke-width':6,'stroke-linecap':'round'},g);
    return {g,cx,cy}};
  const R1=200,R2=100,R3=34,cy=520,c1=430,c2=c1+R1+R2+14,c3=c2+R2+R3+14;
  const G1=gear(c1,cy,R1,36,C.blue),G2=gear(c2,cy,R2,18,C.yellow),G3=gear(c3,cy,R3,6,C.pink);
  const cnt=el(S,'abs hid mono','',{left:'1140px',top:'260px',width:'720px',textAlign:'center',fontSize:'36px'});
  const W=anim({th:0},o=>{G1.g.setAttribute('transform',`rotate(${o.th*360} ${G1.cx} ${G1.cy})`);G2.g.setAttribute('transform',`rotate(${-o.th*720+5} ${G2.cx} ${G2.cy})`);G3.g.setAttribute('transform',`rotate(${o.th*2160} ${G3.cx} ${G3.cy})`);
    cnt.innerHTML=`turns: <span style="color:#58c4dd">${o.th.toFixed(2)}</span> &nbsp; <span style="color:#f5cf4a">${(2*o.th).toFixed(2)}</span> &nbsp; <span style="color:#e77fb3">${(6*o.th).toFixed(2)}</span>`});
  sceneIn(sid);
  fadeIn([G1.g,G2.g,G3.g],cue(sid,'gears'),.6,.15);fadeIn(cnt,cue(sid,'gears'),.5);
  W.to(cue(sid,'gears')+.5,SPAN[sid]-2,{th:1.25},'none');
  const r1=el(S,'abs hid','middle per first: ×2',{left:'1140px',top:'380px',width:'720px',textAlign:'center',fontSize:'44px',color:C.yellow});show(r1,cue(sid,'twice'),.4);
  const r2=el(S,'abs hid','last per middle: ×3',{left:'1140px',top:'460px',width:'720px',textAlign:'center',fontSize:'44px',color:C.pink});show(r2,cue(sid,'three'),.4);
  const r3=el(S,'abs hid','last per first: 2 × 3 = 6',{left:'1140px',top:'580px',width:'720px',textAlign:'center',fontSize:'52px'});show(r3,cue(sid,'six'),.5);
  const r4=el(S,'abs hid','rates multiply as the motion passes along',{left:'1140px',top:'700px',width:'720px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.dim});show(r4,cue(sid,'rates'),.5);
  tl.to(S,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5);
})();

/* ============ persistent stage s3-s4: x → [u = 3x] → [y = u²] ============ */
const STAGE=$('STAGE');const ssvg=layerSvg(STAGE);
const CY=330,X0=250,B1=700,B2=1200,X3=1660;
const sx=el(STAGE,'abs',tex('x',64),{left:(X0-50)+'px',top:(CY-45)+'px',width:'100px',textAlign:'center'});
const sb1=box(STAGE,B1,CY,260,130,tex('u=3x',54),C.blue);sb1.classList.remove('hid');
const sb2=box(STAGE,B2,CY,260,130,tex('y=u^2',54),C.yellow);sb2.classList.remove('hid');
const sy=el(STAGE,'abs',tex('y',64),{left:(X3-50)+'px',top:(CY-45)+'px',width:'100px',textAlign:'center'});
[[X0+50,B1-140],[B1+140,B2-140],[B2+140,X3-50]].forEach(([a,b])=>{const l=link(ssvg,a,CY,b);l.g.setAttribute('style','')});
const r1=el(STAGE,'abs hid',tex('\\times 3',46),{left:(B1-130)+'px',top:(CY+80)+'px',width:'260px',textAlign:'center',color:C.blue});
const r2=el(STAGE,'abs hid',tex('\\times 2u',46),{left:(B2-130)+'px',top:(CY+80)+'px',width:'260px',textAlign:'center',color:C.yellow});
tl.to(STAGE,{autoAlpha:1,duration:.6},START.s3);tl.to(STAGE,{autoAlpha:0,duration:.6},START.s5-.3);

/* ============ S3: a nudge is magnified at each link ============ */
(function(){const S=$('S3'),sid='s3';
  const bars=[[X0,24,C.green,'Δx','nudge'],[B1,72,C.blue,'Δu = 3Δx','reaches'],[B2+40,432,C.pink,'Δy = 2u · Δu','y']];
  const by=560;
  bars.forEach(([x,w,col,lab,cw],i)=>{const b=el(S,'abs hid','',{left:(x-w/2)+'px',top:by+'px',width:w+'px',height:'26px',background:col,borderRadius:'6px'});
    const l=el(S,'abs hid','',{left:(x-200)+'px',top:(by+40)+'px',width:'400px',textAlign:'center',fontSize:'36px',color:col});l.textContent=lab;
    const t=i==2?cue(sid,'y',3):cue(sid,cw);tl.fromTo(b,{autoAlpha:0,scaleX:0},{autoAlpha:1,scaleX:1,duration:.6,ease:'power2.out',immediateRender:false},t);show(l,t,.4)});
  show(r1,cue(sid,'magnified'),.4);show(r2,cue(sid,'magnified',2),.4);
  const f=el(S,'abs hid',tex('\\frac{dy}{dx}=\\frac{dy}{du}\\cdot\\frac{du}{dx}=2u\\cdot 3=18x',60),{left:'0',top:'760px',width:'1920px',textAlign:'center',color:C.ink});
  show(f,cue(sid,'multiply'),.7);
  sceneInOut(sid);
})();

/* ============ S4: not cancelling fractions: a nudge travelling down the chain ============ */
(function(){const S=$('S4'),sid='s4';
  const f=el(S,'abs hid','',{left:'0',top:'600px',width:'1920px',textAlign:'center'});
  f.innerHTML=tex('\\frac{dy}{\\cancel{du}}\\cdot\\frac{\\cancel{du}}{dx}',64);
  show(f,cue(sid,'notation'),.6);
  const ma=el(S,'abs hid','a memory aid, not the reason',{left:'0',top:'760px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});show(ma,cue(sid,'memory'),.5);
  fadeOut([f,ma],cue(sid,'picture'),.4);
  const svg=layerSvg(S);
  const dot=svgEl('circle',{cx:X0,cy:CY,r:14,fill:C.green,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(dot,cue(sid,'nudge'),.3);
  tl.to(dot,{attr:{cx:B1,r:20},duration:1.2,ease:'power1.inOut',immediateRender:false},cue(sid,'travelling'));
  tl.to(dot,{attr:{fill:C.blue},duration:.3,immediateRender:false},cue(sid,'travelling')+1.2);
  tl.to(dot,{attr:{cx:B2,r:30},duration:1.2,ease:'power1.inOut',immediateRender:false},cue(sid,'scaled'));
  tl.to(dot,{attr:{fill:C.yellow},duration:.3,immediateRender:false},cue(sid,'scaled')+1.2);
  tl.to(dot,{attr:{cx:X3,r:44},duration:1.2,ease:'power1.inOut',immediateRender:false},cue(sid,'every'));
  fadeOut(dot,cue(sid,'each'),.4);
  const own=el(S,'abs hid','each link uses its slope where the signal sits',{left:'0',top:'560px',width:'1920px',textAlign:'center',fontSize:'44px',fontStyle:'italic'});show(own,cue(sid,'own'),.5);
  const inr=el(S,'abs hid',tex('x=1\\ \\Rightarrow\\ u=3\\ \\Rightarrow\\ \\tfrac{dy}{du}=2u=6',54),{left:'0',top:'680px',width:'1920px',textAlign:'center',color:C.yellow});show(inr,cue(sid,'inner'),.6);
  const ev=el(S,'abs hid','evaluate the inner function first',{left:'0',top:'800px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});show(ev,cue(sid,'evaluated'),.5);
  sceneInOut(sid);
})();

/* ============ persistent layer s5-s6: a neuron as a chain ============ */
const NL=el($('root'),'layer','');const nsvg=layerSvg(NL);
const NY=380,NX=[160,480,810,1140,1470,1830];
const nIn=el(NL,'abs',tex('w',60),{left:(NX[0]-50)+'px',top:(NY-45)+'px',width:'100px',textAlign:'center',color:C.yellow});
const NB=[[tex('\\times x',48),'multiply'],[tex('+\\,b',48),'bias'],[tex('\\sigma',56),'sigmoid'],[tex('(a-t)^2',44),'error']].map(([h],i)=>{const b=box(NL,NX[i+1],NY,220,120,h,i==3?C.red:C.blue);return b});
const nArr=[0,1,2,3].map(i=>{const a=link(nsvg,NX[i]+(i?120:50),NY,NX[i+1]-120);return a});
const nOut=el(NL,'abs hid',tex('E',60),{left:(NX[5]-10)+'px',top:(NY-45)+'px',width:'100px',textAlign:'center',color:C.red});
tl.to(NL,{autoAlpha:1,duration:.6},START.s5);tl.to(NL,{autoAlpha:0,duration:.6},START.s7-.3);
const fwd=['0.5','1.0','0.5','0.62','0.14'];
const fwdL=fwd.map((v,i)=>el(NL,'abs hid mono',v,{left:((NX[i]+NX[i+1])/2-70)+'px',top:(NY-72)+'px',width:'140px',textAlign:'center',fontSize:'32px',color:C.green}));
const loc=[tex('\\tfrac{\\partial z}{\\partial w}=x',38),tex('1',38),tex("\\sigma'(z)",38),tex('2(a-t)',38)];
const locL=loc.map((h,i)=>{const d=el(NL,'abs hid','',{left:(NX[i+1]-130)+'px',top:(NY+80)+'px',width:'260px',textAlign:'center',color:C.yellow});d.innerHTML=h;return d});

/* ============ S5: the neuron's chain ============ */
(function(){const S=$('S5'),sid='s5';
  show(nIn,cue(sid,'weight'),.4);
  [['multiply',0],['bias',1],['squash',2],['changing',3]].forEach(([w,i])=>{show(NB[i],cue(sid,w),.5);showArrow(nArr[i],cue(sid,w),.4)});
  show(nOut,cue(sid,'error'),.4);
  locL.forEach((d,i)=>show(d,cue(sid,'local')+.25*i,.4));
  const f=el(S,'abs hid',tex("\\frac{\\partial E}{\\partial w}=2(a-t)\\cdot\\sigma'(z)\\cdot 1\\cdot x",58),{left:'0',top:'660px',width:'1920px',textAlign:'center'});show(f,cue(sid,'product'),.7);
  const sg=el(S,'abs hid','sigmoid: a smooth squash into (0, 1)',{left:'0',top:'820px',width:'1920px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.dim});show(sg,cue(sid,'sigmoid'),.5);fadeOut(sg,cue(sid,'slope'),.4);
  sceneInOut(sid);
})();

/* ============ S6: forward once, then backwards: backpropagation ============ */
(function(){const S=$('S6'),sid='s6';
  const lab=el(S,'abs hid','x = 2, w = 0.5, b = −0.5, target t = 1',{left:'0',top:'190px',width:'1920px',textAlign:'center',fontSize:'34px',color:C.dim,fontFamily:"'JetBrains Mono',monospace"});show(lab,cue(sid,'run'),.4);
  fwdL.forEach((d,i)=>show(d,cue(sid,'forwards')+.45*i,.4));
  const back=['−0.35','−0.18','−0.18','−0.76','1'];
  const bk=back.map((v,i)=>el(S,'abs hid mono',v,{left:((NX[i]+NX[i+1])/2-70)+'px',top:(NY+150)+'px',width:'140px',textAlign:'center',fontSize:'32px',color:C.pink}));
  const t0=cue(sid,'backwards');
  [4,3,2,1,0].forEach((i,k)=>show(bk[i],t0+.6*k,.4));
  const svg=layerSvg(S);const pulse=svgEl('circle',{cx:NX[5]+30,cy:NY+190,r:12,fill:C.pink,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(pulse,t0,.2);tl.to(pulse,{attr:{cx:NX[0]+110},duration:2.8,ease:'none',immediateRender:false},t0);fadeOut(pulse,t0+2.8,.3);
  const bl=el(S,'abs hid','running product of local slopes, right to left',{left:'0',top:'610px',width:'1920px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.pink});show(bl,cue(sid,'multiplying'),.5);
  const r=el(S,'abs hid',tex('\\frac{\\partial E}{\\partial w}\\approx-0.35',56),{left:'0',top:'690px',width:'1920px',textAlign:'center'});show(r,cue(sid,'once',2),.6);
  const bp=el(S,'abs hid','backpropagation',{left:'0',top:'820px',width:'1920px',textAlign:'center',fontSize:'76px',color:C.yellow});show(bp,cue(sid,'backpropagation'),.6);
  sceneInOut(sid);
})();

/* ============ S7: an LLM is a long chain ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const N=14,bs=[];for(let i=0;i<N;i++){bs.push(el(S,'abs hid','',{left:(220+i*104)+'px',top:'300px',width:'84px',height:'200px',border:`3px solid ${C.blue}`,borderRadius:'10px',background:'#141b24'}))}
  tl.to(bs,{autoAlpha:1,duration:.3,stagger:.06},cue(sid,'chain'));
  const lab=el(S,'abs hid','layer after layer, hundreds of links',{left:'0',top:'200px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});show(lab,cue(sid,'hundreds'),.5);
  const t0=cue(sid,'backward');
  bs.slice().reverse().forEach((b,k)=>{tl.to(b,{borderColor:C.pink,backgroundColor:'#2a1622',duration:.25},t0+k*.12);tl.to(b,{borderColor:C.blue,backgroundColor:'#141b24',duration:.4},t0+k*.12+.35)});
  const bw=el(S,'abs hid','the same backward walk, for every batch of text',{left:'0',top:'560px',width:'1920px',textAlign:'center',fontSize:'46px',fontStyle:'italic'});show(bw,cue(sid,'batch'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 2.3 &nbsp;partial derivatives',{top:'900px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next'),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
