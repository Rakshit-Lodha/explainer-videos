/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}
function lab(S,html,x,y,color,size,italic){const d=el(S,'lbl',html,{color:color||C.ink,fontSize:(size||36)+'px',fontStyle:italic===false?'normal':'italic'});place(d,x,y);return d}
function texAt(S,s,size,x,y,color){const d=el(S,'lbl',tex(s,size),{color:color||C.ink});place(d,x,y);return d}
function arrowR(svg,x0,y,x1,color){const p=pth(svg,`M${x0} ${y} L${x1-6} ${y}`,color||C.dim,4);const h=arrowHead(svg,x1,y,1,0,color||C.dim);return [p,h]}
function showArrowR(a,t){drawOn(a[0],t,.4);fadeIn(a[1],t+.35,.15)}
function tok(S,txt,x,y,color){const box=el(S,'abs','',{left:(x-30)+'px',top:(y-30)+'px',width:'60px',height:'60px',display:'flex',alignItems:'center',justifyContent:'center',opacity:0,visibility:'hidden'});
  el(box,'abs mono',txt,{position:'relative',width:'52px',height:'52px',lineHeight:'52px',textAlign:'center',fontSize:'28px',border:'2px solid '+color,borderRadius:'8px',background:'#11161e',color:C.ink,fontVariantLigatures:'none'});return box}
function txtPanel(S,x,y,w,h,content,color,fs){const b=el(S,'abs mono','',{left:x+'px',top:y+'px',width:w+'px',height:h+'px',padding:'22px 26px',border:'2px solid '+(color||'#2a3442'),borderRadius:'12px',background:'#11161e',
  fontSize:(fs||26)+'px',lineHeight:'1.5',whiteSpace:'pre',color:C.ink,overflow:'hidden',fontVariantLigatures:'none',opacity:0,visibility:'hidden'});b.textContent=content;return b}

/* ============ S1: the GPT we built, now trained ============ */
(function(){const S=$('S1');const sid='s1';const svg=layerSvg(S);
  const steps=[['characters',C.dim,'characters'],['vectors',C.blue,'vectors'],['+ positions',C.teal,'positions'],['blocks',C.pink,'blocks'],['scores',C.yellow,'scores']];

  const at=lab(S,'attention + feed-forward',1160,500,C.pink,26);show(at,cue(sid,'attention'),.4);
  const nz=el(S,'abs mono','q;Xj vL!eKk ,zR’y&mZ hT?uB',{left:'560px',top:'600px',width:'800px',textAlign:'center',fontSize:'40px',color:C.red,opacity:0,visibility:'hidden'});show(nz,cue(sid,'random'),.4);

})();

/* ============ S2: the data and the batches ============ */
(function(){const S=$('S2');const sid='s2';
  const corpus='First Speaker:\nBefore the night is done, hear me speak.\n\nAll:\nSpeak, speak.';

  const il=lab(S,'each character → an integer id',1240,400,C.yellow,28);show(il,cue(sid,'integer'),.4);
  const tr=el(S,'abs','',{left:'1000px',top:'440px',width:'648px',height:'40px',background:'#2a6f97',borderRadius:'6px 0 0 6px',opacity:0,visibility:'hidden'}),va=el(S,'abs','',{left:'1652px',top:'440px',width:'72px',height:'40px',background:C.yellow,borderRadius:'0 6px 6px 0',opacity:0,visibility:'hidden'});

  const sh=lab(S,'the same window, shifted one character',1400,775,C.green,30);show(sh,cue(sid,'shifted'),.4);

})();

/* ============ S3: the loss ============ */
(function(){const S=$('S3');const sid='s3';
  const slabs=[];for(let i=5;i>=0;i--){slabs.push(el(S,'abs','',{left:(200+i*22)+'px',top:(330-i*22)+'px',width:'340px',height:'260px',border:'2px solid '+C.yellow,borderRadius:'6px',background:i?'#11161e':'#1d1f17',opacity:0,visibility:'hidden'}))}
  tl.to(slabs,{autoAlpha:1,duration:.15,stagger:.05},cue(sid,'block'));

  const vals=[.05,.6,.08,.04,.12,.03,.05,.03],tgt=1;
  const bars=vals.map((v,i)=>el(S,'abs','',{left:(900+i*60)+'px',top:(600-v*400)+'px',width:'46px',height:(v*400)+'px',borderRadius:'4px',background:i===tgt?C.green:C.teal,opacity:0,visibility:'hidden'}));
  tl.to(bars,{autoAlpha:1,duration:.12,stagger:.04},cue(sid,'cross-entropy'));

/* ============ S4: training ============ */
(function(){const S=$('S4');const sid='s4';const svg=layerSvg(S);
  const cx=420,cy=540,R=190,steps=[['forward','forward',C.blue],['loss','loss',C.yellow],['backward','backward',C.pink],['AdamW step','adamw',C.green]];
  steps.forEach(([t,w,c],i)=>{const a=-Math.PI/2+i*Math.PI/2;const b=boxEl(S,cx+R*Math.cos(a),cy+R*Math.sin(a),220,74,`<span style="font-size:28px">${t}</span>`,c);show(b,cue(sid,w),.3)});
  const ring=svgEl('circle',{cx,cy,r:R,fill:'none',stroke:C.dim,'stroke-width':2,'stroke-dasharray':'8 8',style:'opacity:0;visibility:hidden'},svg);fadeIn(ring,cue(sid,'loop'),.4);
  const fw=lab(S,'a framework computes the backward pass you derived by hand',960,180,C.ink,32);show(fw,cue(sid,'framework'),.4);
  const P=plane(1000,820,100,90);const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:1000,y1:820,x2:1800,y2:820,stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:1000,y1:820,x2:1000,y2:330,stroke:C.axis,'stroke-width':3},ax);fadeIn(ax,cue(sid,'repeated'),.4);
  const xl=lab(S,'steps',1400,860,C.dim,26);fadeIn(xl,cue(sid,'repeated'),.3);
  const tr=x=>2.9*Math.exp(-.55*x)+1.25+.05*Math.sin(7*x),va=x=>2.9*Math.exp(-.5*x)+1.45;
  const c1=pth(svg,fpath(tr,P,0,7.8,200),C.blue,4);drawOn(c1,cue(sid,'repeated'),2.4,'none');
  const c2=pth(svg,fpath(va,P,0,7.8,80),C.yellow,4);drawOn(c2,cue(sid,'validation'),1.6);
  const l1=lab(S,'train',1760,P(0,tr(7.6))[1]+30,C.blue,26,false),l2=lab(S,'validation',1720,P(0,va(7.6))[1]-30,C.yellow,26,false);show(l1,cue(sid,'repeated'),.4);show(l2,cue(sid,'validation'),.4);
  const dr=el(S,'chip','a modest learning rate · a little dropout · patience',{borderColor:C.dim,fontSize:'28px'});place(dr,420,880);show(dr,cue(sid,'modest'),.4);
  const mp=lab(S,'a few million parameters, one graphics card',1400,940,C.teal,30);show(mp,cue(sid,'million'),.4);
  sceneInOut(sid);
})();

/* ============ S5: bigram vs transformer ============ */
(function(){const S=$('S5');const sid='s5';const svg=layerSvg(S);
  const rnd=seedRand(5);const n=10,cs=40,x0=180,y0=330;
  const cells=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){const v=Math.pow(rnd(),3);cells.push(el(S,'abs','',{left:(x0+c*cs)+'px',top:(y0+r*cs)+'px',width:(cs-3)+'px',height:(cs-3)+'px',borderRadius:'3px',background:`rgba(245,207,74,${(.08+.85*v).toFixed(2)})`,opacity:0,visibility:'hidden'}))}
  tl.to(cells,{autoAlpha:1,duration:.1,stagger:.004},cue(sid,'bigram'));
  const tl1=lab(S,'bigram: a table of next-character scores',380,270,C.yellow,30);show(tl1,cue(sid,'table'),.4);
  const rl=lab(S,'previous character ↓   next →',380,770,C.dim,26);show(rl,cue(sid,'table'),.4);
  const P=plane(820,820,120,90);const ax=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('line',{x1:820,y1:820,x2:1800,y2:820,stroke:C.axis,'stroke-width':3},ax);svgEl('line',{x1:820,y1:820,x2:820,y2:330,stroke:C.axis,'stroke-width':3},ax);fadeIn(ax,cue(sid,'loss'),.4);
  const yl=lab(S,'validation loss',900,310,C.dim,26);fadeIn(yl,cue(sid,'loss'),.3);
  const bg=x=>2.3*Math.exp(-1.4*x)+2.15,tf=x=>2.6*Math.exp(-.45*x)+.9+.0*x;
  const b=pth(svg,fpath(bg,P,0,8,160),C.red,5);drawOn(b,cue(sid,'falls'),1.4);
  const st=lab(S,'stalls: one character of context',1500,P(0,2.15)[1]-30,C.red,28);show(st,cue(sid,'stalls'),.4);
  const t=pth(svg,fpath(tf,P,0,8,160),C.green,5);drawOn(t,cue(sid,'attention'),2);
  const tl2=lab(S,'transformer: attention uses the whole window',1450,P(0,tf(7))[1]+40,C.green,28);show(tl2,cue(sid,'whole'),.4);
  const sk=lab(S,'(curves sketched)',1680,860,C.dim,22);show(sk,cue(sid,'falls'),.3);
  sceneInOut(sid);
})();

/* ============ S6: samples during training ============ */

/* ============ S7: the whole path ============ */
(function(){const S=$('S7');const sid='s7';const svg=layerSvg(S);
  const path=[['text','text',C.dim],['tokens','tokens',C.dim],['embeddings','embeddings',C.blue],['attention','attention',C.blue],['transformer blocks','blocks',C.pink],['logits','logits',C.yellow],['loss','loss',C.yellow],['backpropagation','backpropagation',C.pink],['training','training',C.green],['generation','generation',C.green]];
  const pos=path.map((_,i)=>{const row=i<5?0:1,col=i<5?i:9-i;return {x:240+col*360,y:row?640:400,w:(i===4||i===7)?300:250,row}});
  path.forEach(([t,w,c],i)=>{const q=pos[i];const b=boxEl(S,q.x,q.y,q.w,80,`<span style="font-size:28px">${t}</span>`,c);show(b,cue(sid,w),.3);

    else{const x0=pr.x-pr.w/2-6,x1=q.x+q.w/2+6;const l=pth(svg,`M${x0} ${q.y} L${x1+6} ${q.y}`,C.dim,4),h=arrowHead(svg,x1,q.y,-1,0,C.dim);drawOn(l,cue(sid,w),.4);fadeIn(h,cue(sid,w)+.35,.15)}});
  const dn=pth(svg,'M1680 445 L1680 595',C.dim,4),dh=arrowHead(svg,1680,600,0,1,C.dim);drawOn(dn,cue(sid,'logits'),.4);fadeIn(dh,cue(sid,'logits')+.35,.15);
  const by=lab(S,'and you built each step yourself',960,800,C.teal,36);show(by,cue(sid,'yourself'),.4);
  const end=el(S,'cap','AI from Scratch · complete',{top:'920px',fontSize:'40px',color:C.dim,fontStyle:'italic'});show(end,cue(sid,'ideas'),.6);
  sceneInOut(sid,true);
})();
