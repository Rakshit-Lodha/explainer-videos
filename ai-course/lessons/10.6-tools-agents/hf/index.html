function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

/* ============ S1: one thing, and a loop around it ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const inp=box(S,330,460,360,100,'<span class="mono" style="font-size:30px">“the cat sat on”</span>',C.ink,{fs:30});
  const m=box(S,960,460,380,150,'model',C.blue,{fs:48});
  const out=box(S,1560,460,200,100,'<span class="mono">the</span>',C.yellow,{fs:34});
  show(inp,cue(sid,'text'),.4);show(m,cue(sid,'model'),.4);show(out,cue(sid,'token'),.4);
  const a1=pxArrow(svg,C.dim,4,520,460,760,460),a2=pxArrow(svg,C.dim,4,1160,460,1450,460);growPx(a1,cue(sid,'produce'),.4);growPx(a2,cue(sid,'token'),.4);
  const acts=[['book a meeting',260,'book'],['run code',960,'run'],['search the web',1660,'search']];
  const ab=acts.map(([t,x,w])=>{const b=box(S,x,800,380,90,t,C.green,{fs:36});show(b,cue(sid,w),.4);return b});
  tl.to(ab,{autoAlpha:0,duration:.4},cue(sid,'trick'));
  const loop=pth(svg,'M960 300 C 1500 300, 1500 700, 960 700 C 420 700, 420 300, 960 300',C.pink,5);
  drawOn(loop,cue(sid,'loop'),1.4);
  const ll=txt(S,'a loop around the model',960,780,{fs:44,it:true,color:C.pink});show(ll,cue(sid,'around'),.5);
  const pf=txt(S,'power &amp; fragility',960,860,{fs:38,it:true,color:C.dim});show(pf,cue(sid,'fragility'),.4);
  sceneInOut(sid);
})();

/* ============ S2: a tool call is text; the harness runs it ============ */
(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);
  const js=box(S,420,330,640,150,'<span class="mono" style="font-size:28px;text-align:left">{"tool": "get_weather",<br>&nbsp;"args": {"city": "Pune"}}</span>',C.yellow,{fs:28});
  show(js,cue(sid,'json'),.5);

  fadeIn(hatch,cue(sid,'hatch'),.3);
  const h=box(S,1240,330,560,150,'harness',C.blue,{fs:44});show(h,cue(sid,'harness'),.5);

/* ============ S3: how the format is learned (Toolformer) ============ */
(function(){const S=$('S3');const sid='s3';
  const head=el(S,'cap','Schick et al., 2023 · Toolformer',{top:'110px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(head,cue(sid,'toolformer'),.5);

/* ============ S4: ReAct loop, the transcript is memory ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const head=txt(S,'ReAct · Yao et al., 2022',480,170,{fs:34,it:true,color:C.dim});show(head,cue(sid,'react'),.4);
  const nodes=[['thought',480,300,C.blue,'reasoning'],['action',700,640,C.yellow,'action'],['observation',260,640,C.green,'observation']];
  const nb=nodes.map(([t,x,y,c,w])=>{const b=box(S,x,y,260,90,t,c,{fs:36});show(b,cue(sid,w),.4);return b});
  const arcs=[pth(svg,'M590 340 Q700 420 690 590',C.dim,4),pth(svg,'M570 650 L390 650',C.dim,4),pth(svg,'M260 590 Q260 400 360 330',C.dim,4)];
  arcs.forEach((a,i)=>drawOn(a,[cue(sid,'taking'),cue(sid,'reading'),cue(sid,'until')][i],.5));
  const lines=[['Thought: I need the forecast.',C.blue],['Action: get_weather(Pune)',C.yellow],['Observation: 31 °C, clear',C.green],['Thought: no rain expected.',C.blue],['Answer: No, it is clear.',C.pink]];
  const tr=lines.map(([t,c],i)=>txt(S,t,1000,300+i*80,{fs:32,mono:true,color:c}));
  tr.forEach(t=>{t.style.translate='0 -50%'});
  const ts=[cue(sid,'reasoning'),cue(sid,'action'),cue(sid,'observation'),cue(sid,'decides'),cue(sid,'answer')];
  tr.forEach((t,i)=>show(t,ts[i],.4));
  const tl1=txt(S,'the transcript = working memory',1340,760,{fs:36,it:true,color:C.ink});show(tl1,cue(sid,'transcript'),.4);
  const cached=el(S,'abs','',{left:'980px',top:'262px',width:'800px',height:'230px',border:'3px dashed #f5cf4a',borderRadius:'10px',opacity:0,visibility:'hidden'});
  cached.setAttribute('data-layout-allow-overlap','');

  const cl=txt(S,'reused prefix (KV cache)',1380,880,{fs:32,it:true,color:C.yellow});show(cl,cue(sid,'reuse'),.4);
  sceneInOut(sid);
})();

/* ============ S5: compounding failure ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const cs=[];for(let i=0;i<10;i++){const c=svgEl('circle',{cx:250+i*150,cy:300,r:40,fill:'#83c16733',stroke:C.green,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);cs.push(c);if(i)svgEl('line',{x1:290+(i-1)*150,y1:300,x2:210+i*150,y2:300,stroke:C.dim,'stroke-width':3,style:'opacity:0;visibility:hidden',class:'lk'},svg)}
  const lks=[...svg.querySelectorAll('.lk')];
  tl.to(cs,{autoAlpha:1,duration:.2,stagger:.12},cue(sid,'chain'));tl.to(lks,{autoAlpha:1,duration:.2,stagger:.12},cue(sid,'chain'));
  const p=txt(S,'0.9 per step',250,390,{fs:30,mono:true,color:C.green});show(p,cue(sid,'nine'),.4);
  const P=(n,v)=>[300+n*120,960-v*440];
  const ax=ln(svg,P(0,0)[0],P(0,0)[1],P(10.5,0)[0],P(0,0)[1],C.axis,3),ay=ln(svg,P(0,0)[0],P(0,0)[1],P(0,1)[0],P(0,1)[1],C.axis,3);
  fadeIn([ax,ay],cue(sid,'shrinks'),.4);
  const pts=[];for(let n=0;n<=10;n++)pts.push([n,Math.pow(.9,n)]);
  const cur=pth(svg,polyD(P,pts),C.yellow,5);drawOn(cur,cue(sid,'multiplicatively'),1.6);
  const dots=pts.map(([n,v])=>svgEl('circle',{cx:P(n,v)[0],cy:P(n,v)[1],r:7,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg));
  tl.to(dots,{autoAlpha:1,duration:.1,stagger:.14},cue(sid,'multiplicatively'));
  const fin=txt(S,'0.9<sup>10</sup> ≈ 0.35',P(10,0)[0]+40,P(0,.35)[1]-50,{fs:40,mono:true,color:C.yellow});show(fin,cue(sid,'three'),.4);
  const xl=txt(S,'steps',P(5,0)[0],1000,{fs:30,it:true,color:C.dim});show(xl,cue(sid,'shrinks'),.4);
  const ind=txt(S,'if errors are independent',1500,560,{fs:32,it:true,color:C.dim});show(ind,cue(sid,'independent'),.4);
  tl.to(cs[3],{fill:'#fc625566',stroke:C.red,duration:.4},cue(sid,'wrong'));
  cs.slice(4).forEach((c,i)=>tl.to(c,{stroke:'#fc6255',fill:'#fc625522',duration:.3},cue(sid,'every')+i*.1));
  const ff=txt(S,'a wrong observation feeds every later step',1100,390,{fs:32,it:true,color:C.red});show(ff,cue(sid,'feed'),.4);
  tl.to(p,{autoAlpha:0,duration:.3},cue(sid,'feed')-.2);
  sceneInOut(sid);
})();
