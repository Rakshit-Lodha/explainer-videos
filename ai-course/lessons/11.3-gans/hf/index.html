function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov||/\\(bar|hat|underbrace|tilde)/.test(t)){d.setAttribute('data-layout-allow-overlap','');d.querySelectorAll('span').forEach(s=>s.setAttribute('data-layout-allow-overlap',''))}return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

function note(parent,cx,cy,w,color,o){o=o||{};const d=el(parent,'abs','<div style="position:absolute;left:50%;top:50%;translate:-50% -50%;width:70px;height:70px;border-radius:50%;border:3px solid '+color+'"></div>',{left:(cx-w/2)+'px',top:(cy-w*.28)+'px',width:w+'px',height:(w*.56)+'px',border:'3px solid '+color,borderRadius:'10px',background:color+'22',opacity:0,visibility:'hidden'});return d}

/* ============ S1: forger and inspector ============ */
(function(){const S=$('S1');const sid='s1';
  const f=box(S,420,300,420,110,'forger',C.pink,{fs:44}),i=box(S,1500,300,420,110,'inspector',C.blue,{fs:44});
  show(f,cue(sid,'forger'),.4);show(i,cue(sid,'inspector'),.4);
  const svg=layerSvg(S);
  const n1=note(S,720,600,300,C.dim),n2=note(S,1200,600,300,C.yellow);
  show(n1,cue(sid,'paint'),.4);show(n2,cue(sid,'catch'),.4);
  const a=pxArrow(svg,C.pink,4,560,380,700,500),b=pxArrow(svg,C.blue,4,1380,380,1240,500);growPx(a,cue(sid,'banknotes'),.4);growPx(b,cue(sid,'fakes'),.4);
  const lb1=txt(S,'fake?',720,800,{fs:34,it:true,color:C.dim}),lb2=txt(S,'real',1200,800,{fs:34,it:true,color:C.yellow});show([lb1,lb2],cue(sid,'fakes'),.4);
  tl.to(n1,{borderColor:C.yellow,background:'#f5cf4a22',duration:2},cue(sid,'forgeries'));
  tl.to(lb1,{color:C.yellow,duration:2},cue(sid,'forgeries'));
  const cap=el(S,'cap','a <em>generative adversarial network</em>',{top:'900px',fontSize:'52px',fontStyle:'italic'});show(cap,cue(sid,'generative'),.5);
  sceneInOut(sid);
})();

/* ============ S2: generator and discriminator ============ */
(function(){const S=$('S2');const sid='s2';
  const head=el(S,'cap','Goodfellow et al., 2014',{top:'110px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(head,cue(sid,'goodfellow'),.5);
  const svg=layerSvg(S);const rnd=seedRand(2);
  const z=[];for(let k=0;k<6;k++)z.push(cellAt(S,180,300+k*70,90,56,(rnd()*2-1).toFixed(1),C.grid,{fs:24}));
  show(z,cue(sid,'noise'),.3,{stagger:.05});const zl=txt(S,'noise z',180,760,{fs:32,it:true,color:C.dim});show(zl,cue(sid,'noise'),.3);
  const G=box(S,520,475,300,150,'generator G',C.pink,{fs:40});show(G,cue(sid,'generator'),.4);
  const a1=pxArrow(svg,C.dim,4,240,475,360,475);growPx(a1,cue(sid,'turns'),.4);
  const fake=note(S,900,330,240,C.pink);show(fake,cue(sid,'sample'),.4);
  const real=note(S,900,640,240,C.yellow);show(real,cue(sid,'real'),.4);
  const fl=txt(S,'generated',900,440,{fs:30,it:true,color:C.pink}),rl=txt(S,'real',900,750,{fs:30,it:true,color:C.yellow});show(fl,cue(sid,'sample'),.3);show(rl,cue(sid,'real'),.3);
  const a2=pxArrow(svg,C.dim,4,670,450,770,360);growPx(a2,cue(sid,'sample'),.4);
  const D=box(S,1320,475,340,150,'discriminator D',C.blue,{fs:40});show(D,cue(sid,'discriminator'),.4);
  const a3=pxArrow(svg,C.dim,4,1030,340,1145,440),a4=pxArrow(svg,C.dim,4,1030,630,1145,520);growPx(a3,cue(sid,'either'),.4);growPx(a4,cue(sid,'either'),.4);
  const p=box(S,1700,475,260,100,'P(real)',C.green,{fs:38});show(p,cue(sid,'probability'),.4);
  const a5=pxArrow(svg,C.dim,4,1495,475,1565,475);growPx(a5,cue(sid,'outputs'),.4);
  const back=pth(svg,'M1320 560 Q 1320 860 900 860 Q 520 860 520 560',C.pink,4,{dash:'10 8'});drawOn(back,cue(sid,'passed'),1.0);
  const gl=txt(S,'gradients: the only signal G gets',920,920,{fs:34,it:true,color:C.pink});show(gl,cue(sid,'gradients'),.4);
  sceneInOut(sid);
})();

/* ============ S3: the minimax game, D* and JS ============ */
(function(){const S=$('S3');const sid='s3';
  const v=eqn(S,'\\min_G \\max_D \\; V(D,G) = \\mathbb{E}_{x\\sim p_{data}}[\\log D(x)] + \\mathbb{E}_{z}[\\log(1 - D(G(z)))]',960,200,48);show(v,cue(sid,'value'),.6);
  const dm=txt(S,'D maximises',700,300,{fs:32,it:true,color:C.blue}),gm=txt(S,'G minimises',1220,300,{fs:32,it:true,color:C.pink});show(dm,cue(sid,'maximise'),.4);show(gm,cue(sid,'minimise'),.4);
  const svg=layerSvg(S);
  const P=(x,y)=>[160+x*900,880-y*380];
  const ax=ln(svg,160,880,1060,880,C.axis,3);fadeIn(ax,cue(sid,'fixed'),.4);
  const g=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s));
  const pd=x=>g(x,.35,.08)+.6*g(x,.65,.07),pg=x=>.9*g(x,.55,.12);
  const cd=pth(svg,polyD(P,pts2d(pd,0,1,80)),C.yellow,4),cg=pth(svg,polyD(P,pts2d(pg,0,1,80)),C.pink,4);
  drawOn(cd,cue(sid,'fixed'),.8);drawOn(cg,cue(sid,'fixed'),.8);
  const dl=txt(S,'p_data',P(.25,0)[0],P(0,1.1)[1],{fs:30,color:C.yellow}),gl=txt(S,'p_g',P(.78,0)[0],P(0,.85)[1],{fs:30,color:C.pink});show([dl,gl],cue(sid,'fixed'),.4);
  const ds=pth(svg,polyD(P,pts2d(x=>pd(x)/(pd(x)+pg(x)+1e-6),0.02,.98,120)),C.blue,4,{dash:'10 6'});drawOn(ds,cue(sid,'best'),1.2);
  const dsl=txt(S,'D*(x)',P(.08,0)[0],P(0,1)[1]-40,{fs:30,color:C.blue});show(dsl,cue(sid,'best'),.4);
  const e1=eqn(S,'D^*(x) = \\frac{p_{data}(x)}{p_{data}(x) + p_g(x)}',1440,470,46);show(e1,cue(sid,'divided'),.6);
  const e2=eqn(S,'V(D^*,G) = -\\log 4 + 2\\,\\mathrm{JS}(p_{data}\\,\\|\\,p_g)',1440,640,40);show(e2,cue(sid,'jensen-shannon'),.6);
  // distributions match
  tl.to([cd,cg,ds],{autoAlpha:0,duration:.4},cue(sid,'won')-.2);
  const m1=pth(svg,polyD(P,pts2d(pd,0,1,80)),C.yellow,4),m2=pth(svg,polyD(P,pts2d(pd,0,1,80)),C.pink,4,{dash:'12 8'});
  fadeIn([m1,m2],cue(sid,'won'),.5);
  const half=pth(svg,polyD(P,[[0,.5],[1,.5]]),C.blue,4,{dash:'10 6'});fadeIn(half,cue(sid,'match'),.4);
  const w=txt(S,'p_g = p_data → D* = ½ everywhere',1440,780,{fs:34,color:C.green});show(w,cue(sid,'match'),.4);
  sceneInOut(sid);
})();

/* ============ S4: the non-saturating fix ============ */
(function(){const S=$('S4');const sid='s4';
  const svg=layerSvg(S);
  const P=(d,v)=>[260+d*900,560-v*90];
  const ax=ln(svg,260,560,1160,560,C.axis,3),ay=ln(svg,260,180,260,960,C.axis,3);fadeIn([ax,ay],cue(sid,'snag'),.4);
  const xl=txt(S,'D(G(z)) →',1160,600,{fs:30,it:true,color:C.dim});show(xl,cue(sid,'snag'),.4);
  const mm=pth(svg,polyD(P,pts2d(d=>Math.log(1-d),0.005,.95,80)),C.dim,5);
  drawOn(mm,cue(sid,'original'),1.0);
  const ml=txt(S,'log(1 − D): flat where D rejects fakes',820,470,{fs:30,color:C.dim});show(ml,cue(sid,'gradient'),.4);
  const zone=el(S,'abs','',{left:'260px',top:'180px',width:'120px',height:'780px',background:'#fc625518',borderLeft:'3px solid #fc6255',opacity:0,visibility:'hidden'});
  zone.setAttribute('data-layout-allow-overlap','');
  fadeIn(zone,cue(sid,'early'),.4);
  const zl=txt(S,'early training',320,150,{fs:30,it:true,color:C.red});show(zl,cue(sid,'easily'),.4);
  const ns=pth(svg,polyD(P,pts2d(d=>Math.log(d)+0.0,0.012,.95,80)),C.pink,5);drawOn(ns,cue(sid,'fix'),1.0);
  const nl=txt(S,'log D: steep exactly where G is losing',820,900,{fs:30,color:C.pink});show(nl,cue(sid,'hardest'),.4);
  const e=eqn(S,'\\text{G: } \\max\\; \\log D(G(z))',1520,360,52,{color:C.pink});show(e,cue(sid,'maximise'),.6);
  const s=txt(S,'non-saturating loss: now standard',1520,460,{fs:34,it:true,color:C.ink});show(s,cue(sid,'standard'),.4);
  sceneInOut(sid);
})();

/* ============ S5: instability and mode collapse ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const sp=pth(svg,polyD((x,y)=>[x,y],pts2d(t=>0,0,1,1).map((_,i)=>[0,0])),C.dim,2);
  const spiral=[];for(let i=0;i<=120;i++){const t=i/120*6*Math.PI,r=180-i*.6;spiral.push([520+r*Math.cos(t),500+r*.8*Math.sin(t)])}
  const sd='M'+spiral.map(p=>p[0].toFixed(0)+' '+p[1].toFixed(0)).join(' L');
  const osc=pth(svg,sd,C.blue,4);drawOn(osc,cue(sid,'circle'),2.0);
  const ol=txt(S,'the players circle instead of settling',520,780,{fs:32,it:true,color:C.blue});show(ol,cue(sid,'circle'),.4);
  const modes=[[1180,330],[1420,330],[1660,330],[1180,560],[1420,560],[1660,560]];
  const dcols=[C.yellow,C.green,C.blue,C.pink,C.teal,C.red];
  const md=modes.map(([x,y],i)=>{const c=svgEl('circle',{cx:x,cy:y,r:60,fill:dcols[i]+'33',stroke:dcols[i],'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);return c});
  fadeIn(md,cue(sid,'variety'),.4);
  const dl=txt(S,'the variety in the data',1420,200,{fs:32,it:true,color:C.dim});show(dl,cue(sid,'variety'),.4);
  const rnd=seedRand(6);const gs=[];for(let i=0;i<14;i++){gs.push(svgEl('circle',{cx:1180+(rnd()-.5)*50,cy:330+(rnd()-.5)*50,r:8,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg))}
  tl.to(gs,{autoAlpha:1,duration:.2,stagger:.06},cue(sid,'collapse'));
  const cl=txt(S,'mode collapse: every sample in one mode',1420,700,{fs:34,color:C.yellow});show(cl,cue(sid,'convincing'),.4);
  const fl=txt(S,'a forger who paints one banknote',1420,770,{fs:30,it:true,color:C.dim});show(fl,cue(sid,'banknote'),.4);
  const lw=el(S,'cap','later work: architectures and losses to tame it',{top:'920px',fontSize:'42px',fontStyle:'italic'});show(lw,cue(sid,'later'),.5);
  sceneInOut(sid);
})();

/* ============ S6: compared with VAEs and diffusion ============ */
(function(){const S=$('S6');const sid='s6';
  const cols=[['GAN',C.pink,['one pass: fast','no likelihood','unstable training']],['diffusion',C.blue,['many steps: slower','stable regression loss','covers the data better']]];
  cols.forEach(([n,c,items],j)=>{const x=560+j*800;const h=box(S,x,260,420,100,n,c,{fs:44});show(h,j?cue(sid,'diffusion'):cue(sid,'gan'),.4);
    const ts=j?[cue(sid,'slower'),cue(sid,'regression'),cue(sid,'cover')]:[cue(sid,'single'),cue(sid,'likelihood'),cue(sid,'honest')];
    items.forEach((t,i)=>{const d=txt(S,t,x,390+i*70,{fs:36,color:C.ink});show(d,ts[i],.4)})});
  const ov=el(S,'cap','diffusion overtook GANs for many image tasks',{top:'640px',fontSize:'44px',fontStyle:'italic',color:C.yellow});show(ov,cue(sid,'overtook'),.5);
  const sv=box(S,960,840,1100,100,'the adversarial idea survives: a loss that sharpens latent-diffusion decoders',C.green,{fs:32});show(sv,cue(sid,'survives'),.5);
  sceneInOut(sid);
})();

/* ============ S7: end of module; next ============ */
(function(){const S=$('S7');const sid='s7';
  const items=[['11.1 autoencoders &amp; VAEs',C.blue],['11.2 diffusion',C.yellow],['11.3 GANs',C.pink]];
  items.forEach(([t,c],i)=>{const b=box(S,480+i*480,420,420,100,t,c,{fs:36});show(b,cue(sid,'tour')+i*.2,.4)});
  const rw=txt(S,'next module: learning from rewards',960,620,{fs:40,it:true,color:C.green});show(rw,cue(sid,'rewards'),.4);
  nextUp(S,sid,'markov',1,'12.1 &nbsp;agents, rewards and Markov decision processes');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
