  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers (modules 10-12) ---- */
function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

function hbar(parent,x,y,w,h,color){return el(parent,'abs hid','',{left:x+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',background:color,borderRadius:'6px',transformOrigin:'0% 50%'})}
function growBar(b,time,d){tl.set(b,{scaleX:0},time);tl.to(b,{autoAlpha:1,duration:.2},time);tl.to(b,{scaleX:1,duration:d||.8,ease:'power2.out'},time)}

/* ============ S1: two retrievers, two scales ============ */
(function(){const S=$('S1');const sid='s1';
  const k=box(S,520,230,460,100,'keyword search',C.yellow,{fs:40}),d=box(S,1400,230,460,100,'dense search',C.blue,{fs:40});
  show(k,at(sid,.02),.5);show(d,at(sid,.02)+.2,.5);
  const kf=txt(S,'finds codes, misses paraphrases',520,330,{fs:28,it:true,color:C.dim}),df=txt(S,'finds paraphrases, blurs codes',1400,330,{fs:28,it:true,color:C.dim});
  show(kf,cue(sid,'misses'),.4);show(df,cue(sid,'blurs'),.4);
  const m=box(S,960,450,300,90,'merge  ?',C.pink,{fs:40});const svg=layerSvg(S);
  const a1=pxArrow(svg,C.yellow,4,620,360,830,430),a2=pxArrow(svg,C.blue,4,1300,360,1090,430);
  growPx(a1,cue(sid,'merges'),.5);growPx(a2,cue(sid,'merges'),.5);show(m,cue(sid,'merges'),.5);
  /* two rulers of the same length, very different ranges */
  const r1=ln(svg,360,640,1560,640,C.yellow,4),r2=ln(svg,360,800,1560,800,C.blue,4);
  const t1=['0','5','10','15','20+'].map((s,i)=>txt(S,s,360+i*300,680,{fs:28,mono:true,color:C.yellow}));
  const t2=['−1','0','1'].map((s,i)=>txt(S,s,360+i*600,840,{fs:28,mono:true,color:C.blue}));
  const l1=txt(S,'BM25 score',220,640,{fs:30,color:C.yellow}),l2=txt(S,'cosine',220,800,{fs:30,color:C.blue});
  fadeIn(r1,cue(sid,'bm25'),.4);show([l1,...t1],cue(sid,'bm25'),.4,{stagger:.05});
  fadeIn(r2,cue(sid,'cosine'),.4);show([l2,...t2],cue(sid,'cosine'),.4,{stagger:.05});
  const ru=el(S,'cap','adding them directly: rupees + kilometres',{top:'920px',fontSize:'40px',fontStyle:'italic',color:C.dim});show(ru,cue(sid,'rupees'),.5);
  sceneInOut(sid);
})();

/* ============ S2: min-max normalisation and the alpha dial ============ */
(function(){const S=$('S2');const sid='s2';
  const K=[['p3',14],['p4',6],['p9',2]],D=[['p1',.82],['p3',.78],['p2',.40]];
  const head1=txt(S,'keyword (BM25)',480,190,{fs:32,color:C.yellow}),head2=txt(S,'dense (cosine)',1440,190,{fs:32,color:C.blue});
  show([head1,head2],cue(sid,'common'),.4);
  const rows=(L,x,color,max)=>L.map(([id,v],i)=>{const y=280+i*90;const c=cellAt(S,x-260,y,100,64,id,C.dim,{fs:28});
    const b=hbar(S,x-180,y,v/max*420,44,color);const t=txt(S,String(v),x+330,y,{fs:28,mono:true,color:C.ink});
    show(c,cue(sid,'common'),.4);growBar(b,cue(sid,'common'),.6);show(t,cue(sid,'common')+.3,.3);return {b,t,v}});
  const kr=rows(K,480,C.yellow,14),dr=rows(D,1440,C.blue,.82);
  const norm=(L)=>{const lo=Math.min(...L.map(r=>r.v)),hi=Math.max(...L.map(r=>r.v));return L.map(r=>(r.v-lo)/(hi-lo))};
  const go=(R,max,t)=>norm(R).forEach((n,i)=>{const r=R[i];tl.to(r.b,{scaleX:Math.max(.02,n)/(r.v/max),duration:.9,ease:'power2.inOut'},t);
    tl.to(r.t,{autoAlpha:0,duration:.2},t);const nt=txt(S,n.toFixed(2),0,0,{fs:28,mono:true,color:C.ink});place(nt,parseFloat(r.t.style.left),parseFloat(r.t.style.top));show(nt,t+.6,.3)});
  go(kr,14,cue(sid,'best'));go(dr,.82,cue(sid,'best'));
  const mm=txt(S,'best → 1, worst → 0, per query',960,580,{fs:32,it:true,color:C.ink});show(mm,cue(sid,'worst'),.5);
  const eq=eqn(S,'\\text{fused} = \\alpha\\cdot\\text{dense} + (1-\\alpha)\\cdot\\text{keyword}',960,700,50);show(eq,cue(sid,'blend'),.6);
  const svg=layerSvg(S);const tr=ln(svg,560,860,1360,860,C.axis,4);fadeIn(tr,cue(sid,'dial'),.4);
  const knob=el(S,'abs hid','',{left:'938px',top:'838px',width:'44px',height:'44px',borderRadius:'22px',background:C.pink});
  fadeIn(knob,cue(sid,'dial'),.3);
  tl.to(knob,{x:-400,duration:1,ease:'power2.inOut'},cue(sid,'keyword',2));tl.to(knob,{x:400,duration:1.4,ease:'power2.inOut'},cue(sid,'semantic'));
  const e0=txt(S,'α = 0: pure keyword',560,930,{fs:28,color:C.yellow}),e1=txt(S,'α = 1: pure semantic',1360,930,{fs:28,color:C.blue});
  show(e0,cue(sid,'keyword',2),.4);show(e1,cue(sid,'semantic'),.4);
  sceneInOut(sid);
})();

/* ============ S3: reciprocal rank fusion ============ */
(function(){const S=$('S3');const sid='s3';
  const KL=['p3','p4','p9'],DL=['p1','p3','p2'];
  const h1=txt(S,'keyword ranks',360,200,{fs:32,color:C.yellow}),h2=txt(S,'dense ranks',760,200,{fs:32,color:C.blue});
  show([h1,h2],at(sid,.02),.4);
  KL.forEach((id,i)=>{const c=cellAt(S,360,290+i*90,180,64,(i+1)+'. '+id,C.yellow,{fs:28,ink:C.ink});show(c,at(sid,.02)+.1*i,.3)});
  DL.forEach((id,i)=>{const c=cellAt(S,760,290+i*90,180,64,(i+1)+'. '+id,C.blue,{fs:28,ink:C.ink});show(c,at(sid,.02)+.1*i,.3)});
  const eq=eqn(S,'\\text{RRF}(p)=\\sum_{\\text{lists}} \\frac{1}{60+\\text{rank}(p)}',1400,260,50);show(eq,cue(sid,'sixty'),.6);
  const ids=['p1','p2','p3','p4','p9'];const rr=id=>[KL,DL].reduce((s,L)=>s+(L.includes(id)?1/(60+L.indexOf(id)+1):0),0);
  const order=ids.slice().sort((a,b)=>rr(b)-rr(a));
  order.forEach((id,i)=>{const y=430+i*80;const c=cellAt(S,1180,y,120,60,id,C.pink,{fs:28});const v=rr(id);
    const b=hbar(S,1260,y,v/rr(order[0])*360,40,C.pink);const t=txt(S,v.toFixed(4),1720,y,{fs:26,mono:true,color:C.ink});
    show(c,cue(sid,'adds')+.15*i,.3);growBar(b,cue(sid,'adds')+.15*i,.5);show(t,cue(sid,'adds')+.15*i+.3,.3)});
  const hl=el(S,'hl','',{left:'1110px',top:'385px',width:'720px',height:'90px',borderColor:C.pink});fadeIn(hl,cue(sid,'both'),.4);
  const bl=txt(S,'p3: ranked well by both, so it wins',1460,880,{fs:30,it:true,color:C.pink});show(bl,cue(sid,'both'),.4);
  const ad=txt(S,'no normalisation, no tuning',560,640,{fs:32,it:true,color:C.ink});show(ad,cue(sid,'tuning'),.4);
  const dc=txt(S,'but it discards how confident each list was',560,710,{fs:30,it:true,color:C.dim});show(dc,cue(sid,'discards'),.4);
  sceneInOut(sid);
})();

/* ============ S4: labelled queries and nDCG ============ */
(function(){const S=$('S4');const sid='s4';
  const q=box(S,480,250,620,100,'“my refund failed with E1047”',C.ink,{fs:34});show(q,at(sid,.02),.5);
  ['p3 ✓ relevant','p4','p9'].forEach((t,i)=>{const c=cellAt(S,480,370+i*76,300,60,t,i===0?C.green:C.dim,{fs:26,ink:i===0?C.green:C.dim});show(c,cue(sid,'labelled')+.15*i,.3)});
  const nd=txt(S,'nDCG: normalised discounted cumulative gain',1340,200,{fs:32,color:C.ink});show(nd,cue(sid,'ndcg'),.5);
  const svg=layerSvg(S);
  const seats=[1,2,3,4,5].map(i=>{const x=1000+(i-1)*150,h=260/Math.log2(i+1);
    const s=cellAt(S,x,820,110,56,'seat '+i,C.dim,{fs:24});const b=el(S,'abs hid','',{left:(x-36)+'px',top:(780-h)+'px',width:'72px',height:h+'px',background:C.teal,borderRadius:'6px 6px 0 0',transformOrigin:'50% 100%'});
    show(s,cue(sid,'theatre')+.1*i,.3);tl.set(b,{scaleY:0},cue(sid,'credit'));tl.to(b,{autoAlpha:1,duration:.2},cue(sid,'credit')+.1*i);tl.to(b,{scaleY:1,duration:.6,ease:'power2.out'},cue(sid,'credit')+.1*i);
    const t=txt(S,'1/log₂('+(i+1)+')',x,880,{fs:22,mono:true,color:C.teal});show(t,cue(sid,'logarithm')+.1*i,.3);return s});
  const tl1=txt(S,'front rows matter most',1300,950,{fs:30,it:true,color:C.ink});show(tl1,cue(sid,'front'),.5);
  const eq=eqn(S,'\\text{nDCG}=\\dfrac{\\text{DCG}}{\\text{DCG of the best ordering}}',520,700,38);show(eq,cue(sid,'dividing'),.6);
  const one=txt(S,'a perfect ranking scores exactly 1',520,830,{fs:30,it:true,color:C.green});show(one,cue(sid,'perfect'),.5);
  sceneInOut(sid);
})();

/* ============ S5: sweep alpha ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);const P=(x,y)=>[300+1000*x,880-900*(y-.4)];
  const ax=ln(svg,...P(0,.4),...P(1.04,.4),C.axis,3),ay=ln(svg,...P(0,.4),...P(0,1.02),C.axis,3);fadeIn([ax,ay],cue(sid,'sweep'),.4);
  ['0','0.25','0.5','0.75','1'].forEach((s,i)=>{const t=txt(S,s,...P(i/4,.36),{fs:24,mono:true,color:C.dim});fadeIn(t,cue(sid,'sweep'),.4)});
  const xl=txt(S,'α',P(.5,.31)[0],P(.5,.31)[1],{fs:34,color:C.pink}),yl=txt(S,'mean nDCG',P(0,1.06)[0]+40,P(0,1.06)[1],{fs:28,it:true,color:C.dim});fadeIn([xl,yl],cue(sid,'sweep'),.4);
  const f=a=>.62+.32*Math.exp(-Math.pow((a-.48)/.3,2));
  const c=pth(svg,polyD(P,pts2d(f,0,1,60)),C.pink,6);drawOn(c,cue(sid,'plot'),1.4);
  const pk=el(S,'abs hid','',{left:(P(.48,f(.48))[0]-14)+'px',top:(P(.48,f(.48))[1]-14)+'px',width:'28px',height:'28px',borderRadius:'14px',background:C.pink,boxShadow:'0 0 24px #e77fb3'});fadeIn(pk,cue(sid,'peak'),.4);
  const pl=txt(S,'peak',P(.48,f(.48))[0],P(.48,f(.48))[1]-50,{fs:30,color:C.pink});show(pl,cue(sid,'peak'),.4);
  const le=txt(S,'error codes lean keyword',P(.12,.5)[0]+60,P(.12,.5)[1],{fs:28,it:true,color:C.yellow}),ri=txt(S,'conversation leans meaning',P(.86,.5)[0]-40,P(.86,.5)[1],{fs:28,it:true,color:C.blue});
  show(le,cue(sid,'tickets'),.4);show(ri,cue(sid,'conversational'),.4);
  const ho=box(S,1600,300,420,120,'<span>confirm on a<br>held-out set</span>',C.green,{fs:32});show(ho,cue(sid,'held'),.5);
  sceneInOut(sid);
})();
