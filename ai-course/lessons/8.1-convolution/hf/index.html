function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* ---- extra helpers for module 6 and 8 lessons ---- */
/* a hidden SVG line or path, drawn on by animating its dash */
function ln(svg,x1,y1,x2,y2,color,w,extra){return svgEl('line',Object.assign({x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function pth(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;

function arrowHead(svg,x,y,ux,uy,color){const hl=20,hw=11;return svgEl('polygon',{points:`${x+ux*4},${y+uy*4} ${x-ux*hl-uy*hw},${y-uy*hl+ux*hw} ${x-ux*hl+uy*hw},${y-uy*hl-ux*hw}`,fill:color,style:'opacity:0;visibility:hidden'},svg)}

  const SG=cellGrid(S,1340,510,6,6,40,null,null,{});show(SG.box,cue(sid,'stride'),.4);
  const sw=win(S,SG,3,C.teal);fadeIn(sw,cue(sid,'stride'),.3);
  [[2,0],[0,2],[2,2]].forEach(([c,r],i)=>tl.to(sw,{x:c*40,y:r*40,duration:.35},cue(sid,'jump')+i*.7));
  const stl=lab(S,'stride 2: the kernel jumps two pixels',1460,470,C.teal,30);show(stl,cue(sid,'stride'),.4);
  const f2=el(S,'lbl',tex('\\left\\lfloor\\frac{n+2p-k}{s}\\right\\rfloor+1',44),{color:C.ink});place(f2,1460,820);show(f2,cue(sid,'shrinking'),.5);
  sceneInOut(sid);
})();

/* ============ S6: many learned kernels ============ */
(function(){const S=$('S6');const sid='s6';const svg=layerSvg(S);
  const rnd=seedRand(11);
  const img=cellGrid(S,180,420,6,6,40,()=>grey(.15+.7*rnd()),null);show(img.box,at(sid,0),.4);
  const cols=[C.blue,C.yellow,C.pink,C.teal];
  const ks=cols.map((c,k)=>{const g=cellGrid(S,640,220+k*160,3,3,34,()=>grey(rnd()),null,{border:c});show(g.box,cue(sid,'many')+k*.2,.4);return g});
  const kl=lab(S,'many kernels',690,190,C.ink,30);show(kl,cue(sid,'many'),.4);
  ks.forEach((g,k)=>{const l=ln(svg,425,540,635,271+k*160,C.dim,2);drawOn(l,cue(sid,'many')+k*.2,.4)});
  const maps=cols.map((c,k)=>{const d=el(S,'abs','',{left:(1120+k*50)+'px',top:(330+k*50)+'px',width:'260px',height:'260px',border:'3px solid '+c,borderRadius:'10px',background:'#11161ecc',opacity:0,visibility:'hidden'});show(d,cue(sid,'own')+k*.2,.4);return d});
  ks.forEach((g,k)=>{const l=ln(svg,750,271+k*160,1110+k*50,460+k*50,cols[k],2,{opacity:.6});drawOn(l,cue(sid,'own')+k*.2,.4)});
  const ch=lab(S,'one feature map per kernel: channels',1400,280,C.ink,32);show(ch,cue(sid,'channel'),.4);
  const bp=pth(svg,'M1180 900 L700 900',C.pink,5),bh=arrowHead(svg,690,900,-1,0,C.pink);drawOn(bp,cue(sid,'backpropagation'),.8);fadeIn(bh,cue(sid,'backpropagation')+.7,.2);
  const bl=lab(S,'kernel weights learned by backpropagation',940,860,C.pink,32);show(bl,cue(sid,'backpropagation'),.4);
  ks.forEach((g,k)=>g.cells.flat().forEach((c,i)=>tl.to(c,{backgroundColor:grey(seedRand(100+k*9+i)()),duration:.6},cue(sid,'discovers'))));
  const cc=el(S,'cap','strictly, libraries compute cross-correlation: no kernel flip',{top:'960px',fontSize:'34px',fontStyle:'italic',color:C.dim});show(cc,cue(sid,'cross-correlation'),.5);
  sceneInOut(sid);
})();

/* ============ S7: shared weights in transformers ============ */
(function(){const S=$('S7');const sid='s7';const svg=layerSvg(S);
  const toks=['the','cat','sat','on','a'];
  toks.forEach((w,i)=>{const x=220+i*150;const c=el(S,'chip',w,{borderColor:C.blue,fontSize:'34px'});place(c,x,700);show(c,cue(sid,'language'),.4);
    const b=boxEl(S,x,520,110,70,'<span style="font-size:28px">FFN</span>',C.yellow);show(b,cue(sid,'feed-forward'),.4);
    const l=ln(svg,x,665,x,557,C.dim,3);fadeIn(l,cue(sid,'feed-forward'),.4)});
  const sl=lab(S,'one feed-forward network, shared by every token',520,410,C.yellow,32);show(sl,cue(sid,'sharing'),.4);
  const im=el(S,'abs','',{left:'1200px',top:'260px',width:'420px',height:'420px',borderRadius:'8px',background:'linear-gradient(135deg,#2a6f97 0%,#5cd0b3 45%,#f5cf4a 100%)',opacity:0,visibility:'hidden'});show(im,cue(sid,'vision'),.4);
  const gl=[];for(let i=1;i<4;i++){gl.push(ln(svg,1200+i*105,260,1200+i*105,680,'#0e1116',4));gl.push(ln(svg,1200,260+i*105,1620,260+i*105,'#0e1116',4))}fadeIn(gl,cue(sid,'patches'),.4);
  const pt=[];for(let i=0;i<6;i++)pt.push(el(S,'abs','',{left:(1180+i*72)+'px',top:'760px',width:'56px',height:'56px',borderRadius:'6px',border:'2px solid '+C.teal,background:'#11161e',opacity:0,visibility:'hidden'}));
  tl.to(pt,{autoAlpha:1,duration:.2,stagger:.08},cue(sid,'strided'));
  const pl=lab(S,'patches → tokens, via a strided convolution',1410,860,C.teal,30);show(pl,cue(sid,'strided'),.4);
  nextCap(S,sid,'next',1,'8.2 &nbsp;pooling and feature hierarchies');
  sceneInOut(sid,true);
})();

/* KaTeX stacks glyphs on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
