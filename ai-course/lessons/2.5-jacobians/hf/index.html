/* SVG path through f(x) on plane P */
function pathD(P,f,x0,x1,n){let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=f(x);if(!isFinite(y))continue;const [px,py]=P(x,y);d+=(d?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return d}
/* linear map {a,b,c,d}: x' = a x + b y, y' = c x + d y (columns (a,c) and (b,d)) */
const mapv=(M,x,y)=>[M.a*x+M.b*y,M.c*x+M.d*y];
const ptsAttr=(P,M,pts)=>pts.map(([x,y])=>P(...mapv(M,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ');
/* grid of lines -n..n that follows a linear map; returns {g,set(M)} */
function tGrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const L=[];
  for(let k=-n;k<=n;k++){
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[k,-n],[k,n]]);
    L.push([svgEl('line',{stroke:k?(o.color||C.blue):C.axis,'stroke-width':k?2:3,opacity:k?(o.op||.55):.9},g),[-n,k],[n,k]])}
  return {g,set(M){for(const [ln,a,b] of L){const p=P(...mapv(M,...a)),q=P(...mapv(M,...b));ln.setAttribute('x1',p[0]);ln.setAttribute('y1',p[1]);ln.setAttribute('x2',q[0]);ln.setAttribute('y2',q[1])}}}}
/* rectangular clip for an svg so a plane stays in its half of the frame */
let _clipN=0;function clipTo(svg,x,y,w,h){const id='clp'+(_clipN++);const cp=svgEl('clipPath',{id},svg);svgEl('rect',{x,y,width:w,height:h},cp);const g=svgEl('g',{'clip-path':`url(#${id})`},svg);return g}

const panel=(S,html,top,o)=>el(S,'abs hid',html,Object.assign({left:'1180px',top:top+'px',width:'700px',textAlign:'center'},o||{}));
const F=(x,y)=>[x+.15*y*y,y+.35*Math.sin(x)];
const p0=[1,1];
const J=[[1,.3*p0[1]],[.35*Math.cos(p0[0]),1]];

/* ============ persistent stage s2-s4: a grid under a linear map, then under a curving function ============ */
const STAGE=$('STAGE');const P=plane(540,560,92);
const ssvg=layerSvg(STAGE);const cg=clipTo(ssvg,40,90,1040,960);
const bgr=drawGrid(cg,P,-6,6,-5,5);bgr.setAttribute('opacity','.2');
const LINES=[];for(let k=-6;k<=6;k++){LINES.push({el:svgEl('polyline',{fill:'none',stroke:k?C.blue:C.axis,'stroke-width':k?2:3,opacity:k?.6:.9},cg),pts:[...Array(49)].map((_,i)=>[k,-6+i*.25])});
  LINES.push({el:svgEl('polyline',{fill:'none',stroke:k?C.blue:C.axis,'stroke-width':k?2:3,opacity:k?.6:.9},cg),pts:[...Array(49)].map((_,i)=>[-6+i*.25,k])})}
const patch=svgEl('polygon',{fill:C.yellow,'fill-opacity':.35,stroke:C.yellow,'stroke-width':3,style:'opacity:0;visibility:hidden'},cg);
const PP=[];for(let i=0;i<=8;i++)PP.push([.75+.5*i/8,.75]);for(let i=0;i<=8;i++)PP.push([1.25,.75+.5*i/8]);for(let i=0;i<=8;i++)PP.push([1.25-.5*i/8,1.25]);for(let i=0;i<=8;i++)PP.push([.75,1.25-.5*i/8]);
const pdot=svgEl('circle',{r:8,fill:C.yellow,style:'opacity:0;visibility:hidden'},cg);
const MAP=(o,x,y)=>{const [fx,fy]=F(x,y);const lx=o.a*x+o.b*y,ly=o.c*x+o.d*y;return [(1-o.k)*lx+o.k*fx,(1-o.k)*ly+o.k*fy]};
const T=anim({a:1,b:0,c:0,d:1,k:0},o=>{
  LINES.forEach(L=>L.el.setAttribute('points',L.pts.map(([x,y])=>P(...MAP(o,x,y)).map(v=>v.toFixed(1)).join(',')).join(' ')));
  patch.setAttribute('points',PP.map(([x,y])=>P(...MAP(o,x,y)).map(v=>v.toFixed(1)).join(',')).join(' '));
  const q=P(...MAP(o,...p0));pdot.setAttribute('cx',q[0]);pdot.setAttribute('cy',q[1])});
/* zoom inset: the neighbourhood of p, magnified, next to the straight grid of J */
const ZX=1190,ZY=430,ZS=560;
const zsvg=layerSvg(STAGE);const zg=clipTo(zsvg,ZX,ZY,ZS,ZS);
const zframe=svgEl('rect',{x:ZX,y:ZY,width:ZS,height:ZS,fill:'#0e1116',stroke:C.dim,'stroke-width':2,style:'opacity:0;visibility:hidden'},zsvg);zsvg.insertBefore(zframe,zsvg.firstChild);
const zgrp=svgEl('g',{style:'opacity:0;visibility:hidden'},zg);
const ZL=[];for(let k=-4;k<=4;k++){ZL.push({el:svgEl('polyline',{fill:'none',stroke:C.blue,'stroke-width':2.5},zgrp),f:t=>[k,t]});ZL.push({el:svgEl('polyline',{fill:'none',stroke:C.blue,'stroke-width':2.5},zgrp),f:t=>[t,k]})}
const JL=[];for(let k=-4;k<=4;k++){JL.push(svgEl('line',{stroke:C.pink,'stroke-width':2,'stroke-dasharray':'6 7'},zgrp));JL.push(svgEl('line',{stroke:C.pink,'stroke-width':2,'stroke-dasharray':'6 7'},zgrp))}
const zlab=el(STAGE,'abs hid mono','',{left:ZX+'px',top:(ZY+ZS+10)+'px',width:ZS+'px',textAlign:'center',fontSize:'28px',color:C.dim});
const fp=F(...p0);
const Z=anim({w:1.2},o=>{const s=ZS/2/4,V=(u,v)=>[ZX+ZS/2+u*s,ZY+ZS/2-v*s];
  ZL.forEach(L=>{const pts=[];for(let i=0;i<=40;i++){const t=-4.5+9*i/40;const [a,b]=L.f(t);const q=F(p0[0]+a*o.w/4,p0[1]+b*o.w/4);pts.push(V((q[0]-fp[0])/(o.w/4),(q[1]-fp[1])/(o.w/4)).map(v=>v.toFixed(1)).join(','))}L.el.setAttribute('points',pts.join(' '))});
  let i=0;for(let k=-4;k<=4;k++){const a=[k,-4.5],b=[k,4.5],c=[-4.5,k],d=[4.5,k];const m=([u,v])=>[J[0][0]*u+J[0][1]*v,J[1][0]*u+J[1][1]*v];
    const A=V(...m(a)),B=V(...m(b)),Cc=V(...m(c)),D=V(...m(d));JL[i].setAttribute('x1',A[0]);JL[i].setAttribute('y1',A[1]);JL[i].setAttribute('x2',B[0]);JL[i].setAttribute('y2',B[1]);
    JL[i+1].setAttribute('x1',Cc[0]);JL[i+1].setAttribute('y1',Cc[1]);JL[i+1].setAttribute('x2',D[0]);JL[i+1].setAttribute('y2',D[1]);i+=2}
  zlab.textContent=`zoom × ${Math.round(4/o.w)}`});
const jc=[[C.green,[J[0][0],J[1][0]],tex('\\text{col }1',34)],[C.red,[J[0][1],J[1][1]],tex('\\text{col }2',34)]].map(([col,v,lab])=>{const s=ZS/2/4*1.6;const a=mkArrow(zsvg,(x,y)=>[ZX+ZS/2+x*s,ZY+ZS/2-y*s],col,7,lab,30,-26,STAGE);setArrow(a,{x0:0,y0:0,x1:v[0],y1:v[1]});return a});
tl.to(STAGE,{autoAlpha:1,duration:.8},START.s2);tl.to(STAGE,{autoAlpha:0,duration:.6},START.s5-.3);

/* ============ S1: from one number out to a vector out ============ */
(function(){const S=$('S1'),sid='s1';
  const a=el(S,'abs hid',tex('f:\\ \\mathbb{R}^n\\to\\mathbb{R}\\qquad\\longrightarrow\\qquad\\nabla f',60),{left:'0',top:'260px',width:'1920px',textAlign:'center',color:C.yellow});show(a,cue(sid,'gradient'),.6);
  const b=el(S,'abs hid',tex('\\text{layer}:\\ \\mathbb{R}^n\\to\\mathbb{R}^m\\qquad\\longrightarrow\\qquad ?',60),{left:'0',top:'420px',width:'1920px',textAlign:'center',color:C.blue});show(b,cue(sid,'layer'),.6);
  const c=el(S,'abs hid','the Jacobian matrix',{left:'0',top:'640px',width:'1920px',textAlign:'center',fontSize:'84px',color:C.pink});show(c,cue(sid,'jacobian'),.6);
  sceneInOut(sid);
})();

/* ============ S2: a matrix keeps lines straight; a general function bends them ============ */
(function(){const S=$('S2'),sid='s2';
  T.to(cue(sid,'matrix'),2,{a:1.25,b:.45,c:.2,d:.95});
  const n1=panel(S,'a matrix: lines stay straight',260,{fontSize:'40px',fontStyle:'italic'});show(n1,cue(sid,'grid'),.5);fadeOut(n1,cue(sid,'general')-.3,.3);
  T.to(cue(sid,'general')-.3,1.4,{a:1,b:0,c:0,d:1});
  T.to(cue(sid,'bends'),3,{k:1});
  const f=panel(S,tex('F(x,y)=\\begin{bmatrix}x+0.15\\,y^2\\\\ y+0.35\\sin x\\end{bmatrix}',46),400);show(f,cue(sid,'function'),.6);
  const n2=panel(S,'a function: the grid bends',560,{fontSize:'40px',fontStyle:'italic',color:C.yellow});show(n2,cue(sid,'bends'),.5);
  sceneInOut(sid);
})();

/* ============ S3: zoom in: locally linear ============ */
(function(){const S=$('S3'),sid='s3';
  fadeIn([patch,pdot],cue(sid,'patch'),.5);
  fadeIn([zframe,zgrp,zlab],cue(sid,'zoom'),.5);
  Z.to(cue(sid,'zoom')+.4,6,{w:.04},'power2.in');
  const n=panel(S,'the curved grid looks straight again',240,{fontSize:'40px',fontStyle:'italic'});show(n,cue(sid,'curved'),.5);
  const j=panel(S,'pink: the straight grid of one matrix, J',320,{fontSize:'36px',fontStyle:'italic',color:C.pink});show(j,cue(sid,'linear'),.5);
  sceneInOut(sid);
})();

/* ============ S4: the entries: rows are outputs, columns are inputs ============ */
(function(){const S=$('S4'),sid='s4';
  const m=el(S,'abs hid','',{left:'1120px',top:'120px',width:'760px',textAlign:'center'});
  m.innerHTML=tex('J=\\begin{bmatrix}\\partial f_1/\\partial x & \\partial f_1/\\partial y\\\\ \\partial f_2/\\partial x & \\partial f_2/\\partial y\\end{bmatrix}',46);
  show(m,cue(sid,'entries'),.6);
  const row=el(S,'hl','',{left:'1318px',top:'128px',width:'500px',height:'60px',borderColor:C.yellow});
  const col=el(S,'hl','',{left:'1318px',top:'124px',width:'225px',height:'126px',borderColor:C.green});
  fadeIn(row,cue(sid,'row'),.3);fadeOut(row,cue(sid,'column'),.3);
  fadeIn(col,cue(sid,'column'),.3);fadeOut(col,cue(sid,'so'),.3);
  const n=panel(S,'row i, column j: how output i moves when input j is nudged',330,{fontSize:'32px',fontStyle:'italic',color:C.dim});show(n,cue(sid,'entry'),.5);fadeOut(n,cue(sid,'first')-.2,.3);
  showArrow(jc[0],cue(sid,'first'),.5);showArrow(jc[1],cue(sid,'second'),.5);
  const l=panel(S,'like the columns of a matrix in 1.3',340,{fontSize:'34px',fontStyle:'italic',color:C.dim});show(l,cue(sid,'exactly'),.5);
  sceneInOut(sid);
})();

/* ============ S5: polar coordinates: det J = r ============ */
(function(){const S=$('S5'),sid='s5';
  sceneIn(sid);
  const svg=layerSvg(S);
  /* left: the (r, θ) rectangle */
  const RP=(r,t)=>[150+r*95,820-t*95];
  const lg=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  for(let r=0;r<=4;r++)svgEl('line',{x1:RP(r,0)[0],y1:RP(r,0)[1],x2:RP(r,2*Math.PI)[0],y2:RP(r,2*Math.PI)[1],stroke:C.blue,'stroke-width':2,opacity:.6},lg);
  for(let k=0;k<=8;k++){const t=k*Math.PI/4;svgEl('line',{x1:RP(0,t)[0],y1:RP(0,t)[1],x2:RP(4,t)[0],y2:RP(4,t)[1],stroke:C.blue,'stroke-width':2,opacity:.6},lg)}
  const rl=el(S,'abs hid',tex('r',40),{left:(RP(4,0)[0]+10)+'px',top:(RP(0,0)[1]-10)+'px'});const tl_=el(S,'abs hid',tex('\\theta',40),{left:(RP(0,0)[0]-40)+'px',top:(RP(0,2*Math.PI)[1]-20)+'px'});
  const pr=(r0,t0,col)=>{const pts=[[r0,t0],[r0+.5,t0],[r0+.5,t0+Math.PI/8],[r0,t0+Math.PI/8]];return svgEl('polygon',{points:pts.map(q=>RP(...q).join(',')).join(' '),fill:col,'fill-opacity':.45,stroke:col,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg)};
  const pa=pr(.75,Math.PI/4,C.yellow),pb=pr(3,Math.PI/4,C.pink);
  /* right: the same grid in the x, y plane */
  const XP=(x,y)=>[1000+x*95,520-y*95];
  const rg=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  for(let r=1;r<=4;r++)svgEl('circle',{cx:XP(0,0)[0],cy:XP(0,0)[1],r:r*95,fill:'none',stroke:C.blue,'stroke-width':2,opacity:.6},rg);
  for(let k=0;k<8;k++){const t=k*Math.PI/4;svgEl('line',{x1:XP(0,0)[0],y1:XP(0,0)[1],x2:XP(4*Math.cos(t),4*Math.sin(t))[0],y2:XP(4*Math.cos(t),4*Math.sin(t))[1],stroke:C.blue,'stroke-width':2,opacity:.6},rg)}
  const sector=(r0,t0,col)=>{const pts=[];for(let i=0;i<=10;i++){const t=t0+Math.PI/8*i/10;pts.push(XP(r0*Math.cos(t),r0*Math.sin(t)))}for(let i=10;i>=0;i--){const t=t0+Math.PI/8*i/10;pts.push(XP((r0+.5)*Math.cos(t),(r0+.5)*Math.sin(t)))}
    return svgEl('polygon',{points:pts.map(q=>q.join(',')).join(' '),fill:col,'fill-opacity':.45,stroke:col,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg)};
  const sa=sector(.75,Math.PI/4,C.yellow),sb=sector(3,Math.PI/4,C.pink);
  const arr=mkArrow(svg,(x,y)=>[x,y],C.dim,4);setArrow(arr,{x0:560,y0:520,x1:640,y1:520});
  fadeIn([lg,rl,tl_],cue(sid,'polar'),.5);showArrow(arr,cue(sid,'ordinary'),.4);fadeIn(rg,cue(sid,'ordinary'),.5);
  const Jm=el(S,'abs hid',tex('J=\\begin{bmatrix}\\cos\\theta&-r\\sin\\theta\\\\ \\sin\\theta& r\\cos\\theta\\end{bmatrix}',42),{left:'1440px',top:'250px',width:'460px',textAlign:'center'});show(Jm,cue(sid,'jacobian'),.6);
  const dt=el(S,'abs hid',tex('\\det J=r',54),{left:'1440px',top:'420px',width:'460px',textAlign:'center',color:C.yellow});show(dt,cue(sid,'determinant'),.6);
  fadeIn([pa,sa],cue(sid,'small'),.5);fadeIn([pb,sb],cue(sid,'far'),.5);
  const n=el(S,'abs hid','same patch in (r, θ), more area far out',{left:'1440px',top:'540px',width:'460px',textAlign:'center',fontSize:'34px',fontStyle:'italic'});show(n,cue(sid,'stretched'),.5);
  const n2=el(S,'abs hid','the determinant of module 1, measured locally',{left:'1440px',top:'660px',width:'460px',textAlign:'center',fontSize:'34px',fontStyle:'italic',color:C.dim});show(n2,cue(sid,'locally'),.5);
  tl.to(S,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5);
})();

/* ============ S6: chain rule = product of Jacobians; a linear layer's Jacobian is W ============ */
(function(){const S=$('S6'),sid='s6';
  sceneIn(sid);
  const a=el(S,'abs hid',tex('J_{g\\circ f}(x)=J_g\\big(f(x)\\big)\\;J_f(x)',66),{left:'0',top:'250px',width:'1920px',textAlign:'center'});show(a,cue(sid,'chain'),.6);
  const b=el(S,'abs hid','local linear maps compose, so their matrices multiply (lesson 1.4)',{left:'0',top:'420px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic',color:C.dim});show(b,cue(sid,'compose',2),.5);
  const c=el(S,'abs hid',tex('y=Wx\\quad\\Longrightarrow\\quad J=W',66),{left:'0',top:'600px',width:'1920px',textAlign:'center',color:C.yellow});show(c,cue(sid,'linear'),.6);
  tl.to(S,{opacity:0,duration:.5,ease:'none'},START[sid]+SPAN[sid]-.5);
})();

/* ============ S7: backprop carries one vector back through the Jacobians ============ */
(function(){const S=$('S7'),sid='s7';
  sceneIn(sid);
  const N=5,xs=[...Array(N)].map((_,i)=>380+i*290),y=420;
  const bx=xs.map((x,i)=>{const d=el(S,'abs hid','',{left:(x-95)+'px',top:(y-80)+'px',width:'190px',height:'160px',border:`3px solid ${C.blue}`,borderRadius:'14px',background:'#141b24',display:'flex',alignItems:'center',justifyContent:'center'});d.innerHTML=tex(`J_${i+1}`,52);return d});
  tl.to(bx,{autoAlpha:1,duration:.3,stagger:.1},cue(sid,'chain'));
  const no=el(S,'abs hid','never built in full',{left:'0',top:'200px',width:'1920px',textAlign:'center',fontSize:'44px',fontStyle:'italic',color:C.dim});show(no,cue(sid,'never'),.5);
  const v=el(S,'abs hid','',{left:'0',top:(y+120)+'px',width:'220px',textAlign:'center',color:C.pink});v.innerHTML=tex('\\vec v^{\\top}',54);
  gsap.set(v,{x:xs[N-1]+100-110});
  const t0=cue(sid,'carries');fadeIn(v,t0,.4);
  tl.to(v,{x:xs[0]-200-110,duration:5.4,ease:'none',immediateRender:false},t0+.3);
  bx.slice().reverse().forEach((b,k)=>{tl.to(b,{borderColor:C.pink,duration:.25},t0+.6+k*1.08);tl.to(b,{borderColor:C.blue,duration:.4},t0+1.2+k*1.08)});
  const vj=el(S,'abs hid',tex('\\vec v^{\\top}\\leftarrow\\vec v^{\\top}J_k\\quad\\text{(one vector, one Jacobian at a time)}',46),{left:'0',top:'700px',width:'1920px',textAlign:'center',color:C.pink});show(vj,cue(sid,'multiplies',2),.6);
  const ch=el(S,'abs hid','far cheaper than multiplying the matrices together',{left:'0',top:'790px',width:'1920px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.dim});show(ch,cue(sid,'cheaper'),.5);
  fadeOut(ch,cue(sid,'next')-.2,.3);
  const next=el(S,'cap','next &nbsp;·&nbsp; 2.6 &nbsp;linear approximation and Taylor series',{top:'930px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(next,cue(sid,'next'),.7);
})();

/* KaTeX stacks accents and fraction parts as overlapping spans by design */
document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
