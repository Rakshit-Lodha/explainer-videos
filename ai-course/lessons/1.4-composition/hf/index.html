  for(let x=x0;x<=x1;x++){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:x===0?C.axis:C.grid,'stroke-width':x===0?3:1.6,opacity:x===0?.9:.55},g)}
  for(let y=y0;y<=y1;y++){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:y===0?C.axis:C.grid,'stroke-width':y===0?3:1.6,opacity:y===0?.9:.55},g)}
  return g}

/* arrows: geometry is recomputed from a proxy so seeks in any order land on the same frame */
function mkArrow(svg,P,color,w,label,lx,ly,parent){
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const line=svgEl('line',{stroke:color,'stroke-width':w||7,'stroke-linecap':'round'},g);
  const head=svgEl('polygon',{fill:color},g);
  const a={g,line,head,P,st:{x0:0,y0:0,x1:0,y1:0},lx:lx||0,ly:ly||-50};
  if(label){a.label=el(parent,'lbl',label,{color});a.label.setAttribute('data-layout-allow-overlap','')}
  return a}
function geom(a,x0,y0,x1,y1){
  const [p0x,p0y]=a.P(x0,y0),[p1x,p1y]=a.P(x1,y1);const dx=p1x-p0x,dy=p1y-p0y,L=Math.hypot(dx,dy);
  if(L<2){a.line.setAttribute('x1',p0x);a.line.setAttribute('y1',p0y);a.line.setAttribute('x2',p0x);a.line.setAttribute('y2',p0y);a.head.setAttribute('points','');}
  else{const hl=Math.min(30,L*.45),hw=hl*.55,ux=dx/L,uy=dy/L,bx=p1x-ux*hl,by=p1y-uy*hl;
    a.line.setAttribute('x1',p0x);a.line.setAttribute('y1',p0y);a.line.setAttribute('x2',bx);a.line.setAttribute('y2',by);
    a.head.setAttribute('points',`${p1x},${p1y} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`)}
  if(a.label)gsap.set(a.label,{x:p1x+a.lx,y:p1y+a.ly,xPercent:-50,yPercent:-50})}
function setArrow(a,s){Object.assign(a.st,s);geom(a,a.st.x0,a.st.y0,a.st.x1,a.st.y1)}
function arrowTo(a,time,d,to,ease){const from={...a.st},o={...from};const tgt={...from,...to};
  tl.to(o,{...tgt,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>geom(a,o.x0,o.y0,o.x1,o.y1)},time);a.st=tgt}
function showArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:1,duration:d||.4},time)}
function hideArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:0,duration:d||.4},time)}
function grow(a,time,d,x1,y1){setArrow(a,{x1:a.st.x0,y1:a.st.y0});showArrow(a,time,.25);arrowTo(a,time,d,{x1,y1},'power2.out')}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}
/* 2x2 matrix with brackets; cols[j][i] are cells, colours per column */
function mat2(parent,cx,cy,m,o){o=o||{};const fs=o.fs||60,cw=o.cw||110,rowH=fs*1.35,pad=fs*.3,W=cw*2+44,H=rowH*2+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cols=[0,1].map(j=>[0,1].map(i=>el(box,'cell',m[i][j],{left:(22+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:(o.colColors||[C.ink,C.ink])[j]})));
  return {box,cols,cx,cy,W,H,cw,rowH,pad}}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+22+j*m.cw+6)+'px',top:(m.cy-m.H/2+m.pad-6)+'px',width:(m.cw-12)+'px',height:(m.rowH*2+12)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* transformable grid: lines in grid units, redrawn through a 2x2 matrix [a b; c d] (columns = images of i-hat, j-hat) */
function tgrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const lines=[];
  for(let k=-n;k<=n;k++){
    lines.push({p:[k,-n],q:[k,n],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)});
    lines.push({p:[-n,k],q:[n,k],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)})}
  const T={g,lines,P,m:{a:1,b:0,c:0,d:1}};
  T.apply=(m)=>{T.m={a:m.a,b:m.b,c:m.c,d:m.d};for(const L of lines){const A=P(m.a*L.p[0]+m.b*L.p[1],m.c*L.p[0]+m.d*L.p[1]),B=P(m.a*L.q[0]+m.b*L.q[1],m.c*L.q[0]+m.d*L.q[1]);
    L.e.setAttribute('x1',A[0]);L.e.setAttribute('y1',A[1]);L.e.setAttribute('x2',B[0]);L.e.setAttribute('y2',B[1])}};
  T.apply(T.m);return T}
/* the whole picture (grid + arrows defined in source coordinates) moves under one matrix tween */
function mkScene(P){const S={P,grids:[],arrows:[],dots:[],m:{a:1,b:0,c:0,d:1},extra:[]};
  S.apply=(m)=>{S.m={a:m.a,b:m.b,c:m.c,d:m.d};S.grids.forEach(g=>g.apply(m));
    S.arrows.forEach(([ar,x,y])=>geom(ar,0,0,m.a*x+m.b*y,m.c*x+m.d*y));
    S.dots.forEach(([e,x,y])=>{const p=P(m.a*x+m.b*y,m.c*x+m.d*y);e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1])});
    S.extra.forEach(f=>f(m))};
  S.to=(time,d,m,ease)=>{anim(time,d,S.m,m,S.apply,ease||'power2.inOut');S.m={...m}};
  return S}

/* ============ persistent stage (s1-s8): a plane moved by matrices ============ */

const defs=svgEl('defs',{},ssvg);const cp=svgEl('clipPath',{id:'pclip'},defs);svgEl('rect',{x:40,y:110,width:1060,height:940},cp);
const world=svgEl('g',{'clip-path':'url(#pclip)'},ssvg);
const ref=svgEl('g',{opacity:.22},world);
for(let k=-7;k<=7;k++){const a=P(k,-6),b=P(k,6),c=P(-7,k),d=P(7,k);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.dim,'stroke-width':1.2},ref);svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.dim,'stroke-width':1.2},ref)}

MS.apply({a:1,b:0,c:0,d:1});
const I2={a:1,b:0,c:0,d:1};
const mul=(A,B)=>({a:A.a*B.a+A.b*B.c,b:A.a*B.b+A.b*B.d,c:A.c*B.a+A.d*B.c,d:A.c*B.b+A.d*B.d});
const Rot=t=>{const r=t*Math.PI/180;return {a:Math.cos(r),b:-Math.sin(r),c:Math.sin(r),d:Math.cos(r)}};
const Sh=s=>({a:1,b:s,c:0,d:1});
const R90=Rot(90),S1=Sh(1),SR=mul(S1,R90),RS=mul(R90,S1);
/* matrix motions never overlap; path(p) gives the matrix along a motion */
let msEnd=0;
function motion(time,d,p0,p1,path,ease){time=Math.max(time,msEnd);msEnd=time+d;anim(time,d,{p:p0},{p:p1},o=>MS.apply(path(o.p)),ease||'power2.inOut');MS.m=path(p1)}

  const m1=marker(S,svg,0,1,C.green,'(0, 1)',70,-20),m2=marker(S,svg,-1,1,C.red,'(−1, 1)',-30,-62);
  fadeIn(m1,cue(sid,'zero'),.4);fadeIn(m2,cue(sid,'minus'),.4);
  const a=el(S,'abs hid',tex('R\\,S=\\begin{bmatrix}{\\color{#83c167}0}&{\\color{#fc6255}-1}\\\\{\\color{#83c167}1}&{\\color{#fc6255}1}\\end{bmatrix}',50),rp({top:'260px',textAlign:'center'}));
  const b=el(S,'abs hid',tex('\\ne\\; S\\,R=\\begin{bmatrix}1&-1\\\\1&0\\end{bmatrix}',50),rp({top:'420px',textAlign:'center',color:C.dim}));
  show(a,cue(sid,'different'),.6);show(b,cue(sid,'different')+.6,.6);
  const om=el(S,'note','order matters',rp({top:'590px',textAlign:'center',color:C.pink}));
  show(om,cue(sid,'order'),.5);
  const sk=el(S,'note','socks then shoes ≠ shoes then socks',rp({top:'670px',textAlign:'center',color:C.dim}));
  show(sk,cue(sid,'socks'),.5);
  const ab=el(S,'abs hid',tex('AB\\ne BA\\quad\\text{(usually)}',54),rp({top:'780px',textAlign:'center',color:C.ink}));
  show(ab,cue(sid,'symbols'),.5);
  sceneInOut(sid);
})();

/* ============ S8: grouping does not matter ============ */
(function(){const S=$('S8');const sid='s8';
  const g1=el(S,'abs hid',tex('(A\\,B)\\,C\\,\\vec{v}',64),rp({top:'200px',textAlign:'center'}));
  const g2=el(S,'abs hid',tex('=\\;A\\,(B\\,C)\\,\\vec{v}',64),rp({top:'320px',textAlign:'center'}));
  show(g1,cue(sid,'group'),.6);show(g2,cue(sid,'first')+.2,.6);
  const sm=el(S,'note','same motions, same order, same result',rp({top:'470px',textAlign:'center',color:C.ink}));
  show(sm,cue(sid,'order'),.5);
  const as=el(S,'note','<span style="color:#f5cf4a">associativity</span>',rp({top:'580px',textAlign:'center'}));
  show(as,cue(sid,'associativity'),.5);
  const cl=el(S,'note','so any chain of matrices collapses into one',rp({top:'680px',textAlign:'center',color:C.pink}));
  show(cl,cue(sid,'collapse'),.5);
  // three motions in a row: rotate, shear, stretch; then the single product in one go
  const ST={a:1.3,b:0,c:0,d:.7},ALL=mul(ST,SR);
  MS.to(cue(sid,'three')-.4,.8,I2);
  rotate(cue(sid,'three')+.4,1.1);shear(cue(sid,'three')+1.6,1.1,R90);MS.to(cue(sid,'three')+2.8,1.1,ALL);
  MS.to(cue(sid,'collapse')-.6,.8,I2);MS.to(cue(sid,'collapse')+.3,2,ALL);
  sceneInOut(sid);
})();

/* ============ S9: why networks put a bend between layers ============ */
(function(){const S=$('S9');const sid='s9';
  const box=(x,y,w,h,html,c)=>el(S,'abs hid',html,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',border:`3px solid ${c}`,borderRadius:'16px',background:'#141a22',textAlign:'center',lineHeight:h+'px',fontSize:'44px',color:c});
  const arrow=(x,y)=>el(S,'abs hid','→',{left:x+'px',top:(y-34)+'px',width:'70px',textAlign:'center',fontSize:'56px',color:C.dim});
  // row 1: two linear layers collapse into one
  const y1=260;
  const r1=[el(S,'abs hid',tex('\\vec{x}',56),{left:'240px',top:(y1-40)+'px',width:'80px',textAlign:'center'}),arrow(320,y1),box(400,y1-55,200,110,tex('W_1',48),C.yellow),arrow(610,y1),box(690,y1-55,200,110,tex('W_2',48),C.yellow),arrow(900,y1),el(S,'abs hid',tex('\\vec{y}',56),{left:'980px',top:(y1-40)+'px',width:'80px',textAlign:'center'})];
  show(r1,cue(sid,'layers'),.5,{stagger:.08});
  const eqv=el(S,'abs hid',`= &nbsp;${tex('(W_2W_1)\\,\\vec{x}',52)} &nbsp;<span style="font-size:38px;font-style:italic;color:${C.dim}">one matrix: nothing new</span>`,{left:'1120px',top:(y1-40)+'px',width:'760px',fontSize:'44px'});
  show(eqv,cue(sid,'collapse'),.6);
  // row 2: with a bend in between
  const y2=560;
  const bend='<svg width="120" height="70" viewBox="0 0 120 70"><path d="M8 58 L60 58 L112 10" fill="none" stroke="#e77fb3" stroke-width="6" stroke-linecap="round"/></svg>';
  const r2=[el(S,'abs hid',tex('\\vec{x}',56),{left:'100px',top:(y2-40)+'px',width:'80px',textAlign:'center'}),arrow(180,y2),box(260,y2-55,180,110,tex('W_1',48),C.yellow),arrow(450,y2),
    el(S,'abs hid',bend,{left:'530px',top:(y2-45)+'px',width:'160px',height:'90px',border:`3px solid ${C.pink}`,borderRadius:'16px',background:'#141a22',paddingTop:'8px',textAlign:'center'}),arrow(700,y2),box(780,y2-55,180,110,tex('W_2',48),C.yellow),arrow(970,y2),el(S,'abs hid',tex('\\vec{y}',56),{left:'1050px',top:(y2-40)+'px',width:'80px',textAlign:'center'})];
  show(r2,cue(sid,'bend'),.5,{stagger:.08});
  const nl=el(S,'abs hid','a nonlinearity: the chain can no longer fold into one matrix',{left:'100px',top:(y2+90)+'px',width:'1100px',textAlign:'center',fontSize:'38px',fontStyle:'italic',color:C.pink});
  show(nl,cue(sid,'nonlinearity'),.5);
  const dp=el(S,'abs hid','→ depth gives genuinely new power',{left:'1240px',top:(y2-30)+'px',width:'620px',fontSize:'42px',fontStyle:'italic',color:C.teal});
  show(dp,cue(sid,'depth'),.5);
  const tr=el(S,'abs hid','a transformer layer: lots of matrix products, separated by bends',{left:'0',top:'900px',width:'1920px',textAlign:'center',fontSize:'42px',fontStyle:'italic',color:C.yellow});
  show(tr,cue(sid,'transformer'),.6);
  sceneInOut(sid);
})();

/* ============ S10: summary and next ============ */
(function(){const S=$('S10');const sid='s10';
  const a=el(S,'abs hid',`${tex('A\\,B',64)} &nbsp;= do <span style="color:#83c167">B</span> first, then <span style="color:#f5cf4a">A</span>`,{left:'0',top:'250px',width:'1920px',textAlign:'center',fontSize:'56px'});
  show(a,cue(sid,'motion'),.6);
  const b=el(S,'abs hid','each column of the product = where a basis arrow finally lands',{left:'0',top:'440px',width:'1920px',textAlign:'center',fontSize:'48px',fontStyle:'italic'});
  show(b,cue(sid,'column'),.6);
  const c=el(S,'abs hid','how much does a transformation stretch area?',{left:'0',top:'640px',width:'1920px',textAlign:'center',fontSize:'46px',fontStyle:'italic',color:C.dim});
  show(c,cue(sid,'area'),.6);
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.5 &nbsp;determinant: how much area gets stretched',{top:'900px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'determinant'),.7);
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();

window.__timelines=window.__timelines||{};
