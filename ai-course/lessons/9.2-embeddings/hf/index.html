#root{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Newsreader',Georgia,serif;color:var(--ink);
  background:radial-gradient(ellipse 80% 75% at 45% 50%,#141a22 0%,#0e1116 60%,#0a0c10 100%)}

.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}
.sym{position:absolute;font-size:60px;color:var(--ink);opacity:0;visibility:hidden;width:60px;text-align:center}
.word{position:absolute;left:0;top:0;font-size:64px;white-space:nowrap}

.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}
.cap em{color:var(--blue)}
.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}

.tok{position:absolute;padding:6px 16px;border:2px solid;border-radius:12px;white-space:nowrap;font-family:'JetBrains Mono',ui-monospace,monospace;line-height:1.25}
.mat{position:absolute}
.mc{position:absolute;text-align:center;border:1px solid;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--ink)}
.bar{position:absolute;border-radius:6px 6px 0 0}
.note{position:absolute;font-size:40px;font-style:italic;line-height:1.3;opacity:0;visibility:hidden}

/* matrix of cells centred on (cx,cy): o.vals (strings) and/or o.heat (0..1) */
function matrix(parent,cx,cy,R,K,o){o=o||{};const cw=o.cw||52,ch=o.ch||cw,W=K*cw,H=R*ch;
  const box=el(parent,'mat'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  const cells=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<K;c++){
    const v=o.vals?o.vals[r][c]:'';const bg=o.heat?heat(o.heat[r][c],o.color):(o.fill||hexA(o.color||C.blue,.12));
    row.push(el(box,'mc',v,{left:c*cw+'px',top:r*ch+'px',width:cw+'px',height:ch+'px',lineHeight:ch+'px',fontSize:(o.fs||Math.round(Math.min(cw,ch)*.4))+'px',background:bg,borderColor:o.line||'rgba(201,211,224,0.28)'}))}cells.push(row)}
  return {box,cells,cx,cy,W,H,cw,ch,x0:cx-W/2,y0:cy-H/2,R,K}}
/* highlight box around a block of matrix cells */
function matHL(parent,m,r0,c0,r1,c1,color){return el(parent,'hl','',{left:(m.x0+c0*m.cw-5)+'px',top:(m.y0+r0*m.ch-5)+'px',width:((c1-c0+1)*m.cw+10)+'px',height:((r1-r0+1)*m.ch+10)+'px',borderColor:color,boxShadow:`0 0 20px ${color}66`})}
/* quadratic curve with optional arrow head, drawn on with a dash offset */
function curve(svg,x0,y0,x1,y1,o){o=o||{};const b=o.bend==null?-60:o.bend,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;
  const qx=(x0+x1)/2-dy/L*b,qy=(y0+y1)/2+dx/L*b;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const p=svgEl('path',{d:`M${x0},${y0} Q${qx},${qy} ${x1},${y1}`,fill:'none',stroke:o.color||C.blue,'stroke-width':o.w||4,'stroke-linecap':'round','stroke-opacity':o.op==null?1:o.op},g);
  const len=Math.max(1,p.getTotalLength());p.setAttribute('stroke-dasharray',len);p.setAttribute('stroke-dashoffset',len);
  let head=null;if(o.head!==false){const tx=x1-qx,ty=y1-qy,tL=Math.hypot(tx,ty)||1,ux=tx/tL,uy=ty/tL,hl=o.hl||18,hw=hl*.55,bx=x1-ux*hl,by=y1-uy*hl;
    head=svgEl('polygon',{points:`${x1},${y1} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`,fill:o.color||C.blue,'fill-opacity':o.op==null?1:o.op,opacity:0},g)}
  return {g,p,len,head}}
function drawCurve(c,time,d){tl.to(c.g,{autoAlpha:1,duration:.15},time);tl.to(c.p,{attr:{'stroke-dashoffset':0},duration:d||.8,ease:'power2.out'},time);if(c.head)tl.to(c.head,{opacity:1,duration:.2},time+(d||.8)*.8)}
/* vertical bars (values 0..1) with a baseline at yBase; setBars tweens to new values */
function bars(parent,x0,yBase,vals,o){o=o||{};const bw=o.bw||60,gap=o.gap||22,Hm=o.h||300;
  const B={bw,gap,Hm,v:vals.slice(),items:[]};
  vals.forEach((v,i)=>{const x=x0+i*(bw+gap);
    const b=el(parent,'bar hid','',{left:x+'px',top:(yBase-Hm)+'px',width:bw+'px',height:Hm+'px',background:(o.colors?o.colors[i]:o.color)||C.blue,transformOrigin:'50% 100%'});
    gsap.set(b,{scaleY:Math.max(.002,v)});
    let t=null;if(o.values!==false){t=el(parent,'lbl mono',fmt(v,2),{color:C.ink,fontSize:(o.vfs||24)+'px'});place(t,x+bw/2,yBase-18);gsap.set(t,{y:-Hm*v})}
    let lb=null;if(o.labels){lb=el(parent,'lbl mono',o.labels[i],{color:o.lcol||C.ink,fontSize:(o.lfs||30)+'px'});place(lb,x+bw/2,yBase+30)}
    B.items.push({b,t,lb})});
  return B}
function barEls(B){const a=[];B.items.forEach(it=>{a.push(it.b);if(it.t)a.push(it.t);if(it.lb)a.push(it.lb)});return a}
function setBars(B,time,d,vals){const from=B.v.slice(),p={k:0};
  tl.to(p,{k:1,duration:d,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{B.items.forEach((it,i)=>{const v=from[i]+(vals[i]-from[i])*p.k;
    gsap.set(it.b,{scaleY:Math.max(.002,v)});if(it.t){gsap.set(it.t,{y:-B.Hm*v});it.t.textContent=fmt(v,2)}})}},time);B.v=vals.slice()}
function softmaxJS(xs,T){T=T||1;const m=Math.max(...xs);const e=xs.map(x=>Math.exp((x-m)/T));const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
/* type out the characters of an element's text, one span per character */
function typeIn(d,time,per){const s=d.textContent;d.innerHTML=s.split('').map(ch=>`<span class="ch" style="opacity:0;visibility:hidden">${ch===' '?'&nbsp;':ch}</span>`).join('');
  tl.to(d.querySelectorAll('.ch'),{autoAlpha:1,duration:.04,stagger:per||.05,ease:'none'},time)}
function nextCap(S,html,time){const n=el(S,'cap',html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(n,time,.7);return n}

const VOC=['the','a','cat','sat','on','mat'];
const EV=(()=>{const r=seedRand(21);return VOC.map(()=>[0,1,2,3].map(()=>fmt(r()*2-1,1)))})();

/* ============ S1: a table of rows, one per token ============ */
(function(){const S=$('S1');const sid='s1';
  const t=tok(S,'cat',300,420,{fs:56,color:C.ink,border:C.blue});const tid=label(S,'ID 2',300,510,{fs:40,mono:true,color:C.yellow});
  show([t,tid],at(sid,.01),.6,{stagger:.2});
  const nt=label(S,'only a name tag',300,590,{fs:32,italic:true,color:C.dim});show(nt,cue(sid,'name'),.5);
  const M=matrix(S,960,560,6,4,{cw:110,ch:70,vals:EV,fs:30});
  const rl=VOC.map((w,i)=>label(S,`<span style="color:#f5cf4a">${i}</span>&nbsp; ${w}`,M.x0-90,M.y0+i*70+35,{fs:32,mono:true,color:C.ink}));
  show(M.box,cue(sid,'table'),.7);show(rl,cue(sid,'row'),.4,{stagger:.06});
  const tl1=label(S,'embedding table',960,M.y0-50,{fs:40,italic:true,color:C.blue});show(tl1,cue(sid,'vocabulary'),.5);
  const dr=label(S,'one drawer per token',960,M.y0+M.H+50,{fs:34,italic:true,color:C.dim});show(dr,cue(sid,'drawers'),.5);
  const h=matHL(S,M,2,0,2,3,C.yellow);fadeIn(h,cue(sid,'drawer'),.4);
  const svg=layerSvg(S);const a=curve(svg,370,440,M.x0-170,M.y0+2*70+35,{color:C.yellow,bend:-40,w:4});drawCurve(a,cue(sid,'number'),.7);
  // the card slides out
  const card=matrix(S,960,M.y0+2*70+35,1,4,{cw:110,ch:70,vals:[EV[2]],fs:30,color:C.yellow});card.box.setAttribute('data-layout-allow-overlap','');
  card.cells[0].forEach(c=>c.setAttribute('data-layout-allow-overlap',''));
  fadeIn(card.box,cue(sid,'card'),.3);tl.to(card.box,{x:560,duration:1.1,ease:'power2.inOut'},cue(sid,'card')+.2);
  const el1=label(S,'embedding of <i>cat</i>',1520,M.y0+2*70-30,{fs:36,color:C.yellow});show(el1,cue(sid,'embedding'),.5);
  sceneInOut(sid);
})();

/* ============ S2: lookup = one-hot times the table; a sentence becomes (T x d) ============ */
(function(){const S=$('S2');const sid='s2';
  const lk=label(S,'lookup &nbsp;=&nbsp; matrix product',960,150,{fs:44,italic:true,color:C.ink});show(lk,at(sid,.01),.5);
  const oh=matrix(S,420,380,1,6,{cw:64,ch:64,vals:[['0','0','1','0','0','0']],fs:30,color:C.green});
  oh.cells[0][2].style.color=C.yellow;
  const x=sym(S,'×',700,380,64),eq=sym(S,'=',1235,380,64);
  const E=matrix(S,960,380,6,4,{cw:90,ch:56,vals:EV,fs:26});
  const R=matrix(S,1480,380,1,4,{cw:90,ch:64,vals:[EV[2]],fs:26,color:C.yellow});
  show(E.box,at(sid,.02),.5);
  show(oh.box,cue(sid,'one'),.6);show(x,cue(sid,'one'),.4);
  const ohl=label(S,'one-hot: a single 1 at position 2',420,470,{fs:28,italic:true,color:C.green});show(ohl,cue(sid,'zeros'),.5);
  const offRows=[0,1,3,4,5];
  tl.to(offRows.flatMap(r=>E.cells[r]),{opacity:.18,duration:.6},cue(sid,'switches'));
  const h=matHL(S,E,2,0,2,3,C.yellow);fadeIn(h,cue(sid,'except'),.4);
  show([eq,R.box],cue(sid,'product',2),.5);
  const s1=label(S,'(1 × V)',420,620,{fs:34,mono:true,color:C.dim}),s2=label(S,'(V × d)',960,620,{fs:34,mono:true,color:C.dim}),s3=label(S,'(1 × d)',1480,620,{fs:34,mono:true,color:C.dim});
  show([s1,s2,s3],cue(sid,'wanted'),.5,{stagger:.15});
  // the whole sentence at once
  const gone=[oh.box,x,eq,R.box,ohl,s1,s3,h];
  tl.to(gone,{autoAlpha:0,duration:.5},cue(sid,'do')-.7);
  tl.to(E.cells.flat(),{opacity:1,duration:.4},cue(sid,'do'));
  const ids=[0,2,3],words=['the','cat','sat'];
  const ch=words.map((w,i)=>tok(S,`${w} <span style="color:#f5cf4a">${ids[i]}</span>`,360,300+i*90,{fs:36,color:C.ink,border:C.blue}));
  show(ch,cue(sid,'sentence'),.4,{stagger:.1});
  const T=matrix(S,1520,380,3,4,{cw:90,ch:56,vals:ids.map(i=>EV[i]),fs:26,color:C.pink});
  T.cells.flat().forEach(c=>c.setAttribute('data-layout-allow-overlap',''));
  const hs=ids.map((r,k)=>{const hh=matHL(S,E,r,0,r,3,C.pink);fadeIn(hh,cue(sid,'rows')+k*.25,.3);return hh});
  fadeIn(T.box,cue(sid,'stack'),.3);
  T.cells.forEach((row,k)=>{const dy=(E.y0+ids[k]*56)-(T.y0+k*56),dx=E.x0-T.x0;
    tl.fromTo(row,{x:dx,y:dy},{x:0,y:0,duration:1,ease:'power2.inOut',immediateRender:false},cue(sid,'stack')+k*.2)});
  const tdl=label(S,'(T × d) &nbsp;=&nbsp; (3 × 4)',1520,620,{fs:36,mono:true,color:C.pink});show(tdl,cue(sid,'matrix',2),.5);
  fadeOut(hs,cue(sid,'per'),.4);
  const Tl=label(S,'T: one row per token',1520,720,{fs:32,italic:true,color:C.ink}),dl=label(S,'d: one column per embedding dimension',1520,780,{fs:32,italic:true,color:C.ink});
  show(Tl,cue(sid,'token',2),.4);show(dl,cue(sid,'column'),.4);
  const kt=el(S,'cap','keep track of <em>T</em> and <em>d</em>: every lesson from here uses them',{top:'880px',fontSize:'40px',fontStyle:'italic'});show(kt,cue(sid,'keeping'),.6);
  sceneInOut(sid);
})();

/* ============ S3: random rows become meaningful directions ============ */
(function(){const S=$('S3');const sid='s3';
  const O=[760,620];const svg=layerSvg(S);
  svgEl('line',{x1:O[0]-420,y1:O[1],x2:O[0]+420,y2:O[1],stroke:C.grid,'stroke-width':2},svg);
  svgEl('line',{x1:O[0],y1:O[1]-420,x2:O[0],y2:O[1]+360,stroke:C.grid,'stroke-width':2},svg);
  svgEl('circle',{cx:O[0],cy:O[1],r:7,fill:C.ink},svg);
  const W=[['cat',C.blue,40,300],['kitten',C.blue,52,250],['dog',C.blue,64,320],['car',C.yellow,150,300],['truck',C.yellow,165,340],['apple',C.green,250,280],['banana',C.green,268,300]];
  const rnd=seedRand(4);
  const arr=W.map(([w,col,deg,len],k)=>{const r0=[200,300,110,345,250,160,70][k]*Math.PI/180,r1=deg*Math.PI/180,l0=150+rnd()*120;
    const a=mkArrow(svg,PX,col,5,`<span style="font-size:36px;font-style:italic">${w}</span>`,0,0,S);
    const tip=(r,l)=>({x1:O[0]+l*Math.cos(r),y1:O[1]-l*Math.sin(r)});
    a.lx=Math.cos(r0)*60;a.ly=-Math.sin(r0)*40;
    setArrow(a,{x0:O[0],y0:O[1],...tip(r0,l0)});showArrow(a,at(sid,.03)+k*.08,.4);
    const p={k:0};tl.to(p,{k:1,duration:2.2,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{const r=r0+(r1-r0+((r1-r0)>Math.PI?-2*Math.PI:(r1-r0)<-Math.PI?2*Math.PI:0))*p.k,l=l0+(len-l0)*p.k;a.lx=Math.cos(r)*70;a.ly=-Math.sin(r)*46;geom(a,O[0],O[1],O[0]+l*Math.cos(r),O[1]-l*Math.sin(r))}},cue(sid,'training')+k*.12);
    return a});
  const rn=label(S,'random at first',1500,250,{fs:40,italic:true,color:C.dim});show(rn,cue(sid,'random'),.5);fadeOut(rn,cue(sid,'training'),.4);
  const n1=note(S,'similar company &nbsp;→&nbsp; similar predictions &nbsp;→&nbsp; similar rows',1260,300,560,{fs:40});show(n1,cue(sid,'company'),.6);
  const n2=note(S,'meaning is not written in by hand: it settles into the geometry',1260,560,560,{fs:40,color:C.blue});show(n2,cue(sid,'meaning'),.6);
  sceneInOut(sid);
})();

/* ============ S4: cosine similarity ============ */
(function(){const S=$('S4');const sid='s4';
  const O=[560,700];const svg=layerSvg(S);
  svgEl('circle',{cx:O[0],cy:O[1],r:7,fill:C.ink},svg);
  const mk=(w,col,deg,len,lx,ly)=>{const a=mkArrow(svg,PX,col,6,`<span style="font-size:38px;font-style:italic">${w}</span>`,lx,ly,S);const r=deg*Math.PI/180;setArrow(a,{x0:O[0],y0:O[1],x1:O[0],y1:O[1]});return {a,r,len}};
  const cat=mk('cat',C.blue,28,420,60,10),kit=mk('kitten',C.blue,40,330,-20,-40),car=mk('car',C.yellow,118,360,-40,-30);
  const tipOf=(o,l)=>[O[0]+(l||o.len)*Math.cos(o.r),O[1]-(l||o.len)*Math.sin(o.r)];
  grow(cat.a,at(sid,.02),.8,...tipOf(cat));grow(kit.a,at(sid,.05),.8,...tipOf(kit));
  // angle arc between cat and kitten
  const R=150,arc=svgEl('path',{d:`M${O[0]+R*Math.cos(cat.r)},${O[1]-R*Math.sin(cat.r)} A${R},${R} 0 0 0 ${O[0]+R*Math.cos(kit.r)},${O[1]-R*Math.sin(kit.r)}`,fill:'none',stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(arc,cue(sid,'angle'),.4);
  const th=label(S,'θ',O[0]+190*Math.cos(.59),O[1]-190*Math.sin(.59),{fs:38,color:C.ink});show(th,cue(sid,'angle'),.4);
  const f=el(S,'abs hid',tex('\\cos\\theta=\\dfrac{a\\cdot b}{\\lVert a\\rVert\\,\\lVert b\\rVert}',64),{left:'1150px',top:'200px'});
  show(f,cue(sid,'cosine'),.6);
  const hd=el(S,'hl','',{left:'1150px',top:'198px',width:'560px',height:'150px',borderColor:C.yellow});
  const s1=label(S,'cat · kitten &nbsp;≈&nbsp; <span style="color:#f5cf4a">0.98</span>',1420,500,{fs:40,mono:true}),s2=label(S,'cat · car &nbsp;≈&nbsp; <span style="color:#f5cf4a">0.09</span>',1420,590,{fs:40,mono:true});
  show(s1,cue(sid,'one'),.5);
  grow(car.a,cue(sid,'unrelated'),.8,...tipOf(car));show(s2,cue(sid,'zero'),.5);
  const kp={l:kit.len};tl.to(kp,{l:190,duration:1.2,ease:'power2.inOut',yoyo:true,repeat:1,immediateRender:false,onUpdate:()=>geom(kit.a,O[0],O[1],...tipOf(kit,kp.l))},cue(sid,'length'));
  const ln=label(S,'length drops out, only direction counts',1420,700,{fs:34,italic:true,color:C.dim});show(ln,cue(sid,'drops'),.5);
  sceneInOut(sid);
})();

/* ============ S5: directions carry relationships ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const P={man:[520,760],woman:[700,500],king:[1080,780],queen:[1250,530]};
  const dots=Object.entries(P).map(([w,[x,y]])=>{const d=svgEl('circle',{cx:x,cy:y,r:10,fill:w==='man'||w==='woman'?C.green:C.yellow,style:'opacity:0;visibility:hidden'},svg);
    const l=label(S,w,x+(w==='woman'||w==='queen'?-20:0),y+(w==='woman'||w==='queen'?-48:48),{fs:40,italic:true});return [d,l]});
  show(dots.map(d=>d[1]).slice(0,2),cue(sid,'man'),.4);fadeIn(dots.map(d=>d[0]).slice(0,2),cue(sid,'man'),.4);
  show(dots.map(d=>d[1]).slice(2),cue(sid,'king')-.2,.4);fadeIn(dots.map(d=>d[0]).slice(2),cue(sid,'king')-.2,.4);
  const a1=mkArrow(svg,PX,C.pink,6);setArrow(a1,{x0:P.man[0],y0:P.man[1],x1:P.man[0],y1:P.man[1]});
  grow(a1,cue(sid,'woman'),.8,P.woman[0]-8,P.woman[1]+14);
  const a2=mkArrow(svg,PX,C.pink,6);setArrow(a2,{x0:P.king[0],y0:P.king[1],x1:P.king[0],y1:P.king[1]});
  grow(a2,cue(sid,'queen'),.8,P.queen[0]-8,P.queen[1]+14);
  // ghost copy of man->woman moved onto king
  const g=mkArrow(svg,PX,C.ink,3);setArrow(g,{x0:P.man[0],y0:P.man[1],x1:P.woman[0]-8,y1:P.woman[1]+14});
  showArrow(g,cue(sid,'difference'),.3);
  const dx=P.king[0]-P.man[0],dy=P.king[1]-P.man[1];
  arrowTo(g,cue(sid,'difference')+.3,1.4,{x0:P.king[0],y0:P.king[1],x1:P.woman[0]-8+dx,y1:P.woman[1]+14+dy});
  const f=el(S,'abs hid',tex('\\text{king}-\\text{man}+\\text{woman}\\;\\approx\\;\\text{queen}',54),{left:'420px',top:'190px'});
  show(f,cue(sid,'reusable'),.6);
  const r=label(S,'roughly, not exactly',1530,420,{fs:36,italic:true,color:C.dim});show(r,cue(sid,'rougher'),.5);
  const src=label(S,'word2vec, Mikolov et al. 2013',1530,900,{fs:28,italic:true,color:C.dim});show(src,cue(sid,'word',2),.5);
  sceneInOut(sid);
})();

/* ============ S6: the first layer of an LLM ============ */
(function(){const S=$('S6');const sid='s6';
  const boxes=[['token IDs',330,C.yellow],['embedding table',860,C.blue],['the rest of the model',1450,C.dim]];
  const bx=boxes.map(([t,x,c])=>tok(S,t,x,300,{fs:40,color:C.ink,border:c}));
  const svg=layerSvg(S);
  const ar=[[470,668],[1048,1182]].map(([a,b])=>{const m=mkArrow(svg,PX,C.dim,4);setArrow(m,{x0:a,y0:300,x1:a,y1:300});return [m,b]});
  show(bx[0],at(sid,.02),.5);show(bx[1],cue(sid,'embedding'),.5);grow(ar[0][0],cue(sid,'embedding'),.5,ar[0][1],300);
  show(bx[2],cue(sid,'everything'),.5);grow(ar[1][0],cue(sid,'everything'),.5,ar[1][1],300);
  const fl=label(S,'the first layer, learned like any other weights',860,380,{fs:30,italic:true,color:C.blue});show(fl,cue(sid,'learned'),.5);
  const rnd=seedRand(8);const H=[];for(let r=0;r<6;r++){const row=[];for(let c=0;c<18;c++)row.push(rnd());H.push(row)}
  const M=matrix(S,960,640,6,18,{cw:44,ch:44,heat:H,color:C.blue});
  show(M.box,cue(sid,'each'),.7);
  const tl1=label(S,'T rows, one per position',960-M.W/2-200,640,{fs:30,italic:true,color:C.ink}),dl=label(S,'d columns, far more than we can draw',960,640+M.H/2+40,{fs:30,italic:true,color:C.ink});
  tl1.style.whiteSpace='normal';tl1.style.width='300px';tl1.style.textAlign='center';
  show(tl1,cue(sid,'position'),.5);show(dl,cue(sid,'longer'),.5);
  nextCap(S,'next &nbsp;·&nbsp; 9.3 &nbsp;RNNs and why they struggled',cue(sid,'next'));
  lastScene(sid);
})();


tl.to({},{duration:.01},TIMING.total-.01);
