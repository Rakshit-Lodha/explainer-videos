.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}

.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}

.mat{position:absolute}
.mc{position:absolute;text-align:center;border:1px solid;font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--ink)}
.bar{position:absolute;border-radius:6px 6px 0 0}

  const cells=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<K;c++){
    const v=o.vals?o.vals[r][c]:'';const bg=o.heat?heat(o.heat[r][c],o.color):(o.fill||hexA(o.color||C.blue,.12));
    row.push(el(box,'mc',v,{left:c*cw+'px',top:r*ch+'px',width:cw+'px',height:ch+'px',lineHeight:ch+'px',fontSize:(o.fs||Math.round(Math.min(cw,ch)*.4))+'px',background:bg,borderColor:o.line||'rgba(201,211,224,0.28)'}))}cells.push(row)}
  return {box,cells,cx,cy,W,H,cw,ch,x0:cx-W/2,y0:cy-H/2,R,K}}
/* highlight box around a block of matrix cells */
function matHL(parent,m,r0,c0,r1,c1,color){return el(parent,'hl','',{left:(m.x0+c0*m.cw-5)+'px',top:(m.y0+r0*m.ch-5)+'px',width:((c1-c0+1)*m.cw+10)+'px',height:((r1-r0+1)*m.ch+10)+'px',borderColor:color,boxShadow:`0 0 20px ${color}66`})}
/* quadratic curve with optional arrow head, drawn on with a dash offset */
function curve(svg,x0,y0,x1,y1,o){o=o||{};const b=o.bend==null?-60:o.bend,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;
  const qx=(x0+x1)/2-dy/L*b,qy=(y0+y1)/2+dx/L*b;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const p=svgEl('path',{d:`M${x0},${y0} Q${qx},${qy} ${x1},${y1}`,fill:'none',stroke:o.color||C.blue,'stroke-width':o.w||4,'stroke-linecap':'round','stroke-opacity':o.op==null?1:o.op},g);
  const len=Math.max(1,p.getTotalLength());p.setAttribute('stroke-dasharray',len);p.setAttribute('stroke-dashoffset',len);
  let head=null;if(o.head!==false){const tx=x1-qx,ty=y1-qy,tL=Math.hypot(tx,ty)||1,ux=tx/tL,uy=ty/tL,hl=o.hl||18,hw=hl*.55,bx=x1-ux*hl,by=y1-uy*hl;
    head=svgEl('polygon',{points:`${x1},${y1} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`,fill:o.color||C.blue,'fill-opacity':o.op==null?1:o.op,opacity:0},g)}
  return {g,p,len,head}}
function drawCurve(c,time,d){tl.to(c.g,{autoAlpha:1,duration:.15},time);tl.to(c.p,{attr:{'stroke-dashoffset':0},duration:d||.8,ease:'power2.out'},time);if(c.head)tl.to(c.head,{opacity:1,duration:.2},time+(d||.8)*.8)}
/* vertical bars (values 0..1) with a baseline at yBase; setBars tweens to new values */
function bars(parent,x0,yBase,vals,o){o=o||{};const bw=o.bw||60,gap=o.gap||22,Hm=o.h||300;
  const B={bw,gap,Hm,v:vals.slice(),items:[]};
  vals.forEach((v,i)=>{const x=x0+i*(bw+gap);
    const b=el(parent,'bar hid','',{left:x+'px',top:(yBase-Hm)+'px',width:bw+'px',height:Hm+'px',background:(o.colors?o.colors[i]:o.color)||C.blue,transformOrigin:'50% 100%'});
    gsap.set(b,{scaleY:Math.max(.002,v)});
    let t=null;if(o.values!==false){t=el(parent,'lbl mono',fmt(v,2),{color:C.ink,fontSize:(o.vfs||24)+'px'});place(t,x+bw/2,yBase-18);gsap.set(t,{y:-Hm*v})}
    let lb=null;if(o.labels){lb=el(parent,'lbl mono',o.labels[i],{color:o.lcol||C.ink,fontSize:(o.lfs||30)+'px'});place(lb,x+bw/2,yBase+30)}
    B.items.push({b,t,lb})});
  return B}
function barEls(B){const a=[];B.items.forEach(it=>{a.push(it.b);if(it.t)a.push(it.t);if(it.lb)a.push(it.lb)});return a}
function setBars(B,time,d,vals){const from=B.v.slice(),p={k:0};
  tl.to(p,{k:1,duration:d,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{B.items.forEach((it,i)=>{const v=from[i]+(vals[i]-from[i])*p.k;
    gsap.set(it.b,{scaleY:Math.max(.002,v)});if(it.t){gsap.set(it.t,{y:-B.Hm*v});it.t.textContent=fmt(v,2)}})}},time);B.v=vals.slice()}
function softmaxJS(xs,T){T=T||1;const m=Math.max(...xs);const e=xs.map(x=>Math.exp((x-m)/T));const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
/* type out the characters of an element's text, one span per character */
function typeIn(d,time,per){const s=d.textContent;d.innerHTML=s.split('').map(ch=>`<span class="ch" style="opacity:0;visibility:hidden">${ch===' '?'&nbsp;':ch}</span>`).join('');
  tl.to(d.querySelectorAll('.ch'),{autoAlpha:1,duration:.04,stagger:per||.05,ease:'none'},time)}
function nextCap(S,html,time){const n=el(S,'cap',html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(n,time,.7);return n}

const WORDS=['the','cat','sat','on','the','mat'];

/* ============ S1: read one token at a time, keep an index card ============ */
(function(){const S=$('S1');const sid='s1';
  const xs=WORDS.map((w,i)=>360+i*240);
  const ch=WORDS.map((w,i)=>tok(S,w,xs[i],260,{fs:46,color:C.ink,border:C.blue}));
  show(ch,at(sid,.01),.4,{stagger:.08});
  const ord=label(S,'order carries meaning',960,360,{fs:36,italic:true,color:C.dim});show(ord,cue(sid,'order'),.5);fadeOut(ord,cue(sid,'recurrent'),.4);
  const rnn=label(S,'recurrent neural network',960,150,{fs:46,italic:true,color:C.blue});show(rnn,cue(sid,'recurrent'),.6);
  const rd=el(S,'hl','',{left:(xs[0]-80)+'px',top:'215px',width:'160px',height:'90px',borderColor:C.yellow,boxShadow:`0 0 24px ${C.yellow}66`});
  const rnd=seedRand(12);const vals=WORDS.map(()=>[0,1,2,3,4,5].map(()=>rnd()));
  const card=matrix(S,960,640,1,6,{cw:90,ch:90,heat:[[0,0,0,0,0,0]],color:C.yellow});
  const cl=label(S,'hidden state &nbsp;h',960,735,{fs:40,italic:true,color:C.yellow});
  show(card.box,cue(sid,'memory'),.5);show(cl,cue(sid,'hidden'),.5);
  const svg=layerSvg(S);const a=mkArrow(svg,PX,C.yellow,4);setArrow(a,{x0:xs[0],y0:310,x1:xs[0],y1:310});
  const t0=cue(sid,'reads');fadeIn(rd,t0,.3);grow(a,t0,.5,960,585);
  for(let k=0;k<6;k++){const tk=t0+k*1.6;
    if(k>0){tl.to(rd,{x:xs[k]-xs[0],duration:.5,ease:'power2.inOut'},tk);arrowTo(a,tk,.5,{x0:xs[k],x1:960,y1:585})}
    card.cells[0].forEach((c,j)=>tl.to(c,{backgroundColor:heat(vals[k][j],C.yellow),duration:.4},tk+.4))}
  const ic=label(S,'a running summary on one index card, rewritten after every word',960,840,{fs:38,italic:true,color:C.ink});show(ic,cue(sid,'running'),.6);
  sceneInOut(sid);
})();

/* ============ S2: the update rule ============ */
(function(){const S=$('S2');const sid='s2';
  const row=el(S,'abs','',{left:'0',top:'150px',width:'1920px',display:'flex',justifyContent:'center',alignItems:'center',gap:'18px'});
  const parts=[['h_t\\;=',C.ink,'new'],['\\tanh\\big(',C.pink,'tanh'],['W_h\\,h_{t-1}',C.blue,'old'],['+\\;W_x\\,x_t',C.yellow,'current'],['+\\;b',C.green,'bias'],['\\big)',C.pink,'tanh']];
  parts.forEach(([s,col,w])=>{const d=el(row,'hid',tex(`\\textcolor{${col}}{${s}}`,64),{});show(d,cue(sid,w),.5)});
  // cell diagram
  const svg=layerSvg(S);
  const box=el(S,'tok hid','cell',{color:C.ink,borderColor:C.pink,fontSize:'44px',width:'220px',height:'150px',lineHeight:'136px',textAlign:'center'});place(box,820,600);
  show(box,cue(sid,'mixes'),.5);
  const ain=mkArrow(svg,PX,C.blue,5,tex('h_{t-1}',44),-40,-40,S);setArrow(ain,{x0:420,y0:600,x1:420,y1:600});grow(ain,cue(sid,'old'),.6,700,600);
  const ax=mkArrow(svg,PX,C.yellow,5,tex('x_t',44),50,50,S);setArrow(ax,{x0:820,y0:880,x1:820,y1:880});grow(ax,cue(sid,'current'),.6,820,685);
  ax.ly=180;ax.lx=50;
  const aout=mkArrow(svg,PX,C.pink,5,tex('h_t',44),0,-40,S);setArrow(aout,{x0:940,y0:600,x1:940,y1:600});grow(aout,cue(sid,'result'),.6,1140,600);
  // tanh inset
  const ox=1500,oy=600,sx=55,sy=110;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('line',{x1:ox-220,y1:oy,x2:ox+220,y2:oy,stroke:C.axis,'stroke-width':2},g);svgEl('line',{x1:ox,y1:oy-150,x2:ox,y2:oy+150,stroke:C.axis,'stroke-width':2},g);
  [-1,1].forEach(v=>svgEl('line',{x1:ox-220,y1:oy-v*sy,x2:ox+220,y2:oy-v*sy,stroke:C.dim,'stroke-width':2,'stroke-dasharray':'8 8'},g));
  let d='';for(let i=0;i<=80;i++){const x=-4+8*i/80;d+=(i?'L':'M')+(ox+x*sx).toFixed(1)+','+(oy-Math.tanh(x)*sy).toFixed(1)}
  svgEl('path',{d,fill:'none',stroke:C.pink,'stroke-width':5},g);
  fadeIn(g,cue(sid,'function'),.5);
  const l1=label(S,'+1',ox+250,oy-sy,{fs:28,mono:true,color:C.dim}),l2=label(S,'−1',ox-250,oy+sy,{fs:28,mono:true,color:C.dim});
  show([l1,l2],cue(sid,'minus'),.4);
  const tl2=label(S,'tanh squashes into (−1, 1)',ox,oy+200,{fs:32,italic:true,color:C.pink});show(tl2,cue(sid,'squashes'),.5);
  const same=el(S,'cap','the <em>same</em> weights at every step, so any length works',{top:'930px',fontSize:'44px',fontStyle:'italic'});show(same,cue(sid,'same'),.6);
  sceneInOut(sid);
})();

/* ============ S3: unrolled chain and backprop through time ============ */
(function(){const S=$('S3');const sid='s3';
  const N=5,xs=[...Array(N)].map((_,i)=>360+i*300),y=540;const svg=layerSvg(S);
  const cells=xs.map(x=>{const b=el(S,'tok hid','',{borderColor:C.pink,width:'150px',height:'110px'});place(b,x,y);return b});
  show(cells,cue(sid,'unroll'),.5,{stagger:.15});
  const ins=xs.map((x,i)=>{const t=tok(S,WORDS[i],x,800,{fs:36,color:C.ink,border:C.blue});const a=mkArrow(svg,PX,C.yellow,4);setArrow(a,{x0:x,y0:760,x1:x,y1:760});return [t,a]});
  ins.forEach(([t,a],i)=>{show(t,cue(sid,'draw')+i*.12,.4);grow(a,cue(sid,'draw')+.2+i*.12,.4,x0(i),600)});
  function x0(i){return xs[i]}
  const hs=xs.slice(0,-1).map((x,i)=>{const a=mkArrow(svg,PX,C.blue,5);setArrow(a,{x0:x+75,y0:520,x1:x+75,y1:520});grow(a,cue(sid,'handing')+i*.15,.4,xs[i+1]-80,520);return a});
  const sw=label(S,'identical cells: the same weights',960,420,{fs:36,italic:true,color:C.pink});show(sw,cue(sid,'identical'),.5);fadeOut(sw,cue(sid,'read')-.3,.3);
  const outs=xs.map((x,i)=>{const a=mkArrow(svg,PX,C.green,4);setArrow(a,{x0:x,y0:485,x1:x,y1:485});grow(a,cue(sid,'read')+i*.12,.4,x,380);
    const l=label(S,WORDS[i+1]||'?',x,345,{fs:32,mono:true,color:C.green});show(l,cue(sid,'predict')+i*.12,.4);return l});
  const pr=label(S,'predict the next token',960,270,{fs:34,italic:true,color:C.green});show(pr,cue(sid,'following'),.5);
  // gradient flows backwards
  const back=xs.slice(1).map((x,i)=>{const a=mkArrow(svg,PX,C.red,5);setArrow(a,{x0:x-80,y0:575,x1:x-80,y1:575});return a}).reverse();
  back.forEach((a,k)=>{const from=a.st.x0;grow(a,cue(sid,'backwards')+k*.45,.4,from-140,575)});
  const bp=label(S,'backpropagation through time',960,940,{fs:40,italic:true,color:C.red});show(bp,cue(sid,'backpropagation'),.5);
  sceneInOut(sid);
})();

/* ============ S4: vanishing and exploding gradients ============ */
(function(){const S=$('S4');const sid='s4';
  const N=10,lab=[...Array(N)].map((_,k)=>k===N-1?'t':`t−${N-1-k}`);
  const fade=[...Array(N)].map((_,k)=>Math.pow(.62,N-1-k));
  const boom=[...Array(N)].map((_,k)=>Math.min(1,.07*Math.pow(1.38,N-1-k)));
  const B=bars(S,230,840,[...Array(N)].map(()=>1),{bw:70,gap:40,h:440,color:C.red,labels:lab,values:false,lfs:26,lcol:C.dim});
  tl.to(barEls(B),{autoAlpha:1,duration:.4,stagger:.03},cue(sid,'journey'));
  const gl=label(S,'size of the error signal reaching each earlier step',780,330,{fs:34,italic:true,color:C.dim});show(gl,cue(sid,'journey'),.5);
  const f=el(S,'abs hid',tex('\\text{each step back:}\\;\\times\\,\\big(W_h\\cdot\\tanh\\text{ slope}\\big)',48),{left:'240px',top:'170px'});show(f,cue(sid,'multiplies'),.6);
  setBars(B,cue(sid,'fades'),2.2,fade);
  const vl=label(S,'vanishing',780,950,{fs:40,italic:true,color:C.blue});show(vl,cue(sid,'fades'),.5);
  // photocopies
  const cards=[0,1,2,3,4].map(i=>{const c=el(S,'tok hid','the cat sat',{fontSize:'34px',color:C.ink,borderColor:C.ink,background:'#1a2029',width:'280px',height:'110px',lineHeight:'96px',textAlign:'center'});place(c,1560+i*28,330+i*95);c.setAttribute('data-layout-allow-overlap','');return c});
  cards.forEach((c,i)=>tl.to(c,{autoAlpha:Math.pow(.55,i),duration:.4},cue(sid,'photocopy')+i*.35));
  const pc=label(S,'a copy of a copy',1620,860,{fs:34,italic:true,color:C.dim});show(pc,cue(sid,'photocopy',2),.5);
  fadeOut([...cards,pc],cue(sid,'explodes')-.3,.4);
  tl.to(vl,{autoAlpha:0,duration:.3},cue(sid,'above'));
  setBars(B,cue(sid,'explodes'),1.8,boom);
  const ex=label(S,'exploding',780,950,{fs:40,italic:true,color:C.red});show(ex,cue(sid,'explodes'),.5);
  const hard=label(S,'hard to learn that a far-back word mattered',1560,560,{fs:34,italic:true,color:C.ink});hard.style.whiteSpace='normal';hard.style.width='520px';hard.style.textAlign='center';
  show(hard,cue(sid,'either'),.5);
  sceneInOut(sid);
})();

/* ============ S5: gates help; two deeper limits ============ */
(function(){const S=$('S5');const sid='s5';
  const N=6,xs=[...Array(N)].map((_,i)=>340+i*248),y=560;const svg=layerSvg(S);
  const cells=xs.map(x=>{const b=el(S,'tok hid','',{borderColor:C.pink,width:'130px',height:'100px'});place(b,x,y);return b});
  show(cells,at(sid,.01),.5,{stagger:.06});
  const hs=xs.slice(0,-1).map((x,i)=>{const a=mkArrow(svg,PX,C.blue,4);setArrow(a,{x0:x+66,y0:y,x1:xs[i+1]-70,y1:y});return a});
  tl.to(hs.map(a=>a.g),{autoAlpha:1,duration:.4},at(sid,.02));
  const names=label(S,'LSTM (1997) &nbsp;·&nbsp; GRU (2014)',960,170,{fs:42,italic:true,color:C.teal});show(names,cue(sid,'long'),.5);
  const belt=mkArrow(svg,PX,C.teal,10);setArrow(belt,{x0:240,y0:410,x1:240,y1:410});grow(belt,cue(sid,'protected'),1.6,1700,410);
  const gates=xs.map(x=>{const g=svgEl('line',{x1:x,y1:418,x2:x,y2:508,stroke:C.teal,'stroke-width':3,'stroke-dasharray':'6 6',style:'opacity:0;visibility:hidden'},svg);return g});
  fadeIn(gates,cue(sid,'path'),.4,.08);
  const bl=label(S,'a protected path: information rides along with little change',960,340,{fs:34,italic:true,color:C.teal});show(bl,cue(sid,'conveyor'),.5);
  const std=label(S,'the standard for translation for several years',960,700,{fs:34,italic:true,color:C.dim});show(std,cue(sid,'standard'),.5);
  fadeOut([belt.g,...gates,bl,std,names],cue(sid,'two')-.2,.5);
  // limit 1: sequential
  const t1=label(S,'1 &nbsp; each step waits for the previous one',960,250,{fs:40,color:C.yellow});show(t1,cue(sid,'each'),.5);
  cells.forEach((c,i)=>{tl.to(c,{borderColor:C.yellow,boxShadow:`0 0 24px ${C.yellow}88`,duration:.2},cue(sid,'wait')+i*.45);tl.to(c,{borderColor:C.pink,boxShadow:'0 0 0px #000',duration:.3},cue(sid,'wait')+i*.45+.45)});
  const np=label(S,'no parallel training across the sequence',960,700,{fs:34,italic:true,color:C.dim});show(np,cue(sid,'parallel'),.5);
  // limit 2: bottleneck
  tl.to(np,{autoAlpha:0,duration:.3},cue(sid,'and',3)-.2);
  const t2=label(S,'2 &nbsp; the whole past squeezes through one fixed-size vector',960,330,{fs:40,color:C.pink});show(t2,cue(sid,'everything'),.5);
  const last=xs[N-1];
  const cs=xs.slice(0,-1).map((x,i)=>curve(svg,x,620,last-20,620,{color:C.pink,bend:(50+(N-1-i)*30),w:3,op:.8,hl:14}));
  cs.forEach((c,i)=>drawCurve(c,cue(sid,'squeeze')+i*.12,.8));
  const hb=matrix(S,last,820,1,3,{cw:60,ch:60,heat:[[.6,.3,.8]],color:C.pink});show(hb.box,cue(sid,'vector'),.5);
  sceneInOut(sid);
})();

/* ============ S6: attention as an add-on, then the transformer ============ */
(function(){const S=$('S6');const sid='s6';
  const xs=WORDS.map((w,i)=>360+i*240),y=640;const svg=layerSvg(S);
  const ch=WORDS.map((w,i)=>tok(S,w,xs[i],y,{fs:44,color:C.ink,border:C.blue}));show(ch,at(sid,.01),.4,{stagger:.06});
  const hs=xs.slice(0,-1).map((x,i)=>{const a=mkArrow(svg,PX,C.dim,4);setArrow(a,{x0:x+60,y0:y,x1:xs[i+1]-60,y1:y});return a});
  tl.to(hs.map(a=>a.g),{autoAlpha:1,duration:.4},at(sid,.02));
  const w=[.15,.55,.3,.08,.2];
  const arcs=xs.slice(0,-1).map((x,i)=>curve(svg,xs[5],y-40,x,y-40,{color:C.yellow,bend:(70+(5-i)*35),w:2+10*w[i],op:.35+.6*w[i],hl:16}));
  arcs.forEach((c,i)=>drawCurve(c,cue(sid,'look')+(4-i)*.15,.8));
  const at1=label(S,'attention: look back at every earlier position',960,250,{fs:42,italic:true,color:C.yellow});show(at1,cue(sid,'attention'),.5);
  const yr=label(S,'first added to recurrent translators (2014)',960,320,{fs:30,italic:true,color:C.dim});show(yr,cue(sid,'attention')+.6,.5);
  tl.to(hs.map(a=>a.g),{autoAlpha:0,duration:.8},cue(sid,'recurrence'));
  const tf=label(S,'keep only attention: the transformer (2017)',960,820,{fs:42,italic:true,color:C.blue});show(tf,cue(sid,'transformer'),.6);
  nextCap(S,'next &nbsp;·&nbsp; 9.4 &nbsp;Attention: which words should look at which',cue(sid,'next'));
  lastScene(sid);
})();


tl.to({},{duration:.01},TIMING.total-.01);
