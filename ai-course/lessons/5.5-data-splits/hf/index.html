    for(let y=Math.ceil(y0);y<=y1;y+=(o.step||1)){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}}
  const ya=o.yAxisAt??y0,xa=o.xAxisAt??x0;const a=P(x0,ya),b=P(x1,ya),c=P(xa,y0),d=P(xa,y1);
  svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);
  tl.to(p,{autoAlpha:1,duration:.15},time);tl.to(p,{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut'},time)}
/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */
function morphFn(p,P,f,a,b,s0,n){const o={s:s0};const upd=()=>p.setAttribute('d',fnPath(P,x=>f(x,o.s),a,b,n));upd();
  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */
function texLbl(parent,s,x,y,size,color){const d=el(parent,'lbl',tex(s,size||56),{color:color||C.ink});place(d,x,y);return d}
function txt(parent,s,x,y,o){o=o||{};const d=el(parent,'lbl',s,Object.assign({color:C.ink,fontSize:'40px'},o));place(d,x,y);return d}
/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});
  const rows=lines.map(l=>el(b,'',l,{position:'relative'}));return {box:b,rows}}
const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;
function sceneIn(sid){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid])}

const root=$('root');
const N=40,SZ=34,GP=8,X0=960-(N*SZ+(N-1)*GP)/2;
const sx=i=>X0+i*(SZ+GP);
function row(S,y,colorOf){const svg=layerSvg(S);const sq=[];for(let i=0;i<N;i++)sq.push(svgEl('rect',{x:sx(i),y:y,width:SZ,height:SZ,rx:6,fill:colorOf(i)},svg));return {svg,sq}}
function envelope(svg,x,y,col){const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('rect',{x:x-60,y:y-40,width:120,height:80,rx:8,fill:'#141a22',stroke:col,'stroke-width':4},g);
  const flap=svgEl('polyline',{points:`${x-60},${y-40} ${x},${y+5} ${x+60},${y-40}`,fill:'none',stroke:col,'stroke-width':4},g);
  const seal=svgEl('circle',{cx:x,cy:y+5,r:11,fill:C.red},g);return {g,flap,seal}}

/* ===== S1: grading your own exam ===== */
(function(){const S=$('S1'),sid='s1';
  const R=row(S,520,i=>C.blue);
  tl.fromTo(R.svg,{autoAlpha:0},{autoAlpha:1,duration:.6,immediateRender:false},at(sid,.02));
  const svg=layerSvg(S);
  const a1=mkArrow(svg,(x,y)=>[x,y],C.ink,5,'<span style="font-size:40px;font-style:italic">learn from</span>',0,-150,S);
  const a2=mkArrow(svg,(x,y)=>[x,y],C.red,5,'<span style="font-size:40px;font-style:italic">judge on</span>',0,175,S);
  setArrow(a1,{x0:760,y0:400,x1:760,y1:400});setArrow(a2,{x0:1180,y0:700,x1:1180,y1:700});
  showArrow(a1,cue(sid,'studied'),.2);arrowTo(a1,cue(sid,'studied'),.7,{y1:505});
  showArrow(a2,cue(sid,'graded'),.2);arrowTo(a2,cue(sid,'graded'),.7,{y1:568});
  const p=txt(S,'100% … tells nobody anything',960,860,{color:C.red,fontSize:'44px',fontStyle:'italic'});show(p,cue(sid,'perfect'),.5);
  fadeOut([a1.g,a1.label,a2.g,a2.label,p],cue(sid,'fix'),.5);
  // set some aside
  const k0=32;
  R.sq.forEach((r,i)=>{if(i>=k0){tl.to(r,{attr:{fill:C.pink},duration:.5},cue(sid,'aside'));tl.to(r,{x:60,duration:.8,ease:'power2.inOut'},cue(sid,'aside'))}});
  const held=txt(S,'kept aside: only for judging',sx(36)+60,640,{color:C.pink,fontSize:'38px',fontStyle:'italic'});show(held,cue(sid,'judging'),.5);
  sceneInOut(sid);
})();

/* ===== S2-S3: three parts ===== */
const SPL=el(root,'layer','');SPL.id='SPL';
const tr=24,va=32;// indices: 0..23 train, 24..31 validation, 32..39 test
const segCol=i=>i<tr?C.blue:(i<va?C.yellow:C.pink);
const R2=row(SPL,300,segCol);
const lab=(t,i0,i1,col)=>{const d=txt(SPL,t,(sx(i0)+sx(i1)+SZ)/2,262,{color:col,fontSize:'38px'});return d};
const Ltr=lab('training',0,tr-1,C.blue),Lva=lab('validation',tr,va-1,C.yellow),Lte=lab('test',va,N-1,C.pink);
const esvg=layerSvg(SPL);
const ENV=envelope(esvg,(sx(va)+sx(N-1)+SZ)/2,470,C.pink);
tl.to(SPL,{autoAlpha:1,duration:.6},START.s2);tl.to(SPL,{autoAlpha:0,duration:.5},START.s4-.4);
(function(){const S=$('S2'),sid='s2';
  show(Ltr,cue(sid,'training'),.5);show(Lva,cue(sid,'validation'),.5);show(Lte,cue(sid,'test'),.5);
  const book=txt(S,'the textbook: fit the weights',(sx(0)+sx(tr-1)+SZ)/2,470,{color:C.blue,fontSize:'38px',fontStyle:'italic'});show(book,cue(sid,'textbook'),.5);
  const mock=txt(S,'the mock exam',(sx(tr)+sx(va-1)+SZ)/2,450,{color:C.yellow,fontSize:'38px',fontStyle:'italic'});show(mock,cue(sid,'mock'),.5);
  const ch=['degree?','λ?'].map((t,i)=>{const d=el(S,'chip',t,{left:(sx(tr)+20)+'px',top:(540+i*90)+'px',borderColor:C.yellow,fontSize:'34px'});return d});
  show(ch,cue(sid,'choices'),.5,{stagger:.2});
  fadeIn(ENV.g,cue(sid,'final'),.5);
  const once=txt(S,'opened once, at the end',(sx(va)+sx(N-1)+SZ)/2,580,{color:C.pink,fontSize:'36px',fontStyle:'italic'});show(once,cue(sid,'once'),.5);
  const hon=txt(S,'an honest estimate on new data',960,880,{color:C.ink,fontSize:'44px',fontStyle:'italic'});show(hon,cue(sid,'honest'),.5);
  sceneInOut(sid);
})();
(function(){const S=$('S3'),sid='s3';
  // fifty settings, all equally good in truth; pick the best-looking one
  const rnd=seedRand(21);const sc=[];for(let i=0;i<50;i++){let g=0;for(let k=0;k<6;k++)g+=rnd();sc.push(.8+(g-3)*.035)}
  const best=sc.indexOf(Math.max(...sc));
  const svg=layerSvg(S);const bx=i=>300+i*26,base=930,H=v=>(v-.6)*900;
  svgEl('line',{x1:280,y1:base,x2:bx(49)+30,y2:base,stroke:C.axis,'stroke-width':2},svg);
  const bars=sc.map((v,i)=>svgEl('rect',{x:bx(i),y:base-H(v),width:18,height:H(v),fill:C.yellow,'fill-opacity':.6},svg));
  tl.fromTo(bars,{autoAlpha:0},{autoAlpha:1,duration:.2,stagger:.03,immediateRender:false},cue(sid,'fifty'));
  const win=svgEl('rect',{x:bx(best)-4,y:base-H(sc[best])-4,width:26,height:H(sc[best])+8,fill:'none',stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(win,cue(sid,'winner'),.4);
  const wl=el(S,'lbl mono',`best score ${(sc[best]*100).toFixed(0)}%`,{color:C.ink,fontSize:'32px'});place(wl,bx(best)+10,base-H(sc[best])-40);show(wl,cue(sid,'winner'),.4);
  const tr80=svgEl('line',{x1:280,y1:base-H(.8),x2:bx(49)+30,y2:base-H(.8),stroke:C.teal,'stroke-width':3,'stroke-dasharray':'10 8',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(tr80,cue(sid,'luck'),.5);
  const tl80=txt(S,'dashed line: the true skill of every setting, 80%',960,985,{color:C.teal,fontSize:'32px',fontStyle:'italic'});show(tl80,cue(sid,'luck'),.5);
  const opt=txt(S,'the winner looks better than it is',800,560,{color:C.red,fontSize:'40px',fontStyle:'italic'});show(opt,cue(sid,'optimistic'),.5);
  // the envelope becomes another mock exam
  tl.to(ENV.flap,{attr:{points:`${(sx(va)+sx(N-1)+SZ)/2-60},${430} ${(sx(va)+sx(N-1)+SZ)/2},${380} ${(sx(va)+sx(N-1)+SZ)/2+60},${430}`},duration:.6},cue(sid,'envelope'));
  tl.to(ENV.seal,{autoAlpha:0,duration:.3},cue(sid,'envelope'));
  R2.sq.forEach((r,i)=>{if(i>=va)tl.to(r,{attr:{fill:C.yellow},duration:.6},cue(sid,'mock'))});
  tl.to(Lte,{autoAlpha:0,duration:.3},cue(sid,'mock'));
  const lm=txt(S,'just another mock exam',(sx(va)+sx(N-1)+SZ)/2,262,{color:C.yellow,fontSize:'36px',fontStyle:'italic'});show(lm,cue(sid,'mock')+.2,.4);
  sceneInOut(sid);
})();

/* ===== S4: shuffle before cutting; time is the exception ===== */
(function(){const S=$('S4'),sid='s4';
  const lab=i=>i<24?C.blue:C.pink;// sorted by label
  const R=row(S,330,lab);
  tl.fromTo(R.svg,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},at(sid,.02));
  const sorted=txt(S,'sorted by label',960,280,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(sorted,cue(sid,'sorted'),.4);
  const svg=layerSvg(S);
  const cut=svgEl('line',{x1:sx(32)-GP/2,y1:300,x2:sx(32)-GP/2,y2:400,stroke:C.ink,'stroke-width':4,'stroke-dasharray':'8 6',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(cut,cue(sid,'slicing'),.4);
  const bad=txt(S,'test set: all one kind',(sx(32)+sx(39)+SZ)/2,450,{color:C.red,fontSize:'34px',fontStyle:'italic'});show(bad,cue(sid,'different'),.4);
  // seeded shuffle
  const rnd=seedRand(42);const perm=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  fadeOut(bad,cue(sid,'shuffle')-.2,.3);
  R.sq.forEach((r,i)=>{const to=perm.indexOf(i);tl.to(r,{x:sx(to)-sx(i),duration:1.2,ease:'power2.inOut'},cue(sid,'shuffle')+(i%7)*.03)});
  const seed=el(S,'lbl mono','rng = np.random.default_rng(42)',{color:C.yellow,fontSize:'32px'});place(seed,960,470);show(seed,cue(sid,'seed'),.5);
  const mix=txt(S,'every part gets a fair mix',960,540,{color:C.teal,fontSize:'36px',fontStyle:'italic'});show(mix,cue(sid,'repeated'),.4);
  // time
  const tsvg=layerSvg(S);const tg=svgEl('g',{style:'opacity:0;visibility:hidden'},tsvg);
  const ta=mkArrow(tsvg,(x,y)=>[x,y],C.axis,4);setArrow(ta,{x0:300,y0:760,x1:1640,y1:760});
  svgEl('rect',{x:300,y:700,width:950,height:40,rx:6,fill:C.blue,'fill-opacity':.7},tg);svgEl('rect',{x:1270,y:700,width:340,height:40,rx:6,fill:C.pink,'fill-opacity':.7},tg);
  const tp=txt(S,'past → train',775,810,{color:C.blue,fontSize:'36px',fontStyle:'italic'}),tf=txt(S,'later → test',1440,810,{color:C.pink,fontSize:'36px',fontStyle:'italic'}),tt=txt(S,'time',1700,760,{color:C.dim,fontSize:'34px',fontStyle:'italic'});
  fadeIn(tg,cue(sid,'time'),.5);showArrow(ta,cue(sid,'time'),.5);show(tt,cue(sid,'time'),.4);show(tp,cue(sid,'past'),.4);show(tf,cue(sid,'later'),.4);
  const pk=txt(S,'no peeking at tomorrow',960,900,{color:C.ink,fontSize:'40px',fontStyle:'italic'});show(pk,cue(sid,'tomorrow'),.5);
  sceneInOut(sid);
})();

/* ===== S5: k-fold cross-validation ===== */
(function(){const S=$('S5'),sid='s5';
  const svg=layerSvg(S);const K=5,W=180,H=64,x0=520,y0=280;
  const cells=[];for(let r=0;r<K;r++){const rowc=[];for(let c=0;c<K;c++){rowc.push(svgEl('rect',{x:x0+c*(W+10),y:y0+r*(H+22),width:W,height:H,rx:8,fill:c===r?C.yellow:C.blue,'fill-opacity':c===r?.85:.55,style:'opacity:0;visibility:hidden'},svg))}cells.push(rowc)}
  const tt=txt(S,'five folds',x0+2*(W+10)+W/2,215,{color:C.ink,fontSize:'40px'});show(tt,cue(sid,'folds'),.5);
  fadeIn(cells[0],cue(sid,'folds'),.5);
  const rl=[];const scores=['0.81','0.78','0.84','0.80','0.79'];
  for(let r=0;r<K;r++){const t=r===0?cue(sid,'train'):cue(sid,'rotate')+(r-1)*.8;if(r>0)fadeIn(cells[r],t,.4);
    const s=el(S,'lbl mono',scores[r],{color:C.yellow,fontSize:'38px'});place(s,x0+K*(W+10)+90,y0+r*(H+22)+H/2);show(s,t+.4,.3);rl.push(s)}
  const lt=txt(S,'train',x0-110,y0+H/2,{color:C.blue,fontSize:'34px',fontStyle:'italic'}),lv=txt(S,'validate',x0-110,y0+H/2+40,{color:C.yellow,fontSize:'34px',fontStyle:'italic'});
  show([lt,lv],cue(sid,'train'),.4);
  const avg=el(S,'lbl','',{color:C.ink,fontSize:'46px'});avg.innerHTML='average '+tex('\\approx 0.80',46);place(avg,960,780);show(avg,cue(sid,'average'),.5);
  const both=txt(S,'every example: learned from and judged, never in the same round',960,880,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(both,cue(sid,'never'),.5);
  sceneInOut(sid);
})();

/* ===== S6: preprocessing leak ===== */
(function(){const S=$('S6'),sid='s6';
  const box=(x,y,w,t,col)=>{const d=el(S,'abs hid',t,{left:x+'px',top:y+'px',width:w+'px',padding:'22px 0',textAlign:'center',border:'3px solid '+col,borderRadius:'16px',fontSize:'38px',color:col});return d};
  const wrong=box(260,250,640,'mean, spread of <b>all</b> data',C.red);
  const wx=txt(S,'✗ the test set has shaped training',580,400,{color:C.red,fontSize:'34px',fontStyle:'italic'});
  show(wrong,cue(sid,'whole'),.5);show(wx,cue(sid,'shaped'),.5);
  const fit=box(1020,250,640,'mean, spread of <b>training</b> data',C.teal);show(fit,cue(sid,'alone'),.5);
  const f=texLbl(S,"x' = \\dfrac{x - \\mu_{\\text{train}}}{\\sigma_{\\text{train}}}",1340,470,56,C.teal);show(f,cue(sid,'alone'),.6);
  const svg=layerSvg(S);
  const tgt=[['training',C.blue,1000],['validation',C.yellow,1340],['test',C.pink,1680]].map(([t,c,x])=>{const a=mkArrow(svg,(x,y)=>[x,y],c,5);setArrow(a,{x0:1340,y0:570,x1:1340,y1:570});const l=txt(S,t,x,720,{color:c,fontSize:'38px'});return {a,l,x}});
  tgt.forEach((o,k)=>{showArrow(o.a,cue(sid,'apply')+k*.2,.2);arrowTo(o.a,cue(sid,'apply')+k*.2,.6,{x1:o.x,y1:680});show(o.l,cue(sid,'apply')+k*.2+.3,.4)});
  const same=txt(S,'the very same numbers for all three',1340,800,{color:C.ink,fontSize:'38px',fontStyle:'italic'});show(same,cue(sid,'same'),.5);
  const tm=txt(S,'as if the test data arrived tomorrow',960,930,{color:C.dim,fontSize:'38px',fontStyle:'italic'});show(tm,cue(sid,'tomorrow'),.5);
  sceneInOut(sid);
})();

/* ===== S7: benchmark contamination ===== */
(function(){const S=$('S7'),sid='s7';
  const svg=layerSvg(S);const rnd=seedRand(8);const docs=[];
  for(let r=0;r<5;r++)for(let c=0;c<8;c++){const x=200+c*110,y=230+r*120;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
    svgEl('rect',{x,y,width:84,height:100,rx:6,fill:'#141a22',stroke:C.grid,'stroke-width':2},g);
    for(let k=0;k<5;k++)svgEl('line',{x1:x+12,y1:y+18+k*16,x2:x+12+50*(.5+rnd()*.5),y2:y+18+k*16,stroke:C.dim,'stroke-width':3},g);docs.push(g)}
  tl.to(docs,{autoAlpha:1,duration:.2,stagger:.02},cue(sid,'scrapes'));
  const wl=txt(S,'web scrape → training text',640,190,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(wl,cue(sid,'scrapes'),.4);
  const hit=svgEl('rect',{x:200+5*110-6,y:230+2*120-6,width:96,height:112,rx:8,fill:'none',stroke:C.red,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
  const q=el(S,'abs hid','',{left:'1180px',top:'360px',width:'620px',padding:'24px 30px',borderRadius:'16px',border:'2px solid '+C.pink,background:'#141a22',fontSize:'34px',lineHeight:'1.4'});
  q.innerHTML='<span style="color:#e77fb3">benchmark question 17</span><br><span style="font-style:italic">“If a train leaves at …”</span><br><span class="mono" style="color:#83c167;font-size:30px">answer: 42 km</span>';
  show(q,cue(sid,'benchmark'),.5);fadeIn(hit,cue(sid,'end'),.5);
  const a=mkArrow(svg,(x,y)=>[x,y],C.red,5);setArrow(a,{x0:1170,y0:470,x1:1170,y1:470});showArrow(a,cue(sid,'end'),.2);arrowTo(a,cue(sid,'end'),.7,{x1:200+5*110+100,y1:230+2*120+50});
  const cl=txt(S,'contamination',1490,620,{color:C.red,fontSize:'48px'});show(cl,cue(sid,'contamination'),.5);
  const rm=txt(S,'remembering can pass for reasoning',1490,700,{color:C.ink,fontSize:'36px',fontStyle:'italic'});show(rm,cue(sid,'remembering'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.6 &nbsp;k-nearest neighbours',{top:'920px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();

/* KaTeX stacks accents and fractions on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','');e.setAttribute('data-layout-allow-occlusion','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
