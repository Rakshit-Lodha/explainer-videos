  const cb=codeBox(S,[

    'w, *_ = np.linalg.'+fnc('lstsq')+'(X, y, rcond=None)',
    'r = y - X @ w',
    'X.T @ r    '+cm('# ≈ [0, 0]'),
    'r.sum()    '+cm('# ≈ 0')],1090,320,780,27);
  tl.set(cb.rows,{autoAlpha:0},0);
  fadeIn(cb.box,cue(sid,'solver'),.4);
  tl.to(cb.rows.slice(0,2),{autoAlpha:1,duration:.4,stagger:.3},cue(sid,'lstsq'));
  tl.to(cb.rows.slice(2,4),{autoAlpha:1,duration:.4,stagger:.3},cue(sid,'perpendicular'));
  tl.to(cb.rows[4],{autoAlpha:1,duration:.4},cue(sid,'ones'));
  const ok=txt(S,'residuals ⟂ every column',1480,760,{color:C.pink,fontSize:'42px',fontStyle:'italic'});show(ok,cue(sid,'perpendicular'),.5);
  const z=texLbl(S,'\\textstyle\\sum r_i = 0',1480,860,56,C.pink);show(z,cue(sid,'zero'),.5);
  sceneInOut(sid);
})();

/* ===== S7: linear probes, and next ===== */
(function(){const S=$('S7'),sid='s7';
  const rnd=seedRand(7);const svg=layerSvg(S);
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const cols=['#58c4dd','#2a6f97','#83c167','#f5cf4a','#e77fb3','#5cd0b3'];
  for(let r=0;r<5;r++)for(let c=0;c<12;c++){svgEl('rect',{x:420+c*44,y:300+r*84,width:38,height:70,rx:6,fill:cols[Math.floor(rnd()*6)],'fill-opacity':.25+rnd()*.6},g)}
  const hv=txt(S,'hidden vectors, one per sentence',680,250,{color:C.dim,fontSize:'36px',fontStyle:'italic'});
  fadeIn(g,cue(sid,'hidden'),.6);show(hv,cue(sid,'hidden'),.6);
  const pr=mkArrow(svg,(x,y)=>[x,y],C.yellow,7,'<span style="font-size:40px;font-style:italic">linear probe</span>',-160,-50,S);
  setArrow(pr,{x0:1010,y0:510,x1:1010,y1:510});showArrow(pr,cue(sid,'probe')-1,.2);arrowTo(pr,cue(sid,'probe')-1,.9,{x1:1340,y1:510});
  const yrs=['1848','1912','1969','2008','2021'].map((t,i)=>txt(S,t,1500,335+i*84,{color:C.yellow,fontSize:'44px',fontFamily:"'JetBrains Mono',monospace"}));
  show(yrs,cue(sid,'predicts'),.4,{stagger:.12});
  const yl=txt(S,'year',1500,250,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(yl,cue(sid,'predicts'),.4);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.2 &nbsp;logistic regression and the sigmoid',{top:'920px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();
