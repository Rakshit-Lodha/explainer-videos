  for(let x=x0;x<=x1;x++){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:x===0?C.axis:C.grid,'stroke-width':x===0?3:1.6,opacity:x===0?.9:.55},g)}
  for(let y=y0;y<=y1;y++){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:y===0?C.axis:C.grid,'stroke-width':y===0?3:1.6,opacity:y===0?.9:.55},g)}
  return g}

/* arrows: geometry is recomputed from a proxy so seeks in any order land on the same frame */
function mkArrow(svg,P,color,w,label,lx,ly,parent){
  const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const line=svgEl('line',{stroke:color,'stroke-width':w||7,'stroke-linecap':'round'},g);
  const head=svgEl('polygon',{fill:color},g);
  const a={g,line,head,P,st:{x0:0,y0:0,x1:0,y1:0},lx:lx||0,ly:ly||-50};
  if(label){a.label=el(parent,'lbl',label,{color});a.label.setAttribute('data-layout-allow-overlap','')}
  return a}
function geom(a,x0,y0,x1,y1){
  const [p0x,p0y]=a.P(x0,y0),[p1x,p1y]=a.P(x1,y1);const dx=p1x-p0x,dy=p1y-p0y,L=Math.hypot(dx,dy);
  if(L<2){a.line.setAttribute('x1',p0x);a.line.setAttribute('y1',p0y);a.line.setAttribute('x2',p0x);a.line.setAttribute('y2',p0y);a.head.setAttribute('points','');}
  else{const hl=Math.min(30,L*.45),hw=hl*.55,ux=dx/L,uy=dy/L,bx=p1x-ux*hl,by=p1y-uy*hl;
    a.line.setAttribute('x1',p0x);a.line.setAttribute('y1',p0y);a.line.setAttribute('x2',bx);a.line.setAttribute('y2',by);
    a.head.setAttribute('points',`${p1x},${p1y} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`)}
  if(a.label)gsap.set(a.label,{x:p1x+a.lx,y:p1y+a.ly,xPercent:-50,yPercent:-50})}
function setArrow(a,s){Object.assign(a.st,s);geom(a,a.st.x0,a.st.y0,a.st.x1,a.st.y1)}
function arrowTo(a,time,d,to,ease){const from={...a.st},o={...from};const tgt={...from,...to};
  tl.to(o,{...tgt,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>geom(a,o.x0,o.y0,o.x1,o.y1)},time);a.st=tgt}
function showArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:1,duration:d||.4},time)}
function hideArrow(a,time,d){const tg=[a.g];if(a.label)tg.push(a.label);tl.to(tg,{autoAlpha:0,duration:d||.4},time)}
function grow(a,time,d,x1,y1){setArrow(a,{x1:a.st.x0,y1:a.st.y0});showArrow(a,time,.25);arrowTo(a,time,d,{x1,y1},'power2.out')}

/* column vector with brackets; returns cells so entries can be highlighted or rewritten */
function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}
/* 2x2 matrix with brackets; cols[j][i] are cells, colours per column */
function mat2(parent,cx,cy,m,o){o=o||{};const fs=o.fs||60,cw=o.cw||110,rowH=fs*1.35,pad=fs*.3,W=cw*2+44,H=rowH*2+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cols=[0,1].map(j=>[0,1].map(i=>el(box,'cell',m[i][j],{left:(22+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:(o.colColors||[C.ink,C.ink])[j]})));
  return {box,cols,cx,cy,W,H,cw,rowH,pad}}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+22+j*m.cw+6)+'px',top:(m.cy-m.H/2+m.pad-6)+'px',width:(m.cw-12)+'px',height:(m.rowH*2+12)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* transformable grid: lines in grid units, redrawn through a 2x2 matrix [a b; c d] (columns = images of i-hat, j-hat) */
function tgrid(svg,P,n,o){o=o||{};const g=svgEl('g',{},svg);const lines=[];
  for(let k=-n;k<=n;k++){
    lines.push({p:[k,-n],q:[k,n],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)});
    lines.push({p:[-n,k],q:[n,k],e:svgEl('line',{stroke:k===0?C.axis:(o.color||C.blue),'stroke-width':k===0?3:2,opacity:k===0?.95:(o.op||.7)},g)})}
  const T={g,lines,P,m:{a:1,b:0,c:0,d:1}};
  T.apply=(m)=>{T.m={a:m.a,b:m.b,c:m.c,d:m.d};for(const L of lines){const A=P(m.a*L.p[0]+m.b*L.p[1],m.c*L.p[0]+m.d*L.p[1]),B=P(m.a*L.q[0]+m.b*L.q[1],m.c*L.q[0]+m.d*L.q[1]);
    L.e.setAttribute('x1',A[0]);L.e.setAttribute('y1',A[1]);L.e.setAttribute('x2',B[0]);L.e.setAttribute('y2',B[1])}};
  T.apply(T.m);return T}
/* the whole picture (grid + arrows defined in source coordinates) moves under one matrix tween */
function mkScene(P){const S={P,grids:[],arrows:[],dots:[],m:{a:1,b:0,c:0,d:1},extra:[]};
  S.apply=(m)=>{S.m={a:m.a,b:m.b,c:m.c,d:m.d};S.grids.forEach(g=>g.apply(m));
    S.arrows.forEach(([ar,x,y])=>geom(ar,0,0,m.a*x+m.b*y,m.c*x+m.d*y));
    S.dots.forEach(([e,x,y])=>{const p=P(m.a*x+m.b*y,m.c*x+m.d*y);e.setAttribute('cx',p[0]);e.setAttribute('cy',p[1])});
    S.extra.forEach(f=>f(m))};
  S.to=(time,d,m,ease)=>{anim(time,d,S.m,m,S.apply,ease||'power2.inOut');S.m={...m}};
  return S}

  tl.to(iA.line,{attr:{'stroke-width':14},duration:.35,yoyo:true,repeat:1},cue(sid,'first'));
  tl.to(jA.line,{attr:{'stroke-width':14},duration:.35,yoyo:true,repeat:1},cue(sid,'second'));
  const mt=el(S,'abs hid','that box is the <span style="color:#f5cf4a">matrix</span>',rp({top:'690px',textAlign:'center',fontSize:'48px'}));
  show(mt,cue(sid,'matrix'),.5);
  const rc=el(S,'note','not a mysterious table: a record of where î and ĵ went, column by column',rp({top:'790px',textAlign:'center',color:C.ink}));
  show(rc,cue(sid,'record'),.5);
  sceneInOut(sid);
})();

/* ============ S7: the multiplication rule, read by columns ============ */
(function(){const S=$('S7');const sid='s7';
  const e1=el(S,'abs hid',tex('\\begin{bmatrix}{\\color{#83c167}2}&{\\color{#fc6255}-1}\\\\{\\color{#83c167}1}&{\\color{#fc6255}1}\\end{bmatrix}\\begin{bmatrix}x\\\\y\\end{bmatrix}',56),rp({top:'150px',textAlign:'center'}));
  show(e1,cue(sid,'multiply'),.6);
  const e2=el(S,'abs hid',tex('=\\;x\\,{\\color{#83c167}\\begin{bmatrix}2\\\\1\\end{bmatrix}}\\;+\\;y\\,{\\color{#fc6255}\\begin{bmatrix}-1\\\\1\\end{bmatrix}}',56),rp({top:'310px',textAlign:'center'}));
  show(e2,cue(sid,'copies'),.6);
  tl.fromTo(e2,{color:C.ink},{color:C.yellow,duration:.4,yoyo:true,repeat:1,immediateRender:false},cue(sid,'add'));
  fadeIn(chainG,cue(sid,'recipe'),.5);
  const rc=el(S,'note','exactly the recipe on the grid',rp({top:'505px',textAlign:'center',color:C.yellow}));
  show(rc,cue(sid,'recipe'),.5);
  const rw=el(S,'abs hid',`<div style="font-size:34px;font-style:italic;color:${C.dim};margin-bottom:8px">row by row (same numbers):</div>`+`<div>${tex('2\\cdot 2+(-1)\\cdot 1=3',40)}</div><div>${tex('1\\cdot 2+1\\cdot 1=3',40)}</div>`,rp({top:'600px',textAlign:'center',color:C.dim}));
  show(rw,cue(sid,'row'),.6);
  const wy=el(S,'note','the column picture says <i>why</i>',rp({top:'800px',textAlign:'center',color:C.ink}));
  show(wy,cue(sid,'why'),.5);
  sceneInOut(sid);
})();

/* ============ S8: reading matrices as motions ============ */
(function(){const S=$('S8');const sid='s8';
  fadeOut(chainG,at(sid,0),.4);hideArrow(vA,at(sid,0),.4);
  MS.to(at(sid,0),1.2,I2);
  const card=(m,y,cap)=>{const mm=mat2(S,1380,y,m,{fs:52,cw:96,colColors:[C.green,C.red]});const c=el(S,'abs hid',cap,{left:'1520px',top:(y-30)+'px',width:'380px',fontSize:'38px',fontStyle:'italic'});return [mm.box,c]};
  const k1=card([['0','−1'],['1','0']],230,'a quarter turn');
  const k2=card([['1','1'],['0','1']],520,'a shear');
  const k3=card([['1','−1'],['1','−1']],810,'flattened onto a line');
  show(k1[0],cue(sid,'zero'),.5);
  rotate(cue(sid,'swings'),2.4,0,90);
  show(k1[1],cue(sid,'quarter'),.5);
  rotate(cue(sid,'stays')-.9,.9,90,0);MS.m={...I2};
  show(k2[0],cue(sid,'stays'),.5);
  MS.to(cue(sid,'leans'),1.8,{a:1,b:1,c:0,d:1});
  show(k2[1],cue(sid,'sheared'),.5);
  const dk=el(S,'abs hid','like a deck of cards pushed sideways',{left:'1520px',top:'560px',width:'380px',fontSize:'30px',fontStyle:'italic',color:C.dim});
  show(dk,cue(sid,'deck'),.5);
  MS.to(cue(sid,'both')-.6,.9,I2);
  show(k3[0],cue(sid,'both'),.5);
  MS.to(cue(sid,'flattened')-.3,2.4,{a:1,b:-1,c:1,d:-1});
  show(k3[1],cue(sid,'flattened'),.5);
  const svg=layerSvg(S);const a=P(-6,-6),b=P(6,6);
  const ln=svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.pink,'stroke-width':6,'clip-path':'url(#pclip)',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(ln,cue(sid,'span'),.6);
  const sp=el(S,'abs hid','= the span of the columns',{left:'1520px',top:'850px',width:'380px',fontSize:'30px',fontStyle:'italic',color:C.pink});
  show(sp,cue(sid,'span'),.5);
  sceneInOut(sid);
})();

/* ============ S9: inside a language model ============ */
(function(){const S=$('S9');const sid='s9';
  const r=seedRand(9);const n=6;
  const xin=colvec(S,380,540,Array.from({length:n},()=>fmt(r()*2-1,1)),{fs:40,w:120,color:C.blue});
  const xl=el(S,'abs hid','embedding of “cat”',{left:'230px',top:'830px',width:'300px',textAlign:'center',fontSize:'34px',fontStyle:'italic',color:C.blue});
  // weight matrix as a heatmap; columns line up with input entries
  const W=el(S,'abs hid','',{left:'640px',top:'300px',width:'480px',height:'480px'});
  const cells=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){const v=r()*2-1;cells.push(el(W,'abs','',{left:(j*80+4)+'px',top:(i*80+4)+'px',width:'72px',height:'72px',borderRadius:'8px',background:v>0?C.yellow:C.teal,opacity:(.25+.7*Math.abs(v)).toFixed(2)}))}
  const Wl=el(S,'abs hid','weight matrix W',{left:'640px',top:'830px',width:'480px',textAlign:'center',fontSize:'34px',fontStyle:'italic',color:C.yellow});
  const eq=sym(S,'=',1200,540,72);
  const yout=colvec(S,1360,540,Array.from({length:n},()=>fmt(r()*2-1,1)),{fs:40,w:120,color:C.pink});
  const yl=el(S,'abs hid','a new place, in a new space',{left:'1180px',top:'830px',width:'360px',textAlign:'center',fontSize:'34px',fontStyle:'italic',color:C.pink});
  show([xin.box,xl],cue(sid,'language'),.6);
  show([W,Wl],cue(sid,'weight'),.6);
  show([eq,yout.box,yl],cue(sid,'moves'),.6);
  const colH=el(S,'hl','',{left:'640px',top:'296px',width:'80px',height:'488px',borderColor:C.ink,boxShadow:`0 0 24px ${C.ink}55`});
  const inH=cellHL(S,xin,0,C.ink);
  fadeIn([colH,inH],cue(sid,'column'),.4);
  for(let j=1;j<n;j++){tl.to(colH,{x:j*80,duration:.3},cue(sid,'column')+.5*j);tl.to(inH,{y:j*xin.rowH,duration:.3},cue(sid,'column')+.5*j)}
  const cl=el(S,'abs hid','column j: where input direction j is sent',{left:'0',top:'200px',width:'1920px',textAlign:'center',fontSize:'40px',fontStyle:'italic'});
  show(cl,cue(sid,'column'),.5);
  fadeOut([colH,inH],cue(sid,'training')-.2,.4);
  const rr=seedRand(13);
  cells.forEach((c,k)=>tl.to(c,{opacity:(.25+.7*rr()).toFixed(2),duration:.5,repeat:3,yoyo:true},cue(sid,'training')+(k%7)*.06));
  const tr=el(S,'abs hid','training = searching for matrices that move words to useful places',{left:'0',top:'930px',width:'1920px',textAlign:'center',fontSize:'42px',fontStyle:'italic',color:C.yellow});
  show(tr,cue(sid,'training'),.6);
  sceneInOut(sid);
})();

/* ============ S10: summary and next ============ */
(function(){const S=$('S10');const sid='s10';
  const a=el(S,'abs hid','a matrix = a record of where <span style="color:#83c167">î</span> and <span style="color:#fc6255">ĵ</span> land',{left:'0',top:'260px',width:'1920px',textAlign:'center',fontSize:'58px'});
  show(a,cue(sid,'record'),.6);
  const b=el(S,'abs hid',tex('M\\begin{bmatrix}x\\\\y\\end{bmatrix}=x\\,{\\color{#83c167}(\\text{column }1)}+y\\,{\\color{#fc6255}(\\text{column }2)}',58),{left:'0',top:'440px',width:'1920px',textAlign:'center'});
  show(b,cue(sid,'rebuilding'),.6);
  const c=el(S,'abs hid','one transformation, then another … ?',{left:'0',top:'660px',width:'1920px',textAlign:'center',fontSize:'48px',fontStyle:'italic',color:C.dim});
  show(c,cue(sid,'another'),.6);
  const next=el(S,'cap','next &nbsp;·&nbsp; 1.4 &nbsp;matrix multiplication as composition',{top:'900px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'multiplication'),.7);
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();

document.querySelectorAll('.katex, .katex *').forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
