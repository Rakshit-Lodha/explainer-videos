  const p={k:0};const pos=(v,k)=>{const z=(v-m)/sd;return ox+((1-k)*v+k*z)*sx};
  tl.to(p,{k:1,duration:2.2,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{dots.forEach((c,i)=>c.setAttribute('cx',pos(vals[i],p.k)));mean.setAttribute('x1',ox+(1-p.k)*m*sx);mean.setAttribute('x2',ox+(1-p.k)*m*sx)}},cue(sid,'subtracts'));
  const r1=label(S,'centred at 0, spread 1',ox,560,{fs:32,italic:true,color:AC});show(r1,cue(sid,'centred'),.4);
  const f=el(S,'abs hid',tex('\\mathrm{LN}(x)=\\gamma\\odot\\dfrac{x-\\mu}{\\sigma}+\\beta',46),{left:'1250px',top:'560px',whiteSpace:'nowrap'});show(f,cue(sid,'learned'),.5);
  const hr=label(S,'keeps the numbers in a healthy range',ox,640,{fs:30,italic:true,color:C.dim});show(hr,cue(sid,'healthy'),.4);
  tl.to([tl1,r1,hr,f,mean,...dots,...axis],{autoAlpha:0,duration:.4},cue(sid,'gpt')-.3);
  // pre-norm vs post-norm
  const mini=(cx,title,pre)=>{const els=[];const t=label(S,title,cx,700,{fs:32,italic:true,color:pre?SC:C.dim});els.push(t);
    const order=pre?[['LN',LC],['attention',AC],['+',SC]]:[['attention',AC],['+',SC],['LN',LC]];
    const xs=[cx-270,cx,cx+270],hw=order.map(([n])=>(n.length*30*.6+36)/2);order.forEach(([n,c],i)=>{const b=tok(S,n,xs[i],800,{fs:30,color:c,border:c});els.push(b)});
    const s2=layerSvg(S);[0,1].forEach(i=>{const a=mkArrow(s2,PX,C.dim,3);setArrow(a,{x0:xs[i]+hw[i]+12,y0:800,x1:xs[i+1]-hw[i+1]-12,y1:800});els.push(a.g)});return els};
  const pre=mini(560,'pre-norm (GPT-2)',true),post=mini(1360,'post-norm (original transformer)',false);
  tl.to(pre,{autoAlpha:1,duration:.5},cue(sid,'pre'));tl.to(post,{autoAlpha:1,duration:.5},cue(sid,'original'));
  const rel=label(S,'pre-norm trains more reliably in deep stacks',960,930,{fs:32,italic:true,color:C.ink});show(rel,cue(sid,'reliably'),.4);
  sceneInOut(sid);
})();

/* ============ S6: two lines, and the shape never changes ============ */
(function(){const S=$('S6');const sid='s6';
  const l1=el(S,'abs hid',tex('x\\;\\leftarrow\\;x+\\textcolor{#f5cf4a}{\\operatorname{Attn}}\\big(\\textcolor{#58c4dd}{\\mathrm{LN}_1}(x)\\big)',60),{left:'520px',top:'160px'});
  const l2=el(S,'abs hid',tex('x\\;\\leftarrow\\;x+\\textcolor{#83c167}{\\operatorname{MLP}}\\big(\\textcolor{#58c4dd}{\\mathrm{LN}_2}(x)\\big)',60),{left:'520px',top:'260px'});
  show(l1,cue(sid,'attention'),.5);show(l2,cue(sid,'mlp'),.5);
  const bars=[['x',SC,240,'(T × d)'],['after attention',AC,240,'(T × d)'],['inside the MLP',MC,600,'(T × 4d)'],['block output',SC,240,'(T × d)']];
  const xs=[300,700,1140,1600];
  const B=bars.map(([t,col,w,s],i)=>{const r=el(S,'abs hid','',{left:(xs[i]-w/2)+'px',top:'520px',width:w+'px',height:'200px',background:hexA(col,.2),border:'3px solid '+col,borderRadius:'8px'});
    const l=label(S,t,xs[i],490,{fs:28,italic:true,color:col}),sh=label(S,s,xs[i],760,{fs:30,mono:true,color:C.ink});return [r,l,sh]});
  show(B[0],cue(sid,'takes'),.4);show(B[3],cue(sid,'returns'),.4);show(B[1],cue(sid,'same',1)-.4,.4);
  show(B[2],cue(sid,'grow'),.5);
  const same=el(S,'cap','same shape in, same shape out: blocks stack as deep as we like',{top:'860px',fontSize:'42px',fontStyle:'italic'});show(same,cue(sid,'stacked'),.5);
  sceneInOut(sid);
})();

/* ============ S7: the whole model ============ */
(function(){const S=$('S7');const sid='s7';
  const steps=[['token IDs',C.dim,'token'],['embedding + position',LC,'embeddings'],['block 1',SC,'stack'],['block 2',SC,'identical'],['⋮',C.dim,'identical'],['block N',SC,'identical'],['final layer norm',LC,'final'],['vocabulary scores',AC,'vocabulary']];
  const ys=[930,830,720,620,540,460,350,240];const svg=layerSvg(S);
  const els=steps.map(([t,c,w],i)=>{const b=t==='⋮'?label(S,t,700,ys[i],{fs:44,color:C.dim}):tok(S,t,700,ys[i],{fs:32,color:c,border:c});if(t!=='⋮'){b.style.width='460px';b.style.textAlign='center'}return b});
  steps.forEach(([t,c,w],i)=>show(els[i],cue(sid,w)+(i>=3&&i<=5?(i-3)*.3:0),.4));
  const hm=[2,3,5].map((i,k)=>{const m=matrix(S,1000,ys[i],2,6,{cw:22,ch:22,heat:rmat(2,6),color:SC});return m.box});
  show(hm,cue(sid,'own'),.4,{stagger:.2});
  const own=label(S,'each block has its own weights',1300,ys[3],{fs:30,italic:true,color:SC});show(own,cue(sid,'weights'),.4);
  const n1=label(S,'attention gathers context, MLPs process it',1300,ys[2],{fs:30,italic:true,color:C.ink});show(n1,cue(sid,'gathering'),.4);
  const n2=label(S,'one matrix: d → V scores per token',1300,ys[7],{fs:30,italic:true,color:AC});show(n2,cue(sid,'maps'),.4);
  sceneInOut(sid);
})();

/* ============ S8: scores at the top; next lesson ============ */
