  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);
  tl.to(p,{autoAlpha:1,duration:.15},time);tl.to(p,{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut'},time)}
/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */
function morphFn(p,P,f,a,b,s0,n){const o={s:s0};const upd=()=>p.setAttribute('d',fnPath(P,x=>f(x,o.s),a,b,n));upd();
  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */
function texLbl(parent,s,x,y,size,color){const d=el(parent,'lbl',tex(s,size||56),{color:color||C.ink});place(d,x,y);return d}
function txt(parent,s,x,y,o){o=o||{};const d=el(parent,'lbl',s,Object.assign({color:C.ink,fontSize:'40px'},o));place(d,x,y);return d}
/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});
  const rows=lines.map(l=>el(b,'',l,{position:'relative'}));return {box:b,rows}}
const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;
function sceneIn(sid){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid])}

const root=$('root');
function gauss(r){let g=0;for(let k=0;k<6;k++)g+=r();return (g-3)/Math.sqrt(.5)}
const KC=[C.blue,C.yellow,C.pink,C.green,C.teal,C.red];
function blobs(seed,centres,n,sd){const r=seedRand(seed),out=[];centres.forEach(c=>{for(let i=0;i<n;i++)out.push([c[0]+gauss(r)*sd,c[1]+gauss(r)*sd])});return out}
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
function lloyd(pts,init,iters){let Cn=init.map(c=>[...c]);const hist=[];
  for(let it=0;it<iters;it++){const as=pts.map(p=>{let b=0;Cn.forEach((c,j)=>{if(d2(p,c)<d2(p,Cn[b]))b=j});return b});
    const J=pts.reduce((s,p,i)=>s+d2(p,Cn[as[i]]),0);hist.push({C:Cn.map(c=>[...c]),as,J});
    const nc=Cn.map((c,j)=>{const m=pts.filter((p,i)=>as[i]===j);return m.length?[m.reduce((s,p)=>s+p[0],0)/m.length,m.reduce((s,p)=>s+p[1],0)/m.length]:c});
    if(nc.every((c,j)=>d2(c,Cn[j])<1e-12)){Cn=nc;break}Cn=nc}
  return hist}
const PTS=blobs(6,[[-2.2,1.2],[2.0,1.6],[0.2,-1.9]],26,.65);
const P=(x,y)=>[700+150*x,560-150*y];
const INIT=[[-3.0,-2.2],[-2.4,-2.6],[-1.8,-2.2]];
const H=lloyd(PTS,INIT,20);
/* shared plot for s1-s4 */
const KM=el(root,'layer','');KM.id='KM';
const ksvg=layerSvg(KM);
const kdots=PTS.map(p=>dot(ksvg,...P(...p),10,C.dim,false));
const trails=INIT.map((c,j)=>svgEl('polyline',{points:'',fill:'none',stroke:KC[j],'stroke-width':3,'stroke-dasharray':'6 6',opacity:.8},ksvg));
const cents=INIT.map((c,j)=>{const g=svgEl('g',{style:'opacity:0;visibility:hidden'},ksvg);svgEl('circle',{cx:0,cy:0,r:22,fill:'#0e1116',stroke:KC[j],'stroke-width':5},g);svgEl('path',{d:'M-10,0 L10,0 M0,-10 L0,10',stroke:KC[j],'stroke-width':4},g);return g});
const ST={it:0,col:0,trail:0};
function drawKM(o){const i=Math.min(H.length-1,Math.floor(o.it)),f=o.it-i,a=H[i],b=H[Math.min(H.length-1,i+1)];
  a.C.forEach((c,j)=>{const x=c[0]+(b.C[j][0]-c[0])*f,y=c[1]+(b.C[j][1]-c[1])*f;const [px,py]=P(x,y);cents[j].setAttribute('transform',`translate(${px},${py})`);
    const tr=[];for(let k=0;k<=i;k++)tr.push(P(...H[k].C[j]).join(','));tr.push([px,py].join(','));trails[j].setAttribute('points',o.trail?tr.join(' '):'')});
  const as=H[Math.min(H.length-1,Math.round(o.col)>0?Math.floor(o.col)-1:0)].as;
  kdots.forEach((d,k)=>d.setAttribute('fill',o.col<1?C.dim:KC[as[k]]))}
const goKM=driver(ST,drawKM);
tl.to(KM,{autoAlpha:1,duration:.6},at('s1',.02));tl.to(KM,{autoAlpha:0,duration:.5},START.s5-.4);
/* step to iteration n: recolour by assignment n (col = n+1), then move centres (it -> n+1) */
const assignStep=(t,n)=>goKM(t,.6,{col:n+1},'none');
const moveStep=(t,n,d)=>goKM(t,d||1,{it:n+1});

/* ===== S1: unlabelled data ===== */
(function(){const S=$('S1'),sid='s1';
  const q=txt(S,'no answers attached, only data',1560,300,{color:C.dim,fontSize:'38px',fontStyle:'italic'});show(q,cue(sid,'only'),.5);
  const g=txt(S,'natural groups?',1560,380,{color:C.ink,fontSize:'44px',fontStyle:'italic'});show(g,cue(sid,'groups'),.5);
  const cl=txt(S,'clustering',1560,620,{color:C.yellow,fontSize:'56px'});show(cl,cue(sid,'clustering'),.5);
  const km=el(S,'lbl','<em style="color:#58c4dd">k</em> means',{fontSize:'52px',color:C.ink});place(km,1560,710);show(km,cue(sid,'means'),.5);
  sceneInOut(sid);
})();

/* ===== S2: the two steps ===== */
(function(){const S=$('S2'),sid='s2';
  const steps=[['place k centres','place'],['assign each point to its nearest centre','assign'],['move each centre to the mean of its points','move'],['repeat until nothing changes','repeat']].map(([t,w],i)=>{const d=el(S,'abs hid','',{left:'1360px',top:(250+i*110)+'px',width:'500px',fontSize:'36px',lineHeight:'1.3',color:C.ink});d.innerHTML=`<span class="mono" style="color:#f5cf4a">${i+1}</span>&nbsp; ${t}`;show(d,cue(sid,w),.4);return d});
  fadeIn(cents,cue(sid,'place'),.5);
  assignStep(cue(sid,'assign'),0);
  moveStep(cue(sid,'move'),0,1.2);
  const cm=txt(S,'the centre of mass of its group',1610,720,{color:C.dim,fontSize:'32px',fontStyle:'italic'});show(cm,cue(sid,'mass'),.4);
  tl.set(ST,{trail:1},cue(sid,'move'));
  assignStep(cue(sid,'again'),1);moveStep(cue(sid,'again',2),1,1);
  sceneInOut(sid);
})();

/* ===== S3: watch them drift ===== */
(function(){const S=$('S3'),sid='s3';
  const n=H.length;const t0=START[sid]+.3,span=cue(sid,'settle')-t0;
  for(let k=2;k<n-1;k++){const t=t0+(k-2)*span/Math.max(1,n-3);assignStep(t,k);moveStep(t+.5,k,.9)}
  const it=el(S,'lbl mono','',{color:C.ink,fontSize:'40px'});place(it,1560,260);
  for(let k=0;k<n;k++)tl.set(it,{textContent:'round '+(k+1)},k<2?START[sid]:t0+(k-2)*span/Math.max(1,n-3));
  fadeIn(it,START[sid]+.2,.4);
  const done=txt(S,'settled: colours stop changing',1560,340,{color:C.teal,fontSize:'38px',fontStyle:'italic'});show(done,cue(sid,'stop'),.5);
  sceneInOut(sid);
})();

/* ===== S4: inertia never rises ===== */
(function(){const S=$('S4'),sid='s4';
  fadeOut(trails,START[sid]+.2,.5);
  const f=texLbl(S,'J = \\sum_i \\lVert \\mathbf{x}_i - \\boldsymbol{\\mu}_{c(i)} \\rVert^2',1580,230,52,C.ink);show(f,cue(sid,'quantity'),.6);
  const il=txt(S,'inertia',1520,320,{color:C.yellow,fontSize:'40px',fontStyle:'italic'});show(il,cue(sid,'inertia'),.4);
  // J after each half-step: assignment then update
  const seq=[];H.forEach((h,k)=>{seq.push(h.J);const mJ=PTS.reduce((s,p,i)=>s+d2(p,(H[k+1]||h).C[h.as[i]]),0);seq.push(mJ)});
  const Q=(i,J)=>[1240+560*i/(seq.length-1),900-360*(J-seq[seq.length-1])/(seq[0]-seq[seq.length-1]+1e-9)];
  const svg=layerSvg(S);axes(svg,(i,J)=>Q(i,J),0,seq.length-1,seq[seq.length-1],seq[0]);
  const path=mkPath(svg,polyPath(seq.map((J,i)=>Q(i,J))),C.yellow,5);drawOn(path,cue(sid,'lower'),2.4);
  const a=txt(S,'assign: each point picks its closest centre',1520,960,{color:C.dim,fontSize:'30px',fontStyle:'italic'});show(a,cue(sid,'assignment'),.4);
  const u=txt(S,'update: the mean minimises squared distance',1520,1010,{color:C.dim,fontSize:'30px',fontStyle:'italic'});show(u,cue(sid,'update'),.4);
  const z=txt(S,'never rises, never below zero → it stops',1520,420,{color:C.teal,fontSize:'36px',fontStyle:'italic'});show(z,cue(sid,'stop'),.5);
  sceneInOut(sid);
})();

/* ===== S5: a bad start ===== */
(function(){const S=$('S5'),sid='s5';
  const Hb=lloyd(PTS,[[1.6,1.6],[2.4,1.6],[-1,-.4]],30),fin=Hb[Hb.length-1];const H3=lloyd(PTS,[[0,-1.6],[.4,-2.2],[0,1.5]],30),f3=H3[H3.length-1];
  const Pb=(x,y)=>[560+120*x,560-120*y];const svg=layerSvg(S);
  const ds=PTS.map((p,i)=>dot(svg,...Pb(...p),9,KC[fin.as[i]],false));
  const cs=fin.C.map((c,j)=>{const g=svgEl('g',{},svg);const [x,y]=Pb(...c);svgEl('circle',{cx:x,cy:y,r:20,fill:'#0e1116',stroke:KC[j],'stroke-width':5},g);return g});
  tl.fromTo(svg,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},cue(sid,'poor'));
  const t1=txt(S,'two centres started in one cluster',560,200,{color:C.red,fontSize:'36px',fontStyle:'italic'});show(t1,cue(sid,'poor'),.4);
  const t2=txt(S,'stuck: a local minimum',560,940,{color:C.red,fontSize:'38px',fontStyle:'italic'});show(t2,cue(sid,'escape'),.4);
  const pp=el(S,'chip','k-means++: spread the starting centres',{left:'1150px',top:'380px',borderColor:C.teal,fontSize:'34px'});show(pp,cue(sid,'plus'),.5);
  const good=H[H.length-1].J;const runs=[fin.J,good*1.0,good*1.0+.0001,fin.J*0.98];
  const tb=el(S,'abs hid mono','',{left:'1180px',top:'520px',width:'560px',fontSize:'32px',lineHeight:'1.7',color:C.ink});
  tb.innerHTML=`run 1 &nbsp; inertia ${fin.J.toFixed(1)}<br><span style="color:#5cd0b3">run 2 &nbsp; inertia ${good.toFixed(1)} ✓</span><br>run 3 &nbsp; inertia ${f3.J.toFixed(1)}`;
  show(tb,cue(sid,'several'),.5);
  const kp=txt(S,'keep the lowest inertia',1460,760,{color:C.teal,fontSize:'36px',fontStyle:'italic'});show(kp,cue(sid,'lowest'),.4);
  sceneInOut(sid);
})();

/* ===== S6: choosing k, and what k-means assumes ===== */
(function(){const S=$('S6'),sid='s6';
  // elbow: best of several seeded starts for each k
  const best=k=>{let b=1e9;for(let s=0;s<6;s++){const r=seedRand(100+s*7+k),init=[];for(let j=0;j<k;j++)init.push([...PTS[Math.floor(r()*PTS.length)]]);const h=lloyd(PTS,init,40);b=Math.min(b,h[h.length-1].J)}return b};
  const Js=[1,2,3,4,5,6,7,8].map(best);
  const Q=(k,J)=>[200+90*(k-1),880-500*J/Js[0]];const svg=layerSvg(S);axes(svg,Q,1,8.3,0,1.05*Js[0]);
  const pth=mkPath(svg,polyPath(Js.map((J,i)=>Q(i+1,J))),C.yellow,5);drawOn(pth,cue(sid,'plotting'),1.6);
  const dts=Js.map((J,i)=>dot(svg,...Q(i+1,J),9,C.yellow));fadeIn(dts,cue(sid,'plotting')+1,.4,.05);
  const xl=txt(S,'k',Q(8.6,0)[0],Q(0,0)[1],{color:C.dim,fontSize:'36px',fontStyle:'italic'}),yl=txt(S,'inertia',Q(1,0)[0],Q(0,Js[0]*1.1)[1]-10,{color:C.dim,fontSize:'32px',fontStyle:'italic'});show([xl,yl],cue(sid,'plotting'),.4);
  const ring=svgEl('circle',{cx:Q(3,Js[2])[0],cy:Q(3,Js[2])[1],r:30,fill:'none',stroke:C.pink,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);fadeIn(ring,cue(sid,'elbow'),.4);
  const el_=txt(S,'elbow at k = 3',Q(3,0)[0]+170,Q(0,Js[2])[1]-80,{color:C.pink,fontSize:'36px',fontStyle:'italic'});show(el_,cue(sid,'elbow'),.4);
  // rings: k-means cuts them with a straight line
  const r=seedRand(4),ring2=[];for(let i=0;i<90;i++){const a=r()*2*Math.PI,rad=i<30?.45+r()*.25:1.5+r()*.3;ring2.push([Math.cos(a)*rad,Math.sin(a)*rad])}
  const h=lloyd(ring2,[[-1,0],[1,0]],30),fin=h[h.length-1];
  const Pr=(x,y)=>[1440+170*x,560-170*y];const rs=layerSvg(S);
  ring2.forEach((p,i)=>dot(rs,...Pr(...p),8,KC[fin.as[i]],false));
  tl.fromTo(rs,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},cue(sid,'straight'));
  const bl=txt(S,'nested rings: k-means cuts them in half',1440,900,{color:C.red,fontSize:'34px',fontStyle:'italic'});show(bl,cue(sid,'nested'),.4);
  const rd=txt(S,'boundaries between centres are straight lines',1440,220,{color:C.dim,fontSize:'32px',fontStyle:'italic'});show(rd,cue(sid,'straight'),.4);
  sceneInOut(sid);
})();

/* ===== S7: clusters inside a vector database ===== */
(function(){const S=$('S7'),sid='s7';
  const cs=[[-2.5,1.4],[0,2],[2.5,1.2],[-1.6,-1.5],[1.4,-1.6],[3.2,-.6]];
  const pts=blobs(31,cs,14,.45);const Pv=(x,y)=>[760+150*x,560-140*y];const svg=layerSvg(S);
  const asg=pts.map(p=>{let b=0;cs.forEach((c,j)=>{if(d2(p,c)<d2(p,cs[b]))b=j});return b});
  const dts=pts.map((p,i)=>dot(svg,...Pv(...p),7,C.dim));
  tl.to(dts,{autoAlpha:1,duration:.15,stagger:.01},cue(sid,'embeddings'));
  const cen=cs.map((c,j)=>{const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);const [x,y]=Pv(...c);svgEl('circle',{cx:x,cy:y,r:16,fill:'#0e1116',stroke:KC[j%6],'stroke-width':4},g);return g});
  fadeIn(cen,cue(sid,'means'),.5,.08);dts.forEach((d,i)=>tl.to(d,{attr:{fill:KC[asg[i]%6]},duration:.5},cue(sid,'means')+.3));
  const q=[1.9,.3],qp=Pv(...q);const qd=dot(svg,qp[0],qp[1],13,C.ink);fadeIn(qd,cue(sid,'query'),.4);
  const near=cs.map((c,j)=>[d2(c,q),j]).sort((a,b)=>a[0]-b[0]).slice(0,2).map(x=>x[1]);
  tl.to(dts.filter((d,i)=>!near.includes(asg[i])),{autoAlpha:.15,duration:.5},cue(sid,'compared'));
  const ql=txt(S,'compare only with the nearest clusters',1560,300,{color:C.ink,fontSize:'36px',fontStyle:'italic'});show(ql,cue(sid,'compared'),.4);
  const cp=txt(S,'or store a centre index instead of the full vector',1560,380,{color:C.dim,fontSize:'32px',fontStyle:'italic'});show(cp,cue(sid,'compress'),.4);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.9 &nbsp;PCA in practice',{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();

/* KaTeX stacks accents and fractions on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','');e.setAttribute('data-layout-allow-occlusion','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
</body>
