  if(o.grid){for(let x=Math.ceil(x0);x<=x1;x+=(o.step||1)){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}
    for(let y=Math.ceil(y0);y<=y1;y+=(o.step||1)){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}}
  const ya=o.yAxisAt??y0,xa=o.xAxisAt??x0;const a=P(x0,ya),b=P(x1,ya),c=P(xa,y0),d=P(xa,y1);
  svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);
  tl.to(p,{autoAlpha:1,duration:.15},time);tl.to(p,{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut'},time)}
/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */
function morphFn(p,P,f,a,b,s0,n){const o={s:s0};const upd=()=>p.setAttribute('d',fnPath(P,x=>f(x,o.s),a,b,n));upd();
  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */
function texLbl(parent,s,x,y,size,color){const d=el(parent,'lbl',tex(s,size||56),{color:color||C.ink});place(d,x,y);return d}
function txt(parent,s,x,y,o){o=o||{};const d=el(parent,'lbl',s,Object.assign({color:C.ink,fontSize:'40px'},o));place(d,x,y);return d}
/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});
  const rows=lines.map(l=>el(b,'',l,{position:'relative'}));return {box:b,rows}}
const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;
function sceneIn(sid){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid])}

const root=$('root');
function gauss(r){let g=0;for(let k=0;k<6;k++)g+=r();return (g-3)/Math.sqrt(.5)}
/* a cigar-shaped cloud, off-centre */
const R=seedRand(8),ANG=28*Math.PI/180,MU=[2.2,1.4];
const PTS=[];for(let i=0;i<60;i++){const a=gauss(R)*1.5,b=gauss(R)*.38;PTS.push([MU[0]+a*Math.cos(ANG)-b*Math.sin(ANG),MU[1]+a*Math.sin(ANG)+b*Math.cos(ANG)])}
const n=PTS.length,mx=PTS.reduce((s,p)=>s+p[0],0)/n,my=PTS.reduce((s,p)=>s+p[1],0)/n;
const XC=PTS.map(p=>[p[0]-mx,p[1]-my]);
const cxx=XC.reduce((s,p)=>s+p[0]*p[0],0)/(n-1),cyy=XC.reduce((s,p)=>s+p[1]*p[1],0)/(n-1),cxy=XC.reduce((s,p)=>s+p[0]*p[1],0)/(n-1);
const tr=cxx+cyy,det=cxx*cyy-cxy*cxy,L1=tr/2+Math.sqrt(tr*tr/4-det),L2=tr/2-Math.sqrt(tr*tr/4-det);
const V1=(()=>{const v=[cxy,L1-cxx],m=Math.hypot(...v);return [v[0]/m,v[1]/m]})(),V2=[-V1[1],V1[0]];
const varAlong=a=>{const u=[Math.cos(a),Math.sin(a)];return XC.reduce((s,p)=>s+(p[0]*u[0]+p[1]*u[1])**2,0)/(n-1)};
const PA=(x,y)=>[680+125*x,600-125*y];
/* persistent cloud for s2-s4 */
const CL=el(root,'layer','');CL.id='CL';const csvg=layerSvg(CL);
axes(csvg,PA,-4.6,4.6,-3,3.4,{xAxisAt:0,yAxisAt:0});
const cdots=PTS.map(()=>dot(csvg,0,0,9,C.blue,false));
const ST={c:0,p:0};
const pos=(i,o)=>{const p=PTS[i],c=[p[0]-mx*o.c,p[1]-my*o.c];const xc=XC[i],t=xc[0]*V1[0]+xc[1]*V1[1];const pr=[t*V1[0],t*V1[1]];return [c[0]+(pr[0]-c[0])*o.p,c[1]+(pr[1]-c[1])*o.p]};
const goC=driver(ST,o=>cdots.forEach((d,i)=>{const [x,y]=PA(...pos(i,o));d.setAttribute('cx',x);d.setAttribute('cy',y)}));
tl.to(CL,{autoAlpha:1,duration:.6},START.s2);tl.to(CL,{autoAlpha:0,duration:.5},START.s5-.4);
const ID=(x,y)=>[x,y];

  const e1=PA(V1[0]*Math.sqrt(L1)*1.8,V1[1]*Math.sqrt(L1)*1.8),e2=PA(V2[0]*Math.sqrt(L2)*1.8,V2[1]*Math.sqrt(L2)*1.8);
  setArrow(p1,{x0:o[0],y0:o[1],x1:e1[0],y1:e1[1]});setArrow(p2,{x0:o[0],y0:o[1],x1:e2[0],y1:e2[1]});

  const ds=pts.map(()=>dot(svg,0,0,8,C.blue,false));const st={t:0};
  const arr=mkArrow(svg,ID,C.yellow,6);
  const go=driver(st,o=>{const sx=1+o.t*0,sy=.12+(1-.12)*o.t;// raw: rupees column dwarfs years
    const P=pts.map(p=>[p[0]*(1-o.t)*1.9+p[0]*o.t,p[1]*sy]);P.forEach((p,i)=>{const [x,y]=Pp(...p);ds[i].setAttribute('cx',x);ds[i].setAttribute('cy',y)});
    const m=[P.reduce((s,p)=>s+p[0],0)/P.length,P.reduce((s,p)=>s+p[1],0)/P.length];let a=0,b=0,c=0;P.forEach(p=>{const dx=p[0]-m[0],dy=p[1]-m[1];a+=dx*dx;b+=dy*dy;c+=dx*dy});
    const ang=.5*Math.atan2(2*c,a-b);const [x0,y0]=Pp(0,0),[x1,y1]=Pp(1.8*Math.cos(ang),1.8*Math.sin(ang));setArrow(arr,{x0,y0,x1,y1})});
  tl.fromTo(svg,{autoAlpha:0},{autoAlpha:1,duration:.5,immediateRender:false},at(sid,.02));showArrow(arr,at(sid,.02),.3);
  const u1=txt(S,'rupees: big numbers swamp the variance',560,200,{color:C.red,fontSize:'34px',fontStyle:'italic'});show(u1,cue(sid,'rupees'),.4);

/* KaTeX stacks accents and fractions on purpose; tell the layout checker */
document.querySelectorAll('.katex, .katex *').forEach(e=>{e.setAttribute('data-layout-allow-overlap','');e.setAttribute('data-layout-allow-occlusion','')});
tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
