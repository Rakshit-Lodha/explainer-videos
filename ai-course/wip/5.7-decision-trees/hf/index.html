  if(o.grid){for(let x=Math.ceil(x0);x<=x1;x+=(o.step||1)){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}
    for(let y=Math.ceil(y0);y<=y1;y+=(o.step||1)){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}}
  const ya=o.yAxisAt??y0,xa=o.xAxisAt??x0;const a=P(x0,ya),b=P(x1,ya),c=P(xa,y0),d=P(xa,y1);
  svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);

/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */

  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */

/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});

const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;

const root=$('root');
/* ---- data and a small CART (Gini) ---- */
const R0=seedRand(14);const PTS=[];
for(let i=0;i<70;i++){const x=.3+R0()*9.4,y=.3+R0()*9.4;let c=(x>5&&y>4)||(x<3&&y>6.5)?1:0;PTS.push([x,y,c])}
[5,17,40].forEach(i=>PTS[i][2]=1-PTS[i][2]);
const gini=ps=>{if(!ps.length)return 0;const p=ps.filter(q=>q[2]).length/ps.length;return 1-p*p-(1-p)*(1-p)};
function bestSplit(ps){let best=null;const g0=gini(ps);
  for(const f of [0,1]){const vs=[...new Set(ps.map(p=>p[f]))].sort((a,b)=>a-b);
    for(let i=0;i+1<vs.length;i++){const t=(vs[i]+vs[i+1])/2,L=ps.filter(p=>p[f]<t),R=ps.filter(p=>p[f]>=t);
      const g=(L.length*gini(L)+R.length*gini(R))/ps.length;if(g<g0-1e-9&&(!best||g<best.g))best={f,t,g}}}return best}
function grow(ps,box,depth,maxD,minLeaf){const n1=ps.filter(p=>p[2]).length;const node={box,ps,cls:n1*2>ps.length?1:0,depth};
  if(depth>=maxD||ps.length<2*minLeaf||n1===0||n1===ps.length)return node;
  const s=bestSplit(ps);if(!s)return node;
  const L=ps.filter(p=>p[s.f]<s.t),R=ps.filter(p=>p[s.f]>=s.t);if(L.length<minLeaf||R.length<minLeaf)return node;
  const bl=s.f?[box[0],box[1],box[2],s.t]:[box[0],s.t,box[2],box[3]],br=s.f?[box[0],box[1],s.t,box[3]]:[s.t,box[1],box[2],box[3]];
  Object.assign(node,{f:s.f,t:s.t,left:grow(L,bl,depth+1,maxD,minLeaf),right:grow(R,br,depth+1,maxD,minLeaf)});return node}
function bfs(n){const out=[],q=[n];while(q.length){const a=q.shift();out.push(a);if(a.left){q.push(a.left);q.push(a.right)}}return out}
const leaves=n=>n.left?[...leaves(n.left),...leaves(n.right)]:[n];
const BOX=[0,10,0,10];
function planeView(S,ox,oy,u){const P=(x,y)=>[ox+u*x,oy-u*y];const svg=layerSvg(S);
  const bg=svgEl('g',{},svg);svgEl('rect',{x:ox,y:oy-10*u,width:10*u,height:10*u,fill:'none',stroke:C.grid,'stroke-width':2},svg);
  const cutG=svgEl('g',{},svg);const dG=svgEl('g',{},svg);return {P,svg,bg,cutG,dG}}
function drawPts(V,ps,r){return ps.map(p=>dot(V.dG,...V.P(p[0],p[1]),r||9,p[2]?C.pink:C.blue,false))}
function leafRect(V,lf,op){const [a,b]=V.P(lf.box[0],lf.box[3]),[c,d]=V.P(lf.box[1],lf.box[2]);return svgEl('rect',{x:a,y:b,width:c-a,height:d-b,fill:lf.cls?C.pink:C.blue,'fill-opacity':op||.22,style:'opacity:0;visibility:hidden'},V.bg)}
function cutLine(V,n){const b=n.box;const [x1,y1]=n.f?V.P(b[0],n.t):V.P(n.t,b[2]),[x2,y2]=n.f?V.P(b[1],n.t):V.P(n.t,b[3]);
  const l=svgEl('line',{x1,y1,x2,y2,stroke:C.yellow,'stroke-width':5,'stroke-linecap':'round'},V.cutG);return l}
/* tree diagram */
function treeDiagram(S,root,x0,x1,y0,dy){const svg=layerSvg(S);const items=[];let k=0;const lv=leaves(root).length;
  const place_=(n)=>{if(!n.left){n._x=x0+(x1-x0)*(k+.5)/lv;k++}else{place_(n.left);place_(n.right);n._x=(n.left._x+n.right._x)/2}n._y=y0+n.depth*dy};place_(root);
  bfs(root).forEach(n=>{const it={n};if(n.left){[n.left,n.right].forEach((c,j)=>{it['e'+j]=svgEl('line',{x1:n._x,y1:n._y+26,x2:c._x,y2:c._y-26,stroke:C.dim,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg)})}
    const lab=n.left?(n.f?'y':'x')+' < '+n.t.toFixed(1)+'?':'';
    it.box=n.left?el(S,'abs hid mono',lab,{left:(n._x-95)+'px',top:(n._y-26)+'px',width:'190px',height:'52px',lineHeight:'52px',textAlign:'center',fontSize:'26px',borderRadius:'10px',border:'2px solid '+C.yellow,color:C.ink,background:'#141a22'})
      :el(S,'abs hid','',{left:(n._x-22)+'px',top:(n._y-22)+'px',width:'44px',height:'44px',borderRadius:'50%',background:n.cls?C.pink:C.blue});

/* ===== S3: Gini impurity picks the cut ===== */
(function(){const S=$('S3'),sid='s3';
  const f=texLbl(S,'G = 1 - \\sum_k p_k^2',1440,210,60,C.ink);show(f,cue(sid,'gini'),.6);
  const bk=(x,cols,t,val)=>{const svg=layerSvg(S);const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);

    cols.forEach((c,i)=>svgEl('circle',{cx:x-55+(i%4)*37,cy:360+Math.floor(i/4)*36,r:15,fill:c},g));
    const l=txt(S,t+' → '+val,x,480,{color:C.ink,fontSize:'32px',fontStyle:'italic'});return [g,l]};
  const A=bk(1230,Array(8).fill(C.red),'only apples','0'),B=bk(1650,[C.red,C.yellow,C.red,C.yellow,C.yellow,C.red,C.yellow,C.red],'half and half','0.5');

/* ===== S7: routing in a mixture of experts ===== */
(function(){const S=$('S7'),sid='s7';
  const svg=layerSvg(S);
  const tok=el(S,'abs hid mono','“cat”',{left:'190px',top:'500px',width:'180px',height:'80px',lineHeight:'80px',textAlign:'center',fontSize:'40px',borderRadius:'14px',border:'3px solid '+C.blue,color:C.blue});
  const rt=el(S,'abs hid','router',{left:'560px',top:'490px',width:'220px',height:'100px',lineHeight:'100px',textAlign:'center',fontSize:'40px',borderRadius:'50px',border:'3px solid '+C.yellow,color:C.yellow});
  const ex=[];for(let i=0;i<8;i++){ex.push(el(S,'abs hid','expert '+(i+1),{left:'1150px',top:(170+i*95)+'px',width:'260px',height:'70px',lineHeight:'70px',textAlign:'center',fontSize:'32px',borderRadius:'12px',border:'2px solid '+C.dim,color:C.dim}))}
  const a0=mkArrow(svg,(x,y)=>[x,y],C.blue,5);setArrow(a0,{x0:380,y0:540,x1:380,y1:540});
  show(tok,cue(sid,'token'),.4);show(rt,cue(sid,'router'),.4);showArrow(a0,cue(sid,'router'),.2);arrowTo(a0,cue(sid,'router'),.5,{x1:550});
  show(ex,cue(sid,'expert'),.4,{stagger:.05});
  const pick=[2,5];const arr=pick.map(i=>{const a=mkArrow(svg,(x,y)=>[x,y],C.yellow,5);setArrow(a,{x0:790,y0:540,x1:790,y1:540});return [a,i]});
  arr.forEach(([a,i])=>{showArrow(a,cue(sid,'few'),.2);arrowTo(a,cue(sid,'few'),.6,{x1:1140,y1:205+i*95});tl.to(ex[i],{borderColor:C.yellow,color:C.yellow,duration:.4},cue(sid,'few')+.4)});
  const n=txt(S,'a learned, soft cousin of a branching question',960,980,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(n,cue(sid,'cousin'),.5);
  const next=el(S,'cap','next &nbsp;·&nbsp; 5.8 &nbsp;k-means clustering',{top:'1030px',fontSize:'32px',color:C.dim,fontStyle:'italic'});
  show(next,cue(sid,'next'),.7);
  sceneIn(sid);
})();

tl.to({},{duration:.01},TIMING.total-.01);
window.__timelines=window.__timelines||{};
window.__timelines["main"]=tl;
</script>
