function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov||/\\(bar|hat|underbrace|tilde)/.test(t)){d.setAttribute('data-layout-allow-overlap','');d.querySelectorAll('span').forEach(s=>s.setAttribute('data-layout-allow-overlap',''))}return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

  const eq=eqn(S,'Q^*(s,a) = \\mathbb{E}\\big[\\, r + \\gamma\\, r\' + \\gamma^2 r\'\' + \\dots \\mid s, a, \\text{then optimal}\\,\\big]',960,220,48);show(eq,cue(sid,'expect'),.6);
  const st=box(S,520,560,240,240,'state s',C.blue,{fs:40});show(st,cue(sid,'state'),.4);

  const rows=acts.map(([a,v],i)=>{const y=440+i*80;const n=txt(S,a,960,y,{fs:36,color:C.ink});const c=cellAt(S,1180,y,160,62,v.toFixed(2),C.grid,{fs:30});return [n,c]});
  show(rows.flat(),cue(sid,'pairs'),.3,{stagger:.05});

  const hl=el(S,'hl','',{left:'880px',top:'492px',width:'390px',height:'76px',borderColor:C.yellow,boxShadow:'0 0 24px #f5cf4a66'});fadeIn(hl,cue(sid,'largest'),.4);

/* ============ S3: the TD update ============ */
(function(){const S=$('S3');const sid='s3';
  const ev=[['s',C.blue,'state'],['a',C.yellow,'took'],['r',C.green,'received'],["s′",C.blue,'landed']];
  ev.forEach(([t,c,w],i)=>{const b=cellAt(S,560+i*200,230,150,90,t,c,{fs:44,ink:c});show(b,cue(sid,w),.4)});
  const evl=txt(S,'one step of evidence',860,320,{fs:32,it:true,color:C.dim});show(evl,cue(sid,'evidence'),.4);
  const tg=eqn(S,'\\text{target} = r + \\gamma\\,\\max_{a\'} Q(s\',a\')',960,450,54,{color:C.green});show(tg,cue(sid,'target'),.6);
  const up=eqn(S,'Q(s,a) \\leftarrow Q(s,a) + \\alpha\\,\\big[\\,\\text{target} - Q(s,a)\\,\\big]',960,580,58);show(up,cue(sid,'moves'),.6);
  const al=txt(S,'α: learning rate',1500,670,{fs:32,it:true,color:C.yellow});show(al,cue(sid,'alpha'),.4);
  // number line: old estimate moves toward target
  const svg=layerSvg(S);const X=v=>360+v*400;
  const nl=ln(svg,X(0),800,X(3),800,C.axis,3);fadeIn(nl,cue(sid,'estimate'),.4);
  const old=svgEl('circle',{cx:X(.5),cy:800,r:14,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);const tgt=svgEl('circle',{cx:X(2.8),cy:800,r:14,fill:'none',stroke:C.green,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
  fadeIn([old,tgt],cue(sid,'estimate'),.4);
  const ol=txt(S,'old Q',X(.5),850,{fs:30,color:C.yellow}),tl2=txt(S,'target',X(2.8),850,{fs:30,color:C.green});show([ol,tl2],cue(sid,'estimate'),.4);
  tl.to(old,{attr:{cx:X(.73)},duration:.8,ease:'power2.out'},cue(sid,'fraction'));
  const td=txt(S,'temporal difference: correct a guess with the next guess',960,940,{fs:36,it:true,color:C.ink});show(td,cue(sid,'temporal'),.4);
  const tr=txt(S,'like updating your arrival time at every station',960,1000,{fs:30,it:true,color:C.dim});show(tr,cue(sid,'station'),.4);
  sceneInOut(sid);
})();

/* ============ S4: off-policy and epsilon-greedy ============ */
(function(){const S=$('S4');const sid='s4';
  const tg=eqn(S,'r + \\gamma\\,{\\color{#f5cf4a}\\max_{a\'}}\\, Q(s\',a\')',960,220,60);show(tg,cue(sid,'max'),.5);
  const op=txt(S,'off-policy: learns the best policy while behaving differently',960,330,{fs:36,it:true,color:C.ink});show(op,cue(sid,'off-policy'),.4);
  // epsilon-greedy pie
  const svg=layerSvg(S);const cx=760,cy=680,R=200;
  const greedy=svgEl('circle',{cx,cy,r:R,fill:'#58c4dd44',stroke:C.blue,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  const a=0.2*2*Math.PI;const sl=svgEl('path',{d:`M${cx} ${cy} L${cx+R} ${cy} A${R} ${R} 0 0 1 ${cx+R*Math.cos(a)} ${cy+R*Math.sin(a)} Z`,fill:'#f5cf4a88',stroke:C.yellow,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(greedy,cue(sid,'epsilon-greedy'),.4);fadeIn(sl,cue(sid,'epsilon'),.4);

})();

/* ============ S5: convergence; watch value spread on a grid ============ */
(function(){const S=$('S5');const sid='s5';
  const th=txt(S,'Watkins &amp; Dayan, 1992: converges to Q* (every pair tried, α shrinking suitably)',960,180,{fs:34,it:true,color:C.dim});show(th,cue(sid,'proved'),.4);
  // seeded tabular Q-learning on 4x4, snapshots of max Q
  let seed=7;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const step=(s,a)=>{const r=Math.floor(s/4),c=s%4;const d=[[-1,0],[0,1],[1,0],[0,-1]][a];const r2=Math.min(3,Math.max(0,r+d[0])),c2=Math.min(3,Math.max(0,c+d[1]));const s2=r2*4+c2;return s2===15?[s2,1,true]:[s2,-0.01,false]};
  const Q=Array.from({length:16},()=>[0,0,0,0]);const snaps=[Q.map(q=>Math.max(...q))];const marks=[1,3,6,10,20,40,80,150];
  for(let ep=1;ep<=150;ep++){let s=0;for(let t=0;t<100;t++){let a;if(rnd()<0.2)a=Math.floor(rnd()*4);else{const q=Q[s];a=q.indexOf(Math.max(...q))}
      const [s2,r,done]=step(s,a);const tgt=done?r:r+0.9*Math.max(...Q[s2]);Q[s][a]+=0.5*(tgt-Q[s][a]);s=s2;if(done)break}
    if(marks.includes(ep))snaps.push(Q.map(q=>Math.max(...q)))}
  const cs=130,x0=960-1.5*cs,y0=330;const cells=[];
  for(let i=0;i<16;i++){const r=Math.floor(i/4),c=i%4;const d=cellAt(S,x0+c*cs,y0+r*cs,cs-10,cs-10,i===15?'goal':'0.00',i===15?C.green:C.grid,{fs:i===15?30:28,ink:i===15?C.green:C.ink});cells.push(d)}
  show(cells,cue(sid,'grid'),.4,{stagger:.02});
  const lab=txt(S,'episode 0',960,880,{fs:36,mono:true,color:C.yellow});show(lab,cue(sid,'grid'),.4);
  const o={k:0};const T0=cue(sid,'early'),T1=cue(sid,'lead');
  const epn=[0,...marks];
  const render=()=>{const k=Math.min(snaps.length-1,Math.floor(o.k));lab.innerHTML='episode '+epn[k];snaps[k].forEach((v,i)=>{if(i===15)return;cells[i].innerHTML=v.toFixed(2);const b=Math.max(0,Math.min(1,v));cells[i].style.background=`rgba(131,193,103,${(b*0.55).toFixed(2)})`})};
  tl.to(o,{k:snaps.length-0.01,duration:T1-T0,ease:'none',immediateRender:false,onUpdate:render},T0);
  const sp=txt(S,'value spreads backwards from the goal',960,950,{fs:34,it:true,color:C.green});show(sp,cue(sid,'spreads'),.4);
  sceneInOut(sid);
})();

/* ============ S6: DQN ============ */
(function(){const S=$('S6');const sid='s6';
  const scr=el(S,'abs','',{left:'160px',top:'300px',width:'420px',height:'320px',borderRadius:'8px',border:'3px solid #7f8b99',background:'repeating-linear-gradient(0deg,#2a6f9733 0 8px,#141a22 8px 16px)',opacity:0,visibility:'hidden'});
  const pad=el(S,'abs','',{left:'330px',top:'580px',width:'90px',height:'16px',background:C.yellow,opacity:0,visibility:'hidden'}),bl=el(S,'abs','',{left:'420px',top:'430px',width:'20px',height:'20px',borderRadius:'50%',background:C.pink,opacity:0,visibility:'hidden'});
  [pad,bl].forEach(e=>e.setAttribute('data-layout-allow-overlap',''));
  show([scr,pad,bl],cue(sid,'screen'),.4);
  const pl=txt(S,'raw pixels',370,670,{fs:32,it:true,color:C.dim});show(pl,cue(sid,'pixels'),.4);
  const svg=layerSvg(S);
  const lay=[[760,6],[900,8],[1040,8],[1180,4]];const nodes=lay.map(([x,n])=>{const ys=[];for(let i=0;i<n;i++)ys.push(460+(i-(n-1)/2)*52);return ys.map(y=>[x,y])});
  const edges=[];for(let l=0;l<3;l++)nodes[l].forEach(a=>nodes[l+1].forEach(b=>edges.push(ln(svg,a[0],a[1],b[0],b[1],C.grid,1))));
  const dots=nodes.flat().map(([x,y])=>svgEl('circle',{cx:x,cy:y,r:10,fill:C.blue,style:'opacity:0;visibility:hidden'},svg));
  tl.to(edges,{autoAlpha:.5,duration:.4},cue(sid,'neural'));tl.to(dots,{autoAlpha:1,duration:.4},cue(sid,'neural'));
  const qs=['Q(s, ←)','Q(s, →)','Q(s, fire)','Q(s, ·)'];qs.forEach((q,i)=>{const t=txt(S,q,1300,nodes[3][i][1],{fs:28,mono:true,color:C.yellow});t.style.translate='0 -50%';show(t,cue(sid,'q-network'),.3)});
  const dq=txt(S,'deep Q-network · Mnih et al., 2015',960,250,{fs:36,it:true,color:C.dim});show(dq,cue(sid,'mnih'),.4);
  const res=txt(S,'about the level of a professional human tester on many of 49 Atari games',960,780,{fs:34,color:C.ink});show(res,cue(sid,'comparable'),.4);
  const t1=box(S,620,900,560,90,'replay buffer: shuffled past experience',C.green,{fs:32}),t2=box(S,1300,900,600,90,'target network: a slowly updated copy',C.pink,{fs:32});
  show(t1,cue(sid,'replay'),.4);show(t2,cue(sid,'slowly'),.4);
  sceneInOut(sid);
})();
