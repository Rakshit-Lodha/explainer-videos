function plen(e){if(e.tagName==='line'){const a=+e.getAttribute('x1'),b=+e.getAttribute('y1'),c=+e.getAttribute('x2'),d=+e.getAttribute('y2');return Math.hypot(c-a,d-b)}return e.getTotalLength()}
function drawOn(e,time,d,ease){const L=plen(e)+2;tl.set(e,{attr:{'stroke-dasharray':`${L} ${L}`,'stroke-dashoffset':L}},0);
  tl.to(e,{autoAlpha:1,duration:.15},time);tl.to(e,{attr:{'stroke-dashoffset':0},duration:d||1,ease:ease||'power1.inOut'},time)}
/* sample y=f(x) on [x0,x1] into an SVG path through plane P */
function fpath(f,P,x0,x1,n){n=n||160;let s='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;const [px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)}return s}
/* morph a path between two functions by tweening a mix parameter */
function morphF(path,P,fa,fb,x0,x1,time,d,ease){const o={m:0};tl.to(o,{m:1,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>path.setAttribute('d',fpath(x=>fa(x)*(1-o.m)+fb(x)*o.m,P,x0,x1))},time)}
/* circular node with a label */
function node(parent,x,y,r,html,color,fs){const n=el(parent,'node',html,{left:(x-r)+'px',top:(y-r)+'px',width:2*r+'px',height:2*r+'px',borderColor:color||C.ink,fontSize:(fs||Math.round(r*.7))+'px',color:C.ink});n.cx=x;n.cy=y;n.r=r;return n}
/* rounded box with a label */
function boxEl(parent,x,y,w,h,html,color,fs){const b=el(parent,'box',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.ink,fontSize:(fs||40)+'px'});b.cx=x;b.cy=y;b.w=w;b.h=h;return b}
/* edge between two circle nodes (stops at their rims) */
function edge(svg,a,b,color,w,arrow){const dx=b.cx-a.cx,dy=b.cy-a.cy,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;const ra=a.r||a.w/2,rb=b.r||b.w/2;
  return ln(svg,a.cx+ux*ra,a.cy+uy*ra,b.cx-ux*(rb+(arrow?6:0)),b.cy-uy*(rb+(arrow?6:0)),color||C.dim,w||3)}
/* count a number shown in an element from a to b */
function countTo(e,time,d,a,b,dp){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.textContent=fmt(o.v,dp)}},time)}
/* bracketed matrix of strings; cells[r][c] */
function matrix(parent,cx,cy,rows,o){o=o||{};const fs=o.fs||44,cw=o.cw||fs*2.4,rowH=fs*1.35,pad=fs*.3,nr=rows.length,nc=rows[0].length,W=nc*cw+36,H=nr*rowH+pad*2;
  const box=el(parent,'colv hid','',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=rows.map((r,i)=>r.map((v,j)=>el(box,'cell',v,{left:(18+j*cw)+'px',top:(pad+i*rowH)+'px',width:cw+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink})));
  return {box,cells,cx,cy,W,H,rowH,cw,pad,nr,nc}}
function rowHL(parent,m,i,color){return el(parent,'hl','',{left:(m.cx-m.W/2+10)+'px',top:(m.cy-m.H/2+m.pad+i*m.rowH-2)+'px',width:(m.W-20)+'px',height:(m.rowH+4)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function colHL(parent,m,j,color){return el(parent,'hl','',{left:(m.cx-m.W/2+18+j*m.cw)+'px',top:(m.cy-m.H/2+6)+'px',width:m.cw+'px',height:(m.H-12)+'px',borderColor:color,boxShadow:`0 0 20px ${color}55`})}
function nextCap(S,sid,word,n,txt){const c=el(S,'cap','next &nbsp;·&nbsp; '+txt,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(c,cue(sid,word,n),.7);return c}

/* a batch x features grid of numbers */
function grid(S,cx,cy,rows,cols,cw,ch,seed){const rnd=seedRand(seed);const cells=[];const x0=cx-cols*cw/2,y0=cy-rows*ch/2;
  const box=el(S,'abs','',{left:x0+'px',top:y0+'px',width:cols*cw+'px',height:rows*ch+'px',opacity:0,visibility:'hidden'});
  for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++){const v=(rnd()*2-1)*(1+c)+c*1.5;const d=el(box,'abs mono',fmt(v,1),{left:c*cw+'px',top:r*ch+'px',width:(cw-6)+'px',height:(ch-6)+'px',lineHeight:(ch-6)+'px',textAlign:'center',fontSize:'28px',background:'#161d27',border:'1px solid #2a3442',borderRadius:'8px',color:C.ink});row.push(d)}cells.push(row)}
  return {box,cells,x0,y0,cw,ch,rows,cols}}
function colBox(S,G,c,color){return el(S,'hl','',{left:(G.x0+c*G.cw-6)+'px',top:(G.y0-8)+'px',width:(G.cw+6)+'px',height:(G.rows*G.ch+10)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function rowBox(S,G,r,color){return el(S,'hl','',{left:(G.x0-8)+'px',top:(G.y0+r*G.ch-6)+'px',width:(G.cols*G.cw+10)+'px',height:(G.ch+6)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}

/* ============ S1: a moving target ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const P=plane(960,560,110);
  const ax=ln(svg,P(-7,0)[0],560,P(7,0)[0],560,C.axis,3);drawOn(ax,at(sid,0),.6);
  const tk=[];for(let v=-6;v<=6;v+=2){tk.push(ln(svg,P(v,0)[0],550,P(v,0)[0],570,C.axis,2));const t=el(S,'lbl',`<span class="mono" style="font-size:26px">${fmt(v,0)}</span>`,{color:C.dim});place(t,P(v,0)[0],600);tk.push(t)}
  fadeIn(tk,at(sid,.01),.5);
  const rnd=seedRand(8);const base=[];for(let i=0;i<40;i++){let s=0;for(let k=0;k<4;k++)s+=rnd();base.push((s-2)*1.7)}
  const dots=base.map((v,i)=>svgEl('circle',{r:11,fill:C.blue,opacity:.85,style:'opacity:0;visibility:hidden'},svg));
  const st={m:0,s:1};const ap=()=>dots.forEach((d,i)=>{const x=base[i]*st.s+st.m;const p=P(x,0);d.setAttribute('cx',p[0]);d.setAttribute('cy',p[1]-22-(i%5)*22)});ap();
  tl.to(dots,{autoAlpha:1,duration:.2,stagger:.02},cue(sid,'network'));
  const lab=el(S,'lbl','what layer 5 receives',{color:C.dim,fontSize:'36px',fontStyle:'italic'});place(lab,960,330);show(lab,cue(sid,'numbers'),.4);
  const drift=[[2.2,1.6],[-1.5,.7],[3.0,2.2],[.8,1.2]];
  drift.forEach(([m,s],i)=>tl.to(st,{m,s,duration:1.1,ease:'power1.inOut',immediateRender:false,onUpdate:ap},cue(sid,'drift')+i*1.2));
  const mt=el(S,'cap','each later layer chases a moving target',{top:'760px',fontStyle:'italic',fontSize:'46px'});show(mt,cue(sid,'moving'),.5);
  tl.to(st,{m:0,s:.58,duration:1.2,ease:'power2.inOut',immediateRender:false,onUpdate:ap},cue(sid,'rescale'));
  tl.to(dots,{attr:{fill:C.green},duration:.6},cue(sid,'rescale'));
  const band=svgEl('rect',{x:P(-1,0)[0],y:470,width:P(1,0)[0]-P(-1,0)[0],height:110,fill:C.green,'fill-opacity':.1,stroke:C.green,'stroke-width':2,'stroke-dasharray':'8 6',style:'opacity:0;visibility:hidden'},svg);
  fadeIn(band,cue(sid,'standard'),.4);
  fadeOut(mt,cue(sid,'normalisation')-.2,.3);
  const nr=el(S,'cap','normalisation: always arrive in a standard range',{top:'760px',fontStyle:'italic',fontSize:'46px',color:C.green});show(nr,cue(sid,'standard'),.5);
  sceneInOut(sid);
})();

/* ============ S2: grading on a curve ============ */
(function(){const S=$('S2');const sid='s2';
  const svg=layerSvg(S);
  const scores=[52,61,64,70,73,75,79,84,88,91];const mu=scores.reduce((a,b)=>a+b)/scores.length;const sd=Math.sqrt(scores.reduce((a,b)=>a+(b-mu)**2,0)/scores.length);
  const P=v=>200+v*16;     // raw score axis (0..100)
  const Q=v=>960+v*220;    // normalised axis (-3..3)
  const ax=ln(svg,200,440,1800,440,C.axis,3);drawOn(ax,at(sid,.01),.6);
  const st={m:0,s:0};
  const dots=scores.map(v=>svgEl('circle',{r:14,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg));
  const ap=()=>dots.forEach((d,i)=>{const raw=P(scores[i]);const cen=P(scores[i]-mu+50)-P(50)+960;const nor=Q((scores[i]-mu)/sd);let x=raw+(cen-raw)*st.m;x=x+(nor-cen)*st.s;d.setAttribute('cx',x);d.setAttribute('cy',440-(i%2)*30-16)});ap();
  tl.to(dots,{autoAlpha:1,duration:.2,stagger:.06},cue(sid,'group'));
  const mk=el(S,'lbl','',{color:C.pink,fontSize:'32px'});mk.innerHTML=`mean ≈ ${mu.toFixed(0)}`;place(mk,P(mu),520);show(mk,cue(sid,'mean'),.4);
  const mline=ln(svg,P(mu),380,P(mu),470,C.pink,4);fadeIn(mline,cue(sid,'mean'),.3);
  tl.to(st,{m:1,duration:1.2,ease:'power2.inOut',immediateRender:false,onUpdate:ap},cue(sid,'centred'));
  tl.to(mline,{attr:{x1:960,x2:960},duration:1.2,ease:'power2.inOut'},cue(sid,'centred'));
  tl.to(mk,{x:960-P(mu),duration:1.2,ease:'power2.inOut'},cue(sid,'centred'));
  tl.to(st,{s:1,duration:1.2,ease:'power2.inOut',immediateRender:false,onUpdate:ap},cue(sid,'divide'));fadeOut(mk,cue(sid,'divide'),.3);
  const ticks=[-2,-1,0,1,2].map(v=>{const t=el(S,'lbl',`<span class="mono" style="font-size:26px">${fmt(v,0)}</span>`,{color:C.dim});place(t,Q(v),480);return t});fadeIn(ticks,cue(sid,'one',2),.4);
  const f1=el(S,'cap',tex('\\hat{x}=\\frac{x-\\mu}{\\sqrt{\\sigma^2+\\varepsilon}}',62),{top:'600px'});show(f1,cue(sid,'deviation'),.6);
  const eps=el(S,'lbl',tex('\\varepsilon',44)+'<span style="font-size:32px;font-style:italic">: a tiny constant, never divide by zero</span>',{color:C.dim});place(eps,960,770);show(eps,cue(sid,'tiny'),.5);
  fadeOut(eps,cue(sid,'because')-.1,.3);
  const f2=el(S,'cap',tex('y={\\color{#f5cf4a}\\gamma}\\,\\hat{x}+{\\color{#e77fb3}\\beta}',62),{top:'800px'});show(f2,cue(sid,'learned'),.6);
  [f1,f2].forEach(f=>f.querySelectorAll('*').forEach(e=>e.setAttribute('data-layout-allow-overlap','')));
  const gb=el(S,'lbl','learned scale and shift',{color:C.ink,fontSize:'36px',fontStyle:'italic'});place(gb,960,940);show(gb,cue(sid,'gamma'),.4);
  const tc=el(S,'abs','',{left:'200px',top:'170px',width:'900px',fontSize:'40px',fontStyle:'italic',opacity:0,visibility:'hidden'});tc.innerHTML='grading on a curve';show(tc,cue(sid,'teacher'),.5);
  sceneInOut(sid);
})();

/* ============ S3: batch norm: down the columns ============ */
(function(){const S=$('S3');const sid='s3';
  const G=grid(S,820,560,6,5,140,80,3);
  show(G.box,cue(sid,'group'),.5);
  const ex=el(S,'lbl','examples in the batch',{color:C.dim,fontSize:'34px',fontStyle:'italic'});place(ex,G.x0-150,560);ex.style.transform='rotate(-90deg)';
  const fe=el(S,'lbl','features',{color:C.dim,fontSize:'34px',fontStyle:'italic'});place(fe,820,G.y0-50);
  show([ex,fe],cue(sid,'group'),.4);
  const t=el(S,'abs','',{left:'1300px',top:'250px',width:'560px',fontSize:'48px',color:C.blue,opacity:0,visibility:'hidden'});t.innerHTML='batch norm';show(t,cue(sid,'batch'),.5);
  const who=el(S,'abs','',{left:'1300px',top:'320px',width:'560px',fontSize:'30px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});who.innerHTML='Ioffe and Szegedy, 2015';show(who,cue(sid,'ioffe'),.4);
  const cb=[0,1,2,3,4].map(c=>colBox(S,G,c,C.blue));
  cb.forEach((b,c)=>{fadeIn(b,cue(sid,'feature')+c*.9,.3);if(c<4)fadeOut(b,cue(sid,'feature')+c*.9+.8,.2)});
  const d1=el(S,'abs','',{left:'1300px',top:'420px',width:'560px',fontSize:'38px',fontStyle:'italic',lineHeight:'1.4',opacity:0,visibility:'hidden'});d1.innerHTML='one feature at a time,<br>mean and spread across the batch';show(d1,cue(sid,'across'),.5);
  const w=el(S,'abs','',{left:'1300px',top:'640px',width:'560px',fontSize:'34px',fontStyle:'italic',color:C.red,lineHeight:'1.4',opacity:0,visibility:'hidden'});w.innerHTML='ties examples together:<br>running averages at test time,<br>trouble with small batches';show(w,cue(sid,'ties'),.5);
  sceneInOut(sid);
})();

/* ============ S4: layer norm: along the rows ============ */
(function(){const S=$('S4');const sid='s4';
  const G=grid(S,820,560,6,5,140,80,3);gsap.set(G.box,{autoAlpha:1});
  const ex=el(S,'lbl','tokens',{color:C.dim,fontSize:'34px',fontStyle:'italic'});place(ex,G.x0-110,560);ex.style.transform='rotate(-90deg)';
  const fe=el(S,'lbl','features',{color:C.dim,fontSize:'34px',fontStyle:'italic'});place(fe,820,G.y0-50);fadeIn([fe],at(sid,0),.3);
  const t=el(S,'abs','',{left:'1300px',top:'250px',width:'560px',fontSize:'48px',color:C.yellow,opacity:0,visibility:'hidden'});t.innerHTML='layer norm';show(t,cue(sid,'layer'),.5);
  const who=el(S,'abs','',{left:'1300px',top:'320px',width:'560px',fontSize:'30px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});who.innerHTML='Ba, Kiros and Hinton, 2016';show(who,cue(sid,'ba'),.4);
  const rb=[0,1,2,3,4,5].map(r=>rowBox(S,G,r,C.yellow));

  const d1=el(S,'abs','',{left:'1300px',top:'420px',width:'560px',fontSize:'38px',fontStyle:'italic',lineHeight:'1.4',opacity:0,visibility:'hidden'});d1.innerHTML='one example at a time,<br>across its own features';show(d1,cue(sid,'across'),.5);
  show(ex,cue(sid,'token'),.4);
  const ok=el(S,'abs','',{left:'1300px',top:'640px',width:'560px',fontSize:'34px',fontStyle:'italic',color:C.green,lineHeight:'1.4',opacity:0,visibility:'hidden'});ok.innerHTML='no batch dependence:<br>training and inference identical';show(ok,cue(sid,'nothing'),.5);
  sceneInOut(sid);

/* ============ S5: why it helps ============ */
(function(){const S=$('S5');const sid='s5';
  const svg=layerSvg(S);
  const PA=plane(520,700,95,45),PB=plane(1400,700,95,45);
  const rough=x=>.5*x*x+1.4*Math.sin(3.1*x)+.8*Math.sin(7*x),smooth=x=>.5*x*x;
  const a=pth(svg,fpath(rough,PA,-3.2,3.2,300),C.red,5),b=pth(svg,fpath(smooth,PB,-3.2,3.2,300),C.green,5);
  const db=el(S,'abs','',{left:'200px',top:'120px',width:'1500px',fontSize:'40px',fontStyle:'italic',opacity:0,visibility:'hidden'});db.innerHTML='the original explanation (inputs stop shifting) is <span style="color:#fc6255">still debated</span>';show(db,cue(sid,'explanation'),.5);
  drawOn(a,cue(sid,'later'),1);drawOn(b,cue(sid,'smoother'),1);
  const la=el(S,'lbl','without normalisation',{color:C.red,fontSize:'34px',fontStyle:'italic'});place(la,520,880);const lb=el(S,'lbl','smoother loss landscape',{color:C.green,fontSize:'34px',fontStyle:'italic'});place(lb,1400,880);
  show(la,cue(sid,'later'),.4);show(lb,cue(sid,'smoother'),.4);
  // big confident steps on the smooth bowl
  const ball=svgEl('circle',{r:14,fill:C.yellow,style:'opacity:0;visibility:hidden'},svg);const st={x:-3};const ap=()=>{const p=PB(st.x,smooth(st.x));ball.setAttribute('cx',p[0]);ball.setAttribute('cy',p[1]-14)};ap();
  fadeIn(ball,cue(sid,'larger'),.3);[-1.4,-.4,-.05].forEach((x,i)=>tl.to(st,{x,duration:.45,ease:'power2.out',immediateRender:false,onUpdate:ap},cue(sid,'larger')+.3+i*.6));
  const lr=el(S,'cap','larger learning rates; faster, more reliable training',{top:'960px',fontSize:'42px',fontStyle:'italic'});show(lr,cue(sid,'practical'),.5);
  sceneInOut(sid);
})();

/* ============ S6: inside a transformer block ============ */
(function(){const S=$('S6');const sid='s6';
  const svg=layerSvg(S);
  const X=420;
  const stream=ln(svg,X,960,X,140,C.teal,7);drawOn(stream,at(sid,.02),.8);
  const sl=el(S,'lbl','residual stream',{color:C.teal,fontSize:'30px',fontStyle:'italic'});place(sl,X,110);fadeIn(sl,at(sid,.05),.4);
  const mk=(y,t,c)=>{const ln1=boxEl(S,720,y,220,70,'<span style="font-size:28px">LayerNorm</span>',C.yellow);const sb=boxEl(S,1020,y,250,70,`<span style="font-size:28px">${t}</span>`,c);
    const a1=pth(svg,`M${X} ${y+70} L${X+70} ${y+70} L${X+70} ${y} L610 ${y}`,C.dim,3),a2=pth(svg,`M830 ${y} L895 ${y}`,C.dim,3),a3=pth(svg,`M1145 ${y} L1200 ${y} L1200 ${y-80} L${X+14} ${y-80}`,C.dim,3);
    const plus=node(S,X,y-80,22,'+',C.teal,28);return [ln1,sb,a1,a2,a3,plus]};
  const B1=mk(760,'attention',C.blue),B2=mk(460,'MLP',C.pink);
  [B1,B2].forEach((B,i)=>{show(B[0],cue(sid,'layer')+i*.3,.4);show(B[1],cue(sid,'layer')+i*.3,.4);show(B[5],cue(sid,'layer')+i*.3,.4);[B[2],B[3],B[4]].forEach(p=>drawOn(p,cue(sid,'layer')+i*.3,.6))});
  const glow=[B1[0],B2[0]];tl.to(glow,{boxShadow:'0 0 34px #f5cf4aaa',duration:.4,yoyo:true,repeat:3},cue(sid,'entrance'));
  const pre=el(S,'abs','',{left:'1300px',top:'560px',width:'560px',fontSize:'36px',fontStyle:'italic',lineHeight:'1.4',opacity:0,visibility:'hidden'});pre.innerHTML='GPT-2: norm at the <span style="color:#f5cf4a">entrance</span> of each sub-block (pre-norm)';show(pre,cue(sid,'entrance'),.5);
  const rms=el(S,'abs','',{left:'1300px',top:'250px',width:'580px',opacity:0,visibility:'hidden'});rms.innerHTML='<div style="font-size:40px;color:#5cd0b3;margin-bottom:14px">RMSNorm (LLaMA)</div>'+tex('y=\\gamma\\,\\frac{x}{\\sqrt{\\tfrac1n\\sum_i x_i^2+\\varepsilon}}',46);
  show(rms,cue(sid,'rmsnorm'),.6);
  const nm=el(S,'abs','',{left:'1300px',top:'440px',width:'580px',fontSize:'32px',fontStyle:'italic',color:C.dim,opacity:0,visibility:'hidden'});nm.innerHTML='no mean subtraction: divide by the root mean square';show(nm,cue(sid,'skips'),.5);
  sceneInOut(sid);
})();

/* ============ S7: recap ============ */
(function(){const S=$('S7');const sid='s7';
  const G=grid(S,960,500,5,5,130,74,9);show(G.box,at(sid,.02),.5);
  const c=colBox(S,G,1,C.blue),r=rowBox(S,G,3,C.yellow);
  fadeIn(c,cue(sid,'batch'),.4);fadeIn(r,cue(sid,'token'),.4);
  const cl=el(S,'lbl','batch norm: across the batch (images)',{color:C.blue,fontSize:'36px',fontStyle:'italic'});place(cl,960,190);show(cl,cue(sid,'batch'),.4);
  const rl=el(S,'lbl','layer norm: within each token (language)',{color:C.yellow,fontSize:'36px',fontStyle:'italic'});place(rl,960,810);show(rl,cue(sid,'token'),.4);
  nextCap(S,sid,'next',1,'6.9 &nbsp;dropout and generalization');
  sceneInOut(sid,true);
})();
