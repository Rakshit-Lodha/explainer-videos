function colvec(parent,cx,cy,vals,o){o=o||{};const fs=o.fs||64,w=o.w||140,rowH=fs*1.3,pad=fs*.25,H=vals.length*rowH+pad*2;
  const box=el(parent,'colv'+(o.hidden===false?'':' hid'),'',{left:(cx-w/2)+'px',top:(cy-H/2)+'px',width:w+'px',height:H+'px',color:o.color||C.ink});
  el(box,'br l','',{height:H+'px'});el(box,'br r','',{height:H+'px'});
  const cells=vals.map((v,i)=>el(box,'cell',v,{top:(pad+i*rowH)+'px',width:w+'px',height:rowH+'px',lineHeight:rowH+'px',fontSize:fs+'px',color:o.ink||C.ink}));
  return {box,cells,cx,cy,w,H,rowH,pad}}
function cellHL(parent,cv,i,color){const pad=6;return el(parent,'hl','',{left:(cv.cx-cv.w/2+10)+'px',top:(cv.cy-cv.H/2+cv.pad+i*cv.rowH-2)+'px',width:(cv.w-20)+'px',height:(cv.rowH+4)+'px',borderColor:color,boxShadow:`0 0 24px ${color}66`})}
function sym(parent,ch,x,y,size){return el(parent,'sym',ch,{left:(x-30)+'px',top:(y-size*.62)+'px',fontSize:size+'px',width:'60px'})}


/* ---- extra helpers for plots, equations and code panels (module 5 and 7 lessons) ---- */
/* axes: plain x/y axes for a plot region, with optional axis captions */
function axes(svg,P,x0,x1,y0,y1,o){o=o||{};const g=svgEl('g',{},svg);
  if(o.grid){for(let x=Math.ceil(x0);x<=x1;x+=(o.step||1)){const a=P(x,y0),b=P(x,y1);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}
    for(let y=Math.ceil(y0);y<=y1;y+=(o.step||1)){const a=P(x0,y),b=P(x1,y);svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.grid,'stroke-width':1.4,opacity:.45},g)}}
  const ya=o.yAxisAt??y0,xa=o.xAxisAt??x0;const a=P(x0,ya),b=P(x1,ya),c=P(xa,y0),d=P(xa,y1);
  svgEl('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  svgEl('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:C.axis,'stroke-width':3,opacity:.9},g);
  return g}
/* fnPath: SVG path data for y=f(x) sampled on [a,b] */
function fnPath(P,f,a,b,n){n=n||120;let s='';for(let i=0;i<=n;i++){const x=a+(b-a)*i/n,[px,py]=P(x,f(x));s+=(i?'L':'M')+px.toFixed(1)+','+py.toFixed(1)}return s}
function polyPath(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('')}
function mkPath(svg,d,color,w,extra){return svgEl('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':w||5,'stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'},extra||{}),svg)}
/* drawOn: reveal a stroke from start to end */
function drawOn(p,time,d){p.setAttribute('pathLength','1');tl.set(p,{attr:{'stroke-dasharray':'1 1','stroke-dashoffset':1}},0);
  tl.to(p,{autoAlpha:1,duration:.15},time);tl.to(p,{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut'},time)}
/* morphFn: a path that follows f(x; s) as the proxy s moves; returns a stepper */
function morphFn(p,P,f,a,b,s0,n){const o={s:s0};const upd=()=>p.setAttribute('d',fnPath(P,x=>f(x,o.s),a,b,n));upd();
  return (time,d,s,ease)=>tl.to(o,{s,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:upd},time)}
/* a proxy-driven updater: o is tweened, fn(o) redraws everything that depends on it */
function driver(o,fn){fn(o);return (time,d,to,ease)=>tl.to(o,{...to,duration:d,ease:ease||'power2.inOut',immediateRender:false,onUpdate:()=>fn(o)},time)}
function dot(svg,x,y,r,color,hidden){return svgEl('circle',{cx:x,cy:y,r:r||9,fill:color||C.blue,style:hidden===false?'':'opacity:0;visibility:hidden'},svg)}
/* texLbl: a hidden KaTeX label centred at (x,y) */
function texLbl(parent,s,x,y,size,color){const d=el(parent,'lbl',tex(s,size||56),{color:color||C.ink});place(d,x,y);return d}
function txt(parent,s,x,y,o){o=o||{};const d=el(parent,'lbl',s,Object.assign({color:C.ink,fontSize:'40px'},o));place(d,x,y);return d}
/* codeBox: a monospace panel; lines may contain <span> colouring */
function codeBox(parent,lines,x,y,w,fs){fs=fs||34;const b=el(parent,'abs hid','',{left:x+'px',top:y+'px',width:w+'px',padding:'26px 34px',borderRadius:'18px',background:'#161c25',border:'2px solid #2b3644',fontFamily:"'JetBrains Mono',monospace",fontSize:fs+'px',lineHeight:'1.55',color:C.ink,whiteSpace:'pre'});
  const rows=lines.map(l=>el(b,'',l,{position:'relative'}));return {box:b,rows}}
const kw=s=>`<span style="color:#e77fb3">${s}</span>`,cm=s=>`<span style="color:#7f8b99">${s}</span>`,nm=s=>`<span style="color:#f5cf4a">${s}</span>`,fnc=s=>`<span style="color:#58c4dd">${s}</span>`;
function sceneIn(sid){const s=$(sid.toUpperCase());tl.to(s,{opacity:1,duration:.5,ease:'none'},START[sid])}

const root=$('root');
/* grid of cells: returns the group and its cells */
function grid(svg,x,y,rows,cols,cs,col,op,hidden){const g=svgEl('g',hidden===false?{}:{style:'opacity:0;visibility:hidden'},svg);const cells=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)cells.push(svgEl('rect',{x:x+c*cs,y:y+r*cs,width:cs-3,height:cs-3,rx:3,fill:col,'fill-opacity':op||.7},g));return {g,cells}}
const mono=(S,t,x,y,size,color)=>{const d=el(S,'lbl mono',t,{color:color||C.ink,fontSize:(size||40)+'px'});place(d,x,y);return d};

/* ===== S1: scalar, vector, matrix, stack ===== */
(function(){const S=$('S1'),sid='s1';const svg=layerSvg(S);
  const a=grid(svg,300,520,1,1,60,C.yellow),b=grid(svg,560,340,6,1,60,C.blue),c=grid(svg,820,340,6,5,60,C.green);

  show(mono(S,'0 axes',330,760,32,C.dim),cue(sid,'single'),.4);fadeIn(a.g,cue(sid,'single'),.4);
  show(mono(S,'1 axis',590,760,32,C.dim),cue(sid,'vector'),.4);fadeIn(b.g,cue(sid,'vector'),.4);
  show(mono(S,'2 axes',968,760,32,C.dim),cue(sid,'matrix'),.4);fadeIn(c.g,cue(sid,'matrix'),.4);
  show(mono(S,'3 axes',1480,760,32,C.dim),cue(sid,'pile'),.4);d.forEach((o,k)=>fadeIn(o.g,cue(sid,'pile')+k*.2,.4));

  const bug=txt(S,'most bugs: mismatched axes',960,900,{color:C.red,fontSize:'44px',fontStyle:'italic'});show(bug,cue(sid,'bugs'),.5);
  sceneInOut(sid);
})();

/* ===== S2: reading a shape ===== */
(function(){const S=$('S2'),sid='s2';const svg=layerSvg(S);
  const shp=el(S,'lbl mono','',{fontSize:'72px',color:C.ink});shp.innerHTML='(<span id="d0">32</span>, <span id="d1">128</span>, <span id="d2">768</span>)';place(shp,960,200);show(shp,cue(sid,'shape'),.5);
  const spans=[0,1,2].map(i=>shp.querySelector('#d'+i));
  // stack of slabs: batch -> tokens -> numbers
  const slabs=[];for(let k=5;k>=0;k--){const g=grid(svg,560+k*34,430-k*34,8,14,30,k===0?C.blue:C.grid,k===0?.75:.35);slabs.push(g)}
  slabs.forEach((s,k)=>fadeIn(s.g,cue(sid,'library')+k*.1,.4));
  const L=[['floors → sentences',C.yellow,'floors'],['shelves → tokens',C.teal,'shelves'],['books → numbers',C.pink,'books']];
  L.forEach(([t,c,w],i)=>{const d=txt(S,t,1560,430+i*80,{color:c,fontSize:'38px',fontStyle:'italic'});show(d,cue(sid,w),.4);tl.to(spans[i],{color:c,duration:.3},cue(sid,w))});
  const r1=svgEl('rect',{x:556,y:426,width:14*30+4,height:34,fill:'none',stroke:C.teal,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  const r2=svgEl('rect',{x:556,y:426,width:34,height:34,fill:'none',stroke:C.pink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  fadeIn(r1,cue(sid,'tokens'),.3);fadeIn(r2,cue(sid,'vector'),.3);
  const rd=txt(S,'read from the outside in',960,900,{color:C.dim,fontSize:'38px',fontStyle:'italic'});show(rd,cue(sid,'outside'),.4);
  sceneInOut(sid);
})();

/* ===== S3: batching and one matrix multiplication ===== */
(function(){const S=$('S3'),sid='s3';const svg=layerSvg(S);
  const rows=[];for(let i=0;i<6;i++){const g=grid(svg,200,300+i*52,1,8,48,C.blue,.75);rows.push(g)}
  rows.forEach((g,i)=>{tl.fromTo(g.g,{autoAlpha:0,x:-120+i*0,y:-40},{autoAlpha:1,x:0,y:0,duration:.5,immediateRender:false},cue(sid,'stacking')+i*.15)});
  const xl=mono(S,'X: (B, d_in)',392,660,34,C.blue);show(xl,cue(sid,'matrix'),.4);
  const W=grid(svg,760,300,8,5,40,C.yellow,.7);fadeIn(W.g,cue(sid,'weight'),.5);
  const wl=mono(S,'W: (d_in, d_out)',860,660,34,C.yellow);show(wl,cue(sid,'weight'),.4);
  const eq=sym(S,'=',1060,460,70);show(eq,cue(sid,'gives'),.4);
  const O=grid(svg,1140,300,6,5,48,C.pink,.75);fadeIn(O.g,cue(sid,'gives'),.5);
  const ol=mono(S,'(B, d_out)',1260,660,34,C.pink);show(ol,cue(sid,'gives'),.4);
  const at_=sym(S,'@',690,460,60);show(at_,cue(sid,'weight'),.4);
  const rule=el(S,'lbl mono','',{fontSize:'48px',color:C.ink});rule.innerHTML='(B, <span style="color:#f5cf4a">d_in</span>) @ (<span style="color:#f5cf4a">d_in</span>, d_out) → (B, d_out)';place(rule,960,800);show(rule,cue(sid,'inner'),.5);
  const hr=svgEl('rect',{x:196,y:296,width:8*48+4,height:52,fill:'none',stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg),hc=svgEl('rect',{x:756,y:296,width:44,height:8*40+4,fill:'none',stroke:C.ink,'stroke-width':3,style:'opacity:0;visibility:hidden'},svg);
  fadeIn([hr,hc],cue(sid,'row',2),.3);
  const dp=txt(S,'each output = one row · one column',960,900,{color:C.dim,fontSize:'36px',fontStyle:'italic'});show(dp,cue(sid,'dot'),.4);
  const sv=txt(S,'inner lengths match and disappear; outer ones survive',960,960,{color:C.teal,fontSize:'36px',fontStyle:'italic'});show(sv,cue(sid,'survive'),.4);

/* ===== S4: broadcasting a bias ===== */
(function(){const S=$('S4'),sid='s4';const svg=layerSvg(S);
  const M=grid(svg,260,340,6,5,56,C.pink,.6);fadeIn(M.g,at(sid,.02),.5);

  const ml=mono(S,'(B, d_out)',400,720,34,C.pink),bl=mono(S,'(d_out,)',670,248,30,C.yellow);show(ml,at(sid,.02),.4);show(bl,cue(sid,'bias'),.4);

  const ru=el(S,'abs hid','',{left:'1000px',top:'520px',width:'760px',fontSize:'36px',lineHeight:'1.5'});

  const ghosts=[];for(let r=0;r<6;r++){const g=grid(svg,260,340+r*56,1,5,56,C.yellow,.45);ghosts.push(g.g)}

  const ok=txt(S,'the same bias added to every row',1380,760,{color:C.teal,fontSize:'38px',fontStyle:'italic'});show(ok,cue(sid,'every'),.4);
  sceneInOut(sid);
})();

/* ===== S5: the silent (B,1) - (B,) bug ===== */
(function(){const S=$('S5'),sid='s5';const svg=layerSvg(S);const B=6,cs=60,x0=700,y0=330;
  const col=grid(svg,x0-cs-30,y0,B,1,cs,C.blue,.8),row=grid(svg,x0,y0-cs-30,1,B,cs,C.yellow,.8);

})();

/* ===== S6: reductions and keepdims ===== */
