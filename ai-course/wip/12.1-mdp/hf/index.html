.colv{position:absolute}

.hl{position:absolute;border-radius:12px;border:3px solid;opacity:0;visibility:hidden}

.cap{position:absolute;width:1920px;left:0;text-align:center;font-size:56px;opacity:0;visibility:hidden}

.chip{position:absolute;padding:14px 34px;border-radius:40px;border:2px solid;font-size:44px;opacity:0;visibility:hidden;white-space:nowrap}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid;border-radius:18px;background:#141a22;opacity:0;visibility:hidden;line-height:1.2;padding:0 14px}
.txt{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;visibility:hidden}
.para{position:absolute;opacity:0;visibility:hidden;line-height:1.3}
.cell2{position:absolute;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',ui-monospace,monospace;border:2px solid;border-radius:8px;opacity:0;visibility:hidden}

function box(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'node',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color||C.blue,color:o.ink||C.ink,fontSize:(o.fs||40)+'px'});if(o.bg)d.style.background=o.bg;if(o.mono)d.classList.add('mono');if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function txt(parent,html,x,y,o){o=o||{};const d=el(parent,'txt'+(o.mono?' mono':''),html,{fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal'});place(d,x,y);if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function para(parent,html,x,y,w,o){o=o||{};const d=el(parent,'para',html,{left:x+'px',top:y+'px',width:w+'px',fontSize:(o.fs||40)+'px',color:o.color||C.ink,fontStyle:o.it?'italic':'normal',textAlign:o.align||'left'});if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function ln(svg,x1,y1,x2,y2,color,w,o){o=o||{};const a={x1,y1,x2,y2,stroke:color,'stroke-width':w||4,'stroke-linecap':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('line',a,svg)}
function pth(svg,d,color,w,o){o=o||{};const a={d,stroke:color,'stroke-width':w||5,fill:o.fill||'none','stroke-linecap':'round','stroke-linejoin':'round',style:'opacity:0;visibility:hidden'};if(o.dash)a['stroke-dasharray']=o.dash;return svgEl('path',a,svg)}
function drawOn(e,time,d){e.setAttribute('pathLength','1');e.setAttribute('stroke-dasharray','1 1');e.setAttribute('stroke-dashoffset','1');tl.to(e,{autoAlpha:1,duration:.15},time);tl.fromTo(e,{attr:{'stroke-dashoffset':1}},{attr:{'stroke-dashoffset':0},duration:d||1,ease:'power1.inOut',immediateRender:false},time)}
function pxArrow(svg,color,w,x0,y0,x1,y1,label,lx,ly,parent){const a=mkArrow(svg,(x,y)=>[x,y],color,w,label,lx,ly,parent);setArrow(a,{x0,y0,x1,y1});return a}
function growPx(a,time,d){const t={...a.st};setArrow(a,{x1:t.x0,y1:t.y0});showArrow(a,time,.2);arrowTo(a,time,d||.7,{x1:t.x1,y1:t.y1},'power2.out')}
function pts2d(f,a,b,n){const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return p}
function polyD(P,pts){return pts.map((q,i)=>{const [x,y]=P(q[0],q[1]);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ')}
function countTo(e,time,d,a,b,f){const o={v:a};tl.to(o,{v:b,duration:d,ease:'power1.inOut',immediateRender:false,onUpdate:()=>{e.innerHTML=f(o.v)}},time)}
function cellAt(parent,x,y,w,h,html,color,o){o=o||{};const d=el(parent,'cell2',html,{left:(x-w/2)+'px',top:(y-h/2)+'px',width:w+'px',height:h+'px',borderColor:color,color:o.ink||C.ink,fontSize:(o.fs||30)+'px'});if(o.bg)d.style.background=o.bg;if(o.ov)d.setAttribute('data-layout-allow-overlap','');return d}
function eqn(parent,t,x,y,size,o){o=o||{};const d=el(parent,'abs',tex(t,size||56),{left:x+'px',top:y+'px',translate:'-50% -50%',whiteSpace:'nowrap',opacity:0,visibility:'hidden',color:o.color||C.ink});if(o.ov||/\\(bar|hat|underbrace|tilde)/.test(t)){d.setAttribute('data-layout-allow-overlap','');d.querySelectorAll('span').forEach(s=>s.setAttribute('data-layout-allow-overlap',''))}return d}
function nextUp(S,sid,word,n,html){const d=el(S,'cap','next &nbsp;·&nbsp; '+html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(d,cue(sid,word,n),.7);return d}

/* ============ S1: learning from consequences ============ */
(function(){const S=$('S1');const sid='s1';
  const svg=layerSvg(S);
  const wheel=(cx)=>{const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);svgEl('circle',{cx,cy:640,r:90,fill:'none',stroke:C.blue,'stroke-width':6},g);svgEl('circle',{cx,cy:640,r:8,fill:C.blue},g);return g};
  const w1=wheel(700),w2=wheel(1080);
  const frame=svgEl('path',{d:'M700 640 L860 520 L1000 520 L1080 640 M860 520 L820 470 M1000 520 L1020 470',stroke:C.ink,'stroke-width':6,fill:'none','stroke-linecap':'round',style:'opacity:0;visibility:hidden'},svg);
  const bike=[w1,w2,frame];fadeIn(bike,cue(sid,'bicycle'),.5);
  const bg=svgEl('g',{},svg);bike.forEach(b=>bg.appendChild(b));gsap.set(bg,{svgOrigin:'890 730'});
  tl.to(bg,{rotation:-8,duration:.4,yoyo:true,repeat:3,ease:'sine.inOut'},cue(sid,'wobbles'));
  const tags=[['tries',C.dim,'tries'],['falls: −',C.red,'falls'],['stays up: +',C.green,'stays']];
  tags.forEach(([t,c,w],i)=>{const d=txt(S,t,[500,890,1280][i],300,{fs:40,color:c});show(d,cue(sid,w),.4)});
  const cap=el(S,'cap','learning from <em>consequences</em>',{top:'860px',fontSize:'52px',fontStyle:'italic'});show(cap,cue(sid,'consequences'),.5);
  const mdp=txt(S,'Markov decision process',960,960,{fs:36,it:true,color:C.dim});show(mdp,cue(sid,'markov'),.4);
  sceneInOut(sid);
})();

/* ============ S2: the agent-environment loop ============ */
(function(){const S=$('S2');const sid='s2';
  const ag=box(S,480,500,360,150,'agent',C.yellow,{fs:48}),en=box(S,1440,500,420,150,'environment',C.blue,{fs:48});
  show(ag,cue(sid,'agent'),.4);show(en,cue(sid,'environment'),.4);
  const svg=layerSvg(S);

  const rw=txt(S,'reward r<sub>t+1</sub>',960,700,{fs:38,color:C.green});show(rw,cue(sid,'reward'),.4);

  sceneInOut(sid);
})();

/* ============ S3: the discounted return ============ */
(function(){const S=$('S3');const sid='s3';
  const eq=eqn(S,'G_t = r_{t+1} + \\gamma\\, r_{t+2} + \\gamma^2 r_{t+3} + \\dots = \\sum_{k\\ge 0} \\gamma^k\\, r_{t+k+1}',960,220,56);show(eq,cue(sid,'return'),.6);
  const base=820,H=420;const bars=[],bars2=[];
  for(let k=0;k<12;k++){const x=300+k*110;
    const b=el(S,'abs','',{left:(x-35)+'px',top:(base-H)+'px',width:'70px',height:H+'px',background:'#58c4dd55',border:'3px solid #58c4dd',transformOrigin:'50% 100%',opacity:0,visibility:'hidden'});bars.push(b);
    tl.set(b,{scaleY:Math.pow(.95,k)},0);
    const l=txt(S,'+'+k,x,base+36,{fs:26,mono:true,color:C.dim});show(l,cue(sid,'steps'),.3)}
  tl.to(bars,{autoAlpha:1,duration:.3,stagger:.05},cue(sid,'multiplied'));
  const gl=txt(S,'γ = 0.95',1600,380,{fs:44,mono:true,color:C.yellow});show(gl,cue(sid,'below'),.4);
  const tl1=txt(S,'reward ten steps away still counts',1100,350,{fs:32,it:true,color:C.blue});show(tl1,cue(sid,'ten'),.4);
  bars.forEach((b,k)=>tl.to(b,{scaleY:Math.pow(.3,k),duration:1.2,ease:'power2.inOut'},cue(sid,'zero')));
  tl.to(gl,{autoAlpha:0,duration:.3},cue(sid,'zero')-.2);tl.to(tl1,{autoAlpha:0,duration:.3},cue(sid,'zero')-.2);
  const g2=txt(S,'γ = 0.3: short-sighted',1500,380,{fs:44,mono:true,color:C.red});show(g2,cue(sid,'short-sighted'),.4);
  const xl=txt(S,'steps until the reward arrives',960,900,{fs:30,it:true,color:C.dim});show(xl,cue(sid,'steps'),.4);
  const int=txt(S,'like interest: money next year is worth a little less',960,980,{fs:34,it:true,color:C.ink});show(int,cue(sid,'interest'),.4);
  sceneInOut(sid);
})();

/* ============ S4: the Markov property ============ */
(function(){const S=$('S4');const sid='s4';
  const eq=eqn(S,'P(s_{t+1}, r_{t+1} \\mid s_t, a_t, s_{t-1}, a_{t-1}, \\dots) = P(s_{t+1}, r_{t+1} \\mid s_t, a_t)',960,200,44);show(eq,cue(sid,'depend'),.6);
  const board=[];for(let r=0;r<6;r++)for(let c=0;c<6;c++)board.push(el(S,'abs','',{left:(300+c*60)+'px',top:(330+r*60)+'px',width:'60px',height:'60px',background:(r+c)%2?'#2a3340':'#c9d3e0',opacity:0,visibility:'hidden'}));
  fadeIn(board,cue(sid,'chess'),.5);
  const pcs=[['♚',2,1],['♛',4,3],['♔',1,5]].map(([p,c,r])=>txt(S,p,330+c*60,360+r*60,{fs:48,color:(r+c)%2?'#e77fb3':'#0e1116',ov:true}));
  show(pcs,cue(sid,'chess'),.4);
  const ok=txt(S,'Markov ✓: the board is enough',480,740,{fs:34,color:C.green});show(ok,cue(sid,'everything'),.4);
  const fr=el(S,'abs','',{left:'1120px',top:'330px',width:'460px',height:'360px',border:'3px solid #7f8b99',borderRadius:'8px',background:'#141a22',opacity:0,visibility:'hidden'});
  const ball=el(S,'abs','',{left:'1320px',top:'480px',width:'50px',height:'50px',borderRadius:'50%',background:C.yellow,opacity:0,visibility:'hidden'});
  show([fr,ball],cue(sid,'frame'),.4);
  const q=txt(S,'?',1460,420,{fs:72,color:C.red});show(q,cue(sid,'hides'),.4);
  const no=txt(S,'not Markov ✗: which way is it moving?',1350,740,{fs:34,color:C.red});show(no,cue(sid,'moving'),.4);
  const tup=eqn(S,'\\text{MDP} = (\\,\\mathcal{S},\\; \\mathcal{A},\\; P(s\'\\mid s,a),\\; R,\\; \\gamma\\,)',960,900,54);show(tup,cue(sid,'formally'),.6);
  sceneInOut(sid);
})();

/* ============ S5: policy, value, Bellman ============ */
(function(){const S=$('S5');const sid='s5';
  const p=eqn(S,'\\pi(a\\mid s)',360,260,64,{color:C.yellow});show(p,cue(sid,'policy'),.5);
  const pl=txt(S,'policy: probability of each action in each state',360,350,{fs:30,it:true,color:C.dim});show(pl,cue(sid,'probability'),.4);
  const v=eqn(S,'V^\\pi(s) = \\mathbb{E}_\\pi[\\,G_t \\mid s_t = s\\,]',1360,260,58);show(v,cue(sid,'value'),.5);
  const vl=txt(S,'value: average return from s',1360,350,{fs:30,it:true,color:C.dim});show(vl,cue(sid,'function'),.4);
  const b=eqn(S,'V^\\pi(s) = \\sum_a \\pi(a\\mid s) \\sum_{s\'} P(s\'\\mid s,a)\\,\\big[\\, r + \\gamma\\, V^\\pi(s\') \\,\\big]',960,560,56);show(b,cue(sid,'bellman'),.6);
  const r1=txt(S,'immediate reward',1200,680,{fs:32,it:true,color:C.green}),r2=txt(S,'γ × value of where you land',1560,680,{fs:32,it:true,color:C.blue});
  show(r1,cue(sid,'immediate'),.4);show(r2,cue(sid,'land'),.4);
  const sw=box(S,960,860,760,100,'repeated sweeps, not every possible future',C.pink,{fs:36});show(sw,cue(sid,'sweeps'),.5);
  sceneInOut(sid);
})();

/* ============ S6: value iteration on a grid ============ */
(function(){const S=$('S6');const sid='s6';
  const W=4,Hh=3,cs=170,x0=705,y0=360,g=0.9;const goal=[3,0],pit=[3,1],wall=[1,1];
  const isT=(c,r)=>(c===goal[0]&&r===goal[1])||(c===pit[0]&&r===pit[1]);const isW=(c,r)=>c===wall[0]&&r===wall[1];
  // precompute sweeps (deterministic moves, reward on entering a terminal)
  const R=(c,r)=>c===goal[0]&&r===goal[1]?1:(c===pit[0]&&r===pit[1]?-1:0);
  const sweeps=[];let V=Array.from({length:Hh},()=>Array(W).fill(0));sweeps.push(V.map(r=>r.slice()));
  const moves=[[1,0],[-1,0],[0,1],[0,-1]];
  const nb=(c,r,[dc,dr])=>{const c2=c+dc,r2=r+dr;if(c2<0||c2>=W||r2<0||r2>=Hh||isW(c2,r2))return [c,r];return [c2,r2]};
  for(let k=0;k<10;k++){const N=V.map(r=>r.slice());for(let r=0;r<Hh;r++)for(let c=0;c<W;c++){if(isT(c,r)||isW(c,r))continue;
      N[r][c]=Math.max(...moves.map(m=>{const [c2,r2]=nb(c,r,m);return R(c2,r2)+g*(isT(c2,r2)?0:V[r2][c2])}))}V=N;sweeps.push(V.map(r=>r.slice()))}
  const cells=[],vals=[];
  for(let r=0;r<Hh;r++)for(let c=0;c<W;c++){const x=x0+c*cs,y=y0+r*cs;
    let html='',col=C.grid;if(isW(c,r)){html='wall';col=C.dim}else if(c===goal[0]&&r===goal[1]){html='+1';col=C.green}else if(c===pit[0]&&r===pit[1]){html='−1';col=C.red}
    const d=cellAt(S,x,y,cs-12,cs-12,html,col,{fs:40,ink:col,bg:isW(c,r)?'#2a2f38':'#141a22'});cells.push(d);
    if(!isT(c,r)&&!isW(c,r)){const t=txt(S,'0.00',x,y,{fs:36,mono:true,color:C.ink,ov:true});vals.push({t,r,c})}}
  show(cells,cue(sid,'grid'),.4,{stagger:.03});
  show(vals.map(v=>v.t),cue(sid,'zero'),.4);
  const kl=txt(S,'sweep 0',960,200,{fs:40,mono:true,color:C.yellow});show(kl,cue(sid,'apply'),.4);
  const o={k:0};const T0=cue(sid,'apply'),T1=cue(sid,'stop');
  const render=()=>{const k=Math.min(10,Math.floor(o.k));kl.innerHTML='sweep '+k;vals.forEach(v=>{const x=sweeps[k][v.r][v.c];v.t.innerHTML=x.toFixed(2);v.t.style.color=x>0.01?C.green:(x<-0.01?C.red:C.ink)})};
  tl.to(o,{k:10.99,duration:T1-T0,ease:'none',immediateRender:false,onUpdate:render},T0);
  const ar={'1,0':'→','0,1':'↓','-1,0':'←','0,-1':'↑'};const arrows=[];
  for(let r=0;r<Hh;r++)for(let c=0;c<W;c++){if(isT(c,r)||isW(c,r))continue;let best=null,bv=-9;
    moves.forEach(m=>{const [c2,r2]=nb(c,r,m);const q=R(c2,r2)+g*(isT(c2,r2)?0:V[r2][c2]);if(q>bv+1e-9){bv=q;best=m}});
    arrows.push(txt(S,ar[best.join(',')],x0+c*cs+52,y0+r*cs-48,{fs:44,color:C.yellow,ov:true}))}
  show(arrows,cue(sid,'arrows'),.4,{stagger:.05});
  const sh=txt(S,'value shrinks by γ = 0.9 per step from the goal',960,880,{fs:34,it:true,color:C.dim});show(sh,cue(sid,'shrinking'),.4);
  sceneInOut(sid);
})();

/* ============ S7: RLHF as an MDP; next ============ */
(function(){const S=$('S7');const sid='s7';
  const rows=[['state','prompt + text so far',C.blue,'state'],['action','the next token',C.yellow,'action'],['reward','from the reward model, at the end',C.green,'reward']];
  rows.forEach(([a,b,c,w],i)=>{const y=330+i*130;const k=box(S,520,y,260,90,a,c,{fs:38});const d=txt(S,b,700,y,{fs:40});d.style.translate='0 -50%';show([k,d],cue(sid,w),.4)});
  const rl=txt(S,'RLHF, seen as a Markov decision process',960,200,{fs:38,it:true,color:C.dim});show(rl,cue(sid,'rlhf'),.4);
  nextUp(S,sid,'q-learning',1,'12.2 &nbsp;Q-learning');
  tl.to(S,{opacity:1,duration:.5,ease:'none'},START[sid]);
})();
