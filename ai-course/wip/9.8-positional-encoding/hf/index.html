  const box=el(parent,'mat'+(o.hidden===false?'':' hid'),'',{left:(cx-W/2)+'px',top:(cy-H/2)+'px',width:W+'px',height:H+'px'});
  const cells=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<K;c++){
    const v=o.vals?o.vals[r][c]:'';const bg=o.heat?heat(o.vals?o.heat[r][c]*(o.hk||.4):o.heat[r][c],o.color):(o.fill||hexA(o.color||C.blue,.12));
    row.push(el(box,'mc',v,{left:c*cw+'px',top:r*ch+'px',width:cw+'px',height:ch+'px',lineHeight:ch+'px',fontSize:(o.fs||Math.round(Math.min(cw,ch)*.4))+'px',background:bg,borderColor:o.line||'rgba(201,211,224,0.28)'}))}cells.push(row)}
  return {box,cells,cx,cy,W,H,cw,ch,x0:cx-W/2,y0:cy-H/2,R,K}}
/* highlight box around a block of matrix cells */
function matHL(parent,m,r0,c0,r1,c1,color){return el(parent,'hl','',{left:(m.x0+c0*m.cw-5)+'px',top:(m.y0+r0*m.ch-5)+'px',width:((c1-c0+1)*m.cw+10)+'px',height:((r1-r0+1)*m.ch+10)+'px',borderColor:color,boxShadow:`0 0 20px ${color}66`})}
/* quadratic curve with optional arrow head, drawn on with a dash offset */
function curve(svg,x0,y0,x1,y1,o){o=o||{};const b=o.bend==null?-60:o.bend,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1;
  const qx=(x0+x1)/2-dy/L*b,qy=(y0+y1)/2+dx/L*b;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  const p=svgEl('path',{d:`M${x0},${y0} Q${qx},${qy} ${x1},${y1}`,fill:'none',stroke:o.color||C.blue,'stroke-width':o.w||4,'stroke-linecap':'round','stroke-opacity':o.op==null?1:o.op},g);
  const len=Math.max(1,p.getTotalLength());p.setAttribute('stroke-dasharray',len);p.setAttribute('stroke-dashoffset',len);
  let head=null;if(o.head!==false){const tx=x1-qx,ty=y1-qy,tL=Math.hypot(tx,ty)||1,ux=tx/tL,uy=ty/tL,hl=o.hl||18,hw=hl*.55,bx=x1-ux*hl,by=y1-uy*hl;
    head=svgEl('polygon',{points:`${x1},${y1} ${bx-uy*hw},${by+ux*hw} ${bx+uy*hw},${by-ux*hw}`,fill:o.color||C.blue,'fill-opacity':o.op==null?1:o.op,opacity:0},g)}
  return {g,p,len,head}}
function drawCurve(c,time,d){tl.to(c.g,{autoAlpha:1,duration:.15},time);tl.to(c.p,{attr:{'stroke-dashoffset':0},duration:d||.8,ease:'power2.out'},time);if(c.head)tl.to(c.head,{opacity:1,duration:.2},time+(d||.8)*.8)}
/* vertical bars (values 0..1) with a baseline at yBase; setBars tweens to new values */
function bars(parent,x0,yBase,vals,o){o=o||{};const bw=o.bw||60,gap=o.gap||22,Hm=o.h||300;
  const B={bw,gap,Hm,v:vals.slice(),items:[]};
  vals.forEach((v,i)=>{const x=o.xs?o.xs[i]-bw/2:x0+i*(bw+gap);
    const b=el(parent,'bar hid','',{left:x+'px',top:(yBase-Hm)+'px',width:bw+'px',height:Hm+'px',background:(o.colors?o.colors[i]:o.color)||C.blue,transformOrigin:'50% 100%'});
    gsap.set(b,{scaleY:Math.max(.002,v)});
    let t=null;if(o.values!==false){t=el(parent,'lbl mono',fmt(v,2),{color:C.ink,fontSize:(o.vfs||24)+'px'});place(t,x+bw/2,yBase-18);gsap.set(t,{y:-Hm*v})}
    let lb=null;if(o.labels){lb=el(parent,'lbl mono',o.labels[i],{color:o.lcol||C.ink,fontSize:(o.lfs||30)+'px'});place(lb,x+bw/2,yBase+30)}
    B.items.push({b,t,lb})});
  return B}
/* centres for a row of token boxes of varying width, centred on cx */
function rowX(words,fs,gap,cx){const w=words.map(s=>s.length*fs*.6+36);const tot=w.reduce((a,b)=>a+b,0)+gap*(words.length-1);let x=(cx||960)-tot/2;return w.map(v=>{const c=x+v/2;x+=v+gap;return c})}
function barEls(B){const a=[];B.items.forEach(it=>{a.push(it.b);if(it.t)a.push(it.t);if(it.lb)a.push(it.lb)});return a}
function setBars(B,time,d,vals){const from=B.v.slice(),p={k:0};
  tl.to(p,{k:1,duration:d,ease:'power2.inOut',immediateRender:false,onUpdate:()=>{B.items.forEach((it,i)=>{const v=from[i]+(vals[i]-from[i])*p.k;
    gsap.set(it.b,{scaleY:Math.max(.002,v)});if(it.t){gsap.set(it.t,{y:-B.Hm*v});it.t.textContent=fmt(v,2)}})}},time);B.v=vals.slice()}
function softmaxJS(xs,T){T=T||1;const m=Math.max(...xs);const e=xs.map(x=>Math.exp((x-m)/T));const s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
/* type out the characters of an element's text, one span per character */
function typeIn(d,time,per){const s=d.textContent;d.innerHTML=s.split('').map(ch=>`<span class="ch" style="opacity:0;visibility:hidden">${ch===' '?'&nbsp;':ch}</span>`).join('');
  tl.to(d.querySelectorAll('.ch'),{autoAlpha:1,duration:.04,stagger:per||.05,ease:'none'},time)}
function nextCap(S,html,time){const n=el(S,'cap',html,{top:'960px',fontSize:'38px',color:C.dim,fontStyle:'italic'});show(n,time,.7);return n}

const rnd=seedRand(88);const rrow=(n)=>[...Array(n)].map(()=>rnd());

/* ============ S1: attention cannot see order ============ */
(function(){const S=$('S1');const sid='s1';
  const words=['dog','bites','man'],xa=[640,960,1280],perm=[2,1,0];
  const out=words.map(()=>rrow(4));
  const items=words.map((w,i)=>{const t=tok(S,w,xa[i],330,{fs:48,color:C.ink,border:'#3a4452'});const m=matrix(S,xa[i],440,1,4,{cw:40,ch:40,heat:[out[i]],color:[C.blue,C.yellow,C.green][i]});return [t,m.box]});
  show(items.flat(),at(sid,.01),.4,{stagger:.05});
  const ol=label(S,'attention outputs',360,440,{fs:30,italic:true,color:C.dim});show(ol,cue(sid,'output'),.4);
  // a shuffled copy below
  const copy=words.map((w,i)=>{const t=tok(S,w,xa[i],330,{fs:48,color:C.ink,border:'#3a4452'});const m=matrix(S,xa[i],440,1,4,{cw:40,ch:40,heat:[out[i]],color:[C.blue,C.yellow,C.green][i]});
    t.setAttribute('data-layout-allow-overlap','');m.box.setAttribute('data-layout-allow-overlap','');return [t,m.box]});
  copy.forEach(([t,b],i)=>{const j=perm.indexOf(i);tl.to([t,b],{autoAlpha:1,duration:.2},cue(sid,'shuffle'));tl.to([t,b],{x:xa[j]-xa[i],y:330,duration:1.4,ease:'power2.inOut'},cue(sid,'shuffle')+.1)});
  const sm=label(S,'same vectors, only shuffled',960,920,{fs:36,italic:true,color:C.ink});show(sm,cue(sid,'shuffled'),.4);
  const a1=label(S,'dog bites man',1600,330,{fs:30,italic:true,color:C.dim}),a2=label(S,'man bites dog',1600,660,{fs:30,italic:true,color:C.dim});
  show(a1,cue(sid,'dog'),.4);show(a2,cue(sid,'man',2),.4);
  const bag=el(S,'cap','attention sees a <em>bag</em> of words, not a sequence',{top:'830px',fontSize:'44px',fontStyle:'italic'});
  tl.to(sm,{autoAlpha:0,duration:.3},cue(sid,'bag')-.3);show(bag,cue(sid,'bag'),.5);
  sceneInOut(sid);
})();

/* ============ S2: add a position vector to each embedding ============ */
(function(){const S=$('S2');const sid='s2';
  const W=['the','cat','sat','down'],ys=[270,420,570,720];
  const cE=C.blue,cP=C.yellow,cS=C.pink;
  const rows=W.map((w,i)=>{const t=tok(S,w,200,ys[i],{fs:38,color:C.ink,border:'#3a4452'});
    const e=matrix(S,520,ys[i],1,6,{cw:44,ch:44,heat:[rrow(6)],color:cE});
    const p=matrix(S,900,ys[i],1,6,{cw:44,ch:44,heat:[rrow(6)],color:cP});
    const s=matrix(S,1420,ys[i],1,6,{cw:44,ch:44,heat:[rrow(6)],color:cS});
    const pl=label(S,'p'+i,1080,ys[i],{fs:30,mono:true,color:cP});
    return {t,e:e.box,p:p.box,s:s.box,pl}});
  show(rows.flatMap(r=>[r.t,r.e]),at(sid,.02),.4,{stagger:.04});
  const el1=label(S,'token embedding',520,170,{fs:30,italic:true,color:cE});show(el1,at(sid,.02),.4);
  const pl1=label(S,'position vector',900,170,{fs:30,italic:true,color:cP});show(pl1,cue(sid,'position',2),.4);
  show(rows.flatMap(r=>[r.p,r.pl]),cue(sid,'position',2),.4,{stagger:.1});
  const plus=rows.map((r,i)=>sym(S,'+',710,ys[i],48)),eq=rows.map((r,i)=>sym(S,'=',1190,ys[i],48));
  show(plus,cue(sid,'add'),.4);show(eq,cue(sid,'add')+.4,.4);
  show(rows.map(r=>r.s),cue(sid,'embedding')+.3,.5,{stagger:.1});
  const sl=label(S,'input to the first layer',1420,170,{fs:30,italic:true,color:cS});show(sl,cue(sid,'layer'),.4);
  const badge=tok(S,'<span style="color:#58c4dd">cat</span> &nbsp;·&nbsp; <span style="color:#f5cf4a">seat 1</span>',960,880,{fs:40,color:C.ink,border:C.ink});
  show(badge,cue(sid,'badge'),.5);
  const wd=label(S,'adding keeps the width the same',1500,880,{fs:30,italic:true,color:C.dim});show(wd,cue(sid,'adding'),.4);
  sceneInOut(sid);
})();

/* ============ S3: learned position table ============ */
(function(){const S=$('S3');const sid='s3';
  const N=8;const H=[...Array(N)].map(()=>rrow(10));
  const M=matrix(S,860,520,N,10,{cw:46,ch:46,heat:H,color:C.yellow});
  const rl=[...Array(N)].map((_,i)=>label(S,String(i),860-230-40,520-184+23+i*46,{fs:26,mono:true,color:C.dim}));
  show([M.box,...rl],cue(sid,'table'),.6);
  const tl1=label(S,'learned position table: one row per position',860,240,{fs:34,italic:true,color:C.yellow});show(tl1,cue(sid,'learn'),.5);
  const dots=label(S,'⋮',860,780,{fs:48,color:C.dim});show(dots,cue(sid,'longest'),.4);
  const ctx=label(S,'up to the longest context',860,840,{fs:30,italic:true,color:C.dim});show(ctx,cue(sid,'context'),.4);
  const g2=tok(S,'GPT-2 learns its positions this way',1460,360,{fs:32,color:C.ink,border:C.blue});g2.style.fontFamily='Newsreader,serif';show(g2,cue(sid,'gpt'),.5);
  const q=tok(S,'position beyond the last row: ?',1460,560,{fs:32,color:C.red,border:C.red});q.style.fontFamily='Newsreader,serif';show(q,cue(sid,'beyond'),.5);

/* ============ S4: sinusoidal waves and the clock ============ */
(function(){const S=$('S4');const sid='s4';
  const f=el(S,'abs hid',tex('PE_{t,2i}=\\sin\\!\\Big(\\dfrac{t}{10000^{2i/d}}\\Big),\\quad PE_{t,2i+1}=\\cos\\!\\Big(\\dfrac{t}{10000^{2i/d}}\\Big)',40),{left:'200px',top:'140px'});show(f,cue(sid,'sine'),.6);
  const svg=layerSvg(S);const x0=160,sx=17,Tm=48,om=[1,.45,.2,.08],ys=[360,500,640,780],amp=48,cols=[C.pink,C.yellow,C.teal,C.blue];
  const waves=om.map((w,k)=>{let d='';for(let i=0;i<=240;i++){const t=Tm*i/240;d+=(i?'L':'M')+(x0+t*sx).toFixed(1)+','+(ys[k]-amp*Math.sin(w*t)).toFixed(1)}
    svgEl('line',{x1:x0,y1:ys[k],x2:x0+Tm*sx,y2:ys[k],stroke:C.grid,'stroke-width':1.5},svg);
    return svgEl('path',{d,fill:'none',stroke:cols[k],'stroke-width':4,style:'opacity:0;visibility:hidden'},svg)});
  waves.forEach((w,k)=>fadeIn(w,cue(sid,'frequency')+k*.25,.5));
  const fl=label(S,'fast',x0-60,ys[0],{fs:28,italic:true,color:cols[0]}),sl=label(S,'slow',x0-60,ys[3],{fs:28,italic:true,color:cols[3]});
  show(fl,cue(sid,'fast'),.4);show(sl,cue(sid,'slow'),.4);
  const xl=label(S,'position t →',x0+Tm*sx/2,870,{fs:28,italic:true,color:C.dim});show(xl,cue(sid,'frequency'),.4);
  // a cursor reading every wave at one position
  const cur=svgEl('line',{x1:0,y1:300,x2:0,y2:840,stroke:C.ink,'stroke-width':2,'stroke-dasharray':'6 6',style:'opacity:0;visibility:hidden'},svg);
  const dots=om.map((w,k)=>svgEl('circle',{cx:0,cy:ys[k],r:9,fill:cols[k],style:'opacity:0;visibility:hidden'},svg));
  const p={t:4};const place=()=>{const X=x0+p.t*sx;cur.setAttribute('x1',X);cur.setAttribute('x2',X);dots.forEach((d,k)=>{d.setAttribute('cx',X);d.setAttribute('cy',ys[k]-amp*Math.sin(om[k]*p.t))})};place();
  fadeIn([cur,...dots],cue(sid,'together'),.4);
  tl.to(p,{t:40,duration:8,ease:'none',immediateRender:false,onUpdate:place},cue(sid,'together'));
  // clock
  const cx=1520,cy=560,R=170;const g=svgEl('g',{style:'opacity:0;visibility:hidden'},svg);
  svgEl('circle',{cx,cy,r:R,fill:'#141a22',stroke:C.ink,'stroke-width':4},g);
  for(let i=0;i<12;i++){const a=i*Math.PI/6;svgEl('line',{x1:cx+(R-18)*Math.sin(a),y1:cy-(R-18)*Math.cos(a),x2:cx+(R-4)*Math.sin(a),y2:cy-(R-4)*Math.cos(a),stroke:C.dim,'stroke-width':3},g)}
  const hs=svgEl('line',{x1:cx,y1:cy,x2:cx,y2:cy-R+30,stroke:C.pink,'stroke-width':4,'stroke-linecap':'round'},g);
  const hh=svgEl('line',{x1:cx,y1:cy,x2:cx,y2:cy-R+80,stroke:C.blue,'stroke-width':9,'stroke-linecap':'round'},g);
  fadeIn(g,cue(sid,'clock'),.5);
  const c={a:0};tl.to(c,{a:1,duration:9,ease:'none',immediateRender:false,onUpdate:()=>{const A=c.a*6*Math.PI,B=c.a*.5*Math.PI;
    hs.setAttribute('x2',cx+(R-30)*Math.sin(A));hs.setAttribute('y2',cy-(R-30)*Math.cos(A));hh.setAttribute('x2',cx+(R-80)*Math.sin(B));hh.setAttribute('y2',cy-(R-80)*Math.cos(B))}},cue(sid,'second'));
  const l1=label(S,'second hand: fast',1520,800,{fs:28,italic:true,color:C.pink}),l2=label(S,'hour hand: slow',1520,845,{fs:28,italic:true,color:C.blue});
  show(l1,cue(sid,'quickly'),.4);show(l2,cue(sid,'slowly'),.4);
  const u=label(S,'together: a unique reading for every moment',1520,330,{fs:28,italic:true,color:C.ink});show(u,cue(sid,'unique'),.4);
  sceneInOut(sid);
})();

/* ============ S5: a fixed offset is a fixed rotation ============ */
(function(){const S=$('S5');const sid='s5';
  const cx=640,cy=560,R=260,w=.35;const svg=layerSvg(S);
  svgEl('circle',{cx,cy,r:R,fill:'none',stroke:C.grid,'stroke-width':3},svg);
  svgEl('line',{x1:cx-R-30,y1:cy,x2:cx+R+30,y2:cy,stroke:C.grid,'stroke-width':1.5},svg);svgEl('line',{x1:cx,y1:cy-R-30,x2:cx,y2:cy+R+30,stroke:C.grid,'stroke-width':1.5},svg);
  const P=(t)=>[cx+R*Math.cos(w*t),cy-R*Math.sin(w*t)];
  const ax=label(S,'(cos, sin) of one frequency',cx,cy+R+70,{fs:28,italic:true,color:C.dim});show(ax,at(sid,.02),.4);
  const pair=[[1,C.yellow,'forward'],[9,C.teal,'whatever']];
  pair.forEach(([t0,col,w0],k)=>{const a=P(t0),b=P(t0+3);
    const d1=svgEl('circle',{cx:a[0],cy:a[1],r:12,fill:col,style:'opacity:0;visibility:hidden'},svg);
    const d2=svgEl('circle',{cx:b[0],cy:b[1],r:12,fill:'none',stroke:col,'stroke-width':4,style:'opacity:0;visibility:hidden'},svg);
    const arc=svgEl('path',{d:`M${a[0]},${a[1]} A${R},${R} 0 0 0 ${b[0]},${b[1]}`,fill:'none',stroke:col,'stroke-width':8,'stroke-opacity':.7,style:'opacity:0;visibility:hidden'},svg);
    const l1=label(S,'t = '+t0,a[0]+(a[0]>cx?70:-70),a[1]+(a[1]>cy?30:-20),{fs:28,mono:true,color:col}),l2=label(S,'t + 3',b[0]+(b[0]>cx?70:-70),b[1]+(b[1]>cy?30:-20),{fs:28,mono:true,color:col});
    const t=cue(sid,w0)+(k?0:.2);fadeIn([d1],t,.3);show(l1,t,.3);fadeIn([arc,d2],t+.6,.5);show(l2,t+.8,.3)});
  const n1=note(S,'moving 3 positions forward turns the pair by the same angle, from any starting point',1080,320,700,{fs:38});show(n1,cue(sid,'angle'),.5);
  const n2=note(S,'so “three tokens back” looks the same everywhere, and relative positions are easy to learn',1080,520,700,{fs:38,color:C.teal});show(n2,cue(sid,'offset'),.5);
  const rope=tok(S,'rotary position embeddings (RoPE): rotate q and k by a position-dependent angle',1310,800,{fs:28,color:C.yellow,border:C.yellow});rope.style.fontFamily='Newsreader,serif';rope.style.whiteSpace='normal';rope.style.width='640px';rope.style.textAlign='center';
  show(rope,cue(sid,'rotary'),.5);
  sceneInOut(sid);
})();

/* ============ S6: in our GPT ============ */
(function(){const S=$('S6');const sid='s6';
  const f=el(S,'abs hid',tex('x_t=E[\\text{token}_t]+P[t]',64),{left:'600px',top:'170px'});show(f,cue(sid,'embedding'),.6);
  const ch=['h','e','l','l','o'];const xs=ch.map((c,i)=>560+i*200);
  const ts=ch.map((c,i)=>tok(S,c,xs[i],420,{fs:48,color:c==='l'?C.yellow:C.ink,border:c==='l'?C.yellow:'#3a4452'}));show(ts,cue(sid,'gpt'),.4,{stagger:.06});
  const base=rrow(5);const lrow=rrow(5);
  const vecs=ch.map((c,i)=>{const v=c==='l'?lrow:rrow(5);return matrix(S,xs[i],540,1,5,{cw:30,ch:30,heat:[v],color:C.blue})});
  show(vecs.map(v=>v.box),cue(sid,'embedding'),.4);
  const same=label(S,'the two l’s: identical embeddings',960,620,{fs:30,italic:true,color:C.dim});show(same,cue(sid,'embedding')+.4,.4);
  const sums=ch.map((c,i)=>matrix(S,xs[i],700,1,5,{cw:30,ch:30,heat:[rrow(5)],color:C.pink}));
  tl.to(same,{autoAlpha:0,duration:.3},cue(sid,'plus'));
  show(sums.map(v=>v.box),cue(sid,'position'),.5,{stagger:.1});
  const diff=label(S,'+ position: now they differ',960,780,{fs:30,italic:true,color:C.pink});show(diff,cue(sid,'sits'),.4);
  const ww=el(S,'cap','every vector carries <em>what</em> the token is and <em>where</em> it is',{top:'850px',fontSize:'42px',fontStyle:'italic'});show(ww,cue(sid,'carries'),.5);
  nextCap(S,'next &nbsp;·&nbsp; 9.9 &nbsp;The transformer block',cue(sid,'next'));
  lastScene(sid);
})();
